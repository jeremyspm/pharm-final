["po","bd","lt","hr","sbp","holdparam"],"tip":"Take the heart rate and blood pressure before you give it — the hold parameter only works if you look."},{"id":"o-enox","sec":"reg","med":"Enoxaparin","dose":"40 mg","route":"SC","freq":"daily","ind":"VTE prophylaxis","read":"Give 40 milligrams of enoxaparin under the skin once a day, to prevent blood clots.","bad":[["Give 40 milligrams of enoxaparin under the tongue once a day, to prevent blood clots.","SC is subcutaneous — under the skin. Under the tongue is SL: the exact misreading that makes “subcut” the safer way to write it."],["Give 40 milligrams of enoxaparin into a muscle once a day, to prevent blood clots.","SC is under the skin, not into a muscle (IM)."],["Give 40 milligrams of enoxaparin under the skin twice a day, to prevent blood clots.","“daily” means once a day."]],"tk":["sc","vte","pfs"]},{"id":"o-para-reg","sec":"reg","med":"Paracetamol","dose":"1 g","route":"PO","freq":"QID","max":"4 g/24 h","read":"Give 1 gram of paracetamol by mouth four times a day — never more than 4 grams in 24 hours.","bad":[["Give 1 gram of paracetamol by mouth every 4 hours — never more than 4 grams in 24 hours.","QID is four times a day. Every 4 hours (q4h) would be up to 6 doses — 6 g, over the maximum."],["Give 1 milligram of paracetamol by mouth four times a day — never more than 4 milligrams in 24 hours.","g is grams: 1 g = 1000 mg."],["Give 1 gram of paracetamol rectally four times a day — never more than 4 grams in 24 hours.","PO is by mouth; rectally is PR."]],"tk":["po","qid","g","max24"]},{"id":"o-omep","sec":"reg","med":"Omeprazole","dose":"20 mg","route":"PO","freq":"mane","ind":"GORD","read":"Give 20 milligrams of omeprazole by mouth every morning, for reflux.","bad":[["Give 20 milligrams of omeprazole by mouth every night, for reflux.","mane is the morning; night is nocte."],["Give 20 milligrams of omeprazole by mouth at midday, for reflux.","mane is the morning; midday is midi."],["Give 20 milligrams of omeprazole by mouth every morning, for heart failure.","GORD is gastro-oesophageal reflux disease; heart failure is CHF."]],"tk":["po","mane","gord"]},{"id":"o-ator","sec":"reg","med":"Atorvastatin","dose":"40 mg","route":"PO","freq":"nocte","read":"Give 40 milligrams of atorvastatin by mouth every night.","bad":[["Give 40 milligrams of atorvastatin by mouth every morning.","nocte is at night; the morning is mane."],["Give 40 milligrams of atorvastatin by mouth at night, if needed.","Nothing here says PRN — it is a regular dose, every night."],["Give 40 milligrams of atorvastatin by mouth every second night.","nocte means every night, not alternate nights."]],"tk":["po","nocte"]},{"id":"o-amox","sec":"reg","med":"Amoxicillin","dose":"500 mg","route":"PO","freq":"TDS × 5/7","ind":"UTI","read":"Give 500 milligrams of amoxicillin by mouth three times a day for 5 days, for a urinary tract infection.","bad":[["Give 500 milligrams of amoxicillin by mouth twice a day for 5 days, for a urinary tract infection.","TDS is three times a day; twice is BD."],["Give 500 milligrams of amoxicillin by mouth three times a day for 5 weeks, for a urinary tract infection.","/7 counts days. Weeks would be /52."],["Give 500 milligrams of amoxicillin by mouth three times a day until 5 doses are in, for a urinary tract infection.","5/7 is five DAYS, not five doses — 15 doses in all."]],"tk":["po","tds","d7","uti"]},{"id":"o-cefaz","sec":"reg","med":"Cefazolin","dose":"2 g","route":"IV","freq":"q8h","read":"Give 2 grams of cefazolin into a vein every 8 hours.","bad":[["Give 2 grams of cefazolin into a vein 8 times a day.","q means “every”: q8h is every 8 hours — 3 doses a day, not 8."],["Give 2 grams of cefazolin into a muscle every 8 hours.","IV is into a vein; into a muscle is IM."],["Give 2 milligrams of cefazolin into a vein every 8 hours.","g is grams, a thousand times more than mg."]],"tk":["iv","q8h","g","timecrit"],"tip":"By the clock — e.g. 0600, 1400 and 2200 — to keep the level steady. IV antibiotics are on most time-critical lists."},{"id":"o-metf","sec":"reg","med":"Metformin","dose":"500 mg","route":"PO","freq":"BD pc","ind":"T2DM","read":"Give 500 milligrams of metformin by mouth twice a day after meals, for type 2 diabetes.","bad":[["Give 500 milligrams of metformin by mouth twice a day before meals, for type 2 diabetes.","pc is after food; before is ac."],["Give 500 milligrams of metformin by mouth three times a day after meals, for type 2 diabetes.","BD is twice a day."],["Give 500 milligrams of metformin by mouth twice a day after meals, for type 1 diabetes.","T2DM is type 2 diabetes."]],"tk":["po","bd","pc","t2dm"]},{"id":"o-levo","sec":"reg","med":"Levothyroxine","dose":"100 mcg","route":"PO","freq":"mane ac","read":"Give 100 micrograms of levothyroxine by mouth every morning before breakfast.","bad":[["Give 100 milligrams of levothyroxine by mouth every morning before breakfast.","mcg is micrograms — reading it as mg is a thousand-fold overdose."],["Give 100 micrograms of levothyroxine by mouth every morning after breakfast.","ac is before food; after is pc."],["Give 100 micrograms of levothyroxine by mouth every night before supper.","mane is the morning."]],"tk":["mcg","po","mane","ac"]},{"id":"o-furo","sec":"reg","med":"Furosemide","dose":"40 mg","route":"PO","freq":"mane","note":"Check K⁺ and daily Wt","read":"Give 40 milligrams of furosemide by mouth every morning, and watch the potassium result and the daily weight.","bad":[["Give 40 milligrams of furosemide by mouth every night, and watch the potassium result and the daily weight.","mane is the morning — a diuretic in the morning, so the patient is not up all night."],["Give 40 milligrams of furosemide into a vein every morning, and watch the potassium result and the daily weight.","PO is by mouth."],["Give 40 milligrams of furosemide by mouth every morning, and watch the pulse and the temperature.","K⁺ is potassium; Wt is weight."]],"tk":["po","mane","k","wt"]},{"id":"o-glarg","sec":"reg","med":"Insulin glargine","dose":"20 units","route":"SC","freq":"nocte","read":"Give 20 units of insulin glargine under the skin every night.","bad":[["Give 20 units of insulin glargine into a vein every night.","SC is under the skin — IV insulin is a different, specialist order."],["Give 20 millilitres of insulin glargine under the skin every night.","Insulin is dosed in units, not millilitres."],["Give 20 units of insulin glargine under the skin every morning.","nocte is at night."]],"tk":["units","sc","nocte","pI"]},{"id":"o-aspart","sec":"reg","med":"Insulin aspart","dose":"6 units","route":"SC","freq":"TDS ac","read":"Give 6 units of insulin aspart under the skin three times a day, before each meal.","bad":[["Give 6 units of insulin aspart under the skin three times a day, after each meal.","ac is before food."],["Give 60 units of insulin aspart under the skin three times a day, before each meal.","The dose is 6 units."],["Give 6 units of insulin aspart under the skin twice a day, before each meal.","TDS is three times a day."]],"tk":["units","sc","tds","ac","timecrit"],"tip":"Mealtime insulin is time-critical: it has to go in before the food does. Check the BGL first."},{"id":"o-asp","sec":"reg","med":"Aspirin","dose":"100 mg","route":"PO","freq":"daily","read":"Give 100 milligrams of aspirin by mouth once a day.","bad":[["Give 100 milligrams of aspirin by mouth every other day.","“daily” is every day."],["Give 100 micrograms of aspirin by mouth once a day.","mg is milligrams."],["Give 100 milligrams of aspirin by mouth once a day, for pain.","Nothing says what it is for — at this dose it is a regular daily medicine, not a painkiller."]],"tk":["po","mg"]},{"id":"o-dig","sec":"reg","med":"Digoxin","dose":"62.5 mcg","route":"PO","freq":"mane","note":"Apical pulse first — withhold if < 60","read":"Give 62.5 micrograms of digoxin by mouth every morning — count the apical pulse first and withhold it if it is under 60.","bad":[["Give 62.5 milligrams of digoxin by mouth every morning — count the apical pulse first and withhold it if it is under 60.","mcg is micrograms — a thousand times less than mg."],["Give 62.5 micrograms of digoxin by mouth every morning — count the apical pulse first and withhold it if it is over 60.","< means less than."],["Give 62.5 micrograms of digoxin by mouth every morning — take the blood pressure first and withhold it if it is under 60.","The note asks for the apical pulse — a full minute with a stethoscope over the heart."]],"tk":["mcg","po","mane","apical","lt"],"src":"Medication Calculations 2026 slides 23–24 (62.5 mcg tablets)"},{"id":"o-symb","sec":"reg","med":"Budesonide/formoterol 200/6","dose":"2 puffs","route":"INH","freq":"BD","read":"Breathe in 2 puffs from an inhaler twice a day.","bad":[["Breathe in 2 puffs from an inhaler every 4 hours.","BD is twice a day."],["Breathe in 2 puffs from a nebuliser twice a day.","INH is from an inhaler; a nebuliser is NEB."],["Breathe in 2 puffs from an inhaler once a day.","BD is twice a day."]],"tk":["inh","bd","mdi","spacer"]},{"id":"o-latan","sec":"reg","med":"Latanoprost 0.005%","dose":"1 drop","route":"both eyes","freq":"nocte","read":"Put 1 drop into both eyes every night.","bad":[["Put 1 drop into both ears every night.","It says eyes."],["Put 1 drop into the right eye every night.","Both eyes. (Written in full on purpose: OD, OS and OU are on the danger list.)"],["Put 1 drop into both eyes every morning.","nocte is at night."]],"tk":["nocte","gtt","OU"]},{"id":"o-pred","sec":"reg","med":"Prednisone","dose":"40 mg","route":"PO","freq":"mane × 5/7","read":"Give 40 milligrams of prednisone by mouth every morning for 5 days.","bad":[["Give 40 milligrams of prednisone by mouth every morning for 5 weeks.","/7 counts days."],["Give 40 milligrams of prednisone by mouth in total, spread over 5 days.","40 mg is each morning’s dose — 200 mg across the course."],["Give 40 milligrams of prednisone by mouth every night for 5 days.","mane is the morning."]],"tk":["po","mane","d7","tallman"],"tip":"Prednisone and prednisolone are different medicines with look-alike names — the reason for Tall Man lettering."},{"id":"o-omepng","sec":"reg","med":"Omeprazole (dispersible)","dose":"20 mg","route":"NG","freq":"daily","read":"Give 20 milligrams of dispersible omeprazole down the nasogastric tube once a day.","bad":[["Give 20 milligrams of dispersible omeprazole as a nasal spray once a day.","NG is a tube through the nose into the stomach — not a nasal spray."],["Give 20 milligrams of dispersible omeprazole by mouth, to swallow, once a day.","NG is down the tube — the patient may not be able to swallow."],["Give 20 milligrams of dispersible omeprazole down the nasogastric tube every second day.","“daily” is every day."]],"tk":["ng","disp"],"tip":"Only liquids, or forms a pharmacist has cleared, go down a tube — flushed before and after."},{"id":"o-fent","sec":"reg","med":"Fentanyl patch","dose":"25 mcg/h","route":"TD","freq":"every 72 h","read":"Apply a patch that releases 25 micrograms of fentanyl an hour, and replace it every 72 hours (3 days).","bad":[["Apply a patch that releases 25 milligrams of fentanyl an hour, and replace it every 72 hours (3 days).","mcg is micrograms."],["Apply a patch that releases 25 micrograms of fentanyl an hour, and replace it every 7 days.","Every 72 hours is every 3 days."],["Apply a patch that releases 25 micrograms of fentanyl a day, and replace it every 72 hours (3 days).","/h is per HOUR."]],"tk":["mcg","td","pN"],"tip":"Record where the patch is and take the old one off — two on at once is an overdose."},{"id":"o-para-prn","sec":"prn","med":"Paracetamol","dose":"1 g","route":"PO/PR","freq":"q4–6h PRN","ind":"pain / fever","max":"4 g/24 h","read":"Only when needed for pain or fever, give 1 gram of paracetamol by mouth or rectally, 4–6 hours apart — no more than 4 grams in 24 hours.","bad":[["Regularly, whatever the symptoms, give 1 gram of paracetamol by mouth or rectally, 4–6 hours apart — no more than 4 grams in 24 hours.","PRN means only when needed."],["Only when needed for pain or fever, give 1 gram of paracetamol by mouth or rectally, 4–6 hours apart — no more than 4 grams a dose.","The 4 g is the most in any 24 HOURS; each dose is 1 g."],["Only when needed for pain or fever, give 1 gram of paracetamol by mouth or vaginally, 4–6 hours apart — no more than 4 grams in 24 hours.","PR is rectally; vaginally is PV."]],"tk":["po","pr","q4h","prn","max24"]},{"id":"o-morph","sec":"prn","med":"Morphine","dose":"2.5–5 mg","route":"SC","freq":"q2h PRN","ind":"pain","read":"Only when needed for pain, give 2.5 to 5 milligrams of morphine under the skin, at least 2 hours apart.","bad":[["Regularly, in pain or not, give 2.5 to 5 milligrams of morphine under the skin, at least 2 hours apart.","PRN — only when needed, after you assess."],["Only when needed for pain, give 25 to 50 milligrams of morphine under the skin, at least 2 hours apart.","The range is 2.5 to 5 mg."],["Only when needed for pain, give 2.5 to 5 milligrams of morphine into a vein, at least 2 hours apart.","SC is under the skin."]],"tk":["sc","q2h","prn","pN","sedscore","rr"],"tip":"A range dose: you pick within 2.5–5 mg from your assessment. Check sedation and breathing before and after."},{"id":"o-oxy","sec":"prn","med":"Oxycodone IR","dose":"5 mg","route":"PO","freq":"q4h PRN","ind":"pain","read":"Only when needed for pain, give 5 milligrams of immediate-release oxycodone by mouth, at least 4 hours apart.","bad":[["Only when needed for pain, give 5 milligrams of slow-release oxycodone by mouth, at least 4 hours apart.","IR is immediate release. Mixing up the IR and SR forms of the same opioid is a real, serious error."],["Only when needed for pain, give 5 milligrams of immediate-release oxycodone by mouth, four times a day.","q4h is every 4 hours — up to 6 doses in 24 hours."],["Regularly, in pain or not, give 5 milligrams of immediate-release oxycodone by mouth, at least 4 hours apart.","PRN — only when needed."]],"tk":["ir","po","q4h","prn","pN"]},{"id":"o-ondan","sec":"prn","med":"Ondansetron","dose":"4 mg","route":"ODT","freq":"q8h PRN","ind":"N/V","read":"Only when needed for nausea or vomiting, let a 4 milligram ondansetron tablet melt on the tongue, at least 8 hours apart.","bad":[["Only when needed for nausea or vomiting, have a 4 milligram ondansetron tablet swallowed whole with water, at least 8 hours apart.","ODT melts on the tongue — no water needed, which is the point when someone is nauseated."],["Regularly, sick or not, let a 4 milligram ondansetron tablet melt on the tongue, at least 8 hours apart.","PRN — only when needed."],["Only when needed for nausea or vomiting, let a 4 milligram ondansetron tablet melt on the tongue, up to 8 times a day.","q8h is every 8 hours."]],"tk":["odt","q8h","prn","nv"]},{"id":"o-salb","sec":"prn","med":"Salbutamol","dose":"2.5–5 mg","route":"NEB","freq":"q4h PRN","ind":"wheeze / SOB","read":"Only when needed for wheeze or breathlessness, nebulise 2.5 to 5 milligrams of salbutamol, at least 4 hours apart.","bad":[["Only when needed for wheeze or breathlessness, give 2.5 to 5 milligrams of salbutamol from a puffer, at least 4 hours apart.","NEB is a nebuliser, not an inhaler."],["Only when needed for wheeze or breathlessness, nebulise 2.5 to 5 milligrams of salbutamol, four times a day.","q4h is every 4 hours."],["Regularly, wheezy or not, nebulise 2.5 to 5 milligrams of salbutamol, at least 4 hours apart.","PRN — only when needed."]],"tk":["neb","q4h","prn","sob","nebule"]},{"id":"o-gtn","sec":"prn","med":"GTN spray","dose":"400 mcg","route":"SL","freq":"PRN — may repeat after 5 min, max 3 doses","ind":"chest pain","read":"For chest pain, spray 400 micrograms of GTN under the tongue — it may be repeated after 5 minutes, up to 3 doses.","bad":[["For chest pain, spray 400 milligrams of GTN under the tongue — it may be repeated after 5 minutes, up to 3 doses.","mcg is micrograms."],["For chest pain, spray 400 micrograms of GTN against the cheek — it may be repeated after 5 minutes, up to 3 doses.","SL is under the tongue; the cheek is buccal."],["For chest pain, spray 400 micrograms of GTN under the tongue — it may be repeated after 5 hours, up to 3 doses.","After 5 MINUTES."]],"tk":["mcg","sl","prn"],"src":"Pharmacology Concepts (2) 2026 slide 31 (GTN spray, the sublingual example)"},{"id":"o-lact","sec":"prn","med":"Lactulose","dose":"20 mL","route":"PO","freq":"BD PRN","ind":"constipation","read":"Only when needed for constipation, give 20 millilitres of lactulose by mouth, up to twice a day.","bad":[["Only when needed for constipation, give 20 milligrams of lactulose by mouth, up to twice a day.","It is a liquid: mL is millilitres."],["Regularly, constipated or not, give 20 millilitres of lactulose by mouth, up to twice a day.","PRN — only when needed."],["Only when needed for constipation, give 20 millilitres of lactulose by mouth, up to three times a day.","BD is twice a day."]],"tk":["ml","po","bd","prn","bo"]},{"id":"o-bisa","sec":"prn","med":"Bisacodyl","dose":"10 mg","route":"PR","freq":"mane PRN","ind":"constipation","read":"Only when needed for constipation, insert a 10 milligram bisacodyl suppository into the rectum in the morning.","bad":[["Only when needed for constipation, insert a 10 milligram bisacodyl suppository into the rectum at night.","mane is the morning."],["Only when needed for constipation, insert a 10 milligram bisacodyl suppository into the vagina in the morning.","PR is rectally; vaginally is PV."],["Every morning, constipated or not, insert a 10 milligram bisacodyl suppository into the rectum.","PRN — only when needed."]],"tk":["pr","mane","prn","supp"]},{"id":"o-hypo","sec":"prn","med":"Glucose gel 40%","dose":"15 g","route":"PO","freq":"PRN","ind":"BGL < 4 mmol/L (hypo protocol)","read":"If the blood glucose is under 4 mmol/L, give 15 grams of glucose gel by mouth, following the hypo protocol.","bad":[["If the blood glucose is over 4 mmol/L, give 15 grams of glucose gel by mouth, following the hypo protocol.","< means LESS than — this treats a LOW glucose."],["If the blood glucose is under 4 mmol/L, give 15 milligrams of glucose gel by mouth, following the hypo protocol.","15 g is grams."],["Whatever the blood glucose, give 15 grams of glucose gel by mouth, following the hypo protocol.","PRN — only when the glucose is low."]],"tk":["bgl","lt","hypo","prn"]},{"id":"o-adr","sec":"once","med":"Adrenaline 1:1000","dose":"0.5 mg (0.5 mL)","route":"IM","freq":"stat","ind":"anaphylaxis","read":"Now, once: inject 0.5 milligrams of adrenaline (0.5 mL of 1:1000) into a muscle, for anaphylaxis.","bad":[["Now, once: inject 0.5 milligrams of adrenaline (0.5 mL of 1:1000) into a vein, for anaphylaxis.","IM is into a muscle — IV adrenaline is a different, specialist dose."],["Now, once: inject 0.5 milligrams of adrenaline (0.5 mL of 1:10 000) into a muscle, for anaphylaxis.","1:1000 is ten times stronger than 1:10 000 — 0.5 mL of 1:10 000 is only 0.05 mg."],["Whenever needed: inject 0.5 milligrams of adrenaline (0.5 mL of 1:1000) into a muscle, for anaphylaxis.","stat is one dose, now."]],"tk":["r1000","im","stat","anaphylaxis"],"src":"ASCIA Action Plan for Anaphylaxis (2026); Medication Calculations 2026 slide 57"},{"id":"o-furoiv","sec":"once","med":"Furosemide","dose":"40 mg","route":"IV","freq":"stat","read":"Now, once: give 40 milligrams of furosemide into a vein.","bad":[["Every morning: give 40 milligrams of furosemide into a vein.","stat is one dose, now."],["Now, once: give 40 milligrams of furosemide into a muscle.","IV is into a vein."],["Now, once: give 4 milligrams of furosemide into a vein.","The dose is 40 mg."]],"tk":["iv","stat"]},{"id":"o-nacl","sec":"fluid","med":"Sodium chloride 0.9%","dose":"1000 mL","route":"IV","freq":"over 8 h (125 mL/h)","read":"Run 1 litre of sodium chloride 0.9% into a vein over 8 hours — 125 mL an hour.","bad":[["Run 1 litre of sodium chloride 0.9% into a vein at 1000 mL an hour, for 8 hours.","1000 mL is the whole bag and 125 mL/h the rate — 1000 mL an hour for 8 hours would be 8 litres."],["Run 1 litre of glucose 5% into a vein over 8 hours — 125 mL an hour.","NaCl 0.9% is sodium chloride — “normal saline”."],["Run 125 mL of sodium chloride 0.9% into a vein over 8 hours, in total.","125 mL is the amount per hour; the order is for the whole 1000 mL."]],"tk":["nacl","iv","mlh","ivi"]},{"id":"o-dex","sec":"fluid","med":"Glucose 5%","dose":"500 mL","route":"IV","freq":"over 6 h — giving set 20 drops/mL","read":"Run 500 mL of glucose 5% over 6 hours at 28 drops a minute: (500 × 20) ÷ (6 × 60) = 27.8, rounded up.","bad":[["Run 500 mL of glucose 5% over 6 hours at 27 drops a minute: (500 × 20) ÷ (6 × 60) = 27.8, rounded down.","Round .5 and above UP: 27.8 → 28."],["Run 500 mL of glucose 5% over 6 hours at 28 mL an hour: (500 × 20) ÷ (6 × 60) = 27.8, rounded up.","This sum gives drops per minute, not mL/h (500 ÷ 6 is about 83 mL/h)."],["Run 500 mL of glucose 5% over 6 hours at 83 drops a minute: 500 ÷ 6 = 83.3, rounded down.","83 is mL per hour. Drops per minute needs the drop factor: (500 × 20) ÷ 360 = 28."]],"tk":["gluc5","gttmin","gttml","redherring"],"src":"Medication Calculations 2026 slides 69 & 72 (worked example 15)","maxRuns":5},{"id":"o-kcl","sec":"fluid","med":"KCl 20 mmol in NaCl 0.9%","dose":"1000 mL","route":"IV","freq":"over 8 h","read":"Run 1 litre of sodium chloride 0.9% with 20 mmol of potassium chloride added, over 8 hours.","bad":[["Run 1 litre of sodium chloride 0.9% with 20 mmol of potassium chloride added, over 8 minutes.","Over 8 HOURS — potassium run fast can stop the heart."],["Run 1 litre of sodium chloride 0.9% with 20 milligrams of potassium chloride added, over 8 hours.","Potassium is dosed in mmol (millimoles)."],["Run 1 litre of glucose 5% with 20 mmol of potassium chloride added, over 8 hours.","The fluid is NaCl 0.9% — sodium chloride."]],"tk":["kcl","mmol","nacl","pP"],"tip":"Concentrated potassium is never pushed — only diluted in the bag and run slowly, exactly as prescribed."},{"id":"o-o2np","sec":"o2","med":"Oxygen","dose":"2 L/min","route":"NP","freq":"continuous","ind":"target SpO₂ 92–96%","read":"Give oxygen through nasal prongs at 2 litres a minute, keeping the saturation between 92 and 96%.","bad":[["Give oxygen through a Hudson mask at 2 litres a minute, keeping the saturation between 92 and 96%.","NP is nasal prongs — and a Hudson mask needs at least 5 L/min."],["Give oxygen through nasal prongs at 2 litres an hour, keeping the saturation between 92 and 96%.","L/min is litres per MINUTE."],["Give oxygen through nasal prongs at 2 litres a minute, keeping the saturation above 96%.","The target range is 92–96%."]],"tk":["np","lmin","spo2","targetsat"]},{"id":"o-o2copd","sec":"o2","med":"Oxygen","dose":"1–2 L/min","route":"NP","freq":"continuous","ind":"COPD — target SpO₂ 88–92%","read":"Give oxygen through nasal prongs at 1 to 2 litres a minute, keeping the saturation between 88 and 92%.","bad":[["Give oxygen through nasal prongs at 1 to 2 litres a minute, keeping the saturation between 92 and 96%.","This order’s target is 88–92% — for some people with COPD, more oxygen is not better."],["Give oxygen through a non-rebreather mask at 1 to 2 litres a minute, keeping the saturation between 88 and 92%.","NP is nasal prongs; a non-rebreather (NRB) runs at 10–15 L/min."],["Give oxygen through nasal prongs at 12 litres a minute, keeping the saturation between 88 and 92%.","The flow is 1 to 2 L/min."]],"tk":["np","lmin","copd","targetsat"]}],"scenes":[{"id":"s-adr","k":"sec","q":"Adrenaline 0.5 mg IM stat — anaphylaxis.","a":"Once-only (stat)","why":"A stat dose is a single dose, now — the once-only section.","src":"Med Admin (1) 2026, slides 54–55"},{"id":"s-phone","k":"sec","q":"The registrar phones the ward: “Give furosemide 40 mg IV now — I’ll sign it when I’m up.”","a":"Verbal orders","why":"A phone order is a verbal order: its own section, and the prescriber signs it within the time your policy sets.","src":"Med Admin (1) 2026, slides 13–14 & 54–55"},{"id":"s-arrest","k":"sec","q":"In a cardiac arrest the doctor calls out “adrenaline 1 mg IV” and you draw it up and give it.","a":"Verbal orders","why":"An order given aloud in an emergency is a verbal order — written up and signed afterwards.","src":"Med Admin (1) 2026, slides 13–14"},{"id":"s-paraprn","k":"sec","q":"Paracetamol 1 g PO q4–6h PRN pain — max 4 g/24 h.","a":"PRN (as required)","why":"Given only when needed, with its reason and its 24-hour maximum.","src":"Med Admin (1) 2026, slides 54–55"},{"id":"s-ator","k":"sec","q":"Atorvastatin 40 mg PO nocte.","a":"Regular medicines","why":"A scheduled dose every night — a regular medicine."},{"id":"s-cefaz","k":"sec","q":"Cefazolin 2 g IV q8h.","a":"Regular medicines","why":"An IV medicine given on a schedule is still a regular medicine; the fluids section is for fluids and infusions."},{"id":"s-nacl","k":"sec","q":"Sodium chloride 0.9% 1000 mL IV over 8 hours.","a":"Fluid & infusion orders","why":"IV fluids are ordered in the fluid & infusion section.","src":"Med Admin (1) 2026, slides 54–55"},{"id":"s-o2","k":"sec","q":"Oxygen via nasal prongs 2 L/min, target SpO₂ 92–96%.","a":"Oxygen & medical gases","why":"Oxygen is a medicine, prescribed in its own section.","src":"Med Admin (1) 2026, slides 54–55"},{"id":"s-entonox","k":"sec","q":"Entonox (nitrous oxide and oxygen), self-administered for dressing changes.","a":"Oxygen & medical gases","why":"A medical gas.","src":"Med Admin (1) 2026, slides 54–55"},{"id":"s-salb","k":"sec","q":"Salbutamol 5 mg NEB q4h PRN wheeze.","a":"PRN (as required)","why":"Salbutamol is a medicine given as a mist, when needed — a PRN order. The oxygen section is for the gas itself."},{"id":"s-ondstat","k":"sec","q":"Ondansetron 4 mg IV stat.","a":"Once-only (stat)","why":"stat = one dose, now."},{"id":"s-dex","k":"sec","q":"Glucose 5% 500 mL IV over 6 hours.","a":"Fluid & infusion orders","why":"An IV fluid."},{"id":"c-xray","k":"code","q":"Mr T’s 0800 metoprolol is due, but he is down in X-ray.","a":"A — Absent","why":"He is off the ward. Follow it up when he is back."},{"id":"c-theatre","k":"code","q":"Mrs K is nil by mouth for theatre, and the anaesthetist has said her 0800 tablets are not to be given.","a":"F — Fasting","why":"Withheld because she is fasting — code F."},{"id":"c-leave","k":"code","q":"Sione has gone home for the weekend on approved leave.","a":"L — On leave","why":"Away from hospital on leave."},{"id":"c-pharm","k":"code","q":"The new antibiotic has not come up from pharmacy yet.","a":"N — Not available","why":"Not available — chase it and tell the prescriber; a missed antibiotic dose matters."},{"id":"c-refuse","k":"code","q":"Aroha understands what it is for, but says she does not want her sleeping tablet tonight.","a":"R — Refused","why":"A competent refusal: explain, document the reason, inform the prescriber and the next shift, and discard the dose.","src":"Med Admin (1) 2026, slide 39"},{"id":"c-self","k":"code","q":"The patient uses her own inhaler and records her doses herself, as ward policy allows.","a":"S — Self-administered","why":"Self-administered."},{"id":"c-vomit","k":"code","q":"Mr L has vomited twice this morning and his 0800 tablets are due.","a":"V — Vomiting","why":"An oral dose would not stay down — tell the prescriber; another route may be needed."},{"id":"c-hr","k":"code","q":"The order says “withhold if HR < 60”. The apical pulse is 54.","a":"W — Withheld","why":"Withheld for a clinical reason: code W, the reason in the notes, and tell the RN or prescriber."},{"id":"c-sbp","k":"code","q":"An antihypertensive says “withhold if SBP < 100”. The BP is 92/58.","a":"W — Withheld","why":"The systolic (92) is under 100 — withheld, documented and reported."},{"id":"r-blank","k":"mcq","q":"The allergy box on the chart is blank. Before giving the first dose you…","opts":["Ask the patient, and get it documented first","Take it to mean no known allergies","Give it and watch closely for a reaction","Write NKDA in the box yourself"],"why":"A blank box is not “no allergies” — it means nobody has asked. Allergies, or confirmation of none, must be documented, and the nurse still asks.","src":"Med Admin (1) 2026, slide 43"},{"id":"r-window","k":"mcq","q":"A regular medicine is charted for 0800. The latest you should give it is…","opts":["0830","0900","1000","Any time before midday"],"why":"Regular medicines are given within 30 minutes of the scheduled time.","src":"Med Admin (1) 2026, slide 32"},{"id":"r-noroute","k":"mcq","q":"An order has the medicine, dose and frequency — but no route. You…","opts":["Withhold it and contact the prescriber","Give it by the usual route for that medicine","Ask another nurse which route to use","Give it by mouth and document that"],"why":"No route documented = withhold and clarify. A nurse cannot complete or change a prescription.","src":"Med Admin (1) 2026, slide 36"},{"id":"r-hr64","k":"mcq","q":"Metoprolol 25 mg PO BD — “withhold if HR < 60”. The heart rate is 64. You…","opts":["Give it — 64 is not under 60","Withhold it — 64 is too close to 60","Give half the dose to be safe","Withhold it and write W"],"why":"< 60 means under 60. At 64 the hold parameter is not met, so the dose is given (and the obs recorded)."},{"id":"r-prn1800","k":"mcq","q":"Paracetamol 1 g PO q4h PRN, max 4 g/24 h. Doses were given at 0600, 1000 and 1400. At 1800 the patient asks for more. You can…","opts":["Give 1 g — 4 hours have passed and it makes exactly 4 g","Not give it — the total would go over the 4 g maximum","Give only 500 mg, to stay safely under the maximum","Not give it — PRN doses are limited to two a day"],"why":"1800 − 1400 = 4 hours, and 3 g + 1 g = 4 g: the maximum, not over it. (Check the regular section and any combination products too.)"},{"id":"r-prn2000","k":"mcq","q":"Same patient: 1 g at 0600, 1000, 1400 and 1800. At 2000 they ask again. You…","opts":["Not give it — they have had the 4 g maximum in 24 hours","Give 1 g — a PRN dose can be given whenever they ask","Give 500 mg, half a dose, to be on the safe side","Give 1 g if their pain score is over 5 out of 10"],"why":"4 g in 24 hours is the maximum, whatever the pain score — tell the RN or prescriber and look at other options."},{"id":"r-student","k":"mcq","q":"As a student nurse you give a dose with your RN watching. On the chart…","opts":["You sign it, and your RN adds their check initial","You leave it blank for your RN to sign later on","You sign it on your own — you gave the dose","You write S (for student) in the dose box"],"why":"The course: student nurses also need the “check” initial.","src":"Med Admin (1) 2026, slide 55"},{"id":"r-cease","k":"mcq","q":"An order is ruled through, dated and signed “cease”. The patient asks for it. You…","opts":["Do not give it — it has been stopped","Give it — the doses are still in the drawer","Give it if they are in pain","Give it and tell the prescriber after"],"why":"Ceased means stopped. If the patient needs it, the prescriber writes a new order."},{"id":"r-before","k":"mcq","q":"When do you sign for a dose?","opts":["Straight after you have given it","When you prepare it, so you don’t forget","At the end of the round","At the end of the shift"],"why":"Record immediately after giving it — never before.","src":"Med Admin (1) 2026, slide 41"},{"id":"r-illeg","k":"mcq","q":"You cannot read the dose on an order. You…","opts":["Ask the prescriber to clarify it first","Give the dose it looks most like","Ask a colleague what they think it says","Give the usual dose listed in the NZF"],"why":"Never guess — “do not try to decipher illegible writing”. Insisting on proper prescribing is a legal duty.","src":"Med Admin (2) 2026 slide 6; Legal & Ethical slide 16"}],"dangers":[{"id":"d-trail","tk":[["Morphine"],["5.0 mg",1],["subcut"],["4-hourly"],["PRN"]],"d":"trail","risk":"The point gets missed and 5.0 is read as 50 mg — ten times the dose, of an opioid.","fix":"Morphine 5 mg subcut 4-hourly PRN"},{"id":"d-naked","tk":[["Colchicine"],[".5 mg",1],["PO"],["BD"]],"d":"naked","risk":"Without the leading zero, .5 mg is read as 5 mg — ten times the dose.","fix":"Colchicine 0.5 mg PO BD"},{"id":"d-U","tk":[["Insulin aspart"],["10U",1],["subcut"],["with meals"]],"d":"U","risk":"The U reads as a 0: 10U becomes 100 units of insulin.","fix":"Insulin aspart 10 units subcut with meals"},{"id":"d-IU","tk":[["Heparin"],["5000 IU",1],["subcut"],["BD"]],"d":"IU","risk":"IU can be read as IV — or as 10 (50,000).","fix":"Heparin 5000 units subcut BD"},{"id":"d-ug","tk":[["Levothyroxine"],["100 µg",1],["PO"],["mane"]],"d":"ug","risk":"A handwritten µ looks like an m: 100 mg — a thousand times the dose.","fix":"Levothyroxine 100 microgram PO mane"},{"id":"d-cc","tk":[["Lactulose"],["20 cc",1],["PO"],["BD"]],"d":"cc","risk":"cc can be read as a 0 or two: 20 cc becomes 200 or 2000.","fix":"Lactulose 20 mL PO BD"},{"id":"d-QD","tk":[["Amlodipine"],["5 mg"],["PO"],["QD",1]],"d":"QD","risk":"QD is read as QID — four doses a day instead of one.","fix":"Amlodipine 5 mg PO daily"},{"id":"d-OD","tk":[["Cilazapril"],["2.5 mg"],["PO"],["OD",1]],"d":"od","risk":"OD is also Latin for the right eye — a tablet order has been read as eye drops (and eye drops as tablets).","fix":"Cilazapril 2.5 mg PO daily"},{"id":"d-QOD","tk":[["Hydroxocobalamin"],["1 mg"],["IM"],["QOD",1]],"d":"QOD","risk":"QOD is read as QD or QID — daily, or four times a day, instead of every second day.","fix":"Hydroxocobalamin 1 mg IM every second day"},{"id":"d-SC","tk":[["Enoxaparin"],["40 mg"],["SC",1],["daily"]],"d":"sc","risk":"A handwritten SC can look like SL — an injection read as “under the tongue”. (Your course list writes SC, so read it — but write “subcut”.)","fix":"Enoxaparin 40 mg subcut daily"},{"id":"d-SQ","tk":[["Insulin glargine"],["20 units"],["SQ",1],["nocte"]],"d":"SQ","risk":"The Q can be read as “5 every” or a zero — the route and the dose both go wrong.","fix":"Insulin glargine 20 units subcut nocte"},{"id":"d-IN","tk":[["Mometasone"],["2 sprays"],["IN",1],["daily"]],"d":"IN","risk":"IN looks like IM or IV — a nasal spray read as an injection.","fix":"Mometasone 2 sprays intranasal daily"},{"id":"d-OS","tk":[["Chloramphenicol 0.5%"],["1 drop"],["OS",1],["QID"]],"d":"OS","risk":"OS (left eye) is confused with OD (right eye) and with AS (left ear).","fix":"Chloramphenicol 0.5% 1 drop left eye QID"},{"id":"d-x3d","tk":[["Amoxicillin"],["500 mg"],["PO"],["TDS"],["×3d",1]],"d":"x3d","risk":"Three days, or three doses? A course cut short, or a lot more doses than intended.","fix":"Amoxicillin 500 mg PO TDS for 3 days"},{"id":"d-MS","tk":[["MSO4",1],["10 mg"],["PO"],["4-hourly"],["PRN"]],"d":"MS","risk":"MSO4 (morphine sulfate) and MgSO4 (magnesium sulfate) have been swapped — never abbreviate a medicine’s name.","fix":"Morphine sulfate 10 mg PO 4-hourly PRN"},{"id":"d-DC","tk":[["Hydrocortisone"],["100 mg"],["IV"],["6-hourly"],["D/C",1]],"d":"DC","risk":"D/C: stop it, or send the patient home on it? Two opposite actions.","fix":"Hydrocortisone 100 mg IV 6-hourly — cease (dated, signed)"},{"id":"d-HS","tk":[["Temazepam"],["10 mg"],["PO"],["HS",1]],"d":"HS","risk":"HS is “at bedtime” — and also “half-strength”.","fix":"Temazepam 10 mg PO nocte"}],"sectionOpts":["Regular medicines","PRN (as required)","Once-only (stat)","Verbal orders","Fluid & infusion orders","Oxygen & medical gases"],"codeOpts":["A — Absent","F — Fasting","L — On leave","N — Not available","R — Refused","S — Self-administered","V — Vomiting","W — Withheld"]};
/* Chart Speak's drill engine: pure functions, no DOM, no imports. build-terms.mjs inlines this file into
   terms.html (with `export ` stripped) AND imports it to audit every question it can deal — so the code the
   audit passes is byte for byte the code that ships. */

const LOCK = { t: 2, o: 2, x: 2, d: 1 };   // right answers in a row that lock a term / order / scene / danger
const GAP_MS = 10 * 60e3;                  // a part-learned item is not asked again until 10 minutes have passed,
                                                   // so "2 in a row" is two separate recalls, not one remembered twice
const REFRESH_MS = 7 * 864e5;              // a locked item comes back for one check after a week

/* a written form, compared loosely: case, dots and spaces never make two forms different (b.d. = bd = BD) */
const normW = s => String(s).toLowerCase().replace(/[.\s]+/g, '');
/* a meaning, compared loosely: case and punctuation never make two meanings different */
const normM = s => String(s).toLowerCase().replace(/[^a-z0-9µ%<>@#?↑↓]+/g, ' ').trim();
const kindOf = t => t.kd || 'abbr';
const written = t => [t.t, ...(t.a || [])].map(normW);
/* two terms share a written form (PR the route and PR the pulse; OD once daily and OD overdose): neither may
   ever be offered in the other's question, or one question would have two right answers */
const clash = (a, b) => { const w = new Set(written(a)); return written(b).some(x => w.has(x)); };

function promptFor(t, dir, PROMPTS) {
  const p = PROMPTS[t.c + '.' + t.s] || PROMPTS[kindOf(t)];
  return p[dir === 'f' ? 0 : 1];
}
/* forward (written form → meaning) deals 4 meanings, stacked; reverse (meaning → written form) deals up to 6 short
   forms — but no more than the term's own sub-group can fill (never under 4), so a small family like 3/24 · 3/7 ·
   3/52 · 3/12 is not padded with forms anyone can rule out at a glance */
function optCount(dir, term, TERMS) {
  if (dir === 'f') return 4;
  const sib = TERMS.filter(x => x.c === term.c && x.s === term.s && kindOf(x) === kindOf(term)).length;
  return Math.max(4, Math.min(6, sib));
}

/* the shape of a written form: a wrong option should look like the answer, or the shape gives it away
   (one lower-case word among five capitals is picked without reading) */
const shapeW = s => { const x = String(s);
  return { c: /[A-Z]/.test(x) && !/[a-z]/.test(x) ? 'U' : /[a-z]/.test(x) && !/[A-Z]/.test(x) ? 'L' : /[A-Za-z]/.test(x) ? 'M' : '-',
    d: /\d/.test(x), p: /[\/:%<>@#?↑↓]/.test(x), n: x.length }; };
const distW = (a, b) => (a.c !== b.c ? 1.5 : 0) + (a.d !== b.d ? 1 : 0) + (a.p !== b.p ? 0.7 : 0) + Math.min(1.5, Math.abs(a.n - b.n) / Math.max(3, a.n));
const distM = (a, b) => Math.min(2, Math.abs(a.length - b.length) / Math.max(14, a.length));

/* The options for one question. The wrong options are the whole design (estate memory
   "drill-dropdowns-not-typing"): drawn first from the term's own classic confusions (cf), then its sub-group,
   then its category, then anywhere — and within a tier, the closest in shape first. Never offered: a term
   with the same meaning (g), a term sharing its written form (clash), a text equal to the answer, and in a
   reverse question a written form of a different kind (an abbreviation among words). */
function options(term, dir, TERMS, rnd) {
  const text = x => dir === 'f' ? x.m : x.t;
  const ans = text(term), want = optCount(dir, term, TERMS);
  const seen = new Set([dir === 'f' ? normM(ans) : normW(ans)]);
  const key = x => dir === 'f' ? normM(text(x)) : normW(text(x));
  const ok = x => x.id !== term.id && !(term.g && x.g === term.g) && !clash(term, x)
    && (dir === 'f' || kindOf(x) === kindOf(term)) && !seen.has(key(x));
  const out = [];
  const take = list => { for (const x of list) { if (out.length >= want - 1) return; if (ok(x)) { out.push(x); seen.add(key(x)); } } };
  const byId = new Map(TERMS.map(x => [x.id, x]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sA = dir === 'f' ? null : shapeW(ans);
  const near = list => list.map(x => ({ x, k: (dir === 'f' ? distM(ans, text(x)) : distW(sA, shapeW(text(x)))) + rnd() * 0.9 }))
    .sort((p, q) => p.k - q.k).map(p => p.x);
  take(shuffle((term.cf || []).map(id => byId.get(id)).filter(Boolean)));
  take(near(TERMS.filter(x => x.c === term.c && x.s === term.s)));
  take(near(TERMS.filter(x => x.c === term.c)));
  take(near(TERMS.filter(x => x.c !== term.c)));
  const opts = shuffle(out).map(x => ({ id: x.id, text: text(x) }));
  const at = Math.floor(rnd() * (opts.length + 1));
  opts.splice(at, 0, { id: term.id, text: ans });
  return { opts, ans: at };
}

/* the first time a term is seen it is always read (written form → meaning): that is the skill a chart asks for.
   After that, either way round. t.rev === 0 keeps a term one-way. */
function pickDir(t, st, rnd) {
  if (t.rev === 0 || !st || !st.n) return 'f';
  return rnd() < 0.5 ? 'f' : 'r';
}

/* one answer. s = right in a row, n = times seen, w = times wrong, t = when last seen, L = locked */
function record(ST, id, right, now, lockAt) {
  const s = ST[id] || (ST[id] = { s: 0, n: 0, w: 0, t: 0 });
  s.n++; s.t = now;
  if (right) { s.s++; if (s.s >= lockAt) s.L = 1; }
  else { s.s = 0; s.w++; delete s.L; }
  return s;
}
const isMiss = st => !!st && !st.L && st.n > 0 && st.s === 0 && st.w > 0;

const isPart = st => !!st && !st.L && st.n > 0 && !isMiss(st);

/* What a run deals, in this order: the ones you got wrong last time (most-missed first); the ones you are
   part-way through that were last seen 10+ minutes ago (oldest first); new ones (in the order they are written —
   the commonest first); part-way ones seen in the last 10 minutes (only if the run still has room); locked ones a
   week or more old (a refresher); then any other locked ones. Misses lead; everything after them is shuffled
   within the run so a run is never a list you can learn the order of. */
function deal(pool, ST, size, now, rnd) {
  const st = x => ST[x.id];
  const by = (f, g) => pool.filter(f).sort(g);
  const old = (a, b) => st(a).t - st(b).t;
  const miss = by(x => isMiss(st(x)), (a, b) => st(b).w - st(a).w || old(a, b));
  const due = by(x => isPart(st(x)) && now - st(x).t >= GAP_MS, old);
  const fresh = pool.filter(x => !st(x) || !st(x).n);
  const recent = by(x => isPart(st(x)) && now - st(x).t < GAP_MS, old);
  const stale = by(x => st(x) && st(x).L && now - st(x).t >= REFRESH_MS, old);
  const done = by(x => st(x) && st(x).L && now - st(x).t < REFRESH_MS, old);
  const all = [...miss, ...due, ...fresh, ...recent, ...stale, ...done].slice(0, size);
  const lead = all.slice(0, miss.length), rest = all.slice(miss.length);
  for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
  return [...lead, ...rest];
}

/* n in the pool · L locked · part on their way (right last time, not locked yet) · miss wrong last time · seen */
function progress(pool, ST) {
  let L = 0, seen = 0, miss = 0, part = 0;
  for (const x of pool) { const s = ST[x.id]; if (!s) continue; if (s.n) seen++; if (s.L) L++; if (isMiss(s)) miss++; if (isPart(s)) part++; }
  return { n: pool.length, L, seen, miss, part };
}

/* ── Chart Speak: the page. Everything it knows is CS (built from content/terms/ by build-terms.mjs);
   the drill logic above is terms-engine.mjs, inlined. Progress lives in this browser under the Paper Sim's
   own prefix, and a one-line summary is left under more.terms for the Paper Sim's home row to show. ── */
const TERMS = CS.terms, CATS = CS.cats, PROMPTS = CS.prompts, ORDERS = CS.orders, SCENES = CS.scenes, DANGERS = CS.dangers;
const BYID = new Map(TERMS.map(t => [t.id, t]));
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LS = k => { try { return JSON.parse(localStorage.getItem(CS.prefix + k)); } catch (e) { return null; } };
const SV = (k, v) => { try { localStorage.setItem(CS.prefix + k, JSON.stringify(v)); } catch (e) {} };
const ST = LS('cs.t') || {}, SO = LS('cs.o') || {}, SX = LS('cs.x') || {}, SD = LS('cs.d') || {};
const SIZES = [10, 20, 40, 'all'];
let N = LS('cs.n'); if (!SIZES.includes(N)) N = 20;
const SCOPES = [{ id: 'all', n: 'Everything', ic: '🗂' }, { id: 'must', n: 'The course’s Must-Know list', ic: '📌' }, ...CATS.map(c => ({ id: c.id, n: c.n, ic: c.ic }))];
let SCOPE = LS('cs.scope'); if (!SCOPES.some(s => s.id === SCOPE)) SCOPE = 'all';
const inScope = (t, sc) => sc === 'all' || (sc === 'must' ? t.k === 'must' : t.c === sc || (t.also || []).includes(sc));
const poolOf = sc => TERMS.filter(t => inScope(t, sc));
const scopeName = sc => (SCOPES.find(s => s.id === sc) || SCOPES[0]).n;
const SEC = { reg: 'Regular medicines', prn: 'PRN (as required)', once: 'Once-only (stat)', fluid: 'Fluid & infusion orders', o2: 'Oxygen & medical gases' };
const ORD = new Map(ORDERS.map(o => [o.id, o])), SCN = new Map(SCENES.map(s => [s.id, s])), DNG = new Map(DANGERS.map(d => [d.id, d]));

function statusLine() {
  const a = progress(TERMS, ST), o = progress(ORDERS, SO);
  return `${a.L}/${a.n} terms locked${a.part ? ` · ${a.part} on the way` : ''}${a.miss ? ` · ${a.miss} to redo` : ''} · ${o.L}/${o.n} chart lines read`;
}
function save() { SV('cs.t', ST); SV('cs.o', SO); SV('cs.x', SX); SV('cs.d', SD); SV('more.terms', statusLine()); }

/* where a term comes from — shown under every answer and in the glossary */
const PROV = {
  must: '📌 On the course’s Must-Know abbreviations list (Concepts (2) slides 77–80)',
  deck: '📘 From the course',
  ward: '🏥 Everyday NZ ward usage, in this tool’s words — your hospital’s own list is the one that counts',
  safe: '⚠️ On the international error-prone list — your hospital’s “do not use” list is the one that binds you',
};
function provLine(t) {
  const k = t.k || 'ward';
  if (k === 'deck') return `<div class="refsrc">📘 From the course: ${esc(t.src)}</div>`;
  return `<div class="refsrc">${PROV[k]}${t.src ? ' · ' + esc(t.src) : ''}</div>`;
}
function termDetail(t) {
  const alt = t.a || [];
  return `${alt.length ? `<p class="cs-alt">Also written: ${alt.map(a => `<code>${esc(a)}</code>`).join(' ')}</p>` : ''}
    ${t.x ? `<p>${esc(t.x)}</p>` : ''}${t.w ? `<p class="cs-warn">⚠ ${esc(t.w)}</p>` : ''}
    ${t.eg ? `<p class="cs-eg">On a chart: <code>${esc(t.eg)}</code></p>` : ''}${provLine(t)}`;
}
const lockBadge = (st, n) => !st ? '' : st.L ? '<span class="sbadge lock">🔒 locked</span>' : `<span class="sbadge go">${st.s} of ${n} in a row</span>`;

/* ── screens ── home is one list of rows; each opens its own screen (#drill #chart #danger #rules #glossary),
   so the phone's back button and a shared link both work. A drill run sits on top of the screen it came from. */
const SCR = {
  drill: { t: '🔤 Terms & abbreviations', html: () => drillScreen() },
  chart: { t: '📋 Read the chart', html: () => chartScreen() },
  danger: { t: '⚠️ Spot the danger', html: () => dangerScreen() },
  rules: { t: '🧭 Chart rules & codes', html: () => rulesScreen() },
  glossary: { t: '📖 Glossary', html: () => glossScreen() },
};
const curScr = () => { const h = location.hash.slice(1); return SCR[h] ? h : ''; };
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function nav(scr) { history.pushState({ scr }, '', scr ? '#' + scr : location.pathname + location.search); render(scr); window.scrollTo(0, 0); }
let RUN = null;
function enterRun() { if (!(history.state && history.state.run)) history.pushState({ run: 1, scr: curScr() }, '', location.href); }
function leaveRun() { RUN = null; if (history.state && history.state.run) history.back(); else { render(curScr()); window.scrollTo(0, 0); } }
window.addEventListener('popstate', () => { RUN = null; render(curScr()); window.scrollTo(0, 0); });
function render(scr) {
  RUN = null;
  $('#view').innerHTML = scr ? `<div class="shead"><button class="btn ghost" id="homeB">‹ Home</button><h2>${SCR[scr].t}</h2></div>${SCR[scr].html()}` : launcher();
  bindView();
}

const row = (scr, ic, t, s) => `<button class="lrow" data-scr="${scr}"><span class="lic" aria-hidden="true">${ic}</span><span class="ltx"><b>${t}</b><small>${s}</small></span><span class="lch" aria-hidden="true">›</span></button>`;
function nextUp() {
  const all = progress(TERMS, ST), must = progress(poolOf('must'), ST);
  if (all.miss) return { e: 'Next up · your misses first', t: `Redo the ${all.miss} you missed, then carry on`, go: () => startTerms('all') };
  if (must.L < must.n) return { e: 'Next up · the course’s own list first', t: `The ${must.n} Must-Know abbreviations — OD, BD, TDS, QID, PRN, stat…`, go: () => startTerms('must') };
  return { e: 'Next up · what you know least', t: `Drill ${N === 'all' ? 'everything' : N} · misses first, then new ones`, go: () => startTerms('all') };
}
let HERO = null;
function launcher() {
  const t = progress(TERMS, ST), o = progress(ORDERS, SO), x = progress(SCENES, SX), d = progress(DANGERS, SD), up = nextUp();
  HERO = up.go;
  return `<div class="idcard"><span class="idic" aria-hidden="true">💬</span><span class="idtx"><small>${esc(CS.kick)}</small><b>Chart Speak</b><span>${TERMS.length} med-chart terms, drilled</span></span></div>
  <details class="note bnote" style="border-left-color:var(--warn);color:var(--fg)"><summary><b>A reading trainer, not a dosing guide.</b></summary>
    The example orders use typical adult doses so they look like a real chart — never use them to decide a dose; the chart, the NZ Formulary and your preceptor do that. Abbreviations and codes vary between hospitals: where your ward’s list, or the key printed on your chart, says something different, theirs wins. Every term says where it comes from: 📌 the course’s own Must-Know list, 📘 a course deck, 🏥 everyday NZ ward usage (this tool’s words), ⚠️ the international error-prone list.</details>
  <button class="hero" id="heroB"><span><small>${up.e}</small><b>${up.t}</b></span><span class="go" aria-hidden="true">▶</span></button>
  <div class="lsec">Drill</div>
  ${row('drill', '🔤', 'Terms & abbreviations', `${t.L} of ${t.n} locked${t.part ? ` · ${t.part} on the way` : ''}${t.miss ? ` · ${t.miss} to redo` : ''}${!t.seen ? ' · 2 right in a row locks one' : ''}`)}
  ${row('chart', '📋', 'Read the chart', `${o.L} of ${o.n} orders read · real-looking chart lines to decode`)}
  ${row('danger', '⚠️', 'Spot the danger', `${d.L} of ${d.n} found · the ways of writing that hurt people`)}
  ${row('rules', '🧭', 'Chart rules & codes', `${x.L} of ${x.n} right · sections, not-given codes, PRN maths`)}
  <div class="lsec">Look it up</div>
  ${row('glossary', '📖', 'Glossary', `Search all ${TERMS.length} · every one with its meaning and source`)}
  <div class="lsec">Drill one topic</div>
  ${CATS.map(c => { const p = progress(poolOf(c.id), ST);
    return `<button class="lrow cs-cat" data-cat="${c.id}"><span class="lic" aria-hidden="true">${c.ic}</span><span class="ltx"><b>${esc(c.n)}</b><small>${p.L} of ${p.n} locked${p.part ? ` · ${p.part} on the way` : ''}${p.miss ? ` · ${p.miss} to redo` : ''} · ${esc(c.d)}</small><span class="fbar"><i style="width:${Math.round(100 * p.L / p.n)}%"></i></span></span><span class="lch" aria-hidden="true">▶</span></button>`; }).join('')}`;
}

const sizeChips = () => `<div class="chips"><span>How many</span>${SIZES.map(n => `<button class="chip${String(N) === String(n) ? ' on' : ''}" data-n="${n}">${n === 'all' ? 'All' : n}</button>`).join('')}</div>`;
function drillScreen() {
  const p = progress(poolOf(SCOPE), ST);
  return `<div class="card" style="border-left:4px solid var(--primary)">
    <p class="lead">Pick a topic and how many. What you got wrong comes back first; <b>2 right in a row locks a term</b> 🔒.</p>
    <details class="how"><summary>How this works</summary>
      <p>Each question shows a term the way a chart writes it and asks what it means — the first time you meet a term it is always that way round, because that is the job on the ward. Once you have seen it, it may come the other way too: here is the meaning, how is it written?</p>
      <p>The wrong answers are chosen to be the real traps: BD sits next to TDS, SC next to SL, mg next to mcg, mane next to nocte. A wrong answer tells you what the one you picked actually means, and the term comes back a few questions later. <b>Two right in a row locks a term</b> — and the second has to come at least 10 minutes after the first, so it is two separate recalls, not one remembered twice. A locked term comes back after a week to check it stuck. A run deals your misses first, then terms you got right 10+ minutes ago, then new ones (the commonest first), then locked ones due a check.</p>
      <p>On a keyboard: number keys pick an answer, Enter moves on.</p>
    </details>
    <div class="chips"><span>Drill</span>${SCOPES.map(s => `<button class="chip${SCOPE === s.id ? ' on' : ''}" data-scope="${s.id}">${s.ic} ${esc(s.n)} · ${poolOf(s.id).length}</button>`).join('')}</div>
    ${sizeChips()}
    <button class="btn primary wide" id="goDrill">▶ Start · ${N === 'all' ? p.n : Math.min(N, p.n)} from ${esc(scopeName(SCOPE))}</button>
    <div class="hist" style="margin-top:8px">${p.L} of ${p.n} locked here${p.part ? ` · ${p.part} on the way` : ''}${p.miss ? ` · ${p.miss} to redo` : ''}${p.n - p.seen ? ` · ${p.n - p.seen} not seen yet` : ''}</div>
  </div>`;
}
function chartScreen() {
  const p = progress(ORDERS, SO);
  return `<div class="card" style="border-left:4px solid var(--warn)">
    <p class="lead">Whole orders, laid out like a line of a med chart. Read it, then pick what it tells you to do.</p>
    <details class="how"><summary>How this works</summary>
      <p>Each order has four readings. Three of them get exactly one thing wrong — the frequency, the route, the unit, a &lt; read as a &gt; — so the only way to the right one is to read every part of the line. A wrong pick tells you what you misread.</p>
      <p>Stuck? The words under the order decode one at a time. Peeking is fine — but a right answer after a peek does not count towards reading that line cold. Two cold reads in a row and a line is read ✓.</p>
      <p>The doses are typical adult examples so the lines look real. They are practice in reading, never a guide to what to give.</p>
    </details>
    ${sizeChips()}
    <button class="btn primary wide" id="goOrders">▶ Read ${N === 'all' ? p.n : Math.min(N, p.n)} orders</button>
    <div class="hist" style="margin-top:8px">${p.L} of ${p.n} read cold${p.miss ? ` · ${p.miss} to redo` : ''}</div>
    <details class="smod"><summary>Every order and its reading · ${ORDERS.length}</summary>
      <div class="cs-list">${ORDERS.map(o => `<div class="krow"><b>${esc(o.med)} ${esc(o.dose)} ${esc(o.route)} ${esc(o.freq)}</b><br>${esc(o.read)}</div>`).join('')}</div></details>
  </div>`;
}
function dangerScreen() {
  const p = progress(DANGERS, SD), danger = poolOf('safe');
  return `<div class="card" style="border-left:4px solid var(--danger)">
    <p class="lead">Each order has one dangerous way of writing it. Tap the part that could hurt someone.</p>
    <details class="how"><summary>How this works</summary>
      <p>Every one of these has been misread on a real ward somewhere: a trailing zero, a U for units, a µ for micro, an OD that could mean an eye. Only one part of each line is on the danger list, so tap that part — then see how it goes wrong and how it should be written.</p>
      <p>Some of them are on your own course list (SC, OD): you still have to be able to read them, because charts are full of them. You just should not write them.</p>
    </details>
    <button class="btn primary wide" id="goDanger">▶ Spot the danger · ${DANGERS.length} orders</button>
    <div class="hist" style="margin-top:8px">${p.L} of ${p.n} found${p.miss ? ` · ${p.miss} to redo` : ''}</div>
    <button class="btn ghost wide" data-drillscope="safe">🔤 Drill the whole danger list · ${danger.length} terms</button>
  </div>`;
}
function rulesScreen() {
  const p = progress(SCENES, SX);
  return `<div class="card" style="border-left:4px solid var(--ok)">
    <p class="lead">Ward situations: which part of the chart an order goes in, which code goes in the dose box, and the rules (the 30-minute window, a blank allergy box, PRN maths).</p>
    <details class="how"><summary>How this works</summary>
      <p>The chart’s sections are the course’s own (Med Admin (1), slides 54–55). The not-given codes are the letters used on the national charts — <b>your chart prints its own key, and that key wins</b>. Two right in a row and a scenario is ✓.</p>
    </details>
    ${sizeChips()}
    <button class="btn primary wide" id="goRules">▶ ${N === 'all' ? p.n : Math.min(N, p.n)} scenarios</button>
    <div class="hist" style="margin-top:8px">${p.L} of ${p.n} right twice in a row${p.miss ? ` · ${p.miss} to redo` : ''}</div>
  </div>`;
}
let GS = 'all';
function glossScreen() {
  return `<div class="card">
    <input type="search" id="gq" placeholder="Search — try “tds”, “kidney” or “tongue”" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <div class="chips">${SCOPES.map(s => `<button class="chip${GS === s.id ? ' on' : ''}" data-gs="${s.id}">${s.ic} ${esc(s.id === 'must' ? 'Course list' : s.n)}</button>`).join('')}</div>
    <div class="hist" id="gcount" style="margin:6px 0"></div>
    <button class="btn ghost wide" id="gDrill" style="margin:0 0 10px">▶ Drill these</button>
    <div id="glist"></div>
  </div>`;
}
let GLIST = [];
function paintGloss() {
  const raw = ($('#gq') || {}).value || '', q = normM(raw), qw = normW(raw);
  GLIST = TERMS.filter(t => inScope(t, GS) && (!raw.trim() || [t.t, ...(t.a || [])].some(w => normW(w).includes(qw)) || normM([t.m, t.x || '', t.w || ''].join(' ')).includes(q)));
  $('#gcount').textContent = `${GLIST.length} of ${TERMS.length}${raw.trim() ? ` match “${raw.trim()}”` : ''}`;
  $('#gDrill').textContent = `▶ Drill these ${GLIST.length}`;
  $('#gDrill').disabled = !GLIST.length;
  $('#glist').innerHTML = GLIST.map(t => { const st = ST[t.id];
    return `<details class="gl"><summary><code>${esc(t.t)}</code><span class="gm">${esc(t.m)}</span><span class="gb">${t.k === 'must' ? '📌 ' : ''}${t.w ? '⚠ ' : ''}${st && st.L ? '🔒' : ''}</span></summary><div class="gl-b">${termDetail(t)}<div class="refsrc">${CAT[t.c].ic} ${esc(CAT[t.c].n)}</div></div></details>`; }).join('')
    || '<p class="hist">Nothing matches. Try fewer letters, or another topic.</p>';
}

function bindView() {
  const hb = $('#homeB'); if (hb) hb.onclick = () => { if (history.state && history.state.scr && !history.state.run) history.back(); else nav(''); };
  document.querySelectorAll('[data-scr]').forEach(b => b.onclick = () => nav(b.dataset.scr));
  const hero = $('#heroB'); if (hero) hero.onclick = () => HERO();
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => startTerms(b.dataset.cat));
  document.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { SCOPE = b.dataset.scope; SV('cs.scope', SCOPE); const y = scrollY; render('drill'); scrollTo(0, y); });
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { N = b.dataset.n === 'all' ? 'all' : +b.dataset.n; SV('cs.n', N); const y = scrollY; render(curScr()); scrollTo(0, y); });
  document.querySelectorAll('[data-drillscope]').forEach(b => b.onclick = () => startTerms(b.dataset.drillscope, null, true));
  const g = id => $(id);
  if (g('#goDrill')) g('#goDrill').onclick = () => startTerms(SCOPE);
  if (g('#goOrders')) g('#goOrders').onclick = () => startItems('o');
  if (g('#goDanger')) g('#goDanger').onclick = () => startItems('d');
  if (g('#goRules')) g('#goRules').onclick = () => startItems('x');
  if (g('#gq')) {
    document.querySelectorAll('[data-gs]').forEach(b => b.onclick = () => { GS = b.dataset.gs; document.querySelectorAll('[data-gs]').forEach(c => c.classList.toggle('on', c === b)); paintGloss(); });
    g('#gq').oninput = paintGloss;
    g('#gDrill').onclick = () => startTerms('all', GLIST.map(t => t.id));
    paintGloss();
  }
}

/* ── runs ── */
const runHead = tag => `<div class="qhead"><button class="btn ghost" id="runBack" style="padding:4px 10px">← Stop</button><span class="n">${RUN.i + 1} / ${RUN.items.length}</span>${tag ? `<span class="tag" style="margin-left:auto">${tag}</span>` : ''}</div>`;
const pips = () => `<div class="pips">${RUN.items.map((x, k) => `<span class="pip${k < RUN.i ? ' done' : ''}${k === RUN.i ? ' cur' : ''}"></span>`).join('')}</div>`;
function bindRunHead() { $('#runBack').onclick = leaveRun; }
function nextQ() { RUN.i++; if (RUN.i >= RUN.items.length) return endRun(); showRun(); window.scrollTo(0, 0); }
function showRun() { ({ t: showT, o: showO, x: showX, d: showD })[RUN.kind](); }
/* a miss comes back a few questions later (at most twice more in one run) */
function requeue(it) {
  if (RUN.items.filter(x => x.id === it.id).length >= 3) return;
  RUN.items.splice(Math.min(RUN.items.length, RUN.i + 4), 0, { id: it.id, dir: it.dir });
}
function showNext() {
  const last = RUN.i + 1 >= RUN.items.length;
  return `<button class="btn primary wide" id="nextB">${last ? 'See how you went →' : 'Next →'}</button>`;
}
function bindNext() { const b = $('#nextB'); b.onclick = nextQ; b.focus({ preventScroll: true }); const f = $('#fb'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

/* terms */
/* ids: exactly these terms (a redo, or the glossary's filtered list) · whole: every term in the scope, ignoring the size chips */
function startTerms(scope, ids, whole) {
  const pool = ids ? ids.map(id => BYID.get(id)).filter(Boolean) : poolOf(scope);
  const size = ids || whole ? pool.length : N === 'all' ? pool.length : N;
  const dealt = ids ? shuffle(pool).slice(0, size) : deal(pool, ST, size, Date.now(), Math.random);
  if (!dealt.length) { alert('Nothing to drill here yet.'); return; }
  RUN = { kind: 't', items: dealt.map(t => ({ id: t.id, dir: pickDir(t, ST[t.id], Math.random) })), i: 0, right: 0, done: 0, missed: [],
    again: () => startTerms(scope, ids, whole), L0: progress(TERMS, ST).L };
  enterRun(); showT(); window.scrollTo(0, 0);
}
function showT() {
  const it = RUN.items[RUN.i], t = BYID.get(it.id), c = CAT[t.c], kind = kindOf(t);
  if (!it.o) it.o = options(t, it.dir, TERMS, Math.random);
  const big = it.dir === 'f' ? t.t : t.m, cls = it.dir === 'r' ? 'm' : kind === 'abbr' ? 'w' : 'wt';
  $('#view').innerHTML = `<div class="card">${runHead(c.ic + ' ' + esc(c.n))}
    <p class="cs-p">${esc(promptFor(t, it.dir, PROMPTS))}</p>
    <div class="cs-big ${cls}">${esc(big)}</div>
    <div class="cs-opts${it.dir === 'r' ? ' grid' + (kind === 'abbr' ? ' mono' : '') : ''}">${it.o.opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.text)}</button>`).join('')}</div>
    <div id="fb"></div></div>${pips()}`;
  bindRunHead();
  document.querySelectorAll('.cs-opts .opt').forEach(b => b.onclick = () => answerT(+b.dataset.k));
}
function answerT(k) {
  const it = RUN.items[RUN.i]; if (it.done) return;
  const t = BYID.get(it.id), right = k === it.o.ans, st = record(ST, t.id, right, Date.now(), LOCK.t), pick = BYID.get(it.o.opts[k].id);
  it.done = 1; RUN.done++;
  if (right) RUN.right++; else { RUN.missed.push(t.id); requeue(it); }
  save();
  document.querySelectorAll('.cs-opts .opt').forEach((b, j) => { b.disabled = true; b.classList.add(j === it.o.ans ? 'k' : j === k ? 'x' : 'dim'); });
  $('#fb').innerHTML = `<div class="mk ${right ? 'right' : 'wrong'}">
      <p class="verdict">${right ? '✓ Right' : '✗ Not this time'} ${lockBadge(st, LOCK.t)}</p>
      <p class="cs-def"><code>${esc(t.t)}</code> = ${esc(t.m)}</p>
      ${right ? '' : `<p class="you">You picked ${it.dir === 'f' ? `“${esc(pick.m)}” — that is <code>${esc(pick.t)}</code>` : `<code>${esc(pick.t)}</code> — that means “${esc(pick.m)}”`}.</p>`}
      ${termDetail(t)}${right ? '' : '<p class="hist">It comes back in a few questions.</p>'}
    </div>${showNext()}`;
  bindNext();
}

/* orders, scenes and dangers share one runner */
const STORE = { o: SO, x: SX, d: SD }, POOL = { o: ORDERS, x: SCENES, d: DANGERS };
function startItems(kind, ids) {
  const pool = ids ? ids.map(id => POOL[kind].find(x => x.id === id)).filter(Boolean) : POOL[kind];
  const size = ids || kind === 'd' || N === 'all' ? pool.length : N;
  const dealt = ids ? shuffle(pool) : deal(pool, STORE[kind], size, Date.now(), Math.random);
  if (!dealt.length) { alert('Nothing here yet.'); return; }
  RUN = { kind, items: dealt.map(x => ({ id: x.id })), i: 0, right: 0, done: 0, missed: [], again: () => startItems(kind, ids) };
  enterRun(); showRun(); window.scrollTo(0, 0);
}
/* a right answer after a peek counts as seen, never as read cold */
function mark(kind, id, right, peek) {
  const S = STORE[kind];
  if (right && peek) { const s = S[id] || (S[id] = { s: 0, n: 0, w: 0, t: 0 }); s.n++; s.t = Date.now(); return s; }
  return record(S, id, right, Date.now(), LOCK[kind]);
}
function tally(it, right) { it.done = 1; RUN.done++; if (right) RUN.right++; else { RUN.missed.push(it.id); requeue(it); } save(); }
const decodeChip = (id, open) => { const t = BYID.get(id);
  return open ? `<span class="dchip open"><code>${esc(t.t)}</code> = ${esc(t.m)}</span>` : `<button class="dchip" data-dc="${id}">${esc(t.t)} ?</button>`; };
function chartLine(o) {
  const cell = (l, v) => v ? `<div class="cl-cell"><small>${l}</small><b>${esc(v)}</b></div>` : '';
  return `<div class="cl cl-${o.sec}"><span class="cl-sec">${esc(SEC[o.sec])}</span><div class="cl-med">${esc(o.med)}</div>
    <div class="cl-grid">${cell('Dose', o.dose)}${cell('Route', o.route)}${cell(o.sec === 'fluid' ? 'Over' : o.sec === 'o2' ? 'How' : 'Frequency', o.freq)}${cell('For', o.ind)}${cell('Max', o.max)}</div>
    ${o.note ? `<div class="cl-note">${esc(o.note)}</div>` : ''}</div>`;
}
function showO() {
  const it = RUN.items[RUN.i], o = ORD.get(it.id);
  if (!it.o) it.o = shuffle([{ t: o.read, ok: 1 }, ...o.bad.map(b => ({ t: b[0], why: b[1] }))]);
  it.open = it.open || {};
  $('#view').innerHTML = `<div class="card">${runHead('📋 Read the chart')}
    ${chartLine(o)}
    <p class="cs-p">What does this order tell you to do?</p>
    <div class="cs-opts">${it.o.map((x, k) => `<button class="opt" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>
    <div class="cs-decode"><span class="hist">Stuck? Decode a word — a peek is fine, it just won’t count as a cold read:</span>
      <div class="dchips" id="dchips">${o.tk.map(id => decodeChip(id, it.open[id])).join('')}</div></div>
    <div id="fb"></div></div>${pips()}`;
  bindRunHead();
  document.querySelectorAll('.cs-opts .opt').forEach(b => b.onclick = () => answerO(+b.dataset.k));
  bindDecode(it, o);
}
function bindDecode(it, o) {
  document.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => { it.open[b.dataset.dc] = 1; if (!it.done) it.peek = 1;
    $('#dchips').innerHTML = o.tk.map(id => decodeChip(id, it.open[id])).join(''); bindDecode(it, o); });
}
function answerO(k) {
  const it = RUN.items[RUN.i]; if (it.done) return;
  const o = ORD.get(it.id), x = it.o[k], right = !!x.ok, st = mark('o', o.id, right, it.peek);
  tally(it, right);
  document.querySelectorAll('.cs-opts .opt').forEach((b, j) => { b.disabled = true; b.classList.add(it.o[j].ok ? 'k' : j === k ? 'x' : 'dim'); });
  o.tk.forEach(id => it.open[id] = 1);
  $('#dchips').innerHTML = o.tk.map(id => decodeChip(id, 1)).join('');
  $('#fb').innerHTML = `<div class="mk ${right ? 'right' : 'wrong'}">
      <p class="verdict">${right ? (it.peek ? '✓ Right — after a peek, so not yet a cold read' : '✓ Read it right') : '✗ Misread'} ${lockBadge(st, LOCK.o)}</p>
      ${right ? '' : `<p class="you">What you picked gets this wrong: ${esc(x.why)}</p>`}
      <p><b>It says:</b> ${esc(o.read)}</p>
      ${o.src ? `<div class="refsrc">📘 ${esc(o.src)}</div>` : ''}
      <div class="refsrc">Typical adult example for reading practice — not a dosing guide.</div>
    </div>${showNext()}`;
  bindNext();
}
function sceneOpts(s) { return s.k === 'sec' ? CS.sectionOpts : s.k === 'code' ? CS.codeOpts : null; }
function showX() {
  const it = RUN.items[RUN.i], s = SCN.get(it.id);
  if (!it.o) it.o = sceneOpts(s) ? sceneOpts(s).slice() : shuffle(s.opts);
  const lead = s.k === 'sec' ? 'Which part of the chart does this go in?' : s.k === 'code' ? 'Which code goes in the dose box?' : '';
  $('#view').innerHTML = `<div class="card">${runHead(s.k === 'sec' ? '📋 Section' : s.k === 'code' ? '🔤 Code' : '🧭 Rule')}
    ${lead ? `<p class="cs-p">${lead}</p>` : ''}
    <p class="cs-big m">${esc(s.q)}</p>
    <div class="cs-opts${s.k === 'code' ? ' grid' : ''}">${it.o.map((x, k) => `<button class="opt" data-k="${k}">${esc(x)}</button>`).join('')}</div>
    <div id="fb"></div></div>${pips()}`;
  bindRunHead();
  document.querySelectorAll('.cs-opts .opt').forEach(b => b.onclick = () => answerX(+b.dataset.k));
}
function answerX(k) {
  const it = RUN.items[RUN.i]; if (it.done) return;
  const s = SCN.get(it.id), a = s.k === 'mcq' ? s.opts[0] : s.a, right = it.o[k] === a, st = mark('x', s.id, right, false);
  tally(it, right);
  document.querySelectorAll('.cs-opts .opt').forEach((b, j) => { b.disabled = true; b.classList.add(it.o[j] === a ? 'k' : j === k ? 'x' : 'dim'); });
  $('#fb').innerHTML = `<div class="mk ${right ? 'right' : 'wrong'}">
      <p class="verdict">${right ? '✓ Right' : '✗ Not this one'} ${lockBadge(st, LOCK.x)}</p>
      ${right ? '' : `<p><b>Answer:</b> ${esc(a)}</p>`}<p>${esc(s.why)}</p>
      ${s.src ? `<div class="refsrc">📘 From the course: ${esc(s.src)}</div>` : ''}
      ${s.k === 'code' ? '<div class="refsrc">The letters used on the national charts — your chart prints its own key, and that key wins.</div>' : ''}
    </div>${showNext()}`;
  bindNext();
}
function showD() {
  const it = RUN.items[RUN.i], d = DNG.get(it.id);
  $('#view').innerHTML = `<div class="card">${runHead('⚠️ Spot the danger')}
    <p class="cs-p">One part of this order is written dangerously. Tap it.</p>
    <div class="dline">${d.tk.map((tk, k) => `<button class="dtok" data-k="${k}">${esc(tk[0])}</button>`).join('')}</div>
    <div id="fb"></div></div>${pips()}`;
  bindRunHead();
  document.querySelectorAll('.dtok').forEach(b => b.onclick = () => answerD(+b.dataset.k));
}
function answerD(k) {
  const it = RUN.items[RUN.i]; if (it.done) return;
  const d = DNG.get(it.id), hot = d.tk.findIndex(tk => tk[1]), right = k === hot, st = mark('d', d.id, right, false), t = BYID.get(d.d);
  tally(it, right);
  document.querySelectorAll('.dtok').forEach((b, j) => { b.disabled = true; if (j === hot) b.classList.add('hit'); else if (j === k) b.classList.add('miss'); });
  $('#fb').innerHTML = `<div class="mk ${right ? 'right' : 'wrong'}">
      <p class="verdict">${right ? '✓ Spotted it' : `✗ The danger was <code>${esc(d.tk[hot][0])}</code>`} ${lockBadge(st, LOCK.d)}</p>
      <p>${esc(d.risk)}</p>
      <p class="cs-fix"><b>Write it as:</b> <code>${esc(d.fix)}</code></p>
      <details class="how"><summary>${esc(t.t)} — ${esc(t.m)}</summary>${termDetail(t)}</details>
    </div>${showNext()}`;
  bindNext();
}

function endRun() {
  const R = RUN, miss = [...new Set(R.missed)], k = R.kind;
  const name = id => k === 't' ? `<code>${esc(BYID.get(id).t)}</code> ${esc(BYID.get(id).m)}` : k === 'o' ? `<b>${esc(ORD.get(id).med)}</b> — ${esc(ORD.get(id).read)}`
    : k === 'x' ? esc(SCN.get(id).q) : `<code>${esc(DNG.get(id).tk.find(tk => tk[1])[0])}</code> ${esc(DNG.get(id).risk)}`;
  const P = progress(TERMS, ST), sub = k === 't' ? `${Math.max(0, P.L - R.L0)} newly locked · ${P.part} on the way — right once, locked by one more right answer 10+ minutes from now · ${P.L} of ${TERMS.length} locked in all` : statusLine();
  $('#view').innerHTML = `<div class="card"><div class="qhead"><button class="btn ghost" id="runBack" style="padding:4px 10px">← Back</button><span class="n">Done</span></div>
    <p class="score-hero">${R.right} / ${R.done}</p>
    <p class="score-sub">${esc(sub)}</p>
    ${miss.length ? `<div class="lsec">To redo · ${miss.length}</div><div class="cs-list">${miss.map(id => `<div class="krow">${name(id)}</div>`).join('')}</div>` : '<p style="text-align:center">Nothing missed.</p>'}
    ${miss.length ? `<button class="btn primary wide" id="redoB">Redo the ${miss.length} you missed</button>` : ''}
    <button class="btn ${miss.length ? '' : 'primary '}wide" id="againB">Another round</button>
    <button class="btn ghost wide" id="doneB">← Back</button></div>`;
  $('#runBack').onclick = leaveRun; $('#doneB').onclick = leaveRun;
  $('#againB').onclick = () => R.again();
  const rb = $('#redoB'); if (rb) rb.onclick = () => k === 't' ? startTerms('all', miss) : startItems(k, miss);
  window.scrollTo(0, 0);
}

/* keyboard: number keys pick, Enter moves on */
document.addEventListener('keydown', e => {
  if (!RUN || e.target.matches('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter') { const b = $('#nextB'); if (b) { e.preventDefault(); b.click(); } return; }
  const n = parseInt(e.key, 10); if (!(n >= 1 && n <= 9)) return;
  const b = document.querySelectorAll('.cs-opts .opt:not(:disabled), .dtok:not(:disabled)')[n - 1]; if (b) { e.preventDefault(); b.click(); }
});

/* ── chrome ── */
{ document.documentElement.style.setProperty('--tool', CS.hue);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${CS.hue}"/><text x="32" y="45" font-size="38" text-anchor="middle">💬</text></svg>`;
  const l = document.createElement('link'); l.rel = 'icon'; l.href = 'data:image/svg+xml,' + encodeURIComponent(svg); document.head.appendChild(l);
  $('#backLink').textContent = '‹ ' + CS.back;
  document.title = 'Chart Speak · ' + CS.short; }
if (LS('theme') === 'light') document.documentElement.dataset.theme = 'light';
$('#themeBtn').onclick = () => { const r = document.documentElement, to = r.dataset.theme === 'light' ? '' : 'light';
  to ? r.dataset.theme = 'light' : delete r.dataset.theme; SV('theme', to); };
$('#helpBtn').onclick = () => {
  const n = k => TERMS.filter(t => (t.k || 'ward') === k).length;
  $('#help').innerHTML = `<h2 style="margin-top:0">What is this?</h2>
  <p><b>Chart Speak</b> teaches you to read a medication chart before you meet one on placement: every abbreviation, symbol and term you are likely to see on an NZ med chart and in the notes around it — <b>${TERMS.length}</b> of them in ${CATS.length} topics — plus <b>${ORDERS.length}</b> real-looking orders to decode, <b>${DANGERS.length}</b> dangerous ways of writing to spot, and <b>${SCENES.length}</b> chart-rule scenarios.</p>
  <h3>The four drills</h3>
  <p><b>🔤 Terms & abbreviations</b> — a term as a chart writes it; pick what it means (and, once you have seen it, the other way round). The wrong options are the real traps (BD beside TDS, SC beside SL, mg beside mcg). What you miss comes back a few questions later and leads your next run; <b>2 right in a row locks a term</b> (the second at least 10 minutes after the first), and a locked term comes back after a week to check it stuck.</p>
  <p><b>📋 Read the chart</b> — a whole order, laid out like a chart line. Three of the four readings get exactly one thing wrong, so you have to read every part. <b>⚠️ Spot the danger</b> — tap the one part of an order that is written dangerously. <b>🧭 Chart rules & codes</b> — which section an order goes in, which not-given code goes in the dose box, and the rules around them.</p>
  <h3>Where it comes from</h3>
  <p>📌 <b>${n('must')}</b> are on the course’s own Must-Know abbreviations list (Concepts (2), slides 77–80) — know these cold. 📘 <b>${n('deck')}</b> come from the course’s decks, each naming its slide; the pharmacology words use the decks’ own definitions, the same ones the Joan-format short answers teach. 🏥 <b>${n('ward')}</b> are everyday NZ ward usage in this tool’s words, and ⚠️ <b>${n('safe')}</b> come from the international error-prone list — where your hospital’s list says different, <b>your hospital wins</b>. The not-given codes are the letters used on the national charts; your chart prints its own key.</p>
  <p><b>Not a dosing guide.</b> The orders use typical adult doses so they look like a real chart. They are practice in reading only — the chart, the NZ Formulary and your preceptor decide what is given.</p>
  <h3>Your data</h3>
  <p>Progress lives in this browser only, under the Paper Sim’s own name, and the Paper Sim’s home row shows a one-line summary of it. Nothing is sent anywhere. Clearing site data wipes it.</p>
  <h3>For whoever maintains this</h3>
  <p>Built by <code>node build-terms.mjs</code> from <code>content/terms/*.js</code> (the schema is at the top of <code>content/terms/index.js</code>) and <code>terms-engine.mjs</code>, into <code>terms-template.html</code>, with the Paper Sim’s stylesheet copied in from <code>template.html</code>. The build fails on a broken reference, a meaning shared by two terms that could meet in one question, a danger line with more than one dangerous part, or any question it can deal that shows its answer twice, repeats an option, or offers two right answers — it deals every one to check. Built ${esc(CS.built)}.</p>
  <button class="btn primary wide" onclick="this.closest('dialog').close()">Close</button>`;
  $('#help').showModal(); };
save();
render(curScr());
