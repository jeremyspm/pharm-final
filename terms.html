<script>
const CS = {"built":"2026-09-26","prefix":"phf.","hue":"#ea580c","kick":"Intro to Pharmacology · 722.544","short":"Pharm Paper Sim","back":"Pharm Final exam · Paper Sim","cats":[{"id":"when","n":"When & how often","ic":"⏰","d":"OD, BD, TDS, QID, PRN, stat, mane, nocte — plus 24-hour time and 3/7-style durations."},{"id":"route","n":"Routes","ic":"💉","d":"PO, SL, SC, IM, IV, PR and every other way a medicine gets in."},{"id":"form","n":"Forms & release","ic":"💊","d":"tab, cap, susp, supp, MDI — and the SR, MR and EC tablets you never crush."},{"id":"unit","n":"Doses, units & rates","ic":"⚖️","d":"mg vs mcg, units, mmol, mg/kg, drops/min, 1:1000 — and the course’s calculation words."},{"id":"chart","n":"The chart itself","ic":"📋","d":"NHI, ADR, NKDA, the chart’s sections, the not-given codes and the rules for charting."},{"id":"safe","n":"Danger list","ic":"⚠️","d":"Ways of writing that have hurt people — what they mean, and what to write instead."},{"id":"iv","n":"IV, lines, tubes & oxygen","ic":"🩸","d":"PIVC, PICC, KVO, NaCl 0.9%, IDC, nasal prongs, target SpO₂."},{"id":"obs","n":"Obs & labs","ic":"📈","d":"What you check before you give — BP, HR, RR, BGL, INR, K⁺, eGFR."},{"id":"notes","n":"Notes shorthand","ic":"🗒","d":"Hx, Dx, c/o, NBM, #NOF, ?UTI, AF, CKD — the rest of the chart."},{"id":"pharm","n":"Pharmacology words","ic":"🧪","d":"The course’s own definitions: half-life, bioavailability, agonist, contraindication…"},{"id":"law","n":"Law, regulators & roles","ic":"🏛","d":"Medsafe, PHARMAC, CARM, Class A/B/C, standing orders, who can prescribe."}],"prompts":{"abbr":["On a chart, this means…","How is this written on a chart?"],"term":["What does it mean?","Which word is this?"],"when.clock":["In 24-hour time, this is…","How is this written in 24-hour time?"],"when.dur":["In the notes, this means…","How is this written in NZ shorthand?"],"chart.code":["In a dose box, this code means…","Which code goes in the dose box?"],"safe.pinch":["In A PINCH, this letter stands for…","Which letter of A PINCH is this?"],"safe.sym":["On a chart, this symbol means…","Which symbol is this?"]},"terms":[{"c":"when","s":"freq","id":"od","t":"OD","a":["od","o.d."],"m":"Once a day","g":"once","k":"must","also":["safe"],"x":"Latin omni die, “every day”. It is on the course list, so you must be able to read it — but many charting standards now say write “daily” instead.","w":"Error-prone: OD is also Latin for the right eye (oculus dexter), and in the notes “OD” means overdose. Write “daily”.","cf":["bd","q4h"]},{"c":"when","s":"freq","id":"bd","t":"BD","a":["bd","bid","BID","b.d.","b.i.d."],"m":"Twice a day","k":"must","x":"Latin bis die / bis in die. One morning and one evening dose, e.g. 0800 and 2000 — your ward sets the exact times. Not quite the same as q12h, which runs by the clock.","eg":"Metformin 500 mg PO BD","cf":["tds","od","q12h"]},{"c":"when","s":"freq","id":"tds","t":"TDS","a":["tds","tid","TID","t.d.s.","t.i.d."],"m":"Three times a day","k":"must","x":"Latin ter die sumendum, “to be taken three times a day”. Spread through the waking day, e.g. 0800, 1400 and 2000; your ward sets the times.","eg":"Amoxicillin 500 mg PO TDS","cf":["bd","qid","q8h"]},{"c":"when","s":"freq","id":"qid","t":"QID","a":["qid","qds","QDS","q.i.d."],"m":"Four times a day","k":"must","x":"Latin quater in die. Four doses spread through the waking day, e.g. 0800, 1200, 1600 and 2000. Not the same as q6h, which is every 6 hours around the clock (and wakes people up).","eg":"Paracetamol 1 g PO QID","cf":["q4h","tds","q6h"]},{"c":"when","s":"freq","id":"q4h","t":"q4h","a":["qqh","4-hourly","4 hrly","4H"],"m":"Every 4 hours","k":"must","x":"q is Latin quaque, “every”; qqh is quaque quarta hora, “every fourth hour” — both on the course list. Around the clock, so up to 6 doses in 24 hours: on a PRN order, check the 24-hour maximum before every dose.","eg":"Oxycodone 5 mg PO q4h PRN pain","cf":["qid","q6h","q2h"]},{"c":"when","s":"freq","id":"q2h","t":"q2h","a":["2-hourly","2 hrly"],"m":"Every 2 hours","x":"By the clock. The same idea shows up in the notes as “turns 2/24” — reposition every 2 hours.","cf":["q4h","hrly"]},{"c":"when","s":"freq","id":"q6h","t":"q6h","a":["6-hourly","6 hrly"],"m":"Every 6 hours","x":"By the clock, day and night — e.g. 0600, 1200, 1800 and 2400. Four doses, like QID, but QID is spread through the waking day instead.","cf":["qid","q4h","q8h"]},{"c":"when","s":"freq","id":"q8h","t":"q8h","a":["8-hourly","8 hrly"],"m":"Every 8 hours","x":"By the clock — e.g. 0600, 1400 and 2200. Common for IV antibiotics, where keeping the blood level steady matters. q means “every”: q8h is 3 doses a day, not 8.","eg":"Cefazolin 2 g IV q8h","cf":["tds","q6h","q12h"]},{"c":"when","s":"freq","id":"q12h","t":"q12h","a":["12-hourly","12 hrly"],"m":"Every 12 hours","x":"By the clock — e.g. 0800 and 2000. BD is similar, but BD follows the ward’s set times.","cf":["bd","q8h"]},{"c":"when","s":"freq","id":"hrly","t":"hrly","a":["1-hourly","q1h","hourly"],"m":"Every hour","x":"Also a suffix: “4 hrly” = every 4 hours. “Hrly obs” = observations every hour.","cf":["q2h","stat"]},{"c":"when","s":"freq","id":"prn","t":"PRN","a":["prn","p.r.n."],"m":"When required — only if needed","k":"must","x":"Latin pro re nata, “as the occasion arises” (the course list: “if necessary”). A PRN order must say what it is for and the most you may give in 24 hours. You assess before you give it and evaluate after — and Joan called PRN an ethical problem, because “as necessary” rests on the nurse’s judgement.","eg":"Paracetamol 1 g PO q4h PRN pain — max 4 g/24 h","src":"Must Know list; Joan’s Legal & Ethical lecture 16 Sep 2026 [1:01:28]","cf":["stat","od"]},{"c":"when","s":"freq","id":"stat","t":"stat","a":["STAT"],"m":"Immediately — one dose, now","k":"must","x":"Latin statim, “at once” (the course list: “immediately”). A one-off dose, written in the once-only section of the chart and given straight away.","eg":"Adrenaline 0.5 mg IM stat","cf":["prn","od"]},{"c":"when","s":"freq","id":"altdie","t":"alt die","a":["alternate days"],"m":"Every second day","g":"altday","x":"Latin alternis diebus. Clearest written out — “every second day”, or the actual days. The American form QOD is on the danger list.","cf":["od","bd"]},{"c":"when","s":"day","id":"mane","t":"mane","a":["MANE","o.m."],"m":"In the morning","k":"must","x":"Latin for “in the morning”. On most charts, the 0800 round.","eg":"Furosemide 40 mg PO mane","cf":["nocte","midi"]},{"c":"when","s":"day","id":"midi","t":"midi","m":"At midday","x":"The midday round, e.g. 1200. Seen on NZ and Australian charts beside mane and nocte.","cf":["mane","nocte"]},{"c":"when","s":"day","id":"nocte","t":"nocte","a":["NOCTE","o.n."],"m":"At night","k":"must","x":"Latin for “at night”. Usually the evening or bedtime round, e.g. 2000 or 2200 — your ward sets the time.","eg":"Atorvastatin 40 mg PO nocte","cf":["mane","midi"]},{"c":"when","s":"meal","id":"ac","t":"ac","a":["a.c.","AC"],"m":"Before meals","k":"must","x":"Latin ante cibum, “before food” — often 30–60 minutes before eating, for medicines that absorb better on an empty stomach, or that have to be in place before food arrives (e.g. mealtime insulin, which is time-critical).","cf":["pc"]},{"c":"when","s":"meal","id":"pc","t":"pc","a":["p.c.","PC"],"m":"After meals","k":"must","x":"Latin post cibum, “after food” — for medicines that upset an empty stomach or absorb better with food.","cf":["ac"]},{"c":"when","s":"meal","id":"cum","t":"c̄","m":"With","x":"Latin cum. “c̄ food” = with food. The bar over the c is easy to miss — clearer written as “with”.","cf":["sine"]},{"c":"when","s":"meal","id":"sine","t":"s̄","m":"Without","x":"Latin sine. “s̄ food” = without food. Clearer written as “without”.","cf":["cum"]},{"c":"when","s":"meal","id":"adlib","t":"ad lib","a":["ad libitum"],"m":"Freely — as much as wanted","x":"Latin ad libitum. Mostly for food and drink: “fluids ad lib” means drink as much as you like.","cf":["prn"]},{"c":"when","s":"dur","id":"d24","t":"3/24","m":"3 hours","x":"“/24” counts hours: “review in 3/24” = in 3 hours. As a frequency it means that often: “obs 4/24” = 4-hourly observations, “turns 2/24” = every 2 hours.","cf":["d7","d52","d12"]},{"c":"when","s":"dur","id":"d7","t":"3/7","m":"3 days","x":"“/7” counts days (out of a week): “amoxicillin × 5/7” = for 5 days; “day 2/7” = day 2 of 7.","cf":["d24","d52","d12"]},{"c":"when","s":"dur","id":"d52","t":"3/52","m":"3 weeks","x":"“/52” counts weeks (out of a year): “review in 2/52” = in 2 weeks.","cf":["d7","d12","d24"]},{"c":"when","s":"dur","id":"d12","t":"3/12","m":"3 months","x":"“/12” counts months: “follow-up in 6/12” = in 6 months; a “3/12 history” = 3 months’ history.","cf":["d52","d7","d24"]},{"c":"when","s":"clock","id":"t0600","t":"0600","m":"6 am","k":"deck","src":"Med Admin (1) slide 32 (“Always use 24-hour time”)","cf":["t1800"]},{"c":"when","s":"clock","id":"t0800","t":"0800","m":"8 am","k":"deck","src":"Med Admin (1) slide 32","cf":["t2000"]},{"c":"when","s":"clock","id":"t1200","t":"1200","m":"Midday (noon)","k":"deck","src":"Med Admin (1) slide 32","cf":["t2400"],"x":"1200 is midday; midnight is 2400 (or 0000). “12 am / 12 pm” is exactly the confusion 24-hour time exists to stop."},{"c":"when","s":"clock","id":"t1400","t":"1400","m":"2 pm","k":"deck","src":"Med Admin (1) slide 32","cf":["t2200"],"x":"After 1200, take 12 away: 1400 − 12 = 2 pm."},{"c":"when","s":"clock","id":"t1800","t":"1800","m":"6 pm","k":"deck","src":"Med Admin (1) slide 32","cf":["t0600"]},{"c":"when","s":"clock","id":"t2000","t":"2000","m":"8 pm","k":"deck","src":"Med Admin (1) slide 32","cf":["t0800"]},{"c":"when","s":"clock","id":"t2200","t":"2200","m":"10 pm","k":"deck","src":"Med Admin (1) slide 32","cf":["t1400"]},{"c":"when","s":"clock","id":"t2400","t":"2400","a":["0000"],"m":"Midnight","k":"deck","src":"Med Admin (1) slide 32","cf":["t1200"],"x":"Midnight is written 2400 (the end of a day) or 0000 (the start of the next) — both mean the same moment."},{"c":"route","s":"mouth","id":"po","t":"PO","a":["po","p.o."],"m":"By mouth (swallowed)","k":"must","x":"Latin per os. Enteral — absorbed from the gut, and it passes through the liver before reaching the body (the first-pass effect), which is why oral doses are often bigger than IV ones.","cf":["pr","sl"]},{"c":"route","s":"mouth","id":"sl","t":"SL","a":["s/l"],"m":"Under the tongue (sublingual)","k":"must","x":"Dissolves under the tongue and goes straight into the blood, skipping the liver — fast. The deck’s example: GTN spray for angina.","src":"Must Know list; Pharmacology Concepts (2) 2026, slide 31","cf":["bucc","sc"]},{"c":"route","s":"mouth","id":"bucc","t":"BUCC","a":["buccal"],"m":"Between the cheek and gum (buccal)","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 31","x":"Absorbed through the lining of the cheek. The deck’s example: nicotine gum.","cf":["sl"]},{"c":"route","s":"inj","id":"sc","t":"SC","a":["subcut","S/C","SUBCUT","sc","subcut."],"m":"Under the skin (subcutaneous)","g":"subcut","k":"must","also":["safe"],"x":"Into the fatty tissue just under the dermis — e.g. insulin and enoxaparin. Slower and less reliable than IM, small volumes only.","w":"The course list writes SC, so you must read it — but handwritten SC can look like SL (under the tongue). Many charting standards ask for “subcut”.","cf":["sl","im","id"]},{"c":"route","s":"inj","id":"im","t":"IM","a":["i.m."],"m":"Into a muscle (intramuscular)","k":"must","x":"Absorbed from the blood vessels running through the muscle. The deck’s examples: a Depo-Provera injection, and an adrenaline auto-injector into the thigh.","cf":["iv","sc"]},{"c":"route","s":"inj","id":"iv","t":"IV","a":["i.v."],"m":"Into a vein (intravenous)","k":"must","x":"Straight into the bloodstream: no absorption needed, 100% bioavailable, onset immediate — and very hard to take back once it is in.","cf":["im","io"]},{"c":"route","s":"inj","id":"id","t":"ID","a":["intradermal"],"m":"Into the skin itself (intradermal)","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 42","x":"Into the dermis, just under the epidermis. The deck’s examples: allergy antigen testing and the TB vaccine.","cf":["sc"]},{"c":"route","s":"spine","id":"it","t":"IT","a":["intrathecal"],"m":"Into the fluid around the spinal cord (intrathecal)","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 44","x":"Into the subarachnoid space, bypassing the blood–brain barrier — e.g. spinal anaesthesia. Specialists only.","cf":["epid"]},{"c":"route","s":"spine","id":"epid","t":"EPID","a":["epidural"],"m":"Into the space outside the spinal membranes (epidural)","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 44","x":"e.g. labour or post-op pain relief through a fine catheter. Not the same space as intrathecal.","cf":["it"]},{"c":"route","s":"inj","id":"io","t":"IO","m":"Into the bone marrow (intraosseous)","x":"A needle into the marrow of a bone, in an emergency when no vein can be found — anything that can go IV can go IO.","cf":["iv"]},{"c":"route","s":"inj","id":"ia","t":"IA","m":"Into a joint (intra-articular)","x":"e.g. a steroid injection into a knee. IA is also used for intra-arterial, which is why it is safer written in full.","cf":["im"]},{"c":"route","s":"other","id":"pr","t":"PR","a":["p.r."],"m":"Into the rectum","k":"must","x":"Latin per rectum — suppositories and enemas.","w":"Same letters, different chart: on an obs chart PR means pulse rate.","cf":["pv","po"]},{"c":"route","s":"other","id":"pv","t":"PV","a":["p.v."],"m":"Into the vagina","x":"Latin per vaginam — pessaries and creams. In the notes, “PV bleed” = vaginal bleeding.","cf":["pr"]},{"c":"route","s":"lung","id":"inh","t":"INH","a":["inhal.","inhaled"],"m":"Breathed in from an inhaler","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 49","x":"The lungs have a huge surface with capillaries right beside the alveoli, so absorption is fast. The medicine has to be a gas or a fine mist.","cf":["neb"]},{"c":"route","s":"lung","id":"neb","t":"NEB","a":["neb","nebs","nebulised"],"m":"Breathed in as a mist from a nebuliser","x":"A machine turns a liquid (from a nebule) into a mist, breathed in through a mask or mouthpiece over several minutes — e.g. in an asthma attack.","cf":["inh"]},{"c":"route","s":"tube","id":"ng","t":"NG","a":["via NG","NGT"],"m":"Down a tube through the nose into the stomach","x":"Nasogastric. Only liquids or medicines a pharmacist has cleared for crushing go down it, flushed before and after.","cf":["peg","nj"]},{"c":"route","s":"tube","id":"nj","t":"NJ","m":"Down a tube through the nose into the small bowel","x":"Nasojejunal — past the stomach into the jejunum. Check with the pharmacist: some medicines need the stomach to work.","cf":["ng","peg"]},{"c":"route","s":"tube","id":"peg","t":"PEG","m":"Down a tube through the belly wall into the stomach","x":"Percutaneous endoscopic gastrostomy — a long-term feeding tube. Same crushing and flushing rules as an NG tube.","cf":["ng","nj"]},{"c":"route","s":"skin","id":"top","t":"TOP","a":["top.","topical"],"m":"Onto the skin or a mucous membrane (topical)","k":"deck","src":"Pharmacology Concepts (2) 2026, slides 26–27","x":"Creams, ointments, eye and ear drops — mostly a local effect at the site.","cf":["td"]},{"c":"route","s":"skin","id":"td","t":"TD","a":["transdermal"],"m":"Through the skin from a patch, into the blood (transdermal)","x":"A systemic effect that skips the liver. Record where and when each patch went on, and take the old one off.","cf":["top"]},{"c":"route","s":"group","kd":"term","id":"enteral","t":"enteral","m":"Through the gut (the GI tract)","k":"deck","src":"Pharmacology Concepts (2) 2026, slides 26–27","x":"The oral route and tube feeds (NG, PEG) are enteral. The course’s five route groups: oral (enteral), parenteral, rectal, inhalation and topical.","cf":["parenteral"]},{"c":"route","s":"group","kd":"term","id":"parenteral","t":"parenteral","m":"Not through the gut — usually by injection","k":"deck","src":"Pharmacology Concepts (2) 2026, slides 26–27","x":"IV, IM, subcut, intradermal, intrathecal and epidural are all parenteral.","cf":["enteral"]},{"c":"form","s":"solid","id":"tab","t":"tab","a":["tabs","tab."],"m":"Tablet","k":"deck","src":"Pharmacology Concepts (2) 2026, slides 62–63; Med Admin (1) slide 30","x":"Compressed powder plus excipients (binders, fillers, disintegrators, lubricants). Only halve one that has a score line, with a tablet cutter.","cf":["cap"]},{"c":"form","s":"solid","id":"cap","t":"cap","a":["caps"],"m":"Capsule","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 67","x":"Medicine inside a gelatine shell — hard (a powder inside) or soft, a “softgel” (a liquid inside). The gelatine matters to vegetarian and some religious patients.","cf":["tab"]},{"c":"form","s":"solid","kd":"term","id":"scored","t":"scored tablet","m":"Has a break line — the only kind you may cut in half","k":"deck","src":"Med Admin (1) slide 30","x":"Cut it with a tablet cutter, never a knife. And check with a pharmacist before crushing anything.","cf":["ec"]},{"c":"form","s":"solid","id":"odt","t":"ODT","a":["wafer"],"m":"Melts on the tongue — no water needed","x":"Orally disintegrating tablet. Handy for someone who is nauseated or cannot swallow tablets.","cf":["disp","eff"]},{"c":"form","s":"solid","id":"disp","t":"disp","a":["dispersible"],"m":"Dispersible — stir into water first","cf":["eff","odt"]},{"c":"form","s":"solid","id":"eff","t":"eff","a":["effervescent"],"m":"Effervescent — fizzes as it dissolves in water","cf":["disp"]},{"c":"form","s":"solid","id":"loz","t":"loz","a":["lozenge"],"m":"Lozenge — dissolved slowly in the mouth","cf":["odt"]},{"c":"form","s":"liquid","id":"susp","t":"susp","m":"Suspension — particles floating in liquid; shake it first","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 61","x":"The drug does not dissolve — shake well before measuring or the dose will be wrong.","cf":["soln","syr"]},{"c":"form","s":"liquid","id":"soln","t":"soln","a":["sol."],"m":"Solution — drug fully dissolved in a liquid","cf":["susp"]},{"c":"form","s":"liquid","id":"syr","t":"syr","m":"Syrup — a sweet, thick liquid","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 61","cf":["elix","susp"]},{"c":"form","s":"liquid","id":"elix","t":"elix","m":"Elixir — a sweetened liquid containing alcohol","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 61","x":"Fastest to absorb → slowest: elixirs and syrups → suspensions → powders → capsules → tablets → coated tablets. Liquids have nothing to break down first.","cf":["syr"]},{"c":"form","s":"liquid","id":"mixt","t":"mixt","a":["mixture","liq","oral liquid"],"m":"Mixture — a liquid medicine to swallow","cf":["soln"]},{"c":"form","s":"other","id":"supp","t":"supp","m":"Suppository — inserted into the rectum","cf":["pess"]},{"c":"form","s":"other","id":"pess","t":"pess","m":"Pessary — inserted into the vagina","cf":["supp"]},{"c":"form","s":"other","id":"oint","t":"oint","a":["ung"],"m":"Ointment — a greasy preparation","x":"Greasier than a cream: stays on the skin longer. Eye ointments are common too.","cf":["gtt"]},{"c":"form","s":"other","id":"gtt","t":"gtt","a":["gtts","gutt."],"m":"Drops","k":"deck","src":"Medication Calculations 2026 slide 68 (gtt/mL, gtt/min)","x":"Latin guttae. Eye drops were written “gutt.” on older charts; in drip-rate maths, gtt/min = drops per minute.","cf":["oint"]},{"c":"form","s":"inj","id":"inj","t":"inj","a":["inj."],"m":"Injection","cf":["amp"]},{"c":"form","s":"inj","id":"amp","t":"amp","a":["ampoule","ampule"],"m":"Ampoule — a sealed, single-use glass container","cf":["vial"]},{"c":"form","s":"inj","kd":"term","id":"vial","t":"vial","m":"A rubber-topped bottle for injection — single or multi-dose","cf":["amp"]},{"c":"form","s":"inj","id":"pfs","t":"PFS","m":"Prefilled syringe","x":"Ready to give — e.g. enoxaparin comes this way.","cf":["amp"]},{"c":"form","s":"inj","kd":"term","id":"depot","t":"depot","m":"A long-acting injection that releases over weeks","k":"deck","src":"Pharmacology Concepts (2) 2026, slides 38–41","x":"Usually IM. The deck’s example: Depo-Provera, contraception for 13 weeks.","cf":["la"]},{"c":"form","s":"lung","id":"mdi","t":"MDI","a":["pMDI","puffer"],"m":"Metered-dose inhaler — a “puffer”","x":"A pressurised canister that sprays a measured dose each puff — works best through a spacer.","cf":["dpi"]},{"c":"form","s":"lung","id":"dpi","t":"DPI","m":"Dry-powder inhaler","x":"Breath-activated: the patient breathes the powder in fast and deep. No spacer.","cf":["mdi"]},{"c":"form","s":"lung","kd":"term","id":"spacer","t":"spacer","m":"A chamber fitted to a puffer so more of the dose reaches the lungs","cf":["nebule"]},{"c":"form","s":"lung","kd":"term","id":"nebule","t":"nebule","m":"A single-dose plastic ampoule of liquid, to be turned into a mist","cf":["spacer"]},{"c":"form","s":"release","id":"ir","t":"IR","m":"Immediate release — the whole dose at once","x":"The opposite of SR/MR. Some medicines come in both, so the chart must say which — an IR dose given as MR (or the reverse) is a real error.","cf":["sr","ec"]},{"c":"form","s":"release","id":"sr","t":"SR","m":"Slow (sustained) release","g":"slow","x":"Releases the dose over many hours, so it can be given less often.","w":"Never crush or chew: the whole dose comes out at once.","cf":["ir","ec"]},{"c":"form","s":"release","id":"mr","t":"MR","m":"Modified release","g":"slow","x":"The umbrella term for a tablet built to release slowly or late.","w":"Never crush or chew.","cf":["ir","ec"]},{"c":"form","s":"release","id":"cr","t":"CR","m":"Controlled release","g":"slow","w":"Never crush or chew.","cf":["ir","ec"]},{"c":"form","s":"release","id":"xr","t":"XR","a":["ER","XL"],"m":"Extended release","g":"slow","w":"Never crush or chew.","cf":["ir","ec"]},{"c":"form","s":"release","id":"la","t":"LA","m":"Long-acting","g":"slow","x":"A long-acting tablet or injection. Careful: in the notes LA usually means local anaesthetic.","cf":["ir","depot"]},{"c":"form","s":"release","id":"ec","t":"EC","m":"Enteric coated — dissolves in the intestine, not the stomach","k":"deck","src":"Pharmacology Concepts (2) 2026, slide 66","x":"The coating protects the drug from stomach acid, protects the stomach from the drug, or delays the action.","w":"Never crush: it destroys the coating.","cf":["sr","ir"]},{"c":"unit","s":"mass","id":"mg","t":"mg","m":"Milligram — a thousandth of a gram","k":"deck","src":"Medication Calculations 2026, slides 19–26","x":"1 g = 1000 mg. The course checklist: are the units the same? If not, convert before the formula.","cf":["mcg","g"]},{"c":"unit","s":"mass","id":"mcg","t":"mcg","a":["microgram","micrograms"],"m":"Microgram — a thousandth of a milligram","g":"mcg","k":"deck","src":"Medication Calculations 2026, slides 23–24","x":"1 mg = 1000 mcg. The deck’s example: digoxin 0.25 mg = 250 mcg, so 62.5 mcg tablets × 4.","w":"Never write µg — a handwritten µ looks like an m, and the dose becomes 1000 times bigger.","cf":["mg"]},{"c":"unit","s":"mass","id":"g","t":"g","a":["gram","grams"],"m":"Gram — 1000 milligrams","k":"deck","src":"Medication Calculations 2026, slides 25–26","x":"Paracetamol 1 g = 1000 mg = two 500 mg tablets (the deck’s example).","cf":["mg","kg"]},{"c":"unit","s":"mass","id":"kg","t":"kg","m":"Kilogram — 1000 grams","x":"Body weight in kg drives every per-kg dose, so the weight on the chart has to be a real one.","cf":["g"]},{"c":"unit","s":"vol","id":"ml","t":"mL","a":["ml"],"m":"Millilitre — a thousandth of a litre","g":"ml","x":"Liquids and injections are measured in mL. Write mL, never cc.","cf":["l"]},{"c":"unit","s":"vol","id":"l","t":"L","a":["litre"],"m":"Litre — 1000 mL","k":"deck","src":"Medication Calculations 2026, slides 73–74","x":"The drip-rate formula needs mL, so convert first: 1 L = 1000 mL (the deck’s example).","cf":["ml"]},{"c":"unit","s":"other","id":"mmol","t":"mmol","m":"Millimole — how electrolytes like potassium are dosed","x":"e.g. potassium chloride is charted in mmol. Blood results come back in mmol/L (potassium 4.1 mmol/L, glucose 6.5 mmol/L).","cf":["units"]},{"c":"unit","s":"other","id":"units","t":"units","m":"The dose measure for insulin and heparin","g":"units","x":"Always written out in full.","w":"Never “U” or “IU”: U can be read as 0 or 4, IU as IV or 10.","cf":["mmol"]},{"c":"unit","s":"rate","id":"mgkg","t":"mg/kg","m":"Milligrams for every kilogram of body weight","k":"deck","src":"Medication Calculations 2026, slides 39–40","x":"Read “/” as “per”. Dose = mg/kg × weight: the deck’s example, 10 mg/kg × 30 kg = 300 mg.","cf":["mgkgday"]},{"c":"unit","s":"rate","id":"mgkgday","t":"mg/kg/day","m":"The whole day’s dose per kg — then split into doses","k":"deck","src":"Medication Calculations 2026, slides 48–49","x":"Three steps: day’s dose, then single dose, then tablets. The deck’s example: 40 kg × 1 mg/kg/day = 40 mg a day; in 2 doses = 20 mg each; 5 mg tablets → 4 tablets.","cf":["mgkg"]},{"c":"unit","s":"rate","id":"mlh","t":"mL/h","a":["mL/hr","ml/hr"],"m":"Millilitres per hour — the rate an infusion pump is set to","k":"deck","src":"Medication Calculation Student Guide 2026 (Topics Covered)","x":"Pumps run in mL/h. The Student Guide lists IV flow rate (mL/hr) as examinable, but the 2026 deck only teaches drops per minute — ask your kaiako.","cf":["gttmin"]},{"c":"unit","s":"rate","id":"gttmin","t":"drops/min","a":["gtt/min"],"m":"Drip rate — how fast the drip is set to run","k":"deck","src":"Medication Calculations 2026, slides 66–69","x":"Drops/min = (volume in mL × drop factor) ÷ (hours × 60). Do the top and the bottom first, then divide. Round it: .5 and above up, .4 and below down.","cf":["gttml","mlh"]},{"c":"unit","s":"rate","id":"gttml","t":"drops/mL","a":["gtt/mL"],"m":"Drop factor — the size of each drop, fixed by the giving set","k":"deck","src":"Medication Calculations 2026, slide 68","x":"Fixed by the type of giving set, and always given to you — the course’s examples use 20 and 60 drops/mL. You never calculate it.","cf":["gttmin"]},{"c":"unit","s":"strength","id":"pct","t":"%","a":["% w/v"],"m":"Grams in every 100 mL","x":"Glucose 5% = 5 g in every 100 mL; sodium chloride 0.9% = 0.9 g in every 100 mL. In a drip-rate question the % is a red herring.","cf":["r1000"]},{"c":"unit","s":"strength","id":"r1000","t":"1:1000","m":"1 mg in every 1 mL","k":"deck","src":"Medication Calculations 2026, slides 57–63","x":"Literally 1 g in 1000 mL = 1000 mg in 1000 mL = 1 mg/mL. The strength of adrenaline given IM for anaphylaxis.","cf":["r10000","pct"]},{"c":"unit","s":"strength","id":"r10000","t":"1:10 000","a":["1:10,000","1:10000"],"m":"1 mg in every 10 mL (0.1 mg/mL)","x":"Ten times weaker than 1:1000 — the adrenaline strength used IV in a cardiac arrest. Mixing the two up is a classic, sometimes fatal, error.","cf":["r1000"]},{"c":"unit","s":"calc","kd":"term","id":"stock","t":"stock strength","m":"What you have GOT — the medicine on hand, e.g. 500 mg per tablet","k":"deck","src":"Medication Calculations 2026, slides 15–18","x":"The course formula: (what you WANT ÷ what you have GOT) × VOLUME. Want = prescribed/charted; got = stock; volume = what the stock comes in (1 tablet, 5 mL).","cf":["redherring"]},{"c":"unit","s":"calc","kd":"term","id":"redherring","t":"red herring","m":"A number in the question that plays no part in the sum","k":"deck","src":"Medication Calculations 2026, slide 102","x":"The deck’s two examples: the % of an IV fluid when you want a drip rate, and “tds” when you want one single dose.","cf":["stock"]},{"c":"unit","s":"calc","kd":"term","id":"divided","t":"divided doses","m":"The day’s total split into equal parts","k":"deck","src":"Medication Calculations 2026, slides 48–49","cf":["mgkgday"]},{"c":"unit","s":"calc","id":"bsa","t":"BSA","m":"Body surface area (m²) — used for some doses","k":"deck","src":"Med Admin (1) 2026, slide 51","x":"Worked out from height and weight; used for chemotherapy and some children’s doses. The chart records it when it matters.","cf":["wt"]},{"c":"chart","s":"id","id":"nmc","t":"NMC","m":"National Medication Chart — NZ’s standard hospital medicine chart","k":"deck","src":"Med Admin (1) 2026, slides 51–55","x":"Published by the Health Quality & Safety Commission. Some hospitals chart electronically instead; the same rules apply.","cf":["emar"]},{"c":"chart","s":"id","id":"nhi","t":"NHI","m":"National Health Index number — every NZ patient’s unique ID","k":"deck","src":"Med Admin (1) 2026, slides 27 & 51","x":"On the ID band and the chart. Part of the three-identifier check before any medicine.","cf":["dob"]},{"c":"chart","s":"id","id":"dob","t":"DOB","a":["D.O.B."],"m":"Date of birth","cf":["nhi"]},{"c":"chart","s":"id","id":"adr","t":"ADR","m":"Adverse drug reaction","k":"deck","src":"Med Admin (1) 2026, slide 51; Pharmacodynamics slides 43–44","x":"The chart’s allergies & ADR box lists every known allergy and bad reaction — check it before every first dose.","w":"A blank allergy box is not “no allergies” — it means nobody has asked yet.","cf":["ade","nkda"]},{"c":"chart","s":"id","id":"nka","t":"NKA","m":"No known allergies (of any kind)","k":"must","x":"Still confirm it with the patient before you give anything.","cf":["nkda"]},{"c":"chart","s":"id","id":"nkda","t":"NKDA","m":"No known drug allergies","k":"must","x":"Drug allergies only — the patient may still be allergic to food, latex or plasters. Confirm it by asking.","cf":["nka"]},{"c":"chart","s":"id","id":"wt","t":"Wt","m":"Weight (kg)","k":"deck","src":"Med Admin (1) 2026, slide 51","x":"Needed for every per-kg dose. Daily weights also track fluid, e.g. heart failure on diuretics.","cf":["bsa"]},{"c":"chart","s":"id","id":"emar","t":"eMAR","m":"Electronic medication (administration) record","x":"A computer version of the chart — you scan and sign on screen. The same rights and checks apply.","cf":["nmc"]},{"c":"chart","s":"id","id":"rx","t":"Rx","m":"Prescription — or treatment","x":"From Latin recipe, “take”. In the notes “Rx” often means the treatment plan.","cf":["tx"]},{"c":"chart","s":"sec","kd":"term","id":"secreg","t":"regular medicines","m":"Doses given at set times every day, signed each time","x":"The main part of the chart: each order has its times across the top and a box per dose to sign or code.","cf":["secprn","seconce"]},{"c":"chart","s":"sec","kd":"term","id":"seconce","t":"once-only section","m":"Where stat and single doses are charted","k":"deck","src":"Med Admin (1) 2026, slides 54–55","cf":["secprn","secverbal"]},{"c":"chart","s":"sec","kd":"term","id":"secverbal","t":"verbal order","m":"Given by phone or in person — the prescriber signs it afterwards","k":"deck","src":"Med Admin (1) 2026, slides 13–14 & 54–55","x":"An RN may give a medicine on a verbal order, e.g. a phone order or in an emergency. It has its own section, and the prescriber must sign it within the time your hospital’s policy sets.","cf":["seconce"]},{"c":"chart","s":"sec","kd":"term","id":"secprn","t":"PRN section","m":"Where as-needed medicines go, each with its reason and 24-hour max","k":"deck","src":"Med Admin (1) 2026, slides 54–55","cf":["secreg"]},{"c":"chart","s":"sec","kd":"term","id":"secfluid","t":"fluid & infusion orders","m":"Where drips and bags for a vein are prescribed, with volume and rate","k":"deck","src":"Med Admin (1) 2026, slides 54–55","cf":["seco2"]},{"c":"chart","s":"sec","kd":"term","id":"seco2","t":"oxygen & medical gases","m":"O₂ is a medicine, so it has its own section, with a target range","k":"deck","src":"Med Admin (1) 2026, slides 54–55","x":"Usually with a delivery device, a flow rate and a target saturation range.","cf":["secfluid"]},{"c":"chart","s":"sec","kd":"term","id":"samplesig","t":"sample signature","m":"A specimen of each prescriber’s handwriting, so every order can be traced","k":"deck","src":"Med Admin (1) 2026, slide 53","cf":["checkinit"]},{"c":"chart","s":"sec","kd":"term","id":"checkinit","t":"check initial","m":"What the supervising RN writes beside a dose a student gave","k":"deck","src":"Med Admin (1) 2026, slide 55","x":"The course: student nurses also need the “check” initial.","cf":["samplesig"]},{"c":"chart","s":"code","kd":"term","id":"nonadmin","t":"non-administration code","m":"A letter in the dose box saying why a dose was not given","k":"deck","src":"Med Admin (1) 2026, slide 55","x":"Every dose box gets either a signature or a code — never left blank. The chart prints the key.","cf":["withhold"]},{"c":"chart","s":"code","id":"cA","t":"A","m":"Absent — the patient is off the ward","x":"e.g. in X-ray or theatre when the dose is due. Follow it up when they are back.","cf":["cL"]},{"c":"chart","s":"code","id":"cF","t":"F","m":"Fasting — nil by mouth","x":"e.g. before theatre. Check which medicines should still be given with a sip of water.","cf":["cW"]},{"c":"chart","s":"code","id":"cL","t":"L","m":"On leave","x":"The patient is away from the hospital on approved leave.","cf":["cA"]},{"c":"chart","s":"code","id":"cN","t":"N","m":"Not available — get it, or tell the prescriber","x":"Chase it (pharmacy, another ward) — a missed dose can matter.","cf":["cR"]},{"c":"chart","s":"code","id":"cR","t":"R","m":"Refused — tell the prescriber","x":"Explain the consequences, document the reason, inform the prescriber and the next shift, and discard the dose.","src":"Med Admin (1) 2026, slide 39","cf":["cW"]},{"c":"chart","s":"code","id":"cS","t":"S","m":"Self-administered","x":"The patient manages this medicine themselves, where policy allows.","cf":["cN"]},{"c":"chart","s":"code","id":"cV","t":"V","m":"Vomiting","x":"An oral dose would not stay down. Tell the prescriber — another route may be needed.","cf":["cF"]},{"c":"chart","s":"code","id":"cW","t":"W","m":"Withheld — write the reason in the notes","x":"e.g. a hold parameter was met (“withhold if HR < 60”). Document why and tell the RN or prescriber.","cf":["cR","cF"]},{"c":"chart","s":"rule","kd":"term","id":"charted","t":"charted","a":["written up"],"m":"Prescribed — written up by a prescriber","x":"“Is there any pain relief charted?” = has anything been prescribed? “Can you chart it?” = please prescribe it.","cf":["cease"]},{"c":"chart","s":"rule","kd":"term","id":"cease","t":"cease","m":"Stopped by the prescriber — ruled off, dated and signed","x":"A ceased order is never given again from that line, even if doses are still in the drawer. Write “cease” — not D/C.","cf":["withhold"]},{"c":"chart","s":"rule","kd":"term","id":"withhold","t":"withhold","a":["held"],"m":"Do not give this dose — for a reason you document","x":"e.g. a hold parameter is met, or the patient is nil by mouth. Code W, the reason in the notes, and tell someone if it matters.","cf":["cease"]},{"c":"chart","s":"rule","kd":"term","id":"holdparam","t":"hold parameters","m":"Obs limits written on an order: outside them, the dose is withheld","x":"e.g. “withhold if HR < 60 or SBP < 100” on a heart or blood-pressure medicine — take the obs before you give it.","cf":["withhold"]},{"c":"chart","s":"rule","kd":"term","id":"indication","t":"indication","m":"The reason the medicine was prescribed","k":"deck","src":"Med Admin (1) 2026, slide 40","x":"Right indication is one of the 8 Rights — you must know why you are giving it, above all for PRN medicines.","cf":["contraind"]},{"c":"chart","s":"rule","kd":"term","id":"max24","t":"max … /24 h","m":"The most that may be given in any 24 hours","x":"On a PRN order: “max 4 g/24 h” = never more than 4 g in any 24-hour period. Add up every dose, from every section of the chart (and combination products), before giving another.","cf":["indication"]},{"c":"chart","s":"rule","kd":"term","id":"timecrit","t":"time-critical medicine","m":"One where a late or missed dose can cause harm","k":"deck","src":"Med Admin (1) 2026, slide 32","x":"The deck’s example: insulin before meals. Most hospital lists also include Parkinson’s medicines, IV antibiotics, anticoagulants and anti-epileptics.","cf":["window"]},{"c":"chart","s":"rule","kd":"term","id":"window","t":"30-minute rule","m":"A regular medicine is given within half an hour of its charted time","k":"deck","src":"Med Admin (1) 2026, slide 32","x":"PRN timing is your clinical judgement instead — e.g. a pain assessment before analgesia.","cf":["timecrit"]},{"c":"chart","s":"rule","kd":"term","id":"threechecks","t":"three checks","m":"Label against the chart: before preparing, after preparing, before putting it away","k":"deck","src":"Med Admin (1) 2026, slides 28–29","x":"And only give medicines you prepared yourself.","cf":["threeids"]},{"c":"chart","s":"rule","kd":"term","id":"threeids","t":"three identifiers","m":"Name, date of birth and NHI — checked against the ID band first","k":"deck","src":"Med Admin (1) 2026, slide 27","x":"Ask the patient to state their full name and date of birth; don’t read it out for them to agree with.","cf":["threechecks"]},{"c":"chart","s":"rule","kd":"term","id":"rights","t":"8 Rights + 2 Checks","m":"Patient, medication, dose, time, route, to refuse, indication, documentation — plus expiry and allergies","k":"deck","src":"Med Admin (1) 2026, slide 23","x":"The course teaches 8 Rights and 2 Checks, and says the textbooks’ five rights are not enough to practise safely.","cf":["threechecks"]},{"c":"chart","s":"rule","kd":"term","id":"secondcheck","t":"second check","a":["double check"],"m":"Another nurse independently verifies a high-risk dose before it is given","x":"Your hospital’s policy lists which medicines need one — typically controlled drugs, insulin, IV medicines and anticoagulants — and whether a student can be the second checker (usually not).","cf":["threechecks"]},{"c":"safe","k":"safe","s":"unit","id":"U","t":"U","m":"Units","g":"units","w":"Read as a 0 or a 4: “10U” has been given as 100 units. Write “units”.","cf":["IU","ug"]},{"c":"safe","k":"safe","s":"unit","id":"IU","t":"IU","m":"International units","g":"units","w":"Read as IV, or as 10. Write “units”.","cf":["U","cc"]},{"c":"safe","k":"safe","s":"unit","id":"ug","t":"µg","a":["ug"],"m":"Microgram","g":"mcg","w":"A handwritten µ looks like an m — the dose becomes 1000 times bigger. Write “microgram” or “mcg”.","cf":["U","cc"]},{"c":"safe","k":"safe","s":"unit","id":"cc","t":"cc","m":"Millilitre (cubic centimetre)","g":"ml","w":"Read as “u” or as 00. Write “mL”.","cf":["ug","U"]},{"c":"safe","k":"deck","s":"num","kd":"term","id":"trail","t":"trailing zero","m":"A zero after a decimal point — “5.0 mg” can be read as 50 mg","src":"Med Admin (2) 2026 slide 6 (“check the decimal point — is it 0.1, 1.0 or 10?”)","w":"The point gets missed on a smudged or faxed chart: a ten-fold overdose. Write “5 mg”.","cf":["naked"]},{"c":"safe","k":"deck","s":"num","kd":"term","id":"naked","t":"naked decimal","m":"No zero before a decimal point — “.5 mg” can be read as 5 mg","src":"Med Admin (2) 2026 slide 6","w":"Ten times the dose if the point is missed. Always put a leading zero: “0.5 mg”.","cf":["trail"]},{"c":"safe","k":"safe","s":"freq","id":"QD","t":"QD","a":["q.d."],"m":"Every day (American)","g":"once","w":"Read as QID — four times a day. Write “daily”.","cf":["QOD"]},{"c":"safe","k":"safe","s":"freq","id":"QOD","t":"QOD","a":["q.o.d."],"m":"Every other day (American)","g":"altday","w":"Read as QD or QID. Write “every second day”.","cf":["QD"]},{"c":"safe","k":"safe","s":"freq","id":"HS","t":"HS","a":["hs"],"m":"At bedtime — or half-strength","w":"Two opposite meanings. Write “at night” (or nocte), or “half-strength”.","cf":["DC"]},{"c":"safe","k":"safe","s":"route","id":"SQ","t":"SQ","a":["sub q"],"m":"Subcutaneous (American)","g":"subcut","w":"The Q can be read as “5 every” or as a zero. Write “subcut”.","cf":["IN"]},{"c":"safe","k":"safe","s":"route","id":"IN","t":"IN","m":"Intranasal — into the nose","w":"Looks like IM or IV. Write “intranasal”.","cf":["SQ"]},{"c":"safe","k":"safe","s":"eye","id":"OS","t":"OS","m":"Left eye","w":"OD, OS and OU (eyes) get mixed up with each other and with AD, AS and AU (ears). Write “left eye”.","cf":["OU","AS"]},{"c":"safe","k":"safe","s":"eye","id":"OU","t":"OU","m":"Both eyes","w":"Write “both eyes”.","cf":["OS","AU"]},{"c":"safe","k":"safe","s":"eye","id":"AD","t":"AD","m":"Right ear","w":"Confused with OD (right eye). Write “right ear”.","cf":["AS","AU"]},{"c":"safe","k":"safe","s":"eye","id":"AS","t":"AS","m":"Left ear","w":"Confused with OS (left eye). Write “left ear”.","cf":["AD","OS"]},{"c":"safe","k":"safe","s":"eye","id":"AU","t":"AU","m":"Both ears","w":"Confused with OU (both eyes). Write “both ears”.","cf":["OU","AD"]},{"c":"safe","k":"safe","s":"other","id":"DC","t":"D/C","m":"Discontinue — or discharge","w":"Two different meanings: stop the medicine, or send the patient home with it? Write “cease” or “discharge”.","cf":["HS"]},{"c":"safe","k":"safe","s":"other","id":"x3d","t":"×3d","m":"For three days — or three doses","w":"Ambiguous. Write “for 3 days”.","cf":["DC"]},{"c":"safe","k":"safe","s":"sym","id":"gt","t":">","m":"More than","w":"Easily reversed with <. Read it slowly — writing “more than” in words is safer.","cf":["lt"]},{"c":"safe","k":"safe","s":"sym","id":"lt","t":"<","m":"Less than","w":"Easily reversed with >. On hold parameters (“withhold if HR < 60”) read it twice.","cf":["gt"]},{"c":"safe","k":"safe","s":"sym","id":"at","t":"@","m":"At","w":"Read as a 2. Write “at”.","cf":["gt"]},{"c":"safe","k":"safe","s":"drug","id":"MS","t":"MS","a":["MSO4","MgSO4"],"m":"Morphine sulfate — or magnesium sulfate","w":"MS/MSO4 (morphine) and MgSO4 (magnesium) have been swapped, fatally. Never abbreviate a medicine’s name.","cf":["DC"]},{"c":"safe","k":"safe","s":"drug","kd":"term","id":"tallman","t":"Tall Man lettering","m":"Capitals that tell look-alike names apart (predniSONE / prednisoLONE)","x":"Used on labels, shelves and screens to stop look-alike names being picked by mistake.","cf":["lasa"]},{"c":"safe","k":"safe","s":"drug","id":"lasa","t":"LASA","m":"Look-alike, sound-alike medicines","x":"Names or packs easily mistaken for each other — read the label at every one of the three checks.","cf":["tallman"]},{"c":"safe","k":"deck","s":"drug","kd":"term","id":"illegible","t":"illegible order","m":"Never guess it — ask the prescriber to clarify","src":"Med Admin (2) 2026 slide 6; Legal & Ethical slide 16","x":"“Incorrectly deciphering handwriting” is one of the course’s examples of a medication error — and insisting on proper prescribing is a legal duty.","cf":["lasa"]},{"c":"safe","k":"safe","s":"hi","kd":"term","id":"highalert","t":"high-alert medicine","m":"One where an error is more likely to cause serious harm","x":"Remember A PINCH: Anti-infectives, Potassium (and other concentrated electrolytes), Insulin, Narcotics (opioids) and sedatives, Chemotherapy, Heparin (and other anticoagulants).","cf":["lasa"]},{"c":"safe","k":"ward","s":"pinch","id":"pA","t":"A PINCH: A","m":"Anti-infectives (antimicrobials)","cf":["pP","pI"]},{"c":"safe","k":"ward","s":"pinch","id":"pP","t":"A PINCH: P","m":"Potassium and other concentrated electrolytes","cf":["pA","pH"]},{"c":"safe","k":"ward","s":"pinch","id":"pI","t":"A PINCH: I","m":"Insulin","cf":["pH","pN"]},{"c":"safe","k":"ward","s":"pinch","id":"pN","t":"A PINCH: N","m":"Narcotics (opioids) and sedatives","cf":["pC","pI"]},{"c":"safe","k":"ward","s":"pinch","id":"pC","t":"A PINCH: C","m":"Chemotherapy (cytotoxic) medicines","cf":["pN","pA"]},{"c":"safe","k":"ward","s":"pinch","id":"pH","t":"A PINCH: H","m":"Heparin and other anticoagulants","cf":["pP","pI"]},{"c":"iv","s":"line","id":"pivc","t":"PIVC","a":["PIV","cannula","luer"],"m":"Peripheral IV cannula — a short plastic tube in a hand or arm vein","x":"Nurses often just say “a luer”. Check the site every shift (VIP score) and note the date it went in — policy sets when it must be reviewed or replaced. Some wards write IVC, which is also the inferior vena cava.","cf":["cvc","picc"]},{"c":"iv","s":"line","id":"cvc","t":"CVC","a":["CVL","central line"],"m":"Central venous catheter — its tip sits in a big vein near the heart","x":"Put in through the neck, chest or groin; used for irritant drugs, long courses and blood tests. Higher infection risk — strict aseptic care.","cf":["picc","pivc"]},{"c":"iv","s":"line","id":"picc","t":"PICC","m":"A central line put in through an arm vein","x":"Peripherally inserted central catheter: it goes in at the arm but ends near the heart, and can stay for weeks to months.","cf":["cvc","port"]},{"c":"iv","s":"line","kd":"term","id":"port","t":"port","a":["portacath","Port-a-Cath"],"m":"A reservoir implanted under the skin, joined to a central vein","x":"Accessed with a special non-coring needle through the skin; common for chemotherapy.","cf":["picc"]},{"c":"iv","s":"give","id":"ivi","t":"IVI","m":"IV infusion — run in steadily over time","x":"e.g. “IVI 125 mL/h”. Fluids and infusions have their own section of the chart.","cf":["bolus"]},{"c":"iv","s":"give","id":"bolus","t":"IV bolus","a":["IV push","slow IV"],"m":"A dose pushed into the line from a syringe","x":"Given over the time the medicine’s guidance says (often minutes, not seconds). A “fluid bolus” is a quick volume of IV fluid given fast.","cf":["ivi"]},{"c":"iv","s":"give","id":"kvo","t":"KVO","a":["TKVO"],"m":"Keep vein open — a slow rate just to stop the line blocking","x":"The order or policy sets the rate.","cf":["ivi"]},{"c":"iv","s":"give","kd":"term","id":"flush","t":"flush","m":"A small push of sodium chloride 0.9% to clear or check a line","x":"Before and after IV medicines: it checks the line works and clears the drug through.","cf":["bolus"]},{"c":"iv","s":"kit","kd":"term","id":"givingset","t":"giving set","m":"The tubing from the bag to the patient — it fixes the drop factor","k":"deck","src":"Medication Calculations 2026 slide 68","cf":["burette"]},{"c":"iv","s":"kit","kd":"term","id":"burette","t":"burette","m":"A small measuring chamber in the line, for small exact volumes","x":"Usually on a 60 drops/mL (micro-drip) set — common for children.","cf":["givingset"]},{"c":"iv","s":"kit","kd":"term","id":"pump","t":"infusion pump","m":"A machine that runs an IV at a set mL/h","cf":["sdriver"]},{"c":"iv","s":"kit","kd":"term","id":"sdriver","t":"syringe driver","m":"A small battery pump that gives medicine steadily over 24 hours — often subcut, in palliative care","x":"Gives medicines continuously over 24 hours, e.g. for pain and nausea at the end of life.","cf":["pump","pca"]},{"c":"iv","s":"kit","id":"pca","t":"PCA","m":"Patient-controlled analgesia — the patient presses for a set opioid dose","x":"Has its own chart: the dose, the lockout time and an hourly limit. Only the patient presses the button.","cf":["sdriver"]},{"c":"iv","s":"site","kd":"term","id":"phleb","t":"phlebitis","m":"Inflammation of the vein at a cannula site","x":"Redness, pain and heat along the vein.","cf":["infil"]},{"c":"iv","s":"site","kd":"term","id":"infil","t":"infiltration","m":"A non-irritant IV fluid leaking into the tissue around the vein","x":"Swelling, coolness and pain at the site — stop it and re-site.","cf":["extrav"]},{"c":"iv","s":"site","kd":"term","id":"extrav","t":"extravasation","m":"An irritant drug leaking out of the vein into the tissue","x":"Can blister and kill tissue — stop the infusion and follow policy.","cf":["infil"]},{"c":"iv","s":"site","id":"vip","t":"VIP","m":"A 0–5 rating of a cannula site for phlebitis","x":"Visual Infusion Phlebitis score — checked every shift; a rising score means act on it.","cf":["phleb"]},{"c":"iv","s":"fluid","id":"nacl","t":"NaCl 0.9%","a":["normal saline","NS","N/S","sodium chloride 0.9%"],"m":"Sodium chloride 0.9% — “normal saline”, the basic IV fluid","k":"deck","src":"Medication Calculations 2026 slides 70–74","x":"An isotonic crystalloid: 0.9 g of salt in every 100 mL. Charts should use the full name.","cf":["hartmanns","gluc5"]},{"c":"iv","s":"fluid","id":"hartmanns","t":"Hartmann’s","a":["CSL","compound sodium lactate"],"m":"Compound sodium lactate — a balanced IV fluid","cf":["nacl"]},{"c":"iv","s":"fluid","id":"gluc5","t":"glucose 5%","a":["dextrose 5%","D5W"],"m":"5 g of sugar in every 100 mL — an IV fluid","k":"deck","src":"Medication Calculations 2026 slides 72 & 102 (“Dextrose 5%”)","x":"Once the glucose is used, it behaves like plain water. In a drip-rate question the 5% is a red herring.","cf":["nacl"]},{"c":"iv","s":"fluid","kd":"term","id":"crystal","t":"crystalloid","m":"An IV fluid of water with dissolved salts or sugar","x":"e.g. sodium chloride 0.9%, Hartmann’s, glucose 5%.","cf":["colloid"]},{"c":"iv","s":"fluid","kd":"term","id":"colloid","t":"colloid","m":"An IV fluid with large molecules that stay in the blood vessels","x":"e.g. albumin.","cf":["crystal"]},{"c":"iv","s":"fluid","id":"kcl","t":"KCl","m":"Potassium chloride","x":"Dosed in mmol. A high-alert medicine (the P in A PINCH).","w":"Concentrated potassium is never pushed IV — only diluted and run at a controlled rate, exactly as prescribed.","cf":["nacl"]},{"c":"iv","s":"fluid","id":"tpn","t":"TPN","a":["PN"],"m":"Total parenteral nutrition — all of a person’s nutrition given IV","x":"Through a central line, with its own chart and close glucose checks.","cf":["peg"]},{"c":"iv","s":"tube","id":"idc","t":"IDC","a":["IUC","catheter"],"m":"Indwelling urinary catheter","x":"A tube through the urethra into the bladder, held by a balloon; urine drains to a bag.","cf":["spc"]},{"c":"iv","s":"tube","id":"spc","t":"SPC","m":"Suprapubic catheter — into the bladder through the lower belly","cf":["idc"]},{"c":"iv","s":"tube","id":"ett","t":"ETT","m":"Endotracheal tube — a breathing tube in the windpipe","cf":["ng"]},{"c":"iv","s":"o2","id":"np","t":"NP","a":["nasal prongs","NC","nasal cannula"],"m":"Nasal prongs — oxygen through two short tubes in the nostrils","x":"Low flows, usually up to about 4 L/min.","w":"NP also means nurse practitioner — read the context.","cf":["hm","hfnp"]},{"c":"iv","s":"o2","id":"hm","t":"HM","a":["Hudson mask","simple face mask"],"m":"Hudson mask — a simple oxygen face mask","x":"Usually 5–10 L/min: below 5 L/min the patient can rebreathe their own carbon dioxide.","cf":["nrb","np"]},{"c":"iv","s":"o2","id":"nrb","t":"NRB","m":"Non-rebreather mask — high-concentration oxygen with a reservoir bag","x":"Run at 10–15 L/min with the bag kept inflated — for a very unwell patient.","cf":["hm"]},{"c":"iv","s":"o2","id":"hfnp","t":"HFNP","a":["high-flow","Optiflow","HFNC"],"m":"High-flow nasal prongs — warm, humidified oxygen at high flow","x":"Far higher flows than ordinary prongs, with special equipment and closer monitoring. (Optiflow is made in NZ, by Fisher & Paykel.)","cf":["np"]},{"c":"iv","s":"o2","id":"lmin","t":"L/min","m":"Litres per minute — an oxygen flow rate","cf":["fio2"]},{"c":"iv","s":"o2","id":"fio2","t":"FiO₂","a":["FiO2"],"m":"The fraction of oxygen in the air breathed in","x":"Room air is 21% (FiO₂ 0.21).","cf":["lmin"]},{"c":"iv","s":"o2","kd":"term","id":"targetsat","t":"target SpO₂","a":["target sats"],"m":"The saturation range an oxygen order aims for","x":"Commonly 92–96%, or 88–92% for people at risk of retaining carbon dioxide (e.g. some with COPD). The range on the chart is the one that counts.","cf":["fio2"]},{"c":"obs","s":"vital","id":"obs","t":"obs","m":"Observations — the vital signs","x":"BP, heart rate, breathing rate, oxygen saturation, temperature and level of consciousness. “4/24 obs” = every 4 hours.","cf":["ews"]},{"c":"obs","s":"vital","id":"bp","t":"BP","m":"Blood pressure (mmHg)","x":"Systolic over diastolic, e.g. 120/80. Check it before blood-pressure medicines — many carry a hold parameter such as “withhold if SBP < 100”.","cf":["map","hr"]},{"c":"obs","s":"vital","id":"sbp","t":"SBP","m":"Systolic blood pressure — the top number","cf":["dbp","map"]},{"c":"obs","s":"vital","id":"dbp","t":"DBP","m":"Diastolic blood pressure — the bottom number","cf":["sbp","map"]},{"c":"obs","s":"vital","id":"map","t":"MAP","m":"Mean arterial pressure — the average pressure through one heartbeat","x":"Mostly used in HDU and ICU, where a minimum MAP is often set (commonly 65 mmHg).","cf":["sbp"]},{"c":"obs","s":"vital","id":"hr","t":"HR","a":["P","pulse"],"m":"Heart rate (beats per minute)","x":"Typical adult resting range 60–100. Check it before heart-rate-slowing medicines such as beta blockers.","w":"On an obs chart, PR means pulse rate too — and PR on a medicine order means rectally.","cf":["rr","bp"]},{"c":"obs","s":"vital","kd":"term","id":"apical","t":"apical pulse","m":"Heart rate counted with a stethoscope over the heart for a full minute","x":"Taken before some heart medicines (e.g. digoxin) because a wrist pulse can miss beats.","cf":["hr"]},{"c":"obs","s":"vital","id":"rr","t":"RR","m":"Respiratory rate (breaths per minute)","x":"Typical adult range 12–20. Check it before opioids and sedatives — slow, shallow breathing is the danger sign.","cf":["hr","spo2"]},{"c":"obs","s":"vital","id":"spo2","t":"SpO₂","a":["SpO2","sats"],"m":"Oxygen saturation from a pulse oximeter (%)","x":"Read it with the oxygen the patient is on: “94% on RA” means on room air.","cf":["fio2","rr"]},{"c":"obs","s":"vital","id":"ra","t":"RA","m":"Room air — no added oxygen","w":"In the notes RA also means rheumatoid arthritis.","cf":["spo2"]},{"c":"obs","s":"vital","id":"temp","t":"T","a":["Temp","T°"],"m":"Temperature (°C)","x":"Checked before and after an antipyretic like paracetamol, to see if it worked.","cf":["bp"]},{"c":"obs","s":"vital","id":"gcs","t":"GCS","m":"Glasgow Coma Scale — level of consciousness, 3 to 15","x":"Eyes, voice and movement; 15 = fully alert. A falling GCS after an opioid or sedative is an emergency.","cf":["ews","sedscore"]},{"c":"obs","s":"score","id":"ews","t":"EWS","a":["NEWS","NZEWS"],"m":"Early warning score — the vital signs added up to flag deterioration","x":"NZ hospitals use a national vital-signs chart with an early warning score; a high score means escalate, and the chart says to whom.","cf":["gcs"]},{"c":"obs","s":"score","kd":"term","id":"painscore","t":"pain score","m":"The patient’s own 0–10 rating of how much it hurts","k":"deck","src":"Med Admin (1) 2026 slides 32 & 41","x":"Before a PRN pain medicine and again once it has had time to work — the assessment and the evaluation the course says every PRN dose needs.","cf":["sedscore"]},{"c":"obs","s":"score","kd":"term","id":"sedscore","t":"sedation score","m":"How drowsy the patient is — checked with opioids","x":"Rising sleepiness comes BEFORE the breathing slows, so it is the earlier warning sign.","cf":["painscore","gcs"]},{"c":"obs","s":"io","id":"inout","t":"I/O","a":["I&O","FB"],"m":"Intake and output — fluid balance","x":"Everything in (drinks, IV, feeds) and everything out (urine, vomit, drains) — watched with diuretics and IV fluids.","w":"FBC can mean fluid balance chart OR full blood count — read the context.","cf":["pu","bo"]},{"c":"obs","s":"io","id":"bo","t":"BO","m":"Bowels open","x":"“BO ×1” = one bowel motion. Checked before laxatives, and watched with opioids (they constipate).","cf":["pu"]},{"c":"obs","s":"io","id":"pu","t":"PU","m":"Passed urine","cf":["bo"]},{"c":"obs","s":"gluc","id":"bgl","t":"BGL","a":["BSL","CBG","BG"],"m":"Blood glucose level (mmol/L)","x":"A finger-prick test — before insulin and many diabetes medicines.","cf":["hba1c"]},{"c":"obs","s":"gluc","id":"hba1c","t":"HbA1c","m":"Average blood glucose over the last 2–3 months","x":"Reported in mmol/mol in NZ.","cf":["bgl"]},{"c":"obs","s":"gluc","kd":"term","id":"hypo","t":"hypo","m":"Low blood glucose — under 4 mmol/L","x":"“4 is the floor.” Treat it by your hospital’s hypo protocol; insulin may need to be withheld and the prescriber told.","cf":["hyper"]},{"c":"obs","s":"gluc","kd":"term","id":"hyper","t":"hyper","m":"High blood glucose","cf":["hypo"]},{"c":"obs","s":"lab","id":"fbc","t":"FBC","a":["CBC"],"m":"Full blood count","x":"Haemoglobin, white cells and platelets.","w":"On some wards FBC also means fluid balance chart — read the context.","cf":["ue","lft"]},{"c":"obs","s":"lab","id":"hb","t":"Hb","m":"Haemoglobin — oxygen-carrying protein (g/L)","x":"NZ reports it in g/L, e.g. 135 g/L.","cf":["wcc","plt"]},{"c":"obs","s":"lab","id":"wcc","t":"WCC","a":["WBC"],"m":"White cell count — raised in infection and inflammation","cf":["hb","crp"]},{"c":"obs","s":"lab","id":"plt","t":"Plt","a":["PLT"],"m":"Platelets — the cells that start clotting","x":"Watched with heparin and enoxaparin: a falling count can be a reaction to heparin.","cf":["inr","hb"]},{"c":"obs","s":"lab","id":"inr","t":"INR","m":"How long the blood takes to clot — the warfarin test","x":"International normalised ratio. Warfarin is dosed day by day against it, usually aiming for 2–3.","cf":["aptt","plt"]},{"c":"obs","s":"lab","id":"aptt","t":"APTT","m":"The clotting test that IV heparin is adjusted to","cf":["inr"]},{"c":"obs","s":"lab","id":"ue","t":"U&E","a":["UEC","renal function"],"m":"Urea and electrolytes — kidney function and salts","x":"Sodium, potassium, urea and creatinine. Kidney function decides the dose of many medicines.","cf":["lft","fbc"]},{"c":"obs","s":"lab","id":"creat","t":"Cr","a":["creat"],"m":"Creatinine — a blood marker of kidney function","x":"Measured in µmol/L in NZ. Creatinine rising = kidneys doing worse = medicines cleared by the kidneys build up.","cf":["egfr"]},{"c":"obs","s":"lab","id":"egfr","t":"eGFR","m":"Estimated glomerular filtration rate — how well the kidneys filter","x":"Below about 60 = reduced kidney function; many doses are lowered or stopped.","cf":["creat","crcl"]},{"c":"obs","s":"lab","id":"crcl","t":"CrCl","m":"Creatinine clearance — kidney function worked out for drug dosing","cf":["egfr"]},{"c":"obs","s":"lab","id":"k","t":"K⁺","a":["K","K+","potassium"],"m":"Potassium","x":"Typically about 3.5–5.0 mmol/L (labs vary). Checked before potassium supplements, diuretics such as furosemide, and digoxin — too high or too low both upset the heart’s rhythm.","cf":["na","mag"]},{"c":"obs","s":"lab","id":"na","t":"Na⁺","a":["Na","Na+","sodium"],"m":"Sodium","x":"Typically about 135–145 mmol/L.","cf":["k"]},{"c":"obs","s":"lab","id":"mag","t":"Mg²⁺","a":["Mg","magnesium"],"m":"Magnesium","w":"Capital M, small g = magnesium; small m, small g = milligram. Case matters on a chart.","cf":["k"]},{"c":"obs","s":"lab","id":"lft","t":"LFTs","m":"Liver function tests","x":"The liver breaks most medicines down; several (paracetamol among them) are watched against LFTs.","cf":["ue","fbc"]},{"c":"obs","s":"lab","id":"crp","t":"CRP","m":"C-reactive protein — a marker of inflammation or infection","x":"Tracked to see whether an infection is responding to antibiotics.","cf":["wcc"]},{"c":"obs","s":"lab","id":"mcs","t":"MC&S","m":"Microscopy, culture and sensitivity — which bug, and what kills it","x":"e.g. a urine MC&S. Samples go off before the first antibiotic dose where possible.","cf":["crp"]},{"c":"obs","s":"lab","kd":"term","id":"druglevel","t":"drug level","m":"A blood test of how much of a medicine is in the plasma","x":"For medicines with a narrow therapeutic range. Timing is everything — a trough is taken just before the next dose.","cf":["trough"]},{"c":"obs","s":"lab","id":"ecg","t":"ECG","m":"Electrocardiogram — a trace of the heart’s electrical activity","cf":["hr"]},{"c":"notes","s":"hx","id":"hx","t":"Hx","m":"History","cf":["dx","tx"]},{"c":"notes","s":"hx","id":"pmhx","t":"PMHx","a":["PMH"],"m":"Past medical history","cf":["fhx","hpi"]},{"c":"notes","s":"hx","id":"fhx","t":"FHx","m":"Family history","cf":["pmhx"]},{"c":"notes","s":"hx","id":"hpi","t":"HPI","a":["HPC"],"m":"History of the presenting illness (complaint)","cf":["pmhx"]},{"c":"notes","s":"hx","id":"co","t":"c/o","m":"Complains of","cf":["oe"]},{"c":"notes","s":"hx","id":"oe","t":"O/E","m":"On examination","cf":["co","nad"]},{"c":"notes","s":"hx","id":"nad","t":"NAD","m":"No abnormality detected","cf":["oe"]},{"c":"notes","s":"hx","id":"dx","t":"Dx","m":"Diagnosis","cf":["ddx","tx"]},{"c":"notes","s":"hx","id":"ddx","t":"DDx","m":"Differential diagnosis — what else it could be","cf":["dx"]},{"c":"notes","s":"hx","id":"ix","t":"Ix","m":"Investigations — the tests","cf":["mx","tx"]},{"c":"notes","s":"hx","id":"mx","t":"Mx","m":"Management — the plan","cf":["ix","tx"]},{"c":"notes","s":"hx","id":"tx","t":"Tx","m":"Treatment","cf":["dx","mx"]},{"c":"notes","s":"hx","id":"sx","t":"Sx","m":"Symptoms","cf":["tx"]},{"c":"notes","s":"hx","id":"rv","t":"r/v","a":["R/V"],"m":"Review","cf":["fu"]},{"c":"notes","s":"hx","id":"fu","t":"f/u","a":["F/U"],"m":"Follow up","cf":["rv"]},{"c":"notes","s":"hx","id":"query","t":"?","m":"Query — possible, not confirmed","x":"“?UTI” = a possible urinary tract infection, not yet diagnosed.","cf":["up"]},{"c":"notes","s":"hx","id":"up","t":"↑","m":"Increased / raised","cf":["down"]},{"c":"notes","s":"hx","id":"down","t":"↓","m":"Decreased / lowered","cf":["up"]},{"c":"notes","s":"hx","id":"hash","t":"#","m":"Fracture","x":"“#NOF” = fractured neck of femur — a hip fracture.","cf":["query"]},{"c":"notes","s":"hx","id":"nof","t":"#NOF","m":"Fractured neck of femur — a hip fracture","cf":["hash"]},{"c":"notes","s":"hx","id":"nbm","t":"NBM","a":["NPO","nil by mouth"],"m":"Nil by mouth — nothing to eat or drink","x":"e.g. before theatre (Latin nil per os). Ask which regular medicines still go with a sip of water; a dose withheld for fasting is coded F.","cf":["adlib"]},{"c":"notes","s":"hx","id":"pod","t":"POD","m":"Post-operative day","x":"“POD 2” = the second day after surgery.","cf":["nbm"]},{"c":"notes","s":"hx","id":"dnacpr","t":"DNACPR","a":["DNR","NFR"],"m":"Do not attempt CPR — not for resuscitation","x":"A documented decision not to start CPR if the heart stops. It does NOT mean stop other treatment or medicines.","cf":["icu"]},{"c":"notes","s":"hx","id":"adls","t":"ADLs","m":"Activities of daily living — washing, dressing, eating…","cf":["mobs"]},{"c":"notes","s":"hx","id":"mobs","t":"mobs","a":["mob."],"m":"Mobilising — walking and moving about","x":"“Mobs indep” = walks independently; “mobs with frame” = with a walking frame.","cf":["adls"]},{"c":"notes","s":"hx","id":"nok","t":"NOK","m":"Next of kin","cf":["whanau"]},{"c":"notes","s":"hx","kd":"term","id":"whanau","t":"whānau","m":"Family — in the wide Māori sense, including extended family","cf":["nok"]},{"c":"notes","s":"hx","id":"pt","t":"Pt","m":"Patient","cf":["nok"]},{"c":"notes","s":"sym","id":"sob","t":"SOB","m":"Short of breath","cf":["soboe","nv"]},{"c":"notes","s":"sym","id":"soboe","t":"SOBOE","m":"Short of breath on exertion","cf":["sob"]},{"c":"notes","s":"sym","id":"nv","t":"N/V","a":["N&V","N+V"],"m":"Nausea and vomiting","cf":["sob"]},{"c":"notes","s":"sym","id":"loc","t":"LOC","m":"Loss (or level) of consciousness","cf":["gcs"]},{"c":"notes","s":"sym","id":"overdose","t":"OD","m":"Overdose","w":"On a medicine order OD means once daily — same letters, different chart.","cf":["etoh"]},{"c":"notes","s":"sym","id":"etoh","t":"ETOH","a":["EtOH"],"m":"Alcohol","x":"“ETOH use” = alcohol use — it changes how many medicines work.","cf":["overdose"]},{"c":"notes","s":"dx","id":"htn","t":"HTN","m":"Hypertension — high blood pressure","cf":["ihd","hf"]},{"c":"notes","s":"dx","id":"af","t":"AF","m":"Atrial fibrillation — an irregular heart rhythm","x":"A common reason for anticoagulants such as warfarin.","cf":["mi","hf"]},{"c":"notes","s":"dx","id":"mi","t":"MI","m":"Myocardial infarction — a heart attack","cf":["ihd","af"]},{"c":"notes","s":"dx","id":"ihd","t":"IHD","m":"Ischaemic heart disease","cf":["mi","hf"]},{"c":"notes","s":"dx","id":"hf","t":"CHF","a":["HF","CCF"],"m":"Heart failure","cf":["ihd","af"]},{"c":"notes","s":"dx","id":"cva","t":"CVA","a":["stroke"],"m":"Cerebrovascular accident — a stroke","cf":["tia"]},{"c":"notes","s":"dx","id":"tia","t":"TIA","m":"Transient ischaemic attack — a “mini-stroke”","cf":["cva"]},{"c":"notes","s":"dx","id":"copd","t":"COPD","m":"Chronic obstructive pulmonary disease","cf":["sob"]},{"c":"notes","s":"dx","id":"t1dm","t":"T1DM","m":"Type 1 diabetes — the body makes no insulin","cf":["t2dm"]},{"c":"notes","s":"dx","id":"t2dm","t":"T2DM","m":"Type 2 diabetes — the body resists insulin","cf":["t1dm"]},{"c":"notes","s":"dx","id":"ckd","t":"CKD","m":"Chronic kidney disease","cf":["aki"]},{"c":"notes","s":"dx","id":"aki","t":"AKI","m":"Acute kidney injury","cf":["ckd"]},{"c":"notes","s":"dx","id":"uti","t":"UTI","m":"Urinary tract infection","cf":["aki"]},{"c":"notes","s":"dx","id":"dvt","t":"DVT","m":"Deep vein thrombosis — a clot in a deep vein, usually in the leg","cf":["pe","vte"]},{"c":"notes","s":"dx","id":"pe","t":"PE","m":"Pulmonary embolism — a clot in the lungs’ arteries","cf":["dvt","vte"]},{"c":"notes","s":"dx","id":"vte","t":"VTE","m":"Venous thromboembolism — DVT and PE together","x":"“VTE prophylaxis” is why so many inpatients get a daily enoxaparin injection.","cf":["dvt","pe"]},{"c":"notes","s":"dx","id":"gord","t":"GORD","a":["GERD"],"m":"Gastro-oesophageal reflux disease","cf":["nv"]},{"c":"notes","s":"dx","id":"oa","t":"OA","m":"Osteoarthritis","cf":["rarth"]},{"c":"notes","s":"dx","id":"rarth","t":"RA","m":"Rheumatoid arthritis","w":"On an obs chart RA means room air.","cf":["oa"]},{"c":"notes","s":"dx","id":"ca","t":"Ca","m":"Cancer (carcinoma)","w":"Ca is also calcium — read the context.","cf":["mets"]},{"c":"notes","s":"dx","id":"mets","t":"mets","m":"Metastases — cancer that has spread","cf":["ca"]},{"c":"notes","s":"place","id":"ed","t":"ED","m":"Emergency department","cf":["icu","hdu"]},{"c":"notes","s":"place","id":"icu","t":"ICU","m":"Intensive care unit","cf":["hdu","ccu"]},{"c":"notes","s":"place","id":"hdu","t":"HDU","m":"High dependency unit — a step below ICU","cf":["icu"]},{"c":"notes","s":"place","id":"ccu","t":"CCU","m":"Coronary care unit","cf":["icu"]},{"c":"notes","s":"place","id":"gp","t":"GP","m":"General practitioner — family doctor","cf":["rmo"]},{"c":"notes","s":"place","id":"rmo","t":"RMO","m":"Resident medical officer — a junior hospital doctor","cf":["smo","ho"]},{"c":"notes","s":"place","id":"ho","t":"HO","m":"House officer — a doctor in their first years","cf":["reg","rmo"]},{"c":"notes","s":"place","id":"reg","t":"Reg","m":"Registrar — a senior doctor in specialist training","cf":["ho","smo"]},{"c":"notes","s":"place","id":"smo","t":"SMO","m":"Senior medical officer — a consultant","cf":["reg"]},{"c":"notes","s":"place","id":"mdt","t":"MDT","m":"Multidisciplinary team","cf":["sw","ot"]},{"c":"notes","s":"place","id":"ot","t":"OT","m":"Occupational therapy (or therapist)","w":"Some wards also write OT for operating theatre.","cf":["sw","mdt"]},{"c":"notes","s":"place","id":"sw","t":"SW","m":"Social worker","cf":["ot"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"pharmacology","t":"pharmacology","m":"The study of drugs — their sources, nature, actions, effects and uses","src":"Pharmacology Concepts (1) 2026, slide 3","cf":["toxicology","pharmther"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"pharmther","t":"pharmacotherapeutics","m":"Applying PK and PD to choose and give the right medicine to one patient","src":"Pharmacology Concepts (1) 2026, slides 20–25","cf":["pharmacology"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"toxicology","t":"toxicology","m":"The study of the harmful effects of chemicals, including medicines","src":"Pharmacology Concepts (1) 2026, slides 20–25","x":"It covers misuse, adverse effects and poisoning.","cf":["pharmacology"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"generic","t":"generic name","m":"The official name of the active ingredient — one per medicine","src":"Pharmacology Concepts (1) 2026, slides 39–48","x":"Teach patients the generic name: in Joan’s escape room, a man who knew his opioid only by its brand was given morphine twice.","cf":["brand"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"brand","t":"brand name","m":"The company’s own name for its product — a medicine may have several","src":"Pharmacology Concepts (1) 2026, slides 39–48","cf":["generic"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"bioequiv","t":"bioequivalence","m":"Two products put the same drug in the blood at the same rate and amount","src":"Pharmacology Concepts (1) 2026, slides 49–50","x":"Why a pharmacy can swap in the funded generic for a brand.","cf":["bioavail"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"excipient","t":"excipient","m":"An inactive ingredient in a tablet — filler, binder, colour, flavour","src":"Pharmacology Concepts (2) 2026, slides 62–63","x":"e.g. the gelatine in a capsule shell — it matters to vegetarian, vegan and some religious patients.","cf":["generic"]},{"c":"pharm","kd":"abbr","k":"deck","s":"basic","id":"moa","t":"MOA","m":"Mechanism of action — how a medicine produces its effect","src":"Pharmacology Concepts (2) 2026, slides 5–10","cf":["pd"]},{"c":"pharm","kd":"abbr","k":"deck","s":"basic","id":"otc","t":"OTC","m":"Over the counter — bought without a prescription","src":"Pharmacology Concepts (2) 2026, slide 10","x":"Restricted, pharmacy-only and general sale medicines are the ones commonly called OTC.","cf":["cam"]},{"c":"pharm","kd":"abbr","k":"deck","s":"basic","id":"cam","t":"CAM","m":"Complementary and alternative medicine","src":"Rongoā 2026 deck, slides 2–3","x":"Ask about it on admission — herbal and other remedies can interact with prescribed medicines.","cf":["otc"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"rongoa","t":"rongoā Māori","m":"Traditional Māori healing — mirimiri, karakia and plant remedies","src":"Rongoā 2026 deck, slides 9 & 12","x":"Massage and body work, prayer, and native plant remedies. Responsibility rests with the tohunga or rongoā practitioner, not the nurse.","cf":["cam"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"localfx","t":"local effect","m":"It acts right where the medicine is applied","src":"Pharmacology Concepts (2) 2026, slides 26–27","x":"e.g. a cream on a rash, eye drops.","cf":["sysfx"]},{"c":"pharm","kd":"term","k":"deck","s":"basic","id":"sysfx","t":"systemic effect","m":"Absorbed into the circulation and carried to where it acts","src":"Pharmacology Concepts (2) 2026, slides 26–27","x":"e.g. a tablet swallowed for a headache.","cf":["localfx"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"pk","t":"pharmacokinetics","a":["PK"],"m":"What the body does to the drug","src":"Pharmacokinetics (1) 2026, slides 5–7","x":"Absorption, distribution, metabolism and excretion — ADME.","cf":["pd"]},{"c":"pharm","kd":"abbr","k":"deck","s":"pk","id":"adme","t":"ADME","m":"Absorption, distribution, metabolism, excretion","src":"Pharmacokinetics (1) 2026, slides 5–7","cf":["moa"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"absorption","t":"absorption","m":"Unchanged drug reaching the bloodstream after it is given","src":"Pharmacokinetics (1) 2026, slide 13","x":"The IV route needs none — it is already in the blood.","cf":["distribution","bioavail"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"distribution","t":"distribution","m":"The drug moving between the blood and the body’s tissues","src":"Pharmacokinetics (1) 2026, slides 5–7","cf":["absorption","metabolism"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"metabolism","t":"metabolism","a":["biotransformation"],"m":"Enzymes (mostly in the liver) changing a drug into an inactive, excretable form","src":"Pharmacokinetics (2) 2026, slides 11–12","cf":["excretion","elimination"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"excretion","t":"excretion","m":"Physically removing the drug or its waste from the body — mainly in urine","src":"Pharmacokinetics (2) 2026, slide 29","cf":["metabolism","elimination"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"elimination","t":"elimination","m":"The body removing a drug from the blood — metabolism plus excretion","src":"Pharmacokinetics (2) 2026, slide 29","cf":["excretion","clearance"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"clearance","t":"clearance","m":"How fast a drug is removed from the blood","src":"Pharmacokinetics (2) 2026, slides 29–31","x":"Hepatic clearance (the liver) and renal clearance (the kidneys). Poor kidneys or liver = slower clearance = build-up.","cf":["elimination"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"bioavail","t":"bioavailability","m":"How much of a dose actually reaches the bloodstream","src":"Pharmacokinetics (1) 2026, slide 34","x":"IV = 100%. By mouth it is less: some is not absorbed, and the liver takes its share first.","cf":["firstpass","absorption"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"firstpass","t":"first-pass effect","m":"The liver breaking down part of an oral dose before it reaches the body","src":"Pharmacokinetics (1) 2026, slides 35–36","x":"Sublingual, transdermal, IV, IM and subcut routes avoid it.","cf":["bioavail"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"dissolution","t":"dissolution","m":"A solid dose breaking up and dissolving so it can be absorbed","src":"Pharmacology Concepts (2) 2026, slide 61","x":"Faster dissolution, faster absorption — liquids skip this step.","cf":["absorption"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"protein","t":"protein binding","m":"Drug held on albumin in the plasma — only the free drug acts","src":"Pharmacokinetics (1) 2026, slides 37–38","x":"Low albumin (e.g. a malnourished older adult) means more free drug — and more toxicity.","cf":["distribution"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"bbb","t":"blood–brain barrier","m":"Tight vessel walls that keep many drugs out of the central nervous system","src":"Pharmacokinetics (1) 2026, slides 41–42","x":"Oxygen and glucose get through; many drugs do not. A newborn’s is immature.","cf":["protein"]},{"c":"pharm","kd":"term","k":"deck","s":"pk","id":"h
