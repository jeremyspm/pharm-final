<script>window.CARD_DATA = {"version":1,"meta":{"prefix":"phf.","hue":"#9333ea","icon":"💊","kick":"Intro to Pharmacology · 722.544","name":"Flashcards","sub":"The abbreviations and the tool’s short answers · Anki, stripped down","exam":"2026-11-05","how":"The must-know abbreviations (the course’s Must-Know list and the four more Joan named on 20 Oct), then the tool’s short answers in her format, a card each. Joan’s own 18 short answers are not here: they are verbatim, so they are on the Learn page’s ladder."},"decks":[{"id":"abbr","title":"Abbreviations (must know)","hue":45,"n":23},{"id":"found","title":"Foundations (Module 1)","hue":210,"n":4},{"id":"pkpd","title":"Pharmacokinetics & dynamics (Modules 3–4)","hue":268,"n":4},{"id":"admin","title":"Administration & education (Module 5)","hue":158,"n":2},{"id":"life","title":"Across the lifespan (Module 6)","hue":28,"n":3},{"id":"law","title":"Legal, ethical & development (Module 7)","hue":340,"n":8},{"id":"imm","title":"Allergy, anaphylaxis & vaccines (Module 8)","hue":190,"n":6},{"id":"tox","title":"Licit & illicit drugs (Module 9)","hue":0,"n":5},{"id":"cam","title":"Rongoā & CAM (Module 10)","hue":120,"n":2}],"cards":[{"id":"p:rv-abbr-often:0","deck":"abbr","kind":"Abbreviation","front":"OD","back":["**once a day**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-often:1","deck":"abbr","kind":"Abbreviation","front":"BD","back":["**twice a day**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-often:2","deck":"abbr","kind":"Abbreviation","front":"TDS","back":["**three times a day**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations lis iption Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-day:1","deck":"abbr","kind":"Abbreviation","front":"nocte","back":["at **night**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-day:2","deck":"abbr","kind":"Abbreviation","front":"ac","back":["**before meals**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-day:3","deck":"abbr","kind":"Abbreviation","front":"pc","back":["**after meals**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-enteral:0","deck":"abbr","kind":"Abbreviation","front":"PO","back":["**by mouth**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-enteral:1","deck":"abbr","kind":"Abbreviation","front":"SL","back":["under the **tongue** (**sublingual**)"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-enteral:2","deck":"abbr","kind":"Abbreviation","front":"PR","back":["into the **rectum**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-inject:0","deck":"abbr","kind":"Abbreviation","front":"SC","back":["under the **skin** (**subcutaneous**)"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-inject:1","deck":"abbr","kind":"Abbreviation","front":"IM","back":["into a **muscle**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-inject:2","deck":"abbr","kind":"Abbreviation","front":"IV","back":["into a **vein**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-release:0","deck":"abbr","kind":"Abbreviation","front":"EC","back":["**enteric coated**"],"src":"Joan, 20 Oct [1:33:06–1:33:25] (“EC, SR, CR”) · Pharmacology Concepts (2) 2026, slide 66","who":"hers"},{"id":"p:rv-abbr-release:1","deck":"abbr","kind":"Abbreviation","front":"SR","back":["**slow release**"],"src":"Joan, 20 Oct [1:33:06–1:33:25] (“EC, SR, CR”) · Pharmacology Concepts (2) 2026, slide 66","who":"hers"},{"id":"p:rv-abbr-release:2","deck":"abbr","kind":"Abbreviation","front":"CR","back":["**controlled release**"],"src":"Joan, 20 Oct [1:33:06–1:33:25] (“EC, SR, CR”) · Pharmacology Concepts (2) 2026, slide 66","who":"hers"},{"id":"p:rv-abbr-allergy:0","deck":"abbr","kind":"Abbreviation","front":"NKA","back":["**no known allergies**"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"p:rv-abbr-allergy:1","deck":"abbr","kind":"Abbreviation","front":"NKDA","back":["no known **drug** allergies"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26), Pharmacology Concepts (2) slides 77–80 · Joan, 20 Oct: “You must, must, must know your abbreviations” [1:18:40]","who":"hers"},{"id":"w:qaed3f64a10","deck":"found","kind":"Tool’s question","title":"Paracetamol under 3 months","front":"Why should paracetamol not be given to a baby under 3 months (or under 5 kg) without medical advice?","back":["Liver **enzymes** not yet developed","Paracetamol **metabolised** more slowly","**Toxic** metabolites build up in the blood","Higher risk of overdose and **liver injury**"],"heads":null,"full":["The baby’s liver enzymes are not yet developed, so paracetamol is metabolised more slowly.","Toxic metabolites build up in the blood, so the risk of overdose and liver injury is higher."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 29 (BPAC NZ, 2018) · Joan’s 20 Oct revision session [0:19:23–0:25:39]","who":"tool"},{"id":"w:qc553ad0325","deck":"found","kind":"Tool’s question","title":"Contraindication","front":"What is the meaning of “contraindication”? Give an example.","back":["A situation where a medication should **not be used**","… because it **may be harmful** to the person","A known **severe allergy** to that medicine","Or a medicine that can **harm the foetus** in a **pregnant** woman"],"heads":[["Definition",2],["Example",2]],"full":["Definition: a situation in which a medication should NOT be used, because it may be harmful to the person.","Example: a known severe allergy to that medicine — it must not be given; or a medicine known to harm the foetus in a woman who is pregnant."],"src":"Question and model answer are the tool’s · from Joan’s own example of a short answer, Legal & Ethical lecture 16 Sep 2026 [1:05:06]; definition from deck 01 Pharmacology Concepts (1), slide 31","who":"tool"},{"id":"w:q4aa9ab8e04","deck":"found","kind":"Tool’s question","title":"Medication interaction","front":"Define a medication interaction and give an example.","back":["The medicine’s **effect** is **altered by another substance or condition**","Another **medication**, a **food**, a **complementary** medicine, an illness","A **herbal remedy** or food changes how much is **absorbed or broken down**","… making it **stronger or weaker**","So the nurse **asks about everything** the person takes"],"heads":[["Definition",2],["Example",3]],"full":["Definition: a reaction in which the effect or activity of a medication is altered by another substance or condition — another medication, a food, a complementary or alternative medicine, or a medical condition.","Example: a herbal remedy or a food that changes how much of a prescribed medicine is absorbed or broken down, making it stronger or weaker — which is why a nurse asks about everything the person takes."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (1), slide 32","who":"tool"},{"id":"w:qc2a33fa1bc","deck":"found","kind":"Tool’s question","title":"Local vs systemic effect","front":"Distinguish a local effect from a systemic effect of a medication, and give an example of each.","back":["At the **immediate site of administration**","e.g. a **cream** on a skin rash; **eye drops**","**Absorbed into the circulation** and **distributed** to where it acts","e.g. a **tablet swallowed** for a headache"],"heads":[["Local",2],["Systemic",2]],"full":["Local effect: the effect occurs at the immediate site of administration — e.g. a cream applied to a skin rash, or eye drops.","Systemic effect: the medication must be absorbed into the circulation and distributed to the place where it acts — e.g. a tablet swallowed for a headache."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (2), slides 26–27","who":"tool"},{"id":"w:q2540c548d3","deck":"pkpd","kind":"Tool’s question","title":"Bioavailability","front":"Define bioavailability and give an example comparing two routes.","back":["How much of the dose **actually reaches the bloodstream**","**Intravenous = 100%**","By mouth it is **lower**: some **not absorbed**, some **broken down by the liver**"],"heads":[["Definition",1],["Two routes compared",2]],"full":["Definition: how much of the dose actually reaches the bloodstream.","Example: intravenous = 100%; the same medicine by mouth is lower, because some is not absorbed from the gut and some is broken down by the liver before it reaches the circulation."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slide 34","who":"tool"},{"id":"w:q00b0ae36d3","deck":"pkpd","kind":"Tool’s question","title":"Plasma protein binding","front":"What is plasma protein binding, and why does it matter? Give an example.","back":["Many drugs **bind** reversibly to **plasma proteins**, mainly **albumin**","Only the **free** (**unbound**) drug can act","Two medicines **compete for the same binding site**","Or **low albumin** in a **malnourished** older adult","More **free drug** → more effect, **risk of toxicity**"],"heads":[["Definition",2],["Why it matters, with an example",3]],"full":["Definition: many drugs bind reversibly to plasma proteins, mainly albumin; only the FREE (unbound) drug can leave the blood and have an effect.","Example: two highly protein-bound medicines compete for the same binding site, or a malnourished older adult has low albumin — more free drug circulates, so the effect and the risk of toxicity increase."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slides 37–38","who":"tool"},{"id":"w:qa471ade3d3","deck":"pkpd","kind":"Tool’s question","title":"Half-life","front":"Define half-life and give an example of how it is used.","back":["The time for the **plasma concentration** to **fall by one half**","Not how long the **whole drug** stays in the body","Cleared after about **5 half-lives**","**Steady state** after **3–5 half-lives** of regular dosing","It sets the **dosing interval**"],"heads":[["Definition",2],["How it is used",3]],"full":["Definition: the time taken for the plasma concentration of a drug to fall by one half — not how long the whole drug stays in the body.","Example: a medicine with a 6-hour half-life is almost completely cleared after about 5 half-lives (30 hours), and takes about 3–5 half-lives of regular dosing to reach steady state — which is what sets the dosing interval."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 32 and 38; speaker notes to deck 09 slide 20","who":"tool"},{"id":"w:q001d7cf710","deck":"pkpd","kind":"Tool’s question","title":"The therapeutic range","front":"Define the therapeutic range and give an example of when it is monitored.","back":["The **plasma concentration** range that gives the **desired effect** without **toxicity**","Above the **minimum effective concentration**, below the **toxic** one","**Therapeutic drug monitoring** for a **narrow therapeutic range**","Blood levels at **peak and trough**"],"heads":[["Definition",2],["When it is monitored",2]],"full":["Definition: the range of plasma concentration within which a drug produces its desired effect without causing toxicity — above the minimum effective concentration and below the toxic one.","Example: therapeutic drug monitoring for a medicine with a NARROW therapeutic range (such as some anticoagulants) — blood levels are taken at peak and trough to keep the dose safe and effective."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 36–37","who":"tool"},{"id":"w:q7fdc63c15b","deck":"admin","kind":"Tool’s question","title":"Medication error vs adverse effect","front":"Define a medication error and give an example. How does it differ from an adverse effect?","back":["Any **preventable event** that may cause **inappropriate medication use** or **patient harm**","… while the medicine is **in the control** of staff or patient","e.g. a **dose given twice**; a known **allergy** ignored","Adverse effect: harm from **the medicine itself**, **even when used correctly**","Error: harm from **human action**, a lapse in the **rights and checks**"],"heads":[["Definition",3],["How it differs from an adverse effect",2]],"full":["Definition: any preventable event that may cause or lead to inappropriate medication use or patient harm while the medication is in the control of the health professional, patient or consumer. Example: a dose given twice because the first was not documented, or a medicine given to a patient with a known allergy to it.","Difference: an adverse effect is harm caused by the medicine itself, even when used correctly; a medication error is harm arising from human action — most trace back to a lapse in the rights and checks."],"src":"Question and model answer are the tool’s · from deck 05 Medication Administration & Patient Education (2), slides 4–5","who":"tool"},{"id":"w:q8dc9e9266c","deck":"admin","kind":"Tool’s question","title":"CARM: what it is, who reports","front":"What is CARM, and who can report to it? Give an example of something that should be reported.","back":["The **Centre for Adverse Reactions Monitoring**","NZ’s database of **suspected adverse reactions** to medicines and **vaccines**","**Health professionals**, **patients and whānau** can all report","A **widespread rash** and **facial swelling** after **starting a new medicine**","It is **documented**, an **alert** placed on the record, and **reported**"],"heads":[["What it is, and who reports",3],["Example to report",2]],"full":["Definition: the Centre for Adverse Reactions Monitoring — New Zealand’s database of suspected adverse reactions to medicines and vaccines; health professionals, patients and whānau can all report.","Example: a patient develops a widespread rash and facial swelling after starting a new medicine — it is documented, an alert is placed on their record, and it is reported to CARM."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacodynamics, slide 48; deck 09 Legal & Ethical Aspects, slide 10","who":"tool"},{"id":"w:qbe831fca79","deck":"life","kind":"Tool’s question","title":"Polypharmacy","front":"Define polypharmacy and give an example of a risk it raises.","back":["The **concurrent use of multiple medications**, usually **five or more**","It implies **too many**, or **unnecessary**, medicines","**Drug–drug interactions** and **adverse effects**","**Falls**; not taking them **as prescribed**; **death**"],"heads":[["Definition",2],["A risk it raises (any one)",2]],"full":["Definition: the concurrent use of multiple medications, usually five or more — with the connotation that too many, or unnecessary, medicines are being taken.","Example (any one): an older adult on many medicines has a higher risk of drug–drug interactions and adverse effects, of falls, of not taking them as prescribed, and of death."],"src":"Question and model answer are the tool’s · from deck 06a Medication in the Elderly & Polypharmacy, slides 34–36","who":"tool"},{"id":"w:qa170e24e78","deck":"life","kind":"Tool’s question","title":"Medicines in breast milk","front":"On what does the transfer of a medicine into breast milk depend, and what is the guiding principle for a breastfeeding parent who needs medication?","back":["The parent’s **plasma concentration** of the drug","The **amount of milk** the infant takes","The drug’s **lipid solubility**","**Maintaining the parent’s health is essential**","Not **automatically** stopped: the prescriber **weighs the risk** to the infant"],"heads":[["What the transfer depends on",3],["The guiding principle",2]],"full":["Most medicines can enter breast milk. How much reaches the infant depends on the parent’s plasma concentration of the drug, the amount of milk the infant consumes, and the drug’s lipid solubility.","Principle, with example: maintaining the parent’s health is essential, so a needed medicine should not automatically be stopped — the prescriber weighs the risk to the infant against the risk of not treating the parent."],"src":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slide 18","who":"tool"},{"id":"w:qe03adddc9f","deck":"life","kind":"Tool’s question","title":"Children are not small adults","front":"“Children are just small adults.” Explain why this is false for medicines, and give an example.","back":["Children are **physiologically different** and **constantly developing**","About **75% water**, less fat; **immature protective barriers**","Poorer **temperature** and **homeostatic control**","The dose comes from **body weight** (**mg per kg**)","**Never** by simply **scaling down an adult dose**"],"heads":[["Why it is false",3],["Example",2]],"full":["Children are physiologically different from adults and constantly developing: different body composition (about 75% water, less fat), immature protective barriers, and poorer temperature and homeostatic control — so they handle medicines differently.","Example: a child’s dose is calculated from body weight (mg per kg), never by simply scaling down an adult dose."],"src":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slides 24–25","who":"tool"},{"id":"w:qd71245f58b","deck":"law","kind":"Tool’s question","title":"Controlled drugs","front":"What is a controlled drug? Give an example of how controlled drugs are handled differently on a ward.","back":["A medicine under **special legal restriction**: **Misuse of Drugs Act 1975**","Because of its **potential for abuse**, **dependence** and harm","All controlled drugs are prescribed; **not all prescribed drugs are controlled**","**Opioids** like **morphine** (**Class B**)","Kept in a **double-locked safe** inside a locked room","**Restricted key-holders**; **penalties** for unlawful use"],"heads":[["Definition",3],["How they are handled on a ward",3]],"full":["Definition: a medicine placed under special legal restriction by the Misuse of Drugs Act 1975 because of its potential for abuse, dependence and harm. All controlled drugs are prescribed, but not all prescribed drugs are controlled.","Example: opioids such as morphine (Class B) are kept in a double-locked safe inside a locked medication room with restricted key-holders, and there are penalties for unlawful prescribing, supply or administration."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [00:00–02:39]; deck 09 Legal & Ethical Aspects, slides 12–14","who":"tool"},{"id":"w:q3d3fe77921","deck":"law","kind":"Tool’s question","title":"Scope of practice","front":"Define “scope of practice” and give an example of something outside a registered nurse’s scope.","back":["The area a practitioner is **educated, competent and authorised** to work in","Set by the **Nursing Council** under the **HPCAA**","About **demonstrated competence**, **not a list of tasks**","**Prescribing** (unless a **designated RN prescriber**)","**Dispensing**: that is the **pharmacist’s role**"],"heads":[["Definition",3],["Outside an RN’s scope (any one)",2]],"full":["Definition: the area of practice a practitioner is educated, competent and authorised to work in, set by the regulatory authority (the Nursing Council) under the HPCAA — about demonstrated competence, not a list of tasks.","Example (any one): prescribing a medicine (unless a designated RN prescriber) · dispensing — moving stock from bulk into a labelled patient pack is the pharmacist’s role · practising in a specialty the nurse has no training or experience in."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [09:10] and [26:29]; deck 09 Legal & Ethical Aspects, slides 7, 20 and 30–31","who":"tool"},{"id":"w:qe0b90dee19","deck":"law","kind":"Tool’s question","title":"Privacy, and a phone enquiry","front":"Explain the nurse’s duty of privacy and confidentiality, and give an example involving a telephone enquiry.","back":["**Code of Conduct Principle 5**: **protect personal health information**","Share it only for **appropriate professional purposes**","Notes are read only by **those caring for that patient**","“Sorry, we **can’t give patient information over the phone**”","You **cannot verify who is calling**; offer to **ring back**"],"heads":[["The duty",3],["The phone example",2]],"full":["Duty (Code of Conduct Principle 5): protect personal health information and use or share it only for appropriate professional purposes — it is the patient’s information, and notes are accessed only by those caring for that patient.","Example: a caller says she is a patient’s wife and asks how he is. The answer is “sorry, we can’t give patient information over the phone” — you cannot verify who is calling; offer to ring back or have the patient ring them."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [43:04–45:07]; deck 09 Legal & Ethical Aspects, slide 59","who":"tool"},{"id":"w:qfb56a27bba","deck":"law","kind":"Tool’s question","title":"Autonomy","front":"Define autonomy and give an example relating to medicines.","back":["The **right of choice**","**Informed, voluntary consent**, **without coercion**","Including the **right to refuse** and to **withdraw** at any time","A **competent patient declines** a medicine","The nurse checks they **understand the consequences**, **respects the refusal**, **documents it**"],"heads":[["Definition",3],["Example",2]],"full":["Definition: the right of choice — informed, voluntary consent without coercion, with appropriate disclosure and checking of understanding, including the right to refuse and to withdraw at any time.","Example: a competent patient declines a prescribed medicine. The nurse checks they understand the consequences, respects the refusal, documents it and informs the prescriber — they do not pressure or hide it in food."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [56:25]; deck 09 Legal & Ethical Aspects, slide 73","who":"tool"},{"id":"w:qba72713fbf","deck":"law","kind":"Tool’s question","title":"Why hiding an error is worse","front":"Why is concealing a medication error treated more seriously than the error itself? Give an example.","back":["An error is usually **accidental**: **report it**, **reflect**, **be supervised**","**Concealment is deliberate**: it **denies the patient monitoring and treatment**","It **breaches integrity** (**Principle 7**): **professional misconduct**","“**Nurse D**” took **two days to report**; the **patient died**","Found **guilty of professional misconduct**: **suspended**, **fined**, supervised"],"heads":[["The reason",3],["Example",2]],"full":["Reason: an error is usually accidental and is managed in-house — report it, reflect, be supervised for a time. Concealment is deliberate: it denies the patient monitoring and treatment, and it breaches integrity (Code of Conduct Principle 7), so it becomes professional misconduct.","Example: “Nurse D” gave the wrong medicine, realised 20 minutes later, did nothing and took two days to report; the patient died. She was found guilty of professional misconduct, suspended, fined and supervised."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [15:52–21:02] and [24:42]; deck 09 Legal & Ethical Aspects, slides 26–27","who":"tool"},{"id":"w:q0dc4be8381","deck":"law","kind":"Tool’s question","title":"Bioequivalence","front":"Define bioequivalence and explain why it matters, with an example.","back":["The **same active ingredient** reaches the bloodstream","At the **same rate** and to the **same extent**","A **generic** may only be **substituted** for a brand if **bioequivalent**","So the patient gets the **same therapeutic effect**","e.g. dispensing the **funded generic** instead of the original brand"],"heads":[["Definition",2],["Why it matters, with an example",3]],"full":["Definition: two formulations are bioequivalent when the same active ingredient reaches the bloodstream at the same rate and to the same extent.","Why and example: a generic may only be substituted for a brand if it is bioequivalent, so the patient gets the same therapeutic effect — e.g. a pharmacy dispensing the funded generic instead of the original brand of the same medicine."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 6 (“Remember bioequivalence!”); defined in deck 01 Pharmacology Concepts (1), slides 49–50","who":"tool"},{"id":"w:qeb2b33db6b","deck":"law","kind":"Tool’s question","title":"Phase 4: post-market monitoring","front":"What is Phase 4 of clinical research, and why does it exist? Give an example.","back":["**Post-market monitoring** of **long-term safety**","**Several thousand patients**, over years, **after Medsafe approval**","**Rare or delayed adverse effects** only show at **population scale**","e.g. a medicine **withdrawn** after **post-market reports**"],"heads":[["What it is",2],["Why it exists, with an example",2]],"full":["Definition: post-market monitoring of long-term safety and effectiveness in several thousand patients over years, after Medsafe approval.","Why and example: rare or delayed adverse effects only show up at population scale — e.g. a medicine withdrawn after post-market reports revealed a serious risk the trials were too small to see."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 11–12","who":"tool"},{"id":"w:q156716d6b7","deck":"law","kind":"Tool’s question","title":"Direct-to-consumer advertising","front":"What is direct-to-consumer advertising of medicines, and why is Aotearoa New Zealand unusual?","back":["It promotes a **branded prescription medicine** **to the public**","**One of only two developed countries** that **permit it**","Most restrict it to **health professionals**","It can **drive demand** for medicines that **may not be appropriate**"],"heads":[["What it is",1],["Why NZ is unusual",3]],"full":["Definition: advertising that promotes a specific branded prescription medicine to the public — its benefits, uses and risks.","New Zealand is one of only two developed countries that permit it; most restrict prescription-medicine advertising to health professionals, because consumer advertising can drive demand for medicines that may not be appropriate."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 22 and 24","who":"tool"},{"id":"w:q9b611d5393","deck":"imm","kind":"Tool’s question","title":"Preventing an allergic exposure","front":"How does a nurse prevent a patient being given a substance they are allergic to? Give an example.","back":["**Check** for allergies at **every healthcare encounter**","**Record** them; the patient wears an **allergy bracelet**","**Highly suspect**: **contrast dyes**, **iodine**, **antimicrobials**","Before an **antibiotic**: **ask**, check **bracelet** and **chart**","A new reaction is **documented**; the **prescriber told**"],"heads":[["Avoidance",3],["Example",2]],"full":["Avoidance: identify the allergen and avoid it — check for allergies at every healthcare encounter, record them, and the patient wears an allergy bracelet; take special care with highly suspect substances such as contrast dyes, iodine and antimicrobials.","Example: before giving an antibiotic, ask the patient about allergies and check their bracelet and the allergy section of the chart; a new reaction is documented and the prescriber told."],"src":"Question and model answer are the tool’s · from the Allergic Reactions deck (Module 8), slide 6","who":"tool"},{"id":"w:q76e9831e9b","deck":"imm","kind":"Tool’s question","title":"Active immunity — natural and artificial","front":"Define active immunity and give an example of natural and of artificial active immunity.","back":["Made by the person’s **own immune system**","Stores **memory B cells**","**Natural**: **recovering** from an infection, e.g. **chickenpox**","**Artificial**: a **vaccination**, e.g. **MMR** at **12 months**"],"heads":[["Definition",2],["Examples",2]],"full":["Definition: immunity made and directed by the person’s own immune system, which stores memory B cells.","Natural: recovering from an infection, e.g. after having chickenpox. Artificial: a vaccination, which stimulates the response without the damage of infection, e.g. the MMR vaccine at 12 months."],"src":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slides 23–24; the schedule from the Vaccinations & Recognising Allergy deck (Module 8), slide 7","who":"tool"},{"id":"w:q281ececc27","deck":"imm","kind":"Tool’s question","title":"Passive immunity — natural and artificial","front":"Define passive immunity and give an example of natural and of artificial passive immunity.","back":["**Antibodies** from a **different source**","**Immediate** but **temporary**","**Natural**: across the **placenta** or in **breastmilk**","**Artificial**: lab-made **monoclonal antibodies**","e.g. **pre-exposure prophylaxis** for someone **immunocompromised**"],"heads":[["Definition",2],["Examples",3]],"full":["Definition: antibodies introduced from a different source rather than made by the person’s own immune system — protection that is immediate but temporary.","Natural: a mother’s antibodies crossing the placenta or in breastmilk. Artificial: lab-made monoclonal antibodies, e.g. pre-exposure prophylaxis for someone immunocompromised at high risk of COVID-19."],"src":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slides 25, 27–28","who":"tool"},{"id":"w:q0c83fbbca5","deck":"imm","kind":"Tool’s question","title":"Herd immunity","front":"Define herd immunity and give an example of who it protects.","back":["**Most people** vaccinated: pathogens **cannot spread easily**","The **whole community** is protected","Some diseases **reduced** or **eliminated**, e.g. **polio**","Those who **cannot be vaccinated** or **do not respond**","**Very young**, **elderly**, **immunocompromised**, **non-responders**"],"heads":[["Definition",3],["Who it protects",2]],"full":["Definition: when most people in a community are vaccinated, pathogens cannot spread easily, so the whole community is protected — some diseases can even be reduced or eliminated, e.g. polio.","Who it protects: people who cannot be vaccinated or do not respond — e.g. the very young, the elderly, the immunocompromised and “non-responders”."],"src":"Question and model answer are the tool’s · from the Vaccinations & Recognising Allergy deck (Module 8), slide 4","who":"tool"},{"id":"w:q93ca7c843d","deck":"imm","kind":"Tool’s question","title":"Live vs non-live vaccines","front":"Distinguish a live (attenuated) vaccine from a non-live vaccine, with an example of each and a group a live vaccine is not safe for.","back":["**Weakened pathogens** that **replicate** without disease","e.g. **MMR**, **varicella**, **rotavirus**, **BCG**","**Cannot replicate**","**Inactivated** (e.g. **polio**), **subunit**, **mRNA** (e.g. **COVID-19**)","**Pregnancy** or **immunosuppression**","e.g. **MMR** not given to a **pregnant woman**"],"heads":[["Live (attenuated)",2],["Non-live",2],["Not safe for",2]],"full":["Live (attenuated): weakened pathogens that replicate without causing disease — e.g. MMR, varicella, rotavirus, BCG.","Non-live: cannot replicate — inactivated (the germ is killed, e.g. polio), subunit (only microbial fragments) or mRNA (genetic instructions to make a viral protein, e.g. COVID-19).","Not safe: live vaccines are not safe in pregnancy or immunosuppression — e.g. MMR is not given to a pregnant woman."],"src":"Question and model answer are the tool’s · from the Vaccinations & Recognising Allergy deck (Module 8), slide 5","who":"tool"},{"id":"w:q19c3118d47","deck":"imm","kind":"Tool’s question","title":"Fever — put the vaccine off","front":"Why is a fever a reason not to give a vaccination that day? Give an example.","back":["The immune system does **one task at a time**","**Busy** with something else: may **not respond** to the vaccine","A child with a **fever** at their **3-month vaccinations**","**Put off**, **rebooked** once **well**"],"heads":[["Reason",2],["Example",2]],"full":["Reason: the immune system can only do one task at a time — if it is already busy responding to something else, it may not respond to the vaccine’s antigen and learn to recognise that disease.","Example: a child who arrives for their 3-month vaccinations with a fever — the vaccination is put off and rebooked once they are well."],"src":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slide 31 (“Fever as a contraindication”)","who":"tool"},{"id":"w:q071ce622d2","deck":"tox","kind":"Tool’s question","title":"Licit vs illicit","front":"Define a licit drug and an illicit drug, with an example of each.","back":["**Lawful and permitted**: prescription to **general sale** medicines","Plus **some controlled drugs** (some **Class B and C**)","Example: **alcohol**, or an **opioid** taken **as prescribed**","**Unlawful** or **not permitted**","**every Class A**, **some Class B**, a **few Class C**","Example: **methamphetamine** (Class A)"],"heads":[["Licit",3],["Illicit",3]],"full":["Licit: a medication or drug that is lawful and permitted — prescription, restricted, pharmacy-only and general sale medicines, and some controlled drugs (some Class B and C). Example: alcohol, or an opioid analgesic taken as prescribed.","Illicit: a drug that is unlawful or otherwise not permitted — every Class A controlled drug, some Class B and a few Class C. Example: methamphetamine (Class A)."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slides 7 and 19","who":"tool"},{"id":"w:q49ce46eb6e","deck":"tox","kind":"Tool’s question","title":"Drug tolerance","front":"Define drug tolerance and give an example.","back":["Repeated doses cause **decreasing effects**","Or the **dose must be increased** for the **same effect**","Mechanism: **receptor downregulation**","**Morphine**: tolerance develops **rapidly**","**Marijuana**: **little tolerance**. **Not every drug** causes it"],"heads":[["Definition",3],["Example",2]],"full":["Definition: a physical state in which repeated doses of a drug cause decreasing effects, or the dose must be increased to maintain the same effect (receptor downregulation, from pharmacodynamics).","Example: a person on regular morphine needs higher doses for the same pain relief — morphine users develop tolerance rapidly, whereas marijuana causes little tolerance. Not every drug causes it."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 13","who":"tool"},{"id":"w:q7f23095410","deck":"tox","kind":"Tool’s question","title":"Withdrawal","front":"What is withdrawal? Give an example of its symptoms and what affects how severe it is.","back":["Symptoms when a **physically dependent** person **stops or cuts down**","**Mild to severe**, lasting **days or weeks**","Depends on the **substance**, **how long**, age, **weaned** or **cold turkey**","**Insomnia**, **fatigue**, **irritability**, **cravings**","Severe: **paranoia**, **confusion**, **tremors**, **disorientation**"],"heads":[["What it is",3],["Example",2]],"full":["Definition: the symptoms when a person who is physically dependent stops or cuts down a substance. It ranges from mild to severe and lasts days or weeks, depending on the substance, how long it was used, age, other conditions and psychological state, and whether it was weaned or stopped “cold turkey”.","Example: general symptoms such as insomnia, fatigue, irritability and cravings; severe withdrawal can bring paranoia, confusion, tremors and disorientation."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 11 (a Pusheen slide: the concept, not the full symptom list)","who":"tool"},{"id":"w:q98b5759e41","deck":"tox","kind":"Tool’s question","title":"Harm reduction","front":"What is harm reduction? Give an example from Aotearoa New Zealand.","back":["**Reducing the harm** for people **going to use anyway**","E.g. **education** about **which combinations are dangerous**","Free, legal **drug checking** (**Know Your Stuff NZ**)","**Naloxone** for people at risk of an **opioid overdose**"],"heads":[["Definition",2],["Example",2]],"full":["Definition: reducing the harm of drug use for people who are going to use anyway, rather than only telling them not to — for example education about which combinations are dangerous.","Example: free, legal drug checking at festivals and clinics (Know Your Stuff NZ, legal since the Misuse of Drugs Act was changed), or making naloxone available to people at risk of an opioid overdose."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 27 · For-interest articles on drug checking (NZ Herald, 2023; Stuff, 2022) and overdose deaths (NZ Herald, 2024)","who":"tool"},{"id":"w:qae9599d784","deck":"tox","kind":"Tool’s question","title":"Antidotes: naloxone and NAC","front":"Define an antidote and give an example.","back":["A substance that **counteracts a poison**","**Binding** it, slowing or **speeding an enzyme**, or **blocking its receptors**","**Naloxone** (**Narcan**): an **opioid antagonist**","**N-acetylcysteine** (**NAC**): fewer **toxic metabolites** from **paracetamol**"],"heads":[["Definition",2],["Examples",2]],"full":["Definition: a substance that counteracts a poison — by binding it to reduce the free toxin, by slowing or speeding an enzyme, or by blocking its receptors (an antagonist).","Example: naloxone (Narcan) is an opioid antagonist that reverses an opioid overdose; N-acetylcysteine (NAC) reduces the toxic metabolites made from paracetamol in a paracetamol overdose."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slides 39–40","who":"tool"},{"id":"w:q629d061d0b","deck":"cam","kind":"Tool’s question","title":"Rongoā Māori: its three parts","front":"Define rongoā Māori and give an example of each of its three parts.","back":["**Traditional Māori healing**","With a **strong spiritual element**: a **Māori model of health**","**Mirimiri**: **massage** / body work","**Karakia**: **prayer**","**Rongoā rākau**: **native plant-based remedies**, e.g. a **balm**"],"heads":[["Definition",2],["Its three parts",3]],"full":["Definition: traditional Māori healing, with a strong spiritual element in how remedies are prepared — a Māori model of health rather than only a set of remedies.","Its three parts: mirimiri (massage / body work), karakia (prayer) and rongoā rākau (native plant-based remedies, e.g. a leaf prepared as a balm, oil or tonic)."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slides 9 and 12 (quoting the NZNO Guidelines for Nurses on the Administration of Medicines 2024, s 7.7)","who":"tool"},{"id":"w:q312cfb3cd1","deck":"cam","kind":"Tool’s question","title":"Who is responsible for a rongoā remedy","front":"Who is responsible for a traditional Māori medicine, and what should a nurse do when whānau ask for advice about using one?","back":["The **tohunga** or **rongoā practitioner**","**Karakia and kawa differ** between tribal areas","The nurse **does not prescribe or prepare it**","**Arranges a discussion** with everyone involved","So the client can make an **informed decision**"],"heads":[["Who is responsible",3],["What the nurse does",2]],"full":["Responsibility rests with the tohunga or rongoā practitioner — karakia and kawa differ between tribal areas, and the nurse does not prescribe or prepare it.","The nurse arranges a discussion with everyone involved, including the tohunga or practitioner, so the client can make an informed decision — e.g. bringing the practitioner, the whānau and the prescriber together before a remedy is started in hospital."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 9 (NZNO Guidelines 2024, s 7.7)","who":"tool"}]};</script><script type="module" src="cards.js?v=5dcf69ed"></script></body></html>
