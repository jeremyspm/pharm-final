 and model answer are Joan’s · Joan’s Formative mini-exam 1, answers document, short answer Q14 · her answer gives examples · Joan’s feedback in class, Tue 20 Oct 2026 [1:37:47]","steps":["(e.g.) The influenza vaccine"],"note":null,"short":{"id":"form1:name one medication that is an example of prophylaxis","title":"A prophylactic medication","hook":"A vaccine prevents; it does not treat.","groups":[{"q":"Example","facts":[{"t":"e.g. the **influenza vaccine**","of":[0]}]}]}},{"id":"q583783479e","group":"found","who":"hers","title":"Use the generic name — why","qt":"Medications have three names: A chemical name, a generic name, and a brand name. Which of these names is most important for the Registered Nurse to use in practice AND why? (2pt)","scenario":null,"source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 1, answers document, short answer Q15 · Joan’s feedback in class, Tue 20 Oct 2026 [1:38:41]","steps":["Generic Name","Generic names are internationally approved, and used by both prescribers and medication administrators. They reduce the risk of medication errors, and allow pharmacists to dispense the most cost-effective options for families."],"note":null,"short":{"id":"form1:medications have three names a chemical name","title":"Use the generic name — why","hook":"One generic name, worldwide; many brand names.","groups":[{"q":"Which name","facts":[{"t":"The **generic** name","of":[0]}]},{"q":"Why","facts":[{"t":"**Internationally approved**","of":[1]},{"t":"Used by **prescribers** and **medication administrators**","of":[1]},{"t":"**Reduce** the risk of **medication errors**","of":[1]},{"t":"Pharmacists can dispense the **most cost-effective** option","of":[1]}]}]}},{"id":"qc745b22252","group":"found","who":"hers","title":"Who checks medicine safety in NZ","qt":"Which entity in Aotearoa New Zealand is responsible for assessing and monitoring the quality and safety of medications? (1pt)","scenario":null,"source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 1, answers document, short answer Q16 · Joan’s feedback in class, Tue 20 Oct 2026 [1:41:11]","steps":["Medsafe"],"note":null,"short":{"id":"form1:which entity in aotearoa new zealand is responsible","title":"Who checks medicine safety in NZ","hook":"Medsafe keeps medicines SAFE.","groups":[{"q":"The entity","facts":[{"t":"**Medsafe**","of":[0]}]}]}},{"id":"q02454fb92e","group":"admin","who":"hers","title":"Medication adherence","qt":"Define medication adherence (1pt)","scenario":null,"source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 1, answers document, short answer Q17 · Joan’s feedback in class, Tue 20 Oct 2026 [1:41:45]","steps":["Where a patient takes their prescribed medication according to the medication plan that they agreed on with their prescriber. This might include the dose, route, frequency"],"note":null,"short":{"id":"form1:define medication adherence","title":"Medication adherence","hook":"Adhere = stick to the plan you AGREED.","groups":[{"q":"Definition","facts":[{"t":"Takes **prescribed medication** according to the **medication plan**","of":[0]},{"t":"… the plan **agreed on with their prescriber**","of":[0]},{"t":"The **dose**, **route**, **frequency**","of":[0]}]}]}},{"id":"q6151b570d3","group":"admin","who":"hers","title":"Four barriers to adherence","qt":"List four (FOUR) barriers that may prevent a patient from achieving medication adherence (4pt)","scenario":null,"source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 1, answers document, short answer Q18 · her answer gives examples · Joan’s feedback in class, Tue 20 Oct 2026 [1:42:50]","steps":["Inability to access their medication e.g. they do not have transport to the pharmacy","They do not understand why they need to take the medication","They may have a physical impairment that prevents them from being able to open the packaging","They may live a very busy lifestyle and forget to take doses"],"note":null,"short":{"id":"form1:list four four barriers","title":"Four barriers to adherence","hook":"Can’t get it · don’t get it · can’t open it · forget it.","groups":[{"q":"Her four examples","facts":[{"t":"Can’t **access** it — no **transport** to the pharmacy","of":[0]},{"t":"Doesn’t **understand why** they need to take it","of":[1]},{"t":"A **physical impairment** — can’t **open the packaging**","of":[2]},{"t":"A **busy lifestyle** — **forget** doses","of":[3]}]}]}},{"id":"q916719b57c","group":"life","who":"hers","title":"Oral amoxicillin at home — one tip","qt":"What is one piece of safe advice a Registered Nurse could discuss with a parent who is going to be storing and administering oral amoxicillin suspension to their child for the first time? (2pt)","scenario":null,"source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 1, answers document, short answer Q19 · her answer gives examples · Joan’s feedback in class, Tue 20 Oct 2026 [1:45:43]","steps":["It must be stored in the fridge","It must be stored out of reach of the child","You must finish the whole course to completely treat the infection","Use a proper medicine measuring cup or syringe, rather than a household teaspoon to measure"],"note":null,"short":{"id":"form1:what is one piece of safe advice","title":"Oral amoxicillin at home — one tip","hook":"Fridge · out of reach · finish it · measure it.","groups":[{"q":"Any one of her four","facts":[{"t":"Store it in the **fridge**","of":[0]},{"t":"Store it **out of reach** of the child","of":[1]},{"t":"**Finish the whole course**","of":[2]},{"t":"A proper **measuring cup** or **syringe**, not a **teaspoon**","of":[3]}]}]}},{"id":"q7481e70274","group":"life","who":"hers","title":"The placental barrier","qt":"Describe the function of the placental barrier (1pt)","scenario":"Sienna and Solomon have a 4-year-old child Max, and are currently 20 weeks pregnant. They are visiting their local Practice Nurse. Answer the following questions in relation to this scenario.","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 2, answers document, short answer Q11 · her answer gives examples","steps":["It separates maternal blood from foetal blood, and provides a non-selective barrier which many different nutrients and molecules may cross"],"note":null,"short":{"id":"form2:describe the function of the placental barrier","title":"The placental barrier","hook":"Separates the bloods — but is a leaky filter.","groups":[{"q":"Function","facts":[{"t":"**Separates maternal** blood from **foetal** blood","of":[0]},{"t":"A **non-selective** barrier: **many** nutrients and molecules **cross**","of":[0]}]}]}},{"id":"qdbd9e6bead","group":"life","who":"hers","title":"Teratogenic effect","qt":"Define the term teratogenic effect (1pt)","scenario":"Sienna and Solomon have a 4-year-old child Max, and are currently 20 weeks pregnant. They are visiting their local Practice Nurse. Answer the following questions in relation to this scenario.","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 2, answers document, short answer Q12 · her answer gives examples","steps":["This is an effect of a substance (such as a medication) which alters the development of a foetus during pregnancy e.g. it may change the growth and development of the brain"],"note":null,"short":{"id":"form2:define the term teratogenic effect","title":"Teratogenic effect","hook":"Terato = monster: it changes how the foetus forms.","groups":[{"q":"Definition","facts":[{"t":"A substance **alters the development** of a **foetus** in **pregnancy**","of":[0]}]},{"q":"Example","facts":[{"t":"Changes the **growth and development** of the **brain**","of":[0]}]}]}},{"id":"qabedfca023","group":"imm","who":"hers","title":"Two signs of anaphylaxis to watch","qt":"The nurse is administering vaccinations to Max. Identify two (2) symptoms of anaphylaxis that the nurse will need to monitor for (2pts)","scenario":"Sienna and Solomon have a 4-year-old child Max, and are currently 20 weeks pregnant. They are visiting their local Practice Nurse. Answer the following questions in relation to this scenario.","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 2, answers document, short answer Q13 · her answer gives examples","steps":["Noisy breathing e.g. stridor, wheeze","Persistent dizziness, they may collapse"],"note":null,"short":{"id":"form2:the nurse is administering vaccinations to max","title":"Two signs of anaphylaxis to watch","hook":"Airway noise, then circulation failing.","groups":[{"q":"Her two","facts":[{"t":"**Noisy breathing** — **stridor**, **wheeze**","of":[0]},{"t":"**Persistent dizziness** — may **collapse**","of":[1]}]}]}},{"id":"qa121026e5b","group":"calc","who":"hers","title":"Adrenaline 0.3 mg from 1:1000","qt":"If Max does experience anaphylaxis, he will need Adrenaline 0.3mg IM stat. Adrenaline ampoules of 1:1000 (1mg/1mL) are available. What volume of adrenaline would be administered to Max in a single dose? (1pt)","scenario":"Sienna and Solomon have a 4-year-old child Max, and are currently 20 weeks pregnant. They are visiting their local Practice Nurse. Answer the following questions in relation to this scenario.","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 2, answers document, short answer Q14","steps":["0.3mL"],"note":null,"short":{"id":"form2:if max does experience anaphylaxis","title":"Adrenaline 0.3 mg from 1:1000","hook":"1:1000 = 1 mg in 1 mL, so mg = mL.","groups":[{"q":"Volume","facts":[{"t":"**0.3mL**","of":[0]}]}]}},{"id":"qa00f100198","group":"law","who":"hers","title":"One ethical issue in a clinical trial","qt":"Sienna has been invited to participate in a clinical trial that evaluates the effectiveness of playing music while pregnant to improve the sleep of newborn infant. Identify and describe one (1) ethical consideration of Sienna participating in a clinical trial? (2pts)","scenario":"Sienna and Solomon have a 4-year-old child Max, and are currently 20 weeks pregnant. They are visiting their local Practice Nurse. Answer the following questions in relation to this scenario.","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 2, answers document, short answer Q15 · her answer gives examples","steps":["Informed consent: Sienna needs to know all of the information about the trial, the potential benefits, and the potential risks to her and the unborn foetus, before Sienna agrees to take part.","Informed consent: Sienna can remove her consent at any time, even if she agrees to take part in the study at the start."],"note":null,"short":{"id":"form2:sienna has been invited to participate","title":"One ethical issue in a clinical trial","hook":"Consent: fully informed, and she can always pull out.","groups":[{"q":"Either of her two","facts":[{"t":"**Informed consent**: knows the **benefits** and **risks** before agreeing","of":[0]},{"t":"Informed consent: can **remove her consent** at **any time**","of":[1]}]}]}},{"id":"qc97e8fd1c3","group":"pkpd","who":"hers","title":"ADME for an oral medicine","qt":"Name the four (4) key processes of pharmacokinetics that Angie’s anti-inflammatory medication will go through once is has been orally administered (4pt)","scenario":"Angie is a 17-year-old female. She has been brought into the Emergency Department because she has sprained her knee while out drinking alcohol and partying with her friends. She has been prescribed an anti-inflammatory medication to help reduce the pain and swelling in her knee. She is having her first dose of medication in hospital, then she will be picked up by her dad to go home. Answer the 3 (three) questions below in relation to this scenario","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 3, answers document, short answer Q13","steps":["A  Absorption into the bloodstream in the small intestine","D  Distribution of the drug throughout the body in the blood stream bound to plasma proteins","M  Metabolism in the liver by enzymes to make the drug water soluble and less toxic","E  Elimination of the drug in the urine by the kidneys"],"note":null,"short":{"id":"form3:name the four 4 key processes of pharmacokinetics","title":"ADME for an oral medicine","hook":"A-D-M-E: in, around, broken down, out.","groups":[{"q":"The four","facts":[{"t":"**Absorption** into the bloodstream in the **small intestine**","of":[0]},{"t":"**Distribution** in the blood, **bound to plasma proteins**","of":[1]},{"t":"**Metabolism** in the **liver** by **enzymes** — water soluble, less toxic","of":[2]},{"t":"**Elimination** in the **urine** by the **kidneys**","of":[3]}]}]}},{"id":"q16d2bb793c","group":"admin","who":"hers","title":"Anti-inflammatory at home — what to tell her","qt":"What are three (2) important factors you would talk about with Angie, so that she can safely manage her anti-inflammatory medication at home? (2pt)","scenario":"Angie is a 17-year-old female. She has been brought into the Emergency Department because she has sprained her knee while out drinking alcohol and partying with her friends. She has been prescribed an anti-inflammatory medication to help reduce the pain and swelling in her knee. She is having her first dose of medication in hospital, then she will be picked up by her dad to go home. Answer the 3 (three) questions below in relation to this scenario","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 3, answers document, short answer Q14","steps":["1 When to take it – explain prescribed times spaced out over the day. Do not tke more frequently","2 How to take it: swallow whole, with food and a glass of water","How long to take it for – until symptoms subside, advice from doctor or pharmacist"],"note":null,"short":{"id":"form3:what are three 2 important factors","title":"Anti-inflammatory at home — what to tell her","hook":"When · how · how long.","groups":[{"q":"Any two of her three","facts":[{"t":"**When**: prescribed times **spaced out**; not more often","of":[0]},{"t":"**How**: **swallow whole**, **with food** and **water**","of":[1]},{"t":"**How long**: until **symptoms subside**","of":[2]}]}]}},{"id":"q4910096107","group":"law","who":"hers","title":"One NZ medicine classification","qt":"Angie’s anti-inflammatory medication is available as a General Sale medication. Other legal classifications of medications in Aotearoa New Zealand include: Prescription Medicines Restricted Medicines (Pharmacist Only) Pharmacy-Only Medicines Choose one (1) of the three medication classifications listed about, and describe what this classification means (how would a patient access this type of medication?) (2pt)","scenario":"Angie is a 17-year-old female. She has been brought into the Emergency Department because she has sprained her knee while out drinking alcohol and partying with her friends. She has been prescribed an anti-inflammatory medication to help reduce the pain and swelling in her knee. She is having her first dose of medication in hospital, then she will be picked up by her dad to go home. Answer the 3 (three) questions below in relation to this scenario","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 3, answers document, short answer Q15","steps":["Prescription Medicines – only available with a prescription from an authorised prescriber eg doctor, NP, midwife","Restricted Medicines (Pharmacist Only) – only available at a Pharmacy after consultation and advice from a pharmacist. A record is kept.","Pharmacy-Only Medicines – only available at a Pharmacy or hospital pharmacy (in rural areas at a licenced shop)"],"note":null,"short":{"id":"form3:angie s anti inflammatory medication is available","title":"One NZ medicine classification","hook":"Prescription · Pharmacist-only · Pharmacy-only · General sale.","groups":[{"q":"Any one of her three","facts":[{"t":"**Prescription**: only with a prescription from an **authorised prescriber**","of":[0]},{"t":"**Restricted** (Pharmacist Only): after **advice from a pharmacist**; a **record is kept**","of":[1]},{"t":"**Pharmacy-Only**: only at a **Pharmacy** (rural: a **licenced shop**)","of":[2]}]}]}},{"id":"qee6d70ed05","group":"admin","who":"hers","title":"One right, applied in aged care","qt":"Identify one (1) of the rights of medication administration that the nurse will need to adhere to administer medication to Mr Mokaraka AND give a brief example of how this might be applied differently in the aged care setting (2pt)","scenario":"Mr. Mokaraka is 92. He is living in aged residential care because he has a diagnosis of dementia and cannot look after himself at home anymore. Mr Mokaraka is prescribed seven medications to manage a range of diagnoses. Answer the 3 (three) questions below in relation to this scenario","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 3, answers document, short answer Q16","steps":["Right person - identity may be checked with a photo","Drug – some drugs are contraindicated in the elderly","Dose – some normal ranges do not apply in the elderly eg “start low and go slow”","Time – coordinate with meals, sleep times etc","Route – may have difficulties swallowing. Check with patient and liaise with prescriber","Refusal - involvement of whanau/family and EPA"],"note":null,"short":{"id":"form3:identify one 1 of the rights","title":"One right, applied in aged care","hook":"Person · drug · dose · time · route · refusal.","groups":[{"q":"Any one of her six (right + how it changes)","facts":[{"t":"**Person** — identity checked with a **photo**","of":[0]},{"t":"**Drug** — some are **contraindicated** in the **elderly**","of":[1]},{"t":"**Dose** — “**start low and go slow**”","of":[2]},{"t":"**Time** — coordinate with **meals** and **sleep** times","of":[3]},{"t":"**Route** — **difficulties swallowing**: **liaise with prescriber**","of":[4]},{"t":"**Refusal** — involve **whanau**/family and **EPA**","of":[5]}]}]}},{"id":"qf90b5a4afd","group":"imm","who":"hers","title":"Route for the influenza vaccine","qt":"Mr. Mokaraka is due for his annual influenza vaccination. Name the correct route of administration for an influenza vaccination? (1pt)","scenario":"Mr. Mokaraka is 92. He is living in aged residential care because he has a diagnosis of dementia and cannot look after himself at home anymore. Mr Mokaraka is prescribed seven medications to manage a range of diagnoses. Answer the 3 (three) questions below in relation to this scenario","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 3, answers document, short answer Q17","steps":["IM deltoid muscle"],"note":null,"short":{"id":"form3:mr mokaraka is due for his annual influenza","title":"Route for the influenza vaccine","hook":"Flu jab: into the shoulder muscle.","groups":[{"q":"Route","facts":[{"t":"**IM**, **deltoid** muscle","of":[0]}]}]}},{"id":"q2fd878a20c","group":"admin","who":"hers","title":"Paracetamol 10 g QID — next step","qt":"Mr. Mokaraka has a new prescription in his medication chart: Paracetamol 10g PO QID. The Registered Nurse on shift notices that this is an unusually high dose. Describe one (1) appropriate next step that the RN should take, before administering Paracetamol to Mr. Mokaraka (1pt)","scenario":"Mr. Mokaraka is 92. He is living in aged residential care because he has a diagnosis of dementia and cannot look after himself at home anymore. Mr Mokaraka is prescribed seven medications to manage a range of diagnoses. Answer the 3 (three) questions below in relation to this scenario","source":"Question and model answer are Joan’s · Joan’s Formative mini-exam 3, answers document, short answer Q18","steps":["Hold off giving the drug until you have notified the prescriber and checked the dose","Do not refuse to give paracetamol – he needs analgesia"],"note":null,"short":{"id":"form3:mr mokaraka has a new prescription","title":"Paracetamol 10 g QID — next step","hook":"Hold and check — but he still needs analgesia.","groups":[{"q":"Her answer","facts":[{"t":"**Hold off** until you have **notified the prescriber** and **checked the dose**","of":[0]},{"t":"**Do not refuse** to give paracetamol — he **needs analgesia**","of":[1]}]}]}},{"id":"qaed3f64a10","group":"found","who":"tool","title":"Paracetamol under 3 months","qt":"Why should paracetamol not be given to a baby under 3 months (or under 5 kg) without medical advice?","scenario":null,"source":"Question and model answer are the tool’s · from Lifespan 2026 slide 29 (BPAC NZ, 2018) · Joan’s 20 Oct revision session [0:19:23–0:25:39]","steps":["The baby’s liver enzymes are not yet developed, so paracetamol is metabolised more slowly.","Toxic metabolites build up in the blood, so the risk of overdose and liver injury is higher."],"note":null,"short":{"id":"joan-drugs:why should paracetamol not be given to a baby","title":"Paracetamol under 3 months","hook":"Young liver, slow clearance, toxic build-up.","groups":[{"q":"Why not","facts":[{"t":"Liver **enzymes** not yet developed","of":[0]},{"t":"Paracetamol **metabolised** more slowly","of":[0]},{"t":"**Toxic** metabolites build up in the blood","of":[1]},{"t":"Higher risk of overdose and **liver injury**","of":[1]}]}]}},{"id":"qc553ad0325","group":"found","who":"tool","title":"Contraindication","qt":"What is the meaning of “contraindication”? Give an example.","scenario":null,"source":"Question and model answer are the tool’s · from Joan’s own example of a short answer, Legal & Ethical lecture 16 Sep 2026 [1:05:06]; definition from deck 01 Pharmacology Concepts (1), slide 31","steps":["Definition: a situation in which a medication should NOT be used, because it may be harmful to the person.","Example: a known severe allergy to that medicine — it must not be given; or a medicine known to harm the foetus in a woman who is pregnant."],"note":null,"short":{"id":"joan-found:what is the meaning of contraindication","title":"Contraindication","hook":"CONTRA = against: a reason NOT to give it.","groups":[{"q":"Definition","facts":[{"t":"A situation where a medication should **not be used**","of":[0]},{"t":"… because it **may be harmful** to the person","of":[0]}]},{"q":"Example","facts":[{"t":"A known **severe allergy** to that medicine","of":[1]},{"t":"Or a medicine that can **harm the foetus** in a **pregnant** woman","of":[1]}]}]}},{"id":"q4aa9ab8e04","group":"found","who":"tool","title":"Medication interaction","qt":"Define a medication interaction and give an example.","scenario":null,"source":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (1), slide 32","steps":["Definition: a reaction in which the effect or activity of a medication is altered by another substance or condition — another medication, a food, a complementary or alternative medicine, or a medical condition.","Example: a herbal remedy or a food that changes how much of a prescribed medicine is absorbed or broken down, making it stronger or weaker — which is why a nurse asks about everything the person takes."],"note":null,"short":{"id":"joan-found:define a medication interaction and give","title":"Medication interaction","hook":"Something else changes what the medicine does.","groups":[{"q":"Definition","facts":[{"t":"The medicine’s **effect** is **altered by another substance or condition**","of":[0]},{"t":"Another **medication**, a **food**, a **complementary** medicine, an illness","of":[0]}]},{"q":"Example","facts":[{"t":"A **herbal remedy** or food changes how much is **absorbed or broken down**","of":[1]},{"t":"… making it **stronger or weaker**","of":[1]},{"t":"So the nurse **asks about everything** the person takes","of":[1]}]}]}},{"id":"qc2a33fa1bc","group":"found","who":"tool","title":"Local vs systemic effect","qt":"Distinguish a local effect from a systemic effect of a medication, and give an example of each.","scenario":null,"source":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (2), slides 26–27","steps":["Local effect: the effect occurs at the immediate site of administration — e.g. a cream applied to a skin rash, or eye drops.","Systemic effect: the medication must be absorbed into the circulation and distributed to the place where it acts — e.g. a tablet swallowed for a headache."],"note":null,"short":{"id":"joan-found:distinguish a local effect from a","title":"Local vs systemic effect","hook":"Local = right where it goes on. Systemic = through the blood.","groups":[{"q":"Local","facts":[{"t":"At the **immediate site of administration**","of":[0]},{"t":"e.g. a **cream** on a skin rash; **eye drops**","of":[0]}]},{"q":"Systemic","facts":[{"t":"**Absorbed into the circulation** and **distributed** to where it acts","of":[1]},{"t":"e.g. a **tablet swallowed** for a headache","of":[1]}]}]}},{"id":"q2540c548d3","group":"pkpd","who":"tool","title":"Bioavailability","qt":"Define bioavailability and give an example comparing two routes.","scenario":null,"source":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slide 34","steps":["Definition: how much of the dose actually reaches the bloodstream.","Example: intravenous = 100%; the same medicine by mouth is lower, because some is not absorbed from the gut and some is broken down by the liver before it reaches the circulation."],"note":null,"short":{"id":"joan-pkpd:define bioavailability and give an example","title":"Bioavailability","hook":"How much actually arrives. IV = all of it.","groups":[{"q":"Definition","facts":[{"t":"How much of the dose **actually reaches the bloodstream**","of":[0]}]},{"q":"Two routes compared","facts":[{"t":"**Intravenous = 100%**","of":[1]},{"t":"By mouth it is **lower**: some **not absorbed**, some **broken down by the liver**","of":[1]}]}]}},{"id":"q00b0ae36d3","group":"pkpd","who":"tool","title":"Plasma protein binding","qt":"What is plasma protein binding, and why does it matter? Give an example.","scenario":null,"source":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slides 37–38","steps":["Definition: many drugs bind reversibly to plasma proteins, mainly albumin; only the FREE (unbound) drug can leave the blood and have an effect.","Example: two highly protein-bound medicines compete for the same binding site, or a malnourished older adult has low albumin — more free drug circulates, so the effect and the risk of toxicity increase."],"note":null,"short":{"id":"joan-pkpd:what is plasma protein binding and","title":"Plasma protein binding","hook":"Only the FREE drug works.","groups":[{"q":"Definition","facts":[{"t":"Many drugs **bind** reversibly to **plasma proteins**, mainly **albumin**","of":[0]},{"t":"Only the **free** (**unbound**) drug can act","of":[0]}]},{"q":"Why it matters, with an example","facts":[{"t":"Two medicines **compete for the same binding site**","of":[1]},{"t":"Or **low albumin** in a **malnourished** older adult","of":[1]},{"t":"More **free drug** → more effect, **risk of toxicity**","of":[1]}]}]}},{"id":"qa471ade3d3","group":"pkpd","who":"tool","title":"Half-life","qt":"Define half-life and give an example of how it is used.","scenario":null,"source":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 32 and 38; speaker notes to deck 09 slide 20","steps":["Definition: the time taken for the plasma concentration of a drug to fall by one half — not how long the whole drug stays in the body.","Example: a medicine with a 6-hour half-life is almost completely cleared after about 5 half-lives (30 hours), and takes about 3–5 half-lives of regular dosing to reach steady state — which is what sets the dosing interval."],"note":null,"short":{"id":"joan-pkpd:define half life and give an","title":"Half-life","hook":"Half gone each half-life; about five of them and it is all gone.","groups":[{"q":"Definition","facts":[{"t":"The time for the **plasma concentration** to **fall by one half**","of":[0]},{"t":"Not how long the **whole drug** stays in the body","of":[0]}]},{"q":"How it is used","facts":[{"t":"Cleared after about **5 half-lives**","of":[1]},{"t":"**Steady state** after **3–5 half-lives** of regular dosing","of":[1]},{"t":"It sets the **dosing interval**","of":[1]}]}]}},{"id":"q001d7cf710","group":"pkpd","who":"tool","title":"The therapeutic range","qt":"Define the therapeutic range and give an example of when it is monitored.","scenario":null,"source":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 36–37","steps":["Definition: the range of plasma concentration within which a drug produces its desired effect without causing toxicity — above the minimum effective concentration and below the toxic one.","Example: therapeutic drug monitoring for a medicine with a NARROW therapeutic range (such as some anticoagulants) — blood levels are taken at peak and trough to keep the dose safe and effective."],"note":null,"short":{"id":"joan-pkpd:define the therapeutic range and give","title":"The therapeutic range","hook":"Enough to work, not enough to poison.","groups":[{"q":"Definition","facts":[{"t":"The **plasma concentration** range that gives the **desired effect** without **toxicity**","of":[0]},{"t":"Above the **minimum effective concentration**, below the **toxic** one","of":[0]}]},{"q":"When it is monitored","facts":[{"t":"**Therapeutic drug monitoring** for a **narrow therapeutic range**","of":[1]},{"t":"Blood levels at **peak and trough**","of":[1]}]}]}},{"id":"q7fdc63c15b","group":"admin","who":"tool","title":"Medication error vs adverse effect","qt":"Define a medication error and give an example. How does it differ from an adverse effect?","scenario":null,"source":"Question and model answer are the tool’s · from deck 05 Medication Administration & Patient Education (2), slides 4–5","steps":["Definition: any preventable event that may cause or lead to inappropriate medication use or patient harm while the medication is in the control of the health professional, patient or consumer. Example: a dose given twice because the first was not documented, or a medicine given to a patient with a known allergy to it.","Difference: an adverse effect is harm caused by the medicine itself, even when used correctly; a medication error is harm arising from human action — most trace back to a lapse in the rights and checks."],"note":null,"short":{"id":"joan-admin:define a medication error and give","title":"Medication error vs adverse effect","hook":"Error = a person slipped. Adverse effect = the medicine did it.","groups":[{"q":"Definition","facts":[{"t":"Any **preventable event** that may cause **inappropriate medication use** or **patient harm**","of":[0]},{"t":"… while the medicine is **in the control** of staff or patient","of":[0]},{"t":"e.g. a **dose given twice**; a known **allergy** ignored","of":[0]}]},{"q":"How it differs from an adverse effect","facts":[{"t":"Adverse effect: harm from **the medicine itself**, **even when used correctly**","of":[1]},{"t":"Error: harm from **human action**, a lapse in the **rights and checks**","of":[1]}]}]}},{"id":"q8dc9e9266c","group":"admin","who":"tool","title":"CARM: what it is, who reports","qt":"What is CARM, and who can report to it? Give an example of something that should be reported.","scenario":null,"source":"Question and model answer are the tool’s · from deck 04 Pharmacodynamics, slide 48; deck 09 Legal & Ethical Aspects, slide 10","steps":["Definition: the Centre for Adverse Reactions Monitoring — New Zealand’s database of suspected adverse reactions to medicines and vaccines; health professionals, patients and whānau can all report.","Example: a patient develops a widespread rash and facial swelling after starting a new medicine — it is documented, an alert is placed on their record, and it is reported to CARM."],"note":null,"short":{"id":"joan-admin:what is carm and who can","title":"CARM: what it is, who reports","hook":"A reaction? Document it, flag it, report it to CARM.","groups":[{"q":"What it is, and who reports","facts":[{"t":"The **Centre for Adverse Reactions Monitoring**","of":[0]},{"t":"NZ’s database of **suspected adverse reactions** to medicines and **vaccines**","of":[0]},{"t":"**Health professionals**, **patients and whānau** can all report","of":[0]}]},{"q":"Example to report","facts":[{"t":"A **widespread rash** and **facial swelling** after **starting a new medicine**","of":[1]},{"t":"It is **documented**, an **alert** placed on the record, and **reported**","of":[1]}]}]}},{"id":"qbe831fca79","group":"life","who":"tool","title":"Polypharmacy","qt":"Define polypharmacy and give an example of a risk it raises.","scenario":null,"source":"Question and model answer are the tool’s · from deck 06a Medication in the Elderly & Polypharmacy, slides 34–36","steps":["Definition: the concurrent use of multiple medications, usually five or more — with the connotation that too many, or unnecessary, medicines are being taken.","Example (any one): an older adult on many medicines has a higher risk of drug–drug interactions and adverse effects, of falls, of not taking them as prescribed, and of death."],"note":null,"short":{"id":"joan-life:define polypharmacy and give an example","title":"Polypharmacy","hook":"Five or more, and the risks multiply.","groups":[{"q":"Definition","facts":[{"t":"The **concurrent use of multiple medications**, usually **five or more**","of":[0]},{"t":"It implies **too many**, or **unnecessary**, medicines","of":[0]}]},{"q":"A risk it raises (any one)","facts":[{"t":"**Drug–drug interactions** and **adverse effects**","of":[1]},{"t":"**Falls**; not taking them **as prescribed**; **death**","of":[1]}]}]}},{"id":"qa170e24e78","group":"life","who":"tool","title":"Medicines in breast milk","qt":"On what does the transfer of a medicine into breast milk depend, and what is the guiding principle for a breastfeeding parent who needs medication?","scenario":null,"source":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slide 18","steps":["Most medicines can enter breast milk. How much reaches the infant depends on the parent’s plasma concentration of the drug, the amount of milk the infant consumes, and the drug’s lipid solubility.","Principle, with example: maintaining the parent’s health is essential, so a needed medicine should not automatically be stopped — the prescriber weighs the risk to the infant against the risk of not treating the parent."],"note":null,"short":{"id":"joan-life:on what does the transfer of","title":"Medicines in breast milk","hook":"Blood level, milk amount, fat-solubility. Keep the parent well.","groups":[{"q":"What the transfer depends on","facts":[{"t":"The parent’s **plasma concentration** of the drug","of":[0]},{"t":"The **amount of milk** the infant takes","of":[0]},{"t":"The drug’s **lipid solubility**","of":[0]}]},{"q":"The guiding principle","facts":[{"t":"**Maintaining the parent’s health is essential**","of":[1]},{"t":"Not **automatically** stopped: the prescriber **weighs the risk** to the infant","of":[1]}]}]}},{"id":"qe03adddc9f","group":"life","who":"tool","title":"Children are not small adults","qt":"“Children are just small adults.” Explain why this is false for medicines, and give an example.","scenario":null,"source":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slides 24–25","steps":["Children are physiologically different from adults and constantly developing: different body composition (about 75% water, less fat), immature protective barriers, and poorer temperature and homeostatic control — so they handle medicines differently.","Example: a child’s dose is calculated from body weight (mg per kg), never by simply scaling down an adult dose."],"note":null,"short":{"id":"joan-life:children are just small adults explain","title":"Children are not small adults","hook":"Different bodies, so doses by the kilo.","groups":[{"q":"Why it is false","facts":[{"t":"Children are **physiologically different** and **constantly developing**","of":[0]},{"t":"About **75% water**, less fat; **immature protective barriers**","of":[0]},{"t":"Poorer **temperature** and **homeostatic control**","of":[0]}]},{"q":"Example","facts":[{"t":"The dose comes from **body weight** (**mg per kg**)","of":[1]},{"t":"**Never** by simply **scaling down an adult dose**","of":[1]}]}]}},{"id":"qd71245f58b","group":"law","who":"tool","title":"Controlled drugs","qt":"What is a controlled drug? Give an example of how controlled drugs are handled differently on a ward.","scenario":null,"source":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [00:00–02:39]; deck 09 Legal & Ethical Aspects, slides 12–14","steps":["Definition: a medicine placed under special legal restriction by the Misuse of Drugs Act 1975 because of its potential for abuse, dependence and harm. All controlled drugs are prescribed, but not all prescribed drugs are controlled.","Example: opioids such as morphine (Class B) are kept in a double-locked safe inside a locked medication room with restricted key-holders, and there are penalties for unlawful prescribing, supply or administration."],"note":null,"short":{"id":"joan-law:what is a controlled drug give","title":"Controlled drugs","hook":"Misuse of Drugs Act: abuse risk = double-locked.","groups":[{"q":"Definition","facts":[{"t":"A medicine under **special legal restriction**: **Misuse of Drugs Act 1975**","of":[0]},{"t":"Because of its **potential for abuse**, **dependence** and harm","of":[0]},{"t":"All controlled drugs are prescribed; **not all prescribed drugs are controlled**","of":[0]}]},{"q":"How they are handled on a ward","facts":[{"t":"**Opioids** like **morphine** (**Class B**)","of":[1]},{"t":"Kept in a **double-locked safe** inside a locked room","of":[1]},{"t":"**Restricted key-holders**; **penalties** for unlawful use","of":[1]}]}]}},{"id":"q3d3fe77921","group":"law","who":"tool","title":"Scope of practice","qt":"Define “scope of practice” and give an example of something outside a registered nurse’s scope.","scenario":null,"source":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [09:10] and [26:29]; deck 09 Legal & Ethical Aspects, slides 7, 20 and 30–31","steps":["Definition: the area of practice a practitioner is educated, competent and authorised to work in, set by the regulatory authority (the Nursing Council) under the HPCAA — about demonstrated competence, not a list of tasks.","Example (any one): prescribing a medicine (unless a designated RN prescriber) · dispensing — moving stock from bulk into a labelled patient pack is the pharmacist’s role · practising in a specialty the nurse has no training or experience in."],"note":null,"short":{"id":"joan-law:define scope of practice and give","title":"Scope of practice","hook":"What you are educated, competent and authorised to do.","groups":[{"q":"Definition","facts":[{"t":"The area a practitioner is **educated, competent and authorised** to work in","of":[0]},{"t":"Set by the **Nursing Council** under the **HPCAA**","of":[0]},{"t":"About **demonstrated competence**, **not a list of tasks**","of":[0]}]},{"q":"Outside an RN’s scope (any one)","facts":[{"t":"**Prescribing** (unless a **designated RN prescriber**)","of":[1]},{"t":"**Dispensing**: that is the **pharmacist’s role**","of":[1]}]}]}},{"id":"qe0b90dee19","group":"law","who":"tool","title":"Privacy, and a phone enquiry","qt":"Explain the nurse’s duty of privacy and confidentiality, and give an example involving a telephone enquiry.","scenario":null,"source":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [43:04–45:07]; deck 09 Legal & Ethical Aspects, slide 59","steps":["Duty (Code of Conduct Principle 5): protect personal health information and use or share it only for appropriate professional purposes — it is the patient’s information, and notes are accessed only by those caring for that patient.","Example: a caller says she is a patient’s wife and asks how he is. The answer is “sorry, we can’t give patient information over the phone” — you cannot verify who is calling; offer to ring back or have the patient ring them."],"note":null,"short":{"id":"joan-ethics:explain the nurse s duty of","title":"Privacy, and a phone enquiry","hook":"You can’t see who is calling, so you can’t tell them.","groups":[{"q":"The duty","facts":[{"t":"**Code of Conduct Principle 5**: **protect personal health information**","of":[0]},{"t":"Share it only for **appropriate professional purposes**","of":[0]},{"t":"Notes are read only by **those caring for that patient**","of":[0]}]},{"q":"The phone example","facts":[{"t":"“Sorry, we **can’t give patient information over the phone**”","of":[1]},{"t":"You **cannot verify who is calling**; offer to **ring back**","of":[1]}]}]}},{"id":"qfb56a27bba","group":"law","who":"tool","title":"Autonomy","qt":"Define autonomy and give an example relating to medicines.","scenario":null,"source":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [56:25]; deck 09 Legal & Ethical Aspects, slide 73","steps":["Definition: the right of choice — informed, voluntary consent without coercion, with appropriate disclosure and checking of understanding, including the right to refuse and to withdraw at any time.","Example: a competent patient declines a prescribed medicine. The nurse checks they understand the consequences, respects the refusal, documents it and informs the prescriber — they do not pressure or hide it in food."],"note":null,"short":{"id":"joan-ethics:define autonomy and give an example","title":"Autonomy","hook":"Their body, their choice, even when it is no.","groups":[{"q":"Definition","facts":[{"t":"The **right of choice**","of":[0]},{"t":"**Informed, voluntary consent**, **without coercion**","of":[0]},{"t":"Including the **right to refuse** and to **withdraw** at any time","of":[0]}]},{"q":"Example","facts":[{"t":"A **competent patient declines** a medicine","of":[1]},{"t":"The nurse checks they **understand the consequences**, **respects the refusal**, **documents it**","of":[1]}]}]}},{"id":"qba72713fbf","group":"law","who":"tool","title":"Why hiding an error is worse","qt":"Why is concealing a medication error treated more seriously than the error itself? Give an example.","scenario":null,"source":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [15:52–21:02] and [24:42]; deck 09 Legal & Ethical Aspects, slides 26–27","steps":["Reason: an error is usually accidental and is managed in-house — report it, reflect, be supervised for a time. Concealment is deliberate: it denies the patient monitoring and treatment, and it breaches integrity (Code of Conduct Principle 7), so it becomes professional misconduct.","Example: “Nurse D” gave the wrong medicine, realised 20 minutes later, did nothing and took two days to report; the patient died. She was found guilty of professional misconduct, suspended, fined and supervised."],"note":null,"short":{"id":"joan-ethics:why is concealing a medication error","title":"Why hiding an error is worse","hook":"An error is an accident. Hiding it is a choice.","groups":[{"q":"The reason","facts":[{"t":"An error is usually **accidental**: **report it**, **reflect**, **be supervised**","of":[0]},{"t":"**Concealment is deliberate**: it **denies the patient monitoring and treatment**","of":[0]},{"t":"It **breaches integrity** (**Principle 7**): **professional misconduct**","of":[0]}]},{"q":"Example","facts":[{"t":"“**Nurse D**” took **two days to report**; the **patient died**","of":[1]},{"t":"Found **guilty of professional misconduct**: **suspended**, **fined**, supervised","of":[1]}]}]}},{"id":"q0dc4be8381","group":"law","who":"tool","title":"Bioequivalence","qt":"Define bioequivalence and explain why it matters, with an example.","scenario":null,"source":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 6 (“Remember bioequivalence!”); defined in deck 01 Pharmacology Concepts (1), slides 49–50","steps":["Definition: two formulations are bioequivalent when the same active ingredient reaches the bloodstream at the same rate and to the same extent.","Why and example: a generic may only be substituted for a brand if it is bioequivalent, so the patient gets the same therapeutic effect — e.g. a pharmacy dispensing the funded generic instead of the original brand of the same medicine."],"note":null,"short":{"id":"joan-devmkt:define bioequivalence and explain why it","title":"Bioequivalence","hook":"Same ingredient, same rate, same amount = swappable.","groups":[{"q":"Definition","facts":[{"t":"The **same active ingredient** reaches the bloodstream","of":[0]},{"t":"At the **same rate** and to the **same extent**","of":[0]}]},{"q":"Why it matters, with an example","facts":[{"t":"A **generic** may only be **substituted** for a brand if **bioequivalent**","of":[1]},{"t":"So the patient gets the **same therapeutic effect**","of":[1]},{"t":"e.g. dispensing the **funded generic** instead of the original brand","of":[1]}]}]}},{"id":"qeb2b33db6b","group":"law","who":"tool","title":"Phase 4: post-market monitoring","qt":"What is Phase 4 of clinical research, and why does it exist? Give an example.","scenario":null,"source":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 11–12","steps":["Definition: post-market monitoring of long-term safety and effectiveness in several thousand patients over years, after Medsafe approval.","Why and example: rare or delayed adverse effects only show up at population scale — e.g. a medicine withdrawn after post-market reports revealed a serious risk the trials were too small to see."],"note":null,"short":{"id":"joan-devmkt:what is phase 4 of clinical","title":"Phase 4: post-market monitoring","hook":"Rare harms only show up across a whole population.","groups":[{"q":"What it is","facts":[{"t":"**Post-market monitoring** of **long-term safety**","of":[0]},{"t":"**Several thousand patients**, over years, **after Medsafe approval**","of":[0]}]},{"q":"Why it exists, with an example","facts":[{"t":"**Rare or delayed adverse effects** only show at **population scale**","of":[1]},{"t":"e.g. a medicine **withdrawn** after **post-market reports**","of":[1]}]}]}},{"id":"q156716d6b7","group":"law","who":"tool","title":"Direct-to-consumer advertising","qt":"What is direct-to-consumer advertising of medicines, and why is Aotearoa New Zealand unusual?","scenario":null,"source":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 22 and 24","steps":["Definition: advertising that promotes a specific branded prescription medicine to the public — its benefits, uses and risks.","New Zealand is one of only two developed countries that permit it; most restrict prescription-medicine advertising to health professionals, because consumer advertising can drive demand for medicines that may not be appropriate."],"note":null,"short":{"id":"joan-devmkt:what is direct to consumer advertising","title":"Direct-to-consumer advertising","hook":"Prescription-medicine ads aimed at the public: rare worldwide.","groups":[{"q":"What it is","facts":[{"t":"It promotes a **branded prescription medicine** **to the public**","of":[0]}]},{"q":"Why NZ is unusual","facts":[{"t":"**One of only two developed countries** that **permit it**","of":[1]},{"t":"Most restrict it to **health professionals**","of":[1]},{"t":"It can **drive demand** for medicines that **may not be appropriate**","of":[1]}]}]}},{"id":"q9b611d5393","group":"imm","who":"tool","title":"Preventing an allergic exposure","qt":"How does a nurse prevent a patient being given a substance they are allergic to? Give an example.","scenario":null,"source":"Question and model answer are the tool’s · from the Allergic Reactions deck (Module 8), slide 6","steps":["Avoidance: identify the allergen and avoid it — check for allergies at every healthcare encounter, record them, and the patient wears an allergy bracelet; take special care with highly suspect substances such as contrast dyes, iodine and antimicrobials.","Example: before giving an antibiotic, ask the patient about allergies and check their bracelet and the allergy section of the chart; a new reaction is documented and the prescriber told."],"note":null,"short":{"id":"joan-imm:how does a nurse prevent a patient","title":"Preventing an allergic exposure","hook":"Ask every time; check the bracelet; beware the suspects.","groups":[{"q":"Avoidance","facts":[{"t":"**Check** for allergies at **every healthcare encounter**","of":[0]},{"t":"**Record** them; the patient wears an **allergy bracelet**","of":[0]},{"t":"**Highly suspect**: **contrast dyes**, **iodine**, **antimicrobials**","of":[0]}]},{"q":"Example","facts":[{"t":"Before an **antibiotic**: **ask**, check **bracelet** and **chart**","of":[1]},{"t":"A new reaction is **documented**; the **prescriber told**","of":[1]}]}]}},{"id":"q76e9831e9b","group":"imm","who":"tool","title":"Active immunity — natural and artificial","qt":"Define active immunity and give an example of natural and of artificial active immunity.","scenario":null,"source":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slides 23–24; the schedule from the Vaccinations & Recognising Allergy deck (Module 8), slide 7","steps":["Definition: immunity made and directed by the person’s own immune system, which stores memory B cells.","Natural: recovering from an infection, e.g. after having chickenpox. Artificial: a vaccination, which stimulates the response without the damage of infection, e.g. the MMR vaccine at 12 months."],"note":null,"short":{"id":"joan-imm:define active immunity and give","title":"Active immunity — natural and artificial","hook":"Active = your own body did the work.","groups":[{"q":"Definition","facts":[{"t":"Made by the person’s **own immune system**","of":[0]},{"t":"Stores **memory B cells**","of":[0]}]},{"q":"Examples","facts":[{"t":"**Natural**: **recovering** from an infection, e.g. **chickenpox**","of":[1]},{"t":"**Artificial**: a **vaccination**, e.g. **MMR** at **12 months**","of":[1]}]}]}},{"id":"q281ececc27","group":"imm","who":"tool","title":"Passive immunity — natural and artificial","qt":"Define passive immunity and give an example of natural and of artificial passive immunity.","scenario":null,"source":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slides 25, 27–28","steps":["Definition: antibodies introduced from a different source rather than made by the person’s own immune system — protection that is immediate but temporary.","Natural: a mother’s antibodies crossing the placenta or in breastmilk. Artificial: lab-made monoclonal antibodies, e.g. pre-exposure prophylaxis for someone immunocompromised at high risk of COVID-19."],"note":null,"short":{"id":"joan-imm:define passive immunity and give","title":"Passive immunity — natural and artificial","hook":"Passive = borrowed antibodies: instant, but they run out.","groups":[{"q":"Definition","facts":[{"t":"**Antibodies** from a **different source**","of":[0]},{"t":"**Immediate** but **temporary**","of":[0]}]},{"q":"Examples","facts":[{"t":"**Natural**: across the **placenta** or in **breastmilk**","of":[1]},{"t":"**Artificial**: lab-made **monoclonal antibodies**","of":[1]},{"t":"e.g. **pre-exposure prophylaxis** for someone **immunocompromised**","of":[1]}]}]}},{"id":"q0c83fbbca5","group":"imm","who":"tool","title":"Herd immunity","qt":"Define herd immunity and give an example of who it protects.","scenario":null,"source":"Question and model answer are the tool’s · from the Vaccinations & Recognising Allergy deck (Module 8), slide 4","steps":["Definition: when most people in a community are vaccinated, pathogens cannot spread easily, so the whole community is protected — some diseases can even be reduced or eliminated, e.g. polio.","Who it protects: people who cannot be vaccinated or do not respond — e.g. the very young, the elderly, the immunocompromised and “non-responders”."],"note":null,"short":{"id":"joan-imm:define herd immunity and give an example","title":"Herd immunity","hook":"Enough people immune, and the bug has nowhere to go.","groups":[{"q":"Definition","facts":[{"t":"**Most people** vaccinated: pathogens **cannot spread easily**","of":[0]},{"t":"The **whole community** is protected","of":[0]},{"t":"Some diseases **reduced** or **eliminated**, e.g. **polio**","of":[0]}]},{"q":"Who it protects","facts":[{"t":"Those who **cannot be vaccinated** or **do not respond**","of":[1]},{"t":"**Very young**, **elderly**, **immunocompromised**, **non-responders**","of":[1]}]}]}},{"id":"q93ca7c843d","group":"imm","who":"tool","title":"Live vs non-live vaccines","qt":"Distinguish a live (attenuated) vaccine from a non-live vaccine, with an example of each and a group a live vaccine is not safe for.","scenario":null,"source":"Question and model answer are the tool’s · from the Vaccinations & Recognising Allergy deck (Module 8), slide 5","steps":["Live (attenuated): weakened pathogens that replicate without causing disease — e.g. MMR, varicella, rotavirus, BCG.","Non-live: cannot replicate — inactivated (the germ is killed, e.g. polio), subunit (only microbial fragments) or mRNA (genetic instructions to make a viral protein, e.g. COVID-19).","Not safe: live vaccines are not safe in pregnancy or immunosuppression — e.g. MMR is not given to a pregnant woman."],"note":null,"short":{"id":"joan-imm:distinguish a live attenuated vaccine","title":"Live vs non-live vaccines","hook":"Live replicates — so not in pregnancy or immunosuppression.","groups":[{"q":"Live (attenuated)","facts":[{"t":"**Weakened pathogens** that **replicate** without disease","of":[0]},{"t":"e.g. **MMR**, **varicella**, **rotavirus**, **BCG**","of":[0]}]},{"q":"Non-live","facts":[{"t":"**Cannot replicate**","of":[1]},{"t":"**Inactivated** (e.g. **polio**), **subunit**, **mRNA** (e.g. **COVID-19**)","of":[1]}]},{"q":"Not safe for","facts":[{"t":"**Pregnancy** or **immunosuppression**","of":[2]},{"t":"e.g. **MMR** not given to a **pregnant woman**","of":[2]}]}]}},{"id":"q19c3118d47","group":"imm","who":"tool","title":"Fever — put the vaccine off","qt":"Why is a fever a reason not to give a vaccination that day? Give an example.","scenario":null,"source":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slide 31 (“Fever as a contraindication”)","steps":["Reason: the immune system can only do one task at a time — if it is already busy responding to something else, it may not respond to the vaccine’s antigen and learn to recognise that disease.","Example: a child who arrives for their 3-month vaccinations with a fever — the vaccination is put off and rebooked once they are well."],"note":null,"short":{"id":"joan-imm:why is a fever a reason not","title":"Fever — put the vaccine off","hook":"The immune system can only do one job at a time.","groups":[{"q":"Reason","facts":[{"t":"The immune system does **one task at a time**","of":[0]},{"t":"**Busy** with something else: may **not respond** to the vaccine","of":[0]}]},{"q":"Example","facts":[{"t":"A child with a **fever** at their **3-month vaccinations**","of":[1]},{"t":"**Put off**, **rebooked** once **well**","of":[1]}]}]}},{"id":"q071ce622d2","group":"tox","who":"tool","title":"Licit vs illicit","qt":"Define a licit drug and an illicit drug, with an example of each.","scenario":null,"source":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slides 7 and 19","steps":["Licit: a medication or drug that is lawful and permitted — prescription, restricted, pharmacy-only and general sale medicines, and some controlled drugs (some Class B and C). Example: alcohol, or an opioid analgesic taken as prescribed.","Illicit: a drug that is unlawful or otherwise not permitted — every Class A controlled drug, some Class B and a few Class C. Example: methamphetamine (Class A)."],"note":null,"short":{"id":"joan-tox:define a licit drug and an illicit","title":"Licit vs illicit","hook":"Licit = Lawful. Illicit = Illegal. Every Class A is illicit.","groups":[{"q":"Licit","facts":[{"t":"**Lawful and permitted**: prescription to **general sale** medicines","of":[0]},{"t":"Plus **some controlled drugs** (some **Class B and C**)","of":[0]},{"t":"Example: **alcohol**, or an **opioid** taken **as prescribed**","of":[0]}]},{"q":"Illicit","facts":[{"t":"**Unlawful** or **not permitted**","of":[1]},{"t":"**every Class A**, **some Class B**, a **few Class C**","of":[1]},{"t":"Example: **methamphetamine** (Class A)","of":[1]}]}]}},{"id":"q49ce46eb6e","group":"tox","who":"tool","title":"Drug tolerance","qt":"Define drug tolerance and give an example.","scenario":null,"source":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 13","steps":["Definition: a physical state in which repeated doses of a drug cause decreasing effects, or the dose must be increased to maintain the same effect (receptor downregulation, from pharmacodynamics).","Example: a person on regular morphine needs higher doses for the same pain relief — morphine users develop tolerance rapidly, whereas marijuana causes little tolerance. Not every drug causes it."],"note":null,"short":{"id":"joan-tox:define drug tolerance and give an","title":"Drug tolerance","hook":"Same dose, less effect: you need MORE.","groups":[{"q":"Definition","facts":[{"t":"Repeated doses cause **decreasing effects**","of":[0]},{"t":"Or the **dose must be increased** for the **same effect**","of":[0]},{"t":"Mechanism: **receptor downregulation**","of":[0]}]},{"q":"Example","facts":[{"t":"**Morphine**: tolerance develops **rapidly**","of":[1]},{"t":"**Marijuana**: **little tolerance**. **Not every drug** causes it","of":[1]}]}]}},{"id":"q7f23095410","group":"tox","who":"tool","title":"Withdrawal","qt":"What is withdrawal? Give an example of its symptoms and what affects how severe it is.","scenario":null,"source":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 11 (a Pusheen slide: the concept, not the full symptom list)","steps":["Definition: the symptoms when a person who is physically dependent stops or cuts down a substance. It ranges from mild to severe and lasts days or weeks, depending on the substance, how long it was used, age, other conditions and psychological state, and whether it was weaned or stopped “cold turkey”.","Example: general symptoms such as insomnia, fatigue, irritability and cravings; severe withdrawal can bring paranoia, confusion, tremors and disorientation."],"note":null,"short":{"id":"joan-tox:what is withdrawal give an example","title":"Withdrawal","hook":"Stop a drug you depend on: the body protests.","groups":[{"q":"What it is","facts":[{"t":"Symptoms when a **physically dependent** person **stops or cuts down**","of":[0]},{"t":"**Mild to severe**, lasting **days or weeks**","of":[0]},{"t":"Depends on the **substance**, **how long**, age, **weaned** or **cold turkey**","of":[0]}]},{"q":"Example","facts":[{"t":"**Insomnia**, **fatigue**, **irritability**, **cravings**","of":[1]},{"t":"Severe: **paranoia**, **confusion**, **tremors**, **disorientation**","of":[1]}]}]}},{"id":"q98b5759e41","group":"tox","who":"tool","title":"Harm reduction","qt":"What is harm reduction? Give an example from Aotearoa New Zealand.","scenario":null,"source":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 27 · For-interest articles on drug checking (NZ Herald, 2023; Stuff, 2022) and overdose deaths (NZ Herald, 2024)","steps":["Definition: reducing the harm of drug use for people who are going to use anyway, rather than only telling them not to — for example education about which combinations are dangerous.","Example: free, legal drug checking at festivals and clinics (Know Your Stuff NZ, legal since the Misuse of Drugs Act was changed), or making naloxone available to people at risk of an opioid overdose."],"note":null,"short":{"id":"joan-tox:what is harm reduction give an","title":"Harm reduction","hook":"If they are going to use anyway, make it safer.","groups":[{"q":"Definition","facts":[{"t":"**Reducing the harm** for people **going to use anyway**","of":[0]},{"t":"E.g. **education** about **which combinations are dangerous**","of":[0]}]},{"q":"Example","facts":[{"t":"Free, legal **drug checking** (**Know Your Stuff NZ**)","of":[1]},{"t":"**Naloxone** for people at risk of an **opioid overdose**","of":[1]}]}]}},{"id":"qae9599d784","group":"tox","who":"tool","title":"Antidotes: naloxone and NAC","qt":"Define an antidote and give an example.","scenario":null,"source":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slides 39–40","steps":["Definition: a substance that counteracts a poison — by binding it to reduce the free toxin, by slowing or speeding an enzyme, or by blocking its receptors (an antagonist).","Example: naloxone (Narcan) is an opioid antagonist that reverses an opioid overdose; N-acetylcysteine (NAC) reduces the toxic metabolites made from paracetamol in a paracetamol overdose."],"note":null,"short":{"id":"joan-tox:define an antidote and give an","title":"Antidotes: naloxone and NAC","hook":"Naloxone blocks opioids. NAC stops paracetamol’s toxic metabolites.","groups":[{"q":"Definition","facts":[{"t":"A substance that **counteracts a poison**","of":[0]},{"t":"**Binding** it, slowing or **speeding an enzyme**, or **blocking its receptors**","of":[0]}]},{"q":"Examples","facts":[{"t":"**Naloxone** (**Narcan**): an **opioid antagonist**","of":[1]},{"t":"**N-acetylcysteine** (**NAC**): fewer **toxic metabolites** from **paracetamol**","of":[1]}]}]}},{"id":"q629d061d0b","group":"cam","who":"tool","title":"Rongoā Māori: its three parts","qt":"Define rongoā Māori and give an example of each of its three parts.","scenario":null,"source":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slides 9 and 12 (quoting the NZNO Guidelines for Nurses on the Administration of Medicines 2024, s 7.7)","steps":["Definition: traditional Māori healing, with a strong spiritual element in how remedies are prepared — a Māori model of health rather than only a set of remedies.","Its three parts: mirimiri (massage / body work), karakia (prayer) and rongoā rākau (native plant-based remedies, e.g. a leaf prepared as a balm, oil or tonic)."],"note":null,"short":{"id":"joan-cam:define rongo m ori and give","title":"Rongoā Māori: its three parts","hook":"Mirimiri, karakia, rongoā rākau: hands, prayer, plants.","groups":[{"q":"Definition","facts":[{"t":"**Traditional Māori healing**","of":[0]},{"t":"With a **strong spiritual element**: a **Māori model of health**","of":[0]}]},{"q":"Its three parts","facts":[{"t":"**Mirimiri**: **massage** / body work","of":[1]},{"t":"**Karakia**: **prayer**","of":[1]},{"t":"**Rongoā rākau**: **native plant-based remedies**, e.g. a **balm**","of":[1]}]}]}},{"id":"q312cfb3cd1","group":"cam","who":"tool","title":"Who is responsible for a rongoā remedy","qt":"Who is responsible for a traditional Māori medicine, and what should a nurse do when whānau ask for advice about using one?","scenario":null,"source":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 9 (NZNO Guidelines 2024, s 7.7)","steps":["Responsibility rests with the tohunga or rongoā practitioner — karakia and kawa differ between tribal areas, and the nurse does not prescribe or prepare it.","The nurse arranges a discussion with everyone involved, including the tohunga or practitioner, so the client can make an informed decision — e.g. bringing the practitioner, the whānau and the prescriber together before a remedy is started in hospital."],"note":null,"short":{"id":"joan-cam:who is responsible for a traditional","title":"Who is responsible for a rongoā remedy","hook":"The practitioner owns the remedy; the nurse brings everyone together.","groups":[{"q":"Who is responsible","facts":[{"t":"The **tohunga** or **rongoā practitioner**","of":[0]},{"t":"**Karakia and kawa differ** between tribal areas","of":[0]},{"t":"The nurse **does not prescribe or prepare it**","of":[0]}]},{"q":"What the nurse does","facts":[{"t":"**Arranges a discussion** with everyone involved","of":[1]},{"t":"So the client can make an **informed decision**","of":[1]}]}]}}],"counts":{"pieces":0,"hers":18,"recall":0,"tool":34},"facts":207};</script><script type="module" src="rep.js?v=d1596af7"></script></body></html>
