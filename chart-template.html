<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chart Sim</title>
<style>
/* the Paper Sim's own stylesheet, copied in by build-chart.mjs from template.html (never retyped here) */
/*@PAPERSIM_CSS@*/
/* ── Chart Sim's own ─────────────────────────────────────────────── */
:root{--hand:"Bradley Hand","Segoe Print","Chalkboard SE","Comic Sans MS","Comic Neue",system-ui,sans-serif;--ink:#0b3ea8;--pen:#1d2433}
header a.d{color:var(--primary);text-decoration:none;font-weight:600}
.kick{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);margin:0}
.intro h2{margin:.1rem 0 .4rem;font-size:1.3rem}
.intro p{margin:.3rem 0 .5rem;font-size:.93rem}
details.how{border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);padding:0 10px;margin-top:8px}
details.how>summary{cursor:pointer;padding:9px 0;font-weight:650;font-size:.9rem}
details.how p{font-size:.88rem;margin:.2rem 0 .6rem}
.fld{margin:10px 0}
.fld>span,.fld>label>span{display:block;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-fg);margin-bottom:4px}
.fld small{display:block;color:var(--muted-fg);font-size:.8rem;margin-top:4px}
input.tx{font:inherit;font-size:16px;color:var(--fg);background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:9px 10px;width:100%}
input.tx.time{width:7.5em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden;flex:0 0 auto}
.seg button{font:inherit;font-size:.84rem;font-weight:650;border:0;background:transparent;color:var(--fg);padding:8px 13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--primary);color:var(--onprimary)}
label.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:10px 0 2px;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--primary)}
.warnln{color:var(--danger);font-size:.86rem;margin:6px 0 0}
.pcard{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--border);border-left:4px solid var(--tool,var(--primary));border-radius:var(--radius);padding:12px 14px;margin:0 0 10px;cursor:pointer}
.pcard b{display:block;font-size:1.02rem}
.pcard small{display:block;color:var(--muted-fg);font-size:.86rem;margin:2px 0 6px}
.pcard .pp{font-size:.8rem;font-weight:650;color:var(--primary)}
.foot{color:var(--muted-fg);font-size:.8rem;text-align:center;margin:16px 0 0}
/* the simulator: header, a bar, the page tabs, then the chart beside (wide) or above (narrow) the panel */
body.simon{overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column}
body.simon header{position:static;flex:0 0 auto}
body.simon main{display:none}
#sim{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.sbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border)}
.sbar .who{flex:1 1 auto;min-width:0;line-height:1.25}
.sbar .who b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .who small{display:block;color:var(--muted-fg);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.sm{padding:6px 9px;font-size:.84rem}
.tabs{display:flex;gap:5px;align-items:center;padding:6px 8px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:transparent;color:var(--fg);font:inherit;font-size:.82rem;font-weight:650;cursor:pointer;white-space:nowrap;position:relative}
.tab.on{background:var(--accent);border-color:var(--primary)}
.tab.dot::after{content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.zm{margin-left:auto;display:flex;gap:4px;flex:0 0 auto;padding-left:6px}
.zm button{min-width:36px;padding:6px 8px}
.stage{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;position:relative}
.vp{overflow:auto;touch-action:none;background:#5b616c;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.vp.pen{cursor:crosshair}
.vp svg{display:block;margin:10px auto;background:#fff;box-shadow:0 2px 14px rgb(0 0 0/.4)}
.vp svg text{font-family:Arial,Helvetica,sans-serif}
.vp svg .en{fill:var(--pen);font-family:var(--hand)}
.vp svg .me{fill:var(--ink);font-family:var(--hand)}
.vp svg .gh{fill:#067a52;font-family:var(--hand);opacity:.9}
.vp svg .ty{fill:#111;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.vp svg path.en,.vp svg ellipse.en{fill:none;stroke:var(--pen)}
.vp svg path.me,.vp svg ellipse.me{fill:none;stroke:var(--ink)}
.vp svg path.gh,.vp svg ellipse.gh{fill:none;stroke:#067a52}
.vp svg .inkp{fill:var(--ink)}
.vp svg .hl{fill:rgb(245 158 11/.16);stroke:#f59e0b;stroke-width:1.8}
.vp svg .hl.ok{fill:rgb(16 185 129/.16);stroke:#10b981}
.vp svg .hl.bad{fill:rgb(239 68 68/.14);stroke:#ef4444}
.vp svg .hl.sel{fill:rgb(59 130 246/.14);stroke:#3b82f6}
.vp svg .hl.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{stroke-width:4}}
.panel{border-top:1px solid var(--border);background:var(--card);max-height:46vh;max-height:46dvh;overflow:auto;overscroll-behavior:contain;position:relative}
.panel .grab{position:sticky;top:0;z-index:2;display:flex;width:100%;justify-content:center;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--border);background:var(--card);color:var(--muted-fg);font:inherit;font-size:.78rem;padding:4px 0;cursor:pointer}
.panel.min #pbody{display:none}
#pbody{padding:10px 14px 16px}
#pbody h3{margin:.2rem 0 .3rem;font-size:1.02rem}
#pbody .sub{color:var(--muted-fg);font-size:.84rem;margin:0 0 6px}
#pbody .q{font-weight:700;font-size:1.02rem;margin:.3rem 0 .6rem;line-height:1.35}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted-fg);font-weight:650}
.opts{display:flex;flex-direction:column;gap:6px}
button.opt{width:100%;margin:0;text-align:left;font:inherit;font-size:.93rem;color:var(--fg);line-height:1.35;min-height:44px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;cursor:pointer}
button.opt.ok{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
button.opt.bad{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
button.opt:disabled{cursor:default}
button.opt.dim{opacity:.55}
.fb{margin:.6rem 0;padding:8px 10px;border-radius:8px;background:var(--muted);font-size:.9rem}
.fb.ok{border-left:3px solid var(--ok)} .fb.bad{border-left:3px solid var(--danger)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts .btn{flex:1 1 auto}
.tapnote{border:1px dashed var(--primary);border-radius:8px;padding:8px 10px;font-size:.88rem;margin:.4rem 0}
ul.brief{margin:.4rem 0;padding-left:1.1rem;font-size:.9rem}
ul.brief li{margin:.25rem 0}
.youare{font-size:.82rem;background:var(--muted);border-radius:8px;padding:6px 9px;margin:6px 0}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset .chip{font-size:.86rem;padding:6px 11px}
.chip.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.elist{list-style:none;margin:6px 0;padding:0}
.elist li{display:flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin:0 0 5px;font-size:.85rem;background:var(--muted)}
.elist li span{flex:1 1 auto;min-width:0}
.elist li button{flex:0 0 auto}
.res{list-style:none;margin:6px 0;padding:0}
.res li{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;padding:7px 8px;border-radius:8px;margin:0 0 5px;background:var(--muted);cursor:pointer;border-left:3px solid var(--danger)}
.res li.ok{border-left-color:var(--ok)}
.res li i{font-style:normal;flex:0 0 auto}
.score{font-size:1.25rem;font-weight:800;margin:.2rem 0}
.self{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0 0 6px;font-size:.88rem}
.self .mdl{font-family:var(--hand);color:#067a52;font-size:1rem;margin:3px 0 6px}
.self .chipset .chip.on.no{background:var(--danger);border-color:var(--danger)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tools .btn{padding:8px 11px}
.tools .btn.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.small{font-size:.82rem;color:var(--muted-fg)}
.toast{position:absolute;left:0;right:0;top:8px;margin:0 auto;width:max-content;max-width:calc(100% - 20px);background:rgb(15 18 25/.92);color:#fff;border-radius:10px;padding:8px 12px;font-size:.86rem;line-height:1.35;z-index:4;pointer-events:none;box-shadow:0 4px 16px rgb(0 0 0/.35)}
@media (min-width:900px){
  .stage{grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:minmax(0,1fr)}
  .panel{max-height:none;border-top:0;border-left:1px solid var(--border)}
  .panel .grab{display:none}
  .panel.min #pbody{display:block}
  .toast{right:390px}
}
@media (max-width:560px){ .sbar .seg button{padding:7px 10px} }
</style>
</head>
<body>
<header>
  <h1 id="h1">Chart Sim</h1>
  <a class="d" id="backLink" href="./">‹ Back to the Paper Sim</a>
  <button class="btn ghost" id="themeBtn" title="theme">◐</button>
  <button class="btn ghost" id="helpBtn" title="what is this?">?</button>
</header>
<main id="view"></main>
<section id="sim" hidden>
  <div class="sbar">
    <button class="btn ghost sm" id="simBack" title="all patients">‹</button>
    <div class="who"><b id="sWho"></b><small id="sNow"></small></div>
    <div class="seg" id="modeSeg"><button data-mode="read">Read</button><button data-mode="chart">Chart it</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stage">
    <div class="vp" id="vp"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside class="panel" id="panel"><button class="grab" id="grab">▾ hide</button><div id="pbody"></div></aside>
    <div class="toast" id="toast" hidden></div>
  </div>
</section>
<dialog id="help"></dialog>
<script>
const D = /*@DATA@*/;
/*@LIBS@*/
/* ── Chart Sim: the page. The chart is chart-render.mjs (CR), what is written on it and every check is
   chart-engine.mjs (CE), the handwriting is Giga's ink (INK) on perfect-freehand (PF) — all inlined by
   build-chart.mjs, never retyped here. Progress lives in this browser under the Paper Sim's own prefix. ── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LS = k => { try { return JSON.parse(localStorage.getItem(D.prefix + k)); } catch (e) { return null; } };
const SV = (k, v) => { try { localStorage.setItem(D.prefix + k, JSON.stringify(v)); } catch (e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const SCN = D.scenarios, BYID = new Map(SCN.map(s => [s.id, s]));
const STAFF = new Set(SCN.flatMap(s => (s.nurses || []).map(n => n.init)));
const IDX = CR.cellIndex();
const ME = Object.assign({ name: '', init: '', input: 'tap', finger: false }, LS('chart.me') || {});
const PROG = LS('chart.p') || {};
const saveMe = () => SV('chart.me', ME);
function statusLine() {
  const tot = SCN.reduce((a, s) => a + s.rounds.length, 0), done = SCN.reduce((a, s) => a + ((PROG[s.id] || {}).stage || 0), 0);
  let r = 0, n = 0; for (const p of Object.values(PROG)) for (const st of Object.values(p.read || {})) for (const v of Object.values(st)) { n++; r += v ? 1 : 0; }
  return `${done}/${tot} med rounds charted${n ? ` · ${r}/${n} chart questions right` : ' · read a real NZ chart, then chart it'}`;
}
const saveProg = () => { SV('chart.p', PROG); SV('more.chart', statusLine()); };
const meInit = () => String(ME.init || '').toUpperCase().replace(/[^A-Z]/g, '');
const meProblem = () => {
  const i = meInit();
  if ((ME.name || '').trim().length < 3) return 'Add your name as you would write it in the chart’s register.';
  if (!/^[A-Z]{2,3}$/.test(i)) return 'Your initials: two or three letters.';
  if (STAFF.has(i)) return `${i} belongs to one of the nurses on these charts — add a middle initial so yours are yours.`;
  return '';
};

/* ── the state of the open patient ── */
let SC = null, ST = null, C = null, MODE = 'read', PAGE = 'front', Z = 1, TOOL = 'pen';
let ENT = {}, STROKES = [], UNDO = [], HL = [], GHOST = null, RQ = null, RS = null, PK = null;
const P = () => (PROG[SC.id] = PROG[SC.id] || { stage: 0, rounds: {}, read: {} });
const round = () => SC.rounds[P().stage];
const rctx = R => ({ ...R, you: meInit() || 'ST', name: (ME.name || 'Student Nurse').trim() });
function stageScenario(k) { let S = SC; for (let i = 0; i < k; i++) S = CE.applyRound(S, rctx(SC.rounds[i])); return S; }
function load(stage) { ST = stageScenario(stage); C = CE.compile(ST); }
const dayLabel = d => `${CE.WEEKDAY(C.S, d)} ${CE.dayDate(C.S, d)}`;
const nowLabel = () => `${dayLabel(C.now.day)} · ${C.now.t} · day ${C.now.day} of the chart`;

/* ── home ── */
function home() {
  document.body.classList.remove('simon'); $('#sim').hidden = true; $('#view').hidden = false; SC = null;
  const card = s => {
    const p = PROG[s.id] || {}, k = p.stage || 0, n = s.rounds.length;
    const rd = Object.values(p.read || {}).reduce((a, st) => { for (const v of Object.values(st)) { a.n++; a.r += v ? 1 : 0; } return a; }, { r: 0, n: 0 });
    const line = k >= n ? `All ${n} rounds charted ✓` : k ? `Round ${k + 1} of ${n} next` : `${n} med rounds to chart`;
    return `<button class="pcard" data-open="${s.id}"><b>${esc(s.t)}</b><small>${esc(s.sub)}</small><span class="pp">${line}${rd.n ? ` · ${rd.r}/${rd.n} read right` : ''}</span></button>`;
  };
  $('#view').innerHTML = `<div class="card intro">
    <p class="kick">Read a med chart</p><h2>Chart Sim</h2>
    <p>The <b>NZ 8-Day National Medication Chart</b>, redrawn box for box. Each patient’s chart is already part-filled, like one you pick up on the ward.</p>
    <p><b>Read</b> — questions about what the chart says; some you answer by tapping the right box. <b>Chart it</b> — the med round happens, and you write it in: your initials, your RN’s check, the time, a code when a dose isn’t given. Then the chart moves on, and there is more to read.</p>
    <details class="how"><summary>How your charting is marked</summary>
      <p>Every box on this chart has an address — which medicine, which day, which time line. Each round has an answer key: which boxes should get something, and what.</p>
      <p><b>👆 Tap to fill</b> (marked for you): tap a box and choose what goes in it — initials, a code, a time, a dose, a route. It checks the right box, the right thing in it, your initials <i>and</i> your RN’s check, a time within 30 minutes, a PRN dose the order allows — and anything written where nothing should be.</p>
      <p><b>✍️ Handwrite</b> (pen or drawing tablet): where you wrote is marked for you — each stroke counts toward the box it mostly sits in. What you wrote you mark yourself: the right entry appears beside your ink, and you tick whether yours says it, as a preceptor would. Nothing here reads handwriting.</p>
    </details>
  </div>
  <div class="card">
    <h3 style="margin:.1rem 0 .2rem">You</h3>
    <div class="fld"><label><span>Name &amp; designation (for the chart’s register)</span><input class="tx" id="meName" autocomplete="name" placeholder="e.g. PARKER, Sam · Student Nurse" value="${esc(ME.name)}"></label></div>
    <div class="fld"><label><span>Your initials</span><input class="tx time" id="meInit" maxlength="3" autocapitalize="characters" placeholder="SP" value="${esc(ME.init)}"></label></div>
    <div class="fld"><span>How you chart</span><div class="seg" id="inSeg"><button data-in="tap">👆 Tap to fill</button><button data-in="pen">✍️ Handwrite</button></div>
      <small>Handwriting: a pen or stylus writes; one finger moves the chart; two fingers zoom.</small></div>
    <label class="chk"><input type="checkbox" id="meFinger" ${ME.finger ? 'checked' : ''}> No stylus — let my finger write too (then two fingers move the chart)</label>
    <p class="warnln" id="meWarn"></p>
  </div>
  <div class="lsec">Patients</div>
  ${SCN.map(card).join('')}
  <p class="foot">Invented patients · typical adult doses — <b>not a dosing guide</b> · the chart is NMC8D (2012 edition) · everything stays in this browser</p>`;
  const warn = () => { $('#meWarn').textContent = ME.name || ME.init ? meProblem() : ''; };
  $('#meName').oninput = e => { ME.name = e.target.value; saveMe(); warn(); };
  $('#meInit').oninput = e => { ME.init = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3); e.target.value = ME.init; saveMe(); warn(); };
  $('#meFinger').onchange = e => { ME.finger = e.target.checked; saveMe(); };
  const seg = () => document.querySelectorAll('#inSeg button').forEach(b => b.classList.toggle('on', b.dataset.in === ME.input));
  document.querySelectorAll('#inSeg button').forEach(b => b.onclick = () => { ME.input = b.dataset.in; saveMe(); seg(); });
  seg(); warn();
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openPatient(b.dataset.open));
  saveProg();
}

/* ── the patient ── */
function openPatient(id, mode) {
  SC = BYID.get(id); load(P().stage);
  document.body.classList.add('simon'); $('#view').hidden = true; $('#sim').hidden = false;
  MODE = mode || 'read'; PAGE = 'front'; HL = []; GHOST = null; PK = null;
  const saved = LS('chart.w.' + SC.id);
  ENT = saved && saved.stage === P().stage ? saved.ent || {} : {}; STROKES = saved && saved.stage === P().stage ? saved.ink || [] : []; UNDO = [];
  RQ = null; RS = null;
  $('#sWho').textContent = `${SC.t} — ${SC.sub}`;
  tabs(); drawPage(); fitZoom();
  setMode(MODE);
  try { history.replaceState(null, '', '#' + SC.id); } catch (e) {}
}
function saveWork() { SV('chart.w.' + SC.id, { stage: P().stage, ent: ENT, ink: STROKES }); }
function setMode(m) {
  MODE = m; PK = null; HL = []; GHOST = null;
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#sNow').textContent = nowLabel();
  if (m === 'read') { if (!RQ || RQ.stage !== P().stage) newRead(); showRead(); }
  else { if (!RS || RS.stage !== P().stage) RS = { stage: P().stage, phase: 'brief', askI: 0 }; showRound(); }
  $('#vp').classList.toggle('pen', penOn());
  drawOverlays();
}
const penOn = () => MODE === 'chart' && ME.input === 'pen' && RS && RS.phase === 'chart';

/* ── pages, zoom ── */
const svg = $('#svg'), vp = $('#vp');
function tabs() {
  $('#tabs').innerHTML = CR.PAGES.map(p => `<button class="tab" data-pg="${p.id}">${p.n}</button>`).join('') +
    `<span class="zm"><button class="btn sm" data-z="-" title="zoom out">−</button><button class="btn sm" data-z="fit" title="fit the page">⤢</button><button class="btn sm" data-z="+" title="zoom in">+</button></span>`;
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { PAGE = b.dataset.pg; drawPage(); fitZoom(); });
  document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => {
    const r = vp.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (b.dataset.z === 'fit') fitZoom(); else zoomAt(Z * (b.dataset.z === '+' ? 1.35 : 1 / 1.35), cx, cy);
  });
}
function markTabs() {
  const pages = new Set();
  for (const h of HL) for (const id of h.ids) { const pg = pageOf(id); if (pg) pages.add(pg); }
  document.querySelectorAll('[data-pg]').forEach(b => { b.classList.toggle('on', b.dataset.pg === PAGE); b.classList.toggle('dot', pages.has(b.dataset.pg) && b.dataset.pg !== PAGE); });
}
const L = () => CR.layout(PAGE);
const fitZ = () => (vp.clientWidth - 20) / L().w;
const minZ = () => Math.min(fitZ(), 0.35);
function sizeSvg() { svg.setAttribute('width', r1(L().w * Z)); svg.setAttribute('height', r1(L().h * Z)); }
function fitZoom() { Z = fitZ(); sizeSvg(); vp.scrollTop = 0; vp.scrollLeft = 0; }
const toPage = (cx, cy) => { const r = svg.getBoundingClientRect(); return { x: (cx - r.left) / Z, y: (cy - r.top) / Z }; };
function zoomAt(z, cx, cy) {
  const p = toPage(cx, cy); Z = clamp(z, minZ(), 5); sizeSvg();
  const r = svg.getBoundingClientRect(); vp.scrollLeft += r.left + p.x * Z - cx; vp.scrollTop += r.top + p.y * Z - cy;
}
/* bring cells into view, zoomed to read */
function focusCells(ids) {
  const cs = ids.flatMap(id => cellsFor(id)).filter(c => c.page === PAGE);
  if (!cs.length) return;
  const x0 = Math.min(...cs.map(c => c.x)), y0 = Math.min(...cs.map(c => c.y)), x1 = Math.max(...cs.map(c => c.x + c.w)), y1 = Math.max(...cs.map(c => c.y + c.h));

/* ── tap-to-fill: the picker ── */
function groupOf(id) {
  let m;

  if ((m = /^(prn\.[A-H]\.\d+)\.(date|time|dose|route|gc)$/.exec(id))) return { k: 'prn', b: m[1], f: ['date', 'time', 'dose', 'route', 'gc'] };
  if ((m = /^(once\.\d)\.(dosedt|gc|tstart|tend)$/.exec(id))) return { k: 'once', b: m[1], f: ['dosedt', 'gc'] };
  if ((m = /^(fl\.\d+)\.(astart|gc|tend|avol)$/.exec(id))) return { k: 'fl', b: m[1], f: ['astart', 'gc', 'tend', 'avol'] };
  if ((m = /^(siga\.\d+)\.(name|init|reg)$/.exec(id))) return { k: 'reg', b: m[1], f: ['name', 'init', 'reg'] };

  const vals = g.f.map(f => ENT[b + '.' + f]).filter(v => v != null && v !== '').map(valueOf);
  return `${CE.cellLabel(C, b + '.' + g.f[0])}: ${vals.join(' · ')}`;
}

function savePicker() {

  const t4 = id => { const t = v(id).replace(/\D/g, ''); if (t && !/^\d{4}$/.test(t)) { toast('Write the time as four figures, 24-hour clock — e.g. 0805.'); return null; } return t; };
  const gc = () => PK.giv || PK.chk ? { giv: PK.giv || '', chk: PK.chk || '' } : '';
  if (g.k === 'adm') {
    if (!PK.what) { toast('Choose what happened: given, or a code.'); return false; }
    if (PK.what !== 'given') { set('gc', { code: PK.what }); set('t', ''); set('dose', ''); return true; }
    const t = t4('pkT'); if (t === null) return false;

  if (g.k === 'prn') { const t = t4('pkT'); if (t === null) return false; set('date', PK.date); set('time', t); set('dose', PK.dose); set('route', PK.route); set('gc', gc()); return true; }

/* ── pointers: one finger pans, two pinch, a tap picks a box; in handwriting, the pen writes.

const PTR = new Map(); let G = null, lastPen = 0, mom = 0;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function eraseAt(v) {

function stopMomentum() { cancelAnimationFrame(mom); mom = 0; }
function momentum(vx, vy) {

    e.preventDefault(); try { vp.setPointerCapture(e.pointerId); } catch (er) {}
    if (isPen) lastPen = performance.now();
    const v = toPage(e.clientX, e.clientY);
    if (TOOL === 'erase') { UNDO.push(STROKES); G = { mode: 'erase', id: e.pointerId }; eraseAt(v); return; }
    G = { mode: 'draw', id: e.pointerId, simulate: !isPen, pts: [[r1(v.x), r1(v.y), INK.inkPressure(e)]] };

  }

});
vp.addEventListener('pointermove', e => {
