<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chart Speak</title>
<style>
/* the Paper Sim's own stylesheet, copied in by build-terms.mjs from template.html (never retyped here) */
/*@PAPERSIM_CSS@*/
/* ── Chart Speak's own ─────────────────────────────────────────────── */
header a.d{color:var(--primary);text-decoration:none;font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95em;background:var(--muted);border:1px solid var(--border);border-radius:5px;padding:0 5px;white-space:nowrap}
.cs-p{margin:.1rem 0 .25rem;color:var(--muted-fg);font-size:.86rem}
.cs-big{font-weight:800;margin:.1rem 0 .8rem;line-height:1.2;overflow-wrap:anywhere}
.cs-big.w{font-size:clamp(1.6rem,9vw,2.3rem);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.cs-big.wt{font-size:clamp(1.25rem,6vw,1.6rem)}
.cs-big.m{font-size:1.12rem;font-weight:700}
.cs-opts{display:flex;flex-direction:column;gap:6px}
.cs-opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
button.opt{width:100%;margin:0;text-align:left;font:inherit;color:var(--fg);line-height:1.35;min-height:46px;align-items:center}
.cs-opts.grid button.opt{justify-content:center;text-align:center;font-weight:650}
.cs-opts.mono button.opt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.02rem}
button.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
.cs-def{font-size:1rem;margin:.2rem 0 .4rem}
.cs-alt{font-size:.84rem;color:var(--muted-fg);margin:.3rem 0}
.cs-alt code{margin:0 2px 3px 0;display:inline-block}
.cs-warn{border-left:3px solid var(--warn);padding:4px 0 4px 9px;margin:.5rem 0;font-size:.9rem}
.cs-eg{font-size:.86rem;margin:.4rem 0}
.cs-eg code{white-space:normal}
.mk p{margin:.35rem 0}
.mk .you{font-size:.88rem}
/* a chart line, drawn like a row of a paper medication chart */
.cl{border:1px solid var(--border);border-left:4px solid var(--tc,var(--primary));border-radius:var(--radius);background:var(--bg);padding:10px 10px 8px;margin:0 0 12px}
.cl-reg{--tc:var(--primary)} .cl-prn{--tc:var(--warn)} .cl-once{--tc:var(--danger)} .cl-fluid{--tc:hsl(190 80% 50%)} .cl-o2{--tc:var(--ok)}
.cl-sec{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg)}
.cl-med{font-weight:800;font-size:1.12rem;margin:2px 0 8px}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.cl-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 8px;min-width:0}
.cl-cell small{display:block;font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-fg)}
.cl-cell b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.98rem;overflow-wrap:anywhere}
.cl-note{margin-top:8px;font-size:.86rem;font-weight:650;border-top:1px dashed var(--border);padding-top:7px}
.cs-decode{margin-top:12px}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dchip{font:inherit;font-size:.84rem;border:1px dashed var(--primary);border-radius:8px;background:transparent;color:var(--fg);padding:5px 9px;cursor:pointer;text-align:left}
.dchip.open{border-style:solid;border-color:var(--border);background:var(--muted);cursor:default}
.dline{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.dtok{font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.05rem;padding:10px 13px;border-radius:8px;border:1px solid var(--border);background:var(--muted);color:var(--fg);cursor:pointer}
.dtok.hit{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.dtok.miss{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.dtok:disabled{cursor:default}
.cs-fix{font-size:.95rem;margin:.4rem 0}
.cs-fix code{white-space:normal}
.cs-cat .fbar{display:block;margin-top:6px;min-width:0}
.gl{border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);margin:0 0 6px}
.gl>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 10px}
.gl>summary::-webkit-details-marker{display:none}
.gl>summary code{font-size:.98rem;font-weight:700}
.gl>summary .gm{flex:1 1 180px;font-size:.9rem}
.gl>summary .gb{font-size:.7rem;white-space:nowrap}
.gl-b{padding:0 10px 8px;font-size:.88rem;line-height:1.5}
.gl-b p{margin:.3rem 0}
input[type=search]{font:inherit;font-size:16px;color:var(--fg);background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:10px;width:100%}
.krow code{margin-right:6px}
.cs-list .krow{padding:6px 0}
</style>
</head>
<body>
<header>
  <h1 id="h1">Chart Speak</h1>
  <a class="d" id="backLink" href="./">‹ Back to the Paper Sim</a>
  <button class="btn ghost" id="themeBtn" title="theme">◐</button>
  <button class="btn ghost" id="helpBtn" title="what is this?">?</button>
</header>
<main id="view"></main>
<dialog id="help"></dialog>
<script>
const CS = /*@DATA@*/;
/*@ENGINE@*/
/* ── Chart Speak: the page. Everything it knows is CS (built from content/terms/ by build-terms.mjs);
   the drill logic above is terms-engine.mjs, inlined. Progress lives in this browser under the Paper Sim's
   own prefix, and a one-line summary is left under more.terms for the Paper Sim's home row to show. ── */
const TERMS = CS.terms, CATS = CS.cats, PROMPTS = CS.prompts, ORDERS = CS.orders, SCENES = CS.scenes, DANGERS = CS.dangers;
const BYID = new Map(TERMS.map(t => [t.id, t]));
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LS = k => { try { return JSON.parse(localStorage.getItem(CS.prefix + k)); } catch (e) { return null; } };
const SV = (k, v) => { try { localStorage.setItem(CS.prefix + k, JSON.stringify(v)); } catch (e) {} };
const ST = LS('cs.t') || {}, SO = LS('cs.o') || {}, SX = LS('cs.x') || {}, SD = LS('cs.d') || {};
const SIZES = [10, 20, 40, 'all'];
let N = LS('cs.n'); if (!SIZES.includes(N)) N = 20;
const SCOPES = [{ id: 'all', n: 'Everything', ic: '🗂' }, { id: 'must', n: 'The course’s Must-Know list', ic: '📌' }, ...CATS.map(c => ({ id: c.id, n: c.n, ic: c.ic }))];
let SCOPE = LS('cs.scope'); if (!SCOPES.some(s => s.id === SCOPE)) SCOPE = 'all';
const inScope = (t, sc) => sc === 'all' || (sc === 'must' ? t.k === 'must' : t.c === sc || (t.also || []).includes(sc));
const poolOf = sc => TERMS.filter(t => inScope(t, sc));
const scopeName = sc => (SCOPES.find(s => s.id === sc) || SCOPES[0]).n;
const SEC = { reg: 'Regular Medicine', prn: 'As Required (PRN) Medicines', once: 'Once Only', fluid: 'IV & Subcut Fluids', o2: 'Oxygen Therapy & Medical Gases' };
const ORD = new Map(ORDERS.map(o => [o.id, o])), SCN = new Map(SCENES.map(s => [s.id, s])), DNG = new Map(DANGERS.map(d => [d.id, d]));

function statusLine() {
  const a = progress(TERMS, ST), o = progress(ORDERS, SO);
  return `${a.L}/${a.n} terms locked${a.part ? ` · ${a.part} on the way` : ''}${a.miss ? ` · ${a.miss} to redo` : ''} · ${o.L}/${o.n} chart lines read`;
}
function save() { SV('cs.t', ST); SV('cs.o', SO); SV('cs.x', SX); SV('cs.d', SD); SV('more.terms', statusLine()); }

/* where a term comes from — shown under every answer and in the glossary */
const PROV = {
  must: '📌 On the course’s Must-Know abbreviations list (Concepts (2) slides 77–80)',
  deck: '📘 From the course',
  ward: '🏥 Everyday NZ ward usage, in this tool’s words — your hospital’s own list is the one that counts',
  safe: '⚠️ On the international error-prone list — your hospital’s “do not use” list is the one that binds you',
  nmc: '📄 Printed on the NZ 8-Day National Medication Chart itself',
};
function provLine(t) {
  const k = t.k || 'ward';
  if (k === 'deck') return `<div class="refsrc">📘 From the course: ${esc(t.src)}</div>`;
  return `<div class="refsrc">${PROV[k]}${t.src ? ' · ' + esc(t.src) : ''}</div>`;
}
function termDetail(t) {
  const alt = t.a || [];
  return `${alt.length ? `<p class="cs-alt">Also written: ${alt.map(a => `<code>${esc(a)}</code>`).join(' ')}</p>` : ''}
    ${t.x ? `<p>${esc(t.x)}</p>` : ''}${t.w ? `<p class="cs-warn">⚠ ${esc(t.w)}</p>` : ''}
    ${t.eg ? `<p class="cs-eg">On a chart: <code>${esc(t.eg)}</code></p>` : ''}${provLine(t)}`;
}
const lockBadge = (st, n) => !st ? '' : st.L ? '<span class="sbadge lock">🔒 locked</span>' : `<span class="sbadge go">${st.s} of ${n} in a row</span>`;

/* ── screens ── home is one list of rows; each opens its own screen (#drill #chart #danger #rules #glossary),
   so the phone's back button and a shared link both work. A drill run sits on top of the screen it came from. */
const SCR = {
  drill: { t: '🔤 Terms & abbreviations', html: () => drillScreen() },
  chart: { t: '📋 Read the chart', html: () => chartScreen() },
  danger: { t: '⚠️ Spot the danger', html: () => dangerScreen() },
  rules: { t: '🧭 Chart rules & codes', html: () => rulesScreen() },
  glossary: { t: '📖 Glossary', html: () => glossScreen() },
};
const curScr = () => { const h = location.hash.slice(1); return SCR[h] ? h : ''; };
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function nav(scr) { history.pushState({ scr }, '', scr ? '#' + scr : location.pathname + location.search); render(scr); window.scrollTo(0, 0); }
let RUN = null;
function enterRun() { if (!(history.state && history.state.run)) history.pushState({ run: 1, scr: curScr() }, '', location.href); }
function leaveRun() { RUN = null; if (history.state && history.state.run) history.back(); else { render(curScr()); window.scrollTo(0, 0); } }
window.addEventListener('popstate', () => { RUN = null; render(curScr()); window.scrollTo(0, 0); });
function render(scr) {
  RUN = null;
  $('#view').innerHTML = scr ? `<div class="shead"><button class="btn ghost" id="homeB">‹ Home</button><h2>${SCR[scr].t}</h2></div>${SCR[scr].html()}` : launcher();
  bindView();
}

const row = (scr, ic, t, s) => `<button class="lrow" data-scr="${scr}"><span class="lic" aria-hidden="true">${ic}</span><span class="ltx"><b>${t}</b><small>${s}</small></span><span class="lch" aria-hidden="true">›</span></button>`;
function nextUp() {
  const all = progress(TERMS, ST), must = progress(poolOf('must'), ST);
  if (all.miss) return { e: 'Next up · your misses first', t: `Redo the ${all.miss} you missed, then carry on`, go: () => startTerms('all') };
  if (must.L < must.n) return { e: 'Next up · the course’s own list first', t: `The ${must.n} Must-Know abbreviations — OD, BD, TDS, QID, PRN, stat…`, go: () => startTerms('must') };
  return { e: 'Next up · what you know least', t: `Drill ${N === 'all' ? 'everything' : N} · misses first, then new ones`, go: () => startTerms('all') };
}
let HERO = null;
function launcher() {
  const t = progress(TERMS, ST), o = progress(ORDERS, SO), x = progress(SCENES, SX), d = progress(DANGERS, SD), up = nextUp();
  HERO = up.go;
  return `<div class="idcard"><span class="idic" aria-hidden="true">💬</span><span class="idtx"><small>${esc(CS.kick)}</small><b>Chart Speak</b><span>${TERMS.length} med-chart terms, drilled</span></span></div>
  <details class="note bnote" style="border-left-color:var(--warn);color:var(--fg)"><summary><b>A reading trainer, not a dosing guide.</b></summary>
    The example orders use typical adult doses so they look like a real chart — never use them to decide a dose; the chart, the NZ Formulary and your preceptor do that. Abbreviations and codes vary between hospitals: where your ward’s list, or the key printed on your chart, says something different, theirs wins. Every term says where it comes from: 📌 the course’s own Must-Know list, 📘 a course deck, 🏥 everyday NZ ward usage (this tool’s words), ⚠️ the international error-prone list.</details>
  <button class="hero" id="heroB"><span><small>${up.e}</small><b>${up.t}</b></span><span class="go" aria-hidden="true">▶</span></button>
  <div class="lsec">Drill</div>
  ${row('drill', '🔤', 'Terms & abbreviations', `${t.L} of ${t.n} locked${t.part ? ` · ${t.part} on the way` : ''}${t.miss ? ` · ${t.miss} to redo` : ''}${!t.seen ? ' · 2 right in a row locks one' : ''}`)}
  ${row('chart', '📋', 'Read the chart', `${o.L} of ${o.n} orders read · real-looking chart lines to decode`)}
  ${row('danger', '⚠️', 'Spot the danger', `${d.L} of ${d.n} found · the ways of writing that hurt people`)}
  ${row('rules', '🧭', 'Chart rules & codes', `${x.L} of ${x.n} right · sections, not-given codes, PRN maths`)}
  <div class="lsec">Look it up</div>
  ${row('glossary', '📖', 'Glossary', `Search all ${TERMS.length} · every one with its meaning and source`)}
  <div class="lsec">Drill one topic</div>
  ${CATS.map(c => { const p = progress(poolOf(c.id), ST);
    return `<button class="lrow cs-cat" data-cat="${c.id}"><span class="lic" aria-hidden="true">${c.ic}</span><span class="ltx"><b>${esc(c.n)}</b><small>${p.L} of ${p.n} locked${p.part ? ` · ${p.part} on the way` : ''}${p.miss ? ` · ${p.miss} to redo` : ''} · ${esc(c.d)}</small><span class="fbar"><i style="width:${Math.round(100 * p.L / p.n)}%"></i></span></span><span class="lch" aria-hidden="true">▶</span></button>`; }).join('')}`;
}

const sizeChips = () => `<div class="chips"><span>How many</span>${SIZES.map(n => `<button class="chip${String(N) === String(n) ? ' on' : ''}" data-n="${n}">${n === 'all' ? 'All' : n}</button>`).join('')}</div>`;
function drillScreen() {
  const p = progress(poolOf(SCOPE), ST);
  return `<div class="card" style="border-left:4px solid var(--primary)">
    <p class="lead">Pick a topic and how many. What you got wrong comes back first; <b>2 right in a row locks a term</b> 🔒.</p>
    <details class="how"><summary>How this works</summary>
      <p>Each question shows a term the way a chart writes it and asks what it means — the first time you meet a term it is always that way round, because that is the job on the ward. Once you have seen it, it may come the other way too: here is the meaning, how is it written?</p>
      <p>The wrong answers are chosen to be the real traps: BD sits next to TDS, SC next to SL, mg next to mcg, mane next to nocte. A wrong answer tells you what the one you picked actually means, and the term comes back a few questions later. <b>Two right in a row locks a term</b> — and the second has to come at least 10 minutes after the first, so it is two separate recalls, not one remembered twice. A locked term comes back after a week to check it stuck. A run deals your misses first, then terms you got right 10+ minutes ago, then new ones (the commonest first), then locked ones due a check.</p>
      <p>On a keyboard: number keys pick an answer, Enter moves on.</p>
    </details>
    <div class="chips"><span>Drill</span>${SCOPES.map(s => `<button class="chip${SCOPE === s.id ? ' on' : ''}" data-scope="${s.id}">${s.ic} ${esc(s.n)} · ${poolOf(s.id).length}</button>`).join('')}</div>
    ${sizeChips()}
    <button class="btn primary wide" id="goDrill">▶ Start · ${N === 'all' ? p.n : Math.min(N, p.n)} from ${esc(scopeName(SCOPE))}</button>
    <div class="hist" style="margin-top:8px">${p.L} of ${p.n} locked here${p.part ? ` · ${p.part} on the way` : ''}${p.miss ? ` · ${p.miss} to redo` : ''}${p.n - p.seen ? ` · ${p.n - p.seen} not seen yet` : ''}</div>
  </div>`;
}
function chartScreen() {
  const p = progress(ORDERS, SO);
  return `<div class="card" style="border-left:4px solid var(--warn)">
    <p class="lead">Whole orders, laid out like a line of a med chart. Read it, then pick what it tells you to do.</p>
    <details class="how"><summary>How this works</summary>
      <p>Each order has four readings. Three of them get exactly one thing wrong — the frequency, the route, the unit, a &lt; read as a &gt; — so the only way to the right one is to read every part of the line. A wrong pick tells you what you misread.</p>
      <p>Stuck? The words under the order decode one at a time. Peeking is fine — but a right answer after a peek does not count towards reading that line cold. Two cold reads in a row and a line is read ✓.</p>
      <p>The doses are typical adult examples so the lines look real. They are practice in reading, never a guide to what to give.</p>
    </details>
    ${sizeChips()}
    <button class="btn primary wide" id="goOrders">▶ Read ${N === 'all' ? p.n : Math.min(N, p.n)} orders</button>
    <div class="hist" style="margin-top:8px">${p.L} of ${p.n} read cold${p.miss ? ` · ${p.miss} to redo` : ''}</div>
    <details class="smod"><summary>Every order and its reading · ${ORDERS.length}</summary>
      <div class="cs-list">${ORDERS.map(o => `<div class="krow"><b>${esc(o.med)} ${esc(o.dose)} ${esc(o.route)} ${esc(o.freq)}</b><br>${esc(o.read)}</div>`).join('')}</div></details>
  </div>`;
}
function dangerScreen() {
  const p = progress(DANGERS, SD), danger = poolOf('safe');
  return `<div class="card" style="border-left:4px solid var(--danger)">
    <p class="lead">Each order has one dangerous way of writing it. Tap the part that could hurt someone.</p>
    <details class="how"><summary>How this works</summary>
      <p>Every one of these has been misread on a real ward somewhere: a trailing zero, a U for units, a µ for micro, an OD that could mean an eye. Only one part of each line is on the danger list, so tap that part — then see how it goes wrong and how it should be written.</p>
      <p>Some of them are on your own course list (SC, OD): you still have to be able to read them, because charts are full of them. You just should not write them.</p>
    </details>
    <button class="btn primary wide" id="goDanger">▶ Spot the danger · ${DANGERS.length} orders</button>
    <div class="hist" style="margin-top:8px">${p.L} of ${p.n} found${p.miss ? ` · ${p.miss} to redo` : ''}</div>
    <button class="btn ghost wide" data-drillscope="safe">🔤 Drill the whole danger list · ${danger.length} terms</button>
  </div>`;
}
function rulesScreen() {
  const p = progress(SCENES, SX);
  return `<div class="card" style="border-left:4px solid var(--ok)">
    <p class="lead">Ward situations: which part of the chart an order goes in, which code goes in the dose box, and the rules (the 30-minute window, a blank allergy box, PRN maths).</p>
    <details class="how"><summary>How this works</summary>
      <p>The sections are the NZ 8-Day National Medication Chart’s own (the course lists them on Med Admin (1), slides 54–55). The not-given codes are the chart’s printed key — <b>U</b> unavailable, <b>SM</b> self-medicating, <b>CP</b> carer/parent, <b>R</b> refused, <b>D</b> prescriber’s instructions, <b>N</b> not administered (reason in the notes). If your ward’s chart prints a different key, that key wins. Two right in a row and a scenario is ✓.</p>
    </details>
    ${sizeChips()}
    <button class="btn primary wide" id="goRules">▶ ${N === 'all' ? p.n : Math.min(N, p.n)} scenarios</button>
    <div class="hist" style="margin-top:8px">${p.L} of ${p.n} right twice in a row${p.miss ? ` · ${p.miss} to redo` : ''}</div>
  </div>`;
}
let GS = 'all';
function glossScreen() {
  return `<div class="card">
    <input type="search" id="gq" placeholder="Search — try “tds”, “kidney” or “tongue”" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <div class="chips">${SCOPES.map(s => `<button class="chip${GS === s.id ? ' on' : ''}" data-gs="${s.id}">${s.ic} ${esc(s.id === 'must' ? 'Course list' : s.n)}</button>`).join('')}</div>
    <div class="hist" id="gcount" style="margin:6px 0"></div>
    <button class="btn ghost wide" id="gDrill" style="margin:0 0 10px">▶ Drill these</button>
    <div id="glist"></div>
  </div>`;
}
let GLIST = [];
function paintGloss() {
  const raw = ($('#gq') || {}).value || '', q = normM(raw), qw = normW(raw);
  GLIST = TERMS.filter(t => inScope(t, GS) && (!raw.trim() || [t.t, ...(t.a || [])].some(w => normW(w).includes(qw)) || normM([t.m, t.x || '', t.w || ''].join(' ')).includes(q)));
  $('#gcount').textContent = `${GLIST.length} of ${TERMS.length}${raw.trim() ? ` match “${raw.trim()}”` : ''}`;
  $('#gDrill').textContent = `▶ Drill these ${GLIST.length}`;
  $('#gDrill').disabled = !GLIST.length;
  $('#glist').innerHTML = GLIST.map(t => { const st = ST[t.id];
    return `<details class="gl"><summary><code>${esc(t.t)}</code><span class="gm">${esc(t.m)}</span><span class="gb">${t.k === 'must' ? '📌 ' : ''}${t.w ? '⚠ ' : ''}${st && st.L ? '🔒' : ''}</span></summary><div class="gl-b">${termDetail(t)}<div class="refsrc">${CAT[t.c].ic} ${esc(CAT[t.c].n)}</div></div></details>`; }).join('')
    || '<p class="hist">Nothing matches. Try fewer letters, or another topic.</p>';
}

function bindView() {
  const hb = $('#homeB'); if (hb) hb.onclick = () => { if (history.state && history.state.scr && !history.state.run) history.back(); else nav(''); };
  document.querySelectorAll('[data-scr]').forEach(b => b.onclick = () => nav(b.dataset.scr));
  const hero = $('#heroB'); if (hero) hero.onclick = () => HERO();
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => startTerms(b.dataset.cat));
  document.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { SCOPE = b.dataset.scope; SV('cs.scope', SCOPE); const y = scrollY; render('drill'); scrollTo(0, y); });
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { N = b.dataset.n === 'all' ? 'all' : +b.dataset.n; SV('cs.n', N); const y = scrollY; render(curScr()); scrollTo(0, y); });
  document.querySelectorAll('[data-drillscope]').forEach(b => b.onclick = () => startTerms(b.dataset.drillscope, null, true));
  const g = id => $(id);
  if (g('#goDrill')) g('#goDrill').onclick = () => startTerms(SCOPE);
  if (g('#goOrders')) g('#goOrders').onclick = () => startItems('o');
  if (g('#goDanger')) g('#goDanger').onclick = () => startItems('d');
  if (g('#goRules')) g('#goRules').onclick = () => startItems('x');
  if (g('#gq')) {
    document.querySelectorAll('[data-gs]').forEach(b => b.onclick = () => { GS = b.dataset.gs; document.querySelectorAll('[data-gs]').forEach(c => c.classList.toggle('on', c === b)); paintGloss(); });
    g('#gq').oninput = paintGloss;
    g('#gDrill').onclick = () => startTerms('all', GLIST.map(t => t.id));
    paintGloss();
  }
}

/* ── runs ── */
const runHead = tag => `<div class="qhead"><button class="btn ghost" id="runBack" style="padding:4px 10px">← Stop</button><span class="n">${RUN.i + 1} / ${RUN.items.length}</span>${tag ? `<span class="tag" style="margin-left:auto">${tag}</span>` : ''}</div>`;
const pips = () => `<div class="pips">${RUN.items.map((x, k) => `<span class="pip${k < RUN.i ? ' done' : ''}${k === RUN.i ? ' cur' : ''}"></span>`).join('')}</div>`;
function bindRunHead() { $('#runBack').onclick = leaveRun; }
function nextQ() { RUN.i++; if (RUN.i >= RUN.items.length) return endRun(); showRun(); window.scrollTo(0, 0); }
function showRun() { ({ t: showT, o: showO, x: showX, d: showD })[RUN.kind](); }
/* a miss comes back a few questions later (at most twice more in one run) */
function requeue(it) {
  if (RUN.items.filter(x => x.id === it.id).length >= 3) return;
  RUN.items.splice(Math.min(RUN.items.length, RUN.i + 4), 0, { id: it.id, dir: it.dir });
}
function showNext() {
  const last = RUN.i + 1 >= RUN.items.length;
  return `<button class="btn primary wide" id="nextB">${last ? 'See how you went →' : 'Next →'}</button>`;
}
function bindNext() { const b = $('#nextB'); b.onclick = nextQ; b.focus({ preventScroll: true }); const f = $('#fb'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

/* terms */
/* ids: exactly these terms (a redo, or the glossary's filtered list) · whole: every term in the scope, ignoring the size chips */
function startTerms(scope, ids, whole) {
  const pool = ids ? ids.map(id => BYID.get(id)).filter(Boolean) : poolOf(scope);
  const size = ids || whole ? pool.length : N === 'all' ? pool.length : N;
  const dealt = ids ? shuffle(pool).slice(0, size) : deal(pool, ST, size, Date.now(), Math.random);
  if (!dealt.length) { alert('Nothing to drill here yet.'); return; }
  RUN = { kind: 't', items: dealt.map(t => ({ id: t.id, dir: pickDir(t, ST[t.id], Math.random) })), i: 0, right: 0, done: 0, missed: [],
    again: () => startTerms(scope, ids, whole), L0: progress(TERMS, ST).L };
  enterRun(); showT(); window.scrollTo(0, 0);
}
function showT() {
  const it = RUN.items[RUN.i], t = BYID.get(it.id), c = CAT[t.c], kind = kindOf(t);
  if (!it.o) it.o = options(t, it.dir, TERMS, Math.random);
  const big = it.dir === 'f' ? t.t : t.m, cls = it.dir === 'r' ? 'm' : kind === 'abbr' ? 'w' : 'wt';
  $('#view').innerHTML = `<div class="card">${runHead(c.ic + ' ' + esc(c.n))}
    <p class="cs-p">${esc(promptFor(t, it.dir, PROMPTS))}</p>
    <div class="cs-big ${cls}">${esc(big)}</div>
    <div class="cs-opts${it.dir === 'r' ? ' grid' + (kind === 'abbr' ? ' mono' : '') : ''}">${it.o.opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.text)}</button>`).join('')}</div>
    <div id="fb"></div></div>${pips()}`;
  bindRunHead();
  document.querySelectorAll('.cs-opts .opt').forEach(b => b.onclick = () => answerT(+b.dataset.k));
}
function answerT(k) {
  const it = RUN.items[RUN.i]; if (it.done) return;
  const t = BYID.get(it.id), right = k === it.o.ans, st = record(ST, t.id, right, Date.now(), LOCK.t), pick = BYID.get(it.o.opts[k].id);
  it.done = 1; RUN.done++;
  if (right) RUN.right++; else { RUN.missed.push(t.id); requeue(it); }
  save();
  document.querySelectorAll('.cs-opts .opt').forEach((b, j) => { b.disabled = true; b.classList.add(j === it.o.ans ? 'k' : j === k ? 'x' : 'dim'); });
  $('#fb').innerHTML = `<div class="mk ${right ? 'right' : 'wrong'}">
      <p class="verdict">${right ? '✓ Right' : '✗ Not this time'} ${lockBadge(st, LOCK.t)}</p>
      <p class="cs-def"><code>${esc(t.t)}</code> = ${esc(t.m)}</p>
      ${right ? '' : `<p class="you">You picked ${it.dir === 'f' ? `“${esc(pick.m)}” — that is <code>${esc(pick.t)}</code>` : `<code>${esc(pick.t)}</code> — that means “${esc(pick.m)}”`}.</p>`}
      ${termDetail(t)}${right ? '' : '<p class="hist">It comes back in a few questions.</p>'}
    </div>${showNext()}`;
  bindNext();
}

/* orders, scenes and dangers share one runner */
const STORE = { o: SO, x: SX, d: SD }, POOL = { o: ORDERS, x: SCENES, d: DANGERS };
function startItems(kind, ids) {
  const pool = ids ? ids.map(id => POOL[kind].find(x => x.id === id)).filter(Boolean) : POOL[kind];
  const size = ids || kind === 'd' || N === 'all' ? pool.length : N;
  const dealt = ids ? shuffle(pool) : deal(pool, STORE[kind], size, Date.now(), Math.random);
  if (!dealt.length) { alert('Nothing here yet.'); return; }
  RUN = { kind, items: dealt.map(x => ({ id: x.id })), i: 0, right: 0, done: 0, missed: [], again: () => startItems(kind, ids) };
  enterRun(); showRun(); window.scrollTo(0, 0);
}
/* a right answer after a peek counts as seen, never as read cold */
function mark(kind, id, right, peek) {
  const S = STORE[kind];
  if (right && peek) { const s = S[id] || (S[id] = { s: 0, n: 0, w: 0, t: 0 }); s.n++; s.t = Date.now(); return s; }
  return record(S, id, right, Date.now(), LOCK[kind]);
}
function tally(it, right) { it.done = 1; RUN.done++; if (right) RUN.right++; else { RUN.missed.push(it.id); requeue(it); } save(); }
const decodeChip = (id, open) => { const t = BYID.get(id);
  return open ? `<span class="dchip open"><code>${esc(t.t)}</code> = ${esc(t.m)}</span>` : `<button class="dchip" data-dc="${id}">${esc(t.t)} ?</button>`; };
function chartLine(o) {
  const cell = (l, v) => v ? `<div class="cl-cell"><small>${l}</small><b>${esc(v)}</b></div>` : '';
  return `<div class="cl cl-${o.sec}"><span class="cl-sec">${esc(SEC[o.sec])}</span><div class="cl-med">${esc(o.med)}</div>
    <div class="cl-grid">${cell('Dose', o.dose)}${cell('Route', o.route)}${cell(o.sec === 'fluid' ? 'Over' : o.sec === 'o2' ? 'How' : 'Frequency', o.freq)}${cell('For', o.ind)}${cell('Max', o.max)}</div>
    ${o.note ? `<div class="cl-note">${esc(o.note)}</div>` : ''}</div>`;
}
function showO() {
  const it = RUN.items[RUN.i], o = ORD.get(it.id);
  if (!it.o) it.o = shuffle([{ t: o.read, ok: 1 }, ...o.bad.map(b => ({ t: b[0], why: b[1] }))]);
  it.open = it.open || {};
  $('#view').innerHTML = `<div class="card">${runHead('📋 Read the chart')}
    ${chartLine(o)}
    <p class="cs-p">What does this order tell you to do?</p>
    <div class="cs-opts">${it.o.map((x, k) => `<button class="opt" data-k="${k}">${esc(x.t)}</button>`).join('')}</div>
    <div class="cs-decode"><span class="hist">Stuck? Decode a word — a peek is fine, it just won’t count as a cold read:</span>
      <div class="dchips" id="dchips">${o.tk.map(id => decodeChip(id, it.open[id])).join('')}</div></div>
    <div id="fb"></div></div>${pips()}`;
  bindRunHead();
  document.querySelectorAll('.cs-opts .opt').forEach(b => b.onclick = () => answerO(+b.dataset.k));
  bindDecode(it, o);
}
function bindDecode(it, o) {
  document.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => { it.open[b.dataset.dc] = 1; if (!it.done) it.peek = 1;
    $('#dchips').innerHTML = o.tk.map(id => decodeChip(id, it.open[id])).join(''); bindDecode(it, o); });
}
function answerO(k) {
  const it = RUN.items[RUN.i]; if (it.done) return;
  const o = ORD.get(it.id), x = it.o[k], right = !!x.ok, st = mark('o', o.id, right, it.peek);
  tally(it, right);
  document.querySelectorAll('.cs-opts .opt').forEach((b, j) => { b.disabled = true; b.classList.add(it.o[j].ok ? 'k' : j === k ? 'x' : 'dim'); });
  o.tk.forEach(id => it.open[id] = 1);
  $('#dchips').innerHTML = o.tk.map(id => decodeChip(id, 1)).join('');
  $('#fb').innerHTML = `<div class="mk ${right ? 'right' : 'wrong'}">
      <p class="verdict">${right ? (it.peek ? '✓ Right — after a peek, so not yet a cold read' : '✓ Read it right') : '✗ Misread'} ${lockBadge(st, LOCK.o)}</p>
      ${right ? '' : `<p class="you">What you picked gets this wrong: ${esc(x.why)}</p>`}
      <p><b>It says:</b> ${esc(o.read)}</p>
      ${o.src ? `<div class="refsrc">📘 ${esc(o.src)}</div>` : ''}
      <div class="refsrc">Typical adult example for reading practice — not a dosing guide.</div>
    </div>${showNext()}`;
  bindNext();
}
function sceneOpts(s) { return s.k === 'sec' ? CS.sectionOpts : s.k === 'code' ? CS.codeOpts : null; }
function showX() {
  const it = RUN.items[RUN.i], s = SCN.get(it.id);
  if (!it.o) it.o = sceneOpts(s) ? sceneOpts(s).slice() : shuffle(s.opts);
  const lead = s.k === 'sec' ? 'Which part of the chart does this go in?' : s.k === 'code' ? 'Which code goes in the dose box?' : '';
  $('#view').innerHTML = `<div class="card">${runHead(s.k === 'sec' ? '📋 Section' : s.k === 'code' ? '🔤 Code' : '🧭 Rule')}
    ${lead ? `<p class="cs-p">${lead}</p>` : ''}
    <p class="cs-big m">${esc(s.q)}</p>
    <div class="cs-opts${s.k === 'code' ? ' grid' : ''}">${it.o.map((x, k) => `<button class="opt" data-k="${k}">${esc(x)}</button>`).join('')}</div>
    <div id="fb"></div></div>${pips()}`;
  bindRunHead();
  document.querySelectorAll('.cs-opts .opt').forEach(b => b.onclick = () => answerX(+b.dataset.k));
}
function answerX(k) {
  const it = RUN.items[RUN.i]; if (it.done) return;
  const s = SCN.get(it.id), a = s.k === 'mcq' ? s.opts[0] : s.a, right = it.o[k] === a, st = mark('x', s.id, right, false);
  tally(it, right);
  document.querySelectorAll('.cs-opts .opt').forEach((b, j) => { b.disabled = true; b.classList.add(it.o[j] === a ? 'k' : j === k ? 'x' : 'dim'); });
  $('#fb').innerHTML = `<div class="mk ${right ? 'right' : 'wrong'}">
      <p class="verdict">${right ? '✓ Right' : '✗ Not this one'} ${lockBadge(st, LOCK.x)}</p>
      ${right ? '' : `<p><b>Answer:</b> ${esc(a)}</p>`}<p>${esc(s.why)}</p>
      ${s.src ? `<div class="refsrc">📘 From the course: ${esc(s.src)}</div>` : ''}
      ${s.k === 'code' ? '<div class="refsrc">📄 The key printed on the NZ 8-Day National Medication Chart (2012 edition). If your ward’s chart prints a different key, that key wins.</div>' : ''}
    </div>${showNext()}`;
  bindNext();
}
function showD() {
  const it = RUN.items[RUN.i], d = DNG.get(it.id);
  $('#view').innerHTML = `<div class="card">${runHead('⚠️ Spot the danger')}
    <p class="cs-p">One part of this order is written dangerously. Tap it.</p>
    <div class="dline">${d.tk.map((tk, k) => `<button class="dtok" data-k="${k}">${esc(tk[0])}</button>`).join('')}</div>
    <div id="fb"></div></div>${pips()}`;
  bindRunHead();
  document.querySelectorAll('.dtok').forEach(b => b.onclick = () => answerD(+b.dataset.k));
}
function answerD(k) {
  const it = RUN.items[RUN.i]; if (it.done) return;
  const d = DNG.get(it.id), hot = d.tk.findIndex(tk => tk[1]), right = k === hot, st = mark('d', d.id, right, false), t = BYID.get(d.d);
  tally(it, right);
  document.querySelectorAll('.dtok').forEach((b, j) => { b.disabled = true; if (j === hot) b.classList.add('hit'); else if (j === k) b.classList.add('miss'); });
  $('#fb').innerHTML = `<div class="mk ${right ? 'right' : 'wrong'}">
      <p class="verdict">${right ? '✓ Spotted it' : `✗ The danger was <code>${esc(d.tk[hot][0])}</code>`} ${lockBadge(st, LOCK.d)}</p>
      <p>${esc(d.risk)}</p>
      <p class="cs-fix"><b>Write it as:</b> <code>${esc(d.fix)}</code></p>
      <details class="how"><summary>${esc(t.t)} — ${esc(t.m)}</summary>${termDetail(t)}</details>
    </div>${showNext()}`;
  bindNext();
}

function endRun() {
  const R = RUN, miss = [...new Set(R.missed)], k = R.kind;
  const name = id => k === 't' ? `<code>${esc(BYID.get(id).t)}</code> ${esc(BYID.get(id).m)}` : k === 'o' ? `<b>${esc(ORD.get(id).med)}</b> — ${esc(ORD.get(id).read)}`
    : k === 'x' ? esc(SCN.get(id).q) : `<code>${esc(DNG.get(id).tk.find(tk => tk[1])[0])}</code> ${esc(DNG.get(id).risk)}`;
  const P = progress(TERMS, ST), sub = k === 't' ? `${Math.max(0, P.L - R.L0)} newly locked · ${P.part} on the way — right once, locked by one more right answer 10+ minutes from now · ${P.L} of ${TERMS.length} locked in all` : statusLine();
  $('#view').innerHTML = `<div class="card"><div class="qhead"><button class="btn ghost" id="runBack" style="padding:4px 10px">← Back</button><span class="n">Done</span></div>
    <p class="score-hero">${R.right} / ${R.done}</p>
    <p class="score-sub">${esc(sub)}</p>
    ${miss.length ? `<div class="lsec">To redo · ${miss.length}</div><div class="cs-list">${miss.map(id => `<div class="krow">${name(id)}</div>`).join('')}</div>` : '<p style="text-align:center">Nothing missed.</p>'}
    ${miss.length ? `<button class="btn primary wide" id="redoB">Redo the ${miss.length} you missed</button>` : ''}
    <button class="btn ${miss.length ? '' : 'primary '}wide" id="againB">Another round</button>
    <button class="btn ghost wide" id="doneB">← Back</button></div>`;
  $('#runBack').onclick = leaveRun; $('#doneB').onclick = leaveRun;
  $('#againB').onclick = () => R.again();
  const rb = $('#redoB'); if (rb) rb.onclick = () => k === 't' ? startTerms('all', miss) : startItems(k, miss);
  window.scrollTo(0, 0);
}

/* keyboard: number keys pick, Enter moves on */
document.addEventListener('keydown', e => {
  if (!RUN || e.target.matches('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter') { const b = $('#nextB'); if (b) { e.preventDefault(); b.click(); } return; }
  const n = parseInt(e.key, 10); if (!(n >= 1 && n <= 9)) return;
  const b = document.querySelectorAll('.cs-opts .opt:not(:disabled), .dtok:not(:disabled)')[n - 1]; if (b) { e.preventDefault(); b.click(); }
});

/* ── chrome ── */
{ document.documentElement.style.setProperty('--tool', CS.hue);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${CS.hue}"/><text x="32" y="45" font-size="38" text-anchor="middle">💬</text></svg>`;
  const l = document.createElement('link'); l.rel = 'icon'; l.href = 'data:image/svg+xml,' + encodeURIComponent(svg); document.head.appendChild(l);
  $('#backLink').textContent = '‹ ' + CS.back;
  document.title = 'Chart Speak · ' + CS.short; }
if (LS('theme') === 'light') document.documentElement.dataset.theme = 'light';
$('#themeBtn').onclick = () => { const r = document.documentElement, to = r.dataset.theme === 'light' ? '' : 'light';
  to ? r.dataset.theme = 'light' : delete r.dataset.theme; SV('theme', to); };
$('#helpBtn').onclick = () => {
  const n = k => TERMS.filter(t => (t.k || 'ward') === k).length;
  $('#help').innerHTML = `<h2 style="margin-top:0">What is this?</h2>
  <p><b>Chart Speak</b> teaches you to read a medication chart before you meet one on placement: every abbreviation, symbol and term you are likely to see on an NZ med chart and in the notes around it — <b>${TERMS.length}</b> of them in ${CATS.length} topics — plus <b>${ORDERS.length}</b> real-looking orders to decode, <b>${DANGERS.length}</b> dangerous ways of writing to spot, and <b>${SCENES.length}</b> chart-rule scenarios.</p>
  <h3>The four drills</h3>
  <p><b>🔤 Terms & abbreviations</b> — a term as a chart writes it; pick what it means (and, once you have seen it, the other way round). The wrong options are the real traps (BD beside TDS, SC beside SL, mg beside mcg). What you miss comes back a few questions later and leads your next run; <b>2 right in a row locks a term</b> (the second at least 10 minutes after the first), and a locked term comes back after a week to check it stuck.</p>
  <p><b>📋 Read the chart</b> — a whole order, laid out like a chart line. Three of the four readings get exactly one thing wrong, so you have to read every part. <b>⚠️ Spot the danger</b> — tap the one part of an order that is written dangerously. <b>🧭 Chart rules & codes</b> — which section an order goes in, which not-given code goes in the dose box, and the rules around them.</p>
  <h3>Where it comes from</h3>
  <p>📌 <b>${n('must')}</b> are on the course’s own Must-Know abbreviations list (Concepts (2), slides 77–80) — know these cold. 📘 <b>${n('deck')}</b> come from the course’s decks, each naming its slide; the pharmacology words use the decks’ own definitions, the same ones the Joan-format short answers teach. 🏥 <b>${n('ward')}</b> are everyday NZ ward usage in this tool’s words, and ⚠️ <b>${n('safe')}</b> come from the international error-prone list — where your hospital’s list says different, <b>your hospital wins</b>. 📄 <b>${n('nmc')}</b> are printed on the NZ 8-Day National Medication Chart itself — its codes, recommended times and instructions. The not-given codes are that chart’s key (U, SM, CP, R, D, N); if your ward’s chart prints a different one, it wins.</p>
  <p><b>Not a dosing guide.</b> The orders use typical adult doses so they look like a real chart. They are practice in reading only — the chart, the NZ Formulary and your preceptor decide what is given.</p>
  <h3>Your data</h3>
  <p>Progress lives in this browser only, under the Paper Sim’s own name, and the Paper Sim’s home row shows a one-line summary of it. Nothing is sent anywhere. Clearing site data wipes it.</p>
  <h3>For whoever maintains this</h3>
  <p>Built by <code>node build-terms.mjs</code> from <code>content/terms/*.js</code> (the schema is at the top of <code>content/terms/index.js</code>) and <code>terms-engine.mjs</code>, into <code>terms-template.html</code>, with the Paper Sim’s stylesheet copied in from <code>template.html</code>. The build fails on a broken reference, a meaning shared by two terms that could meet in one question, a danger line with more than one dangerous part, or any question it can deal that shows its answer twice, repeats an option, or offers two right answers — it deals every one to check. Built ${esc(CS.built)}.</p>
  <button class="btn primary wide" onclick="this.closest('dialog').close()">Close</button>`;
  $('#help').showModal(); };
save();
render(curScr());
</script>
