<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chart Sim</title>
<style>
/* the Paper Sim's own stylesheet, copied in by build-chart.mjs from template.html (never retyped here) */

/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}   /* .btn sets display, which would otherwise beat the attribute */
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
/* phone: title over countdown on the left, buttons full height on the right (was one flex row: the title got squeezed to a word per line) */
@media(max-width:560px){
  header{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;gap:0 8px;padding:8px 12px}
  header h1{grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .d{grid-area:2/1;white-space:normal;font-size:.76rem;line-height:1.3}
  header .btn{grid-row:1/span 2;padding:8px 10px;min-width:40px}
}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
/* a quiz row: tag + name, then count + Learn + Sit as one group that drops to a
   second line at phone width instead of squeezing the name into four lines */
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1 1 150px;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.qrow .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
/* quiz selection: tick any rows (or a whole system) and the bottom bar runs them as one */
.qrow{cursor:pointer}
.qrow.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.qrow>input.pk{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:var(--primary);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;font-size:.8rem;color:var(--muted-fg)}
.chip{border:1px solid var(--border);border-radius:99px;padding:4px 11px;background:transparent;color:var(--fg);
  cursor:pointer;font:inherit;font-size:.8rem;font-weight:600;line-height:1.3}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.footbar .btn.x{flex:0 0 auto}
/* ── focus checklist ─────────────────────────────────────────────────── */
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:2px 0 8px}
.fbar{height:6px;border-radius:99px;background:var(--accent);overflow:hidden;flex:1 1 140px;min-width:120px}
.fbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.ftier{font-weight:700;font-size:.82rem;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.ftier b{font-weight:700}
.ftier .fnum{font-weight:400;color:var(--muted-fg)}
.frow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);
  border-left:3px solid var(--tc,var(--border))}
.frow.on{opacity:.62}
.frow.on .ft{text-decoration:line-through}
.frow>input.fchk{flex:0 0 auto;width:18px;height:18px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.fbody{flex:1 1 auto;min-width:0}
.fbody>summary{cursor:pointer;list-style:none;display:block}
.fbody>summary::-webkit-details-marker{display:none}
.ft{font-weight:650;font-size:.92rem;display:block}
.fmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fchip{font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--muted-fg);white-space:nowrap}
.fchip.her{background:hsl(38 92% 55% / .18);color:var(--warn)}
.fchip.tape{background:hsl(0 84% 60% / .16);color:var(--danger)}
.fchip.saq{background:hsl(218 91% 64% / .16);color:var(--primary)}
.fchip.sys{background:transparent;border:1px solid var(--border)}
.fchip.hl{background:hsl(158 64% 42% / .2);color:var(--ok);font-weight:650}
.fchip.rev{background:hsl(158 64% 42% / .12);color:var(--ok)}
.fchip.kh{background:hsl(280 60% 60% / .16);color:hsl(280 70% 72%)}
.hlans{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.hlans>summary{cursor:pointer;padding:7px 10px;font-weight:650;font-size:.84rem;color:var(--ok);list-style:none}
.hlans>summary::-webkit-details-marker{display:none}
.hlans .hlbody{padding:0 10px 10px;font-size:.83rem;line-height:1.55;white-space:pre-wrap}
.hlans .hlh{font-weight:700;margin:8px 0 4px;font-size:.8rem;letter-spacing:.02em}
.fdet{font-size:.85rem;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.fdet p{margin:0 0 7px}
.fdet .fcap{color:var(--muted-fg)}
.fwhy{font-size:.8rem;line-height:1.5;color:var(--muted-fg);margin:0 0 4px}
@media(max-width:400px){ .ft{font-size:.88rem} .fdet{font-size:.82rem} }
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.mixed,.tag.authored{color:var(--muted-fg)}
/* one colour per group: written at load from META.hue (see "chrome") */
/* sitting */
.qhead{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.lres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.lres .hint{font-size:.76rem;color:var(--muted-fg)}
.lres .qr-pane{flex-basis:100%;padding:6px 0 0}
.mk .verdict{font-weight:700;margin:0 0 4px}
.mk.right .verdict{color:var(--ok)} .mk.wrong .verdict{color:var(--danger)} .mk.saq{border-color:var(--primary)}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.qrow .btn{padding:6px 10px;font-size:.8rem}
.qrow .btn.learn{border-color:var(--primary);color:var(--primary)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.refq.patton{border-left:3px solid var(--primary)}
.refq i{color:var(--fg)}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.kref{font-size:.84rem;color:var(--muted-fg);margin:4px 0 6px 14px;padding:6px 10px;background:var(--muted);border-radius:8px;line-height:1.45}
.kref i{color:var(--fg)}
.kref .refsrc{display:inline}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.aiwrap{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:8px 0 4px}
.aitext{flex-basis:100%;width:100%;min-height:150px;font-size:.78rem;margin-top:6px}
.aisplit{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px}
.aisplit .askai{margin-top:0}
.vclip{margin:.5rem 0}
.vframe{position:relative;aspect-ratio:16/9;width:100%;max-width:460px;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.vframe img,.vframe iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(20,20,28,.72);color:#fff;border:2px solid #fff;font-size:1.3rem;cursor:pointer;line-height:1}
.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;padding:2px 6px;border-radius:4px;pointer-events:none}
.vmeta{font-size:.82rem;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.vch{font-weight:600}
.vfull{padding:2px 8px;font-size:.74rem}
.rev-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:.85rem}
.rev-ctl .wo{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.systally{display:flex;flex-wrap:wrap}
.systally .tag{display:inline-block;background:var(--muted);padding:2px 9px;border-radius:11px;margin:2px 5px 2px 0;font-size:.74rem}
.systally .tag.ok{color:var(--ok)}
.qr{border:1px solid var(--muted);border-left-width:4px;border-radius:9px;margin:6px 0;background:var(--card)}
.qr.right{border-left-color:var(--ok)} .qr.partial{border-left-color:var(--warn)} .qr.wrong{border-left-color:var(--danger)} .qr.saq{border-left-color:var(--primary)}
.qr-head{display:flex;gap:10px;align-items:flex-start;padding:9px 11px 7px}
.qr-mk{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 8px;border-radius:6px;font-size:.82rem;background:var(--muted)}
.qr.right .qr-mk{background:var(--ok);color:var(--onprimary)} .qr.partial .qr-mk{background:var(--warn);color:var(--onprimary)} .qr.wrong .qr-mk{background:var(--danger);color:#fff}
.qr-stem{font-size:.9rem;line-height:1.35;flex:1}
.qr-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 11px 9px}
.qa{padding:3px 11px;font-size:.77rem;border:1px solid var(--muted);border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.qa:hover{border-color:var(--primary)} .qa.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.qr-pane{padding:2px 11px 11px}
.qr .src{font-size:.72rem;color:var(--primary);margin-right:auto;opacity:.85}
.qr .you{font-size:.8rem;padding:2px 11px 4px;opacity:.85}
.qr .steps{padding:2px 11px 6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
/* ── home: one screen of row cards, each opening its own screen (was one 5-6 screen scroll) ── */
.hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--primary) 14%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);
  border-radius:12px;padding:12px 14px;margin:2px 0 4px}
.hero small{display:block;font-size:.76rem;color:var(--primary);font-weight:650}
.hero b{display:block;font-size:1rem;line-height:1.35;margin-top:2px}
.hero .go{flex:0 0 auto;margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--onprimary);
  display:flex;align-items:center;justify-content:center;font-size:1rem}
.lsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:12px 4px 5px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:0 0 7px;
  transition:border-color var(--dur) var(--ease)}
.lrow:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.lic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.ltx{flex:1 1 auto;min-width:0}
.ltx b{display:block;font-size:.97rem;font-weight:650}
.ltx small{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.35;margin-top:1px}
.lch{flex:0 0 auto;color:var(--muted-fg);font-size:1.3rem;line-height:1}
a.lrow{text-decoration:none}   /* a row that opens another page of this tool (META.more) */
/* the paper's banner on home: its bold first sentence always shows, the rest is one tap away */
.bnote{margin:0 0 10px}
.bnote>summary{cursor:pointer;list-style:none}
.bnote>summary::-webkit-details-marker{display:none}
.bnote>summary::after{content:' · more';color:var(--primary);font-size:.8rem;font-weight:650}
.bnote[open]>summary::after{content:''}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead h2{margin:0;font-size:1.1rem;flex:1}
/* the tool's own name and colour (26 Sep 2026): four Paper Sims share one layout, so the title card on home, the stripe
   along the header and the tab icon are what tell them apart. --tool is set from TOOL at load. */
header{border-top:4px solid var(--tool)}
.idcard{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:12px 14px;border-radius:var(--radius);
  background:color-mix(in srgb,var(--tool) 15%,var(--card));border:1px solid color-mix(in srgb,var(--tool) 45%,var(--border))}
.idic{flex:0 0 48px;height:48px;border-radius:12px;background:var(--tool);display:flex;align-items:center;justify-content:center;font-size:1.55rem}
.idtx{min-width:0}
.idtx small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--tool) 62%,var(--fg))}
.idtx b{display:block;font-size:1.45rem;line-height:1.15;margin:2px 0 3px;font-weight:800}
.idtx>span{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.3}
/* phone: the title card and the rows tighten so home still fits one 375x812 screen */
@media(max-width:560px){
  .idcard{padding:9px 12px;gap:10px;margin-bottom:8px}
  .idic{flex-basis:40px;height:40px;border-radius:10px;font-size:1.3rem}
  .idtx b{font-size:1.25rem;margin:1px 0 2px}
  .idtx small,.idtx>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow{padding:6px 12px;margin-bottom:5px}
  .lic{flex-basis:36px;height:36px}
  .lsec{margin:8px 4px 4px}
  .hero{padding-top:9px;padding-bottom:9px}
  .bnote{padding:6px 10px;margin-bottom:8px;line-height:1.35}
}
.shead .btn{padding:6px 12px;flex:0 0 auto}
.card .lead{margin:0 0 4px;color:var(--muted-fg);font-size:.9rem;line-height:1.5}
/* each screen's full explanation, folded under its one-line lead (self-explaining, but out of the way) */
.how{margin:0 0 6px}
.how>summary{cursor:pointer;font-size:.82rem;font-weight:650;color:var(--primary);list-style:none;display:inline-block;padding:2px 0}
.how>summary::-webkit-details-marker{display:none}
.how>summary::before{content:'ⓘ '}

:root{--hand:"Bradley Hand","Segoe Print","Chalkboard SE","Comic Sans MS","Comic Neue",system-ui,sans-serif;--ink:#0b3ea8;--pen:#1d2433}

label.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:10px 0 2px;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--primary)}
.warnln{color:var(--danger);font-size:.86rem;margin:6px 0 0}

.foot{color:var(--muted-fg);font-size:.8rem;text-align:center;margin:16px 0 0}
/* the simulator: header, a bar, the page tabs, then the chart beside (wide) or above (narrow) the panel */
body.simon{overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column}
body.simon header{position:static;flex:0 0 auto}
body.simon main{display:none}
#sim{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.sbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border)}
.sbar .who{flex:1 1 auto;min-width:0;line-height:1.25}
.sbar .who b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .who small{display:block;color:var(--muted-fg);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.sm{padding:6px 9px;font-size:.84rem}
.tabs{display:flex;gap:5px;align-items:center;padding:6px 8px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:transparent;color:var(--fg);font:inherit;font-size:.82rem;font-weight:650;cursor:pointer;white-space:nowrap;position:relative}
.tab.on{background:var(--accent);border-color:var(--primary)}
.tab.dot::after{content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.zm{margin-left:auto;display:flex;gap:4px;flex:0 0 auto;padding-left:6px}
.zm button{min-width:36px;padding:6px 8px}
.stage{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;position:relative}
.vp{overflow:auto;touch-action:none;background:#5b616c;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.vp.pen{cursor:crosshair}
.vp svg{display:block;margin:10px auto;background:#fff;box-shadow:0 2px 14px rgb(0 0 0/.4)}
.vp svg text{font-family:Arial,Helvetica,sans-serif}
.vp svg .en{fill:var(--pen);font-family:var(--hand)}
.vp svg .me{fill:var(--ink);font-family:var(--hand)}
.vp svg .gh{fill:#067a52;font-family:var(--hand);opacity:.9}
.vp svg .ty{fill:#111;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.vp svg path.en,.vp svg ellipse.en{fill:none;stroke:var(--pen)}
.vp svg path.me,.vp svg ellipse.me{fill:none;stroke:var(--ink)}
.vp svg path.gh,.vp svg ellipse.gh{fill:none;stroke:#067a52}

.vp svg .hl.bad{fill:rgb(239 68 68/.14);stroke:#ef4444}

@keyframes pulse{50%{stroke-width:4}}

const CE = (() => {
/* Chart Sim's engine: pure functions, no DOM, no imports. build-chart.mjs inlines this file into chart.html (with
   `export ` stripped) AND imports it to audit every scenario — so the questions and checks the build proves are the
   ones the page runs.

   A scenario (content/chart/*.js) describes one patient's 8-Day National Medication Chart in a few lines per order;
   compile() turns it into V, a map from every cell on the chart (see the cell ids in chart-render.mjs) to what is
   written there, plus the structured facts the questions are generated from. */

/* The regular-medicine time boxes printed on the NZ chart (NMC8D) beside every order */
const PRINTED = ['0600', '0800', '1400', '1800', '2200'];
/* The chart's own non-administration key (NMC8D, 2012 ed., p. 11) */
const CODES = { U: 'Patient unavailable', SM: 'Self-medicating', CP: 'Carer/Parent', R: 'Patient refused', D: 'Prescriber’s instructions', N: 'Not administered — reason in notes' };
const PRN_LINES = 20;      // record lines per PRN order: 4 groups × 5 (NMC8D p. 5)

const toMin = hhmm => { const t = String(hhmm).padStart(4, '0'); return +t.slice(0, 2) * 60 + +t.slice(2); };
const abs = (day, hhmm) => (day - 1) * 1440 + toMin(hhmm);                 // minutes since 0000 on day 1
const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + String(m % 60).padStart(2, '0'); };
const parseAt = at => { const m = /^(\d)@(\d{4})$/.exec(at); if (!m) throw new Error('bad time "' + at + '" — want day@HHMM'); return { day: +m[1], t: m[2], m: abs(+m[1], m[2]) }; };

/* the chart's dates: day 1 = start, written d/m/yy as a nurse would */
function dayDate(S, day) {
  const [d, mo, y] = S.start, dt = new Date(Date.UTC(y, mo - 1, d + day - 1));
  return `${dt.getUTCDate()}/${dt.getUTCMonth() + 1}/${String(dt.getUTCFullYear()).slice(2)}`;
}
const WEEKDAY = (S, day) => { const [d, mo, y] = S.start; return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(Date.UTC(y, mo - 1, d + day - 1)).getUTCDay()]; };

/* Where each prescribed time sits in the five printed rows: a printed time is circled; any other time is written
   in the box beside the nearest free printed row (e.g. 2000 beside 1800). */
function slotsFor(times) {
  const out = [null, null, null, null, null];
  const list = String(times || '').split(/\s+/).filter(Boolean);
  for (const t of list) { const i = PRINTED.indexOf(t); if (i >= 0) out[i] = { t, circled: true }; }
  for (const t of list) {
    if (PRINTED.includes(t)) continue;
    let best = -1, bd = 1e9;
    PRINTED.forEach((p, i) => { const d = Math.abs(toMin(p) - toMin(t)); if (!out[i] && d < bd) { bd = d; best = i; } });
    if (best < 0) throw new Error('no free time row for ' + t);
    out[best] = { t, circled: false };
  }
  return out;
}

function parseAdmin(v, slotT) {

      o.slots.map((s, k) => s ? `reg.${o.L}.s${k}` : null).filter(Boolean), 'The “Circle or actual time” column beside the order: circled printed times, or a time written in the box.');
  }
  const signed = C.reg.flatMap(o => o.adm.filter(e => e.giv).map(e => ({ o, e })));
  for (const { o, e } of pick(signed, 4)) {
    const cell = `reg.${o.L}.d${e.day}.s${e.slot}.gc`, idx = (S.nurses || []).findIndex(n => n.init === e.giv);
    mcq(`who-${o.L}-${e.day}-${e.slot}`, 'Regular', `Who gave the ${e.due} ${nm(o)} on ${dayDate(S, e.day)}?`, nameOf(e.giv),
      (S.nurses || []).map(n => n.name).concat((S.prescribers || []).map(p => p.name)), [cell, `siga.${idx}.init`, `siga.${idx}.name`],
      `Initials in the Giv/Chck box (${e.giv}${e.chk ? ' / ' + e.chk : ''}) — and the Sample Initials register on the front page says whose they are.`);
    tap(`tap-${o.L}-${e.day}-${e.slot}`, 'Regular', `Tap the box that shows the ${e.due} ${nm(o)} was given on ${dayDate(S, e.day)}.`, [cell, `reg.${o.L}.d${e.day}.s${e.slot}.t`],
      `Row ${o.L}, the ${dayDate(S, e.day)} column, the ${e.due} line.`);
  }
  for (const o of C.reg) for (const e of o.adm.filter(x => x.code)) {
    const cell = `reg.${o.L}.d${e.day}.s${e.slot}.gc`;
    mcq(`code-${o.L}-${e.day}-${e.slot}`, 'Regular', `The ${e.due} ${nm(o)} on ${dayDate(S, e.day)} has a code instead of initials. What does it mean?`, `${e.code} — ${CODES[e.code]}`,
      Object.entries(CODES).map(([k, v]) => `${k} — ${v}`), [cell], `A code in the Giv/Chck box instead of initials: no nurse gave that dose. The key is printed on the chart (U, SM, CP, R, D, N)${e.code === 'N' ? ' — N means the reason is in the clinical notes' : ''}.`);
    tap(`tapcode-${o.L}-${e.day}-${e.slot}`, 'Regular', `Tap the box that shows the ${e.due} ${nm(o)} on ${dayDate(S, e.day)} was NOT given by a nurse.`, [cell], `Row ${o.L}: the box with “${e.code}” in it.`);
  }
  const m = abs(C.now.day, C.now.t);
  for (const o of pick(active, 3)) {
    const n = nextDue(o, m); if (!n) continue;
    const others = [...new Set(C.reg.flatMap(x => x.slots.filter(Boolean).map(s => s.t)))].filter(t => t !== n.t);
    mcq(`next-${o.L}`, 'Regular', `It is ${nowTxt}. When is ${nm(o)} next due?`, when(C, n.m),
      [...others.map(t => when(C, abs(C.now.day, t) > m ? abs(C.now.day, t) : abs(C.now.day + 1, t))), when(C, n.m + 1440), when(C, n.m - 1440 > m ? n.m - 1440 : n.m + 2880)],
      [`reg.${o.L}.s${n.slot}`], 'The circled times, then the last signed box in its row.');
  }
  const ceased = C.reg.filter(o => o.ceaseAt && o.ceaseAt.m <= m);
  if (ceased.length) {
    const o = ceased[0];
    mcq(`ceased-${o.L}`, 'Regular', 'Which regular order has been stopped?', `${o.med} ${o.dose} ${o.units} ${o.route} (row ${o.L})`, C.reg.filter(x => x !== o).map(x => `${x.med} ${x.dose} ${x.units} ${x.route} (row ${x.L})`), [`reg.${o.L}.cancel`],
      '“Sign, date and time to cancel” is filled in and the order is crossed through. Never give it from that line again.');
    tap(`tapceased-${o.L}`, 'Regular', 'Tap the regular order that has been stopped.', [`reg.${o.L}.*`], `Row ${o.L} — crossed through, with the cancel box signed.`);
  }

  const cancelled = C.prn.filter(o => o.ceaseAt && o.ceaseAt.m <= m);
  if (cancelled.length) {
    const o = cancelled[0];
    mcq(`prnceased-${o.L}`, 'PRN', 'Which PRN order has been cancelled?', `${o.med} (PRN ${o.L})`, C.prn.filter(x => x !== o).map(x => `${x.med} (PRN ${x.L})`).concat('None — every PRN order is current'), [`prn.${o.L}.cancel`],
      '“Sign, date and time to cancel” is filled in and the order is crossed through. Nothing more is given from it.');
  }
  /* PRN: last dose, can it be given now, 24-hour total */
  for (const o of C.prn) {
    const st = prnStatus(o, m);
    if (st.last) {
      const cells = [`prn.${o.L}.${st.last.line}.date`, `prn.${o.L}.${st.last.line}.time`];
      mcq(`prnlast-${o.L}`, 'PRN', `When was ${o.med} (PRN) last given?`, when(C, st.last.m),
        o.rec.filter(r => r !== st.last).map(r => when(C, r.m)).concat([when(C, st.last.m - 120), when(C, st.last.m + 240), when(C, st.last.m - 1440)]),
        cells, 'The PRN record, beside the order on the facing page: the last line filled in.');
      tap(`tapprn-${o.L}`, 'PRN', `Tap the most recent dose of ${o.med} in the PRN record.`, [`prn.${o.L}.${st.last.line}.*`], `Row ${o.L} of the PRN record — the last line written.`);
    }
    const gapTxt = `every ${o.gapH} hours at most`;
    const yes = st.last ? `Yes — the last dose was ${when(C, st.last.m)}, and the 24-hour maximum is not reached` : 'Yes — none has been given yet, so the gap and the 24-hour maximum are fine';
    const notYet = `Not yet — not until ${when(C, st.nextOk)} (${gapTxt})`;
    const maxed = `No — ${first} has had the 24-hour maximum (${o.max})`;
    const a = o.ceaseAt ? 'No — the order has been cancelled' : st.maxHit ? maxed : st.can ? yes : notYet;
    mcq(`prncan-${o.L}`, 'PRN', `It is ${nowTxt}. ${first} asks for ${o.med} (${o.ind}). Can you give it?`, a,
      [yes, notYet.replace(when(C, st.nextOk), when(C, st.nextOk + 120)), maxed, 'No — PRN medicines are only given twice a day', 'Yes — PRN means whenever the patient asks'],
      [`prn.${o.L}.freq`, `prn.${o.L}.max`, ...(st.last ? [`prn.${o.L}.${st.last.line}.time`] : [])],
      `Frequency (${o.freq}) and Max dose/24hrs (${o.max}) on the order, then the record: ${st.n24} dose${st.n24 === 1 ? '' : 's'} in the last 24 hours${st.last ? ', the last ' + when(C, st.last.m) : ''}.`);
  }
  /* once only, verbal, oxygen, fluids */
  for (const o of C.once.filter(x => x.givenAt && !x.hidden)) {
    const g = o.given, at = when(C, o.givenAt.m), others = (S.nurses || []).filter(n => n.init !== g.giv && n.init !== g.chk).map(n => n.name);
    if (g.chk) mcq(`once-${o.i}`, 'Once Only', `${o.med} ${o.dose} ${o.units} ${o.route} was a once-only dose. When was it given, and who checked it?`, `${at} — checked by ${nameOf(g.chk)}`,
      [`${at} — checked by ${nameOf(g.giv)}`, `${when(C, o.givenAt.m + 60)} — checked by ${nameOf(g.chk)}`, ...others.slice(0, 2).map(n => `${at} — checked by ${n}`), 'It has not been given yet'],
      [`once.${o.i}.dosedt`, `once.${o.i}.gc`], '“Date & time of dose” and the Given by / Checked by box on the Once Only order.');
    else mcq(`once-${o.i}`, 'Once Only', `${o.med} ${o.dose} ${o.units} ${o.route} was a once-only dose. When was it given, and by whom?`, `${at} — by ${nameOf(g.giv)}`,
      [`${when(C, o.givenAt.m + 60)} — by ${nameOf(g.giv)}`, ...others.slice(0, 2).map(n => `${at} — by ${n}`), 'It has not been given yet'],
      [`once.${o.i}.dosedt`, `once.${o.i}.gc`], '“Date & time of dose” and the Given by box on the Once Only order.');
  }
  for (const o of C.verbal) {
    const ok = !!o.signed, due = o.atM.m + 1440;
    mcq(`verbal-${o.i}`, 'Verbal Orders', `A verbal order for ${o.med} was taken at ${dayDate(S, o.atM.day)} ${o.atM.t}. Is it complete?`,
      ok ? 'Yes — the prescriber has signed it' : m > due ? `No — still unsigned, and overdue: it was due by ${when(C, due)}` : `No — not signed yet (due within 24 hours, by ${when(C, due)})`,
      ['Yes — the nurse’s and witness’s initials are enough', ok ? `No — the prescriber has not signed it yet` : 'Yes — the prescriber has signed it', 'Verbal orders never need a signature', 'No — a verbal order cannot be given at all'],
      [`verb.${o.i}.psig`, `verb.${o.i}.pname`], 'The Verbal Orders heading on the chart: “must be signed as soon as possible or within 24 hours of order”.');
  }
  if (S.o2) {
    const t = S.o2.target;
    mcq('o2target', 'Oxygen', `What is ${first}’s target oxygen saturation?`, t + '%', ['88–92%', '92–96%', '94–98%', 'Above 90%', '100%'].filter(x => x !== t + '%'), ['o2.target'],
      'Oxygen Therapy & Medical Gases: the target saturation sits at the top of the section.');
    const cur = C.o2.find(r => !r.stopped);
    if (C.o2.length) mcq('o2now', 'Oxygen', `Is ${first} still prescribed oxygen, as of ${nowTxt}?`, cur ? `Yes — ${cur.device}, ${cur.flow}` : 'No — a stop date has been written',
      [cur ? 'No — a stop date has been written' : `Yes — ${C.o2[0].device}, ${C.o2[0].flow}`, 'Yes — via a non-rebreather at 15 L/min', 'Only at night'],
      C.o2.map(r => `o2.${r.i}.stop`), 'START DATE and STOP DATE on each oxygen line.');
  }
  const flv = C.fluids.filter(f => !f.hidden), run = flv.filter(f => f.running), flTxt = f => `${f.vol} mL ${f.fluid} at ${f.rate} mL/hr (line ${f.i + 1})`;
  if (run.length === 1) mcq('flnow', 'Fluids', `Which IV fluid is running now, as of ${nowTxt}?`, flTxt(run[0]), [...flv.filter(f => f !== run[0]).map(flTxt), 'None — the IV fluids have finished'],
    [`fl.${run[0].i}.astart`, `fl.${run[0].i}.fluid`, `fl.${run[0].i}.rate`], 'The IV fluid record: the line with an actual commencing time and no completion time is the bag running now.');
  for (const f of flv) mcq(`fl-${f.i}`, 'Fluids', `At what rate is the ${f.vol} mL of ${f.fluid} prescribed?`, `${f.rate} mL/hr`,
    [`${Math.round(f.vol / 8)} mL/hr`, `${f.rate * 2} mL/hr`, `${Math.round(f.rate / 2)} mL/hr`, `${f.vol} mL/hr`].filter(x => x !== `${f.rate} mL/hr`),
    [`fl.${f.i}.rate`], 'Rate (mL/hr) on the IV & subcut fluid record. Volume ÷ hours = rate.');
  /* the scenario's own questions (judgement the chart alone cannot generate) */
  for (const q of S.questions || []) if ((q.stage || 0) === (S.stage || 0)) out.push(ownQ(q, shuffle));
  return out;
}

/* a question the scenario writes itself: {id, stage?, tag, q, a, w:[wrong…], show, why} or {kind:'tap', accept} */
const ownQ = (q, shuffle) => q.kind === 'tap' ? { ...q, own: 1, show: q.show || q.accept.filter(x => !x.endsWith('*')) } : { ...q, kind: 'mcq', own: 1, opts: shuffle([q.a, ...q.w]) };

/* ── checking the student's charting for one round ──
   entries: { cellId: value } (tap mode) — gc cells hold {giv, chk} or {code}; plain cells hold text.
   A round: { at:'3@1400', you: initials, rn: preceptor initials, expect: [...] }
     {do:'sign', c:'reg.K.d3.s2'}               — given: your initials + the RN's check, a time within 30 min
     {do:'code', c:'reg.J.d3.s1', code:'D'}     — not given: that code
     {do:'prn', L:'A', dose:['1g'], route:'PO'} — a new PRN record line: date, time, dose, route, your initials + check
     {do:'once', i:1}                            — once-only: date & time of dose, given by you, checked by the RN
     {do:'fluid', i:1}                           — fluids: actual commencing time, commenced by, checked by
     {do:'fluidend', i:1, vol:1000}              — a bag finished: completion time, actual volume
     {do:'reg', name}                            — your line in the Sample Initials register
     {do:'none', c:'prn.B', what, why}           — must NOT be written (e.g. a PRN given too soon)
     {do:'rn', c:'reg.J.d3.s2' | L:'B', …}       — the RN gives it and signs; the student writes nothing there
     {do:'sign', c, dose:['15 mL', …]}           — a variable dose: the dose given goes in the Dose column too
   returns [{ok, part, msg, cells}] — every expectation, then every entry no expectation asked for. */
function checkRound(C, R, entries) {
  const out = [], used = new Set(), at = parseAt(R.at), date = dayDate(C.S, at.day);
  const txt = v => (v == null ? '' : String(v)).trim();
  const near = t => /^\d{4}$/.test(txt(t)) && Math.abs(toMin(txt(t)) - toMin(at.t)) <= 30;
  const res = (ok, msg, cells) => out.push({ ok, msg, cells });
  for (const x of R.expect) {
    if (x.do === 'sign' || x.do === 'code') {
      const [, L, d, s] = /^reg\.([A-Z]{1,2})\.d(\d)\.s(\d)$/.exec(x.c), o = C.reg.find(r => r.L === L), gc = entries[x.c + '.gc'], t = entries[x.c + '.t'];
      const label = `${o.med} · ${dayDate(C.S, +d)} · ${o.slots[+s].t}`;
      used.add(x.c + '.gc'); used.add(x.c + '.t'); used.add(x.c + '.dose');
      if (x.do === 'sign') {
        if (!gc || gc.code || !gc.giv) res(false, `${label}: should be signed as given${gc && gc.code ? ` — you wrote the code ${gc.code}` : ' — the box is empty'}.`, [x.c + '.gc']);
        else if (gc.giv !== R.you) res(false, `${label}: the “given by” initials must be yours (${R.you}).`, [x.c + '.gc']);
        else if (gc.chk !== R.rn) res(false, `${label}: given ✓, but ${gc.chk ? `the check initials (${gc.chk}) should be your RN’s` : 'the check initials are missing'} — a student’s dose carries the RN’s (${R.rn}).`, [x.c + '.gc']);
        else if (!near(t)) res(false, `${label}: signed ✓, but record the actual time given (24-hour clock, within 30 minutes of ${at.t}).`, [x.c + '.t']);
        else if (x.dose && !x.dose.map(q => q.replace(/\s/g, '').toLowerCase()).includes(txt(entries[x.c + '.dose']).replace(/\s/g, '').toLowerCase()))
          res(false, `${label}: signed ✓, but it is a variable dose — write the dose you gave (${x.dose[0]}) in the Dose column.`, [x.c + '.dose']);
        else if (x.dose) res(true, `${label}: given, ${txt(entries[x.c + '.dose'])}, signed ${R.you}/${R.rn} at ${txt(t)}.`, [x.c + '.gc']);
        else res(true, `${label}: given, signed ${R.you}/${R.rn} at ${txt(t)}.`, [x.c + '.gc']);
      } else {
        if (gc && gc.code === x.code) res(true, `${label}: not given — ${x.code} (${CODES[x.code]}).${x.why ? ' ' + x.why : ''}`, [x.c + '.gc']);
        else res(false, `${label}: should be ${x.code} (${CODES[x.code]})${gc ? (gc.code ? ` — you wrote ${gc.code}` : ' — you signed it as given') : ' — the box is empty'}.${x.why ? ' ' + x.why : ''}`, [x.c + '.gc']);
      }
    } else if (x.do === 'prn') {
      const o = C.prn.find(p => p.L === x.L), j = o.rec.length, base = `prn.${x.L}.${j}`;
      ['date', 'time', 'dose', 'route', 'gc'].forEach(f => used.add(`${base}.${f}`));
      const e = f => entries[`${base}.${f}`], gc = e('gc') || {};
      const miss = [];
      if (txt(e('date')) !== date) miss.push(`date ${date}`);
      if (!near(e('time'))) miss.push(`time (~${at.t})`);
      if (!x.dose.map(s => s.replace(/\s/g, '').toLowerCase()).includes(txt(e('dose')).replace(/\s/g, '').toLowerCase())) miss.push(`dose ${x.dose[0]}`);
      if (txt(e('route')).toUpperCase() !== x.route) miss.push(`route ${x.route}`);
      if (gc.giv !== R.you || gc.chk !== R.rn) miss.push(`initials ${R.you}/${R.rn}`);
      res(!miss.length, miss.length ? `${o.med} PRN: the next record line (line ${j + 1}) needs ${miss.join(', ')}.` : `${o.med} PRN: recorded on line ${j + 1} — ${date} ${txt(e('time'))}, ${txt(e('dose'))} ${txt(e('route'))}, ${R.you}/${R.rn}.`, [`${base}.time`]);
    } else if (x.do === 'once') {
      const b = `once.${x.i}`, o = C.once[x.i], gc = entries[b + '.gc'] || {}, dt = txt(entries[b + '.dosedt']);
      used.add(b + '.gc'); used.add(b + '.dosedt');
      const okDt = dt.startsWith(date) && near(dt.slice(date.length).trim());
      const miss = [...(okDt ? [] : [`date & time of dose (${date} ~${at.t})`]), ...(gc.giv === R.you && gc.chk === R.rn ? [] : [`given by ${R.you} / checked by ${R.rn}`])];
      res(!miss.length, miss.length ? `${o.med} once only: needs ${miss.join(' and ')}.` : `${o.med} once only: given ${dt}, ${R.you}/${R.rn}.`, [b + '.dosedt']);
    } else if (x.do === 'fluid') {
      const b = `fl.${x.i}`, f = C.fluids[x.i], gc = entries[b + '.gc'] || {};
      ['astart', 'gc'].forEach(k => used.add(`${b}.${k}`));
      const miss = [...(near(entries[b + '.astart']) ? [] : [`actual commencing time (~${at.t})`]), ...(gc.giv === R.you ? [] : [`commenced by ${R.you}`]), ...(gc.chk === R.rn ? [] : [`checked by ${R.rn}`])];
      res(!miss.length, miss.length ? `${f.fluid}: needs ${miss.join(', ')}.` : `${f.fluid}: started ${txt(entries[b + '.astart'])} by ${R.you}, checked ${R.rn}.`, [b + '.astart']);
    } else if (x.do === 'fluidend') {
      const b = `fl.${x.i}`, f = C.fluids[x.i];
      ['tend', 'avol'].forEach(k => used.add(`${b}.${k}`));
      const vol = txt(entries[b + '.avol']).replace(/\s*mL$/i, '');
      const miss = [...(near(entries[b + '.tend']) ? [] : [`completion time (~${at.t})`]), ...(vol === String(x.vol) ? [] : [`actual volume (${x.vol} mL)`])];
      res(!miss.length, miss.length ? `${f.fluid} (line ${x.i + 1}) has finished: record ${miss.join(' and ')}.` : `${f.fluid}: completed ${txt(entries[b + '.tend'])}, ${x.vol} mL in.`, [b + '.tend']);
    } else if (x.do === 'reg') {
      const i = (C.S.nurses || []).length, b = `siga.${i}`;
      ['name', 'init', 'reg'].forEach(k => used.add(`${b}.${k}`));
      const okI = txt(entries[b + '.init']) === R.you, okN = txt(entries[b + '.name']).length >= 3;
      res(okI && okN, okI && okN ? `Sample Initials register: you are on it (${R.you}).` : `Sample Initials register: add your name & designation and your initials (${R.you}) on the next free line — everyone who signs the chart must.`, [b + '.init']);
    } else if (x.do === 'rn') {
      const pre = x.c ? x.c + '.' : `prn.${x.L}.`, hits = Object.keys(entries).filter(k => k.startsWith(pre) && !used.has(k));
      hits.forEach(k => used.add(k));
      res(!hits.length, hits.length ? `${x.what}: leave it for your RN to sign — ${x.why}` : `${x.what}: left for your RN to sign — ${x.why}`, hits);
    } else if (x.do === 'none') {
      const hits = Object.keys(entries).filter(k => k.startsWith(x.c + '.') && txt(JSON.stringify(entries[k])) !== '' && !used.has(k));
      hits.forEach(k => used.add(k));
      res(!hits.length, hits.length ? `Nothing should be written for ${x.what}: ${x.why}` : `${x.what}: correctly left alone — ${x.why}`, hits.length ? hits : []);
    }
  }
  for (const k of Object.keys(entries)) if (!used.has(k)) res(false, `You wrote in a box this round did not need: ${cellLabel(C, k)}.`, [k]);
  return out;
}

/* a cell described in words, for feedback */
function cellLabel(C, id) {
  let m;
  if ((m = /^reg\.([A-Z]{1,2})\.d(\d)\.s(\d)\.(\w+)$/.exec(id))) { const o = C.reg.find(r => r.L === m[1]); return `Regular ${m[1]}${o ? ' (' + o.med + ')' : ''} · ${dayDate(C.S, +m[2])} · ${o && o.slots[+m[3]] ? o.slots[+m[3]].t : PRINTED[+m[3]]} line`; }
  if ((m = /^prn\.([A-Z])\.(\d+)\.(\w+)$/.exec(id))) { const o = C.prn.find(r => r.L === m[1]); return `PRN ${m[1]}${o ? ' (' + o.med + ')' : ''} · record line ${+m[2] + 1}`; }
  if ((m = /^once\.(\d)\./.exec(id))) return `Once Only order ${+m[1] + 1}`;
  if ((m = /^fl\.(\d+)\./.exec(id))) return `IV fluids line ${+m[1] + 1}`;
  if ((m = /^siga\.(\d+)\./.exec(id))) return `Sample Initials register line ${+m[1] + 1}`;
  return id;
}

/* ── a round's right answer, three ways ── */
const regCell = c => { const m = /^reg\.([A-Z]{1,2})\.d(\d)\.s(\d)$/.exec(c); return m && { L: m[1], d: +m[2], s: +m[3] }; };

/* as tap-mode entries — what a perfect student would have written (the build proves checkRound passes it) */
function modelEntries(C, R) {
  const at = parseAt(R.at), date = dayDate(C.S, at.day), E = {}, gc = { giv: R.you, chk: R.rn };
  for (const x of R.expect) {
    const t = x.t || at.t;
    if (x.do === 'sign') { E[x.c + '.t'] = t; E[x.c + '.gc'] = gc; if (x.dose) E[x.c + '.dose'] = x.dose[0]; }
    else if (x.do === 'code') E[x.c + '.gc'] = { code: x.code };
    else if (x.do === 'prn') { const b = `prn.${x.L}.${C.prn.find(p => p.L === x.L).rec.length}`; Object.assign(E, { [b + '.date']: date, [b + '.time']: t, [b + '.dose']: x.dose[0], [b + '.route']: x.route, [b + '.gc']: gc }); }
    else if (x.do === 'once') { E[`once.${x.i}.dosedt`] = `${date} ${t}`; E[`once.${x.i}.gc`] = gc; }
    else if (x.do === 'fluid') { E[`fl.${x.i}.astart`] = t; E[`fl.${x.i}.gc`] = gc; }
    else if (x.do === 'fluidend') { E[`fl.${x.i}.tend`] = t; E[`fl.${x.i}.avol`] = String(x.vol); }
    else if (x.do === 'reg') { const i = (C.S.nurses || []).length; E[`siga.${i}.name`] = R.name; E[`siga.${i}.init`] = R.you; }
  }
  return E;
}

/* as the scenario after the round — the next round, and the next set of questions, start from a correct chart */
function applyRound(S, R) {
  S = JSON.parse(JSON.stringify(S));
  const at = parseAt(R.at);
  for (const x of R.expect) {

  if (id.endsWith('*')) { const pre = id.slice(0, -1); const out = []; for (const [k, v] of IDX) if (k.startsWith(pre)) out.push({ ...v.cell, page: v.page }); return out; }
  const v = IDX.get(id); return v ? [{ ...v.cell, page: v.page }] : [];
}
const pageOf = id => (cellsFor(id)[0] || {}).page;
function goTo(ids) {
  const pg = ids.map(pageOf).find(Boolean); if (!pg) return;
  if (pg !== PAGE) { PAGE = pg; drawPage(); }
  focusCells(ids);
}

/* ── drawing the chart ── */
function drawPage() {
  const l = L();
  svg.setAttribute('viewBox', `0 0 ${l.w} ${l.h}`); sizeSvg();
  svg.innerHTML = `<g>${l.form}</g><g>${CR.entries(l, C.V, 'en')}</g><g id="gMe"></g><g id="gGh"></g><g id="gInk"></g><path id="live" class="inkp"/><g id="gHl"></g>`;
  drawOverlays(); markTabs();
}
function drawOverlays() {
  if (!svg.querySelector('#gMe')) return;
  const l = L();
  svg.querySelector('#gMe').innerHTML = CR.entries(l, ENT, 'me');
  svg.querySelector('#gGh').innerHTML = GHOST ? CR.entries(l, GHOST, 'gh') : '';
  svg.querySelector('#gInk').innerHTML = STROKES.filter(s => s.page === PAGE).map(s => `<path class="inkp" d="${INK.sketchStrokePath(s)}"/>`).join('');
  let h = '';
  for (const it of HL) for (const id of it.ids) {
    const cs = cellsFor(id).filter(c => c.page === PAGE); if (!cs.length) continue;
    const box = id.endsWith('*') ? [{ x: Math.min(...cs.map(c => c.x)), y: Math.min(...cs.map(c => c.y)), w: Math.max(...cs.map(c => c.x + c.w)) - Math.min(...cs.map(c => c.x)), h: Math.max(...cs.map(c => c.y + c.h)) - Math.min(...cs.map(c => c.y)) }] : cs;
    for (const c of box) h += `<rect class="hl ${it.cls}" x="${c.x - 1}" y="${c.y - 1}" width="${c.w + 2}" height="${c.h + 2}" rx="2"/>`;
  }
  svg.querySelector('#gHl').innerHTML = h;
  markTabs();
}
let toastT = 0;
function toast(html, ms = 3200) { const t = $('#toast'); t.innerHTML = html; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms); }

/* ── the panel ── */
function panel(html) { $('#pbody').innerHTML = html; $('#panel').classList.remove('min'); $('#grab').textContent = '▾ hide'; $('#panel').scrollTop = 0; }
$('#grab').onclick = () => { const m = $('#panel').classList.toggle('min'); $('#grab').textContent = m ? '▴ show the ' + (MODE === 'read' ? 'question' : 'round') : '▾ hide'; };
const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };

/* ── READ: questions made from the chart itself ── */
function newRead(onlyWrong) {
  const k = P().stage, seen = (P().read[k] = P().read[k] || {});
  let qs = shuffle(CE.questions(C, Math.random));
  if (onlyWrong) qs = qs.filter(q => seen[q.id] === 0);
  else qs.sort((a, b) => (seen[a.id] === 1) - (seen[b.id] === 1));       // not yet right first
  RQ = { stage: k, list: qs.slice(0, 12), i: 0, right: 0, done: false, total: CE.questions(C, Math.random).length };
}
function showRead() {
  const k = P().stage, seen = P().read[k] || {}, nRight = Object.values(seen).filter(v => v === 1).length;
  if (RQ.i >= RQ.list.length) {
    const nxt = round();
    panel(`<h3>${RQ.right} of ${RQ.list.length} right</h3>
      <p class="sub">This moment (${esc(nowLabel())}): ${nRight} of ${RQ.total} questions answered right so far.</p>
      <div class="acts"><button class="btn primary" id="rMore">Another ${Math.min(12, RQ.total)}</button>
      ${Object.values(seen).some(v => v === 0) ? '<button class="btn" id="rWrong">Just the ones I missed</button>' : ''}</div>
      ${nxt ? `<div class="fb">Next on the ward: <b>${esc(nxt.title)}</b> — ${esc(CE.parseAt(nxt.at).t)}. <button class="btn primary wide" id="rGo">Chart it ›</button></div>` : '<p class="small">Every round on this chart is done.</p>'}
      ${resetLink()}`);
    on('#rMore', () => { newRead(); showRead(); }); on('#rWrong', () => { newRead(true); showRead(); }); on('#rGo', () => setMode('chart')); wireReset();
    return;
  }
  const q = RQ.list[RQ.i];
  const hand = P().stage === 0 ? `<details class="hand" ${RQ.i === 0 ? 'open' : ''}><summary class="small">Handover</summary><p class="small" style="margin:.3rem 0 .6rem">${esc(SC.story)}</p></details>` : '';
  const head = `${hand}<div class="meta"><span>Read · ${esc(q.tag || '')}</span><span>${RQ.i + 1} / ${RQ.list.length}</span></div><p class="q">${esc(q.q)}</p>`;
  if (q.kind === 'tap') {
    panel(`${head}<div class="tapnote">👆 Tap the box on the chart. The tabs above change the page; pinch or ± to zoom.</div>
      <div class="acts"><button class="btn ghost" id="qSkip">I can’t find it — show me</button></div>`);
    on('#qSkip', () => answerTap(null));
  } else {
    panel(`${head}<div class="opts">${q.opts.map((o, i) => `<button class="opt" data-o="${i}">${esc(o)}</button>`).join('')}</div>`);
    document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => answerMcq(+b.dataset.o));
  }
  HL = []; drawOverlays();
}
function scoreQ(q, ok) { const k = P().stage; (P().read[k] = P().read[k] || {})[q.id] = ok ? 1 : 0; if (ok) RQ.right++; saveProg(); }
function after(q, ok, extra = '') {
  const box = document.createElement('div');
  box.innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '✓ Right.' : '✗ Not quite.'} ${esc(q.why || '')}</div>${extra}
    <div class="acts">${(q.show || []).length ? '<button class="btn" id="qShow">📍 Show me on the chart</button>' : ''}<button class="btn primary" id="qNext">Next ›</button></div>`;
  $('#pbody').appendChild(box);
  on('#qShow', () => { HL = [{ ids: q.show, cls: 'show pulse' }]; goTo(q.show); drawOverlays(); });
  on('#qNext', () => { RQ.i++; showRead(); });
  $('#qNext').scrollIntoView({ block: 'nearest' });
}
function answerMcq(i) {
  const q = RQ.list[RQ.i], ok = q.opts[i] === q.a;
  document.querySelectorAll('[data-o]').forEach(b => { const o = q.opts[+b.dataset.o]; b.disabled = true; if (o === q.a) b.classList.add('ok'); else if (+b.dataset.o === i) b.classList.add('bad'); else b.classList.add('dim'); });
  scoreQ(q, ok); after(q, ok);
}
const accepts = (q, id) => q.accept.some(a => a.endsWith('*') ? id.startsWith(a.slice(0, -1)) : a === id);
function answerTap(cell) {
  const q = RQ.list[RQ.i]; if (RQ.answered === RQ.i) return; RQ.answered = RQ.i;
  const ok = !!cell && accepts(q, cell.id);
  on('#qSkip', null); const sk = $('#qSkip'); if (sk) sk.remove();
  HL = [...(cell ? [{ ids: [cell.id], cls: ok ? 'ok' : 'bad' }] : []), ...(ok ? [] : [{ ids: q.accept, cls: 'show pulse' }])];
  if (!ok) goTo(q.accept);
  drawOverlays(); scoreQ(q, ok);
  after({ ...q, show: ok ? [] : q.accept }, ok, cell && !ok ? `<p class="small">You tapped: ${esc(describe(cell))}</p>` : '');
}

/* what a box is, in words — for a tap outside a question */
function describe(cell) {
  const id = cell.id; let m;
  if ((m = /^(reg|prn)\.([A-Z]{1,2})\.([a-z]+)$/.exec(id)) || (m = /^(reg)\.([A-Z]{1,2})\.(s\d)$/.exec(id))) {
    const o = (m[1] === 'reg' ? C.reg : C.prn).find(x => x.L === m[2]);
    return `${m[1] === 'reg' ? 'Regular' : 'PRN'} ${m[2]}${o ? ' (' + o.med + ')' : ' — no order on this line'} · ${cell.n}`;
  }
  if (/^(reg\.[A-Z]+\.d|prn\.[A-Z]\.\d|once\.|fl\.|siga\.)/.test(id)) return `${CE.cellLabel(C, id)} · ${cell.n}`;
  return cell.n;
}
function valueOf(v) {
  if (v == null) return '';
  if (v.code) return `${v.code} — ${CE.CODES[v.code]}`;
  if (v.giv !== undefined) return `given by ${v.giv || '—'}${v.chk ? ' · checked by ' + v.chk : ''}`;
  if (v.tick) return '✓ ticked'; if (v.circle) return 'circled';
  return String(v);
}

/* ── CHART IT: one round ── */
function showRound() {
  const R = round();
  if (!R) {
    panel(`<h3>Every round is charted ✓</h3><p class="sub">${esc(SC.t)}: ${SC.rounds.length} of ${SC.rounds.length}. ${roundScores()}</p>
      <div class="acts"><button class="btn primary" id="toRead">Read the chart as it is now</button></div>${resetLink()}`);
    on('#toRead', () => setMode('read')); wireReset(); return;
  }
  const prob = meProblem();
  if (prob) {
    panel(`<h3>First, who are you on this chart?</h3><p class="sub">Everyone who signs a chart is in its Sample Initials register.</p>
      <div class="fld"><label><span>Name &amp; designation</span><input class="tx" id="pName" placeholder="e.g. PARKER, Sam · Student Nurse" value="${esc(ME.name)}"></label></div>
      <div class="fld"><label><span>Your initials</span><input class="tx time" id="pInit" maxlength="3" placeholder="SP" value="${esc(ME.init)}"></label></div>
      <p class="warnln" id="pWarn">${ME.name || ME.init ? esc(prob) : ''}</p>
      <div class="fld"><span>How you chart</span><div class="seg" id="pSeg"><button data-in="tap">👆 Tap to fill</button><button data-in="pen">✍️ Handwrite</button></div></div>
      <button class="btn primary wide" id="pGo">Start the round</button>`);
    const seg = () => document.querySelectorAll('#pSeg button').forEach(b => b.classList.toggle('on', b.dataset.in === ME.input));
    document.querySelectorAll('#pSeg button').forEach(b => b.onclick = () => { ME.input = b.dataset.in; saveMe(); seg(); }); seg();
    $('#pInit').oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3); };
    on('#pGo', () => { ME.name = $('#pName').value; ME.init = $('#pInit').value; saveMe(); const p2 = meProblem(); if (p2) { $('#pWarn').textContent = p2; return; } load(P().stage); drawPage(); showRound(); });
    return;
  }
  const at = CE.parseAt(R.at), rn = (C.S.nurses || []).find(n => n.init === R.rn);
  const meta = `<div class="meta"><span>Round ${P().stage + 1} of ${SC.rounds.length}</span><span>${esc(dayLabel(at.day))} · ${at.t}</span></div>`;
  const who = `<div class="youare">You: <b>${esc(ME.name)}</b> (${esc(meInit())}) · Your RN: <b>${esc(rn ? rn.name : R.rn)}</b> (${esc(R.rn)})</div>`;
  const top = `${meta}<h3>${esc(R.title)}</h3>${who}`;
  const brief = `<ul class="brief">${R.brief.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
  if (RS.phase === 'brief') {
    panel(`${top}${brief}<div class="acts"><button class="btn primary" id="rStart">${(R.ask || []).length ? 'First, a question ›' : 'Chart it ›'}</button></div>`);
    on('#rStart', () => { RS.phase = (R.ask || []).length ? 'ask' : 'chart'; RS.askI = 0; setMode('chart'); });
    return;
  }
  if (RS.phase === 'ask') {
    const q = R.ask[RS.askI]; if (!RS.opts || RS.optsFor !== RS.askI) { RS.opts = shuffle([q.a, ...q.w]); RS.optsFor = RS.askI; }
    panel(`${top}<details><summary class="small">The round</summary>${brief}</details><p class="q">${esc(q.q)}</p>
      <div class="opts">${RS.opts.map((o, i) => `<button class="opt" data-a="${i}">${esc(o)}</button>`).join('')}</div>`);
    document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const ok = RS.opts[+b.dataset.a] === q.a;
      document.querySelectorAll('[data-a]').forEach(x => { const o = RS.opts[+x.dataset.a]; x.disabled = true; x.classList.add(o === q.a ? 'ok' : x === b ? 'bad' : 'dim'); });
      const box = document.createElement('div');
      box.innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '✓ Right.' : '✗ Not quite.'} ${esc(q.why || '')}</div><div class="acts">${(q.show || []).length ? '<button class="btn" id="aShow">📍 Show me</button>' : ''}<button class="btn primary" id="aNext">${RS.askI + 1 < R.ask.length ? 'Next ›' : 'Now chart it ›'}</button></div>`;
      $('#pbody').appendChild(box);
      on('#aShow', () => { HL = [{ ids: q.show, cls: 'show pulse' }]; goTo(q.show); drawOverlays(); });
      on('#aNext', () => { HL = []; if (++RS.askI >= R.ask.length) RS.phase = 'chart'; setMode('chart'); });
      $('#aNext').scrollIntoView({ block: 'nearest' });
    });
    return;
  }
  if (RS.phase === 'chart') {
    if (ME.input === 'pen') {
      panel(`${meta}
        <div class="tools"><button class="btn ${TOOL === 'pen' ? 'on' : ''}" id="tPen">✍️ Pen</button><button class="btn ${TOOL === 'erase' ? 'on' : ''}" id="tErase">🧽 Eraser</button><button class="btn" id="tUndo">↶ Undo</button><button class="btn" id="tClear">Clear all</button></div>
        <div class="tools"><span class="small" style="align-self:center">Line</span>${Object.entries(PEN).map(([k, w]) => `<button class="btn ${ME.pen === k ? 'on' : ''}" data-pen="${k}" title="${k} line"><svg width="30" height="12" aria-hidden="true"><path d="M2 8 C 9 2, 16 11, 28 4" fill="none" stroke="currentColor" stroke-width="${(w * 1.6).toFixed(1)}" stroke-linecap="round"/></svg>${k}</button>`).join('')}</div>
        <label class="chk"><input type="checkbox" id="tFinger" ${ME.finger ? 'checked' : ''}> ☝️ My finger writes too (no stylus)</label>
        <details ${STROKES.length ? '' : 'open'}><summary class="small">The round: ${esc(R.title)}</summary>${who}${brief}</details>
        <p class="small">${ME.finger ? 'One finger writes; <b>two fingers</b> move and zoom the chart.' : 'Your pen writes; one finger moves the chart, two fingers zoom.'} The eraser takes out whole strokes. ${STROKES.length} stroke${STROKES.length === 1 ? '' : 's'} so far.</p>
        <div class="acts"><button class="btn primary" id="rCheck">Check my charting</button></div>`);
      on('#tPen', () => { TOOL = 'pen'; showRound(); }); on('#tErase', () => { TOOL = 'erase'; showRound(); });
      document.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => { ME.pen = b.dataset.pen; saveMe(); TOOL = 'pen'; showRound(); });
      $('#tFinger').onchange = e => { ME.finger = e.target.checked; saveMe(); showRound(); };
      on('#tUndo', () => { if (UNDO.length) { STROKES = UNDO.pop(); saveWork(); drawOverlays(); showRound(); } });
      on('#tClear', () => { if (STROKES.length && confirm('Clear all your ink for this round?')) { UNDO.push(STROKES); STROKES = []; saveWork(); drawOverlays(); showRound(); } });
    } else {
      const groups = [...new Set(Object.keys(ENT).map(k => groupOf(k)?.b).filter(Boolean))];
      panel(`${top}<details ${groups.length ? '' : 'open'}><summary class="small">The round</summary>${brief}</details>
        <p class="small">👆 Tap a box on the chart to write in it — find the right page with the tabs.</p>
        ${groups.length ? `<ul class="elist">${groups.map(b => `<li><span>${esc(groupText(b))}</span><button class="btn sm ghost" data-ed="${b}">edit</button><button class="btn sm ghost" data-rm="${b}">✕</button></li>`).join('')}</ul>` : '<p class="small">Nothing written yet.</p>'}
        <div class="acts"><button class="btn primary" id="rCheck">Check my charting</button></div>`);
      document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { clearGroup(b.dataset.rm); showRound(); });
      document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { const id = Object.keys(ENT).find(k => k.startsWith(b.dataset.ed + '.')); goTo([id]); openPicker(IDX.get(id).cell); });
    }
    on('#rCheck', markRound);
    return;
  }
  if (RS.phase === 'marked') showMarked();
}
function roundScores() {
  const r = P().rounds; const xs = Object.keys(r).sort().map(i => `round ${+i + 1}: ${r[i].got}/${r[i].tot}${r[i].mode === 'pen' ? ' ✍️' : ''}`);
  return xs.length ? 'Your marks — ' + xs.join(' · ') + '.' : '';
}
function resetLink() { return `<p class="small" style="margin-top:14px"><button class="btn ghost sm" id="rReset">↺ Start this patient again</button></p>`; }
function wireReset() { on('#rReset', () => { if (!confirm(`Start ${SC.t}’s chart again from the beginning? Your marks for this patient are cleared.`)) return; PROG[SC.id] = { stage: 0, rounds: {}, read: {} }; saveProg(); SV('chart.w.' + SC.id, null); openPatient(SC.id); }); }

/* marking */
function inkedCells() {
  const set = new Set(); let stray = 0;
  for (const s of STROKES) { const id = INK.strokeCell(s, CR.layout(s.page).cells); if (id) set.add(id); else stray++; }
  return { set, stray };
}
function markRound() {
  const R = rctx(round());
  if (ME.input === 'pen') {
    const { set, stray } = inkedCells();
    RS.res = CE.checkInk(C, R, set); RS.stray = stray; RS.key = CE.roundKey(C, R).filter(k => !k.none); RS.self = {}; RS.mode = 'pen';
    GHOST = CE.modelEntries(C, R);
  } else { RS.res = CE.checkRound(C, R, ENT); RS.mode = 'tap'; GHOST = null; }
  RS.phase = 'marked';
  HL = RS.res.map(r => ({ ids: r.cells || [], cls: r.ok ? 'ok' : 'bad' }));
  const first = RS.res.find(r => !r.ok && (r.cells || []).length);
  if (first) goTo(first.cells);
  drawOverlays(); showRound();
}
function showMarked() {
  const R = round(), res = RS.res, okN = res.filter(r => r.ok).length;
  const list = `<ul class="res">${res.map((r, i) => `<li class="${r.ok ? 'ok' : ''}" data-r="${i}"><i>${r.ok ? '✓' : '✗'}</i><span>${esc(r.msg)}</span></li>`).join('')}</ul>`;
  let body;
  if (RS.mode === 'pen') {
    const sm = RS.key.map((k, i) => `<div class="self"><b>${esc(k.label)}</b><div class="mdl">${esc(k.model)}</div>
      <div class="chipset"><button class="chip ${RS.self[i] === 1 ? 'on' : ''}" data-s="${i}" data-v="1">✓ Mine says that</button><button class="chip ${RS.self[i] === 0 ? 'on no' : ''}" data-s="${i}" data-v="0">✗ It doesn’t</button></div></div>`).join('');
    const selfDone = Object.keys(RS.self).length, selfOk = Object.values(RS.self).filter(v => v === 1).length;
    body = `<p class="score">Where you wrote: ${okN}/${res.length}</p>
      <p class="small">Marked for you: which boxes your ink landed in${RS.stray ? ` (${RS.stray} stroke${RS.stray > 1 ? 's' : ''} outside every box, not counted)` : ''}. Tap a line to see it on the chart.</p>${list}
      <h3 style="margin-top:14px">What you wrote — you mark it</h3>
      <p class="small">The right entry is drawn in <b style="color:#067a52">green</b> beside your ink. Does yours say the same?</p>${sm}
      <p class="score">${selfDone < RS.key.length ? `${RS.key.length - selfDone} left to mark` : `What you wrote: ${selfOk}/${RS.key.length} (self-marked)`}</p>`;
  } else body = `<p class="score">${okN}/${res.length}</p><p class="small">Tap a line to see it on the chart.</p>${list}`;
  const selfLeft = RS.mode === 'pen' && Object.keys(RS.self).length < RS.key.length;
  panel(`<div class="meta"><span>Round ${P().stage + 1} of ${SC.rounds.length} · marked</span><span>${esc(R.title)}</span></div>${body}
    <div class="acts"><button class="btn" id="mGhost">${GHOST ? 'Hide' : 'Show'} the right answer</button><button class="btn" id="mRedo">↺ Redo this round</button></div>
    <button class="btn primary wide" id="mNext" ${selfLeft ? 'disabled' : ''}>${selfLeft ? 'Mark what you wrote first' : 'Next ›'}</button>
    <p class="small">Next writes the right answer into the chart, so the next round starts from a correct chart.</p>`);
  document.querySelectorAll('[data-r]').forEach(li => li.onclick = () => { const r = res[+li.dataset.r]; if ((r.cells || []).length) { HL = [{ ids: r.cells, cls: (r.ok ? 'ok' : 'bad') + ' pulse' }]; goTo(r.cells); drawOverlays(); } });
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { RS.self[+b.dataset.s] = +b.dataset.v; showMarked(); });
  on('#mGhost', () => { GHOST = GHOST ? null : CE.modelEntries(C, rctx(round())); drawOverlays(); showMarked(); });
  on('#mRedo', () => { RS.phase = 'chart'; HL = []; GHOST = null; drawOverlays(); showRound(); $('#vp').classList.toggle('pen', penOn()); });
  on('#mNext', commitRound);
}
function commitRound() {
  const okN = RS.res.filter(r => r.ok).length, selfOk = RS.mode === 'pen' ? Object.values(RS.self).filter(v => v === 1).length : 0;
  const tot = RS.res.length + (RS.mode === 'pen' ? RS.key.length : 0);
  const k = P().stage; P().rounds[k] = { got: okN + selfOk, tot, mode: RS.mode };
  P().stage = k + 1; saveProg();
  ENT = {}; STROKES = []; UNDO = []; GHOST = null; HL = []; SV('chart.w.' + SC.id, null);
  load(P().stage); drawPage(); RQ = null; RS = null;
  toast(`The chart has moved on to ${esc(C.now.t)}. The right entries are written in.`);
  setMode('read');
}

/* ── tap-to-fill: the picker ── */
function groupOf(id) {
  let m;
  if ((m = /^(reg\.[A-Z]{1,2}\.d\d\.s\d)\.(t|dose|gc)$/.exec(id))) return { k: 'adm', b: m[1], f: ['t', 'dose', 'gc'] };
  if ((m = /^(prn\.[A-H]\.\d+)\.(date|time|dose|route|gc)$/.exec(id))) return { k: 'prn', b: m[1], f: ['date', 'time', 'dose', 'route', 'gc'] };
  if ((m = /^(once\.\d)\.(dosedt|gc|tstart|tend)$/.exec(id))) return { k: 'once', b: m[1], f: ['dosedt', 'gc'] };
  if ((m = /^(fl\.\d+)\.(astart|gc|tend|avol)$/.exec(id))) return { k: 'fl', b: m[1], f: ['astart', 'gc', 'tend', 'avol'] };
  if ((m = /^(siga\.\d+)\.(name|init|reg)$/.exec(id))) return { k: 'reg', b: m[1], f: ['name', 'init', 'reg'] };
  return null;
}
function groupText(b) {
  const g = groupOf(Object.keys(ENT).find(k => k.startsWith(b + '.')) || '') || { f: [] };
  const vals = g.f.map(f => ENT[b + '.' + f]).filter(v => v != null && v !== '').map(valueOf);
