law","tier":0,"t":"Code of Conduct, Code of Ethics values and ethical issues in pharmacology","flag":"tape SKIP","done":"Say which of the four key documents is law, which are enforceable standards and which is a guideline; give a Code of Conduct principle with a medicines example (P2 excipients · P4 double-check · P5 no information over the phone · P7 report errors honestly); define veracity, autonomy, rangatiratanga, beneficence, non-maleficence, justice, confidentiality and fidelity, each with an example; say why PRN and believed-or-not pain are ethical problems; say why concealing an error is worse than making it (the Nurse D case).","ask":"Definition plus example — “define veracity and give an example”. The Escape Room (Lock 3) asks for a Code of Conduct principle with an example of how practice could improve; Lock 4 is a crossword of the Māori and Western values.","cap":"She worked through only veracity, rangatiratanga and autonomy and set the rest as reading (slides 64–83), and ran none of the scenarios (46–52, 84–88). Slide 90, the four-document comparison table, is the best single revision page in the deck. You will not be asked to recite all sixteen values; you may be asked to define any one.","src":"Deck 09 slides 21–27 and 53–90 · her 16 Sep lecture [10:14–21:02] and [36:59–1:03:38] · Escape Room answer sheet, Locks 3–4","n":3,"all":3,"pts":6,"qz":1,"saq":3,"na":3},{"id":"devmkt","sys":"law","tier":0,"t":"Drug development, clinical trials and medicines advertising","flag":"tape SD","done":"Give the five stages from discovery to post-market monitoring; give the purpose of clinical trial Phases 1–4 (safe? · works? · at scale? · keep watching); name the three bodies that approve a trial in NZ (Medsafe, SCOTT, HDEC) and what each checks; define informed consent in a trial; say when a placebo is acceptable and what randomisation costs a participant; name the five kinds of medicines advertising; say why NZ is unusual; say how a nurse can advertise by accident and how to avoid it (generic names, balanced facts).","ask":"Definition plus example — “what is a reminder advertisement?”, “when is a placebo ethically acceptable?”.","cap":"Never lectured: on 16 Sep she ran out of time and handed it over as a self-directed online package — still examinable. Participant numbers and progression percentages are the kind of detail a 3–4 line answer has no room for; know what each phase is FOR. Thalidomide is the one historical example she told herself.","src":"Deck 13 (33 slides) · her 16 Sep lecture [59:31] and [1:00:26]","n":4,"all":4,"pts":8,"qz":2,"saq":4,"na":3},{"id":"concepts1","sys":"found","tier":1,"t":"Core terms — contraindication, precaution, interaction, drug names, Medsafe and PHARMAC","flag":"tape LO1","done":"Define pharmacology and a medication; define contraindication, precaution and medication interaction, each with an example; give a medicine’s three names and say why generic prescribing is preferred (and its two exceptions); define bioequivalence; tell Medsafe (regulates) from PHARMAC (funds); say what a nurse must know before giving any medicine.","ask":"Her own worked example of an exam short answer comes from here: “what is the meaning of contraindication, and give an example” [1:05:06]. “Mostly definitions, because it’s an introductory paper.”","cap":"Generic-name suffixes are in the deck, but deep drug-naming detail is not her exam. Not tested, she said on 20 Oct: the history of pharmacology and where a drug’s ingredients come from — “that was just getting you going at the beginning” [0:35:32–0:36:04]. Keep a glossary of the definitions, “like when you learn a foreign language” [0:37:47], and learn HER definition: answers in other words take longer to mark [1:42:22].","src":"Deck 01 Pharmacology Concepts (1) · her 16 Sep lecture [1:05:06] · her 20 Oct revision session · her Formative mini-exam 1, Q13–16","n":6,"all":6,"pts":9,"qz":2,"saq":6,"na":2},{"id":"drugs","sys":"found","tier":0,"t":"The drugs and drug classes she named on 20 Oct","flag":"tape","done":"For each, say its class, what it is for, what you assess before giving it and what you monitor while the patient is on it: paracetamol (analgesic — and other products that contain it, such as cold-and-flu remedies) · salbutamol (bronchodilator) · aspirin (antiplatelet) with the anticoagulants warfarin and heparin · GTN, glyceryl trinitrate (a nitrate, anti-anginal; sublingual because it is fast and stomach acid destroys it) · the penicillin family and amoxicillin (antimicrobials — know why she says antimicrobials, not antibiotics) · morphine (opioid; six or seven formulations).","ask":"“Very much applied kind of nursing stuff” — what to assess before you give the drug, what to monitor [0:25:14–0:25:39]. Her exam-prep slide asks for “a simple understanding” of paracetamol and salbutamol. Her formatives name amoxicillin (storage and giving at home), paracetamol (an unusually high dose) and adrenaline (a volume).","cap":"“Promise me you won’t” spend half a day on GTN — “there might be one question on GTN” [0:24:41]; a student once spent a whole day on aspirin. “It’s not a pharmacy exam” [0:25:05]. The tool’s questions here go only as far as a slide does (route, class, the interactions the Pharmacodynamics deck names); for what to assess and monitor drug by drug, the intro-pharm hub’s drug-class cards (MoA · Use · Adverse · Nursing) are the place to read them.","src":"Her 20 Oct revision session [0:19:23–0:25:39] · her exam-prep slides, slide 10","n":7,"all":7,"pts":8,"qz":1,"saq":1,"na":7},{"id":"pk1","sys":"pkpd","tier":1,"t":"Pharmacokinetics 1 — absorption, bioavailability, first pass, distribution","flag":"LO1","done":"Define pharmacokinetics and name ADME; define absorption and say which route needs none; list what changes absorption (membrane, lipid solubility, blood flow, food); define bioavailability (IV = 100%) and the hepatic first-pass effect, with the 100 mg → 20 mg example; explain plasma protein binding and what competition for binding sites does; say what the blood–brain and placental barriers keep out.","ask":"Definition plus example — “define bioavailability and give an example”. LO1 (“apply pharmacological principles”) is assessed in the exam and this is its centre.","cap":"The lecture’s examples of drugs concentrating in particular tissues are named drugs — know the principle, not the drug. No calculations here beyond the first-pass arithmetic.","src":"Deck 04 Pharmacokinetics (1)","n":4,"all":4,"pts":9,"qz":3,"saq":3,"na":2},{"id":"pk2","sys":"pkpd","tier":1,"t":"Pharmacokinetics 2 — metabolism, excretion, half-life, therapeutic range","flag":"LO1","done":"Define metabolism (the liver, enzymes, usually to an inactive water-soluble metabolite); contrast enzyme inducers and inhibitors and what each does to dosing; name the routes that avoid first pass; separate excretion, elimination and clearance; define half-life (about five to clear, three to five to reach steady state); define the therapeutic range and therapeutic drug monitoring (peak and trough).","ask":"Definition plus example — “define half-life and give an example of how it is used”.","cap":"Summarising one named drug under all four ADME headings is a specific-drug question — drillable here, never in a mock, and not her exam.","src":"Deck 04 Pharmacokinetics (2)","n":4,"all":4,"pts":6,"qz":3,"saq":2,"na":2},{"id":"pd","sys":"pkpd","tier":1,"t":"Pharmacodynamics and adverse effects","flag":"LO1 LO4","done":"Define pharmacodynamics; define affinity, efficacy and potency; tell an agonist from an antagonist with lock and key; explain receptor up- and down-regulation; describe a dose–response relationship and the therapeutic range (MEC to MTC); define an adverse effect against an adverse drug event; list person- and drug-related risk factors; say what CARM is and who may report.","ask":"Definition plus example — “distinguish an agonist from an antagonist and give an example of each”. LO4 (mechanisms of action, therapeutic uses, side effects) is assessed here as principle, not drug by drug.","cap":"Every lecture example of a drug acting on a receptor, enzyme, channel or carrier is a named drug — use one as YOUR example if it helps. On 20 Oct she named the classes to know (row “The drugs and drug classes she named”); a deep drug-by-drug question is still not her exam.","src":"Deck 04 Pharmacodynamics","n":7,"all":7,"pts":8,"qz":4,"saq":1,"na":1},{"id":"educ","sys":"admin","tier":1,"t":"Medication errors and patient education (Ask · Build · Check)","flag":"LO3","done":"Define a medication error and separate it from an adverse effect; give ways to prevent errors and the steps for managing and reporting one; say what concealment costs; run Ask–Build–Check for a medicine; adapt medication education for a child, a teenager and an older adult; tie an education example to a Te Tiriti principle.","ask":"Definition plus example — “define a medication error and give an example”. LO3 (medication education for health literacy and self-management) is assessed in the exam and this lecture is the only place it is taught.","cap":"Ask–Build–Check is the same model as in the INP paper’s Health Literacy lecture — learn it once. Listing all five Te Tiriti principles with meanings is a five-mark list question: drillable, not her format.","src":"Deck 05 Medication Administration and Patient Education (2)","n":6,"all":6,"pts":11,"qz":3,"saq":4,"na":1},{"id":"concepts2","sys":"found","tier":0,"t":"Classification, routes, formulations and abbreviations","flag":"tape LO1","done":"Name the ways medicines are classified; tell a local from a systemic effect; compare routes (oral, IV, IM, subcutaneous, inhaled, topical, rectal) for speed and drawbacks; define dissolution, excipient and enteric coating and say why a coated tablet is not crushed; read the common prescription abbreviations (prn, bd, tds, qid, mane, nocte, stat, PO, SL, SC, IM, IV, PR, NKDA).","ask":"Abbreviations: “you must, must, must know your abbreviations … you’ve got to leave this course knowing how to read a prescription” [1:18:39]. Expect a prescription to interpret — drug, route, time, frequency — not “what does PO mean”, which is “too easy” [0:43:27]. Four of her formative questions are exactly that (TDS · BD prn · QID PR · EC). Why formulations differ — GTN sublingual, morphine in six or seven forms — was her worked example [0:44:37–0:47:27]. Chart Speak drills every abbreviation.","cap":"An eleven-abbreviation recall list is a five-mark list question — drillable, never dealt into a mock. The nurse cannot legally change a route: check with the prescriber [0:48:09].","src":"Deck 01 Pharmacology Concepts (2)","n":30,"all":30,"pts":31,"qz":5,"saq":1,"na":23},{"id":"admin","sys":"admin","tier":2,"t":"Safe medication administration — the rights and checks, the medication chart","flag":"","done":"Give the rights and checks as taught in this course (8 rights + 2 checks — Med Admin deck (1) slide 23) and what each asks of you; say how identity is checked; say what to do when no route is written; act correctly on a refusal; explain right indication and why PRN needs a nursing assessment; state the documentation rules; say who may prescribe.","ask":"Definition plus example — “what does right indication require? give an example”.","cap":"The outcome this belongs to (LO2) is assessed by the practical and the calculations test, not listed for the exam — but “all modules” are examinable. The MoH aged-care guide’s shorter “5 rights” is a different list: use the course’s.","src":"Deck 05 Medication Administration and Patient Education (1)","n":6,"all":6,"pts":7,"qz":3,"saq":2,"na":0},{"id":"elderly","sys":"life","tier":2,"t":"Medicines in the older adult and polypharmacy","flag":"LO1","done":"Define an older person (65+, young-old, old-old, frail); say how ageing changes absorption, distribution, metabolism and renal excretion and what that does to dosing; name the common adverse effects in older adults; define polypharmacy (five or more), why it happens, its risks and how it is managed; say when a tablet may be crushed; tell errors of commission from omission.","ask":"Definition plus example — “define polypharmacy and give an example of a risk it raises”.","cap":"The Beers Criteria examples and the prevalence figures are named drugs and statistics — not 3–4 line material.","src":"Deck 06a Medication in the Elderly & Polypharmacy","n":3,"all":3,"pts":4,"qz":2,"saq":1,"na":1},{"id":"lifespan","sys":"life","tier":2,"t":"Medicines in pregnancy, lactation and children","flag":"LO1","done":"Say how medicines reach the foetus and when it is most vulnerable; define a teratogen and the highest-risk period; say what the pregnancy categories A and X mean; give the three things that decide transfer into breast milk and the guiding principle; say why children are not small adults; describe neonatal and childhood pharmacokinetics in a sentence each; give the age bands.","ask":"Definition plus example — “define a teratogen and give an example”.","cap":"The table of named teratogens and the substance-by-substance effects on the foetus are specific-drug content — drillable here, not her exam.","src":"Deck 07 Medications in Pregnancy, Lactation and Children","n":7,"all":7,"pts":10,"qz":4,"saq":5,"na":2},{"id":"allergy","sys":"imm","tier":0,"t":"Drug allergy, anaphylaxis, immunity and vaccines (Module 8)","flag":"tape LO4","done":"Define an allergic reaction (an exaggerated immune response to a foreign substance — the drug seen as an antigen) and name common allergens; give the signs of a drug allergy by body system, and tell anaphylaxis (any ONE airway, breathing or circulation sign) from a mild-to-moderate reaction; explain the swelling and redness as excessive acute inflammation (histamine, capillary permeability); tell a Type I from a Type IV reaction with an example; say how a nurse prevents an allergic exposure (ask at every encounter, bracelet, suspect substances) and which medicine groups treat a reaction; give the steps of the ASCIA plan in order, including positioning and its exceptions. Define antigen and immunity; tell innate from adaptive immunity, vaccination from immunisation, and active from passive immunity (natural and artificial, an example of each); define herd immunity and who it protects; tell live from non-live vaccines and who must not have a live one; say what the NZ schedule is for with examples of its diseases; give the common, timed and rare serious reactions after a vaccine; say why a fever delays a vaccination; say what CARM does.","ask":"“I’ve really pushed that you must, must, must know the signs of drug allergy” [1:20:50] — and the word antigen, “the basis of all vaccination, immunisation” [1:21:15]. Her formatives ask what a drug allergy is (an antigen and an immune response), two signs of anaphylaxis to monitor after a vaccination, herd immunity, and the route for an influenza vaccine (IM, deltoid). Otherwise a definition plus an example — “define herd immunity and give an example of who it protects”.","cap":"The schedule card’s brand names and exact dose windows are reading, not 3–4 line material — know a disease or two at each stage and that rotavirus is the oral one. The four hypersensitivity types are drilled as multi-choice; a four-type list is not her format. In the Immunology deck, MHC classes, T-cell types, antibody genetics and the HIV-resistance excerpt are depth beyond a nursing exam; the ASCIA plan’s six steps stay a list question, drillable but not her shape.","src":"Module 8 decks: Allergic Reactions (8 slides) · Vaccinations & Recognising Allergy (15 slides; ASCIA plan and the Aug 2025 schedule card) · Immunology for Nurses (Emma Lambert, 39 slides) · ASCIA Action Plan for Anaphylaxis (Canvas) · her 20 Oct revision session · her Formative mini-exams 1–3","n":14,"all":14,"pts":22,"qz":4,"saq":8,"na":10},{"id":"cam","sys":"cam","tier":2,"t":"Rongoā Māori (Module 10, part 1)","flag":"","done":"Define rongoā Māori and its three parts (mirimiri, karakia, rongoā rākau); say who is responsible for a traditional medicine (the tohunga or practitioner) and what a nurse does when whānau ask about one; give the five things to consider alongside prescribed medicines; tell the biomedical from the wholistic view; define integrated medicine; say what Tikanga ā Rongoā is; say why health is a taonga.","ask":"Definition plus example. A guest lecture (15 Sep), so how Joan will ask it is unknown; the NZNO guideline paragraph quoted on slide 9 is the most examinable thing in the deck.","cap":"The plant-by-plant slides are the specific-drug problem in another form — no question here asks about a named plant. The presenter’s own prescribing model (astrology, elements) is described as his own.","src":"Rongoā 2026 deck (guest lecture, 15 Sep)","n":2,"all":2,"pts":4,"qz":1,"saq":2,"na":2},{"id":"socio-cam","sys":"cam","tier":2,"t":"Socioeconomic factors and complementary/alternative medicines (Module 10, part 2)","flag":"SD","done":"Tell conventional, alternative and complementary medicine apart: conventional is the Western medicine our health system is built on; ALTERNATIVE is used INSTEAD of it; COMPLEMENTARY — with an E — alongside it. Her hook: carrot juice instead of chemo is alternative; carrot juice with chemo is complementary [1:30:29–1:32:23].","ask":"Both of her formative questions here are that distinction. “If you didn’t [do the session], you won’t know what these terms mean” [1:30:43].","cap":"A self-directed online session (14 Oct); its Canvas material is not in this tool yet, so the row is her two formative questions and nothing of the tool’s.","src":"Her 20 Oct revision session · her Formative mini-exams 1 and 2","n":2,"all":2,"pts":2,"qz":2,"saq":0,"na":0},{"id":"tox","sys":"tox","tier":2,"t":"Licit and illicit drugs and toxicology (Module 9)","flag":"SD","done":"Define the seven terms and tell them apart — licit, illicit, misuse, abuse, dependence, addiction, tolerance: ADDICTION is compulsive use with craving, loss of control and use despite harm; DEPENDENCE is withdrawal symptoms if a drug is stopped abruptly — and “medical dependence” (an inhaler every day, insulin) is not addiction; TOLERANCE needs more for the same effect. Then: the four groups of risk factors; checking an interaction in the NZ Formulary; where to refer (CADS, Te Ātea Marinō, Tupu, Altered High); acute and chronic poisoning, poisonous and venomous, when to call the Poisons Centre (0800 764 766); what an antidote does — naloxone (an opioid antagonist), NAC (paracetamol).","ask":"Her announcement: “Note key words and definitions eg addiction, dependence, as the L/O for this session will be tested in the Exam.” Her formative Q4 (mini-exam 1) and Q5 (mini-exam 3) are exactly this; mini-exam 1’s document keys Q4 as C, and she corrected it in class to B [1:48:07–1:50:15]. Her rule on the deck (slide 3): a slide with Pusheen the cat is tested on the concept, not its statistics or finer details.","cap":"Self-directed, Wed 21 Oct (the lecturers were on strike [0:30:35–0:31:41]); the deck went up on Canvas that afternoon and was never lectured. The Pusheen slides — the withdrawal symptom list, the eleven disorder criteria and their counts, stimulant or depressant, the slang, the drug-combination chart and every statistic — are asked here as a concept only.","src":"Deck “Licit and Illicit Drugs” (41 slides) · her 20 Oct revision session · her Formative mini-exams 1 and 3","n":11,"all":11,"pts":16,"qz":4,"saq":5,"na":9},{"id":"calcs","sys":"calc","tier":3,"t":"Medication calculations","flag":"","done":"State the dose formula and the drip-rate formula; convert units; work a tablet, a liquid, a weight-based and a drip-rate question; apply the course’s rounding rules; spot a red herring.","ask":"“A few popped into” the final, “not going to be hard ones”, multi-choice, no working shown [0:16:49–0:17:18, 0:25:40]; bring a simple calculator. Her formatives have one per paper — a weight-based dose, tablets from grams, a mL from mg/kg — and a 1-mark adrenaline volume as a short answer. Read what is asked: “it’s just the milligrams” [1:36:17].","cap":"Calculations also have their own test (15 out of 15 to pass, with resits). Worked calculations of the tool’s are never dealt into the written section of a mock.","src":"Deck 02 Medication Calculations","n":6,"all":6,"pts":6,"qz":4,"saq":1,"na":2}],"helpline":{},"held":[],"meta":{"id":"pharm-final","prefix":"phf.","title":"Pharm Final · Paper Sim","h1":"Pharm Final exam · Paper Sim","tool":{"kick":"Intro to Pharmacology · 722.544","name":"Pharm Final exam","sub":"30 multi-choice + 11 short answers · 80 min","icon":"💊","hue":"#9333ea"},"short":"Pharm Paper Sim","hub":"ph/exam","paper":"Introduction to Pharmacology","bankOf":"this tool’s","who":"Joan","aiCtx":"I’m a nursing student in New Zealand (BN2) sitting the final exam for Introduction to Pharmacology: 30 multi-choice and 11 short answers (1–4 marks each) under three clinical scenarios, 80 minutes. My lecturer said a short answer is a definition plus an example, the questions are applied and nurse-focused (what to assess before giving a drug, what to monitor), there will be a few questions on specific drug classes, and a few easy calculations.","sitting":{"what":"the Pharmacology final","date":"2026-11-05","when":"Thu 5 Nov, a morning or an afternoon sitting (your group not advised yet), on MIT computers in the ECHO exam software","cohortClose":null},"shape":{"closed":30,"saq":11,"saqMarks":20,"minutes":80,"mini":12},"shapeNote":"The real paper is <b>80 min · 41 questions · 50 marks: 30 multi-choice (1 mark each) + 11 short answers worth 1–4 marks (20 marks)</b>, the short answers grouped under three clinical scenarios — her exam-prep slides, and Joan in class on 20 Oct. (Once that morning she said “there are 60”; her slide and her own count four minutes later both say 41.) The full mock deals 11 written questions up to 20 marks; it does not yet group them into three scenarios.","saqHint":"one point each. Joan (16 Sep): <b>a definition plus an example</b>; on 20 Oct: read what it is worth and what it asks — a 1-mark answer can be a few words, a 4-mark one a short list; partial marks are given","sys":{"found":"Foundations (Module 1)","calc":"Calculations (Module 2)","pkpd":"Pharmacokinetics & dynamics (Modules 3–4)","admin":"Administration & education (Module 5)","life":"Across the lifespan (Module 6)","law":"Legal, ethical & development (Module 7)","imm":"Allergy, anaphylaxis & vaccines (Module 8)","tox":"Licit & illicit drugs (Module 9)","cam":"Rongoā & CAM (Module 10)"},"sysShort":{"found":"Foundations","calc":"Calcs","pkpd":"PK/PD","admin":"Admin","life":"Lifespan","law":"Legal","imm":"Allergy","tox":"Licit/illicit","cam":"Rongoā"},"hue":{"found":210,"calc":38,"pkpd":268,"admin":158,"life":28,"law":340,"imm":190,"tox":0,"cam":120},"quizOrder":["form1","form2","form3","joan-abbr","joan-drugs","joan-found","joan-pkpd","joan-admin","joan-life","joan-law","joan-ethics","joan-devmkt","joan-imm","joan-tox","tox","joan-cam","joan-calc"],"playlist":null,"more":[{"sec":"Learn","href":"rep.html","ic":"🧠","t":"Write the short answers","s":"Joan’s own 18 short answers, verbatim, as key words that come back over the days"},{"sec":"Learn","href":"cards.html","ic":"🗂","t":"Flashcards","s":"Anki, stripped down: the must-know abbreviations and the tool’s short answers","hl":{"c":"#9333ea","c2":"#c084fc","kick":"Spaced repetition","go":"Study ›"}},{"sec":"Read a med chart","href":"terms.html","ic":"💬","key":"terms","t":"Chart Speak","s":"OD, BD, TDS, PRN, stat… every med-chart term, drilled"},{"sec":"Read a med chart","href":"chart.html","ic":"📋","key":"chart","t":"Chart Sim","s":"The real NZ 8-day chart: read it, then chart the med round — tap or handwrite","hl":{"c":"#ea580c","c2":"#fbbf24","kick":"Hands-on","go":"Try it ›"}}],"banner":"<b>Joan’s own questions come first.</b> Her three Formative mini-exams — 36 multi-choice and 18 short answers with her answer key and model answers, published 20 Oct — are the first rows, verbatim, and every practice run and mock deals them before anything else. <b>The tool’s questions are a small set</b> on what hers do not already ask: the 22 abbreviations she said you must know, the drugs she named on 20 Oct, and short answers in the format she described. Each names the slide or lecture moment its answer comes from and is tagged “tool’s question”.","pickIntro":"The first three rows are <b>Joan’s own Formative mini-exams</b> — her questions, her key, her model answers. Below them, the tool’s questions: the must-know abbreviations, the drugs she named on 20 Oct, then short answers <b>in the format she described</b> (a definition plus an example), one row per topic.","help":{"her":"<b>54 questions are Joan’s own</b> — her three Formative mini-exams (12 multi-choice + 5–7 short answers each), published with answers on 20 Oct: stems, options, key, marks and model answers exactly as in her answers documents, typos and all. The tool changes two things and says so on the card: mini-exam 1 Q4 is keyed B, not the document’s C, because she corrected it in class on 20 Oct; and her working, which leaked into mini-exam 3 Q8’s question, is moved into its explanation. Any explanation under one of her questions is the tool’s; mini-exam 1’s are written from her feedback in class and cite the recording by timestamp. Where her model answer lists alternatives (“one piece of advice…”), any one earns the marks. She sits them in class one per revision session, so you may want to save mini-exams 2 and 3 for then. ","what":"A practice paper for <b>Introduction to Pharmacology</b> in the same format as the other Paper Sims: drill a topic, learn with the answer shown as you go, or sit a mock in the real paper’s shape. The final is <b>Thu 5 Nov 2026, a morning or an afternoon sitting (your group not advised yet) · 80 min · 41 questions, 50 marks: 30 multi-choice + 11 short answers worth 1–4 marks under three clinical scenarios · 50% of the paper</b>. It is sat <b>on MIT computers in the ECHO exam software</b> (computer suites, level 3) — no laptop; one question on screen with the time left, and no way to leave the exam screen. <b>Go to your ECHO practice session (27 or 28 Oct — your group is in Announcements)</b>. Bring a simple calculator and a pen; paper is supplied — do not bring your own. A problem in the exam: put your hand up and talk to no one. Joan on 20 Oct: the questions are applied — “if the patient says this, what is your best response?” — with a few on specific drug classes and a few easy calculations, no working shown.","noBank":"<b>Nothing here was captured from a Canvas quiz, because there is none on pharmacology:</b> the paper’s only Canvas quizzes are medication-calculation practice tests, which have their own assessment. Joan’s three Formative mini-exams are Word documents on a Canvas page, transcribed verbatim.","noMockClosed":"<b>The 22 must-know abbreviations</b> (the course’s Must-Know list, plus Q6H, EC, SR and CR from her 20 Oct session) are drilled in Learn as you go and Pick my rep, but a mock deals none: the paper will hold one or two, and 22 would swamp its mix. Her own TDS question stays in the mock. ","authored":"<b>The tool’s questions</b> (27 Oct: cut from about 470 to what her 54 do not already ask, then the 22 abbreviations added). <b>33 short answers in the format Joan described on 16 Sep — a definition plus an example, 2–3 marks</b> (the rows named “In Joan’s format”), from her Escape Room answer sheet, her recorded Legal &amp; Ethical lecture (cited by timestamp), the Drug Development deck, the Rongoā Māori deck and the Module 1–9 decks. <b>Nine questions on the drugs she named on 20 Oct</b> — paracetamol, salbutamol, aspirin with warfarin, GTN, the penicillins, morphine — and two easy calculations, in the shape of her mini-exams, each from the slide it names. And eight multi-choice on allergy, vaccines and toxicology. The questions and model answers are the tool’s, not hers. ","held":"<b>Every module has questions</b>: Joan’s formatives cover all of them lightly, and the tool’s set fills in what they do not ask. Her exam-prep deck says questions come from every module except the first, the introduction. Revision sessions with Formative mini-exams: the first was Tue 20 Oct (mini-exam 1); 2 and 3 are in the next sessions. PASS sessions with Adrienne also run revision for this paper."},"focusCopy":{"intro":"One row per topic. Open a row for what you must be able to DO, the shape Joan described (a definition plus an example; applied, “what is your best response?”), and where it stops. Tick it when you can do it cold. A row that holds any of <b>her own formative questions</b> says how many of its questions are the tool’s. Her questions are counted on every row; the rest are the tool’s small set on what hers do not ask.","how":"<b>The question counts on these rows do NOT rank anything</b> — about half the questions here are this tool’s, so a big number means the tool filled a gap, not Joan’s emphasis. What ranks the rows is her own pointing, then the syllabus. <b>Top band:</b> what she said on tape — on Wed 16 Sep, after the legal and ethical material, “so these will be assessed in your exam, okay?” [1:02:38], and Drug Development handed over as an online package “you’re going to do for me” [59:31]; and in her first revision session, Tue 20 Oct: “you must, must, must know your abbreviations” [1:18:39], “you must, must, must know the signs of drug allergy” [1:20:50], and the drug classes she listed [0:19:23–0:25:14]. The syllabus maps the exam to learning outcomes 1, 3 and 4 and leaves out the legal-standards outcome; the tape is later and more specific, so the tape wins. <b>Second band:</b> topics an assessed learning outcome names (LO1 principles, LO3 medication education, LO4 mechanisms and effects) — her one worked example of an exam question, “the meaning of contraindication, and give an example”, comes from the first of them. <b>Third:</b> taught and examinable, named by no assessed outcome. <b>Last:</b> calculations, which have their own test. Each revision session re-ranks this list. Every count is made by the build, which fails unless each question sits in exactly one row.","sources":"Joan’s three Formative mini-exams and their answer documents (published 20 Oct 2026), her recorded revision session of 20 Oct and Legal &amp; Ethical lecture of 16 Sep 2026 (by timestamp), her exam-preparation deck, her Escape Room answer sheet, the 14 lecture decks plus the Rongoā deck, the course syllabus (learning outcomes and assessment table) and the Canvas timetable.","t0n":"Joan said it on tape","t0w":"Named by the person who writes the paper, on a recording, with a timestamp. That is not a question count, so it sits above the ranking, not inside it.","t1w":"A learning outcome that the exam assesses names these. Question counts play no part — the questions are the tool’s.","t3w":"Has its own assessment, so the final is unlikely to lean on it. Keep the formulas warm; do not camp here.","critLbl":"Module","flagn":{"LO1":"LO1 · pharmacological principles","LO3":"LO3 · medication education","LO4":"LO4 · mechanisms, uses, side effects","SD":"self-directed — never lectured","noquiz":"no questions yet","SKIP":"she skipped slides here — read them yourself"}}}};
/* META is everything that makes this sim one paper rather than another — names, the
   sitting, the real paper's shape, the groups, the storage prefix. The build emits it
   from sim.config.mjs; nothing below this line names a paper, a lecturer or a date. */
const META = DATA.meta;
/* 20 Oct 2026: a sim that has an exam on the hub (META.hub, e.g. 'inp/exam') sends its header link and ‹ Home
   back to that exam's sides, not to the hub's front page or this page's menu. */
const HUB = META.hub ? 'https://jeremyspm.github.io/#' + META.hub : '';
{ const b = document.querySelector('header .back');
  if (HUB && b) { b.href = HUB; b.textContent = '‹ ' + META.tool.name; b.title = 'Back to ' + META.tool.name + ' on the BN2 study tools'; } }
const FC = META.focusCopy || {};
/* references: q.refs = [{k:'slide'|'her'|'patton', src, slide|t, ...}] in authority order —

e **contraindicated** in the **elderly**","of":[1]},{"t":"**Dose** — “**start low and go slow**”","of":[2]},{"t":"**Time** — coordinate with **meals** and **sleep** times","of":[3]},{"t":"**Route** — **difficulties swallowing**: **liaise with prescriber**","of":[4]},{"t":"**Refusal** — involve **whanau**/family and **EPA**","of":[5]}]}]},"qf90b5a4afd":{"id":"form3:mr mokaraka is due for his annual influenza","title":"Route for the influenza vaccine","hook":"Flu jab: into the shoulder muscle.","groups":[{"q":"Route","facts":[{"t":"**IM**, **deltoid** muscle","of":[0]}]}]},"q2fd878a20c":{"id":"form3:mr mokaraka has a new prescription","title":"Paracetamol 10 g QID — next step","hook":"Hold and check — but he still needs analgesia.","groups":[{"q":"Her answer","facts":[{"t":"**Hold off** until you have **notified the prescriber** and **checked the dose**","of":[0]},{"t":"**Do not refuse** to give paracetamol — he **needs analgesia**","of":[1]}]}]},"qc553ad0325":{"id":"joan-found:what is the meaning of contraindication","title":"Contraindication","hook":"CONTRA = against: a reason NOT to give it.","groups":[{"q":"Definition","facts":[{"t":"A situation where a medication should **not be used**","of":[0]},{"t":"… because it **may be harmful** to the person","of":[0]}]},{"q":"Example","facts":[{"t":"A known **severe allergy** to that medicine","of":[1]},{"t":"Or a medicine that can **harm the foetus** in a **pregnant** woman","of":[1]}]}]},"q4aa9ab8e04":{"id":"joan-found:define a medication interaction and give","title":"Medication interaction","hook":"Something else changes what the medicine does.","groups":[{"q":"Definition","facts":[{"t":"The medicine’s **effect** is **altered by another substance or condition**","of":[0]},{"t":"Another **medication**, a **food**, a **complementary** medicine, an illness","of":[0]}]},{"q":"Example","facts":[{"t":"A **herbal remedy** or food changes how much is **absorbed or broken down**","of":[1]},{"t":"… making it **stronger or weaker**","of":[1]},{"t":"So the nurse **asks about everything** the person takes","of":[1]}]}]},"qc2a33fa1bc":{"id":"joan-found:distinguish a local effect from a","title":"Local vs systemic effect","hook":"Local = right where it goes on. Systemic = through the blood.","groups":[{"q":"Local","facts":[{"t":"At the **immediate site of administration**","of":[0]},{"t":"e.g. a **cream** on a skin rash; **eye drops**","of":[0]}]},{"q":"Systemic","facts":[{"t":"**Absorbed into the circulation** and **distributed** to where it acts","of":[1]},{"t":"e.g. a **tablet swallowed** for a headache","of":[1]}]}]},"q2540c548d3":{"id":"joan-pkpd:define bioavailability and give an example","title":"Bioavailability","hook":"How much actually arrives. IV = all of it.","groups":[{"q":"Definition","facts":[{"t":"How much of the dose **actually reaches the bloodstream**","of":[0]}]},{"q":"Two routes compared","facts":[{"t":"**Intravenous = 100%**","of":[1]},{"t":"By mouth it is **lower**: some **not absorbed**, some **broken down by the liver**","of":[1]}]}]},"q00b0ae36d3":{"id":"joan-pkpd:what is plasma protein binding and","title":"Plasma protein binding","hook":"Only the FREE drug works.","groups":[{"q":"Definition","facts":[{"t":"Many drugs **bind** reversibly to **plasma proteins**, mainly **albumin**","of":[0]},{"t":"Only the **free** (**unbound**) drug can act","of":[0]}]},{"q":"Why it matters, with an example","facts":[{"t":"Two medicines **compete for the same binding site**","of":[1]},{"t":"Or **low albumin** in a **malnourished** older adult","of":[1]},{"t":"More **free drug** → more effect, **risk of toxicity**","of":[1]}]}]},"qa471ade3d3":{"id":"joan-pkpd:define half life and give an","title":"Half-life","hook":"Half gone each half-life; about five of them and it is all gone.","groups":[{"q":"Definition","facts":[{"t":"The time for the **plasma concentration** to **fall by one half**","of":[0]},{"t":"Not how long the **whole drug** stays in the body","of":[0]}]},{"q":"How it is used","facts":[{"t":"Cleared after about **5 half-lives**","of":[1]},{"t":"**Steady state** after **3–5 half-lives** of regular dosing","of":[1]},{"t":"It sets the **dosing interval**","of":[1]}]}]},"q001d7cf710":{"id":"joan-pkpd:define the therapeutic range and give","title":"The therapeutic range","hook":"Enough to work, not enough to poison.","groups":[{"q":"Definition","facts":[{"t":"The **plasma concentration** range that gives the **desired effect** without **toxicity**","of":[0]},{"t":"Above the **minimum effective concentration**, below the **toxic** one","of":[0]}]},{"q":"When it is monitored","facts":[{"t":"**Therapeutic drug monitoring** for a **narrow therapeutic range**","of":[1]},{"t":"Blood levels at **peak and trough**","of":[1]}]}]},"q7fdc63c15b":{"id":"joan-admin:define a medication error and give","title":"Medication error vs adverse effect","hook":"Error = a person slipped. Adverse effect = the medicine did it.","groups":[{"q":"Definition","facts":[{"t":"Any **preventable event** that may cause **inappropriate medication use** or **patient harm**","of":[0]},{"t":"… while the medicine is **in the control** of staff or patient","of":[0]},{"t":"e.g. a **dose given twice**; a known **allergy** ignored","of":[0]}]},{"q":"How it differs from an adverse effect","facts":[{"t":"Adverse effect: harm from **the medicine itself**, **even when used correctly**","of":[1]},{"t":"Error: harm from **human action**, a lapse in the **rights and checks**","of":[1]}]}]},"q8dc9e9266c":{"id":"joan-admin:what is carm and who can","title":"CARM: what it is, who reports","hook":"A reaction? Document it, flag it, report it to CARM.","groups":[{"q":"What it is, and who reports","facts":[{"t":"The **Centre for Adverse Reactions Monitoring**","of":[0]},{"t":"NZ’s database of **suspected adverse reactions** to medicines and **vaccines**","of":[0]},{"t":"**Health professionals**, **patients and whānau** can all report","of":[0]}]},{"q":"Example to report","facts":[{"t":"A **widespread rash** and **facial swelling** after **starting a new medicine**","of":[1]},{"t":"It is **documented**, an **alert** placed on the record, and **reported**","of":[1]}]}]},"qbe831fca79":{"id":"joan-life:define polypharmacy and give an example","title":"Polypharmacy","hook":"Five or more, and the risks multiply.","groups":[{"q":"Definition","facts":[{"t":"The **concurrent use of multiple medications**, usually **five or more**","of":[0]},{"t":"It implies **too many**, or **unnecessary**, medicines","of":[0]}]},{"q":"A risk it raises (any one)","facts":[{"t":"**Drug–drug interactions** and **adverse effects**","of":[1]},{"t":"**Falls**; not taking them **as prescribed**; **death**","of":[1]}]}]},"qa170e24e78":{"id":"joan-life:on what does the transfer of","title":"Medicines in breast milk","hook":"Blood level, milk amount, fat-solubility. Keep the parent well.","groups":[{"q":"What the transfer depends on","facts":[{"t":"The parent’s **plasma concentration** of the drug","of":[0]},{"t":"The **amount of milk** the infant takes","of":[0]},{"t":"The drug’s **lipid solubility**","of":[0]}]},{"q":"The guiding principle","facts":[{"t":"**Maintaining the parent’s health is essential**","of":[1]},{"t":"Not **automatically** stopped: the prescriber **weighs the risk** to the infant","of":[1]}]}]},"qe03adddc9f":{"id":"joan-life:children are just small adults explain","title":"Children are not small adults","hook":"Different bodies, so doses by the kilo.","groups":[{"q":"Why it is false","facts":[{"t":"Children are **physiologically different** and **constantly developing**","of":[0]},{"t":"About **75% water**, less fat; **immature protective barriers**","of":[0]},{"t":"Poorer **temperature** and **homeostatic control**","of":[0]}]},{"q":"Example","facts":[{"t":"The dose comes from **body weight** (**mg per kg**)","of":[1]},{"t":"**Never** by simply **scaling down an adult dose**","of":[1]}]}]},"qd71245f58b":{"id":"joan-law:what is a controlled drug give","title":"Controlled drugs","hook":"Misuse of Drugs Act: abuse risk = double-locked.","groups":[{"q":"Definition","facts":[{"t":"A medicine under **special legal restriction**: **Misuse of Drugs Act 1975**","of":[0]},{"t":"Because of its **potential for abuse**, **dependence** and harm","of":[0]},{"t":"All controlled drugs are prescribed; **not all prescribed drugs are controlled**","of":[0]}]},{"q":"How they are handled on a ward","facts":[{"t":"**Opioids** like **morphine** (**Class B**)","of":[1]},{"t":"Kept in a **double-locked safe** inside a locked room","of":[1]},{"t":"**Restricted key-holders**; **penalties** for unlawful use","of":[1]}]}]},"q3d3fe77921":{"id":"joan-law:define scope of practice and give","title":"Scope of practice","hook":"What you are educated, competent and authorised to do.","groups":[{"q":"Definition","facts":[{"t":"The area a practitioner is **educated, competent and authorised** to work in","of":[0]},{"t":"Set by the **Nursing Council** under the **HPCAA**","of":[0]},{"t":"About **demonstrated competence**, **not a list of tasks**","of":[0]}]},{"q":"Outside an RN’s scope (any one)","facts":[{"t":"**Prescribing** (unless a **designated RN prescriber**)","of":[1]},{"t":"**Dispensing**: that is the **pharmacist’s role**","of":[1]}]}]},"qe0b90dee19":{"id":"joan-ethics:explain the nurse s duty of","title":"Privacy, and a phone enquiry","hook":"You can’t see who is calling, so you can’t tell them.","groups":[{"q":"The duty","facts":[{"t":"**Code of Conduct Principle 5**: **protect personal health information**","of":[0]},{"t":"Share it only for **appropriate professional purposes**","of":[0]},{"t":"Notes are read only by **those caring for that patient**","of":[0]}]},{"q":"The phone example","facts":[{"t":"“Sorry, we **can’t give patient information over the phone**”","of":[1]},{"t":"You **cannot verify who is calling**; offer to **ring back**","of":[1]}]}]},"qfb56a27bba":{"id":"joan-ethics:define autonomy and give an example","title":"Autonomy","hook":"Their body, their choice, even when it is no.","groups":[{"q":"Definition","facts":[{"t":"The **right of choice**","of":[0]},{"t":"**Informed, voluntary consent**, **without coercion**","of":[0]},{"t":"Including the **right to refuse** and to **withdraw** at any time","of":[0]}]},{"q":"Example","facts":[{"t":"A **competent patient declines** a medicine","of":[1]},{"t":"The nurse checks they **understand the consequences**, **respects the refusal**, **documents it**","of":[1]}]}]},"qba72713fbf":{"id":"joan-ethics:why is concealing a medication error","title":"Why hiding an error is worse","hook":"An error is an accident. Hiding it is a choice.","groups":[{"q":"The reason","facts":[{"t":"An error is usually **accidental**: **report it**, **reflect**, **be supervised**","of":[0]},{"t":"**Concealment is deliberate**: it **denies the patient monitoring and treatment**","of":[0]},{"t":"It **breaches integrity** (**Principle 7**): **professional misconduct**","of":[0]}]},{"q":"Example","facts":[{"t":"“**Nurse D**” took **two days to report**; the **patient died**","of":[1]},{"t":"Found **guilty of professional misconduct**: **suspended**, **fined**, supervised","of":[1]}]}]},"q0dc4be8381":{"id":"joan-devmkt:define bioequivalence and explain why it","title":"Bioequivalence","hook":"Same ingredient, same rate, same amount = swappable.","groups":[{"q":"Definition","facts":[{"t":"The **same active ingredient** reaches the bloodstream","of":[0]},{"t":"At the **same rate** and to the **same extent**","of":[0]}]},{"q":"Why it matters, with an example","facts":[{"t":"A **generic** may only be **substituted** for a brand if **bioequivalent**","of":[1]},{"t":"So the patient gets the **same therapeutic effect**","of":[1]},{"t":"e.g. dispensing the **funded generic** instead of the original brand","of":[1]}]}]},"qeb2b33db6b":{"id":"joan-devmkt:what is phase 4 of clinical","title":"Phase 4: post-market monitoring","hook":"Rare harms only show up across a whole population.","groups":[{"q":"What it is","facts":[{"t":"**Post-market monitoring** of **long-term safety**","of":[0]},{"t":"**Several thousand patients**, over years, **after Medsafe approval**","of":[0]}]},{"q":"Why it exists, with an example","facts":[{"t":"**Rare or delayed adverse effects** only show at **population scale**","of":[1]},{"t":"e.g. a medicine **withdrawn** after **post-market reports**","of":[1]}]}]},"q156716d6b7":{"id":"joan-devmkt:what is direct to consumer advertising","title":"Direct-to-consumer advertising","hook":"Prescription-medicine ads aimed at the public: rare worldwide.","groups":[{"q":"What it is","facts":[{"t":"It promotes a **branded prescription medicine** **to the public**","of":[0]}]},{"q":"Why NZ is unusual","facts":[{"t":"**One of only two developed countries** that **permit it**","of":[1]},{"t":"Most restrict it to **health professionals**","of":[1]},{"t":"It can **drive demand** for medicines that **may not be appropriate**","of":[1]}]}]},"q629d061d0b":{"id":"joan-cam:define rongo m ori and give","title":"Rongoā Māori: its three parts","hook":"Mirimiri, karakia, rongoā rākau: hands, prayer, plants.","groups":[{"q":"Definition","facts":[{"t":"**Traditional Māori healing**","of":[0]},{"t":"With a **strong spiritual element**: a **Māori model of health**","of":[0]}]},{"q":"Its three parts","facts":[{"t":"**Mirimiri**: **massage** / body work","of":[1]},{"t":"**Karakia**: **prayer**","of":[1]},{"t":"**Rongoā rākau**: **native plant-based remedies**, e.g. a **balm**","of":[1]}]}]},"q312cfb3cd1":{"id":"joan-cam:who is responsible for a traditional","title":"Who is responsible for a rongoā remedy","hook":"The practitioner owns the remedy; the nurse brings everyone together.","groups":[{"q":"Who is responsible","facts":[{"t":"The **tohunga** or **rongoā practitioner**","of":[0]},{"t":"**Karakia and kawa differ** between tribal areas","of":[0]},{"t":"The nurse **does not prescribe or prepare it**","of":[0]}]},{"q":"What the nurse does","facts":[{"t":"**Arranges a discussion** with everyone involved","of":[1]},{"t":"So the client can make an **informed decision**","of":[1]}]}]},"q9b611d5393":{"id":"joan-imm:how does a nurse prevent a patient","title":"Preventing an allergic exposure","hook":"Ask every time; check the bracelet; beware the suspects.","groups":[{"q":"Avoidance","facts":[{"t":"**Check** for allergies at **every healthcare encounter**","of":[0]},{"t":"**Record** them; the patient wears an **allergy bracelet**","of":[0]},{"t":"**Highly suspect**: **contrast dyes**, **iodine**, **antimicrobials**","of":[0]}]},{"q":"Example","facts":[{"t":"Before an **antibiotic**: **ask**, check **bracelet** and **chart**","of":[1]},{"t":"A new reaction is **documented**; the **prescriber told**","of":[1]}]}]},"q76e9831e9b":{"id":"joan-imm:define active immunity and give","title":"Active immunity — natural and artificial","hook":"Active = your own body did the work.","groups":[{"q":"Definition","facts":[{"t":"Made by the person’s **own immune system**","of":[0]},{"t":"Stores **memory B cells**","of":[0]}]},{"q":"Examples","facts":[{"t":"**Natural**: **recovering** from an infection, e.g. **chickenpox**","of":[1]},{"t":"**Artificial**: a **vaccination**, e.g. **MMR** at **12 months**","of":[1]}]}]},"q281ececc27":{"id":"joan-imm:define passive immunity and give","title":"Passive immunity — natural and artificial","hook":"Passive = borrowed antibodies: instant, but they run out.","groups":[{"q":"Definition","facts":[{"t":"**Antibodies** from a **different source**","of":[0]},{"t":"**Immediate** but **temporary**","of":[0]}]},{"q":"Examples","facts":[{"t":"**Natural**: across the **placenta** or in **breastmilk**","of":[1]},{"t":"**Artificial**: lab-made **monoclonal antibodies**","of":[1]},{"t":"e.g. **pre-exposure prophylaxis** for someone **immunocompromised**","of":[1]}]}]},"q0c83fbbca5":{"id":"joan-imm:define herd immunity and give an example","title":"Herd immunity","hook":"Enough people immune, and the bug has nowhere to go.","groups":[{"q":"Definition","facts":[{"t":"**Most people** vaccinated: pathogens **cannot spread easily**","of":[0]},{"t":"The **whole community** is protected","of":[0]},{"t":"Some diseases **reduced** or **eliminated**, e.g. **polio**","of":[0]}]},{"q":"Who it protects","facts":[{"t":"Those who **cannot be vaccinated** or **do not respond**","of":[1]},{"t":"**Very young**, **elderly**, **immunocompromised**, **non-responders**","of":[1]}]}]},"q93ca7c843d":{"id":"joan-imm:distinguish a live attenuated vaccine","title":"Live vs non-live vaccines","hook":"Live replicates — so not in pregnancy or immunosuppression.","groups":[{"q":"Live (attenuated)","facts":[{"t":"**Weakened pathogens** that **replicate** without disease","of":[0]},{"t":"e.g. **MMR**, **varicella**, **rotavirus**, **BCG**","of":[0]}]},{"q":"Non-live","facts":[{"t":"**Cannot replicate**","of":[1]},{"t":"**Inactivated** (e.g. **polio**), **subunit**, **mRNA** (e.g. **COVID-19**)","of":[1]}]},{"q":"Not safe for","facts":[{"t":"**Pregnancy** or **immunosuppression**","of":[2]},{"t":"e.g. **MMR** not given to a **pregnant woman**","of":[2]}]}]},"q19c3118d47":{"id":"joan-imm:why is a fever a reason not","title":"Fever — put the vaccine off","hook":"The immune system can only do one job at a time.","groups":[{"q":"Reason","facts":[{"t":"The immune system does **one task at a time**","of":[0]},{"t":"**Busy** with something else: may **not respond** to the vaccine","of":[0]}]},{"q":"Example","facts":[{"t":"A child with a **fever** at their **3-month vaccinations**","of":[1]},{"t":"**Put off**, **rebooked** once **well**","of":[1]}]}]},"q071ce622d2":{"id":"joan-tox:define a licit drug and an illicit","title":"Licit vs illicit","hook":"Licit = Lawful. Illicit = Illegal. Every Class A is illicit.","groups":[{"q":"Licit","facts":[{"t":"**Lawful and permitted**: prescription to **general sale** medicines","of":[0]},{"t":"Plus **some controlled drugs** (some **Class B and C**)","of":[0]},{"t":"Example: **alcohol**, or an **opioid** taken **as prescribed**","of":[0]}]},{"q":"Illicit","facts":[{"t":"**Unlawful** or **not permitted**","of":[1]},{"t":"**every Class A**, **some Class B**, a **few Class C**","of":[1]},{"t":"Example: **methamphetamine** (Class A)","of":[1]}]}]},"q49ce46eb6e":{"id":"joan-tox:define drug tolerance and give an","title":"Drug tolerance","hook":"Same dose, less effect: you need MORE.","groups":[{"q":"Definition","facts":[{"t":"Repeated doses cause **decreasing effects**","of":[0]},{"t":"Or the **dose must be increased** for the **same effect**","of":[0]},{"t":"Mechanism: **receptor downregulation**","of":[0]}]},{"q":"Example","facts":[{"t":"**Morphine**: tolerance develops **rapidly**","of":[1]},{"t":"**Marijuana**: **little tolerance**. **Not every drug** causes it","of":[1]}]}]},"q7f23095410":{"id":"joan-tox:what is withdrawal give an example","title":"Withdrawal","hook":"Stop a drug you depend on: the body protests.","groups":[{"q":"What it is","facts":[{"t":"Symptoms when a **physically dependent** person **stops or cuts down**","of":[0]},{"t":"**Mild to severe**, lasting **days or weeks**","of":[0]},{"t":"Depends on the **substance**, **how long**, age, **weaned** or **cold turkey**","of":[0]}]},{"q":"Example","facts":[{"t":"**Insomnia**, **fatigue**, **irritability**, **cravings**","of":[1]},{"t":"Severe: **paranoia**, **confusion**, **tremors**, **disorientation**","of":[1]}]}]},"q98b5759e41":{"id":"joan-tox:what is harm reduction give an","title":"Harm reduction","hook":"If they are going to use anyway, make it safer.","groups":[{"q":"Definition","facts":[{"t":"**Reducing the harm** for people **going to use anyway**","of":[0]},{"t":"E.g. **education** about **which combinations are dangerous**","of":[0]}]},{"q":"Example","facts":[{"t":"Free, legal **drug checking** (**Know Your Stuff NZ**)","of":[1]},{"t":"**Naloxone** for people at risk of an **opioid overdose**","of":[1]}]}]},"qae9599d784":{"id":"joan-tox:define an antidote and give an","title":"Ant function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2).
     Among equally-seen questions the lecturer's own come before the tool's
     (+0.5), and Math.random() only breaks ties within each. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + (q.authored?0.5:0) + Math.random()/2;

}
function dealStratified(n, pool=MOCKABLE){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};

    for(const q of pickN(pool.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(pool, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);

  return shuffle(out).slice(0,n);
}

/* the full mock is the REAL paper's shape (META.shape): that many closed questions, then

function dealFull(){

  if(META.shape.saqMarks){

    const out=[]; let m=0; const used=new Set();
    const ranked=pickN(MOCK_ESSAYS, MOCK_ESSAYS.length, new Set());
    /* when the paper ALSO publishes the count (shape.saq), stop at that many, and leave at least a mark for each slot
       still to fill — 11 questions for 20 marks cannot open on a run of 3-markers */
    const N=META.shape.saq||Infinity, room=()=>META.shape.saqMarks-m-(N===Infinity?0:N-out.length-1);
    /* second pass: no question smaller than the marks still owed per open slot, so a run of 1-markers cannot fill
       the count short of the marks; the third takes whatever still fits */
    const owed=()=>N===Infinity?0:Math.floor((META.shape.saqMarks-m)/(N-out.length));
    for(let pass=0; pass<3 && m<META.shape.saqMarks && out.length<N; pass++) for(const q of ranked){
      if(used.has(q.id)||q.pts>room()) continue;
      if(pass===1 && q.pts<owed()) continue;
      /* first pass: one per topic (group, not quiz row — a lecturer's mini-exam is one row across every topic,
         so one per row would cap her questions at one per mini-exam and fill the rest with the tool's) */
      if(!pass && out.some(x=>x.sys===q.sys)) continue;

const sqFig = x => (x.q.imgs||[]).map(f=>`<img class="qimg" src="img/${f}" alt="question figure" loading="lazy">`).join('');
/* marking help (hs2-test3's, unchanged): which of a line's bold (mark-earning) words appear in what was written. Generous
   about form (a long word must match all but its last 3 letters; either side of a "(x)" or "a / b"), strict about substance
   (half the bold words or more to pre-tick). It only suggests; the student ticks. */

  const t=' '+sqNorm(text).replace(/\s+/g,' ')+' ';

    const ws=sqNorm(alt).split(/\s+/).filter(w=>w.length>1&&!SQ_STOP.has(w));
    return ws.length>0 && ws.filter(w=>t.includes(' '+w.slice(0,w.length<=5?w.length:Math.max(5,w.length-3)))).length>=Math.ceil(ws.length/2);

function sqCheckStep(step,text){

let SIT=null;

/* a Learn run is saved as it goes (deck ids + every mark), so a phone that drops the tab

function saveRun(){

function resumeLearn(){

    const pick={};let any=false;

function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){

    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}

    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}

    ${rows.map(({q,r,saq},i)=>{

  the back button asks first; a Learn run is saved as you go, so it just stops.${MORE.length?` ${MORE.length===1?'One row opens':'Some rows open'} another page of this tool — ${MORE.map(m=>`<b>${esc(m.t)}</b>`).join(', ')} — in this tab; your phone's back button returns here.`:''}</p>
  <h3>Where the questions come from</h3>
  <p>${nCap?`${nCap} questions captured from ${DATA.quizzes.filter(z=>!z.authored&&!z.her).length} Canvas quizzes, answer keys
  extracted from the graded pages — stems, options and keys exactly as set, nothing invented.`:(H.noBank||'This paper has no Canvas quizzes, so nothing here was captured.')}
  ${nHer?(H.her||`<b>${nHer} questions are ${esc(META.who||'the lecturer')}’s own</b>, set outside the Canvas quizzes — stems, options, answer key, marks and model answers exactly as she wrote them; any explanation under one is the tool’s and says so. `):''}
  ${ESSAYS.some(q=>!q.authored&&!q.her)?`Written questions from Canvas have <b>model answers written by this tool</b> (Canvas publishes none), one mark per step, each naming its source. `:''}
  ${nAuth?(H.authored||`<b>${nAuth} written questions were written by this tool</b> from the lecture decks, because the real paper has a written section and the quizzes have none; each is labelled as the tool’s and names its deck. `):''}
  ${DATA.chains.length?'Warm-up chains are scaffolds built from the decks, not the lecturer’s material. ':''}
  ${nNm?(H.noMockClosed||`${nNm} questions are about being a student on this course rather than the subject (attendance, extensions, online-exam rules); they stay under Pick my rep but are never dealt into a mock paper. `):''}
  ${nNmW?(H.noMockWritten||`${nNmW} written questions stay under Pick my rep but are never dealt into a mock paper. `):''}</p>
  ${H.groups?`<p>${H.groups}</p>`:''}
  <h3>Learn mode</h3>
  <p><b>Learn as you go</b> (and the <b>Learn</b> button beside each quiz) marks every question the moment you
  press Check and shows the answer${HAS.ref?', the slide or notes that state it':''}${HAS.vid?' and the matched video':''} right there${HAS.ref||HAS.vid?' — you can open any of them before answering':''}. Check with nothing picked just shows you. Nothing from Learn mode
  goes on the score chart; a wrong or skipped question still joins your misses pile${HAS.ref||HAS.vid?', and a right answer after a peek does not clear it':''}. <b>Sit</b> is the test version: the same questions, nothing shown until the end.</p>
  <p><b>How many at a time</b> (12 · 25 · 50 · 100 · All) sets the size of every dealt Learn set and of the
  per-group sets; All hands you the whole pool, least-seen first, misses first. Under <b>Pick my rep</b>
  tick any quizzes — or a whole group with the chips — and the bar at the bottom
  runs them as one deck, Learn or Sit, every question of every ticked quiz. A Learn run saves itself after every
  Check; stop partway (or lose the tab) and the home page offers to pick it up where you were.</p>
  ${SAQD.length?`<h3>SAQ trainer — the ✍️ row under Write</h3>
  <p>A full model answer is hard to remember, so every written question here also has a <b>short version</b>: the same
  answer, one fact a line, a few words each, grouped under the question's own parts, with a memory hook. The
  <b style="color:var(--warn)">bold</b> words are the ones that earn the marks. <b>SAQ trainer</b> teaches them one question
  at a time: <b>1 Read</b> the short version, <b>2 Fill the gaps</b> (the lines disappear a round at a time until you can say the
  whole answer), <b>3 Write it</b> from memory — the page finds the bold words in what you wrote, you confirm, and 80% locks it.
  The same short lines are what you tick for a written question in Learn mode and in a mock test; the full answer folds
  underneath. Every short line is cut from its full answer, and the build checks each bold word against the step it came
  from. The last-look sheet prints every short answer on one page.</p>`:''}
  ${H.explain?`<h3>Where the explanations come from</h3><p>${H.explain}</p>`:''}
  <h3>Ask an AI — the 🤖 buttons</h3>
  <p>Under every marked question${DATA.focus.length?', and inside every row of the focus list,':''} <b>${AI_LBL}</b> copies a
  ready-made prompt to paste into Gemini (or any AI chat). It asks for one everyday analogy mapped back to the
  real terms, in the lecturer’s words, then a five-question blind quiz with instant feedback — and it carries the
  key${HAS.ref?', the notes':''}${DATA.focus.length?' and the “where it ends” line':''}, so the AI teaches to this paper and stops where it stops.
  If the question has a figure, the copy carries that too, as one picture. This page sends nothing anywhere; you
  paste it yourself. An AI’s quiz checks that the analogy landed. Only the real questions here check that it would
  earn marks — come back and sit them.</p>
  <h3>What’s held out</h3>
  <p>${DATA.held.length?`${DATA.held.length} questions are excluded (image or format did not survive capture) — listed in the repo.`:'Nothing: every captured question shipped.'} ${H.held||''}</p>
  <h3>Your data</h3>
  <p>Scores and misses live in this browser only. Nothing is sent anywhere. Clearing site data wipes them.</p>
  <h3>For whoever maintains this</h3>
  <p>Built by <code>build.mjs</code> from ${DATA.stats.n-nAuth?'<code>bank/questions.json</code> (parsed Canvas captures), ':''}<code>content/</code> and <code>sim.config.mjs</code>.
  Rebuild: <code>node build.mjs</code>. Bank built ${DATA.built}. Multi-answer questions mark all-or-nothing;
  matching and dropdowns mark per part.</p>
  <button class="btn primary wide" onclick="this.closest('dialog').close()">Close</button>`;
  $('#help').showModal()};
document.addEventListener('click',e=>{
  const vf=e.target.closest('.vfull'); if(vf){const c=vf.closest('.vclip');loadVid(c,+c.dataset.at,null);return}
  const fr=e.target.closest('.vframe'); if(fr&&!fr.querySelector('iframe')){const c=fr.closest('.vclip');loadVid(c,+c.dataset.at,+c.dataset.end);return}
  const qa=e.target.closest('.qa'); if(qa){const row=qa.closest('.qr,.lres'),pane=row.querySelector('.qr-pane'),act=qa.dataset.act,open=pane.dataset.act===act&&!pane.hidden;row.querySelectorAll('.qa').forEach(b=>b.classList.toggle('on',b===qa&&!open));if(open){pane.hidden=true;pane.dataset.act='';return}
    const q=SIT.deck.find(x=>x.id===row.dataset.qid);
    /* opening a resource on an unchecked learn-mode question is a peek */
    if(row.classList.contains('lres')&&!SIT.chk[q.id]){SIT.peek[q.id]=true;saveRun()}
    pane.innerHTML=paneHTML(q,act);pane.hidden=false;pane.dataset.act=act;return}
  const ask=e.target.closest('[data-ask],[data-askf]');
  if(ask){
    if(ask.dataset.ask){const q=SIT.deck.find(x=>x.id===ask.dataset.ask);copyPrompt(ask,w=>aiQuestionPrompt(q,w),aiFigures(q).length?aiFigureBlob(q):null)}
    else copyPrompt(ask,aiTopicPrompt(DATA.focus.find(f=>f.id===ask.dataset.askf)),null);
    return}
  const sp=e.target.closest('[data-aitext],[data-aifig]'); if(sp){aiSplitCopy(sp);return}
  if(e.target.id==='shareBtn'){
  const l=S.scores[S.scores.length-1];
  const line=`${META.short} — ${l.got}/${l.tot} (${Math.round(100*l.got/l.tot)}%) · ${l.label} · ${daysLeft()}d to my sitting`;
  navigator.clipboard&&navigator.clipboard.writeText(line);
  e.target.textContent='Copied ✓';setTimeout(()=>e.target.textContent='Copy score line',1500)}});
home();
</script>
