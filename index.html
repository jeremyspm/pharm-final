 the NZF for dosing and interactions.","groups":[{"q":"Medsafe","facts":[{"t":"**Data Sheets** for **health professionals**","of":[0]},{"t":"**Consumer Medicine Information** sheets for consumers","of":[0]}]},{"q":"The New Zealand Formulary (NZF)","facts":[{"t":"An **adult** section and a **child** section (0–18)","of":[1]},{"t":"**Normal dosing**; whether **PHARMAC-subsidised**; an **interactions checker**","of":[2]}]}]},"qfa426f7c7e":{"id":"concepts2:the deck lists four kinds of source","title":"Four sources to use with caution","hook":".com sites, news, AI, social media.","groups":[{"q":"The four, and why","facts":[{"t":"**.com websites**: often **American terminology**","of":[0]},{"t":"**News releases**: **clickbait**; is the author **qualified**?","of":[1]},{"t":"**Artificial intelligence**: “**uses patterns rather than science**”","of":[2]},{"t":"**Social media**","of":[3]}]}]},"qa5a0485776":{"id":"concepts2:what three things does the route of","title":"What the route of administration affects","hook":"How fast, how strong, and where.","groups":[{"q":"The three things","facts":[{"t":"The **rate of onset** of action","of":[0]},{"t":"The **magnitude** of the **response**","of":[1]},{"t":"For some routes, the **location of the response**","of":[2]}]}]},"qd0d2b258b6":{"id":"concepts2:name the five major groups of administration","title":"Five route groups; local vs systemic","hook":"Oral, parenteral, rectal, inhalation, topical.","groups":[{"q":"The five route groups","facts":[{"t":"**Oral** (**enteral**: the GI tract)","of":[0]},{"t":"**Parenteral** (**not through the GI tract**)","of":[1]},{"t":"**Rectal**","of":[2]},{"t":"**Inhalation**","of":[3]},{"t":"**Topical**","of":[4]}]},{"q":"Local vs systemic","facts":[{"t":"**Local**: at the **immediate site of administration**","of":[5]},{"t":"**Systemic**: **absorbed** into the **circulation**, **distributed** to where it acts","of":[6]}]}]},"q68b456e20f":{"id":"concepts2:give the advantages and disadvantages of the","title":"The IV route: pros and cons","hook":"Fast and big, but no taking it back.","groups":[{"q":"Advantages","facts":[{"t":"**Rapid effects**: onset is **immediate**","of":[0]},{"t":"A **large volume** can be given","of":[1]},{"t":"**Reduced risk of tissue irritation**: **immediately diluted** in the blood","of":[2]}]},{"q":"Disadvantages","facts":[{"t":"**Dangerous**: **not easy to retrieve, stop or slow**","of":[3]},{"t":"May need **hospitalisation**; **higher cost**","of":[4]},{"t":"**Risk of infection** and **adverse effects**","of":[5]}]}]},"qe034dfad72":{"id":"concepts2:compare the intramuscular and subcutaneous routes absorption","title":"IM vs subcutaneous","hook":"IM: into muscle, faster. SC: under the skin into fat, slow and steady.","groups":[{"q":"Intramuscular (IM)","facts":[{"t":"Injected **into muscle**; absorbed via its **blood vessels**","of":[0]},{"t":"**Faster than oral**","of":[0]},{"t":"Pro: **slower absorption** possible, e.g. **Depo-Provera**; an **EpiPen**","of":[1]},{"t":"Con: **pain and nerve damage**; **variable absorption**","of":[2]}]},{"q":"Subcutaneous (SC)","facts":[{"t":"**Beneath the skin**, into **connective tissue or fat**","of":[3]},{"t":"Faster than oral but **less reliable**","of":[3]},{"t":"Pro: a **sustained effect**, e.g. **insulin**; can **self-medicate**","of":[4]},{"t":"Con: **non-irritating drugs** only; **small volumes**","of":[5]}]}]},"qbfd64fb568":{"id":"concepts2:why can the lungs absorb medication so","title":"Why the lungs absorb medicines well","hook":"A huge surface, lots of capillaries, and it must be a mist.","groups":[{"q":"Why","facts":[{"t":"A **large surface area**","of":[0]},{"t":"**Many capillaries** next to the **alveolar membranes**","of":[1]}]},{"q":"The physical form","facts":[{"t":"**Gases** or **fine mists** (**aerosols**): **inhalers**, **nebulisers**","of":[2]}]}]},"qfa4e8d91ee":{"id":"concepts2:explain dissolution and rank the oral formulations","title":"Dissolution, fastest to slowest","hook":"Liquid first, coated last: elixir, suspension, powder, capsule, tablet, coated.","groups":[{"q":"Dissolution","facts":[{"t":"The drug **goes into a solution**","of":[0]},{"t":"Solids must **disintegrate**, then **dissolve**","of":[0]},{"t":"**Faster dissolution = faster absorption**; **liquid medications** are fastest","of":[1]}]},{"q":"Fastest to slowest","facts":[{"t":"**Elixirs and syrups** → **suspensions** → **powders**","of":[2]},{"t":"→ **capsules** → **tablets** → **coated tablets** (slowest)","of":[2]}]}]},"q757252d387":{"id":"concepts2:give the four reasons an enteric coating","title":"Four reasons for an enteric coating","hook":"Protect the drug, keep it strong, spare the stomach, slow it down.","groups":[{"q":"The four reasons","facts":[{"t":"Prevents **decomposition** of sensitive drugs by **gastric secretions**","of":[0]},{"t":"Prevents **dilution** of the drug","of":[1]},{"t":"Prevents **nausea and vomiting**","of":[2]},{"t":"Provides **delayed action**","of":[3]}]},{"q":"How","facts":[{"t":"It **prevents dissolution in the stomach**; it **dissolves in the intestine**","of":[4]}]}]},"qf1fc85e070":{"id":"concepts2:what are excipients and name four kinds","title":"Excipients: four kinds in a tablet","hook":"Binders stick, disintegrators break, lubricants slide, fillers bulk.","groups":[{"q":"What they are","facts":[{"t":"**Inert chemicals** in a formulation","of":[0]},{"t":"The active medicine may be a **very small fraction** of the tablet","of":[1]}]},{"q":"Four kinds in a tablet","facts":[{"t":"**Binders**: stick the powder together","of":[2]},{"t":"**Disintegrators**: assist **dissolution**","of":[2]},{"t":"**Lubricants**: make **manufacturing** easier","of":[2]},{"t":"**Fillers**: a convenient **tablet size**","of":[2]}]}]},"q99ab2ad722":{"id":"concepts2:distinguish a hard capsule from a soft","title":"Hard vs soft capsules","hook":"Hard = powder inside, can open. Soft = liquid inside, fast.","groups":[{"q":"Both","facts":[{"t":"A **gelatin shell** around the medication","of":[0]}]},{"q":"Hard capsule","facts":[{"t":"The drug as a **solid** (**powder**, **granule**)","of":[1]},{"t":"**Can be opened** and emptied if needed","of":[1]}]},{"q":"Soft capsule (softgel)","facts":[{"t":"The drug as a **liquid solution**","of":[2]},{"t":"Useful when **fast action** is needed","of":[2]}]}]},"q4380a7c79c":{"id":"concepts2:give the meaning of prn mane nocte","title":"Timing abbreviations","hook":"Say them aloud: prn, mane, nocte, od, bd, tds, qid, q4h, ac, pc, stat.","groups":[{"q":"What each means","facts":[{"t":"**prn** = **if necessary**; **mane** = **in the morning**; **nocte** = **at night**","of":[0]},{"t":"**od** = **once daily**; **bd** = **twice a day**","of":[1]},{"t":"**tds** = **three times a day**; **qid** = **four times a day**","of":[1,2]},{"t":"**q4h** = **every four hours**","of":[2]},{"t":"**ac** = **before meals**; **pc** = **after meals**; **stat** = **immediately**","of":[3]}]}]},"q066514466e":{"id":"concepts2:give the meaning of the route abbreviations","title":"Route abbreviations, NKA and NKDA","hook":"PO mouth, SL tongue, SC skin, IM muscle, IV vein, PR rectum.","groups":[{"q":"The routes","facts":[{"t":"**PO** = **orally**; **SL** = **sublingual** (under the tongue)","of":[0]},{"t":"**SC** = **subcutaneous**","of":[0]},{"t":"**IM** = **intramuscular**; **IV** = **intravenous**; **PR** = **rectally**","of":[1]}]},{"q":"Allergies","facts":[{"t":"**NKA** = **no known allergies**","of":[2]},{"t":"**NKDA** = **no known drug allergies**","of":[2]}]}]},"q53718eeeef":{"id":"calcs:state the main medication calculation formula say","title":"The main medication formula","hook":"Want ÷ Got × Volume.","groups":[{"q":"The formula","facts":[{"t":"(**What you want** ÷ **what you have got**) × **volume**","of":[0]}]},{"q":"Each term","facts":[{"t":"Want = **prescribed**, **charted**, **ordered**","of":[1]},{"t":"Got = **in stock**, **on hand**","of":[2]},{"t":"Volume = what the stock **strength comes in** (1 tablet, 5 mL)","of":[3]}]},{"q":"What it works for","facts":[{"t":"**Oral tablets and capsules**; **oral liquids**","of":[4]},{"t":"**Injected medicines**: **SC**, **IM**, **direct IV**","of":[4]},{"t":"Writing the volume **over 1** is also accurate","of":[5]}]}]},"q0e09015651":{"id":"calcs:list the five steps of the medication","title":"The Medication Calculation Checklist","hook":"Quiet, units, formula, sanity check, double check.","groups":[{"q":"The five steps","facts":[{"t":"1 **No distractions**","of":[0]},{"t":"2 Are the **units the same**?","of":[1]},{"t":"3 **Formula**","of":[2]},{"t":"4 Does the answer **look correct**?","of":[3]},{"t":"5 **Double check**","of":[4]}]}]},"q759b3eb2c4":{"id":"calcs:a patient has been prescribed digoxin 0","title":"Digoxin: mg to mcg, then tablets","hook":"Units first: 0.25 mg = 250 mcg.","groups":[{"q":"Working","facts":[{"t":"Convert first: **0.25 mg × 1000 = 250 mcg**","of":[0]},{"t":"**250 mcg ÷ 62.5 mcg × 1 tablet**","of":[1]},{"t":"= **4 tablets**","of":[2]}]}]},"qc3f94345fb":{"id":"calcs:a child is prescribed paracetamol 250 mg","title":"Paracetamol suspension volume","hook":"Want 250, got 200 in 5 mL.","groups":[{"q":"Working","facts":[{"t":"Units match (**mg and mg**): no conversion","of":[0]},{"t":"**250 mg ÷ 200 mg × 5 mL**","of":[1]},{"t":"= **6.25 mL**","of":[2]}]}]},"qf4f14eb47c":{"id":"calcs:te atawhai is prescribed furosemide 0 1","title":"Furosemide: g to mg, then volume","hook":"Units first: 0.1 g = 100 mg.","groups":[{"q":"Working","facts":[{"t":"Convert: **0.1 g × 1000 = 100 mg**","of":[0]},{"t":"**100 mg ÷ 20 mg × 2 mL**","of":[1]},{"t":"= **10 mL**","of":[2]}]}]},"q5f71edd4b2":{"id":"calcs:state the body weight dosing formula and","title":"Body-weight dosing: Wei’s ampicillin","hook":"Dose per kg × kg.","groups":[{"q":"The formula","facts":[{"t":"**Dose per kg** × **body weight** = the dose","of":[0]},{"t":"Read “/” as “**per**”: 10 mg/kg = 10 mg **per kilogram**","of":[1]}]},{"q":"Wei","facts":[{"t":"**10 mg/kg × 30 kg = 300 mg**","of":[2]}]}]},"qf641d3f1f7":{"id":"calcs:naveen weighs 40 kg and is prescribed","title":"Naveen’s prednisone: three steps","hook":"Per day, then per dose, then tablets.","groups":[{"q":"The three steps","facts":[{"t":"1 **Daily dose**: **40 kg × 1 mg/kg/day = 40 mg**","of":[0]},{"t":"2 **Single dose**: **40 mg ÷ 2 doses = 20 mg**","of":[1]},{"t":"3 Tablets: **20 mg ÷ 5 mg × 1 tablet = 4 tablets**","of":[2]}]}]},"qb508f50228":{"id":"calcs:state the iv drip rate formula and","title":"Drip rate: formula, factor vs rate","hook":"The factor = how BIG a drop is. The rate = how FAST they fall.","groups":[{"q":"The formula","facts":[{"t":"**Volume** (mL) × **drop factor** ÷ **time (hours) × 60**","of":[0]}]},{"q":"Drop factor vs drip rate","facts":[{"t":"**Drop factor**: **drops/mL**, how **big** the drops are","of":[1]},{"t":"Fixed by the **giving set**; you are always given it","of":[1]},{"t":"**Drip rate**: **drops/min**, how **fast** they are delivered","of":[2]},{"t":"The nurse **calculates** it; it is **per minute**","of":[2,3]}]}]},"q5719ba2ab6":{"id":"calcs:tania is prescribed sodium chloride 0 9","title":"Tania’s drip rate","hook":"Top, bottom, divide, round.","groups":[{"q":"Working","facts":[{"t":"Top: **1000 mL × 60 drops/mL = 60,000 drops**","of":[0]},{"t":"Bottom: **12 hr × 60 = 720 minutes**","of":[1]},{"t":"**60,000 ÷ 720 = 83.33**","of":[2]},{"t":"Round **down** → **83 drops per minute**","of":[3]}]}]},"q4f612dcec2":{"id":"calcs:mr willis is prescribed sodium chloride 0","title":"Mr Willis’s drip rate","hook":"Litres to mL first.","groups":[{"q":"Working","facts":[{"t":"Convert: **1 L = 1000 mL**","of":[0]},{"t":"Top **20,000 drops**; bottom **300 minutes**","of":[1]},{"t":"**20,000 ÷ 300 = 66.66**","of":[2]},{"t":"Round **up** → **67 drops per minute**","of":[3]}]}]},"qe5f569f91b":{"id":"calcs:explain the order of operations trap in the drip","title":"The drip-rate order-of-operations trap","hook":"Multiply the top, multiply the bottom, THEN divide.","groups":[{"q":"The trap","facts":[{"t":"Do the top and bottom **multiplications first**, **before dividing**","of":[0]},{"t":"Typing **1000 × 60 ÷ 12 × 60** gives **300,000 drops/min**","of":[1]},{"t":"… because it did **60 ÷ 12 first**","of":[2]}]},{"q":"The right order","facts":[{"t":"**60,000** on top; **720** on the bottom","of":[3]},{"t":"**60,000 ÷ 720 = 83.33** drops/min","of":[3]}]}]},"qb618ea1afc":{"id":"calcs:what does the ratio 1 1000 mean","title":"Adrenaline 1:1000","hook":"1 g in 1000 mL = 1 mg in 1 mL.","groups":[{"q":"What it means","facts":[{"t":"**1:1000** = **1 mg in 1 mL**","of":[0]}]},{"q":"How it is derived","facts":[{"t":"Literally **1 g in 1000 mL**","of":[1]},{"t":"**1 g × 1000 = 1000 mg**: 1000 mg:1000 mL","of":[2]},{"t":"**Dividing both sides by 1000** → **1 mg:1 mL**","of":[3]},{"t":"Use the **mg/mL** on the packaging for calculations","of":[4]}]}]},"q62abbac6f5":{"id":"calcs:mrs dell needs adrenaline 0 7 mg","title":"Mrs Dell’s adrenaline","hook":"1:1000 is 1 mg/mL, so mg = mL.","groups":[{"q":"Working","facts":[{"t":"**1:1000** = **1 mg/1 mL**; use the standard formula","of":[0]},{"t":"**0.7 mg ÷ 1 mg × 1 mL**","of":[1]},{"t":"= **0.7 mL**","of":[2]}]}]},"q0791d284dd":{"id":"calcs:mr singh is prescribed 4 mg of","title":"Mr Singh’s diluted morphine","hook":"Add first: 1 + 9 = 10 mL.","groups":[{"q":"Working","facts":[{"t":"Do the **addition first**: ampoule + water = **10 mL total**","of":[0]},{"t":"The syringe holds **5 mg in 10 mL**","of":[1]},{"t":"**4 mg ÷ 5 mg × 10 mL = 8 mL**","of":[2]}]}]},"qf3a1bafa88":{"id":"calcs:explain the order of operations trap in a","title":"The dilution order-of-operations trap","hook":"Add the volumes BEFORE the formula.","groups":[{"q":"The trap","facts":[{"t":"Do the **addition first**, before the formula","of":[0]},{"t":"**3 ÷ 10 × 9 + 1** gives **3.7 mL**: an **overdose**","of":[1]},{"t":"… the calculator **adds the 1 last**","of":[1]}]},{"q":"The right order","facts":[{"t":"**9 mL + 1 mL = 10 mL**","of":[2]},{"t":"**3 mg ÷ 10 mg × 10 mL = 3 mL**","of":[2]}]}]},"qdc034fedb8":{"id":"calcs:5 year old sophie is charted amoxicillin","title":"Sophie’s amoxicillin, and the trap","hook":"The volume is the 5 mL the strength comes in, never the bottle.","groups":[{"q":"Working","facts":[{"t":"Want **400 mg**; got **250 mg**; volume **5 mL**, **not 150 mL**","of":[0]},{"t":"**400 mg ÷ 250 mg × 5 mL = 8 mL**","of":[1]}]},{"q":"The trap","facts":[{"t":"Using the **whole bottle** gives **240 mL**","of":[2]},{"t":"The checklist should stop it: a **very unusual dose**","of":[2]},{"t":"The whole bottle works only with an **extra step**; it **risks error**","of":[3]}]}]},"qda34801980":{"id":"calcs:state the two rounding rules for this","title":"The two rounding rules","hook":"Never round a dose; always round a drip.","groups":[{"q":"The two rules","facts":[{"t":"**Do not round** medication **volumes** or **tablet numbers**","of":[0]},{"t":"**Do round IV drip rates**: you count **whole drops**","of":[1]}]},{"q":"How to round a drip rate","facts":[{"t":"**.4 or lower** rounds **down**; **.5 or higher** rounds **up**","of":[2]},{"t":"e.g. **66.666** drops → **67 drops/min**","of":[2]}]}]},"q90db56bee0":{"id":"calcs:what is a red herring in a","title":"Red herrings in calculations","hook":"Not every number in the question belongs in the formula.","groups":[{"q":"What it is","facts":[{"t":"A **name or number** that **does not relate** to your formula","of":[0]}]},{"q":"The deck’s two examples","facts":[{"t":"The IV fluid’s **concentration** (**Dextrose 5%**) when finding a **drip rate**","of":[1]},{"t":"The **frequency** (**tds**) when finding a **single dose**","of":[2]}]}]},"qd8c3a28515":{"id":"pk1:define pharmacokinetics and name its four processes","title":"Pharmacokinetics: the four processes","hook":"In, around, changed, out: ADME.","groups":[{"q":"Definition","facts":[{"t":"“**What the body does to the drug**”","of":[0]},{"t":"The **passage of a drug through the body**","of":[0]}]},{"q":"The four processes","facts":[{"t":"**Absorption**: the **entry** of a drug **into the bloodstream**","of":[1]},{"t":"**Distribution**: between the **blood and body tissues**","of":[2]},{"t":"**Metabolism**: **modification**, usually by the **liver**","of":[3]},{"t":"**Excretion**: **removal** from the body","of":[4]}]}]},"q11540f4416":{"id":"pk1:define absorption which route does not require","title":"Absorption, and the route that skips it","hook":"IV goes straight in: nothing to absorb.","groups":[{"q":"Definition","facts":[{"t":"**Unchanged drug** reaches the **bloodstream**","of":[0]},{"t":"… after **administration and dissolution**","of":[0]}]},{"q":"The route that does not need it","facts":[{"t":"Every route **except the intravenous**","of":[1]},{"t":"**IV** medications **enter the bloodstream directly**","of":[2]}]}]},"qfa730430c6":{"id":"pk1:name the seven factors affecting absorption listed","title":"Seven factors affecting absorption","hook":"Route, blood flow, membrane, formulation, solubility, gut, pH.","groups":[{"q":"The seven factors","facts":[{"t":"**Route** of administration","of":[0]},{"t":"**Blood flow** at the site","of":[1]},{"t":"**Nature of the membrane**","of":[2]},{"t":"**Medication formulation**","of":[3]},{"t":"**Solubility** of the drug","of":[4]},{"t":"**GI tract status**","of":[5]},{"t":"**pH of the small intestine**","of":[6]}]}]},"qfc435fb413":{"id":"pk1:explain how the nature of the membrane","title":"How the membrane affects absorption","hook":"Bigger and thinner = faster.","groups":[{"q":"Surface area","facts":[{"t":"**Greater surface area = greater absorption**","of":[0]},{"t":"e.g. the **small intestine** (**villi**) vs the **oral mucosa**","of":[0]}]},{"q":"Thickness","facts":[{"t":"A **thinner** membrane = **faster** absorption","of":[1]},{"t":"e.g. the **single layer** of the small intestine’s **epithelium**","of":[1]},{"t":"**Multi-layered**, e.g. the **palms**: **slower**","of":[2]}]}]},"q52e7a7046e":{"id":"pk1:why are lipid soluble drugs absorbed more","title":"Why lipid-soluble drugs absorb faster","hook":"Membranes are fat, so fat-soluble drugs slip through.","groups":[{"q":"Why","facts":[{"t":"**Solubility**: being **dissolved into a solution**","of":[0]},{"t":"Cell membranes are a **lipid bilayer**","of":[1]},{"t":"So **lipid-soluble** drugs are **rapidly absorbed**; **water-soluble** poorly","of":[2]}]}]},"q52243cc5d9":{"id":"pk1:describe how blood flow affects absorption and","title":"Blood flow and absorption","hook":"More blood, faster in. Shock slows an IM injection.","groups":[{"q":"How","facts":[{"t":"Absorption **depends on the blood flow** at the site","of":[0]},{"t":"**High blood supply** → faster, e.g. **sublingual**","of":[1]},{"t":"**Low blood supply** → slower, e.g. **topical**","of":[2]}]},{"q":"A disease example","facts":[{"t":"**Poor peripheral circulation** in **shock** slows **intramuscular injections**","of":[3]}]}]},"q2e896a362b":{"id":"pk1:give two examples of food affecting drug","title":"Food affecting absorption: two examples","hook":"Milk with tetracycline; tea with iron.","groups":[{"q":"Two examples","facts":[{"t":"**Dairy** binds **tetracyclines** and can **prevent absorption**","of":[0]},{"t":"**Tannins** in **tea and coffee** bind **iron**","of":[1]}]}]},"qf9fc2de66f":{"id":"pk1:define bioavailability what is it for an","title":"Bioavailability: IV and oral","hook":"IV 100%; by mouth, what gets absorbed AND survives the liver.","groups":[{"q":"Definition","facts":[{"t":"How much drug **actually reaches the bloodstream**","of":[0]}]},{"q":"IV","facts":[{"t":"**Intravenous** medications: **bioavailability = 100%**","of":[1]}]},{"q":"Oral: two things decide it","facts":[{"t":"How much is **absorbed in the GI tract**","of":[2]},{"t":"How much **escapes** being **broken down by the liver**","of":[3]}]}]},"qddeb2457cc":{"id":"pk1:explain the hepatic first pass effect and","title":"First-pass effect: the 100 mg example","hook":"100 in, 20 lost in the gut, 60 lost in the liver: 20% arrives.","groups":[{"q":"What it is","facts":[{"t":"Taken **orally**: absorbed from the gut, then a **first pass through the liver**","of":[0]},{"t":"The liver **acts like a filter**: only **a portion** arrives unchanged","of":[1]}]},{"q":"The 100 mg example","facts":[{"t":"**100 mg** tablet: **20 mg is not absorbed**; **80 mg reaches the liver**","of":[2]},{"t":"The liver **breaks down 60 mg**: only **20 mg** gets through","of":[3]},{"t":"A **bioavailability of 20%**","of":[4]}]}]},"q13f14e2bc3":{"id":"pk1:explain plasma protein binding and why it","title":"Plasma protein binding and competition","hook":"Bound drug waits; free drug works.","groups":[{"q":"Binding","facts":[{"t":"Many drugs **bind reversibly** to **plasma proteins**, mainly **albumin**","of":[0]},{"t":"Only **free** (**unbound**) drug reaches the **tissues** to act","of":[1]}]},{"q":"Why it matters","facts":[{"t":"Some are **highly protein-bound**: **warfarin**, **99%**","of":[2]},{"t":"**Binding is dynamic**: freed drug moves to **replace what is lost**","of":[3]},{"t":"Two drugs can **compete for the same binding site**","of":[4]},{"t":"… which can **increase the amount of free drug**","of":[4]}]}]},"q28e638b95a":{"id":"pk1:compare the blood brain barrier and the","title":"Blood–brain barrier vs placental barrier","hook":"The brain is picky; the placenta lets almost anything through.","groups":[{"q":"Blood–brain barrier","facts":[{"t":"**Limits entry** into the brain; lets **oxygen and glucose** through","of":[0]},{"t":"Only **small, lipid-soluble** drugs pass","of":[1]},{"t":"**Tightly joined** capillary cells; a **thick basement membrane**","of":[1]},{"t":"Can be **disrupted in illness**, e.g. **meningitis**","of":[2]}]},{"q":"Placental barrier","facts":[{"t":"Separates **maternal and foetal blood**","of":[3]},{"t":"**Non-selective**: it allows **many different drugs** to cross","of":[3]},{"t":"**Lipid-soluble drugs cross** easily","of":[4]}]}]},"q4b4981ea17":{"id":"pk1:name three tissues where drugs get concentrated","title":"Where drugs concentrate","hook":"Bone, fat, thyroid.","groups":[{"q":"Three tissues, with examples","facts":[{"t":"**Bone**: **tetracycline**, which can **discolour children’s teeth**","of":[0]},{"t":"**Adipose** (fat): **lipid-soluble** drugs, e.g. **diazepam**","of":[1]},{"t":"**Thyroid gland**: medicines containing **iodine**","of":[2]}]}]},"qa0b5c2c431":{"id":"pk2:define drug metabolism name the main organ","title":"Drug metabolism: organs and metabolites","hook":"The liver makes drugs weaker, wetter and safer, mostly.","groups":[{"q":"Definition","facts":[{"t":"**Biological transformation** into an **inactive and water-soluble** compound","of":[0]},{"t":"Carried out by **enzymes**","of":[0]}]},{"q":"The organs","facts":[{"t":"The main organ: the **liver**","of":[1]},{"t":"Also the **kidneys**, **lungs**, **intestinal mucosa**","of":[1]}]},{"q":"A metabolite is usually","facts":[{"t":"**More water-soluble**, **less active**, **less toxic**","of":[2]},{"t":"Exceptions: some drugs are **activated** by the liver; a few turn **toxic**","of":[3]}]}]},"q1e3d6b7a23":{"id":"pk2:name the five sources of inter individual","title":"Why metabolism varies between people","hook":"Genes, environment, disease, age & gender, hormones.","groups":[{"q":"The five sources","facts":[{"t":"**Genetics**","of":[0]},{"t":"**Environmental factors**","of":[1]},{"t":"**Disease states**","of":[2]},{"t":"**Age and gender**","of":[3]},{"t":"**Hormonal changes**","of":[4]}]}]},"q7694e0618d":{"id":"pk2:contrast enzyme inducers and enzyme inhibitors including","title":"Enzyme inducers vs inhibitors","hook":"Inducer = faster breakdown, less drug. Inhibitor = slower breakdown, more drug.","groups":[{"q":"Enzyme inducer","facts":[{"t":"**Accelerates metabolism**: **decreases the amount of drug** in the blood","of":[0]},{"t":"A **higher dose** may be needed","of":[1]}]},{"q":"Enzyme inhibitor","facts":[{"t":"**Slows down metabolism**: **increases the amount of drug** in the blood","of":[2]},{"t":"**Toxicity may increase**","of":[3]}]},{"q":"What causes either","facts":[{"t":"**Diet**, **co-administered drugs**, **alcohol**, **smoking**","of":[4]}]}]},"q527b74ddf3":{"id":"pk2:explain how heart failure and cirrhosis each","title":"Heart failure, cirrhosis and metabolism","hook":"A sick liver, or poor blood to it = more active drug.","groups":[{"q":"Heart failure","facts":[{"t":"**Decreased liver perfusion** → **reduced liver enzyme activity**","of":[0]},{"t":"→ **more active drug in the blood**","of":[0]}]},{"q":"Cirrhosis","facts":[{"t":"**Liver scarring** → **reduced clearance**","of":[1]},{"t":"→ **more active drug in the blood**","of":[1]}]},{"q":"What it means for care","facts":[{"t":"**Reduced doses**; **close monitoring**","of":[2]},{"t":"Consider **contraindications** and **alternative medications**","of":[2]}]}]},"qbd346f21eb":{"id":"pk2:name the main medication routes that avoid","title":"Routes that avoid first-pass metabolism","hook":"Anything that doesn’t go down the gut into the portal vein.","groups":[{"q":"The routes","facts":[{"t":"**Sublingual** and **buccal**","of":[0]},{"t":"**IV**, **IM**, **SC**","of":[1,2,3]},{"t":"**Inhalation**; **intranasal**","of":[4,5]},{"t":"**Transdermal** patches; **rectal**","of":[6,7]}]},{"q":"Why","facts":[{"t":"They **do not travel through the portal vein**","of":[8]}]}]},"q77386ced56":{"id":"pk2:list the routes of drug excretion naming","title":"Routes of drug excretion","hook":"Kidneys first; then bile, breath, bowel, milk, sweat.","groups":[{"q":"The routes","facts":[{"t":"**Kidneys** (**main organ**) → **urine**","of":[0]},{"t":"**Liver** → **bile** → **faeces**","of":[1]},{"t":"**Lungs** → **expired air** (the breath test)","of":[2]},{"t":"**Bowel**; **breast milk**","of":[3,4]},{"t":"**Sweat and saliva** (minimal)","of":[5]}]}]},"q233506a1bc":{"id":"pk2:name the four factors affecting drug excretion","title":"Four factors in kidney excretion","hook":"Water-soluble out; fat-soluble back in; bound stays; bad kidneys keep it.","groups":[{"q":"The four factors","facts":[{"t":"**Water-soluble** drugs: **better excretion**","of":[0]},{"t":"**Lipid-soluble** drugs: **poorly excreted**, **reabsorbed**","of":[1]},{"t":"**Protein-bound** drugs: **not excreted**, **circulate longer**","of":[2]},{"t":"**Impaired renal function**: **reduced excretion**","of":[3]},{"t":"It matters in **renal failure**, **neonates**, the **elderly**","of":[3]}]}]},"q630ef1901e":{"id":"pk2:distinguish excretion elimination and clearance","title":"Excretion, elimination and clearance","hook":"Excretion = out. Elimination = metabolised + out. Clearance = how fast.","groups":[{"q":"The three terms","facts":[{"t":"**Excretion**: **physical removal** from the body","of":[0]},{"t":"**Elimination** = **metabolism + excretion**","of":[1]},{"t":"Eliminated once **metabolised into an inactive metabolite**","of":[2]},{"t":"**Clearance**: the **rate (speed) of elimination**; it is **irreversible**","of":[3]}]}]},"q38e2e8cc59":{"id":"pk2:compare hepatic clearance and renal clearance","title":"Hepatic vs renal clearance","hook":"Liver: metabolise (and a little bile). Kidney: urine (some comes back).","groups":[{"q":"Hepatic clearance","facts":[{"t":"In the **liver**: **metabolism** (major) and excretion in the **bile** (minor)","of":[0]},{"t":"High hepatic clearance: **all of the drug** through the liver is **metabolised**","of":[1]}]},{"q":"Renal clearance","facts":[{"t":"In the **kidneys**: **excretion into the urine**","of":[2]},{"t":"**Some reabsorption** back into the **plasma**","of":[2]}]}]},"qfde9358940":{"id":"pk2:define half life and steady state and","title":"Half-life and steady state","hook":"Half gone each half-life; in = out after 3–5 of them.","groups":[{"q":"Half-life","facts":[{"t":"Time for the **plasma drug concentration** to fall **by one-half**","of":[0]},{"t":"Tells us **how fast the drug leaves** the body","of":[0]}]},{"q":"Steady state","facts":[{"t":"The **rate of drug in** = the **rate of drug out**","of":[1]},{"t":"Reached after about **3–5 half-lives**","of":[2]}]}]},"q03fc1f094a":{"id":"pk2:what is a dosing regimen for and","title":"What a dosing regimen is for","hook":"Keep the level in range, for this drug and this patient.","groups":[{"q":"What it is for","facts":[{"t":"ADME affects **how much** reaches the blood and **how long it acts**","of":[0]},{"t":"A regimen keeps levels **within the therapeutic range**","of":[1]}]},{"q":"What it is individualised against","facts":[{"t":"**Each medication** (in **clinical trials**)","of":[2]},{"t":"**Each patient**: **age**, **interactions**, **liver** and **kidney function**","of":[2]},{"t":"e.g. **amoxicillin**, **500 mg** orally **every 8 hours** for **5 days**","of":[3]}]}]},"qd464d3b1f3":{"id":"pk2:define the therapeutic range and explain therapeutic","title":"Therapeutic range and drug monitoring","hook":"Effective but not toxic: check the peak and the trough.","groups":[{"q":"Therapeutic range","facts":[{"t":"The **plasma concentration range** giving the **desired therapeutic effect** (**efficacy**)","of":[0]},{"t":"… **without causing toxicity** (**safety**)","of":[0]}]},{"q":"Therapeutic drug monitoring","facts":[{"t":"For drugs with a **narrow therapeutic range**, e.g. **warfarin**","of":[1]},{"t":"Measures the **peak** and **trough** concentration","of":[2]},{"t":"Keeps the level **safe and effective**","of":[3]}]}]},"qeef3bc1876":{"id":"pk2:summarise the pharmacokinetics of paracetamol under all","title":"Paracetamol under ADME","hook":"Fast in, spreads wide, the liver makes a toxic bit, out in the urine.","groups":[{"q":"Absorption","facts":[{"t":"**Rapidly absorbed** by mouth","of":[0]},{"t":"**Delayed** by slower **gastric emptying** (**food**)","of":[0]}]},{"q":"Distribution","facts":[{"t":"**Distributed widely**; only a **small proportion is protein-bound**","of":[1]}]},{"q":"Metabolism","facts":[{"t":"Mainly in the **liver**","of":[2]},{"t":"A **hepatotoxic metabolite** can build up after **overdose**: **liver damage**","of":[2]}]},{"q":"Excretion","facts":[{"t":"**Metabolites** in the **urine**; **half-life** **1–3 hours**","of":[3]},{"t":"Most of a dose is gone **within 24 hours**","of":[4]}]}]},"qffc4f43c77":{"id":"pd:define pharmacodynamics and state the four questions","title":"Pharmacodynamics: the four questions","hook":"Where, how, what changes, and over time.","groups":[{"q":"Definition","facts":[{"t":"**Drug–target interactions**, **mechanisms of action**, **biological effects**","of":[0]},{"t":"“**What the drug does to the body**”","of":[0]}]},{"q":"The four questions","facts":[{"t":"**Where** exactly does it act?","of":[1]},{"t":"**How** does it act?","of":[2]},{"t":"What **changes in function** will it cause?","of":[3]},{"t":"What happens to its effects **with time**?","of":[4]}]}]},"q9c32b603c9":{"id":"pd:distinguish selectivity from specificity and give the","title":"Selectivity vs specificity","hook":"Selectivity counts TARGETS; specificity counts EFFECTS.","groups":[{"q":"Selectivity","facts":[{"t":"The number of **targets** a drug interacts with","of":[0]},{"t":"**High selectivity**: prefers **one target**","of":[0]}]},{"q":"Specificity","facts":[{"t":"The number of **effects** it produces","of":[1]},{"t":"**No drug is completely specific**","of":[2]}]},{"q":"Example","facts":[{"t":"**Salbutamol**: selective for **beta-2 receptors** in **lung tissue**","of":[3]},{"t":"… **little effect** on the **heart**","of":[3]}]}]},"q6312906ffc":{"id":"pd:define affinity efficacy and potency","title":"Affinity, efficacy and potency","hook":"How tightly it grips, how hard it pushes, how much you need.","groups":[{"q":"The three terms","facts":[{"t":"**Affinity**: **how strongly the drug binds** to its target","of":[0]},{"t":"**Efficacy**: its ability to **activate its target** and **produce a biological response**","of":[1]},{"t":"**Maximal efficacy**: the **upper limit** of the drug’s action","of":[1]},{"t":"**Potency**: the **amount of drug required** for a given effect","of":[2]},{"t":"**High potency** = the same effect at a **lower dose**","of":[2]}]}]},"q6f33841459":{"id":"pd:name the four main regulatory proteins drugs","title":"Four drug targets, with examples","hook":"Transporters, ion channels, enzymes, receptors.","groups":[{"q":"The four targets","facts":[{"t":"**Transporter**: **fluoxetine** blocks the **serotonin transporter**","of":[0]},{"t":"**Ion channel**: **amlodipine** blocks **calcium** entry","of":[1]},{"t":"**Enzyme**: **ibuprofen** inhibits **COX enzymes**","of":[2]},{"t":"**Receptor**: a protein a drug **binds to**, triggering a **signal**","of":[3]}]}]},"qdd949c891b":{"id":"pd:explain the difference between an agonist and","title":"Agonist vs antagonist: lock and key","hook":"Agonist: the key opens the door. Antagonist: the key fits but won’t turn.","groups":[{"q":"Agonist","facts":[{"t":"**Binds to and activates** a receptor","of":[0]},{"t":"Has **affinity** and **efficacy**: the key **opens the door**","of":[1]},{"t":"e.g. **salbutamol** relaxes the **airways**","of":[1]}]},{"q":"Antagonist","facts":[{"t":"Binds and **blocks access**, but **does not elicit a response**","of":[2]},{"t":"Has **affinity** but **no efficacy**: the door **will not open**","of":[3]},{"t":"e.g. **metoprolol**, a **beta blocker**","of":[3]}]}]},"q654aedd34e":{"id":"pd:explain receptor up regulation and down regulation","title":"Receptor up- and down-regulation","hook":"Blocked → more receptors. Over-stimulated → fewer.","groups":[{"q":"The idea","facts":[{"t":"Cells can **change how many receptors** they have","of":[0]}]},{"q":"Up-regulation","facts":[{"t":"**More receptors**: the cell is **more sensitive**","of":[1]},{"t":"When receptors are repeatedly **blocked**","of":[1]},{"t":"e.g. **rebound hypertension** after stopping **beta-blockers**","of":[2]}]},{"q":"Down-regulation","facts":[{"t":"**Fewer receptors**: the cell is **less responsive**","of":[3]},{"t":"When receptors are repeatedly **stimulated**","of":[3]},{"t":"e.g. **chronic opioid use** → **tolerance**","of":[4]}]}]},"q7d8600130c":{"id":"pd:what are non specific drug actions give","title":"Non-specific drug actions","hook":"No target: chemistry, physics or the environment does the work.","groups":[{"q":"What they are","facts":[{"t":"Drugs that do not rely on **specific targets**","of":[0]},{"t":"They act through **chemical reactions**, **physical properties** or the **environment**","of":[0]}]},{"q":"Two examples","facts":[{"t":"**Activated charcoal** **absorbs toxins** from the gut","of":[1]},{"t":"**Calcium carbonate** chews **neutralise stomach acid**","of":[2]}]}]},"qd28d44d8ac":{"id":"pd:describe the dose response relationship","title":"The dose–response relationship","hook":"Little, then more, then the ceiling.","groups":[{"q":"What it describes","facts":[{"t":"How the **size of a drug’s effect** changes as the **dose** changes","of":[0]}]},{"q":"The curve","facts":[{"t":"At **low doses**: **little or no effect**","of":[1]},{"t":"As the dose **increases**, the **response increases**","of":[2]},{"t":"Then **maximal efficacy**: more drug **will not increase the effect**","of":[3]}]}]},"q2252f448c9":{"id":"pd:define the therapeutic range in pharmacodynamic terms","title":"Therapeutic range: MEC and MTC","hook":"Between the lowest that works and the lowest that harms.","groups":[{"q":"The range","facts":[{"t":"A measure of the **safety margin**: between **efficacy and toxicity**","of":[0]},{"t":"A **wider range** = a **safer drug**","of":[1]}]},{"q":"Its two edges","facts":[{"t":"**MEC**: the **lowest plasma concentration** that is **therapeutic** (beneficial)","of":[2]},{"t":"**MTC**: the lowest concentration where **toxic** (harmful) **effects begin**","of":[3]}]}]},"q6e353efcc0":{"id":"pd:explain how pharmacokinetics and pharmacodynamics are linked","title":"How PK and PD are linked","hook":"How much gets there decides how fast, how strong, how long.","groups":[{"q":"The link","facts":[{"t":"The **rate** and **extent** of the response **depends** on **pharmacokinetics**","of":[0]},{"t":"PK decides **how much drug reaches the site of action**","of":[1]},{"t":"That shapes the **onset, intensity and duration** of the effect","of":[2]},{"t":"PK explains why **responses change over time**","of":[3]}]}]},"qe12cc65de8":{"id":"pd:define an adverse effect and distinguish it","title":"Adverse effect vs adverse drug event","hook":"Effect = caused by the drug. Event = around the drug (often human error).","groups":[{"q":"Adverse effect","facts":[{"t":"A **harmful effect** suspected to be **caused by a medicine or vaccine**","of":[0]},{"t":"**All medications** cause them in **some people**","of":[1]},{"t":"**Mild** (nausea) to **serious** (liver injury); some occur **unexpectedly**","of":[2]},{"t":"Also called **side effects**; **adverse effect** is **preferred**","of":[3]}]},{"q":"Adverse drug event","facts":[{"t":"An **injury related to the drug**, **not always due to** it","of":[4]},{"t":"e.g. **errors in prescribing**, dispensing or administration","of":[4]}]}]},"qb10679ad9f":{"id":"pd:list the six person related risk factors","title":"Six person-related risk factors","hook":"Age, sex, organs, genes, history, polypharmacy.","groups":[{"q":"The six","facts":[{"t":"**Age**: **neonates** or **older persons**","of":[0]},{"t":"**Sex**: **female** more susceptible","of":[1]},{"t":"**Organ health**: **kidney or liver disease**","of":[2]},{"t":"**Genetic factors**","of":[3]},{"t":"**History of prior adverse effects**","of":[4]},{"t":"**Polypharmacy** (**five drugs or more**)","of":[5]}]}]},"qaea1d6df65":{"id":"pd:list the five drug related risk factors","title":"Five drug-related risk factors","hook":"Chemistry, class, route, dose, duration.","groups":[{"q":"The five","facts":[{"t":"**Chemical characteristics**: **large molecules**, **low selectivity**","of":[0]},{"t":"**Drug class**: e.g. **anticoagulants**: **bleeding risk**","of":[1]},{"t":"**Route**: **oral** has a **lower allergy risk** than **IV**","of":[2]},{"t":"**Dose**: **higher doses** increase risk","of":[3]},{"t":"**Duration and frequency**","of":[4]}]}]},"q52a2d2599e":{"id":"pd:give the lecture s two examples of","title":"Two pharmacodynamic interactions","hook":"Two blood thinners add up; a blocker cancels a reliever.","groups":[{"q":"What they are","facts":[{"t":"One drug **directly alters the effect** of another","of":[0]}]},{"q":"Warfarin + aspirin","facts":[{"t":"**Increased risk of bleeding**","of":[1]},{"t":"Both **inhibit clotting**: an **additive effect**","of":[1]}]},{"q":"Metoprolol + salbutamol","facts":[{"t":"**Reduced effect of salbutamol** in asthma","of":[2]},{"t":"Salbutamol is an **agonist**; metoprolol **blocks beta receptors** (**antagonist**)","of":[2]}]}]},"qba995693e6":{"id":"pd:what is carm who may report to","title":"CARM: what it is and why it matters","hook":"Document every reaction; report it; CARM follows up the serious ones.","groups":[{"q":"What it is","facts":[{"t":"The **Centre for Adverse Reactions Monitoring**","of":[0]}]},{"q":"Why it matters","facts":[{"t":"**Document all adverse effects**: patients may need **alerts**","of":[1]},{"t":"Reports go to an **online database**; CARM assesses **serious and fatal** events","of":[2]}]},{"q":"Who can report","facts":[{"t":"**Health professionals**, **patients and whānau**","of":[3]}]}]},"qa6ada17019":{"id":"admin:name the five authorised prescribers and the","title":"Authorised and designated prescribers","hook":"Doctors, NPs, dentists, optometrists, midwives; then trained pharmacists and RNs.","groups":[{"q":"The five authorised prescribers","facts":[{"t":"**Doctors**, **nurse practitioners**, **dentists**","of":[0]},{"t":"**Optometrists**, **registered midwives**","of":[0]}]},{"q":"Designated prescribers","facts":[{"t":"**Pharmacist prescribers**","of":[1]},{"t":"**Registered nurse prescribers**: **community health**, **diabetes health**, **primary health**","of":[2,3,4]},{"t":"They complete **additional post-graduate training**","of":[5]}]}]},"q22c3086c1b":{"id":"admin:what can and cannot a registered nurse","title":"What an RN can and cannot do","hook":"Give, monitor, teach; never prescribe or change the order.","groups":[{"q":"The RN’s role","facts":[{"t":"**Administer and monitor** medications; **assess** patients","of":[0]},{"t":"Maintain **documentation**, **safe medication practices**; **educate** patients and whānau","of":[0]}]},{"q":"Cannot","facts":[{"t":"**Cannot prescribe** (unless a **designated nurse prescriber**)","of":[1]},{"t":"**Cannot modify prescriptions**","of":[2]}]},{"q":"Can","facts":[{"t":"**Can administer under standing orders**","of":[3]},{"t":"**May** give on a prescriber’s **verbal order** (phone, emergency)","of":[4]}]},{"q":"Responsibility","facts":[{"t":"**Personally responsible** for **every medication they administer**","of":[5]}]}]},"qc961ce266f":{"id":"admin:list the 8 rights and the 2","title":"The 8 Rights and 2 Checks","hook":"Patient, medication, dose, time, route; refuse, indication, documentation; + expiry, allergies.","groups":[{"q":"The 8 Rights","facts":[{"t":"Right **patient**, **medication**, **dose**, **time**, **route**","of":[0]},{"t":"Right **to refuse**","of":[1]},{"t":"Right **indication**","of":[2]},{"t":"Right **documentation**","of":[3]}]},{"q":"The 2 Checks","facts":[{"t":"Check **expiry**","of":[4]},{"t":"Check **allergies**","of":[5]}]}]},"q05723a7684":{"id":"admin:how is patient identity checked before giving","title":"Checking patient identity","hook":"Three identifiers, every time: band + name + DOB, or a photo.","groups":[{"q":"The rule","facts":[{"t":"Use **three identifiers**","of":[0]},{"t":"The **NHI** is part of it in Aotearoa","of":[1]}]},{"q":"In hospital","facts":[{"t":"Check the **identification band**","of":[2]},{"t":"Ask them to state their **full name and date of birth**","of":[2]}]},{"q":"In aged care","facts":[{"t":"Residents may not wear bands: e.g. **photographic verification**","of":[3]}]}]},"qe11a4ea2b0":{"id":"admin:when are the three medication checks performed","title":"The three medication checks","hook":"Before preparing, after preparing, before putting it back.","groups":[{"q":"The three checks (label against chart)","facts":[{"t":"Check the **label** against the **medication chart**","of":[0]},{"t":"1 **Before preparing**","of":[1]},{"t":"2 **After preparing**","of":[2]},{"t":"3 **Before replacing the container**","of":[3]}]},{"q":"The rule","facts":[{"t":"**Only administer medications that you prepare**","of":[4]}]},{"q":"The aged-care version","facts":[{"t":"From **storage**; against the **order**; **re-check** **prior to administering**","of":[5]}]}]},"qa6fe8a1c17":{"id":"admin:what must a nurse do about the","title":"The right dose","hook":"Know the range, calculate, measure, cut only scored, ask before crushing.","groups":[{"q":"The points","facts":[{"t":"Know the **usual dose range**; if unsure, check the **NZ Formulary**","of":[0]},{"t":"Use **medication calculations**","of":[1]},{"t":"**Prepare** medications **accurately**: **syringes**, **graduated cups**","of":[2]},{"t":"Cut with a **tablet cutter**, only if it has a **score mark**","of":[3]},{"t":"**Check with a pharmacist before crushing**","of":[4]},{"t":"Ask the prescriber for a better **formulation**, e.g. **a liquid**","of":[5]}]}]},"q06c334d139":{"id":"admin:explain the right time including the tolerance","title":"The right time","hook":"Prescribed time and frequency, within 30 minutes, in 24-hour time.","groups":[{"q":"The rule","facts":[{"t":"The **prescribed time AND frequency**","of":[0]},{"t":"It depends on **food**, **drug monitoring**, the **last dose**","of":[1]},{"t":"Some are **time-critical**, e.g. **insulin before meals**","of":[2]}]},{"q":"The tolerance","facts":[{"t":"Regular medicines: **within 30 minutes** of the time","of":[3]}]},{"q":"prn timing, and the clock","facts":[{"t":"**prn** needs **clinical judgement**, e.g. a **pain assessment**","of":[4]},{"t":"Always use **24-hour time**","of":[5]}]}]},"qa2612673f7":{"id":"admin:what must the nurse do if no","title":"No route on the prescription","hook":"No route, no dose: withhold and call.","groups":[{"q":"The rule","facts":[{"t":"The order **must include a route**, **appropriate** for drug and patient","of":[0]}]},{"q":"What the nurse does","facts":[{"t":"**Withhold the medication**","of":[1]},{"t":"**Contact the prescriber** for **clarification**","of":[2]},{"t":"Can’t take it by that route? **Discuss with the prescriber**","of":[3]}]}]},"qa93e8eed60":{"id":"admin:describe the nurse s actions when a","title":"When a patient refuses","hook":"Explain, document, inform, discard.","groups":[{"q":"The right","facts":[{"t":"They may refuse, unless under the **Mental Health Act**","of":[0]}]},{"q":"The nurse’s actions","facts":[{"t":"**Explain the consequences**, e.g. more symptoms","of":[1]},{"t":"**Document** the patient’s **reason for refusal**","of":[2]},{"t":"**Inform** the **next shift RN**, the **prescriber**, maybe whānau","of":[3]},{"t":"**Discard refused medications**: **do not store them**","of":[4]}]}]},"qc5348e92ac":{"id":"admin:what does right indication require of the","title":"The right indication","hook":"Know WHY, especially for prn.","groups":[{"q":"What it requires","facts":[{"t":"The nurse is **accountable** and needs **knowledge about the indication**","of":[0]},{"t":"Is it being given for the **right reason**?","of":[1]},{"t":"Especially for **prn medications**: **nurse-led assessment**","of":[2]}]}]},"qdfd433ae73":{"id":"admin:state the rules for right documentation including","title":"The rules of right documentation","hook":"Right after, never before; say why if not given.","groups":[{"q":"The rules","facts":[{"t":"Record **immediately after administration**: **date, time, dose, who**","of":[0]},{"t":"**Never document before** you have given it","of":[1]},{"t":"A dose **not given**: document it **and the reason why**","of":[2]},{"t":"**prn**: the **assessment before** and the **evaluation after**","of":[3]},{"t":"**Discuss and document any errors**","of":[4]}]}]},"q24cab9538a":{"id":"admin:explain the expiry date check including the","title":"The expiry date check","hook":"The end of the month; not if repackaged or badly stored.","groups":[{"q":"What it is","facts":[{"t":"How long a medication is **effective and safe**","of":[0]},{"t":"Labelled **exp**, **use by** or **use before**","of":[1]},{"t":"Month only (e.g. **July 2030**): **the end of that month**","of":[2]}]},{"q":"When you cannot rely on it","facts":[{"t":"It has been **repackaged**","of":[3]},{"t":"It has **not been stored as recommended**, e.g. **kept in the fridge**","of":[4]},{"t":"Pharmacist-repackaged: **no longer than 12 months** after dispensing","of":[5]}]}]},"qeb977f317a":{"id":"admin:describe the allergy check including the two","title":"The allergy check","hook":"Charted AND asked. NKA / NKDA.","groups":[{"q":"The check","facts":[{"t":"Allergies are also called **hypersensitivities**","of":[0]},{"t":"**Documented in the medication chart**","of":[1]},{"t":"**And** the nurse should **ask the patient**","of":[2]},{"t":"An allergy is a **contraindication**","of":[4]}]},{"q":"The two acronyms","facts":[{"t":"**NKA** = **no known allergies**","of":[3]},{"t":"**NKDA** = **no known drug allergies**","of":[3]}]}]},"qfd1221083d":{"id":"admin:where does medication administration fit into the","title":"Medicines in the nursing process","hook":"Assess, decide, plan and give, evaluate: ADPIE with medicines.","groups":[{"q":"Assessment","facts":[{"t":"A **health history**: **pregnancy**, **liver disease**","of":[0]},{"t":"What they are **taking**; any **allergies**","of":[0]},{"t":"Any **challenges**: **memory**, **opening containers**; **cultural needs**","of":[1]}]},{"q":"Diagnosis","facts":[{"t":"Decide the **importance** of what you gathered, and its **implications**","of":[2]}]},{"q":"Planning & implementing","facts":[{"t":"Use the **8 Rights**; **prn** and **standing order** medicines appropriately","of":[3]},{"t":"**Advocate** (a **medication review**); **educate**","of":[3]}]},{"q":"Evaluation","facts":[{"t":"The **therapeutic response**; any **adverse effects**","of":[4]},{"t":"Their **knowledge** of the medicine; their ability to **self-manage** it","of":[4]}]}]},"q730cb79618":{"id":"admin:what must the national medication chart contain","title":"What the National Medication Chart holds","hook":"Who the patient is; what, how much, how, when; and who signed.","groups":[{"q":"Patient identification","facts":[{"t":"**Full name**, **NHI number**, **date of birth**","of":[0]},{"t":"**Allergies and adverse reactions**","of":[0]},{"t":"When relevant: **weight**, **height**, **gestational age**","of":[1]}]},{"q":"Prescriber requirements","facts":[{"t":"The **date** written; **medication name**; **dose and units**","of":[2]},{"t":"**Route**; **frequency** or **administration times**","of":[3]},{"t":"The **prescriber’s signature**","of":[4]}]}]},"q8835b46e2b":{"id":"admin:name the five special sections of the","title":"The chart’s five special sections","hook":"Once-only, verbal, prn, fluids, oxygen.","groups":[{"q":"The five sections","facts":[{"t":"**Once-only medicines**","of":[0]},{"t":"**Verbal orders**","of":[1]},{"t":"**PRN medicines**","of":[2]},{"t":"**Fluid and infusion orders**","of":[3]},{"t":"**Oxygen and medical gases**","of":[4]}]},{"q":"The RN’s own charting","facts":[{"t":"A **signature/initials for each dose**","of":[5]},{"t":"**Non-administration codes** when a dose is not given","of":[5]},{"t":"Students also need the “**check**” **initial**","of":[6]}]}]},"q82fc977e06":{"id":"educ:define a medication error and explain how","title":"Medication errors: definition, examples","hook":"Preventable, human, and usually a missed Right or Check.","groups":[{"q":"Definition","facts":[{"t":"Any **preventable event** that may cause **inappropriate medication use** or **harm**","of":[0]},{"t":"Unlike an adverse effect, it is **harm arising from human action**","of":[1]}]},{"q":"Four examples","facts":[{"t":"A drug given despite a **known allergy**","of":[2]},{"t":"A **wrong dosage dispensed**","of":[2]},{"t":"Errors in the **medication calculation**; **deciphering handwriting** wrongly","of":[3]},{"t":"**Documentation errors**: a **dose being duplicated**","of":[4]}]},{"q":"The root","facts":[{"t":"Most trace back to the **8 Rights + 2 Checks**","of":[5]}]}]},"q274429240e":{"id":"educ:name six ways to prevent medication errors","title":"Six ways to prevent medication errors","hook":"Label, dose, decimal, change, new drug, bad writing.","groups":[{"q":"The six, each with its reason","facts":[{"t":"**Check labels**: **similar names** or containers","of":[0]},{"t":"Does the **dose sound right**? Usually **one or two tablets**","of":[1]},{"t":"**Check the decimal point**: **0.1, 1.0 or 10**?","of":[2]},{"t":"**Question sudden changes** in dose","of":[3]},{"t":"**Learn about new medications** first: the **NZ Formulary**","of":[4]},{"t":"Do not try to **decipher illegible writing**: **ask the prescriber**","of":[5]}]}]},"q69e69f0cf6":{"id":"educ:describe the five steps for managing and","title":"Managing a medication error: five steps","hook":"Own it, tell, write, protect the patient, report.","groups":[{"q":"The five steps","facts":[{"t":"1 **Acknowledge** it **immediately**","of":[0]},{"t":"2 **Report promptly**, e.g. to the **charge nurse**","of":[1]},{"t":"3 **Document** it **accurately and objectively**","of":[2]},{"t":"4 **Minimise harm**, e.g. **monitoring**","of":[3]},{"t":"5 Complete an **incident report**","of":[4]}]}]},"qebe3709906":{"id":"educ:what are the consequences of intentional concealment","title":"Concealing a medication error","hook":"Hiding it hurts the patient, and ends in discipline.","groups":[{"q":"What it is","facts":[{"t":"**Not telling** someone when you **know you made an error**","of":[0]}]},{"q":"The consequences","facts":[{"t":"The patient is **more at risk of injury, illness or death**","of":[1]},{"t":"You face **disciplinary action**","of":[2]}]}]},"q9fb884d931":{"id":"educ:explain nursing liability for medication errors","title":"Nursing liability for medication errors","hook":"What you do, what you don’t, what you hand on, what you give.","groups":[{"q":"Who is liable","facts":[{"t":"**Prescribers**, **pharmacists** and **nurses** can all be **held responsible**","of":[0]}]},{"q":"For nurses","facts":[{"t":"Liable for their **actions and omissions**","of":[1]},{"t":"Liable for the **duties they delegate**","of":[2]},{"t":"**Personally responsible** for **every medication they administer**","of":[3]}]}]},"qa0f47b8e6a":{"id":"educ:name the three steps to meeting health","title":"Health literacy: Ask, Build, Check","hook":"Ask what they already know before you teach.","groups":[{"q":"The three steps","facts":[{"t":"**Ask**, **Build**, **Check**","of":[0]}]},{"q":"Step 1: Ask, and why","facts":[{"t":"**Ask questions** to find out **what people know**","of":[1]},{"t":"Connect new information to their **prior knowledge**","of":[2]},{"t":"**Avoid repeating** what they know, or they **disengage**","of":[3]},{"t":"Ask **who**: the individual, or **whānau**","of":[4]},{"t":"**Open-ended questions**; ask for a **demonstration**","of":[5]}]}]},"q224456a061":{"id":"educ:what does step 2 build involve","title":"Health literacy step 2: Build","hook":"Their words, pauses, plain language, pictures.","groups":[{"q":"Build","facts":[{"t":"**Connect new information** to what they **already know**","of":[0]},{"t":"Use the **words and phrases** the person used","of":[1]},{"t":"**Pause** after new information","of":[2]},{"t":"Explain the **next steps**: effects, **adverse effects**, **follow-up**","of":[3]},{"t":"**Explain and repeat** key terms, e.g. the **generic medication name**","of":[4]},{"t":"**Avoid medical jargon**: “**sore tummy**”","of":[5]},{"t":"Use **visual resources**; **highlight** key ideas","of":[6]}]}]},"qbbebb4fed6":{"id":"educ:what does step 3 check involve and","title":"Health literacy step 3: Check","hook":"Teach-back tests YOU, not them.","groups":[{"q":"Check","facts":[{"t":"Check how clear **your communication** was","of":[0]},{"t":"Don’t rely on **nodding**; avoid “**Do you understand?**”","of":[1]},{"t":"Use **teach back**: they explain **in their own words**","of":[2]},{"t":"Use **prompts**; **take responsibility** if you were unclear","of":[3]}]},{"q":"Whose responsibility clarity is","facts":[{"t":"**Not a test** of their **intelligence**: the responsibility **lies with you**","of":[4]},{"t":"Not recalled? Go **back to Step 2** and explain it **a different way**","of":[5]}]}]},"q781db8aeca":{"id":"educ:name the five principles of te tiriti","title":"Te Tiriti: five principles","hook":"Self-determination, equity, active protection, options, partnership.","groups":[{"q":"The five principles","facts":[{"t":"**Tino Rangatiratanga**: **self-determination**","of":[0]},{"t":"**Mana Taurite**: **equity**","of":[1]},{"t":"**Whakamarumarutia**: **active protection**","of":[2]},{"t":"**Kōwhiringa**: **options**","of":[3]},{"t":"**Pātuitanga**: **partnership**","of":[4]},{"t":"The “**three Ps**” (1986) are **outdated**","of":[5]}]}]},"qd5ddcfa50d":{"id":"educ:give one practical medication education example for","title":"Te Tiriti in medication education","hook":"Ask how they feel, give time, respect rongoā, offer options, plan together.","groups":[{"q":"One example each","facts":[{"t":"**Tino Rangatiratanga**: ask “**How do you feel** about starting this?”","of":[0]},{"t":"**Mana Taurite**: **more time** for those who need it; **advocacy**","of":[1]},{"t":"**Whakamarumarutia**: **respect rongoā Māori** alongside prescribed medicine","of":[2]},{"t":"**Kōwhiringa**: **offer alternatives** (timing, formulation)","of":[3]},{"t":"**Pātuitanga**: **co-create a management plan**","of":[4]}]}]},"q2e5746d4e8":{"id":"educ:what should a nurse teach a parent","title":"Teaching parents about children’s medicines","hook":"Out of reach, measure properly, ask before crushing, never force.","groups":[{"q":"What to teach","facts":[{"t":"Store medicines **out of reach and out of sight**","of":[0]},{"t":"Use a **proper measuring cup, spoon or syringe**","of":[1]},{"t":"**Check with your pharmacist before crushing** or cutting","of":[2]},{"t":"**Do not force** a child: **vomiting**, **choking**","of":[3]},{"t":"Try an **ice block** to numb the taste; **praise and a reward**","of":[4]}]}]},"q1fd728f456":{"id":"educ:how should medication education be adapted for toddlers","title":"Teaching toddlers and children","hook":"Simple words, a story, the truth, and never “lollies”.","groups":[{"q":"How to adapt it","facts":[{"t":"**Age-appropriate language**: “**sore tummy**”","of":[0]},{"t":"Say it will **help them feel better**","of":[1]},{"t":"Use **similes or stories**: antibiotics as **soldiers** fighting **germs**","of":[2]},{"t":"**Do not lie**: an immunisation is **going to feel sore**","of":[3]},{"t":"**Never** call medicine **lollies**: **risk of overdose**","of":[4]},{"t":"Give **simple choices**","of":[5]}]}]},"q540a41f950":{"id":"educ:how should medication education be adapted for teenagers","title":"Teaching teenagers","hook":"Explain how it works, use it right, watch for effects, never share.","groups":[{"q":"How to adapt it","facts":[{"t":"Explain the **mechanism of action** simply: why it is **relevant** to them","of":[0]},{"t":"**Correct use** (route and dose) is **essential**","of":[1]},{"t":"How to **look out for adverse effects**","of":[2]},{"t":"Do **alcohol or drugs** affect it?","of":[3]},{"t":"Medicines should **never be shared**","of":[4]},{"t":"Encourage them to **ask questions**: they are **developing independence**","of":[5]}]}]},"qf29c5cd374":{"id":"educ:how should medication education be adapted for older","title":"Teaching older adults","hook":"Self-management, senses, energy, whānau (with consent), dignity.","groups":[{"q":"How to adapt it","facts":[{"t":"Educate for **self-management and adherence**: purpose, dose, timing","of":[0]},{"t":"**Sensory needs**: **extra time**, **hearing aids and glasses**, **large-print**","of":[1]},{"t":"Plan around **fatigue and energy levels**","of":[2]},{"t":"Involve **whānau** and **carers**, as long as the older adult **gives consent**","of":[3]},{"t":"Uphold **dignity and autonomy**","of":[4]}]}]},"qd2c6acfd76":{"id":"elderly:how is an older person defined in","title":"Defining an older person","hook":"65+: young-old, old-old, frail.","groups":[{"q":"Definition","facts":[{"t":"Aged **65 years and over**","of":[0]}]},{"q":"The sub-categories","facts":[{"t":"**Young-old**: **65–79**","of":[1]},{"t":"**Old-old**: **80+**","of":[2]},{"t":"**Frail elderly**: 65+ with a **debilitating condition**","of":[3]}]},{"q":"Note","facts":[{"t":"**Wide variations** in ageing; **age-related changes** are not **disease-related changes**","of":[4]}]}]},"qe8692462c3":{"id":"elderly:give the figures for medication use in","title":"Older adults and medicines: the figures","hook":"12% of the people, 31% of the prescriptions.","groups":[{"q":"The figures","facts":[{"t":"Over-65s: about **12% of the population**","of":[0]},{"t":"… but **31% of prescribed medications**","of":[1]},{"t":"On average **4–5 prescribed** medicines **plus 2 over-the-counter**","of":[5]}]},{"q":"Three reasons","facts":[{"t":"**Increased severity of chronic illness**","of":[2]},{"t":"**Multiple pathologies**","of":[3]},{"t":"**Excessive prescribing**","of":[4]}]}]},"qdb8aa70061":{"id":"elderly:describe the age related changes to drug absorption","title":"Ageing and absorption","hook":"Everything slows, but it rarely matters.","groups":[{"q":"The changes","facts":[{"t":"**Slowed gastric emptying**","of":[0]},{"t":"**Reduced GI motility**: **slower absorption**","of":[1]},{"t":"**Decreased intestinal surface area**","of":[2]}]},{"q":"Clinical significance","facts":[{"t":"They can **delay** absorption, but are **often not clinically significant**","of":[3]}]}]},"q724187292b":{"id":"elderly:describe the three age related changes to","title":"Ageing and distribution","hook":"More fat, less water, less protein.","groups":[{"q":"The three changes","facts":[{"t":"**Increased body fat**: **fat-soluble** drugs act **longer**","of":[0]},{"t":"**Reduced total body water**: water-soluble drugs **shorter and stronger**","of":[1]},{"t":"**Lower protein binding**: **more free (active) drug**","of":[2]}]},{"q":"Why it matters","facts":[{"t":"It changes the **duration of action** and **potential toxicity**","of":[3]}]}]},"qc255f177d6":{"id":"elderly:describe the age related changes to drug metabolism","title":"Ageing and metabolism","hook":"A slower liver, and heart failure slows it more.","groups":[{"q":"The changes","facts":[{"t":"**Slowed liver metabolism** and **reduced blood flow**","of":[0]},{"t":"Some reactions **slowed** (**oxidation**); some **unaffected** (**conjugation**)","of":[1]},{"t":"**Heart failure** impairs the liver more: **accumulation and toxicity**","of":[2]}]}]},"q3768b8c58b":{"id":"elderly:describe the age related changes to renal","title":"Ageing and renal excretion","hook":"Fewer nephrons, slower clearance, higher levels.","groups":[{"q":"The changes","facts":[{"t":"**Nephron loss**, **reduced blood flow**, **lower glomerular filtration rate**","of":[0]},{"t":"**Slower elimination** of renally cleared drugs","of":[0]}]},{"q":"The consequence","facts":[{"t":"Raises **plasma drug levels**; extends **half-lives**","of":[1]},{"t":"**Increased risk of toxicity**","of":[1]},{"t":"**Heart failure** can reduce **renal perfusion** further","of":[2]},{"t":"**Renal function tests** and **therapeutic drug monitoring**","of":[3]}]}]},"qed4dd6ee66":{"id":"elderly:explain the pharmacodynamic changes of ageing","title":"Pharmacodynamic changes of ageing","hook":"Fewer or changed receptors: effects go up or down.","groups":[{"q":"The changes","facts":[{"t":"**Increased or decreased** drug effects, by drug and receptor","of":[0]},{"t":"**Fewer receptors** at the target site","of":[1]},{"t":"**Altered receptor responsiveness**: **second-messenger** changes","of":[2]},{"t":"**Down-regulation** from **prolonged exposure**","of":[3]}]}]},"qa610e2ccae":{"id":"elderly:name the six most common adverse effects","title":"Six common adverse effects in older adults","hook":"Falls, dizzy on standing, delirium, kidneys, gut bleeds, brain bleeds.","groups":[{"q":"The six","facts":[{"t":"**Falls**","of":[0]},{"t":"**Orthostatic hypotension**","of":[1]},{"t":"**Delirium**","of":[2]},{"t":"**Renal failure**","of":[3]},{"t":"**Gastrointestinal bleeding**","of":[4]},{"t":"**Intracranial bleeding**","of":[5]}]}]},"qf641adea5d":{"id":"elderly:give the four reasons adverse drug reactions","title":"Why ADRs rise in older adults","hook":"PK, PD, polypharmacy, poor prescribing.","groups":[{"q":"The four reasons","facts":[{"t":"**Pharmacokinetic changes**: altered distribution, **reduced clearance**","of":[0]},{"t":"**Pharmacodynamic changes**: **increased receptor sensitivity** (CNS, heart)","of":[1]},{"t":"A higher burden of **illness and polypharmacy**: more **interactions**","of":[2]},{"t":"**Inappropriate prescribing** and **poor monitoring**","of":[3]}]}]},"q9f5d566a65":{"id":"elderly:what is the beers criteria and give","title":"The Beers Criteria","hook":"A list of drugs to avoid, or use carefully, in older adults.","groups":[{"q":"What it is","facts":[{"t":"A tool: drugs to be **avoided** or **used with caution** in **older adults**","of":[0]}]},{"q":"The two examples","facts":[{"t":"**NSAIDs**: avoid **chronic use**: **gastrointestinal bleeding**, **ulceration**","of":[1]},{"t":"**Digoxin**: not **first-line** for **atrial fibrillation**","of":[2]},{"t":"… **nausea**, **dysrhythmias**, **visual disorders**, **hallucinations**","of":[2]}]}]},"q6dadc5f4c5":{"id":"elderly:under what two conditions may a medication","title":"When a medicine may be crushed","hook":"The pharmacist says yes AND it is in the patient’s best interest.","groups":[{"q":"What crushing can cause","facts":[{"t":"**Less effective**, **ineffective**, or **dangerous**","of":[0]},{"t":"e.g. **enteric-coated** but then **rapidly absorbed**","of":[0]}]},{"q":"The two conditions","facts":[{"t":"A **pharmacist advises** it **does not compromise** the medicine","of":[1]},{"t":"**And** it is in the patient’s **best interest**","of":[2]}]}]},"q2bec957fbd":{"id":"elderly:define polypharmacy and list the five risks","title":"Polypharmacy: five risks","hook":"Five or more drugs; five risks.","groups":[{"q":"Definition","facts":[{"t":"The **concurrent use of multiple medications**, usually **5 or more**","of":[0]},{"t":"It implies **too many**, or **unnecessary**, drugs","of":[1]}]},{"q":"The five risks","facts":[{"t":"**Adverse effects**","of":[2]},{"t":"**Drug–drug interactions**","of":[3]},{"t":"**Non-adherence**","of":[4]},{"t":"**Falls**","of":[5]},{"t":"**Mortality**","of":[6]}]}]},"q70a1fb55b1":{"id":"elderly:give the auckland retirement village prevalence figures","title":"Polypharmacy in Auckland retirement villages","hook":"Half on five or more; one in twenty on ten or more.","groups":[{"q":"The study","facts":[{"t":"**578** residents of **33** Auckland villages; median age **81.6**","of":[0]}]},{"q":"The figures","facts":[{"t":"**51.8%**: **polypharmacy** (5+ medicines)","of":[1]},{"t":"**5.7%**: **hyperpolypharmacy** (10+)","of":[2]},{"t":"A mean of **4.8 regular** medicines plus **0.7 as-required**","of":[3]}]}]},"q79e38f3096":{"id":"elderly:give six reasons polypharmacy occurs","title":"Why polypharmacy happens","hook":"More illness, more prescribers, ads, easy pills, no reviews, duplicates.","groups":[{"q":"Any six","facts":[{"t":"More **co-morbidities**","of":[0]},{"t":"**Multiple prescribers**: a GP and a clinic","of":[1]},{"t":"Medicines **can be advertised** in NZ","of":[2]},{"t":"**Easier to access** than lifestyle change","of":[3]},{"t":"Medicines **not being reviewed regularly** (a GP consult is **15 minutes**)","of":[4]},{"t":"**Duplicate medications** (brand names)","of":[5]},{"t":"**Traditional therapies** alongside","of":[6]},{"t":"The **prescribing cascade**","of":[7]}]}]},"q86016bbd6e":{"id":"elderly:name five strategies to manage polypharmacy","title":"Managing polypharmacy: five strategies","hook":"Review, tools, deprescribe, involve the patient, document.","groups":[{"q":"The five","facts":[{"t":"**Systematic medication review**","of":[0]},{"t":"**Validated prescribing tools**: the **Beers Criteria**","of":[1]},{"t":"**Deprescribing**","of":[2]},{"t":"**Patient-centred decision-making**","of":[3]},{"t":"**Good quality documentation**","of":[4]}]},{"q":"The nurse’s part","facts":[{"t":"In the **multi-disciplinary team**, or as an **advocate** for review","of":[5]}]}]},"q11e9ab2b9b":{"id":"elderly:besides older adults which groups are at","title":"Other groups at risk of polypharmacy","hook":"Not just the old: kids, disability, cognition, mental health, institutions, language.","groups":[{"q":"The point","facts":[{"t":"Older adults are the **highest-risk** group, but it is **not only** theirs","of":[0]}]},{"q":"The other groups","facts":[{"t":"**Infants and children** with complex conditions","of":[1]},{"t":"**People with disabilities**","of":[2]},{"t":"**Cognitive impairment**","of":[3]},{"t":"**Chronic mental health conditions**","of":[4]},{"t":"**Institutional settings**: **prison**, residential care","of":[5]},{"t":"**Language or communication barriers**","of":[6]}]}]},"q0a411600b0":{"id":"elderly:give four pieces of key legislation and","title":"Aged-care medicine law and guidance","hook":"Old People’s Home Regs, HPCAA, the Code of Rights, the Care Guides, NCNZ.","groups":[{"q":"Any four","facts":[{"t":"**Old People’s Home Regulations** (1987)","of":[0]},{"t":"**Health Practitioners Competence Assurance Act** (2003)","of":[1]},{"t":"The **Code of Health and Disability Services Consumers’ Rights**","of":[2]},{"t":"**Medicines Care Guides for Residential Aged Care** (2011)","of":[3]},{"t":"NCNZ **Standards of Practice** and **Code of Conduct**","of":[4]}]}]},"q8518041e94":{"id":"elderly:distinguish errors of commission from errors of","title":"Errors of commission vs omission","hook":"Commission = DOING it wrong. Omission = NOT doing it.","groups":[{"q":"Commission (doing)","facts":[{"t":"An error of **doing**","of":[0]},{"t":"e.g. the **wrong dose**; **look-alike packaging**","of":[0]},{"t":"e.g. medicine from **someone else**; **expired medication**","of":[1]}]},{"q":"Omission (not doing)","facts":[{"t":"An error of **not doing**","of":[2]},{"t":"e.g. **forgetting to take** it; **too low a dose**","of":[2]},{"t":"e.g. **forgetting instructions**; a dose at the **wrong time**","of":[3]}]}]},"q5c94d78494":{"id":"lifespan:why does this session focus on pharmacokinetics","title":"Why the session focuses on PK","hook":"PK can be predicted; PD in pregnancy and children cannot.","groups":[{"q":"Why","facts":[{"t":"There are **PK and PD changes** in pregnancy and children","of":[0]},{"t":"**Pharmacokinetic changes** are **easier to predict**","of":[1]},{"t":"**Pharmacodynamic changes** are **more complex**, **highly variable**, **poorly defined**","of":[2]}]}]},"q71c2cdf8b8":{"id":"lifespan:how do medications reach and affect the","title":"How medicines reach the foetus","hook":"Whatever the parent absorbs can reach the baby; the earliest weeks are worst.","groups":[{"q":"How they reach it","facts":[{"t":"Anything absorbed can reach it via the **maternal circulation**","of":[0]}]},{"q":"How it is managed","facts":[{"t":"Use should be **limited**: the **benefit** must outweigh any **risk to the foetus**","of":[1]},{"t":"When **trying to get pregnant**, **talk to a health professional** first","of":[2]}]},{"q":"The most vulnerable time","facts":[{"t":"The **first few weeks** of development","of":[3]}]}]},"q6d2e6408d2":{"id":"lifespan:describe the pharmacokinetic changes of pregnancy under","title":"Pregnancy under ADME","hook":"A slower gut, more blood and fat, a changed liver, faster kidneys.","groups":[{"q":"Absorption","facts":[{"t":"**Delayed gastric emptying**, **reduced gut motility**","of":[0]},{"t":"**Vomiting** can prevent full absorption","of":[0]}]},{"q":"Distribution","facts":[{"t":"Increased **maternal plasma volume** **dilutes** the drug","of":[1]},{"t":"More **body fat** stores **lipophilic** drugs; drugs **diffuse across the placenta**","of":[1]}]},{"q":"Metabolism","facts":[{"t":"Maternal enzymes change: **caffeine** metabolism **slower**, **paracetamol** **faster**","of":[2]},{"t":"The foetus has **immature enzymes**: **longer drug effects**","of":[3]}]},{"q":"Excretion","facts":[{"t":"**Increased renal blood flow** **increases elimination**","of":[4]},{"t":"It may need **higher or more frequent doses**","of":[4]}]}]},"q3367692e8e":{"id":"lifespan:define a teratogen state the highest risk","title":"Teratogens: definition, timing, sources","hook":"The first 12 weeks, when the organs form.","groups":[{"q":"Definition","facts":[{"t":"Any substance that can cause **developmental abnormalities** in a **foetus**","of":[0]}]},{"q":"Highest risk","facts":[{"t":"The **first trimester** (**weeks 0–12**)","of":[1]}]},{"q":"Four sources","facts":[{"t":"**Prescription drugs**, **OTC medicines**, **herbal products**","of":[2]},{"t":"**Alcohol**, **nicotine**, **drugs of misuse**","of":[2]}]},{"q":"What they cause","facts":[{"t":"**Birth defects**, **developmental delay**, **intellectual disability**","of":[3]}]}]},"q2a6071a61f":{"id":"lifespan:give the four teratogen examples from the","title":"Four teratogens: timing and defects","hook":"Alcohol, cocaine, isotretinoin, tetracycline.","groups":[{"q":"The four","facts":[{"t":"**Alcohol** <12 weeks: **fetal alcohol syndrome**, **heart defects**","of":[0]},{"t":"**Cocaine** (2nd–3rd trimester): **premature labour**, **intracranial bleeding**","of":[1]},{"t":"**Isotretinoin** (acne): **hydrocephalus**, **foetal death**","of":[2]},{"t":"**Tetracycline** >20 weeks: **stained teeth**, **bone growth defects**","of":[3]}]}]},"q4045717e09":{"id":"lifespan:describe the effects of alcohol nicotine cannabis","title":"Drugs of dependence and the foetus","hook":"Fat-soluble drugs cross the placenta.","groups":[{"q":"Why they reach the foetus","facts":[{"t":"Most are **lipid-soluble**, so they **cross the placenta**","of":[0]}]},{"q":"Each drug","facts":[{"t":"**Alcohol**: **Foetal Alcohol Spectrum Disorder**","of":[1]},{"t":"**Nicotine**: **pregnancy loss**, **preterm birth**, **low birthweight**","of":[2]},{"t":"**Cannabis**: **long-term risks** not yet known","of":[3]},{"t":"**Caffeine**: **safe in small amounts**; **reduced clearance**","of":[4]},{"t":"**Opioid dependence**: newborn **withdrawal**: **tremors**, **seizures**","of":[5]}]}]},"q54314e0a56":{"id":"lifespan:what is the medication pregnancy category system","title":"Pregnancy categories: A and X","hook":"A is safe (paracetamol); X is never in pregnancy.","groups":[{"q":"The scale","facts":[{"t":"From A (**no harm**) through B, C, D to X (**high risk**, **contraindicated**)","of":[0]}]},{"q":"A and X","facts":[{"t":"**Category A**: taken by **a large number** of pregnant people","of":[1]},{"t":"… **without any proven increase** in harm; e.g. **paracetamol**","of":[1]},{"t":"**Category X**: **the most dangerous**; **should not be used** in any possible pregnancy","of":[2]}]}]},"q0dbe98dab0":{"id":"lifespan:on what three factors does medication transfer","title":"Medicines in breast milk: three factors","hook":"Blood level, milk amount, fat-solubility. Keep the parent well.","groups":[{"q":"The three factors","facts":[{"t":"**Maternal drug plasma concentration**","of":[1]},{"t":"**Amount of milk** consumed","of":[2]},{"t":"**Lipid solubility** of the drug","of":[3]}]},{"q":"The guiding principle","facts":[{"t":"Most medicines **can enter breast milk**","of":[0]},{"t":"**Maintaining maternal health is essential**: don’t **automatically** stop","of":[4]}]}]},"qe5fe8d88c2":{"id":"lifespan:which drugs concentrate most in breastmilk what","title":"Drugs in breast milk, and the advice","hook":"Fat-soluble nerve drugs concentrate; plan around alcohol; no meth.","groups":[{"q":"Which concentrate","facts":[{"t":"**Lipid-soluble** drugs that **affect the nervous system** (**morphine**, **codeine**)","of":[0]}]},{"q":"Effects on the infant","facts":[{"t":"**Sedation**; a **reduced suckling reflex**, **poor feeding**","of":[1]}]},{"q":"The advice","facts":[{"t":"**Alcohol**: **plan feeds** to minimise exposure","of":[2]},{"t":"**Caffeine**: **safe in moderate amounts**","of":[3]},{"t":"**Nicotine**: raises **SUDI** risk; **nicotine-replacement therapy**","of":[4]},{"t":"**Methamphetamine**: breastfeeding is **not recommended**","of":[5]}]}]},"q6f48a2fefc":{"id":"lifespan:what three risks does a prescriber balance","title":"Breastfeeding: what the prescriber balances","hook":"The benefits of feeding, the risk to baby, the risk to the parent.","groups":[{"q":"The three","facts":[{"t":"The **benefits of continued breastfeeding**","of":[0]},{"t":"The **risks of infant medication exposure**","of":[1]},{"t":"The **risks to the breastfeeding parent** if **essential medications are stopped**","of":[2]}]},{"q":"In practice","facts":[{"t":"Most can be **used with caution**: **evaluate individually**","of":[3]}]}]},"q96b09d50bd":{"id":"lifespan:children are just miniature adults true or","title":"Children are not miniature adults","hook":"False: fewer barriers, poor heat and balance control, more water.","groups":[{"q":"The answer","facts":[{"t":"**False**: children are **physiologically different**","of":[0]}]},{"q":"Four reasons","facts":[{"t":"**Lack of protective mechanisms and barriers**","of":[1]},{"t":"**Poor temperature regulation**","of":[2]},{"t":"**Poor homeostatic mechanisms**","of":[3]},{"t":"**Different body composition**: **higher body water (75%)**, less fat","of":[4]}]}]},"q7b3a7f54fd":{"id":"lifespan:give the age definitions for preterm full","title":"Age definitions: preterm to adolescent","hook":"<36 weeks, 36–40, under 4 weeks, to 1 year, to 12, to 16.","groups":[{"q":"The definitions","facts":[{"t":"**Preterm**: born at **less than 36 weeks**","of":[0]},{"t":"**Full term**: **36 to 40+ weeks**","of":[1]},{"t":"**Neonate**: **less than 4 weeks** old","of":[2]},{"t":"**Infant**: **5 weeks to 1 year**","of":[3]},{"t":"**Child**: **1 to 12 years**","of":[4]},{"t":"**Adolescent**: **12 to 16 years**","of":[5]}]}]},"q8a02368012":{"id":"lifespan:describe the pharmacokinetics of the neonate","title":"Neonatal pharmacokinetics","hook":"Everything immature: more in, slower out, into the brain.","groups":[{"q":"The features","facts":[{"t":"**Thin skin** and **low stomach acid** can **increase drug absorption**","of":[0]},{"t":"**Poor thermoregulation**; a **dehydration** risk","of":[1]},{"t":"**Immature** metabolising **enzymes** (e.g. **paracetamol**)","of":[2]},{"t":"**Immature kidneys** → **slower drug clearance**, **prolonged half-life**","of":[3]},{"t":"**Immature blood–brain barrier** → **CNS toxicity** risk","of":[4]}]}]},"q1a882b675d":{"id":"lifespan:describe the pharmacokinetics of infants and children","title":"PK in infants and children","hook":"Slow kidneys to 1, a fast liver to 10, doses by the kilo.","groups":[{"q":"How it changes with age","facts":[{"t":"Under **12 months**: **renal excretion is slower**, a **longer half-life**","of":[0]},{"t":"**By 1 year**: absorption, distribution, excretion **similar to adults**","of":[1]},{"t":"**Hepatic metabolism** is **faster** until about **10 years**","of":[2]}]},{"q":"What it means for doses","facts":[{"t":"More **body water** → a **lower concentration** of water-soluble drugs","of":[3]},{"t":"Doses are **weight-based** (**mg/kg**)","of":[4]},{"t":"Formulation: **taste masking**; an **inability to swallow tablets**","of":[5]}]}]},"q5f6b022982":{"id":"lifespan:why should paracetamol elixir not be given","title":"Paracetamol under 3 months or 5 kg","hook":"A narrow range, an immature liver, a toxic build-up.","groups":[{"q":"Why","facts":[{"t":"**Narrow therapeutic range**: a **higher risk of overdose**","of":[0]},{"t":"**Delayed development** of **hepatic enzymes**: **decreased rate of metabolism**","of":[1]},{"t":"More **toxic metabolites** → **liver injury**","of":[2]}]},{"q":"From 3 months","facts":[{"t":"An **mg/kg dose** may be given","of":[3]}]}]},"q138021219d":{"id":"lifespan:tama is 3 years old and weighs","title":"Tama’s paracetamol dose","hook":"15 mg per kg × 17.7 kg.","groups":[{"q":"Working","facts":[{"t":"A single dose: **15 mg/kg**","of":[0]},{"t":"**15 × 17.7 = 265.5 mg**","of":[1]},{"t":"From **250 mg/5 mL**: **5.3 mL**","of":[2]}]},{"q":"Why an adult dose is unsafe","facts":[{"t":"An adult dose is **1000 mg**: **nearly four times** his","of":[3]}]}]},"qef2b760391":{"id":"lifespan:list seven considerations when administering medications to","title":"Giving medicines to children: seven points","hook":"Dose, form, consent and assent, words, play, honesty, help.","groups":[{"q":"The seven","facts":[{"t":"An **appropriate dose** prescribed","of":[0]},{"t":"A **developmentally appropriate formulation** and route","of":[1]},{"t":"**Informed consent** from the guardian, plus the child’s **assent**","of":[2]},{"t":"**Communication** and **appropriate terminology**","of":[3]},{"t":"**Simple choices**, **distraction and play**","of":[4]},{"t":"**Honesty**","of":[5]},{"t":"**Secure assistance**, e.g. a **parent**","of":[6]}]}]},"qb63f92c76e":{"id":"legal:define act regulation amendment policy and guideline","title":"Act, regulation, amendment, policy, guideline","hook":"Parliament → how → updates → your workplace → best advice.","groups":[{"q":"The five terms","facts":[{"t":"**Act**: *
