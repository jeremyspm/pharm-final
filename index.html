t","sys":"law","pts":1,"q":"Which drug was originally developed for blood pressure and is now used as a topical hair-restoring agent?","qh":"<p>Which drug was originally developed for blood pressure and is now used as a topical hair-restoring agent?</p>","qt":"Which drug was originally developed for blood pressure and is now used as a topical hair-restoring agent?","imgs":[],"type":"mcq","authored":1,"opts":["Sildenafil","Minoxidil","Penicillin","Isotretinoin"],"key":["Minoxidil"],"src":"Drug Development & Marketing slide 5","why":"Minoxidil was originally developed for blood pressure. Sildenafil was developed for angina and high blood pressure and is now used for impotence; penicillin was discovered from a mould."},{"id":"qedd94928f9","quiz":"devmkt","sys":"law","pts":1,"q":"Which statement about a nurse and medicine advertising is CORRECT?","qh":"<p>Which statement about a nurse and medicine advertising is CORRECT?</p>","qt":"Which statement about a nurse and medicine advertising is CORRECT?","imgs":[],"type":"mcq","authored":1,"opts":["Advertising rules apply only to printed media","Verbal recommendation of a brand can count as advertising","Nurses are exempt from all advertising rules","Advertising unapproved medicines to health professionals is permitted"],"key":["Verbal recommendation of a brand can count as advertising"],"src":"Drug Development & Marketing slides 30 & 32","why":"Advertising is defined broadly and includes verbal advertising, so praising one brand over another is caught. The rules apply across all media, and advertising unapproved medicines is prohibited even to health professionals."},{"id":"q0d3e60833a","quiz":"devmkt","sys":"law","pts":1,"q":"Placebo use in a trial is ethically acceptable when:","qh":"<p>Placebo use in a trial is ethically acceptable when:</p>","qt":"Placebo use in a trial is ethically acceptable when:","imgs":[],"type":"mcq","authored":1,"opts":["The trial sponsor requires it","No proven treatment exists, or it is necessary for methodology without causing serious harm","Participants are reimbursed","The condition is life-threatening"],"key":["No proven treatment exists, or it is necessary for methodology without causing serious harm"],"src":"Drug Development & Marketing slide 17","why":"Placebo use is problematic if recipients risk harm or worsening of their condition; it is acceptable when no proven treatment exists, or where necessary for methodology without causing serious harm."},{"id":"qf188d4c63c","quiz":"allergy","sys":"imm","pts":1,"q":"What is step 1 of the ASCIA anaphylaxis action plan?","qh":"<p>What is step 1 of the ASCIA anaphylaxis action plan?</p>","qt":"What is step 1 of the ASCIA anaphylaxis action plan?","imgs":[],"type":"mcq","authored":1,"opts":["Give the adrenaline device","Phone an ambulance","Lay the person flat","Give an antihistamine"],"key":["Lay the person flat"],"src":"ASCIA Action Plan for Anaphylaxis (2026), p.1","why":"Step 1 is to lay the person flat and NOT allow them to stand or walk. The adrenaline device is step 2, and phoning the ambulance is step 3."},{"id":"q61bec80c8f","quiz":"allergy","sys":"imm","pts":1,"q":"A person with known asthma and a food allergy has sudden wheeze after a suspected exposure. You should give:","qh":"<p>A person with known asthma and a food allergy has sudden wheeze after a suspected exposure. You should give:</p>","qt":"A person with known asthma and a food allergy has sudden wheeze after a suspected exposure. You should give:","imgs":[],"type":"mcq","authored":1,"opts":["The asthma reliever puffer first, then adrenaline","The adrenaline device first, then the asthma reliever puffer","An antihistamine only","Nothing until skin symptoms appear"],"key":["The adrenaline device first, then the asthma reliever puffer"],"src":"ASCIA Action Plan for Anaphylaxis (2026), p.1","why":"\"ALWAYS GIVE ADRENALINE DEVICE FIRST, then asthma reliever puffer.\" Anaphylaxis can occur without skin symptoms, so waiting for a rash is not safe."},{"id":"q04b3752f60","quiz":"allergy","sys":"imm","pts":1,"q":"After giving adrenaline with no response, how long before further adrenaline may be given?","qh":"<p>After giving adrenaline with no response, how long before further adrenaline may be given?</p>","qt":"After giving adrenaline with no response, how long before further adrenaline may be given?","imgs":[],"type":"mcq","authored":1,"opts":["1 minute","5 minutes","15 minutes","30 minutes"],"key":["5 minutes"],"src":"ASCIA Action Plan for Anaphylaxis (2026), p.1","why":"Step 5 of the plan: further adrenaline may be given if there is no response after 5 minutes. Step 6 is transfer to hospital for at least 4 hours of observation."},{"id":"q49fa2795c1","quiz":"allergy","sys":"imm","pts":1,"q":"A pregnant person is unconscious from anaphylaxis. They should be placed:","qh":"<p>A pregnant person is unconscious from anaphylaxis. They should be placed:</p>","qt":"A pregnant person is unconscious from anaphylaxis. They should be placed:","imgs":[],"type":"mcq","authored":1,"opts":["Sitting upright","In the recovery position on the left side","Flat on their back with legs raised","Standing supported"],"key":["In the recovery position on the left side"],"src":"ASCIA Action Plan for Anaphylaxis (2026), p.1","why":"If unconscious or pregnant, place in the recovery position — on the LEFT side if pregnant."},{"id":"qe7ebaeaaae","quiz":"allergy","sys":"imm","pts":1,"q":"Abdominal pain and vomiting are signs of ANAPHYLAXIS (rather than a mild-to-moderate reaction) in which situation?","qh":"<p>Abdominal pain and vomiting are signs of ANAPHYLAXIS (rather than a mild-to-moderate reaction) in which situation?</p>","qt":"Abdominal pain and vomiting are signs of ANAPHYLAXIS (rather than a mild-to-moderate reaction) in which situation?","imgs":[],"type":"mcq","authored":1,"opts":["Food allergy","Medication allergy","Insect allergy","Latex allergy"],"key":["Insect allergy"],"src":"ASCIA Action Plan for Anaphylaxis (2026), p.1","why":"The plan annotates abdominal pain and vomiting with \"these are signs of anaphylaxis for insect allergy\" in both columns."},{"id":"qb6ebeaf102","quiz":"concepts1","sys":"found","pts":5,"q":"Define pharmacology, and explain why knowledge of it matters to the Registered Nurse. Give four reasons.","qh":"<p>Define pharmacology, and explain why knowledge of it matters to the Registered Nurse. Give four reasons.</p>","qt":"Define pharmacology, and explain why knowledge of it matters to the Registered Nurse. Give four reasons.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Pharmacology is \"the study of drugs, including their sources, nature, actions, effects in living systems, and uses\".","Most nurses administer medication as part of their daily routine.","Nurses are legally and ethically responsible for the medications they administer, and for doing this safely.","Nurses provide education about medication to patients and whānau.","Nurses evaluate the outcome of medication use, including adverse effects.","With further training, nurse practitioners and nurse prescribers may prescribe and dispense medications."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slides 3 & 6"}},{"id":"qb158fab89e","quiz":"concepts1","sys":"found","pts":6,"q":"Define \"medication\". Name the six things a medication may be used to do, with an example of each from the lecture.","qh":"<p>Define &quot;medication&quot;. Name the six things a medication may be used to do, with an example of each from the lecture.</p>","qt":"Define \"medication\". Name the six things a medication may be used to do, with an example of each from the lecture.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A medication is any substance used to prevent, diagnose, relieve, treat, or cure disease, or to affect the structure or function of the body.","PREVENT — minimise or avoid disease: Hepatitis B immunisation.","DIAGNOSE — help identify a disease: contrast media making areas show on X-ray or CT.","RELIEVE — reduce symptoms without fixing the cause: paracetamol for pain.","TREAT — manage or control but not cure: omeprazole reducing stomach acid to heal an ulcer.","CURE — completely eliminate: antifungal cream for a ringworm infection.","AFFECT STRUCTURE OR FUNCTION: the oral contraceptive pill preventing ovulation."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slides 9–15"}},{"id":"q6af8f98fe9","quiz":"concepts1","sys":"found","pts":4,"q":"Name the four branches of pharmacology covered in this course and define each in one line.","qh":"<p>Name the four branches of pharmacology covered in this course and define each in one line.</p>","qt":"Name the four branches of pharmacology covered in this course and define each in one line.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Pharmacokinetics]] — \"what the body does to the drug\"; four phases: absorption, distribution, metabolism, excretion.","[[Pharmacodynamics]] — \"what the drug does to the body\", and how (mechanism of action); the interaction of drug molecules with receptors or other targets.","[[Pharmacotherapeutics]] — the application of medications to an individual patient; applying the science of PK and PD to prescribe and administer the most appropriate medication.","[[Toxicology]] — the study of the harmful effects of chemicals, including medications, on living organisms; includes misuse, adverse effects and poisoning."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slides 20–25"}},{"id":"q4a3dea5a9a","quiz":"concepts1","sys":"found","pts":3,"q":"Three things a nurse must know before administering any medication to a patient. What are they?","qh":"<p>Three things a nurse must know before administering any medication to a patient. What are they?</p>","qt":"Three things a nurse must know before administering any medication to a patient. What are they?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["How to safely administer the medication.","The intended effect (purpose) of the medication.","Possible adverse effects of the medication, including allergies.","The deck's framing: Registered Nurses must be well informed about each medication BEFORE administering it."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slide 17"}},{"id":"q07b7d0795d","quiz":"concepts1","sys":"found","pts":2,"q":"Explain the difference between a contraindication and a precaution.","qh":"<p>Explain the difference between a contraindication and a precaution.</p>","qt":"Explain the difference between a contraindication and a precaution.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Contraindication: a situation in which a medication should NOT be used, because it may be harmful to the person.","Precaution: a warning that the medication should be used with special care because of a heightened risk of adverse effects.","Critically — with a precaution the medication MAY still be used, but only with careful monitoring or dose adjustment."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slide 31"}},{"id":"q6225448509","quiz":"concepts1","sys":"found","pts":3,"q":"What is a medication (drug) interaction? Name the four categories of thing a medication can interact with.","qh":"<p>What is a medication (drug) interaction? Name the four categories of thing a medication can interact with.</p>","qt":"What is a medication (drug) interaction? Name the four categories of thing a medication can interact with.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A reaction where the effect or activity of a medication is altered by another substance or condition.","Other medications.","Foods.","Complementary and alternative medicines.","Medical conditions."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slide 32"}},{"id":"q5a910d2dd5","quiz":"concepts1","sys":"found","pts":2,"q":"Distinguish the roles of PHARMAC and Medsafe.","qh":"<p>Distinguish the roles of PHARMAC and Medsafe.</p>","qt":"Distinguish the roles of PHARMAC and Medsafe.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[PHARMAC — Te Pātaka Whaioranga]] is the government agency that decides which medications and medical products are FUNDED (subsidised) in Aotearoa NZ, within a fixed budget.","[[Medsafe]] is the New Zealand Medicines and Medical Devices Safety Authority — it REGULATES medicines and medical devices, making sure they are safe and high-quality."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slides 36–37"}},{"id":"q89fcbb9833","quiz":"concepts1","sys":"found","pts":4,"q":"All medications are known by at least three names. Name and describe them, using paracetamol as the example.","qh":"<p>All medications are known by at least three names. Name and describe them, using paracetamol as the example.</p>","qt":"All medications are known by at least three names. Name and describe them, using paracetamol as the example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Chemical name]] — precisely describes the atomic and molecular structure; long and impractical; used mainly by chemists. Paracetamol: 4-hydroxyacetanilide.","[[Generic name]] — assigned by the manufacturer with approval of the local drug regulating authority; becomes the official name; must be distinct in sound and spelling. Paracetamol.","[[Proprietary (brand) name]] — selected and copyrighted by the company that markets it; restricted to that company and that formulation. Panadol, Pamol, Pacimol, Paracare."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slides 39–45"}},{"id":"qa2fd878078","quiz":"concepts1","sys":"found","pts":3,"q":"Why are prescribers in Aotearoa NZ encouraged to prescribe generically, and what are the two exceptions?","qh":"<p>Why are prescribers in Aotearoa NZ encouraged to prescribe generically, and what are the two exceptions?</p>","qt":"Why are prescribers in Aotearoa NZ encouraged to prescribe generically, and what are the two exceptions?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Reduces the risk of error — many proprietary/brand names may exist for the same medication.","More cost-effective — the pharmacist will dispense subsidised medication brands wherever possible.","Exception 1: when the medication is a special modified-release form of the same generic drug.","Exception 2: when different brands of the same generic drug do not show [[Bioequivalence]] — the deck's example is epilepsy."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slides 47–48"}},{"id":"qb84755ae9f","quiz":"concepts1","sys":"found","pts":3,"q":"Define bioequivalence, and explain its role in drug development.","qh":"<p>Define bioequivalence, and explain its role in drug development.</p>","qt":"Define bioequivalence, and explain its role in drug development.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Bioequivalence is when two medications containing the same active ingredient are administered at the same dose,","reach the bloodstream at a similar rate and extent,","AND lead to similar effects (beneficial or adverse) in the body.","A company developing a new branded version of a medicine already on the market must demonstrate bioequivalence to the original before it can be sold.","Some brands are more affordable for consumers and for the funder (PHARMAC)."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slides 49–50"}},{"id":"q095e2a2aaa","quiz":"concepts1","sys":"found","pts":3,"q":"Name three generic-name suffixes taught in the lecture and the drug class each signals.","qh":"<p>Name three generic-name suffixes taught in the lecture and the drug class each signals.</p>","qt":"Name three generic-name suffixes taught in the lecture and the drug class each signals.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["\"-olol\" — beta blockers, e.g. atenolol, propranolol, metoprolol.","\"-statin\" — cholesterol-lowering medication, e.g. atorvastatin.","\"-cillin\" — penicillin antibiotics, e.g. amoxicillin."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (1) 2026 slide 42"}},{"id":"qac8da50648","quiz":"concepts2","sys":"found","pts":3,"q":"Name the three classification systems this course recommends, and give an example of each.","qh":"<p>Name the three classification systems this course recommends, and give an example of each.</p>","qt":"Name the three classification systems this course recommends, and give an example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Clinical use classification]] — what the medication is prescribed for, e.g. analgesics for pain relief, bronchodilators to open airways.","[[Mechanism of action classification]] — how it produces its effect, e.g. proton pump inhibitors inhibit the H+/K+ proton pump in gastric parietal cells, blocking acid secretion.","[[Legal classification]] — according to NZ Medicines law, e.g. prescription, restricted, pharmacy-only, general sale."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slides 5–10"}},{"id":"q747e6f1123","quiz":"concepts2","sys":"found","pts":2,"q":"Aspirin is used as the lecture's example of one drug in several clinical-use classes. Name four classes it belongs to.","qh":"<p>Aspirin is used as the lecture's example of one drug in several clinical-use classes. Name four classes it belongs to.</p>","qt":"Aspirin is used as the lecture's example of one drug in several clinical-use classes. Name four classes it belongs to.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Analgesic (pain relief).","Antipyretic (reduce fever).","Anti-inflammatory (reduce inflammation).","Antithrombotic (prevent or treat blood clotting)."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slide 8"}},{"id":"qb90ee0d522","quiz":"concepts2","sys":"found","pts":4,"q":"List the four legal classifications of medicines under the Medicines Act 1981, what each means, and an example.","qh":"<p>List the four legal classifications of medicines under the Medicines Act 1981, what each means, and an example.</p>","qt":"List the four legal classifications of medicines under the Medicines Act 1981, what each means, and an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Prescription medicine]] — supplied or administered under a prescription by an authorised, designated or delegated prescriber, or by standing order. Example: amoxicillin.","[[Restricted (pharmacist-only) medicine]] — sold or supplied only in a pharmacy or hospital; the pharmacist must explain it to the patient. Example: clotrimazole cream.","[[Pharmacy-only medicine]] — sold or supplied in a pharmacy or hospital, or a licensed shop in rural locations. Example: oxymetazoline (Otrivine) nasal spray.","[[General sales medicine]] — any other medicine not classified above; can be sold from any retail outlet. Example: paracetamol and ibuprofen.","The last three groups are what is commonly called \"over the counter\" (OTC)."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slide 10 · Legal & Ethical 2026 slide 8"}},{"id":"q161479d50c","quiz":"concepts2","sys":"found","pts":3,"q":"Name the two free New Zealand websites recommended as sources of medication information, and what each provides.","qh":"<p>Name the two free New Zealand websites recommended as sources of medication information, and what each provides.</p>","qt":"Name the two free New Zealand websites recommended as sources of medication information, and what each provides.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Medsafe (www.medsafe.govt.nz) — free; provides Data Sheets (suited to health professionals) and Consumer Medicine Information sheets (for health consumers).","The New Zealand Formulary (www.nzformulary.org) — free; adult section for over-18s and a child section for 0–18 years.","The NZF provides most key medication information, gives normal dosing, identifies whether a medication is PHARMAC-subsidised, and has an interactions checker."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slides 18–21"}},{"id":"qfa426f7c7e","quiz":"concepts2","sys":"found","pts":3,"q":"The deck lists four kinds of source to use WITH CAUTION. Name them and say why.","qh":"<p>The deck lists four kinds of source to use WITH CAUTION. Name them and say why.</p>","qt":"The deck lists four kinds of source to use WITH CAUTION. Name them and say why.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Other websites / any .com websites — often contain American terminology and information, e.g. Drugs.com.","News releases — watch out for clickbait; is the author a qualified health professional?","Artificial intelligence — \"uses patterns rather than science\", and includes sources such as Reddit.","Social media."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slide 23"}},{"id":"qa5a0485776","quiz":"concepts2","sys":"found","pts":2,"q":"What three things does the route of administration affect?","qh":"<p>What three things does the route of administration affect?</p>","qt":"What three things does the route of administration affect?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The rate of onset of action.","The magnitude of the body's response.","And for some routes, the location of the response."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slide 25"}},{"id":"qd0d2b258b6","quiz":"concepts2","sys":"found","pts":4,"q":"Name the five major groups of administration route, and explain the difference between a local and a systemic effect.","qh":"<p>Name the five major groups of administration route, and explain the difference between a local and a systemic effect.</p>","qt":"Name the five major groups of administration route, and explain the difference between a local and a systemic effect.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Oral (enteral — GI tract).","Parenteral (not through the GI tract).","Rectal.","Inhalation.","Topical.","[[Local effect]]: the effect occurs at the immediate site of administration.","[[Systemic effect]]: the medication must be absorbed before it enters the body's circulation, and is distributed to a location where it causes an effect."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slides 26–27"}},{"id":"q68b456e20f","quiz":"concepts2","sys":"found","pts":3,"q":"Give the advantages and disadvantages of the intravenous route.","qh":"<p>Give the advantages and disadvantages of the intravenous route.</p>","qt":"Give the advantages and disadvantages of the intravenous route.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["ADVANTAGE: rapid effects — onset is immediate because the medication reaches circulation right away.","ADVANTAGE: a large volume of medication can be administered.","ADVANTAGE: reduced risk of tissue irritation, as the medication is immediately diluted within the blood volume.","DISADVANTAGE: can be dangerous — not easy to retrieve, stop or slow once administered.","DISADVANTAGE: may need hospitalisation; higher cost.","DISADVANTAGE: risk of infection and adverse effects."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slides 35–36"}},{"id":"qe034dfad72","quiz":"concepts2","sys":"found","pts":4,"q":"Compare the intramuscular and subcutaneous routes: absorption, one advantage and one disadvantage each.","qh":"<p>Compare the intramuscular and subcutaneous routes: absorption, one advantage and one disadvantage each.</p>","qt":"Compare the intramuscular and subcutaneous routes: absorption, one advantage and one disadvantage each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["IM: injected into muscle, absorbed into the blood vessels flowing through it; faster than oral unless it is a thick medication designed to absorb over time.","IM advantage: can be formulated for slower absorption (e.g. Depo-Provera for 13 weeks contraception); patient can self-administer (e.g. EpiPen).","IM disadvantage: risk of pain and nerve damage; slower onset/distribution; variable absorption.","SC: given beneath the skin into connective tissue or fat immediately under the dermis; faster than oral but less reliable, as local blood flow and tissue diffusion influence absorption.","SC advantage: slow absorption can provide a sustained effect (e.g. insulin); patient can self-medicate.","SC disadvantage: limited to non-irritating drugs; risk of irritation, pain and necrosis; slower onset; small volumes and doses only."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slides 38–41"}},{"id":"qbfd64fb568","quiz":"concepts2","sys":"found","pts":2,"q":"Why can the lungs absorb medication so readily, and what physical form must an inhaled medication take?","qh":"<p>Why can the lungs absorb medication so readily, and what physical form must an inhaled medication take?</p>","qt":"Why can the lungs absorb medication so readily, and what physical form must an inhaled medication take?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The lungs have a large surface area for absorbing medications.","There are many capillaries adjacent to the alveolar membranes (air sacs), so medications can readily enter the bloodstream.","Inhaled medication must be in the form of gases or fine mists (aerosols) — e.g. asthma inhalers and nebulisers."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slide 49"}},{"id":"qfa4e8d91ee","quiz":"concepts2","sys":"found","pts":3,"q":"Explain dissolution, and rank the oral formulations from fastest to slowest absorption.","qh":"<p>Explain dissolution, and rank the oral formulations from fastest to slowest absorption.</p>","qt":"Explain dissolution, and rank the oral formulations from fastest to slowest absorption.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Dissolution is where the drug goes into a solution. Solid forms must first disintegrate (break apart), then dissolve, to become available for absorption.","Faster dissolution = faster absorption. Liquid medications absorb fastest because they do not need to disintegrate.","Order: elixirs and syrups (fastest) → suspensions → powders → capsules → tablets → coated tablets, i.e. enteric-coated or sustained release (slowest)."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slide 61 · Pharmacokinetics (1) 2026 slide 24"}},{"id":"q757252d387","quiz":"concepts2","sys":"found","pts":4,"q":"Give the four reasons an enteric coating is used.","qh":"<p>Give the four reasons an enteric coating is used.</p>","qt":"Give the four reasons an enteric coating is used.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Prevents decomposition of sensitive drugs by gastric secretions.","Prevents dilution of the drug.","Prevents nausea and vomiting induced by the drug's effect in the stomach.","Provides delayed action of the drug.","Mechanism: the coating prevents dissolution in the stomach; it dissolves in the intestine, and the medication is then absorbed."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slide 66"}},{"id":"qf1fc85e070","quiz":"concepts2","sys":"found","pts":3,"q":"What are excipients, and name four kinds found in a tablet?","qh":"<p>What are excipients, and name four kinds found in a tablet?</p>","qt":"What are excipients, and name four kinds found in a tablet?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Excipients are inert chemicals in a formulation — e.g. fillers, colours, flavours, stabilisers.","The active medication may be only a very small fraction of the total tablet weight.","A tablet is compressed powdered medication that also contains: binders (adhesive to stick the powder together), disintegrators (to assist dissolution), lubricants (to make manufacturing easier), and fillers (for a convenient tablet size)."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slides 62–63"}},{"id":"q99ab2ad722","quiz":"concepts2","sys":"found","pts":2,"q":"Distinguish a hard capsule from a soft capsule (softgel).","qh":"<p>Distinguish a hard capsule from a soft capsule (softgel).</p>","qt":"Distinguish a hard capsule from a soft capsule (softgel).","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Both encase the medication inside a gelatin shell.","Hard capsule: contains the drug as a solid (powder, granule). Can be opened and the contents emptied out if needed, e.g. some capsules in aged care.","Soft capsule (softgel): contains the drug as a liquid solution. Useful if fast action is required."],"src":"Question and model answer are the tool’s · from Pharmacology Concepts (2) 2026 slide 67"}},{"id":"q4380a7c79c","quiz":"concepts2","sys":"found","pts":5,"q":"Give the meaning of: prn, mane, nocte, od, bd, tds, qid, qqh, ac, pc, stat.","qh":"<p>Give the meaning of: prn, mane, nocte, od, bd, tds, qid, qqh, ac, pc, stat.</p>","qt":"Give the meaning of: prn, mane, nocte, od, bd, tds, qid, qqh, ac, pc, stat.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["prn — if necessary. mane — in the morning. nocte — at night.","od — once daily. bd / bid — twice a day. tds — three times a day.","qid — four times a day (four times in 24 hours). qqh, q4h — every four hours.","ac — before meals. pc — after meals. stat — immediately."],"src":"Question and model answer are the tool’s · from Must Know: Medication & Prescription Abbreviations 01.26 (PDF) · Concepts (2) slide 77"}},{"id":"q066514466e","quiz":"concepts2","sys":"found","pts":4,"q":"Give the meaning of the route abbreviations PO, SL, SC, IM, IV, PR — and of NKA and NKDA.","qh":"<p>Give the meaning of the route abbreviations PO, SL, SC, IM, IV, PR — and of NKA and NKDA.</p>","qt":"Give the meaning of the route abbreviations PO, SL, SC, IM, IV, PR — and of NKA and NKDA.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["PO — orally. SL — sublingual (under the tongue). SC — subcut., subcutaneous.","IM — intramuscular. IV — intravenous. PR — rectally.","NKA — no known allergies. NKDA — no known drug allergies."],"src":"Question and model answer are the tool’s · from Must Know: Medication & Prescription Abbreviations 01.26 (PDF) · Concepts (2) slides 78 & 80"}},{"id":"q53718eeeef","quiz":"calcs","sys":"calc","pts":4,"q":"State the main medication calculation formula, say what each term means, and list the three kinds of medication it works for.","qh":"<p>State the main medication calculation formula, say what each term means, and list the three kinds of medication it works for.</p>","qt":"State the main medication calculation formula, say what each term means, and list the three kinds of medication it works for.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Formula: (what you WANT ÷ what you have GOT) × VOLUME = the dosage amount to administer.","What you want = \"prescribed\", \"charted\", \"ordered\", \"is to be given\".","What you have got = \"in stock\", \"on hand\", or \"you have\".","Volume = the volume or unit the stock strength comes in (1 tablet, 5 mL, 2 mL).","Works for: oral tablets and capsules; oral liquids (elixir, syrup, suspension); injected medicines including SC, IM and direct IV.","Some sources write the volume over 1 — that is also accurate, since any number divided by 1 is itself."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 15–18"}},{"id":"q0e09015651","quiz":"calcs","sys":"calc","pts":3,"q":"List the five steps of the Medication Calculation Checklist taught in this course.","qh":"<p>List the five steps of the Medication Calculation Checklist taught in this course.</p>","qt":"List the five steps of the Medication Calculation Checklist taught in this course.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["No distractions.","Are the units the same?","Formula.","Does the answer look correct?","Double check."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slide 13"}},{"id":"q759b3eb2c4","quiz":"calcs","sys":"calc","pts":3,"q":"A patient has been prescribed digoxin 0.25 mg. You have tablets of 62.5 mcg. How many tablets should you give? Show the conversion.","qh":"<p>A patient has been prescribed digoxin 0.25 mg. You have tablets of 62.5 mcg. How many tablets should you give? Show the conversion.</p>","qt":"A patient has been prescribed digoxin 0.25 mg. You have tablets of 62.5 mcg. How many tablets should you give? Show the conversion.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["mg ≠ mcg, so convert first: 0.25 mg × 1000 = 250 mcg prescribed.","250 mcg ÷ 62.5 mcg × 1 tablet.","= 4 tablets."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 23–24 (worked example 2)"}},{"id":"qc3f94345fb","quiz":"calcs","sys":"calc","pts":2,"q":"A child is prescribed paracetamol 250 mg. The suspension contains 200 mg/5 mL. What volume do you give?","qh":"<p>A child is prescribed paracetamol 250 mg. The suspension contains 200 mg/5 mL. What volume do you give?</p>","qt":"A child is prescribed paracetamol 250 mg. The suspension contains 200 mg/5 mL. What volume do you give?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Units already match (mg and mg), so no conversion needed.","250 mg ÷ 200 mg × 5 mL.","= 6.25 mL."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 27–29 (worked example 4)"}},{"id":"qf4f14eb47c","quiz":"calcs","sys":"calc","pts":3,"q":"Te Atawhai is prescribed furosemide 0.1 g IM. You have furosemide 20 mg/2 mL. What volume is required?","qh":"<p>Te Atawhai is prescribed furosemide 0.1 g IM. You have furosemide 20 mg/2 mL. What volume is required?</p>","qt":"Te Atawhai is prescribed furosemide 0.1 g IM. You have furosemide 20 mg/2 mL. What volume is required?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Convert: 0.1 g × 1000 = 100 mg furosemide.","100 mg ÷ 20 mg × 2 mL.","= 10 mL."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 35–36 (worked example 8)"}},{"id":"q5f71edd4b2","quiz":"calcs","sys":"calc","pts":2,"q":"State the body-weight dosing formula, and use it: ampicillin 10 mg/kg every 6 hours for Wei, who weighs 30 kg. What is the single dose?","qh":"<p>State the body-weight dosing formula, and use it: ampicillin 10 mg/kg every 6 hours for Wei, who weighs 30 kg. What is the single dose?</p>","qt":"State the body-weight dosing formula, and use it: ampicillin 10 mg/kg every 6 hours for Wei, who weighs 30 kg. What is the single dose?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Formula: dose per kg (mg/kg) × body weight (kg) = administered dose.","Read the \"/\" as \"per\" — 10 mg/kg means 10 milligrams per kilogram.","10 mg/kg × 30 kg = 300 mg. The single dose for Wei is 300 mg."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 39–40 (worked example 9)"}},{"id":"qf641d3f1f7","quiz":"calcs","sys":"calc","pts":3,"q":"Naveen weighs 40 kg and is prescribed prednisone 1 mg/kg/day in 2 divided doses. You have 5 mg tablets. How many tablets per dose? Show all three steps.","qh":"<p>Naveen weighs 40 kg and is prescribed prednisone 1 mg/kg/day in 2 divided doses. You have 5 mg tablets. How many tablets per dose? Show all three steps.</p>","qt":"Naveen weighs 40 kg and is prescribed prednisone 1 mg/kg/day in 2 divided doses. You have 5 mg tablets. How many tablets per dose? Show all three steps.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Step 1 — daily dose: 40 kg × 1 mg/kg/day = 40 mg per day.","Step 2 — single dose: 40 mg ÷ 2 doses = 20 mg per dose.","Step 3 — oral tablet formula: 20 mg ÷ 5 mg × 1 tablet = 4 tablets."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 48–49 (worked example)"}},{"id":"qb508f50228","quiz":"calcs","sys":"calc","pts":3,"q":"State the IV drip-rate formula and explain the difference between drop factor and drip rate.","qh":"<p>State the IV drip-rate formula and explain the difference between drop factor and drip rate.</p>","qt":"State the IV drip-rate formula and explain the difference between drop factor and drip rate.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Drip rate (drops/min) = [volume to be given (mL) × drop factor] ÷ [time (hours) × 60 (minutes)].","[[Drop factor]] = drops/mL (gtt/mL) — how BIG the drops are, i.e. how many drops make 1 mL. It is fixed by the type of giving set and you are always given it.","[[Drip rate]] = drops/min (gtt/min) — how FAST the drops are delivered. It is adjustable and is what the nurse calculates.","You can tell drip rate is about speed because it is per minute, not per mL."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 66 & 68"}},{"id":"q5719ba2ab6","quiz":"calcs","sys":"calc","pts":3,"q":"Tania is prescribed Sodium Chloride 0.9% 1000 mL over 12 hours. The giving set delivers 60 drops per mL. What rate should the nurse set?","qh":"<p>Tania is prescribed Sodium Chloride 0.9% 1000 mL over 12 hours. The giving set delivers 60 drops per mL. What rate should the nurse set?</p>","qt":"Tania is prescribed Sodium Chloride 0.9% 1000 mL over 12 hours. The giving set delivers 60 drops per mL. What rate should the nurse set?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Top: 1000 mL × 60 drops/mL = 60,000 drops.","Bottom: 12 hr × 60 = 720 minutes.","60,000 ÷ 720 = 83.33 drops/min.","Round DOWN (.4 or lower) → 83 drops per minute."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slide 70 (worked example 14)"}},{"id":"q4f612dcec2","quiz":"calcs","sys":"calc","pts":3,"q":"Mr Willis is prescribed Sodium Chloride 0.9% 1 L over 5 hours, drop factor 20 gtt/mL. What rate should be set?","qh":"<p>Mr Willis is prescribed Sodium Chloride 0.9% 1 L over 5 hours, drop factor 20 gtt/mL. What rate should be set?</p>","qt":"Mr Willis is prescribed Sodium Chloride 0.9% 1 L over 5 hours, drop factor 20 gtt/mL. What rate should be set?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Convert first: 1 L = 1000 mL (the formula requires mL).","Top: 1000 mL × 20 drops/mL = 20,000 drops. Bottom: 5 hr × 60 = 300 minutes.","20,000 ÷ 300 = 66.66 drops/min.","Round UP (.5 or higher) → 67 drops per minute."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 73–74 (worked example 16)"}},{"id":"qe5f569f91b","quiz":"calcs","sys":"calc","pts":3,"q":"Explain the order-of-operations trap in the drip-rate calculation, using the deck's own numbers.","qh":"<p>Explain the order-of-operations trap in the drip-rate calculation, using the deck's own numbers.</p>","qt":"Explain the order-of-operations trap in the drip-rate calculation, using the deck's own numbers.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["You must complete unit conversions and the top/bottom multiplications FIRST, before dividing.","Typing 1000 × 60 ÷ 12 × 60 into a calculator returns 300,000 drops/min — impossible.","That happens because the calculator did 60 ÷ 12 first.","Correct order: 1000 × 60 = 60,000 on top; 12 × 60 = 720 on the bottom; then 60,000 ÷ 720 = 83.33 drops/min."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slide 71"}},{"id":"qb618ea1afc","quiz":"calcs","sys":"calc","pts":3,"q":"What does the ratio 1:1000 mean for adrenaline, and how is it derived?","qh":"<p>What does the ratio 1:1000 mean for adrenaline, and how is it derived?</p>","qt":"What does the ratio 1:1000 mean for adrenaline, and how is it derived?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["1:1000 means 1 mg in 1 mL.","The 1:1000 number literally means 1 g in 1000 mL.","Through unit conversion, 1 g × 1000 = 1000 mg, so 1000 mg:1000 mL.","Simplify by dividing both sides by 1000 → 1 mg:1 mL.","Modern packaging shows the ratio AND the mg/mL concentration; use the mg/mL for calculations."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slide 57"}},{"id":"q62abbac6f5","quiz":"calcs","sys":"calc","pts":2,"q":"Mrs Dell needs adrenaline 0.7 mg. The ampoule contains 1:1000 (1 mg/1 mL). How much is administered?","qh":"<p>Mrs Dell needs adrenaline 0.7 mg. The ampoule contains 1:1000 (1 mg/1 mL). How much is administered?</p>","qt":"Mrs Dell needs adrenaline 0.7 mg. The ampoule contains 1:1000 (1 mg/1 mL). How much is administered?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Recognise 1:1000 as 1 mg/1 mL, then use the standard formula.","0.7 mg ÷ 1 mg × 1 mL.","= 0.7 mL administered."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 62–63 (worked example 13)"}},{"id":"q0791d284dd","quiz":"calcs","sys":"calc","pts":3,"q":"Mr Singh is prescribed 4 mg of morphine. Morphine comes in 1 mL ampoules of 5 mg/mL. You dilute one ampoule with 9 mL of sterile water. How many mL do you administer?","qh":"<p>Mr Singh is prescribed 4 mg of morphine. Morphine comes in 1 mL ampoules of 5 mg/mL. You dilute one ampoule with 9 mL of sterile water. How many mL do you administer?</p>","qt":"Mr Singh is prescribed 4 mg of morphine. Morphine comes in 1 mL ampoules of 5 mg/mL. You dilute one ampoule with 9 mL of sterile water. How many mL do you administer?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Do the ADDITION first: 1 mL ampoule + 9 mL water = 10 mL total volume in the syringe.","The syringe now holds 5 mg in 10 mL.","4 mg ÷ 5 mg × 10 mL = 8 mL."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 99–100 (worked example 24)"}},{"id":"qf3a1bafa88","quiz":"calcs","sys":"calc","pts":2,"q":"Explain the order-of-operations trap in a syringe dilution, using the deck's XD example.","qh":"<p>Explain the order-of-operations trap in a syringe dilution, using the deck's XD example.</p>","qt":"Explain the order-of-operations trap in a syringe dilution, using the deck's XD example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["If a calculation includes addition, you must do the addition FIRST, before putting numbers into the formula.","Typing 3 ÷ 10 × 9 + 1 returns 3.7 mL — an overdose — because the calculator adds the 1 last.","Correct order: 9 mL + 1 mL = 10 mL volume; then 3 mg ÷ 10 mg × 10 mL = 3 mL."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slide 94"}},{"id":"qdc034fedb8","quiz":"calcs","sys":"calc","pts":3,"q":"5-year-old Sophie is charted amoxicillin 400 mg. The reconstituted 150 mL bottle has a concentration of 250 mg/5 mL. What volume do you give — and what is the trap?","qh":"<p>5-year-old Sophie is charted amoxicillin 400 mg. The reconstituted 150 mL bottle has a concentration of 250 mg/5 mL. What volume do you give — and what is the trap?</p>","qt":"5-year-old Sophie is charted amoxicillin 400 mg. The reconstituted 150 mL bottle has a concentration of 250 mg/5 mL. What volume do you give — and what is the trap?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Want 400 mg; got 250 mg; volume 5 mL — NOT 150 mL.","400 mg ÷ 250 mg × 5 mL = 8 mL.","The trap: using the whole bottle volume (150 mL) gives 400 ÷ 250 × 150 = 240 mL, which the checklist should stop you on as a very unusual dose.","The formula can work from the whole bottle, but only with an extra step (250 mg × 30 = 7500 mg in the bottle → 400 ÷ 7500 × 150 = 8 mL) — harder, and it risks error."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 82–83 (worked example 18)"}},{"id":"qda34801980","quiz":"calcs","sys":"calc","pts":2,"q":"State the two rounding rules for this course.","qh":"<p>State the two rounding rules for this course.</p>","qt":"State the two rounding rules for this course.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Do NOT round medication volumes (mL) or tablet numbers.","DO round IV drip rates, because the nurse is counting whole drops and cannot count less than one.","For drip rates: .4 or lower rounds DOWN; .5 or higher rounds UP. E.g. 66.666 drops → 67 drops/min."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slides 69 & 102"}},{"id":"q90db56bee0","quiz":"calcs","sys":"calc","pts":2,"q":"What is a \"red herring\" in a calculation question? Give the deck's two examples.","qh":"<p>What is a &quot;red herring&quot; in a calculation question? Give the deck's two examples.</p>","qt":"What is a \"red herring\" in a calculation question? Give the deck's two examples.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A name or number in the question that does not relate to your calculation formula.","Example: the concentration of the IV fluid (Dextrose 5%) when you are working out a drip rate.","Example: the frequency (tds) when you are working out how many tablets to give in a SINGLE dose."],"src":"Question and model answer are the tool’s · from Medication Calculations 2026 slide 102"}},{"id":"qd8c3a28515","quiz":"pk1","sys":"pkpd","pts":4,"q":"Define pharmacokinetics and name its four processes, describing each in one line.","qh":"<p>Define pharmacokinetics and name its four processes, describing each in one line.</p>","qt":"Define pharmacokinetics and name its four processes, describing each in one line.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Pharmacokinetics is \"what the body does to the drug\" — the passage of a drug through the body.","Absorption — the entry of a drug into the bloodstream.","Distribution — the movement of a drug between the blood and body tissues.","Metabolism — the modification of a drug (usually by the liver).","Excretion — the removal of a drug (and its metabolites) from the body."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slides 5–7"}},{"id":"q11540f4416","quiz":"pk1","sys":"pkpd","pts":2,"q":"Define absorption. Which route does not require it, and why?","qh":"<p>Define absorption. Which route does not require it, and why?</p>","qt":"Define absorption. Which route does not require it, and why?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Absorption]] is the process by which an unchanged drug reaches the bloodstream (systemic circulation) after administration and dissolution.","Absorption plays a key role in every method of drug administration EXCEPT the intravenous route.","IV medications enter the bloodstream directly and do not need to be absorbed from the site they are given."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slide 13"}},{"id":"qfa730430c6","quiz":"pk1","sys":"pkpd","pts":4,"q":"Name the seven factors affecting absorption listed in the lecture.","qh":"<p>Name the seven factors affecting absorption listed in the lecture.</p>","qt":"Name the seven factors affecting absorption listed in the lecture.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Route of administration of the drug.","Blood flow at the site of absorption.","Nature of the membrane.","Medication formulation.","Solubility of the drug.","GI tract status.","pH of the small intestine."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slide 16"}},{"id":"qfc435fb413","quiz":"pk1","sys":"pkpd","pts":3,"q":"Explain how the nature of the membrane affects absorption, with an example of each property.","qh":"<p>Explain how the nature of the membrane affects absorption, with an example of each property.</p>","qt":"Explain how the nature of the membrane affects absorption, with an example of each property.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["SURFACE AREA: greater surface area = greater absorption. The small intestine has a very large surface area (villi); the oral mucosa has a small surface area.","THICKNESS: thinner membrane = faster absorption. A single layer, e.g. the epithelium of the small intestine, gives rapid absorption.","A multi-layered membrane, e.g. the thick skin on the palms of the hands, gives slower absorption."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slide 23"}},{"id":"q52e7a7046e","quiz":"pk1","sys":"pkpd","pts":2,"q":"Why are lipid-soluble drugs absorbed more rapidly than water-soluble drugs?","qh":"<p>Why are lipid-soluble drugs absorbed more rapidly than water-soluble drugs?</p>","qt":"Why are lipid-soluble drugs absorbed more rapidly than water-soluble drugs?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Solubility]] is the ability of a substance to be dissolved into a solution.","Cell membranes are composed of a lipid bilayer.","So lipid-soluble drugs are rapidly absorbed, and water-soluble drugs are poorly absorbed."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slide 26"}},{"id":"q52243cc5d9","quiz":"pk1","sys":"pkpd","pts":2,"q":"Describe how blood flow affects absorption, and give a disease example.","qh":"<p>Describe how blood flow affects absorption, and give a disease example.</p>","qt":"Describe how blood flow affects absorption, and give a disease example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Absorption into the bloodstream depends on the blood flow at the site.","High blood supply → faster absorption, e.g. sublingual.","Low blood supply → slower absorption, e.g. topical.","Blood flow can be impacted by disease state — poor peripheral circulation in shock can significantly reduce absorption of intramuscular injections."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slide 22"}},{"id":"q2e896a362b","quiz":"pk1","sys":"pkpd","pts":2,"q":"Give two examples of food affecting drug absorption from the lecture.","qh":"<p>Give two examples of food affecting drug absorption from the lecture.</p>","qt":"Give two examples of food affecting drug absorption from the lecture.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Dairy (milk, yoghurt) can bind to certain antibiotics (tetracyclines) and prevent absorption.","Tannins in tea and coffee bind to iron, stopping its absorption."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slide 28"}},{"id":"qf9fc2de66f","quiz":"pk1","sys":"pkpd","pts":3,"q":"Define bioavailability. What is it for an IV medication, and what two things determine it for an oral one?","qh":"<p>Define bioavailability. What is it for an IV medication, and what two things determine it for an oral one?</p>","qt":"Define bioavailability. What is it for an IV medication, and what two things determine it for an oral one?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Bioavailability]] is how much of the drug actually reaches the bloodstream.","For intravenous medications, bioavailability = 100%.","For oral medications it depends on how much of the drug is absorbed in the GI tract,","and how much of the drug \"escapes\" being broken down by the liver."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slide 34"}},{"id":"qddeb2457cc","quiz":"pk1","sys":"pkpd","pts":4,"q":"Explain the hepatic first-pass effect, and work through the lecture's 100 mg example to give the bioavailability.","qh":"<p>Explain the hepatic first-pass effect, and work through the lecture's 100 mg example to give the bioavailability.</p>","qt":"Explain the hepatic first-pass effect, and work through the lecture's 100 mg example to give the bioavailability.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Hepatic first-pass effect]]: medicine taken orally is absorbed from the gut, then takes a \"first pass\" through the liver before it can reach the rest of the body.","The liver acts like a filter, breaking down part of the drug as it passes through, so only a portion of the original dose reaches the bloodstream unchanged.","You take a tablet with 100 mg of drug. 20 mg is not absorbed in the gut. 80 mg reaches the liver.","The liver breaks down 60 mg on the first pass. So only 20 mg gets into the bloodstream to have an effect.","This drug therefore has a bioavailability of 20%."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slides 35–36"}},{"id":"q13f14e2bc3","quiz":"pk1","sys":"pkpd","pts":4,"q":"Explain plasma protein binding and why it matters, including what happens when two drugs compete.","qh":"<p>Explain plasma protein binding and why it matters, including what happens when two drugs compete.</p>","qt":"Explain plasma protein binding and why it matters, including what happens when two drugs compete.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Many drugs bind reversibly to plasma proteins, mainly albumin.","Only FREE (unbound) drug can move from the bloodstream into tissues to produce a pharmacological effect.","Drugs vary in [[Affinity (protein binding)]] — some are highly protein-bound (warfarin at 99%), leaving very little free drug available.","Binding is dynamic: as free drug is removed from circulation (by distribution, metabolism or excretion), more free drug is released to replace what is lost.","Two drugs can compete for the same binding site, which may increase the amount of free drug and its effect."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slides 37–38"}},{"id":"q28e638b95a","quiz":"pk1","sys":"pkpd","pts":4,"q":"Compare the blood–brain barrier and the placental barrier.","qh":"<p>Compare the blood–brain barrier and the placental barrier.</p>","qt":"Compare the blood–brain barrier and the placental barrier.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Blood–brain barrier]]: a protective barrier that limits entry of substances into the brain, while allowing essential molecules like oxygen and glucose through.","Only small, lipid-soluble drugs pass effectively — brain capillary cells are tightly joined with a thick basement membrane, and brain cell membranes have a lipid bilayer.","The BBB may be disrupted in illness, e.g. meningitis.","[[Placental barrier]]: separates maternal and foetal blood vessels, but is NON-SELECTIVE — it allows many different drugs to cross.","Lipid-soluble drugs cross the placenta easily."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slides 41–42"}},{"id":"q4b4981ea17","quiz":"pk1","sys":"pkpd","pts":3,"q":"Name three tissues where drugs get concentrated, with the lecture's example for each.","qh":"<p>Name three tissues where drugs get concentrated, with the lecture's example for each.</p>","qt":"Name three tissues where drugs get concentrated, with the lecture's example for each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Bone tissue — e.g. tetracycline, which can discolour children's teeth.","Adipose tissue — lipid-soluble drugs, e.g. diazepam.","Thyroid gland — medications containing iodine."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (1) 2026 slide 43"}},{"id":"qa0b5c2c431","quiz":"pk2","sys":"pkpd","pts":4,"q":"Define drug metabolism. Name the main organ and three others, and state the three properties a metabolite usually has.","qh":"<p>Define drug metabolism. Name the main organ and three others, and state the three properties a metabolite usually has.</p>","qt":"Define drug metabolism. Name the main organ and three others, and state the three properties a metabolite usually has.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Metabolism (biotransformation)]] is the biological transformation of a drug into an inactive and water-soluble compound which can be excreted, almost always carried out by enzymes.","Main organ: the liver. Also the kidneys, the lungs and the intestinal mucosa.","Metabolites are usually more water-soluble (easier to excrete), less active or inactive, and usually less toxic.","Two exceptions the deck flags: some drugs are ACTIVATED by the liver, and a few can be converted into TOXIC metabolites."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slides 11–12"}},{"id":"q1e3d6b7a23","quiz":"pk2","sys":"pkpd","pts":3,"q":"Name the five sources of inter-individual variation in drug metabolism.","qh":"<p>Name the five sources of inter-individual variation in drug metabolism.</p>","qt":"Name the five sources of inter-individual variation in drug metabolism.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Genetics.","Environmental factors.","Disease states.","Age and gender.","Hormonal changes."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slide 13"}},{"id":"q7694e0618d","quiz":"pk2","sys":"pkpd","pts":4,"q":"Contrast enzyme inducers and enzyme inhibitors, including the effect on dosing.","qh":"<p>Contrast enzyme inducers and enzyme inhibitors, including the effect on dosing.</p>","qt":"Contrast enzyme inducers and enzyme inhibitors, including the effect on dosing.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Enzyme inducer]]: activates liver enzymes → accelerates metabolism → decreases the amount of drug that reaches the bloodstream.","So a higher dose may be needed to achieve the intended effect.","[[Enzyme inhibitor]]: inhibits liver enzymes → slows down metabolism → increases the amount of drug that reaches the bloodstream.","So toxicity may increase.","Environmental factors that do this include diet, co-administered drugs, alcohol and smoking."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slide 15"}},{"id":"q527b74ddf3","quiz":"pk2","sys":"pkpd","pts":3,"q":"Explain how heart failure and cirrhosis each affect drug metabolism, and what this means for care.","qh":"<p>Explain how heart failure and cirrhosis each affect drug metabolism, and what this means for care.</p>","qt":"Explain how heart failure and cirrhosis each affect drug metabolism, and what this means for care.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Heart failure: decreased liver perfusion and oxygenation → reduced liver enzyme activity → reduced drug metabolism → more active drug in the blood.","Cirrhosis (liver scarring): reduced enzyme activity → reduced clearance → more active drug in the blood.","Implications: reduced doses, close monitoring of therapeutic and toxic drug effects, and consideration of contraindications and alternative medications."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slide 16"}},{"id":"qbd346f21eb","quiz":"pk2","sys":"pkpd","pts":4,"q":"Name the main medication routes that AVOID hepatic first-pass metabolism.","qh":"<p>Name the main medication routes that AVOID hepatic first-pass metabolism.</p>","qt":"Name the main medication routes that AVOID hepatic first-pass metabolism.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Sublingual and buccal.","Intravenous (IV).","Intramuscular (IM).","Subcutaneous (SC).","Inhalation.","Intranasal.","Transdermal (patches).","Rectal.","The reason: they do not travel through the portal vein after being absorbed."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slide 18"}},{"id":"q77386ced56","quiz":"pk2","sys":"pkpd","pts":3,"q":"List the routes of drug excretion, naming the main organ.","qh":"<p>List the routes of drug excretion, naming the main organ.</p>","qt":"List the routes of drug excretion, naming the main organ.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Kidneys (main organ) → urine.","Liver → bile → faeces.","Lungs → expired air (e.g. the alcohol breath test).","Bowel.","Breast milk.","Sweat and saliva (minimal)."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slide 22"}},{"id":"q233506a1bc","quiz":"pk2","sys":"pkpd","pts":3,"q":"Name the four factors affecting drug excretion by the kidneys.","qh":"<p>Name the four factors affecting drug excretion by the kidneys.</p>","qt":"Name the four factors affecting drug excretion by the kidneys.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Water-soluble drugs — better excretion; the kidneys are the main organ for eliminating water-soluble substances.","Lipid-soluble drugs — poorly excreted, because they are reabsorbed.","Protein-bound drugs — not excreted, so they circulate longer.","Impaired renal function → reduced excretion of drugs. Important in renal failure, neonates and the elderly."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slide 24"}},{"id":"q630ef1901e","quiz":"pk2","sys":"pkpd","pts":3,"q":"Distinguish excretion, elimination and clearance.","qh":"<p>Distinguish excretion, elimination and clearance.</p>","qt":"Distinguish excretion, elimination and clearance.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Excretion]] is the physical removal of waste products or unchanged drugs from the body.","[[Elimination]] is the process of the body removing a drug from the bloodstream. Elimination = metabolism + excretion.","So a drug is eliminated when it is metabolised into an inactive metabolite, even before it is physically excreted in the urine.","[[Clearance]] is a measure of the rate (speed) of elimination of a drug from the bloodstream — and it is irreversible; the drug leaves and cannot come back."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slide 29"}},{"id":"q38e2e8cc59","quiz":"pk2","sys":"pkpd","pts":2,"q":"Compare hepatic clearance and renal clearance.","qh":"<p>Compare hepatic clearance and renal clearance.</p>","qt":"Compare hepatic clearance and renal clearance.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Hepatic clearance]] occurs in the liver, through metabolism (the major process, via enzymes) and excretion (a minor process, in the bile).","If hepatic clearance is high, all of the drug going through the liver is metabolised (and vice versa).","[[Renal clearance]] occurs in the kidneys, through excretion into the urine. Some reabsorption occurs, where the drug moves back into the plasma."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slides 30–31"}},{"id":"qfde9358940","quiz":"pk2","sys":"pkpd","pts":3,"q":"Define half-life and steady state, and state how long steady state takes to reach.","qh":"<p>Define half-life and steady state, and state how long steady state takes to reach.</p>","qt":"Define half-life and steady state, and state how long steady state takes to reach.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Half-life]] is the time taken for the plasma drug concentration to fall (decrease) by one-half. Also called the elimination half-life; it tells us how fast the drug leaves the body.","[[Steady state]] is where the rate of drug in = the rate of drug out, i.e. drug administration rate = drug elimination rate.","For most medications given at a constant dosing interval, it takes about 3–5 half-lives to reach steady state."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slides 32 & 38"}},{"id":"q03fc1f094a","quiz":"pk2","sys":"pkpd","pts":3,"q":"What is a dosing regimen for, and what is it individualised against?","qh":"<p>What is a dosing regimen for, and what is it individualised against?</p>","qt":"What is a dosing regimen for, and what is it individualised against?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Pharmacokinetic processes (ADME) affect how much drug reaches the bloodstream and how long it acts for.","[[Dosing regimen]]s maintain plasma drug concentrations within the [[Therapeutic range]].","They are individualised for each medication (during clinical trials) and for each patient — e.g. age, interactions, liver function, kidney function.","Example: amoxicillin, take 500 mg orally every 8 hours for 5 days."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slide 35"}},{"id":"qd464d3b1f3","quiz":"pk2","sys":"pkpd","pts":3,"q":"Define the therapeutic range, and explain therapeutic drug monitoring including what is measured.","qh":"<p>Define the therapeutic range, and explain therapeutic drug monitoring including what is measured.</p>","qt":"Define the therapeutic range, and explain therapeutic drug monitoring including what is measured.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The [[Therapeutic range]] is the plasma concentration range within which a drug produces its desired therapeutic effect (efficacy) without causing toxicity (safety).","[[Therapeutic drug monitoring]] is used for drugs with a narrow therapeutic range, e.g. warfarin, an anticoagulant used to reduce the risk of stroke.","Points measured: peak concentration and trough concentration.","It ensures the concentration of drug in the blood stays within the safe and effective range."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slides 36–37"}},{"id":"qeef3bc1876","quiz":"pk2","sys":"pkpd","pts":5,"q":"Summarise the pharmacokinetics of paracetamol under all four ADME headings.","qh":"<p>Summarise the pharmacokinetics of paracetamol under all four ADME headings.</p>","qt":"Summarise the pharmacokinetics of paracetamol under all four ADME headings.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["ABSORPTION: rapidly absorbed following oral administration; absorption can be delayed by agents that slow gastric emptying, e.g. food.","DISTRIBUTION: after absorption, distributed widely throughout body tissues; only a small proportion is protein-bound, so many drug molecules are available to act.","METABOLISM: primarily metabolised in the liver. A small amount is converted to a hepatotoxic metabolite, which can accumulate after overdose and, if untreated, cause liver damage.","EXCRETION: metabolites are excreted in the urine. The elimination half-life varies from 1–3 hours.","Most of each dose is excreted in the urine within 24 hours."],"src":"Question and model answer are the tool’s · from Pharmacokinetics (2) 2026 slides 42–45 (Medsafe Pacimol data sheet)"}},{"id":"qffc4f43c77","quiz":"pd","sys":"pkpd","pts":3,"q":"Define pharmacodynamics and state the four questions it asks.","qh":"<p>Define pharmacodynamics and state the four questions it asks.</p>","qt":"Define pharmacodynamics and state the four questions it asks.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Pharmacodynamics]] is the study of drug–target interactions, mechanisms of action, and the resulting biological effects — \"what the drug does to the body\".","Where exactly does the drug act?","How does the drug act?","What changes in function will it cause?","What happens to drug effects with time?"],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slides 4–5"}},{"id":"q9c32b603c9","quiz":"pd","sys":"pkpd","pts":3,"q":"Distinguish selectivity from specificity, and give the lecture's selectivity example.","qh":"<p>Distinguish selectivity from specificity, and give the lecture's selectivity example.</p>","qt":"Distinguish selectivity from specificity, and give the lecture's selectivity example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Selectivity]] = the number of TARGETS a drug interacts with. High selectivity → preference for one target; low → binds multiple targets.","[[Specificity]] = the number of EFFECTS a drug produces. High specificity → one main effect; low → multiple effects at multiple sites or tissues.","No drug is completely specific; most cause more than one effect.","Example: salbutamol is selective for beta-2 receptors in lung tissue, especially when inhaled, and has little effect on beta receptors in the heart."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slides 11–13"}},{"id":"q6312906ffc","quiz":"pd","sys":"pkpd","pts":3,"q":"Define affinity, efficacy and potency.","qh":"<p>Define affinity, efficacy and potency.</p>","qt":"Define affinity, efficacy and potency.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Affinity]]: how strongly the drug binds to its target. High affinity → binds strongly and tends to stay bound; low affinity → binds weakly and may detach easily.","[[Efficacy]]: the ability of a drug to activate its target and produce a biological response. Maximal efficacy is the greatest possible response even if the dose is increased further — the upper limit of the drug's action.","[[Potency]]: the amount of drug required to produce a given effect. High potency = the same effect at a lower dose; low potency = a higher dose needed for that same effect."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slides 14–16"}},{"id":"q6f33841459","quiz":"pd","sys":"pkpd","pts":4,"q":"Name the four main regulatory proteins drugs act on, with the lecture's drug example for each.","qh":"<p>Name the four main regulatory proteins drugs act on, with the lecture's drug example for each.</p>","qt":"Name the four main regulatory proteins drugs act on, with the lecture's drug example for each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Transporter]] — fluoxetine, an SSRI, blocks the serotonin transporter so more serotonin stays available to improve mood.","[[Ion channel]] — amlodipine blocks the movement of calcium ions into muscle cells, relaxing blood vessels and slowing the heartbeat.","[[Enzyme (as a drug target)]] — ibuprofen inhibits COX enzymes to partially block the pathway that causes pain, fever and inflammation.","[[Receptor]] — large protein molecules, usually on the cell membrane, that a drug binds to, triggering a signal that changes cell function."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slides 18–22"}},{"id":"qdd949c891b","quiz":"pd","sys":"pkpd","pts":3,"q":"Explain the difference between an agonist and an antagonist using the lock-and-key analogy.","qh":"<p>Explain the difference between an agonist and an antagonist using the lock-and-key analogy.</p>","qt":"Explain the difference between an agonist and an antagonist using the lock-and-key analogy.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Agonist]]: the drug binds to AND activates a receptor, producing the same effect as the endogenous chemical substance.","An agonist has affinity for a receptor AND efficacy — the key fits the lock and opens the door. Example: salbutamol binds beta receptors to relax the airways.","[[Antagonist]]: the drug binds to the receptor and blocks access of the endogenous substance, but does not elicit a response.","An antagonist has affinity for a receptor BUT NO efficacy — the key fits the lock, but the door will not open. Example: metoprolol, a beta blocker, prevents binding to beta receptors."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slides 23–24"}},{"id":"q654aedd34e","quiz":"pd","sys":"pkpd","pts":4,"q":"Explain receptor up-regulation and down-regulation, with the lecture's clinical example of each.","qh":"<p>Explain receptor up-regulation and down-regulation, with the lecture's clinical example of each.</p>","qt":"Explain receptor up-regulation and down-regulation, with the lecture's clinical example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Cells can change how many receptors they have on their surface.","[[Upregulation]]: more receptors → the cell is more sensitive. Often occurs when receptors are repeatedly BLOCKED.","If the drug is suddenly stopped the body may become over-responsive to endogenous signals — e.g. rebound hypertension after stopping long-term beta-blockers.","[[Downregulation]]: fewer receptors → the cell is less responsive. Often occurs when receptors are repeatedly STIMULATED.","E.g. chronic opioid use overstimulates opioid receptors, leading to downregulation and desensitisation, so patients respond less to the same dose over time (tolerance)."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 25"}},{"id":"q7d8600130c","quiz":"pd","sys":"pkpd","pts":2,"q":"What are non-specific drug actions? Give two examples.","qh":"<p>What are non-specific drug actions? Give two examples.</p>","qt":"What are non-specific drug actions? Give two examples.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Some drugs do not rely on specific targets; instead they act through chemical reactions, physical properties, or changes in the environment.","Activated charcoal — absorbs toxins from the gut, which are then excreted.","Calcium carbonate chews (e.g. Quick-Eze) — neutralise stomach acid."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 26"}},{"id":"qd28d44d8ac","quiz":"pd","sys":"pkpd","pts":3,"q":"Describe the dose-response relationship.","qh":"<p>Describe the dose-response relationship.</p>","qt":"Describe the dose-response relationship.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The [[Dose-response relationship]] describes how the size of a drug's effect changes as the dose of the drug changes.","At low doses, there may be little or no effect.","As the dose increases, the response increases.","Eventually the response reaches maximal efficacy, where giving more drug will not increase the effect."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 31"}},{"id":"q2252f448c9","quiz":"pd","sys":"pkpd","pts":3,"q":"Define the therapeutic range in pharmacodynamic terms, including MEC and MTC.","qh":"<p>Define the therapeutic range in pharmacodynamic terms, including MEC and MTC.</p>","qt":"Define the therapeutic range in pharmacodynamic terms, including MEC and MTC.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The therapeutic range is a measure of the safety margin of the drug — the range between efficacy and toxicity.","A wider range = a safer drug.","[[Minimum effective concentration (MEC)]]: the lowest plasma concentration that produces a therapeutic (beneficial) effect.","[[Minimum toxic concentration (MTC)]]: the lowest plasma concentration at which toxic (harmful) effects begin."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 32"}},{"id":"q6e353efcc0","quiz":"pd","sys":"pkpd","pts":3,"q":"Explain how pharmacokinetics and pharmacodynamics are linked.","qh":"<p>Explain how pharmacokinetics and pharmacodynamics are linked.</p>","qt":"Explain how pharmacokinetics and pharmacodynamics are linked.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The rate (timing) and extent (amount) of the drug response depends heavily on pharmacokinetics — what the body does to the drug.","Pharmacokinetics determines how much drug reaches the site of action.","That in turn impacts the onset, intensity and duration of the pharmacodynamic effect.","Pharmacokinetic concepts help us understand why drug responses change over time."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 34"}},{"id":"qe12cc65de8","quiz":"pd","sys":"pkpd","pts":3,"q":"Define an adverse effect and distinguish it from an adverse drug event.","qh":"<p>Define an adverse effect and distinguish it from an adverse drug event.</p>","qt":"Define an adverse effect and distinguish it from an adverse drug event.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["An adverse effect is a \"harmful effect suspected to be caused by a medicine or vaccine\".","All medications cause adverse effects in some people, but most people take medicines without suffering any serious adverse effects.","They range from mild (e.g. nausea) to serious (e.g. liver injury); some can be predicted, others occur unexpectedly, e.g. severe allergy.","Also known as adverse drug reactions, side effects or undesirable effects — \"adverse effect\" is the preferred term.","An [[Adverse drug event]] is an injury related to the drug but not always DUE to the drug — e.g. errors in prescribing, dispensing or administration (often human error)."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slides 43–44"}},{"id":"qb10679ad9f","quiz":"pd","sys":"pkpd","pts":3,"q":"List the six PERSON-related risk factors for adverse effects.","qh":"<p>List the six PERSON-related risk factors for adverse effects.</p>","qt":"List the six PERSON-related risk factors for adverse effects.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Age — neonates or older persons.","Sex — female sex (XX chromosomes at birth) appear to be more susceptible.","Organ health — kidney or liver disease.","Genetic factors — e.g. certain genes may predispose to allergy.","History of prior adverse effects from drugs.","Polypharmacy (taking five drugs or more)."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 46"}},{"id":"qaea1d6df65","quiz":"pd","sys":"pkpd","pts":3,"q":"List the five DRUG-related risk factors for adverse effects.","qh":"<p>List the five DRUG-related risk factors for adverse effects.</p>","qt":"List the five DRUG-related risk factors for adverse effects.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Chemical characteristics — e.g. drugs with large molecules can trigger an immune reaction, or drugs with low selectivity act on multiple receptors.","Drug class — e.g. anticoagulants like aspirin have higher bleeding risk.","Route of administration — e.g. the oral route has lower allergy risk than the IV route.","Dose — higher doses increase risk.","Duration and frequency — longer or more frequent use increases risk."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 47"}},{"id":"q52a2d2599e","quiz":"pd","sys":"pkpd","pts":3,"q":"Give the lecture's two examples of pharmacodynamic drug–drug interactions and explain each mechanism.","qh":"<p>Give the lecture's two examples of pharmacodynamic drug–drug interactions and explain each mechanism.</p>","qt":"Give the lecture's two examples of pharmacodynamic drug–drug interactions and explain each mechanism.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Pharmacodynamic drug interactions occur when one drug (including complementary therapies) directly alters the effect of another drug.","Warfarin and aspirin → increased risk of bleeding, as both drugs inhibit clotting in different ways (an additive effect).","Metoprolol and salbutamol → reduced effect of salbutamol in the lungs when managing asthma, because salbutamol acts on beta receptors as an agonist, but metoprolol blocks beta receptors as an antagonist."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 45"}},{"id":"qba995693e6","quiz":"pd","sys":"pkpd","pts":3,"q":"What is CARM, who may report to it, and why does it matter?","qh":"<p>What is CARM, who may report to it, and why does it matter?</p>","qt":"What is CARM, who may report to it, and why does it matter?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[CARM]] is the Centre for Adverse Reactions Monitoring.","It is important to document ALL adverse effects — patients may need alerts.","Reports of suspected adverse reactions are submitted to an online database; CARM further assesses serious and fatal events.","Who can report: health professionals, patients and whānau."],"src":"Question and model answer are the tool’s · from Pharmacodynamics 2026 slide 48"}},{"id":"qa6ada17019","quiz":"admin","sys":"admin","pts":4,"q":"Name the five authorised prescribers and the designated prescribers in Aotearoa NZ.","qh":"<p>Na
