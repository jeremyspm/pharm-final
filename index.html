e about using one?</p>","qt":"Who is responsible for a traditional Māori medicine, and what should a nurse do when whānau ask for advice about using one?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Responsibility rests with the tohunga or rongoā practitioner — karakia and kawa differ between tribal areas, and the nurse does not prescribe or prepare it.","The nurse arranges a discussion with everyone involved, including the tohunga or practitioner, so the client can make an informed decision — e.g. bringing the practitioner, the whānau and the prescriber together before a remedy is started in hospital."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 9 (NZNO Guidelines 2024, s 7.7)"}},{"id":"q753834f4de","quiz":"joan-cam","sys":"cam","pts":3,"q":"List three issues a nurse should consider when a patient wants to use rongoā alongside prescribed medicines, and give an example of why one matters.","qh":"<p>List three issues a nurse should consider when a patient wants to use rongoā alongside prescribed medicines, and give an example of why one matters.</p>","qt":"List three issues a nurse should consider when a patient wants to use rongoā alongside prescribed medicines, and give an example of why one matters.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Any three, from the guideline’s five: the knowledge and experience of the practitioner · whether the substance is appropriate for the client’s condition · potential side effects.","Potential interactions with other prescribed medicines · whether there is any evidence-based information about the remedy.","Example: a plant tonic traditionally used to lower blood sugar, taken with prescribed diabetes medicine, could add to its effect — so the prescriber needs to know and blood glucose needs watching."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 9 (NZNO Guidelines 2024, s 7.7); slides 14–15 for the example"}},{"id":"qc1a3850e6a","quiz":"joan-cam","sys":"cam","pts":2,"q":"Distinguish the biomedical view of medicine from the wholistic view, and give an example of a wholistic model.","qh":"<p>Distinguish the biomedical view of medicine from the wholistic view, and give an example of a wholistic model.</p>","qt":"Distinguish the biomedical view of medicine from the wholistic view, and give an example of a wholistic model.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Biomedical view: illness is a fault in one part of the body, found and treated with a targeted intervention (reductionist). Wholistic view: the person is treated as a whole — body, mind, spirit, whānau and environment together.","Example: Te Whare Tapa Whā — taha tinana, taha hinengaro, taha wairua and taha whānau; rongoā is itself a Māori model of health."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slides 2, 12 and 29"}},{"id":"qc5c4f53044","quiz":"joan-cam","sys":"cam","pts":2,"q":"What is integrated medicine? Give an example.","qh":"<p>What is integrated medicine? Give an example.</p>","qt":"What is integrated medicine? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: bringing evidence-based complementary and alternative therapies together with conventional (biomedical) care, sharing evidence between the two systems for the common goal of improving people’s health — while recognising that large gaps in the evidence remain.","Example: a patient receiving mirimiri and karakia alongside their prescribed treatment, with the team and the practitioner each aware of what the other is doing."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 3 (Mortada, 2024)"}},{"id":"q049d7ba1f5","quiz":"joan-cam","sys":"cam","pts":2,"q":"What is Tikanga ā Rongoā (Ministry of Health, 2014), and what is it for?","qh":"<p>What is Tikanga ā Rongoā (Ministry of Health, 2014), and what is it for?</p>","qt":"What is Tikanga ā Rongoā (Ministry of Health, 2014), and what is it for?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a voluntary standard, developed with the rongoā sector, that sets clear requirements for providers of rongoā services — a benchmark of excellence.","Purpose / example: safe, quality rongoā care for tūroro (patients) — it supports consistent quality between providers and the ongoing development of the rongoā workforce."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 11"}},{"id":"qf24f2c3b4b","quiz":"joan-cam","sys":"cam","pts":2,"q":"Health is described as a taonga under Te Tiriti o Waitangi. Explain what that means, and give a statistic that shows the obligation is not being met.","qh":"<p>Health is described as a taonga under Te Tiriti o Waitangi. Explain what that means, and give a statistic that shows the obligation is not being met.</p>","qt":"Health is described as a taonga under Te Tiriti o Waitangi. Explain what that means, and give a statistic that shows the obligation is not being met.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Meaning: Te Tiriti guaranteed Māori the same rights and privileges as British subjects, and Māori retained tino rangatiratanga over their taonga (treasures) — health is a taonga, so there is a right to equal health outcomes.","Statistic: life expectancy at birth is 7.1 years shorter for Māori than for non-Māori, with many of the worst health outcomes of any population in Aotearoa (Sheridan et al., 2024)."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 7"}},{"id":"q2a6a902e05","quiz":"joan-cam","sys":"cam","pts":2,"q":"What is te maramataka, and how is it used in health? Give an example.","qh":"<p>What is te maramataka, and how is it used in health? Give an example.</p>","qt":"What is te maramataka, and how is it used in health? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the Māori lunar calendar — an indigenous system of attuning with the environment.","Use / example: each phase is associated with different energy, mood and activity levels, so it is used to anticipate wellbeing and to plan activity and rest around it — e.g. checking today’s phase for expected mood and energy."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 28 (Warbrick et al., 2023)"}}],"chains":[],"cases":[],"focus":[{"id":"law","sys":"law","tier":0,"t":"Medicines law and controlled drugs","flag":"tape","done":"Say what an Act, a regulation, a policy and a guideline are; name the three key Acts and what each does; give the four legal classifications of medicines (prescription · restricted · pharmacy-only · general sale) with an example; define a controlled drug and describe Classes A, B and C and how they are stored; name the regulators (Medsafe, PHARMAC, HRC, CARM); say what the law means at the bedside — no prescription or standing order, no administration; nurses do not prescribe or dispense; insist on proper prescribing.","ask":"A definition plus an example in 3–4 lines. Her own framing question in the lecture: “what is the difference between a controlled drug and a prescribed drug?” (all controlled drugs are prescribed; not all prescribed drugs are controlled).","cap":"Examples of drugs in a class are HER examples and fair game as examples; she will not ask you about a specific drug’s pharmacology. Penalty details and police powers were one line on a slide. The syllabus does not list the legal-standards outcome (LO2) for the exam — but she said after this lecture that it “will be assessed”, and the tape is the later word.","src":"Deck 09 slides 2–20 · her 16 Sep lecture [00:00–10:14] · her Escape Room answer sheet, Lock 1","n":15,"all":15,"pts":46,"qz":2,"saq":14,"na":15},{"id":"competence","sys":"law","tier":0,"t":"HPCAA, scope of practice, fitness to practise and the six pou","flag":"tape SKIP","done":"Give the purpose of the HPCAA 2003 (public safety) and the four things it requires of an RN; define scope of practice as demonstrated competence, not a task list, with something outside an RN’s scope; say what fitness to practise means and what endangers it; say what the Nursing Council does, tell it from NZNO (regulator with an enforceable Code of Conduct vs union with a Code of Ethics), and that “nurse” is a protected title; say what a pou is and name all six; define cultural safety as the Council does.","ask":"Definition plus example. The Escape Room (Lock 2) is the model: given a scenario, name two pou that were compromised and say how.","cap":"She explained the WORD pou and then skipped the six individually (slides 38–45: “I’m not going to go into the pou today”) — unlectured but in the deck and in her own Escape Room answers, so read them yourself. The $130 fee and the register details are colour, not content.","src":"Deck 09 slides 28–45 · her 16 Sep lecture [21:02–36:59] · Escape Room answer sheet, Lock 2","n":12,"all":12,"pts":29,"qz":3,"saq":9,"na":12},{"id":"conduct-ethics","sys":"law","tier":0,"t":"Code of Conduct, Code of Ethics values and ethical issues in pharmacology","flag":"tape SKIP","done":"Say which of the four key documents is law, which are enforceable standards and which is a guideline; give a Code of Conduct principle with a medicines example (P2 excipients · P4 double-check · P5 no information over the phone · P7 report errors honestly); define veracity, autonomy, rangatiratanga, beneficence, non-maleficence, justice, confidentiality and fidelity, each with an example; say why PRN and believed-or-not pain are ethical problems; say why concealing an error is worse than making it (the Nurse D case).","ask":"Definition plus example — “define veracity and give an example”. The Escape Room (Lock 3) asks for a Code of Conduct principle with an example of how practice could improve; Lock 4 is a crossword of the Māori and Western values.","cap":"She worked through only veracity, rangatiratanga and autonomy and set the rest as reading (slides 64–83), and ran none of the scenarios (46–52, 84–88). Slide 90, the four-document comparison table, is the best single revision page in the deck. You will not be asked to recite all sixteen values; you may be asked to define any one.","src":"Deck 09 slides 21–27 and 53–90 · her 16 Sep lecture [10:14–21:02] and [36:59–1:03:38] · Escape Room answer sheet, Locks 3–4","n":21,"all":21,"pts":54,"qz":2,"saq":16,"na":21},{"id":"devmkt","sys":"law","tier":0,"t":"Drug development, clinical trials and medicines advertising","flag":"tape SD","done":"Give the five stages from discovery to post-market monitoring; give the purpose of clinical trial Phases 1–4 (safe? · works? · at scale? · keep watching); name the three bodies that approve a trial in NZ (Medsafe, SCOTT, HDEC) and what each checks; define informed consent in a trial; say when a placebo is acceptable and what randomisation costs a participant; name the five kinds of medicines advertising; say why NZ is unusual; say how a nurse can advertise by accident and how to avoid it (generic names, balanced facts).","ask":"Definition plus example — “what is a reminder advertisement?”, “when is a placebo ethically acceptable?”.","cap":"Never lectured: on 16 Sep she ran out of time and handed it over as a self-directed online package — still examinable. Participant numbers and progression percentages are the kind of detail a 3–4 line answer has no room for; know what each phase is FOR. Thalidomide is the one historical example she told herself.","src":"Deck 13 (33 slides) · her 16 Sep lecture [59:31] and [1:00:26]","n":38,"all":38,"pts":87,"qz":2,"saq":31,"na":38},{"id":"concepts1","sys":"found","tier":1,"t":"Core terms — contraindication, precaution, interaction, drug names, Medsafe and PHARMAC","flag":"tape LO1","done":"Define pharmacology and a medication; define contraindication, precaution and medication interaction, each with an example; give a medicine’s three names and say why generic prescribing is preferred (and its two exceptions); define bioequivalence; tell Medsafe (regulates) from PHARMAC (funds); say what a nurse must know before giving any medicine.","ask":"Her own worked example of an exam short answer comes from here: “what is the meaning of contraindication, and give an example” [1:05:06]. “Mostly definitions, because it’s an introductory paper.”","cap":"Generic-name suffixes and drug-class naming are in the deck, but a question on them would be a specific-drug question, which she ruled out.","src":"Deck 01 Pharmacology Concepts (1) · her 16 Sep lecture [1:05:06]","n":23,"all":23,"pts":55,"qz":2,"saq":16,"na":23},{"id":"pk1","sys":"pkpd","tier":1,"t":"Pharmacokinetics 1 — absorption, bioavailability, first pass, distribution","flag":"LO1","done":"Define pharmacokinetics and name ADME; define absorption and say which route needs none; list what changes absorption (membrane, lipid solubility, blood flow, food); define bioavailability (IV = 100%) and the hepatic first-pass effect, with the 100 mg → 20 mg example; explain plasma protein binding and what competition for binding sites does; say what the blood–brain and placental barriers keep out.","ask":"Definition plus example — “define bioavailability and give an example”. LO1 (“apply pharmacological principles”) is assessed in the exam and this is its centre.","cap":"The lecture’s examples of drugs concentrating in particular tissues are named drugs — out, by her rule. No calculations here beyond the first-pass arithmetic.","src":"Deck 04 Pharmacokinetics (1)","n":24,"all":24,"pts":54,"qz":2,"saq":17,"na":24},{"id":"pk2","sys":"pkpd","tier":1,"t":"Pharmacokinetics 2 — metabolism, excretion, half-life, therapeutic range","flag":"LO1","done":"Define metabolism (the liver, enzymes, usually to an inactive water-soluble metabolite); contrast enzyme inducers and inhibitors and what each does to dosing; name the routes that avoid first pass; separate excretion, elimination and clearance; define half-life (about five to clear, three to five to reach steady state); define the therapeutic range and therapeutic drug monitoring (peak and trough).","ask":"Definition plus example — “define half-life and give an example of how it is used”.","cap":"Summarising one named drug under all four ADME headings is a specific-drug question — drillable here, never in a mock, and not her exam.","src":"Deck 04 Pharmacokinetics (2)","n":24,"all":24,"pts":57,"qz":2,"saq":16,"na":24},{"id":"pd","sys":"pkpd","tier":1,"t":"Pharmacodynamics and adverse effects","flag":"LO1 LO4","done":"Define pharmacodynamics; define affinity, efficacy and potency; tell an agonist from an antagonist with lock and key; explain receptor up- and down-regulation; describe a dose–response relationship and the therapeutic range (MEC to MTC); define an adverse effect against an adverse drug event; list person- and drug-related risk factors; say what CARM is and who may report.","ask":"Definition plus example — “distinguish an agonist from an antagonist and give an example of each”. LO4 (mechanisms of action, therapeutic uses, side effects) is assessed here as principle, not drug by drug.","cap":"Every lecture example of a drug acting on a receptor, enzyme, channel or carrier is a named drug — use one as YOUR example if it helps, but the question will not be about it.","src":"Deck 04 Pharmacodynamics","n":29,"all":29,"pts":65,"qz":3,"saq":20,"na":29},{"id":"educ","sys":"admin","tier":1,"t":"Medication errors and patient education (Ask · Build · Check)","flag":"LO3","done":"Define a medication error and separate it from an adverse effect; give ways to prevent errors and the steps for managing and reporting one; say what concealment costs; run Ask–Build–Check for a medicine; adapt medication education for a child, a teenager and an older adult; tie an education example to a Te Tiriti principle.","ask":"Definition plus example — “define a medication error and give an example”. LO3 (medication education for health literacy and self-management) is assessed in the exam and this lecture is the only place it is taught.","cap":"Ask–Build–Check is the same model as in the INP paper’s Health Literacy lecture — learn it once. Listing all five Te Tiriti principles with meanings is a five-mark list question: drillable, not her format.","src":"Deck 05 Medication Administration and Patient Education (2)","n":22,"all":22,"pts":65,"qz":2,"saq":15,"na":22},{"id":"concepts2","sys":"found","tier":2,"t":"Classification, routes, formulations and abbreviations","flag":"LO1","done":"Name the ways medicines are classified; tell a local from a systemic effect; compare routes (oral, IV, IM, subcutaneous, inhaled, topical, rectal) for speed and drawbacks; define dissolution, excipient and enteric coating and say why a coated tablet is not crushed; read the common prescription abbreviations (prn, bd, tds, qid, mane, nocte, stat, PO, SL, SC, IM, IV, PR, NKDA).","ask":"Definition plus example — “what is an excipient? give an example”. Abbreviations are natural multi-choice.","cap":"An eleven-abbreviation recall list is a five-mark list question — drillable, never dealt into a mock.","src":"Deck 01 Pharmacology Concepts (2)","n":27,"all":27,"pts":65,"qz":2,"saq":19,"na":27},{"id":"admin","sys":"admin","tier":2,"t":"Safe medication administration — the rights and checks, the medication chart","flag":"","done":"Give the rights and checks as taught in this course (8 rights + 2 checks — Med Admin deck (1) slide 23) and what each asks of you; say how identity is checked; say what to do when no route is written; act correctly on a refusal; explain right indication and why PRN needs a nursing assessment; state the documentation rules; say who may prescribe.","ask":"Definition plus example — “what does right indication require? give an example”.","cap":"The outcome this belongs to (LO2) is assessed by the practical and the calculations test, not listed for the exam — but “all modules” are examinable. The MoH aged-care guide’s shorter “5 rights” is a different list: use the course’s.","src":"Deck 05 Medication Administration and Patient Education (1)","n":27,"all":27,"pts":72,"qz":2,"saq":18,"na":27},{"id":"elderly","sys":"life","tier":2,"t":"Medicines in the older adult and polypharmacy","flag":"LO1","done":"Define an older person (65+, young-old, old-old, frail); say how ageing changes absorption, distribution, metabolism and renal excretion and what that does to dosing; name the common adverse effects in older adults; define polypharmacy (five or more), why it happens, its risks and how it is managed; say when a tablet may be crushed; tell errors of commission from omission.","ask":"Definition plus example — “define polypharmacy and give an example of a risk it raises”.","cap":"The Beers Criteria examples and the prevalence figures are named drugs and statistics — not 3–4 line material.","src":"Deck 06a Medication in the Elderly & Polypharmacy","n":29,"all":29,"pts":72,"qz":2,"saq":21,"na":29},{"id":"lifespan","sys":"life","tier":2,"t":"Medicines in pregnancy, lactation and children","flag":"LO1","done":"Say how medicines reach the foetus and when it is most vulnerable; define a teratogen and the highest-risk period; say what the pregnancy categories A and X mean; give the three things that decide transfer into breast milk and the guiding principle; say why children are not small adults; describe neonatal and childhood pharmacokinetics in a sentence each; give the age bands.","ask":"Definition plus example — “define a teratogen and give an example”.","cap":"The table of named teratogens and the substance-by-substance effects on the foetus are specific-drug content — drillable here, not her exam.","src":"Deck 07 Medications in Pregnancy, Lactation and Children","n":28,"all":28,"pts":74,"qz":2,"saq":20,"na":28},{"id":"allergy","sys":"imm","tier":2,"t":"Anaphylaxis — the ASCIA action plan (Module 8 so far)","flag":"LO4","done":"Recognise anaphylaxis from its signs against a mild-to-moderate reaction; give the steps of the ASCIA plan in order, including positioning and its exceptions; say what is given first when someone with asthma and a food allergy suddenly cannot breathe, and why.","ask":"Unknown until Module 8 is taught — Immunology, Vaccines & Allergy is Wed 7 Oct. Only the ASCIA plan is on Canvas so far.","cap":"This row is one handout, not a module. The lecture will add vaccines and immunology; the row is rebuilt when its deck lands.","src":"ASCIA Action Plan for Anaphylaxis (Canvas)","n":11,"all":11,"pts":27,"qz":1,"saq":6,"na":11},{"id":"cam","sys":"cam","tier":2,"t":"Rongoā Māori (Module 10, part 1)","flag":"","done":"Define rongoā Māori and its three parts (mirimiri, karakia, rongoā rākau); say who is responsible for a traditional medicine (the tohunga or practitioner) and what a nurse does when whānau ask about one; give the five things to consider alongside prescribed medicines; tell the biomedical from the wholistic view; define integrated medicine; say what Tikanga ā Rongoā is; say why health is a taonga.","ask":"Definition plus example. A guest lecture (15 Sep), so how Joan will ask it is unknown; the NZNO guideline paragraph quoted on slide 9 is the most examinable thing in the deck.","cap":"The plant-by-plant slides are the specific-drug problem in another form — no question here asks about a named plant. The presenter’s own prescribing model (astrology, elements) is described as his own.","src":"Rongoā 2026 deck (guest lecture, 15 Sep)","n":8,"all":8,"pts":17,"qz":1,"saq":8,"na":8},{"id":"socio-cam","sys":"cam","tier":2,"t":"Socioeconomic factors and complementary/alternative medicines (Module 10, part 2)","flag":"untaught","done":"Not taught yet — Wed 14 Oct, as a self-directed CANVAS QUIZ.","ask":"That quiz will be the first lecturer-written pharmacology questions this paper has had (its only Canvas quizzes so far are medication-calculation practice tests). Sit it, submit it, and save the graded page.","cap":"Nothing to build from until then.","src":"Canvas timetable","n":0,"all":0,"pts":0,"qz":0,"saq":0,"na":0},{"id":"tox","sys":"imm","tier":2,"t":"Licit and illicit drugs and toxicology (Module 9)","flag":"untaught","done":"Not taught yet — Tue 20 Oct, 8–10 am. Record it.","ask":"Unknown. She flagged on 16 Sep that licit and illicit drug use “gets its own later lecture”, and that fear of causing addiction would be picked up again.","cap":"Nothing to build from until then.","src":"Canvas timetable · her 16 Sep lecture [04:46]","n":0,"all":0,"pts":0,"qz":0,"saq":0,"na":0},{"id":"calcs","sys":"calc","tier":3,"t":"Medication calculations","flag":"","done":"State the dose formula and the drip-rate formula; convert units; work a tablet, a liquid, a weight-based and a drip-rate question; apply the course’s rounding rules; spot a red herring.","ask":"A calculation cannot be “a definition plus an example”, so expect this in the multi-choice if anywhere.","cap":"Calculations are assessed by their own test (15 out of 15 to pass, with resits). Worked calculations here are never dealt into the written section of a mock.","src":"Deck 02 Medication Calculations","n":26,"all":26,"pts":57,"qz":1,"saq":18,"na":26}],"helpline":{},"held":[],"meta":{"id":"pharm-final","prefix":"phf.","title":"Pharm · Paper Sim — Final exam","h1":"Pharm · Paper Sim","short":"Pharm Paper Sim","paper":"Introduction to Pharmacology","bankOf":"this tool’s","who":"Joan","aiCtx":"I’m a first-year nursing student in New Zealand sitting the final exam for Introduction to Pharmacology (multi-choice plus short answers; my lecturer said a short answer is a definition plus an example in 3–4 lines, and that she will not ask about specific drugs).","sitting":{"what":"the Pharmacology final","date":"2026-11-06","when":"Fri 6 Nov, afternoon (time not confirmed yet)","cohortClose":null},"shape":{"closed":30,"saq":null,"saqMarks":20,"minutes":80,"mini":12},"shapeNote":"The real paper is <b>80 min · 50 marks · 30 multi r own test. Her revision sessions (21, 27 and 28 Oct, each with a mini exam) will re-rank this list. Every count is made by the build, which fails unless each question sits in exactly one row.","sources":"Joan’s recorded Legal &amp; Ethical lecture of 16 Sep 2026 (by timestamp), her Escape Room answer sheet, the 14 lecture decks plus the Rongoā deck, the course syllabus (learning outcomes and assessment table) and the Canvas timetable.","t0n":"Joan said it on tape","t0w":"Named by the person who writes the paper, on a recording, with a timestamp. That is not a question count, so it sits above the ranking, not inside it.","t1w":"A learning outcome that the exam assesses names these. Question counts play no part — the questions are the tool’s.","t3w":"Has its own assessment, so the final is unlikely to lean on it. Keep the formulas warm; do not camp here.","critLbl":"Module","flagn":{"LO1":"LO1 · pharmacological principles","LO3":"LO3 · medication education","LO4":"LO4 · mechanisms, uses, side effects","SD":"self-directed — never lectured","SKIP":"she skipped slides here — read them yourself"}}}};

const SHORTS = {"qc553ad0325":{"id":"joan-found:what is the meaning of contraindication","title":"Contraindication","hook":"CONTRA = against: a reason NOT to give it.","groups":[{"q":"Definition","facts":[{"t":"A situation where a medication should **not be used**","of":[0]},{"t":"… because it **may be harmful** to the person","of":[0]}]},{"q":"Example","facts":[{"t":"A known **severe allergy** to that medicine","of":[1]},{"t":"Or a medicine that can **harm the foetus** in a **pregnant** woman","of":[1]}]}]},"q46e1fa36b3":{"id":"joan-found:what is a precaution in relation","title":"Precaution vs contraindication","hook":"Contraindication = NO. Precaution = yes, but CAREFULLY.","groups":[{"q":"Definition, and the difference","facts":[{"t":"A warning to use it with **special care**","of":[0]},{"t":"A **heightened risk of adverse effects**","of":[0]},{"t":"Unlike a contraindication, it **may still be used**: **monitoring** or a **dose adjustment**","of":[0]}]},{"q":"Example","facts":[{"t":"**Reduced kidney function** in an **older adult**","of":[1]},{"t":"Still given, at a **lower dose**, with monitoring","of":[1]}]}]},"q4aa9ab8e04":{"id":"joan-found:define a medication interaction and give","title":"Medication interaction","hook":"Something else changes what the medicine does.","groups":[{"q":"Definition","facts":[{"t":"The medicine’s **effect** is **altered by another substance or condition**","of":[0]},{"t":"Another **medication**, a **food**, a **complementary** medicine, an illness","of":[0]}]},{"q":"Example","facts":[{"t":"A **herbal remedy** or food changes how much is **absorbed or broken down**","of":[1]},{"t":"… making it **stronger or weaker**","of":[1]},{"t":"So the nurse **asks about everything** the person takes","of":[1]}]}]},"qabbf6d4776":{"id":"joan-found:distinguish a medicine s generic name","title":"Generic name vs brand name","hook":"One generic name; many brand names.","groups":[{"q":"The difference","facts":[{"t":"**Generic**: the **official name of the active ingredient**; **one per medicine**","of":[0]},{"t":"**Brand**: **owned by the company**; a medicine **may have several**","of":[0]}]},{"q":"Why it matters","facts":[{"t":"Knowing only brands, a patient may **take both** of **the same medicine**","of":[1]},{"t":"Teaching by **generic name** **reduces error**","of":[1]}]}]},"q1670a56e76":{"id":"joan-found:distinguish the roles of medsafe and","title":"Medsafe vs PHARMAC","hook":"Medsafe: is it SAFE? PHARMAC: will we PAY for it?","groups":[{"q":"Medsafe","facts":[{"t":"The **safety authority**: it **regulates**","of":[0]},{"t":"e.g. is a new medicine **safe** and good enough **quality** to be **approved**?","of":[0]}]},{"q":"PHARMAC","facts":[{"t":"Decides which medicines are **funded** (**subsidised**)","of":[1]},{"t":"… within a **fixed budget**; e.g. **which brand** is subsidised","of":[1]}]}]},"qc2a33fa1bc":{"id":"joan-found:distinguish a local effect from a","title":"Local vs systemic effect","hook":"Local = right where it goes on. Systemic = through the blood.","groups":[{"q":"Local","facts":[{"t":"At the **immediate site of administration**","of":[0]},{"t":"e.g. a **cream** on a skin rash; **eye drops**","of":[0]}]},{"q":"Systemic","facts":[{"t":"**Absorbed into the circulation** and **distributed** to where it acts","of":[1]},{"t":"e.g. a **tablet swallowed** for a headache","of":[1]}]}]},"q684eebab1a":{"id":"joan-found:what is an excipient give an","title":"Excipients","hook":"Everything in the tablet that is NOT the medicine.","groups":[{"q":"Definition","facts":[{"t":"An **inert** (**inactive**) ingredient in a formulation","of":[0]},{"t":"**Fillers**, **binders**, **colours**, flavours","of":[0]}]},{"q":"Example, and why the nurse cares","facts":[{"t":"The **gelatine** in a **capsule shell**","of":[1]},{"t":"It matters if **vegetarian**, **vegan** or for **religious reasons**","of":[1]},{"t":"So the nurse checks: **Code of Conduct Principle 2**","of":[1]}]}]},"q59be19d899":{"id":"joan-found:what is an enteric coating and","title":"Enteric coating","hook":"Survives the stomach, dissolves in the gut. Crush it and that is gone.","groups":[{"q":"What it is","facts":[{"t":"It stops the tablet **dissolving in the stomach**","of":[0]},{"t":"It **dissolves in the intestine**","of":[0]}]},{"q":"What it is for","facts":[{"t":"**Protecting the medicine** from **stomach acid**","of":[0]},{"t":"Or **protecting the stomach**, or **delaying its action**","of":[0]}]},{"q":"What goes wrong if it is ignored","facts":[{"t":"**Crushing** it **destroys the coating**","of":[1]},{"t":"**Absorbed too fast**, or **irritates the stomach**","of":[1]},{"t":"**Check with a pharmacist** first","of":[1]}]}]},"q8c5ce44365":{"id":"joan-pkpd:define pharmacokinetics and give an example","title":"Pharmacokinetics","hook":"What the BODY does to the drug: A-D-M-E.","groups":[{"q":"Definition","facts":[{"t":"“**What the body does to the drug**”","of":[0]},{"t":"**Absorption**, **distribution**, **metabolism**, **excretion** (**ADME**)","of":[0]}]},{"q":"Example (any one process)","facts":[{"t":"**Absorption**: a swallowed tablet **entering the bloodstream** from the gut","of":[1]},{"t":"**Metabolism**: the **liver** modifying it; **excretion**: the **kidneys**","of":[1]}]}]},"q4292f75e63":{"id":"joan-pkpd:define absorption and give an example","title":"Absorption","hook":"Getting into the blood. IV skips it.","groups":[{"q":"Definition","facts":[{"t":"**Unchanged drug** reaches the **bloodstream**","of":[0]},{"t":"… after it has been given and has **dissolved**","of":[0]}]},{"q":"A route that does not need it","facts":[{"t":"**Intravenous**: straight **into the bloodstream**","of":[1]},{"t":"Nothing to absorb, so the effect is **rapid**","of":[1]}]}]},"q2540c548d3":{"id":"joan-pkpd:define bioavailability and give an example","title":"Bioavailability","hook":"How much actually arrives. IV = all of it.","groups":[{"q":"Definition","facts":[{"t":"How much of the dose **actually reaches the bloodstream**","of":[0]}]},{"q":"Two routes compared","facts":[{"t":"**Intravenous = 100%**","of":[1]},{"t":"By mouth it is **lower**: some **not absorbed**, some **broken down by the liver**","of":[1]}]}]},"q7b3f6c44ee":{"id":"joan-pkpd:explain the hepatic first pass effect","title":"The hepatic first-pass effect","hook":"Swallowed → gut → LIVER first → then the body.","groups":[{"q":"Definition","facts":[{"t":"Taken **by mouth**, it **passes through the liver** first","of":[0]},{"t":"The **liver breaks down part of it**","of":[0]},{"t":"Only **a portion of the dose** arrives unchanged","of":[0]}]},{"q":"Consequence","facts":[{"t":"e.g. **100 mg** swallowed → only **20 mg** reaches the circulation","of":[1]},{"t":"So **oral doses** are often **larger than IV doses**","of":[1]},{"t":"**Sublingual**, **transdermal** or **IV** routes **avoid it**","of":[1]}]}]},"q00b0ae36d3":{"id":"joan-pkpd:what is plasma protein binding and","title":"Plasma protein binding","hook":"Only the FREE drug works.","groups":[{"q":"Definition","facts":[{"t":"Many drugs **bind** reversibly to **plasma proteins**, mainly **albumin**","of":[0]},{"t":"Only the **free** (**unbound**) drug can act","of":[0]}]},{"q":"Why it matters, with an example","facts":[{"t":"Two medicines **compete for the same binding site**","of":[1]},{"t":"Or **low albumin** in a **malnourished** older adult","of":[1]},{"t":"More **free drug** → more effect, **risk of toxicity**","of":[1]}]}]},"q0d1648ccc6":{"id":"joan-pkpd:define drug metabolism and give an","title":"Drug metabolism","hook":"The liver changes it so the body can get rid of it.","groups":[{"q":"Definition","facts":[{"t":"**Biological transformation** of a drug, by **enzymes**","of":[0]},{"t":"Mainly in the **liver**; into a **less active**, **more water-soluble** compound","of":[0]}]},{"q":"Something that changes it","facts":[{"t":"An **enzyme inhibitor** slows it: levels rise, **toxicity**","of":[1]},{"t":"An **enzyme inducer** speeds it: a **higher dose** may be needed","of":[1]},{"t":"**Alcohol**, **smoking**, diet, **liver disease** can all change it","of":[1]}]}]},"qa471ade3d3":{"id":"joan-pkpd:define half life and give an","title":"Half-life","hook":"Half gone each half-life; about five of them and it is all gone.","groups":[{"q":"Definition","facts":[{"t":"The time for the **plasma concentration** to **fall by one half**","of":[0]},{"t":"Not how long the **whole drug** stays in the body","of":[0]}]},{"q":"How it is used","facts":[{"t":"Cleared after about **5 half-lives**","of":[1]},{"t":"**Steady state** after **3–5 half-lives** of regular dosing","of":[1]},{"t":"It sets the **dosing interval**","of":[1]}]}]},"q001d7cf710":{"id":"joan-pkpd:define the therapeutic range and give","title":"The therapeutic range","hook":"Enough to work, not enough to poison.","groups":[{"q":"Definition","facts":[{"t":"The **plasma concentration** range that gives the **desired effect** without **toxicity**","of":[0]},{"t":"Above the **minimum effective concentration**, below the **toxic** one","of":[0]}]},{"q":"When it is monitored","facts":[{"t":"**Therapeutic drug monitoring** for a **narrow therapeutic range**","of":[1]},{"t":"Blood levels at **peak and trough**","of":[1]}]}]},"q3c572899d8":{"id":"joan-pkpd:define pharmacodynamics and give an example","title":"Pharmacodynamics","hook":"What the DRUG does to the body.","groups":[{"q":"Definition","facts":[{"t":"“**What the drug does to the body**”","of":[0]},{"t":"**Drug–target interactions**, **mechanisms of action**, the **effects**","of":[0]}]},{"q":"Example","facts":[{"t":"A medicine **binding to a receptor** on **airway muscle**","of":[1]},{"t":"… making it **relax**, so **breathing becomes easier**","of":[1]}]}]},"q80512273ab":{"id":"joan-pkpd:distinguish an agonist from an antagonist","title":"Agonist vs antagonist","hook":"Agonist: the key fits AND opens. Antagonist: it fits, the door stays shut.","groups":[{"q":"Agonist","facts":[{"t":"**Binds to and activates** a receptor","of":[0]},{"t":"Like the **body’s own chemical**: the key **opens the door**","of":[0]},{"t":"e.g. a **reliever inhaler** activating **beta receptors**","of":[0]}]},{"q":"Antagonist","facts":[{"t":"**Binds** and **blocks** it, **without producing a response**","of":[1]},{"t":"e.g. a **beta blocker**: stops the body’s **adrenaline** binding","of":[1]}]}]},"qce244f5697":{"id":"joan-pkpd:distinguish potency from efficacy with an","title":"Potency vs efficacy","hook":"Potency = HOW MUCH you need. Efficacy = HOW FAR it can go.","groups":[{"q":"The definitions","facts":[{"t":"**Potency**: the **amount of drug needed** for a given effect","of":[0]},{"t":"More potent: the same effect at a **lower dose**","of":[0]},{"t":"**Efficacy**: the **ability of the drug to produce a response**","of":[0]},{"t":"**Maximal efficacy**: the **greatest response possible**","of":[0]}]},{"q":"Example","facts":[{"t":"Two pain relievers: **5 mg** vs **500 mg** for mild pain: **different potency**","of":[1]},{"t":"Only one relieves **severe pain** at any dose: **greater efficacy**","of":[1]}]}]},"q10219ec6ee":{"id":"joan-pkpd:define an adverse effect and give","title":"Adverse effect vs adverse drug event","hook":"Effect = the drug did it. Event = something around the drug did.","groups":[{"q":"Adverse effect","facts":[{"t":"A **harmful effect** suspected to be **caused by a medicine**","of":[0]},{"t":"The preferred term for “**side effect**”","of":[0]},{"t":"e.g. **nausea** (mild); **liver injury**, **severe allergy** (serious)","of":[0]}]},{"q":"How an adverse drug event differs","facts":[{"t":"An **injury related to the drug**","of":[1]},{"t":"… **not always due to the drug itself**: e.g. an **error** in **prescribing**","of":[1]}]}]},"q7fdc63c15b":{"id":"joan-admin:define a medication error and give","title":"Medication error vs adverse effect","hook":"Error = a person slipped. Adverse effect = the medicine did it.","groups":[{"q":"Definition","facts":[{"t":"Any **preventable event** that may cause **inappropriate medication use** or **patient harm**","of":[0]},{"t":"… while the medicine is **in the control** of staff or patient","of":[0]},{"t":"e.g. a **dose given twice**; a known **allergy** ignored","of":[0]}]},{"q":"How it differs from an adverse effect","facts":[{"t":"Adverse effect: harm from **the medicine itself**, **even when used correctly**","of":[1]},{"t":"Error: harm from **human action**, a lapse in the **rights and checks**","of":[1]}]}]},"q4506ebe345":{"id":"joan-admin:what is the right to refuse","title":"The right to refuse","hook":"Explain, document, tell, discard: never pressure, never hide it.","groups":[{"q":"What it is","facts":[{"t":"A patient **has the right to refuse** a medication","of":[0]},{"t":"(Unless under the **Mental Health Act**): **informed consent** and **autonomy**","of":[0]}]},{"q":"What the nurse does","facts":[{"t":"**Explains the consequences** of not taking it","of":[1]},{"t":"**Documents the refusal** and the reason; **informs the prescriber**","of":[1]},{"t":"**Discards the refused dose**; **no pressure**, **no hiding it in food**","of":[1]}]}]},"q0e5047d731":{"id":"joan-admin:what does the right indication require","title":"The right indication","hook":"Know WHY before you give it.","groups":[{"q":"What it requires","facts":[{"t":"The nurse is **accountable** for knowing **why** it is given","of":[0]},{"t":"Is it for the **right reason for this patient**?","of":[0]}]},{"q":"Example","facts":[{"t":"A **PRN** (as-needed) medicine","of":[1]},{"t":"**Assess the patient** first: is the **reason it was charted** actually present?","of":[1]}]}]},"q8dc9e9266c":{"id":"joan-admin:what is carm and who can","title":"CARM: what it is, who reports","hook":"A reaction? Document it, flag it, report it to CARM.","groups":[{"q":"What it is, and who reports","facts":[{"t":"The **Centre for Adverse Reactions Monitoring**","of":[0]},{"t":"NZ’s database of **suspected adverse reactions** to medicines and **vaccines**","of":[0]},{"t":"**Health professionals**, **patients and whānau** can all report","of":[0]}]},{"q":"Example to report","facts":[{"t":"A **widespread rash** and **facial swelling** after **starting a new medicine**","of":[1]},{"t":"It is **documented**, an **alert** placed on the record, and **reported**","of":[1]}]}]},"qbe831fca79":{"id":"joan-life:define polypharmacy and give an example","title":"Polypharmacy","hook":"Five or more, and the risks multiply.","groups":[{"q":"Definition","facts":[{"t":"The **concurrent use of multiple medications**, usually **five or more**","of":[0]},{"t":"It implies **too many**, or **unnecessary**, medicines","of":[0]}]},{"q":"A risk it raises (any one)","facts":[{"t":"**Drug–drug interactions** and **adverse effects**","of":[1]},{"t":"**Falls**; not taking them **as prescribed**; **death**","of":[1]}]}]},"q1491b07030":{"id":"joan-life:how is an older person defined","title":"The older person, and why age matters","hook":"65+: the kidneys slow down, and drugs build up.","groups":[{"q":"Definition","facts":[{"t":"Aged **65 years and over**","of":[0]},{"t":"**Young-old** 65–79; **old-old** 80+","of":[0]},{"t":"**Frail elderly**: 65+ with a **debilitating condition**","of":[0]}]},{"q":"Why age matters","facts":[{"t":"**Kidney function declines**, so the medicine **stays in the body longer**","of":[1]},{"t":"It can **build up to toxic levels**, so doses are **often lower**","of":[1]}]}]},"q4778ea06cf":{"id":"joan-life:when may a tablet be crushed","title":"When a tablet may be crushed","hook":"The pharmacist says yes AND it helps the patient.","groups":[{"q":"When","facts":[{"t":"Only when a **pharmacist has advised** it is safe to","of":[0]},{"t":"**And** it is in the **patient’s best interest**","of":[0]}]},{"q":"The harm crushing can cause","facts":[{"t":"Crushing an **enteric-coated** or **modified-release** tablet","of":[1]},{"t":"**Releases the whole dose at once**: **absorbed too rapidly**","of":[1]},{"t":"Or it becomes **less effective**","of":[1]}]}]},"q8a95e80d6e":{"id":"joan-life:define a teratogen and give an","title":"Teratogens","hook":"First trimester = organs forming = highest risk.","groups":[{"q":"Definition","facts":[{"t":"A substance that can cause **developmental abnormalities** in a **foetus**","of":[0]},{"t":"**Birth defects**, **developmental delay**, intellectual disability","of":[0]}]},{"q":"Example","facts":[{"t":"Some **prescription medicines**; **herbal products**, **alcohol**, **nicotine**","of":[1]}]},{"q":"When the risk is highest","facts":[{"t":"The **first trimester** (**weeks 0–12**)","of":[1]},{"t":"… when the **organs are forming**","of":[1]}]}]},"qa170e24e78":{"id":"joan-life:on what does the transfer of","title":"Medicines in breast milk","hook":"Blood level, milk amount, fat-solubility. Keep the parent well.","groups":[{"q":"What the transfer depends on","facts":[{"t":"The parent’s **plasma concentration** of the drug","of":[0]},{"t":"The **amount of milk** the infant takes","of":[0]},{"t":"The drug’s **lipid solubility**","of":[0]}]},{"q":"The guiding principle","facts":[{"t":"**Maintaining the parent’s health is essential**","of":[1]},{"t":"Not **automatically** stopped: the prescriber **weighs the risk** to the infant","of":[1]}]}]},"qe03adddc9f":{"id":"joan-life:children are just small adults explain","title":"Children are not small adults","hook":"Different bodies, so doses by the kilo.","groups":[{"q":"Why it is false","facts":[{"t":"Children are **physiologically different** and **constantly developing**","of":[0]},{"t":"About **75% water**, less fat; **immature protective barriers**","of":[0]},{"t":"Poorer **temperature** and **homeostatic control**","of":[0]}]},{"q":"Example","facts":[{"t":"The dose comes from **body weight** (**mg per kg**)","of":[1]},{"t":"**Never** by simply **scaling down an adult dose**","of":[1]}]}]},"qd71245f58b":{"id":"joan-law:what is a controlled drug give","title":"Controlled drugs","hook":"Misuse of Drugs Act: abuse risk = double-locked.","groups":[{"q":"Definition","facts":[{"t":"A medicine under **special legal restriction**: **Misuse of Drugs Act 1975**","of":[0]},{"t":"Because of its **potential for abuse**, **dependence** and harm","of":[0]},{"t":"All controlled drugs are prescribed; **not all prescribed drugs are controlled**","of":[0]}]},{"q":"How they are handled on a ward","facts":[{"t":"**Opioids** like **morphine** (**Class B**)","of":[1]},{"t":"Kept in a **double-locked safe** inside a locked room","of":[1]},{"t":"**Restricted key-holders**; **penalties** for unlawful use","of":[1]}]}]},"q836f77608e":{"id":"joan-law:describe the three classes of controlled","title":"The three classes of controlled drug","hook":"A = never prescribed. B = locked-up opioids. C = lower risk, still locked.","groups":[{"q":"Class A","facts":[{"t":"**Very high risk of harm**; **never prescribed**","of":[0]},{"t":"e.g. **heroin**, **methamphetamine**","of":[0]}]},{"q":"Class B","facts":[{"t":"**Drugs of dependence**, **high risk of harm**; a **double-locked safe**","of":[1]},{"t":"e.g. **morphine** and the other **opioids**","of":[1]}]},{"q":"Class C","facts":[{"t":"**Lower potential for abuse**, **moderate risk of harm**","of":[2]},{"t":"Prescribed normally but **still locked away**: e.g. **codeine**, **diazepam**","of":[2]}]}]},"q47b76abc2e":{"id":"joan-law:name the four legal classifications of","title":"The four legal classes of medicine","hook":"Prescription → Restricted → Pharmacy-only → General sale.","groups":[{"q":"The four classes","facts":[{"t":"**Prescription medicine**: only on a **prescription** or **standing order**","of":[0]},{"t":"**Restricted** (**pharmacist-only**): the pharmacist must **explain it**","of":[0]},{"t":"**Pharmacy-only medicine**: sold in a **pharmacy** or **hospital**","of":[1]},{"t":"**General sale**: sold from **any retail outlet**","of":[1]}]},{"q":"Example (any one)","facts":[{"t":"**Amoxicillin** is **prescription-only**","of":[2]},{"t":"**Paracetamol** is **general sale**: a **supermarket** sells it","of":[2]}]}]},"qccff980d75":{"id":"joan-law:distinguish an act a regulation and","title":"Act, regulation and policy","hook":"Parliament makes the Act; regulations say how; your employer sets policy.","groups":[{"q":"An Act","facts":[{"t":"A **law made by Parliament**","of":[0]},{"t":"e.g. the **Medicines Act 1981**; the **Misuse of Drugs Act 1975**","of":[0]}]},{"q":"A regulation","facts":[{"t":"Made **underneath an Act**: **how it is enforced**","of":[1]},{"t":"e.g. the **Medicines Regulations 1984**","of":[1]}]},{"q":"A policy","facts":[{"t":"An **enforceable rule within one organisation**","of":[2]},{"t":"e.g. a **hospital’s medication policy**; nurses must **know their own**","of":[2]}]}]},"q667426a57f":{"id":"joan-law:explain why a nurse may not","title":"Why a nurse can’t give on own judgement","hook":"No prescription, no standing order, no medicine.","groups":[{"q":"The principle","facts":[{"t":"Only as directed by an **authorised prescriber** or a **standing order**","of":[0]},{"t":"The **dose, frequency and route**; **nurses do not prescribe**","of":[0]}]},{"q":"Example","facts":[{"t":"Blood glucose **18 mmol/L**: the nurse **cannot decide to give insulin**","of":[1]},{"t":"**Contact the prescriber**","of":[1]},{"t":"Even “**take a couple of paracetamol**” is **prescribing**","of":[1]}]}]},"q041dd129cb":{"id":"joan-law:what does it mean to insist","title":"Insisting on proper prescribing","hook":"Unclear? Ask. Don’t guess, don’t withhold.","groups":[{"q":"What it means","facts":[{"t":"A **legal duty to question** an **incomplete or unclear prescription**","of":[0]},{"t":"Ask the prescriber: **not to guess**, and **not to withhold**","of":[0]}]},{"q":"Example","facts":[{"t":"The **route is missing**, the **allergies** unchecked, the writing unreadable","of":[1]},{"t":"→ **go back to the prescriber**","of":[1]}]}]},"q1161ffe197":{"id":"joan-law:what is the purpose of the","title":"The HPCAA 2003: purpose, one requirement","hook":"Protect the public: competent, fit, in scope.","groups":[{"q":"Purpose","facts":[{"t":"To **protect public safety**","of":[0]},{"t":"Practitioners **competent** and **fit to practise**, within a **scope of practice**","of":[0]}]},{"q":"One requirement (any one)","facts":[{"t":"Work **within the scope** set by the **Nursing Council**","of":[1]},{"t":"Renew an **annual practising certificate** (**APC**)","of":[1]},{"t":"Show **continuing clinical and cultural competence**","of":[1]}]}]},"q3d3fe77921":{"id":"joan-law:define scope of practice and give","title":"Scope of practice","hook":"What you are educated, competent and authorised to do.","groups":[{"q":"Definition","facts":[{"t":"The area a practitioner is **educated, competent and authorised** to work in","of":[0]},{"t":"Set by the **Nursing Council** under the **HPCAA**","of":[0]},{"t":"About **demonstrated competence**, **not a list of tasks**","of":[0]}]},{"q":"Outside an RN’s scope (any one)","facts":[{"t":"**Prescribing** (unless a **designated RN prescriber**)","of":[1]},{"t":"**Dispensing**: that is the **pharmacist’s role**","of":[1]}]}]},"q0fefdfbe7f":{"id":"joan-law:what does fitness to practise mean","title":"Fitness to practise","hook":"Qualified, healthy enough, good conduct. Not the gym.","groups":[{"q":"What it means","facts":[{"t":"The necessary **qualifications and training**","of":[0]},{"t":"**No untreated** physical or **mental condition** impedes the work","of":[0]},{"t":"Of **good conduct and standing**: **not physical fitness**","of":[0]}]},{"q":"Something that puts it in doubt (any one)","facts":[{"t":"An **arrest** for **possessing an illegal drug**","of":[1]},{"t":"**Dishonesty** or **cheating** as a student","of":[1]}]}]},"q0361a8d2b6":{"id":"joan-law:distinguish the nursing council of new","title":"Nursing Council vs NZNO","hook":"The Council REGULATES (Code of Conduct). NZNO SUPPORTS (Code of Ethics).","groups":[{"q":"Nursing Council (NCNZ)","facts":[{"t":"The **regulatory authority** under the **HPCAA**","of":[0]},{"t":"**Registers**, audits, **disciplines**, can **de-register** nurses","of":[0]},{"t":"Its document: the **Code of Conduct**, **enforceable**","of":[0]}]},{"q":"NZNO","facts":[{"t":"A **union** with **voluntary membership**","of":[1]},{"t":"It **represents and supports** nurses","of":[1]},{"t":"Its document: the **Code of Ethics** (2019), a **guideline**","of":[1]}]},{"q":"Example of the difference","facts":[{"t":"Hiding an error: the nurse can be **disciplined by NCNZ**","of":[2]},{"t":"NZNO is where that nurse turns for **advice and representation**","of":[2]}]}]},"q6963f90283":{"id":"joan-ethics:what does pou mean in the","title":"The six pou of competence","hook":"Six posts hold up the house of competent practice.","groups":[{"q":"What a pou is","facts":[{"t":"A **pillar** or **post**: the six **hold up** competent practice","of":[0]}]},{"q":"The six pou","facts":[{"t":"**Māori Health**; **Cultural Safety**","of":[1]},{"t":"**Whanaungatanga & Communication**","of":[1]},{"t":"**Pūkengatanga & Evidence-Informed Practice**","of":[1]},{"t":"**Manaakitanga & People-Centred Care**","of":[1]},{"t":"**Rangatiratanga & Leadership**","of":[1]}]},{"q":"One being compromised","facts":[{"t":"A patient took **his own opioid**; the nurse **does not tell** the prescriber","of":[2]},{"t":"That compromises **Whanaungatanga & Communication**","of":[2]}]}]},"q90fbbba655":{"id":"joan-ethics:state one principle of the nursing","title":"A Code of Conduct principle and medicines","hook":"Integrity: report errors. Safe care: double-check. Culture: check what is in it.","groups":[{"q":"One principle (any one of eight)","facts":[{"t":"**Principle 7**: act with **integrity** to justify trust","of":[0]},{"t":"**Principle 4**: **safe and competent care**","of":[0]},{"t":"**Principle 2**: respect **cultural needs and values**","of":[0]}]},{"q":"How it applies to medicines","facts":[{"t":"P7: **report a medication error** honestly and **immediately**","of":[1]},{"t":"P4: **double-check with another nurse** for a new medicine","of":[1]},{"t":"P2: check the **excipients**, e.g. a **gelatine capsule**","of":[1]}]}]},"qe0b90dee19":{"id":"joan-ethics:explain the nurse s duty of","title":"Privacy, and a phone enquiry","hook":"You can’t see who is calling, so you can’t tell them.","groups":[{"q":"The duty","facts":[{"t":"**Code of Conduct Principle 5**: **protect personal health information**","of":[0]},{"t":"Share it only for **appropriate professional purposes**","of":[0]},{"t":"Notes are read only by **those caring for that patient**","of":[0]}]},{"q":"The phone example","facts":[{"t":"“Sorry, we **can’t give patient information over the phone**”","of":[1]},{"t":"You **cannot verify who is calling**; offer to **ring back**","of":[1]}]}]},"qdeca78b3a6":{"id":"joan-ethics:define veracity and give an example","title":"Veracity","hook":"Tell the truth: about the medicine, and about your mistakes.","groups":[{"q":"Definition","facts":[{"t":"**Truthfulness**: **honest**, **accurate, clear and transparent** information","of":[0]},{"t":"A value in the **NZNO Code of Ethics**","of":[0]}]},{"q":"Example","facts":[{"t":"Telling a patient **what a medicine is for** and its **side effects**","of":[1]},{"t":"Or **owning up to a medication error** straight away","of":[1]}]}]},"qfb56a27bba":{"id":"joan-ethics:define autonomy and give an example","title":"Autonomy","hook":"Their body, their choice, even when it is no.","groups":[{"q":"Definition","facts":[{"t":"The **right of choice**","of":[0]},{"t":"**Informed, voluntary consent**, **without coercion**","of":[0]},{"t":"Including the **right to refuse** and to **withdraw** at any time","of":[0]}]},{"q":"Example","facts":[{"t":"A **competent patient declines** a medicine","of":[1]},{"t":"The nurse checks they **understand the consequences**, **respects the refusal**, **documents it**","of":[1]}]}]},"q49d8eba9ee":{"id":"joan-ethics:define rangatiratanga as a value in","title":"Rangatiratanga","hook":"Self-determination: give the facts, respect the choice.","groups":[{"q":"Definition","facts":[{"t":"**Self-determination**","of":[0]},{"t":"The right to decide about **their own bodies and health**","of":[0]},{"t":"Including **refusing care entirely**","of":[0]}]},{"q":"A bedside example","facts":[{"t":"Support the patient and whānau to **decide for themselves**","of":[1]},{"t":"**Respecting the choice**, even when the nurse **would have chosen differently**","of":[1]}]}]},"q2d4e4ca430":{"id":"joan-ethics:define beneficence and non maleficence and","title":"Beneficence and non-maleficence","hook":"Do good; do no harm; but a competent “no” wins.","groups":[{"q":"Beneficence","facts":[{"t":"**Do good**: promote the person’s **wellbeing**","of":[0]}]},{"q":"Non-maleficence","facts":[{"t":"**Do no harm**: avoid **physical, emotional or cultural harm**","of":[1]},{"t":"**Minimising risk**","of":[1]}]},{"q":"A conflict","facts":[{"t":"The medicine would do good (**beneficence**), but the patient **refuses** it (**autonomy**)","of":[2]},{"t":"The nurse **may not override a competent refusal**","of":[2]}]}]},"q1fb5136966":{"id":"joan-ethics:what does prn mean and why","title":"PRN, and why it is an ethical problem","hook":"As necessary: says who?","groups":[{"q":"What PRN means","facts":[{"t":"**Pro re nata**: “**as necessary**”","of":[0]}]},{"q":"Why it is an ethical problem","facts":[{"t":"It is **subjective**: **as necessary to whom**, and **who decides**?","of":[0]},{"t":"The **nurse’s judgement and beliefs** shape it","of":[0]}]},{"q":"Example","facts":[{"t":"**Pain relief** charted PRN","of":[1]},{"t":"It can depend on whether the nurse **believes their pain**","of":[1]},{"t":"There is **no machine that measures it**","of":[1]},{"t":"**Fear of causing addiction** makes some **give less**","of":[1]}]}]},"qba72713fbf":{"id":"joan-ethics:why is concealing a medication error","title":"Why hiding an error is worse","hook":"An error is an accident. Hiding it is a choice.","groups":[{"q":"The reason","facts":[{"t":"An error is usually **accidental**: **report it**, **reflect**, **be supervised**","of":[0]},{"t":"**Concealment is deliberate**: it **denies the patient monitoring and treatment**","of":[0]},{"t":"It **breaches integrity** (**Principle 7**): **professional misconduct**","of":[0]}]},{"q":"Example","facts":[{"t":"“**Nurse D**” took **two days to report**; the **patient died**","of":[1]},{"t":"Found **guilty of professional misconduct**: **suspended**, **fined**, supervised","of":[1]}]}]},"qa6e200b7c0":{"id":"joan-ethics:explain why patients should be taught","title":"Why teach the generic name","hook":"Brand-only knowledge = the same drug twice.","groups":[{"q":"The reason","facts":[{"t":"One medicine may have **several brand names**","of":[0]},{"t":"Knowing **only the brand**, a patient **cannot tell staff** what they take","of":[0]},{"t":"So the **same medicine can be given twice**","of":[0]}]},{"q":"Example","facts":[{"t":"A man knew his opioid **only by its brand name**","of":[1]},{"t":"He said he had **never had morphine**; he was given a **second dose**","of":[1]},{"t":"He became **drowsy, confused and nauseated**","of":[1]}]}]},"q0dc4be8381":{"id":"joan-devmkt:define bioequivalence and explain why it","title":"Bioequivalence","hook":"Same ingredient, same rate, same amount = swappable.","groups":[{"q":"Definition","facts":[{"t":"The **same active ingredient** reaches the bloodstream","of":[0]},{"t":"At the **same rate** and to the **same extent**","of":[0]}]},{"q":"Why it matters, with an example","facts":[{"t":"A **generic** may only be **substituted** for a brand if **bioequivalent**","of":[1]},{"t":"So the patient gets the **same therapeutic effect**","of":[1]},{"t":"e.g. dispensing the **funded generic** instead of the original brand","of":[1]}]}]},"q575dd313ed":{"id":"joan-devmkt:why is bringing a new medicine","title":"Why new medicines are slow and costly","hook":"10–20 years, millions of dollars: nobody wants another thalidomide.","groups":[{"q":"Why","facts":[{"t":"Must **prove the medicine works**, its **side effects are known**, **safe in humans**","of":[0]},{"t":"About **10–20 years** and **millions of dollars**","of":[0]},{"t":"Only about **5 in 5,000** compounds reach human testing","of":[0]}]},{"q":"The event behind the caution","facts":[{"t":"**Thalidomide**: given to **pregnant women** in the **1950s**","of":[1]},{"t":"It caused **birth defects**","of":[1]}]}]},"q36a333accd":{"id":"joan-devmkt:name the five key phases of","title":"Drug development: the five phases","hook":"Discover → Preclinical → Clinical trials → Medsafe review → Post-market.","groups":[{"q":"In order","facts":[{"t":"1 **Discovery and development**: lab research for **promising compounds**","of":[0]},{"t":"2 **Preclinical research**: **safety testing** before any human","of":[0]},{"t":"3 **Clinical trials**: studies **in people**","of":[1]},{"t":"4 **Medsafe review**: **approved or rejected**","of":[1]},{"t":"5 **Post-market monitoring**: e.g. reactions reported to **CARM**","of":[2]}]}]},"qc19da002cf":{"id":"joan-devmkt:describe the purpose of phase 1","title":"Phase 1 of a clinical trial","hook":"Phase 1 = is it SAFE, and what dose?","groups":[{"q":"Purpose","facts":[{"t":"**Safety and dosage**","of":[0]},{"t":"A **small group of 20–100** people, often **healthy volunteers**","of":[0]}]},{"q":"What is measured","facts":[{"t":"**Adverse effects** at **gradually increasing doses**","of":[1]},{"t":"To find the **dose range** that is **tolerated**","of":[1]}]}]},"q60950bdc90":{"id":"joan-devmkt:what is the difference between phase","title":"Phase 2 vs Phase 3","hook":"Phase 2: does it WORK? Phase 3: prove it, in thousands.","groups":[{"q":"Phase 2","facts":[{"t":"Tests **efficacy and side effects**","of":[0]},{"t":"In **several hundred** people **who have the condition**","of":[0]}]},{"q":"Phase 3","facts":[{"t":"**Confirms safety and effectiveness** in a **large population**","of":[1]},{"t":"**300 to 3,000** people, over **one to four years**, before approval","of":[1]}]}]},"qeb2b33db6b":{"id":"joan-devmkt:what is phase 4 of clinical","title":"Phase 4: post-market monitoring","hook":"Rare harms only show up across a whole population.","groups":[{"q":"What it is","facts":[{"t":"**Post-market monitoring** of **long-term safety**","of":[0]},{"t":"**Several thousand patients**, over years, **after Medsafe approval**","of":[0]}]},{"q":"Why it exists, with an example","facts":[{"t":"**Rare or delayed adverse effects** only show at **population scale**","of":[1]},{"t":"e.g. a medicine **withdrawn** after **post-market reports**","of":[1]}]}]},"q95bf11d309":{"id":"joan-devmkt:name the three bodies that must","title":"Three bodies that approve a trial","hook":"Medsafe (the medicine), SCOTT (the science), HDEC (the ethics).","groups":[{"q":"Each body, and what it checks","facts":[{"t":"**Medsafe**: the **preclinical studies**, **chemical stability** and **quality**","of":[0]},{"t":"**SCOTT**: the **science**, the **safety** of the **trial design**","of":[1]},{"t":"SCOTT = **Standing Committee on Therapeutic Trials**","of":[1]},{"t":"**HDEC**: **ethical compliance**","of":[2]},{"t":"HDEC = **Health and Disability Ethics Committees**","of":[2]}]}]},"qc8f6f7287f":{"id":"joan-devmkt:what is medsafe s role after","title":"Medsafe after approval","hook":"Approval is not the end: CARM keeps watching.","groups":[{"q":"Its role","facts":[{"t":"Ongoing **post-market surveillance**","of":[0]},{"t":"**Tracking adverse events**; updating the **risk and benefit** information","of":[0]}]},{"q":"Example","facts":[{"t":"**Adverse reactions reported** to **CARM** feed it","of":[1]},{"t":"… by **nurses**, **doctors** or **patients**","of":[1]}]}]},"q0fceb4726d":{"id":"joan-devmkt:define informed consent in a clinical","title":"Informed consent in a clinical trial","hook":"Voluntary, competent, informed, and you can leave.","groups":[{"q":"Definition","facts":[{"t":"Consent that is **voluntary, competent and adequately informed**","of":[0]},{"t":"It can be **withdrawn at any time**","of":[0]}]},{"q":"One thing they must understand","facts":[{"t":"The **risks and potential benefits**","of":[1]},{"t":"That taking part is **voluntary**","of":[1]},{"t":"That **research is not** personalised **treatment**","of":[1]}]}]},"q3a7e86a4de":{"id":"joan-devmkt:when is the use of a","title":"When a placebo is ethical","hook":"No proven treatment exists, so nobody loses one.","groups":[{"q":"When it is acceptable","facts":[{"t":"**No proven treatment exists** for the condition","of":[0]},{"t":"Or it is **methodologically necessary** and **does not cause serious harm**","of":[0]}]},{"q":"Example","facts":[{"t":"A **placebo arm** for a condition with **no effective therapy yet**","of":[1]},{"t":"**Nobody is denied a treatment that works**","of":[1]}]}]},"q0adf3ed798":{"id":"joan-devmkt:what ethical problem does randomisation raise","title":"The ethical problem with randomisation","hook":"Fair only while nobody knows which is better.","groups":[{"q":"The problem","facts":[{"t":"Randomising increases **validity**","of":[0]},{"t":"But it **may deny** a participant the **best currently known treatment**","of":[0]}]},{"q":"When it is justified","facts":[{"t":"Only with **genuine professional uncertainty** about which is better","of":[1]},{"t":"e.g. a **new medicine** vs **standard care**","of":[1]}]}]},"q8a08f04f0e":{"id":"joan-devmkt:give one reason vulnerable patients need","title":"Protecting vulnerable patients in trials","hook":"Protect them, but don’t take away their choice.","groups":[{"q":"Why they need protection","facts":[{"t":"A history of **serious abuses** in human research","of":[0]},{"t":"Strict rules push trials to countries with **weaker protections**","of":[0]}]},{"q":"How it can go too far","facts":[{"t":"**Over-protection** can **conflict with autonomy**","of":[1]},{"t":"e.g. a patient with **life-threatening cancer** **denied the choice** of a trial","of":[1]}]}]},"q156716d6b7":{"id":"joan-devmkt:what is direct to consumer advertising","title":"Direct-to-consumer advertising","hook":"Prescription-medicine ads aimed at the public: rare worldwide.","groups":[{"q":"What it is","facts":[{"t":"It promotes a **branded prescription medicine** **to the public**","of":[0]}]},{"q":"Why NZ is unusual","facts":[{"t":"**One of only two developed countries** that **permit it**","of":[1]},{"t":"Most restrict it to **health professionals**","of":[1]},{"t":"It can **drive demand** for medicines that **may not be appropriate**","of":[1]}]}]},"q9b63c4c950":{"id":"joan-devmkt:what is a reminder advertisement for","title":"Reminder advertisements","hook":"Just the name: it keeps the brand familiar.","groups":[{"q":"What it is","facts":[{"t":"It mentions the **medicine’s name only**","of":[0]},{"t":"**Without saying what it treats**: it keeps the **brand familiar**","of":[0]}]},{"q":"Example","facts":[{"t":"A **billboard** or **pen** with only the **product name and logo**","of":[1]}]}]},"q2b47c7b7c4":{"id":"joan-devmkt:what is health seeking disease awareness","title":"Health-seeking (disease awareness) ads","hook":"Looks like education, can work like an ad.","groups":[{"q":"What it is","facts":[{"t":"It educates about a **health condition**, **rather than a product**","of":[0]},{"t":"e.g. “**talk to your doctor about**…”","of":[0]}]},{"q":"Why it can be a concern","facts":[{"t":"It may **steer people towards a related brand**","of":[1]},{"t":"**Driving demand** while looking like **neutral health education**","of":[1]}]}]},"q9340c50a63":{"id":"joan-devmkt:name two requirements of the therapeutic","title":"The Therapeutic and Health Advertising Code","hook":"Evidence, truth, safety information. The ASA enforces it.","groups":[{"q":"Who administers it","facts":[{"t":"The **Advertising Standards Authority**","of":[0]},{"t":"**Anyone can complain**","of":[0]}]},{"q":"Two requirements","facts":[{"t":"Claims **substantiated with credible evidence**","of":[1]},{"t":"**Truthful**, **not misleading**, no **exaggerated benefits**","of":[1]},{"t":"**Key safety information** included","of":[1]}]}]},"qa9ba8498ff":{"id":"joan-devmkt:how can a nurse accidentally advertise","title":"A nurse can advertise without meaning to","hook":"Say the generic name, never “this brand is best”.","groups":[{"q":"How","facts":[{"t":"Advertising includes **what is said aloud**","of":[0]},{"t":"**Praising one brand** over another can **count as advertising**","of":[0]}]},{"q":"How to avoid it, with an example","facts":[{"t":"Talk in **generic names**; give **factual, balanced** information","of":[1]},{"t":"Name the **generic pain reliever**, not “this brand **is the best**”","of":[1]}]}]},"q629d061d0b":{"id":"joan-cam:define rongo m ori and give","title":"Rongoā Māori: its three parts","hook":"Mirimiri, karakia, rongoā rākau: hands, prayer, plants.","groups":[{"q":"Definition","facts":[{"t":"**Traditional Māori healing**","of":[0]},{"t":"With a **strong spiritual element**: a **Māori model of health**","of":[0]}]},{"q":"Its three parts","facts":[{"t":"**Mirimiri**: **massage** / body work","of":[1]},{"t":"**Karakia**: **prayer**","of":[1]},{"t":"**Rongoā rākau**: **native plant-based remedies**, e.g. a **balm**","of":[1]}]}]},"q312cfb3cd1":{"id":"joan-cam:who is responsible for a traditional","title":"Who is responsible for a rongoā remedy","hook":"The practitioner owns the remedy; the nurse brings everyone together.","groups":[{"q":"Who is responsible","facts":[{"t":"The **tohunga** or **rongoā practitioner**","of":[0]},{"t":"**Karakia and kawa differ** between tribal areas","of":[0]},{"t":"The nurse **does not prescribe or prepare it**","of":[0]}]},{"q":"What the nurse does","facts":[{"t":"**Arranges a discussion** with everyone involved","of":[1]},{"t":"So the client can make an **informed decision**","of":[1]}]}]},"q753834f4de":{"id":"joan-cam:list three issues a nurse should","title":"Rongoā with prescribed medicines: issues","hook":"Who, what, side effects, interactions, evidence.","groups":[{"q":"Any three issues","facts":[{"t":"The **knowledge and experience** of the practitioner","of":[0]},{"t":"Is it **appropriate for the client’s condition**?","of":[0]},{"t":"**Potential side effects**","of":[0]},{"t":"**Potential interactions** with prescribed medicines","of":[1]},{"t":"Any **evidence-based information** about it?","of":[1]}]},{"q":"Why one matters","facts":[{"t":"A **plant tonic** used to **lower blood sugar**, with **diabetes medicine**","of":[2]},{"t":"It could **add to its effect**","of":[2]},{"t":"Tell the **prescriber**; **blood glucose needs watching**","of":[2]}]}]},"qc1a3850e6a":{"id":"joan-cam:distinguish the biomedical view of medicine","title":"Biomedical vs wholistic","hook":"Fix the faulty part, or care for the whole person.","groups":[{"q":"The difference","facts":[{"t":"**Biomedical**: illness is a **fault in one part**; a **targeted** fix","of":[0]},{"t":"**Wholistic**: the person is **treated as a whole**: body, mind, spirit, whānau","of":[0]}]},{"q":"A wholistic model","facts":[{"t":"**Te Whare Tapa Whā**","of":[1]},{"t":"**Taha tinana**, **hinengaro**, **wairua**, **whānau**","of":[1]}]}]},"qc5c4f53044":{"id":"joan-cam:what is integrated medicine give an","title":"Integrated medicine","hook":"Both systems, one goal, sharing what they know.","groups":[{"q":"Definition","facts":[{"t":"**Evidence-based complementary** therapies with **conventional** (biomedical) care","of":[0]},{"t":"**Sharing evidence** for the **common goal** of better health","of":[0]},{"t":"**Large gaps in the evidence** remain","of":[0]}]},{"q":"Example","facts":[{"t":"**Mirimiri and karakia** alongside **prescribed treatment**","of":[1]},{"t":"The team and practitioner each **aware** of the other","of":[1]}]}]},"q049d7ba1f5":{"id":"joan-cam:what is tikanga rongo ministry of","title":"Tikanga ā Rongoā (2014)","hook":"A voluntary benchmark for safe, quality rongoā.","groups":[{"q":"What it is","facts":[{"t":"A **voluntary standard**, made **with the rongoā sector**","of":[0]},{"t":"**Requirements for providers** of rongoā services: a **benchmark of excellence**","of":[0]}]},{"q":"What it is for","facts":[{"t":"**Safe, quality rongoā care** for **tūroro** (patients)","of":[1]},{"t":"**Consistent quality** between providers; growing the **rongoā workforce**","of":[1]}]}]},"qf24f2c3b4b":{"id":"joan-cam:health is described as a taonga","title":"Health as a taonga","hook":"A treasure Te Tiriti promised, and a seven-year gap.","groups":[{"q":"What it means","facts":[{"t":"Te Tiriti guaranteed Māori the **same rights and privileges**","of":[0]},{"t":"Māori kept **tino rangatiratanga** over their **taonga** (treasures)","of":[0]},{"t":"Health is a taonga: a **right to equal health outcomes**","of":[0]}]},{"q":"A statistic","facts":[{"t":"**Life expectancy** is **7.1 years shorter** for Māori","of":[1]}]}]},"q2a6a902e05":{"id":"joan-cam:what is te maramataka and how","title":"Te maramataka","hook":"The moon’s phases guide energy, mood and rest.","groups":[{"q":"What it is","facts":[{"t":"The **Māori lunar calendar**","of":[0]},{"t":"A way of **attuning with the environment**","of":[0]}]},{"q":"How it is used in health","facts":[{"t":"Each phase has its own **energy, mood and activity levels**","of":[1]},{"t":"**Plan activity and rest** around it","of":[1]}]}]},"qb6ebeaf102":{"id":"concepts1:define pharmacology and explain why knowledge of","title":"Pharmacology, and why it matters to an RN","hook":"Give it, own it, teach it, check it, and one day prescribe it.","groups":[{"q":"Define pharmacology","facts":[{"t":"The **study of drugs**: their **sources**, **nature**, **actions**, **effects**, **uses**","of":[0]}]},{"q":"Why it matters (any four)","facts":[{"t":"Nurses **administer medication** as a **daily** routine","of":[1]},{"t":"**Legally and ethically responsible** for giving them **safely**","of":[2]},{"t":"Nurses **provide education** to **patients and whānau**","of":[3]},{"t":"Nurses **evaluate the outcome**, including **adverse effects**","of":[4]},{"t":"With further training, nurses may **prescribe and dispense**","of":[5]}]}]},"qb158fab89e":{"id":"concepts1:define medication name the six things a","title":"What a medication is, and six uses","hook":"Please Don’t Rush To Cure All: Prevent, Diagnose, Relieve, Treat, Cure, Affect.","groups":[{"q":"Define it","facts":[{"t":"Any substance used to **prevent, diagnose, relieve, treat, or cure** disease","of":[0]},{"t":"… or to **affect the structure or function** of the body","of":[0]}]},{"q":"The six uses, each with its example","facts":[{"t":"**Prevent**: **Hepatitis B immunisation**","of":[1]},{"t":"**Diagnose**: **contrast media** on X-ray or CT","of":[2]},{"t":"**Relieve** symptoms, not the cause: **paracetamol** for pain","of":[3]},{"t":"**Treat**, not cure: **omeprazole** to heal an ulcer","of":[4]},{"t":"**Cure**: **antifungal cream** for **ringworm**","of":[5]},{"t":"**Affect structure or function**: the **oral contraceptive pill**","of":[6]}]}]},"q6af8f98fe9":{"id":"concepts1:name the four branches of pharmacology covered","title":"The four branches of pharmacology","hook":"Kinetics: body → drug. Dynamics: drug → body. Therapeutics: to the patient. Toxicology: harm.","groups":[{"q":"The four branches","facts":[{"t":"**Pharmacokinetics**: “**what the body does to the drug**”","of":[0]},{"t":"**Pharmacodynamics**: “**what the drug does to the body**”, and how","of":[1]},{"t":"**Pharmacotherapeutics**: applying medications to an **individual patient**","of":[2]},{"t":"**Toxicology**: the **harmful effects** of chemicals, medications included","of":[3]}]}]},"q4a3dea5a9a":{"id":"concepts1:three things a nurse must know before","title":"Three things to know before giving a medicine","hook":"How to give it, why, and what could go wrong.","groups":[{"q":"The three things","facts":[{"t":"How to **safely administer** it","of":[0]},{"t":"Its **intended effect** (**purpose**)","of":[1]},{"t":"Possible **adverse effects**, including **allergies**","of":[2]},{"t":"Be **well informed** about each medicine **before administering** it","of":[3]}]}]},"q07b7d0795d":{"id":"concepts1:explain the difference between a contraindication and","title":"Contraindication vs precaution","hook":"Contraindication = NO. Precaution = yes, but CAREFULLY.","groups":[{"q":"Contraindication","facts":[{"t":"The medication should **not be used**: it **may be harmful**","of":[0]}]},{"q":"Precaution","facts":[{"t":"Use with **special care**: a **heightened risk of adverse effects**","of":[1]},{"t":"It **may still be used**, with **careful monitoring** or **dose adjustment**","of":[2]}]}]},"q6225448509":{"id":"concepts1:what is a medication drug interaction name","title":"Medication interactions: four categories","hook":"Drugs, food, CAM, conditions.","groups":[{"q":"Definition","facts":[{"t":"The medication’s **effect** is **altered by another substance or condition**","of":[0]}]},{"q":"The four categories","facts":[{"t":"**Other medications**","of":[1]},{"t":"**Foods**","of":[2]},{"t":"**Complementary and alternative medicines**","of":[3]},{"t":"**Medical conditions**","of":[4]}]}]},"q5a910d2dd5":{"id":"concepts1:distinguish the roles of pharmac and medsafe","title":"PHARMAC vs Medsafe","hook":"PHARMAC: will we PAY for it? Medsafe: is it SAFE?","groups":[{"q":"PHARMAC","facts":[{"t":"Decides which medicines are **funded** (**subsidised**)","of":[0]},{"t":"… within a **fixed budget**","of":[0]}]},{"q":"Medsafe","facts":[{"t":"The **Medicines and Medical Devices Safety Authority**","of":[1]},{"t":"It **regulates**: **safe** and **high-quality**","of":[1]}]}]},"q89fcbb9833":{"id":"concepts1:all medications are known by at least","title":"The three names of a medication","hook":"Chemical (for chemists), generic (official), brand (for sale).","groups":[{"q":"Chemical name","facts":[{"t":"Describes the **atomic and molecular structure**; used by **chemists**","of":[0]},{"t":"Paracetamol: **4-hydroxyacetanilide**","of":[0]}]},{"q":"Generic name","facts":[{"t":"The **official name**, approved by the **regulating authority**","of":[1]},{"t":"For paracetamol, the generic name is **paracetamol**","of":[1]}]},{"q":"Brand (proprietary) name","facts":[{"t":"**Selected and copyrighted** by the **company** that markets it","of":[2]},{"t":"Paracetamol: **Panadol**, **Pamol**","of":[2]}]}]},"qa2fd878078":{"id":"concepts1:why are prescribers in aotearoa nz encouraged","title":"Prescribing generically, and two exceptions","hook":"Fewer errors, lower cost; except modified-release and non-bioequivalent brands.","groups":[{"q":"Why prescribe generically","facts":[{"t":"**Reduces the risk of error**: many **brand names** for one medicine","of":[0]},{"t":"**More cost-effective**: **subsidised medication brands** are dispensed","of":[1]}]},{"q":"The two exceptions","facts":[{"t":"A **special modified-release form**","of":[2]},{"t":"Brands that **do not show bioequivalence**: e.g. **epilepsy**","of":[3]}]}]},"qb84755ae9f":{"id":"concepts1:define bioequivalence and explain its role in","title":"Bioequivalence and its role","hook":"Same ingredient, same dose, same rate, same effect.","groups":[{"q":"Definition","facts":[{"t":"Two medicines, **same active ingredient**, at the **same dose**","of":[0]},{"t":"Reach the bloodstream at a **similar rate and extent**","of":[1]},{"t":"**And** lead to **similar effects**","of":[2]}]},{"q":"Its role in drug development","facts":[{"t":"A **new branded version** must **demonstrate bioequivalence** before sale","of":[3]},{"t":"Some brands are **more affordable** (for **PHARMAC** too)","of":[4]}]}]},"q095e2a2aaa":{"id":"concepts1:name three generic name suffixes taught in","title":"Three generic-name suffixes","hook":"-olol slows the heart, -statin lowers cholesterol, -cillin kills bugs.","groups":[{"q":"Suffix → class","facts":[{"t":"**-olol**: **beta blockers**, e.g. **atenolol**","of":[0]},{"t":"**-statin**: **cholesterol-lowering**, e.g. **atorvastatin**","of":[1]},{"t":"**-cillin**: **penicillin antibiotics**, e.g. **amoxicillin**","of":[2]}]}]},"qac8da50648":{"id":"concepts2:name the three classification systems this course","title":"Three ways to classify a medicine","hook":"What it is FOR, how it WORKS, what the LAW says.","groups":[{"q":"The three systems, each with an example","facts":[{"t":"**Clinical use**: what it is **prescribed for**, e.g. **analgesics**","of":[0]},{"t":"**Mechanism of action**: **how it produces its effect**, e.g. **proton pump inhibitors**","of":[1]},{"t":"**Legal**: by **NZ Medicines law**, e.g. **prescription**, **general sale**","of":[2]}]}]},"q747e6f1123":{"id":"concepts2:aspirin is used as the lecture s","title":"Aspirin: four clinical-use classes","hook":"Pain, fever, inflammation, clots.","groups":[{"q":"The four classes","facts":[{"t":"**Analgesic**: pain relief","of":[0]},{"t":"**Antipyretic**: reduces fever","of":[1]},{"t":"**Anti-inflammatory**","of":[2]},{"t":"**Antithrombotic**: prevents clotting","of":[3]}]}]},"qb90ee0d522":{"id":"concepts2:list the four legal classifications of medicines","title":"The four legal classes, with examples","hook":"Prescription → Restricted → Pharmacy-only → General sale (the last three = OTC).","groups":[{"q":"The four classes","facts":[{"t":"**Prescription**: needs a **prescription** or **standing order**; e.g. **amoxicillin**","of":[0]},{"t":"**Restricted** (**pharmacist-only**): the pharmacist must **explain it**; e.g. **clotrimazole cream**","of":[1]},{"t":"**Pharmacy-only**: a **pharmacy** or **hospital**; e.g. **oxymetazoline** nasal spray","of":[2]},{"t":"**General sales**: **any retail outlet**; e.g. **paracetamol**, **ibuprofen**","of":[3]},{"t":"The last three are “**over the counter**” (**OTC**)","of":[4]}]}]},"q161479d50c":{"id":"concepts2:name the two free new zealand websites","title":"Two free NZ medicine information sites","hook":"Medsafe for data sheets;
