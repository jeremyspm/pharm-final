 Disability Ethics Committees) — checks for ethical compliance.","Developers must include: animal study data including adverse effects, data from any prior human research, and study plans."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 9"}},{"id":"q75a516a445","quiz":"devmkt","sys":"law","pts":5,"q":"Describe the four phases of clinical research, with participant numbers, duration and progression rate.","qh":"<p>Describe the four phases of clinical research, with participant numbers, duration and progression rate.</p>","qt":"Describe the four phases of clinical research, with participant numbers, duration and progression rate.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Phase 1 trial]] — safety and dosage. 20–100 participants (healthy or with the condition). Several months. ~70% progress.","[[Phase 2 trial]] — efficacy and side effects. Several hundred participants with the condition. Months to 2 years. ~33% progress.","[[Phase 3 trial]] — confirming safety in large patient populations. 300–3000 participants with the condition. 1–4 years. 25–30% progress.","[[Phase 4 trial]] — long-term safety and effectiveness. Several thousand participants with the condition. Years.","The phases act like a funnel process."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slides 10–11"}},{"id":"q5623fc4ea7","quiz":"devmkt","sys":"law","pts":3,"q":"What five things do developers determine when designing a clinical trial?","qh":"<p>What five things do developers determine when designing a clinical trial?</p>","qt":"What five things do developers determine when designing a clinical trial?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Who qualifies — inclusion and exclusion criteria.","Sample size and study duration.","Methods to reduce bias, e.g. control groups.","Dosage and administration methods.","Data collection and analysis plans."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 8"}},{"id":"qeae2073b54","quiz":"devmkt","sys":"law","pts":3,"q":"Name the four key ethical issues in clinical trials, and the central ethical tension.","qh":"<p>Name the four key ethical issues in clinical trials, and the central ethical tension.</p>","qt":"Name the four key ethical issues in clinical trials, and the central ethical tension.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The key tension: the duty to care for current patients versus the duty to advance science for future patients.","Informed consent.","Use of placebos.","Use of randomisation.","Protection of vulnerable patients.","The history of human research includes serious abuses, e.g. unethical experiments on vulnerable groups."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slides 14–15"}},{"id":"qfd44ddb31d","quiz":"devmkt","sys":"law","pts":4,"q":"What must informed consent for a clinical trial be, and what four things must participants understand?","qh":"<p>What must informed consent for a clinical trial be, and what four things must participants understand?</p>","qt":"What must informed consent for a clinical trial be, and what four things must participants understand?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Consent must be voluntary, competent, and adequately informed.","Participants must understand the risks and potential benefits.","All study procedures.","That participation is voluntary.","That research is NOT the same as personalised treatment.","Consent can be withdrawn at ANY time."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 16"}},{"id":"q9c91d2b532","quiz":"devmkt","sys":"law","pts":2,"q":"When is placebo use ethically acceptable, and when is it problematic?","qh":"<p>When is placebo use ethically acceptable, and when is it problematic?</p>","qt":"When is placebo use ethically acceptable, and when is it problematic?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Placebos are used with \"control\" participants to demonstrate the effect of a new drug.","Problematic if placebo recipients risk harm or worsening of their condition.","Acceptable when no proven treatment exists.","Or where necessary for methodology, without causing serious harm."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 17"}},{"id":"qe7b0d0c65d","quiz":"devmkt","sys":"law","pts":2,"q":"What ethical issues does randomisation raise?","qh":"<p>What ethical issues does randomisation raise?</p>","qt":"What ethical issues does randomisation raise?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["In randomised controlled trials, participants may be randomised to receive treatment or placebo, to increase the validity of the research.","Randomisation may deny participants the currently best-known treatment.","There needs to be genuine professional justification that one treatment is not known to be better than another."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 18"}},{"id":"q6b531f86ec","quiz":"devmkt","sys":"law","pts":3,"q":"What issues arise in protecting vulnerable patients in trials?","qh":"<p>What issues arise in protecting vulnerable patients in trials?</p>","qt":"What issues arise in protecting vulnerable patients in trials?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Strict regulations in some countries can push trials to low-protection countries.","Over-protection can conflict with autonomy — a patient may want to choose higher personal risk.","Clinical trials may offer to reimburse participants.","Higher concern e.g. in cancer treatment trials, due to patients being in life-threatening situations."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 19"}},{"id":"q26967aa365","quiz":"devmkt","sys":"law","pts":5,"q":"Name the five types of medication advertising seen in NZ, and describe each.","qh":"<p>Name the five types of medication advertising seen in NZ, and describe each.</p>","qt":"Name the five types of medication advertising seen in NZ, and describe each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Direct-to-consumer advertising]] — promotes specific branded prescription medicines directly to the public, highlighting benefits, uses and risks.","[[Health-seeking advertising]] (disease awareness) — educates audiences about a health condition; may directly or indirectly encourage interest in a related brand.","[[Reminder ad]]s — mention the drug name only, without stating what it treats.","Professional/journal ads — aimed at healthcare professionals, focusing on clinical evidence, trial data and prescribing information.","Digital & social media marketing — uses online channels including influencers, targeted ads and social media content, often emphasising benefits more strongly than risks."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slides 23–28"}},{"id":"qde22877495","quiz":"devmkt","sys":"law","pts":1,"q":"What is unusual about medication advertising in Aotearoa NZ?","qh":"<p>What is unusual about medication advertising in Aotearoa NZ?</p>","qt":"What is unusual about medication advertising in Aotearoa NZ?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Aotearoa NZ is one of only two developed countries in the world that permits medication companies to advertise direct to the consumer.","(The deck's speaker note gives the other country as the USA.)"],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 22"}},{"id":"qfce25f85fc","quiz":"devmkt","sys":"law","pts":4,"q":"What does the Therapeutic and Health Advertising Code require of medicine advertisements? Give six points.","qh":"<p>What does the Therapeutic and Health Advertising Code require of medicine advertisements? Give six points.</p>","qt":"What does the Therapeutic and Health Advertising Code require of medicine advertisements? Give six points.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Ads must be responsible, truthful, and not misleading.","Claims must be substantiated — have credible evidence.","Ads must not mislead or exaggerate the benefits.","Ads must include key safety information.","Any testimonials must reflect genuine experiences.","Endorsements from celebrities or health professionals cannot imply guaranteed outcomes.","Advertising unapproved medicines (not signed off by Medsafe) is prohibited, even to health professionals."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slides 30–31"}},{"id":"q18b2eafdf4","quiz":"devmkt","sys":"law","pts":3,"q":"How can a health professional accidentally breach advertising law, and what is exempt?","qh":"<p>How can a health professional accidentally breach advertising law, and what is exempt?</p>","qt":"How can a health professional accidentally breach advertising law, and what is exempt?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Advertising is defined broadly — it includes VERBAL advertising — so health professionals need to be careful about recommending or praising a product (brand) over another.","When giving information about a medication brand, health professionals must give information that is factual (evidence-based) and balanced, following the advertising rules.","EXEMPT: giving patients individualised advice about medications, using generic names, for their health condition."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 32"}},{"id":"qec5018c848","quiz":"allergy","sys":"imm","pts":5,"q":"List the six steps of the ASCIA anaphylaxis action plan, in order.","qh":"<p>List the six steps of the ASCIA anaphylaxis action plan, in order.</p>","qt":"List the six steps of the ASCIA anaphylaxis action plan, in order.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["1. Lay the person FLAT — do NOT allow them to stand or walk.","2. Give the adrenaline device.","3. Phone ambulance — 111 (NZ).","4. Phone family/emergency contact.","5. Further adrenaline may be given if no response after 5 minutes.","6. Transfer the person to hospital for at least 4 hours of observation."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"q21efdbdc32","quiz":"allergy","sys":"imm","pts":4,"q":"What are the positioning rules in step 1, including the three exceptions?","qh":"<p>What are the positioning rules in step 1, including the three exceptions?</p>","qt":"What are the positioning rules in step 1, including the three exceptions?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Lay the person flat — do NOT allow them to stand or walk.","If unconscious or pregnant, place in the recovery position — on the left side if pregnant.","If breathing is difficult, allow them to sit with legs outstretched.","Hold young children flat, not upright."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"qbf83ad336c","quiz":"allergy","sys":"imm","pts":4,"q":"Name the seven signs of anaphylaxis on the ASCIA plan.","qh":"<p>Name the seven signs of anaphylaxis on the ASCIA plan.</p>","qt":"Name the seven signs of anaphylaxis on the ASCIA plan.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Difficult or noisy breathing.","Swelling or tightness in the throat.","Difficulty talking or hoarse voice.","Wheeze or persistent cough.","Persistent dizziness or collapse.","Pale and floppy (young children).","Swelling of the tongue."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"q0a34242858","quiz":"allergy","sys":"imm","pts":4,"q":"Name the signs and the actions for a mild to moderate allergic reaction.","qh":"<p>Name the signs and the actions for a mild to moderate allergic reaction.</p>","qt":"Name the signs and the actions for a mild to moderate allergic reaction.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["SIGNS: swelling of lips, face and eyes; hives or welts; tingling mouth.","Abdominal pain and vomiting — but these are signs of ANAPHYLAXIS for insect allergy.","ACTIONS: stay with the person, call for help.","Locate the adrenaline (epinephrine) device.","Give an antihistamine; phone family/emergency contact.","Insect allergy — flick out the sting if visible. Tick allergy — seek medical help, or freeze the tick and let it drop off."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"qee7c849284","quiz":"allergy","sys":"imm","pts":3,"q":"A person with known asthma and food allergy has sudden breathing difficulty. What is given first, and why does this matter?","qh":"<p>A person with known asthma and food allergy has sudden breathing difficulty. What is given first, and why does this matter?</p>","qt":"A person with known asthma and food allergy has sudden breathing difficulty. What is given first, and why does this matter?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["ALWAYS give the adrenaline device FIRST, then the asthma reliever puffer.","This applies to someone with known asthma and allergy to food, insects or medication who may have been exposed to the allergen, and has sudden breathing difficulty — including wheeze, persistent cough or hoarse voice.","It matters because anaphylaxis can occur WITHOUT skin symptoms, and mild to moderate reactions may not always occur before anaphylaxis.","The plan's overriding rule: IF IN DOUBT, GIVE THE ADRENALINE DEVICE."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"qeb176440f6","quiz":"allergy","sys":"imm","pts":2,"q":"When should CPR be commenced, and what should be done if a device is accidentally activated?","qh":"<p>When should CPR be commenced, and what should be done if a device is accidentally activated?</p>","qt":"When should CPR be commenced, and what should be done if a device is accidentally activated?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Commence CPR at any time if the person is unresponsive or not breathing normally.","If the device is accidentally injected or activated, use another adrenaline device if available.","If adrenaline is accidentally injected, contact the local poisons information centre."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}}],"chains":[],"cases":[],"focus":[],"helpline":{},"held":[],"meta":{"id":"pharm-final","prefix":"phf.","title":"Pharm · Paper Sim — Final exam","h1":"Pharm · Paper Sim","short":"Pharm Paper Sim","paper":"Introduction to Pharmacology","bankOf":"this tool’s","who":"Joan","aiCtx":"I’m a first-year nursing student in New Zealand sitting the final exam for Introduction to Pharmacology (multi-choice plus short answers; my lecturer said a short answer is a definition plus an example in 3–4 lines, and that she will not ask about specific drugs).","sitting":{"what":"the Pharmacology final","date":"2026-11-06","when":"Fri 6 Nov, afternoon (time not confirmed yet)","cohortClose":null},"shape":{"closed":30,"saq":null,"saqMarks":20,"minutes":80,"mini":12},"shapeNote":"The real paper is <b>80 min · 50 marks · 30 multi-choice + short answers</b>. How many short answers has never been published, so the mock deals written questions up to <b>20 marks</b> — that is 50 − 30, assuming one mark per multi-choice. If Joan gives a count in the revision sessions (21, 27, 28 Oct), this changes.","saqHint":"one point each. Joan’s own format (16 Sep): <b>a definition plus an example, 3–4 lines</b>, and no specific-drug questions — if a question here asks for more than that, it is over-training, not her paper","sys":{"found":"Foundations (Module 1)","calc":"Calculations (Module 2)","pkpd":"Pharmacokinetics const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };

/* ── dealing ───────────────────────────────────────────────────────── */
const CLOSED = DATA.questions.filter(q=>!q.saq);
/* a question flagged nm stays in the bank (Learn, Pick my rep) but is never dealt into a
   MOCK paper — course-admin questions that are not exam material (sim.config.mjs NO_MOCK) */
const MOCKABLE = CLOSED.filter(q=>!q.nm);
const ESSAYS = DATA.questions.filter(q=>q.saq);
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n, pool=MOCKABLE){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of pool) share[q.sys]=(share[q.sys]||0)+1/pool.length;
  for(const sys of Object.keys(share)){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(pool.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(pool, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
/* How many a Learn deal hands out is HIS call (the chips on the Learn door), saved in this
   browser. 'all' is the whole pool, least-seen first — so a run that stops halfway and is
   dealt again leads with the questions it never reached. A mock test keeps its own size. */
const NOPTS = [12,25,50,100,'all'];
const CAP = () => S.n==='all' ? Infinity : S.n;
const howMany = pool => Math.min(CAP(), pool);
function dealMini(n=META.shape.mini||12, pool=MOCKABLE){ return dealStratified(n, pool) }
function dealSys(s,n){ return shuffle(pickN(CLOSED.filter(q=>q.sys===s), n, new Set())) }
/* the full mock is the REAL paper's shape (META.shape): that many closed questions, then
   the written section — one case-study question per case pack, rotating with each full
   sitting, and the rest from the written questions, least-seen first. A bank with fewer
   written questions than the paper has deals what it has; the home screen says so. */
function dealFull(){
  const closed = dealStratified(META.shape.closed);
  const nth = S.scores.filter(s=>s.mode==='full').length;
  if(META.shape.saqMarks){
    /* the paper publishes marks, not a count: deal least-seen written questions, spread
       across the groups, until their marks reach the total (never past it by a whole question) */
    const out=[]; let m=0; const used=new Set();
    const ranked=pickN(ESSAYS, ESSAYS.length, new Set());
    for(let pass=0; pass<2 && m<META.shape.saqMarks; pass++) for(const q of ranked){
      if(used.has(q.id)||m+q.pts>META.shape.saqMarks) continue;
      if(!pass && out.some(x=>x.quiz===q.quiz)) continue;      // first pass: one per topic
      out.push(q); used.add(q.id); m+=q.pts; if(m>=META.shape.saqMarks) break; }
    return closed.concat(shuffle(out));
  }
  const saqs = (DATA.cases||[]).slice(0, META.shape.saq).map(c=>mkCaseQ(c, c.questions[nth % c.questions.length]));
  const rest = Math.max(0, META.shape.saq - saqs.length);
  return closed.concat(saqs, shuffle(pickN(ESSAYS, rest, new Set())));
}
function mkCaseQ(c, cq){
  return { id:'case-'+c.id+'-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case:'+c.id, sys:c.sys, type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:c.name+' — model answer is the tool’s'},
    scenario: c.scenario };
}
const FULL_SAQ = () => Math.min(META.shape.saq||0, (DATA.cases||[]).length + ESSAYS.length);
/* the misses pile, worst first: once four or more have been missed twice, only those */
function missPool(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  return CLOSED.filter(q=>ids.includes(q.id));
}
function dealMisses(n=12){ return shuffle(missPool()).slice(0,n) }
/* the ticked quizzes, whole (written questions included), in the order the list shows
   them — one run, no cap: you chose the quizzes, you get their questions */
function dealPick(){
  const on = new Set(S.pick);
  return DATA.quizzes.filter(z=>on.has(z.id)).flatMap(z=>DATA.questions.filter(q=>q.quiz===z.id));
}

function setPick(id,on,quiet){
  const has=S.pick.includes(id);
  if(on&&!has)S.pick.push(id); else if(!on&&has)S.pick=S.pick.filter(x=>x!==id);
  if(!quiet)paintPick();
}
/* the ticked rows light up, a system chip lights when every quiz of it is ticked, and the
   bottom bar carries the run — Learn or Sit every ticked quiz as one deck, or clear the ticks */
function paintPick(){
  SV('pick',S.pick);
  document.querySelectorAll('.qrow').forEach(r=>{const on=S.pick.includes(r.dataset.z);r.classList.toggle('on',on);r.querySelector('.pk').checked=on});
  document.querySelectorAll('[data-pk]').forEach(b=>{const zs=DATA.quizzes.filter(z=>b.dataset.pk==='all'||z.sys===b.dataset.pk);b.classList.toggle('on',zs.length>0&&zs.every(z=>S.pick.includes(z.id)))});
  const fb=$('#footbar'), k=S.pick.length, m=dealPick().length;
  if(!k||!$('.qlist')){fb.classList.remove('on');return}
  fb.classList.add('on');
  fb.innerHTML=`<button class="btn primary" id="pkLearn">Learn ${k===1?'this quiz':k+' quizzes'} · ${m} Q</button><button class="btn" id="pkSit">Sit · ${m} Q</button><button class="btn ghost x" id="pkClear" title="clear the ticks" aria-label="clear the ticks">✕</button>`;
  $('#pkLearn').onclick=()=>start('pick',true);
  $('#pkSit').onclick=()=>start('pick',false);
  $('#pkClear').onclick=()=>{S.pick=[];paintPick()};
}
function sparkCard(){
  if(!S.scores.length) return `<div class="card"><b>No sittings yet.</b>
    <p class="hist" style="margin:.4rem 0 0">Your first mock test is the baseline — the whole game is the climb from there. ${daysLeft()} days to go.</p></div>`;
  const pts=S.scores.slice(-30).map(s=>s.got/s.tot);
  const W=600,H=70,P=6;
  const x=i=>P+i*(W-2*P)/Math.max(1,pts.length-1), y=v=>H-P-v*(H-2*P);
  const path=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const last=S.scores[S.scores.length-1], pct=Math.round(100*last.got/last.tot);
  const best=Math.max(...S.scores.map(s=>s.got/s.tot));
  return `<div class="card">
    <div style="display:flex;align-items:baseline;gap:10px">
      <b style="font-size:1.3rem">${last.got}/${last.tot}</b>
      <span class="hist">${pct}% · ${esc(last.label)}</span>
      <span class="hist" style="margin-left:auto">best ${Math.round(best*100)}% · ${S.scores.length} sat</span>
    </div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="score history">
      <line x1="${P}" y1="${y(.5)}" x2="${W-P}" y2="${y(.5)}" stroke="var(--border)" stroke-dasharray="4 4"/>
      <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="4" fill="var(--primary)"/>
    </svg>
    <div class="hist">dashed line = 50%. <button class="btn ghost" id="shareBtn" style="padding:2px 10px;font-size:.78rem">Copy score line</button></div>
  </div>`;
}

/* ── sitting ───────────────────────────────────────────────────────── */
let SIT=null;
/* `learn` sits the same deck in Learn mode: marked per question, resources in place,
   never timed, never on the score chart (see the learn-mode block below) */
/* a Learn run is saved as it goes (deck ids + every mark), so a phone that drops the tab
   halfway through 200 questions loses nothing: home offers to pick it up. A mock is one go. */
function saveRun(){
  if(!SIT||!SIT.learn)return;
  SV('resume',{ids:SIT.deck.map(q=>q.id),i:SIT.i,ans:SIT.ans,chk:SIT.chk,peek:SIT.peek,label:SIT.label,mode:SIT.mode,t0:SIT.t0});
}
function resumeLearn(){
  const r=LS('resume');
  const byId=new Map(DATA.questions.map(q=>[q.id,q]));
  const deck=r&&Array.isArray(r.ids)?r.ids.map(id=>byId.get(id)).filter(Boolean):[];
  if(!deck.length){SV('resume',null);home();return}
  SIT={deck,label:r.label||'picked up',mode:r.mode||'mini',i:Math.min(Math.max(r.i|0,0),deck.length-1),ans:r.ans||{},t0:r.t0||Date.now(),timed:false,end:null,learn:true,chk:r.chk||{},peek:r.peek||{}};
  renderQ();window.scrollTo(0,0);
}
function start(mode,learn=false){
  let deck,label,timed=false;
  if(learn){const r=LS('resume');
    if(r&&r.ids&&r.ids.length&&!confirm(`You have a Learn run waiting (Q${Math.min((r.i|0)+1,r.ids.length)} of ${r.ids.length} · ${r.label}). Drop it and start this one?`))return}
  if(mode==='mini'){
    if(learn){deck=dealMini(howMany(CLOSED.length),CLOSED);label=deck.length===CLOSED.length?'the whole bank':`${deck.length} from the bank`}
    else{deck=dealMini();label='mini mock'}}
  else if(mode==='full'){deck=dealFull();label='full mock';timed=!!META.shape.minutes}
  else if(mode==='miss'){deck=dealMisses(learn?CAP():12);label=learn?'my misses':'redo misses'}
  else if(mode==='pick'){deck=dealPick();const k=S.pick.length;
    label=k===1?(DATA.quizzes.find(z=>z.id===S.pick[0])||{}).name||'1 quiz':`${k} quizzes · ${deck.length} Q`}
  else if(mode.startsWith('quiz:')){const z=DATA.quizzes.find(x=>x.id===mode.slice(5));
    deck=DATA.questions.filter(q=>q.quiz===z.id);label=z.name}
  else if(mode.startsWith('sys:')){const s=mode.slice(4), pool=CLOSED.filter(q=>q.sys===s).length;
    deck=dealSys(s,howMany(pool));label=`${deck.length===pool?'all ':''}${deck.length} ${sysTag(s)}`}
  if(!deck||!deck.length){alert('Nothing to deal here yet.');return}
  if(learn){timed=false;SV('resume',null)}
  SIT={deck,label,mode,i:0,ans:{},t0:Date.now(),timed,end:timed?Date.now()+META.shape.minutes*60*1000:null,learn,chk:{},peek:{}};
  if(mode==='mini'&&DATA.chains.length){warmup();return}
  renderQ();
}
function warmup(){
  const ch=DATA.chains[Math.random()*DATA.chains.length|0];
  const beads=ch.beads.filter(b=>b.t);
  const bi=1+Math.random()*(beads.length-1)|0;
  const answer=beads[bi].t;
  const others=shuffle(DATA.chains.filter(c=>c!==ch).flatMap(c=>c.beads.filter(b=>b.t).map(b=>b.t))).slice(0,3);
  const opts=shuffle([answer,...others]);
  $('#view').innerHTML=`<div class="card">
    <b>30-second warm-up · ${esc(ch.name)}</b>
    <div class="chain">${ch.beads.map(b=> b.t
      ? `<div class="bead ${b.t===answer?'blank':''}">${b.t===answer?'?':esc(b.t)}</div>`
      : `<div class="verb">${esc(b.v)} ↓</div>`).join('')}</div>
    ${opts.map(o=>`<label class="opt"><input type="radio" name="wu"><span>${esc(o)}</span></label>`).join('')}
    <div class="src">${esc(ch.src)} — a scaffold built from her decks, not her material.</div>
    <button class="btn primary wide" id="wuGo">${SIT.learn?'Check → start learning':'Check → start the mock test'}</button>
    <button class="btn ghost wide" id="wuSkip">Skip warm-up</button></div>`;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');o.querySelector('input').checked=true});
  $('#wuGo').onclick=()=>{const sel=document.querySelector('.opt.sel span');
    if(sel){sel.closest('.opt').style.borderColor = sel.textContent===answer?'var(--ok)':'var(--danger)';
      setTimeout(renderQ, sel.textContent===answer?450:1400);
      if(sel.textContent!==answer){const right=[...document.querySelectorAll('.opt span')].find(s=>s.textContent===answer);right.closest('.opt').style.borderColor='var(--ok)';}
    } else renderQ()};
  $('#wuSkip').onclick=renderQ;
}
let timerIv=null;
function renderQ(){
  clearInterval(timerIv);
  const q=SIT.deck[SIT.i];
  const fb=$('#footbar');fb.classList.add('on');
  const last=SIT.i===SIT.deck.length-1, chk=SIT.learn?SIT.chk[q.id]:null;
  if(SIT.learn){
    /* learn mode: Check marks THIS question in place; Next only appears once it is marked */
    fb.innerHTML=`<button class="btn" id="prevB" ${SIT.i? '':'disabled'}>← Back</button>`+
      (chk?`<button class="btn primary" id="nextB">${last?'Finish':'Next →'}</button>`
          :`<button class="btn primary" id="chkB">Check ✓</button>`);
    $('#prevB').onclick=()=>{if(chk)saveLearnSaq();else saveAns();SIT.i--;renderQ()};
    if(chk)$('#nextB').onclick=()=>{saveLearnSaq();last?learnDone():(SIT.i++,renderQ())};
    else $('#chkB').onclick=learnCheck;
    saveRun();
  } else {
    fb.innerHTML=`<button class="btn" id="prevB" ${SIT.i? '':'disabled'}>← Back</button>
      <button class="btn primary" id="nextB">${last?'Finish & mark':'Next →'}</button>`;
    $('#prevB').onclick=()=>{saveAns();SIT.i--;renderQ()};
    $('#nextB').onclick=()=>{saveAns();last?mark():(SIT.i++,renderQ())};
  }
  setTimeout(()=>{const x=$('#exitB');if(x)x.onclick=()=>{if(confirm(SIT.learn?'Stop here? Everything you checked is already in your misses pile, and home will offer to pick this run up again.':'Abandon this mock test? Nothing is saved.')){clearInterval(timerIv);home();window.scrollTo(0,0)}}},0);
  const a=SIT.ans[q.id];
  const imgTag=f=>`<img class="qimg" src="img/${f}" alt="question figure" loading="lazy">`;
  /* the blank widget, inline where Canvas put it: her dropdown stays a dropdown
     (choices shuffled per sitting), her typed blank stays typed */
  const widget=(b,i)=> q.bk==='dd'
    ? `<select class="inl" data-i="${i}" aria-label="blank ${i+1}"><option value="">— choose —</option>${shuffleStable(q.id+i,b.options).map(o=>`<option ${a&&a.pick&&a.pick[i]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`
    : `<input type="text" class="inl" data-i="${i}" style="width:${Math.min(26,Math.max(7,Math.max(...b.options.map(o=>o.length))+3))}ch" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type…" aria-label="blank ${i+1}" value="${a&&a.pick?esc(a.pick[i]||''):''}">`;
  /* structured stem: her paragraphs, lists and table rows, with [[IMG:…]] and
     [[BLANK:k]] markers resolved in place. Images the stem did not place still show
     below it, so no figure is ever lost. */
  const placed=new Set();
  let stemHTML=q.qh
    ? q.qh.replace(/\[\[IMG:([^\]]+)\]\]/g,(m,f)=>{placed.add(f);return imgTag(f)})
          .replace(/\[\[BLANK:(\d+)\]\]/g,(m,k)=>q.type==='cloze'&&q.blanks[+k]?widget(q.blanks[+k],+k):'____')
    : esc(q.q);
  const imgs=(q.imgs||[]).filter(f=>!placed.has(f)).map(imgTag).join('');
  const inlineBlanks=q.type==='cloze'&&q.qh&&/\[\[BLANK:\d+\]\]/.test(q.qh);
  let body='';
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const multi=q.type==='multi';
    body=q.opts.map((o,i)=>`<label class="opt ${a&&a.sel&&a.sel.includes(i)?'sel':''}">
      <input type="${multi?'checkbox':'radio'}" name="q" value="${i}" ${a&&a.sel&&a.sel.includes(i)?'checked':''}>
      <span>${esc(optLabel(q,o))}</span></label>`).join('');
    if(multi)body=`<div class="note">Tick every answer that applies — it may be just one.</div>`+body;
  } else if(q.type==='match'){
    const bank=shuffleStable(q.id,[...new Set(q.pairs.map(p=>p.right))]); // a right-hand item used twice is still ONE option
    body=q.pairs.map((p,i)=>`<div class="blankrow"><label>${esc(p.left)}</label>
      <select data-i="${i}"><option value="">— choose —</option>
      ${bank.map(r=>`<option ${a&&a.pick&&a.pick[i]===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('');
  } else if(q.type==='cloze'){
    body=inlineBlanks
      ? `<div class="note">${q.bk==='dd'?'Pick from each dropdown in the text.':'Type into each blank in the text — spelling counts, capitals don’t.'}</div>`
      : q.blanks.map((b,i)=>`<div class="blankrow"><label>${esc(blankLabel(b,i))}${q.bk==='dd'?'':' (type it)'}</label>${widget(b,i)}</div>`).join('');
  } else if(q.type==='essay'){
    body=`${q.scenario?`<div class="note">${esc(q.scenario)}</div>`:''}
      ${q.authored&&DATA.stats.nAuthored<DATA.stats.n?`<div class="note">This question was written by this tool from the lecture decks — it is not one the lecturers set. It is here because the real paper has a written section and the Canvas quizzes have none.</div>`:''}
      <div class="note">Written question · ${q.pts} marks — write ${q.pts} numbered points, ${META.saqHint||'one point each'}. You mark yourself against the model ${SIT.learn?'when you press Check':'at the end'}.</div>
      <textarea data-essay placeholder="1. …&#10;2. …">${a&&a.text?esc(a.text):''}</textarea>`;
  }
  /* learn mode: once checked, a wrong/skipped/written question already has its slide and
     video open inside the mark block, so the chips row is only shown while they are not */
  const open=chk&&learnOpen(q,chk);
  $('#view').innerHTML=`<div class="card">
    <div class="qhead"><span class="n">Q${SIT.i+1}/${SIT.deck.length}</span>
      <span class="tag ${q.sys}">${esc(sysTag(q.sys))}</span><span class="tag">${q.pts} mk</span>${SIT.learn?'<span class="tag" style="color:var(--ok)">learn</span>':''}
      <span class="timer" id="timer"></span>
      <button class="btn ghost" id="exitB" title="${SIT.learn?'stop learning':'abandon mock test'}" style="padding:2px 10px">✕</button></div>
    ${inlineBlanks?body:''}<div class="stem${q.qh?' rich':''}">${stemHTML}</div>${imgs}${inlineBlanks?'':body}
    ${chk?learnMkHTML(q,chk):''}${SIT.learn&&!open?learnChipsHTML(q):''}
    <div class="pips">${SIT.deck.map((_,i)=>{const id=SIT.deck[i].id,c=SIT.learn&&SIT.chk[id];
      const cls=c?(c.r?(c.r.got>=c.r.tot&&SIT.ans[id]?'ok':'bad'):'done'):(SIT.ans[id]?'done':'');
      return `<span class="pip ${cls} ${i===SIT.i?'cur':''}"></span>`}).join('')}</div>
  </div>`;
  if(chk)paintChecked(q);

     handler also flipped it by hand, and the two flips cancelled: tapping the WORDS of a
     "tick every answer that applies" option never ticked it (only the box itself did). */
  else document.querySelectorAll('.opt').forEach(o=>{const inp=o.querySelector('input');
    inp.onchange=()=>{if(inp.type==='radio')document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.toggle('sel',inp.checked)}});
  if(SIT.timed){const t=$('#timer');const tick=()=>{const s=Math.max(0,(SIT.end-Date.now())/1000|0);
    t.textContent=`${s/60|0}:${String(s%60).padStart(2,'0')}`;t.classList.toggle('low',s<300);
    if(s<=0){clearInterval(timerIv);saveAns();mark()}};tick();timerIv=setInterval(tick,1000)}

function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}

    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};

/* ── learn mode ────────────────────────────────────────────────────────

   the answer, her slide and the matched video sit right under it — the results
   accordion brought forward to the moment you still care. Slide and video can be
   opened BEFORE answering; that counts as a peek, and a right answer after a peek
   does not clear a miss. Check with nothing picked = "show me" = a miss. Learn

function learnChipsHTML(q){
  const chips=[];
  if(q.vid)chips.push(`<button class="qa" data-act="vid">▶ Video · from ${mmss(Number.isInteger(q.vid.at)?q.vid.at:0)}</button>`);

  if(hasHer(q))chips.push('<button class="qa" data-act="hl">✅ Her worked answer</button>');
  const hint=chips.length?(SIT.chk[q.id]?'':'<span class="hint">open before or after you answer</span>')
    :`<span class="hint">${NOREF_HINT}</span>`;
  return `<div class="lres" data-qid="${q.id}">${chips.join('')}${hint}<div class="qr-pane" hidden></div></div>`;
}
/* resources open by themselves for: written questions, skipped ones, anything not fully right */
const learnOpen=(q,chk)=>!chk.r||!SIT.ans[q.id]||chk.r.got<chk.r.tot;
function learnCheck(){

function saveLearnSaq(){

function learnMkHTML(q,chk){

/* lock the widgets and colour them: the key green, a wrong pick red, per part for matching and blanks */
function paintChecked(q){
  const a=SIT.ans[q.id]||{};

/* ── marking ───────────────────────────────────────────────────────── */
function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
/* dropdown: only her marked option is right. Typed: every accepted spelling is. */
function blankOK(q,b,v){
  /* phones type curly quotes; a trailing full stop is not a wrong answer */
  const nrm=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  const x=nrm(v);if(!x)return false;
  const also=(b.also||[]).some(o=>nrm(o)===x);
  return q.bk==='dd' ? (x===nrm(b.correct)||also) : (b.options.some(o=>nrm(o)===x)||also);
}
function blankLabel(b,i){return b.ctx?`${b.ctx} ___`:(b.label&&!/^Answer \d+:?$/.test(b.label)?b.label.replace(/:$/,''):`Blank ${i+1}`)}
function mark(){
  clearInterval(timerIv);$('#footbar').classList.remove('on');
  let got=0,tot=0;const rows=[];
  for(const q of SIT.deck){

    S.seen[q.id]=(S.seen[q.id]||0)+1;
    if(r){got+=r.got;tot+=r.tot;
      if(r.got<r.tot)S.miss[q.id]=(S.miss[q.id]||0)+1;
      else if(S.miss[q.id])delete S.miss[q.id];
      rows.push({q,r})}
    else rows.push({q,r:null,saq:true});
  }
  SIT.auto={got,tot};
  const saqs=rows.filter(x=>x.saq);

    <div class="score-hero" id="hero"></div><div class="score-sub" id="heroSub"></div>
    ${saqs.length?`<div class="note">Tick each model step your written answer actually hit — the score updates as you go. Model answers are the tool’s, not ${META.who}’s.</div>`:''}
    <div class="rev-ctl"><label class="wo"><input type="checkbox" id="wrongOnly" ${rows.some(x=>x.saq||(x.r&&x.r.got<x.r.tot))?'checked':''}> Wrong only</label><span class="systally" id="systally"></span></div>
    ${rows.map(({q,r,saq},i)=>{
      const btn=(k,lbl)=>`<button class="qa" data-act="${k}">${lbl}</button>`;
      if(saq){const a=SIT.ans[q.id];
        return `<div class="qr saq" data-qid="${q.id}" data-sys="${q.sys}" data-wrong="1">
        <div class="qr-head"><span class="qr-mk mk-p" id="mk${i}">✍ /${q.pts}</span><span class="qr-stem">${esc(flatStem(q)).slice(0,140)}</span></div>
        ${a&&a.text?`<div class="you">You wrote: ${esc(a.text.slice(0,240)).replace(/\n/g,' ')}${a.text.length>240?'…':''}</div>`:'<div class="you">— no answer written —</div>'}
        <div class="steps">${q.saq.steps.map((s,si)=>`<label><input type="checkbox" data-saq="${i}" data-pt="${q.pts/q.saq.steps.length}"> <span>${esc(s)}</span></label>${partRefHTML(q,si)}`).join('')}</div>
        <div class="qr-acts"><span class="src">${esc(q.saq.src)}</span>${q.vid?btn('vid','▶ Video'):''}${refBtns(q,btn)}${hasHer(q)?btn('hl','✅ Her answer'):''}</div><div class="qr-pane" hidden></div></div>`}
      const pct=r.got/r.tot, cls=pct>=1?'right':pct>0?'partial':'wrong';
      return `<div class="qr ${cls}" data-qid="${q.id}" data-sys="${q.sys}" data-wrong="${pct<1?1:0}">
        <div class="qr-head"><span class="qr-mk">${(+r.got.toFixed(1))}/${r.tot}</span><span class="qr-stem">${esc(flatStem(q)).slice(0,140)}</span></div>
        <div class="qr-acts">${btn('ans','✓ Answer')}${q.vid?btn('vid','▶ Video'):''}${refBtns(q,btn)}${hasHer(q)?btn('hl','✅ Her answer'):''}</div>
        <div class="qr-pane" hidden></div></div>`}).join('')}

  const upd=()=>{

    SIT.final={got:+g.toFixed(1),tot:t}};

  const wo=$('#wrongOnly'); if(wo){const f=()=>document.querySelectorAll('.qr').forEach(r=>{r.hidden=wo.checked&&r.dataset.wrong==='0'});wo.onchange=f;f();}
  {const ms={};rows.forEach(({q,r,saq})=>{if(!saq&&r&&r.got<r.tot)ms[q.sys]=(ms[q.sys]||0)+1});
   const t=$('#systally');if(t)t.innerHTML=Object.entries(ms).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<span class="tag">${SYS[s]||s} · ${n} missed</span>`).join('')||'<span class="tag ok">clean sweep ✓</span>';}
  $('#doneB').onclick=()=>{
    S.scores.push({t:Date.now(),mode:SIT.mode,label:SIT.label,got:SIT.final.got,tot:SIT.final.tot});
    SV('scores',S.scores);SV('miss',S.miss);SV('seen',S.seen);home();window.scrollTo(0,0)};
  SV('miss',S.miss);SV('seen',S.seen);
  window.scrollTo(0,0);
}
/* the explain row: her material first, then the right-sized video, then Ask AI.
   In a mock sitting only on wrong answers, never before the end; Learn mode brings
   the same row forward to the question itself. */
/* the review is an accordion: each question collapses to a mark + one-line stem, and
   the answer / video / slide open ON DEMAND below the row — never all at once. */
/* one reference, by kind: her slide is the rendered image (or, for a deck never rendered,
   the slide's own words); her prose and Patton are the sentence(s) the judge quoted,
   verbatim, with the source named. Every reference in the bank was judged to STATE the
   keyed fact and carries a quote re-found in the source at build time — same standard as
   the videos. Where Patton and Hannetjie disagree, she wins: her references sit above his. */
function refHTML(r){
  if(r.k==='slide'&&r.slide)return `<div class="refq slide"><a href="img/slides/${r.slide}" target="_blank" rel="noopener"><img class="slideimg" src="img/slides/${r.slide}" alt="her slide" loading="lazy"></a><span class="refsrc">📖 ${esc(r.src)} — tap to open full size</span></div>`;
  if(r.k==='patton')return `<div class="refq patton">📕 <i>“${esc(r.t)}”</i><span class="refsrc"> — ${esc(r.src)}${r.fig?` · Figure ${esc(r.fig)}${r.assigned?' (a figure she set in her learning page)':''}`:''}</span></div>`;
  return `<div class="refq">${REF[r.k].ic} <i>“${esc(r.t)}”</i><span class="refsrc"> — ${esc(r.src)}</span></div>`;
}
function refsHTML(q){ return q.refs.length?q.refs.map(refHTML).join(''):''; }
/* her worked helpline answer under a question: only where the bank tagged the question to a
   topic that has one (q.hl, content/qtopic.js) and the sim ships that section */
function hasHer(q){ return !!(q.hl&&typeof herAnswer==='function'&&(DATA.helpline||{})[q.hl]); }
function refBtns(q,btn){ return q.refs.map(r=>btn(r.k,`${REF[r.k].ic} ${REF[r.k].lbl}`)).join(''); }
function paneHTML(q,act){
  if(act==='vid')return q.vid?vidClipHTML(q.vid)+(q.vid.alt?vidRowHTML(q.vid.alt,'also · '):''):'';
  if(act==='hl')return hasHer(q)?herAnswer(q.hl):'';
  if(REF[act]){const r=q.refs.find(x=>x.k===act);return r?refHTML(r):''}
  return keyHTML(q,SIT.ans[q.id])+`<button class="btn ghost askai" data-ask="${q.id}">${AI_LBL}</button>`;
}
/* a video link opens at the moment its captions say the tested point is taught —
   `at` is where the verifying quote was found, not a guess */
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const CHAN={nn:'Ninja Nerd',iha:'Institute of Human Anatomy',az:'AnatomyZone',ah:'Armando Hasudungan'};
/* after a wrong answer the matched video is embedded and CUED to the ~2-min stretch
   that teaches the point; it stops at `end`. A button reloads it as the full video so
   you never have to leave for the playlist page. */
function vidClipHTML(v){
  const at=Number.isInteger(v.at)?v.at:0, end=Number.isInteger(v.end)&&v.end>at?v.end:at+120;
  const who=CHAN[v.ch]||'Dr Matt &amp; Dr Mike', cm=Math.max(1,Math.round((end-at)/60));
  return `<div class="vclip" data-id="${v.id}" data-at="${at}" data-end="${end}">
    <div class="vframe"><img class="vposter" loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><button class="vplay" aria-label="Play the clip">▶</button><span class="vbadge">▶ ${mmss(at)}–${mmss(end)} · ~${cm} min</span></div>
    <div class="vmeta"><span class="vch">${who}</span><a href="https://www.youtube.com/watch?v=${v.id}&t=${at}s" target="_blank" rel="noopener">${esc(v.t)}</a><span class="refsrc">${esc(v.d)}</span><button class="btn ghost vfull">▶ Watch the full video</button></div>
  </div>`;
}
function loadVid(c,at,end){
  const src='https://www.youtube.com/embed/'+c.dataset.id+'?start='+at+(end?'&end='+end:'')+'&rel=0&modestbranding=1&autoplay=1';
  c.querySelector('.vframe').innerHTML='<iframe src="'+src+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
}
function vidRowHTML(v,who){
  who=who??(({nn:'Ninja Nerd',iha:'Institute of Human Anatomy',az:'AnatomyZone',ah:'Armando Hasudungan'}[v.ch]||'Dr Matt &amp; Dr Mike')+' · ');
  const at=Number.isInteger(v.at)?v.at:0;
  return `<div class="vidrow">▶ <a href="https://www.youtube.com/watch?v=${v.id}${at?`&t=${at}s`:''}" target="_blank" rel="noopener">${esc(v.t)}</a> <span class="refsrc">${who}${esc(v.d)}${at?` · from ${mmss(at)}`:''}</span></div>`;

function weakSpotsHTML(rows){
  const missed=rows.filter(x=>!x.saq&&x.r&&x.r.got<x.r.tot).map(x=>x.q);
  if(missed.length<3)return '';
  const vids=new Map();
  for(const q of missed) if(q.vid){ if(!vids.has(q.vid.id)) vids.set(q.vid.id,q.vid); if(q.vid.alt&&!vids.has(q.vid.alt.id)) vids.set(q.vid.alt.id,q.vid.alt); }
  if(!vids.size)return '';
  const bySys={};for(const q of missed)bySys[q.sys]=(bySys[q.sys]||0)+1;
  const worst=Object.entries(bySys).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="note" style="border-left-color:var(--primary)">
    <b>Weak spots this mock test</b> — ${missed.length} missed, most in ${SYS[worst[0]]||worst[0]}.
    Watch these before your next sitting:
    ${[...vids.values()].slice(0,4).map(v=>vidRowHTML(v)).join('')}
    <div class="refsrc">Each video was matched to its question from the video's own captions and checked twice, and the link opens where that point is taught. Where a video and ${META.who} disagree, the lecturer wins.
    ${META.playlist?`<a href="${META.playlist}" target="_blank" rel="noopener">All ${DATA.stats.videos} by topic ↗</a>`:''}</div></div>`;
}
/* readable key rendering: matching and cloze get one ROW per part, wrong parts
   annotated with what you picked — never a run-on paragraph */
function keyHTML(q,a){
  if(q.type==='match')return `<div class="keyrows">${q.pairs.map((p,i)=>{
    const yours=(a&&a.pick||{})[i];const wrong=yours&&yours!==p.right;
    return `<div class="krow ${yours===p.right?'kok':''}">${esc(p.left)} <b>→ ${esc(p.right)}</b>${wrong?` <span class="kyou">you: ${esc(yours)}</span>`:yours?'':' <span class="kyou">unanswered</span>'}</div>${yours===p.right?'':partRefHTML(q,i)}`}).join('')}</div>`;
  if(q.type==='cloze')return `<div class="keyrows">${q.blanks.map((b,i)=>{
    const yours=(a&&a.pick||{})[i];
    const right=blankOK(q,b,yours);
    const alt=q.bk==='fib'&&b.options.length>1?` <span class="refsrc">(also accepted: ${esc(b.options.filter(o=>o!==b.correct).join(', '))})</span>`:'';
    return `<div class="krow ${right?'kok':''}">${esc(blankLabel(b,i))} <b>→ ${esc(b.correct)}</b>${alt}${yours&&!right?` <span class="kyou">you: ${esc(yours)}</span>`:yours?'':' <span class="kyou">unanswered</span>'}</div>${right?'':partRefHTML(q,i)}`}).join('')}</div>`;
  return `<div class="keyline">Key: ${esc(keyText(q))}</div>`
    + (q.why?`<div class="refq">💡 <i>${esc(q.why)}</i><span class="refsrc"> — the tool’s explanation${q.src?' · from '+esc(q.src):''}</span></div>`
       :q.src?`<div class="refsrc">From ${esc(q.src)}</div>`:'');
}
/* the one line that states this part (q.prefs, judged + quote-gated per pair / blank / step);
   shown under a part the student got wrong or left blank, never under a right one */
function partRefHTML(q,i){
  const r=(q.prefs||[]).find(x=>x.i===i+1); if(!r)return '';
  return `<div class="kref">${REF[r.k].ic} <i>“${esc(r.t)}”</i> <span class="refsrc">— ${esc(r.src)}</span></div>`;
}
function keyText(q){
  if(q.type==='match')return q.pairs.map(p=>`${p.left} → ${p.right}`).join(' · ');
  if(q.type==='cloze')return q.blanks.map(b=>b.correct).join(' · ');
  return (q.key||[]).map(o=>optLabel(q,o)).join(' · ');
}
/* bare-letter options carry their text from the stem's lettered list (build-time) */
function optLabel(q,o){return q.ol&&q.ol[o]?`${o}. ${q.ol[o]}`:o}
/* the flat stem carries Canvas's literal "[ Select ]" where each dropdown sat */
const flatStem=q=>q.qt||String(q.q||'').replace(/\[ Select \]/g,'____');
/* ── ask an AI ────────────────────────────────────────────────────────
   Two buttons compose a prompt and copy it; this page sends nothing anywhere —
   you paste it into Gemini (or any AI chat) yourself. The shape is the one that
   gets a frozen brain moving: explain it like I'm stupid (one everyday analogy,
   mapped back to the real terms), in HER words, then a five-question blind quiz
   with instant feedback. The prompt carries her key, her notes and her "how far
   it goes" line so the AI teaches to her paper and stops where she stops —
   without that an AI happily teaches the Krebs cycle for a test that only asks
   you to rank three energy routes. An AI's quiz checks the analogy landed; only
   her questions here check that it would earn marks. */
const AI_CTX=META.aiCtx;
const AI_LBL='🤖 Explain like I’m stupid + quiz me';
const AI_SHAPE={mcq:'multiple choice',tf:'true or false',multi:'tick every answer that applies',match:'matching',cloze:'fill the blanks / dropdowns',essay:'a written answer marked one mark per step'};
const aiSteps=(extra,shape,stop)=>`Do this, in order:\n1. Explain it like I’m stupid: one everyday analogy, then map every part of the analogy back to the real term.\n2. Use my lecturer’s exact terms from above. Those words earn the marks; the analogy is scaffolding.\n${extra?'3. '+extra+'\n':''}${extra?4:3}. Then give me a 5-question blind quiz on it, ONE question at a time, with instant feedback after each answer, ${shape}.\n${stop}`;
function aiQuestionPrompt(q,withFig){
  const a=SIT.ans[q.id];
  const you=a?(a.text||((a.sel||[]).map(i=>optLabel(q,q.opts[i])).join(', ')||Object.values(a.pick||{}).join(', '))):'';
  const L=[AI_CTX+(q.authored?' This is a practice question a study tool wrote from my lecturer’s slides.':' This is one of my lecturer’s own practice questions.')+' I want to understand it, not memorise the answer.','',`Question: ${flatStem(q)}`];
  if(q.opts&&q.opts.length)L.push(`Options: ${q.opts.map(o=>optLabel(q,o)).join(' | ')}`);
  if(q.saq)L.push('The model answer, one mark per step: '+q.saq.steps.map((s,i)=>`(${i+1}) ${s}`).join(' '));
  else L.push(`Correct answer: ${keyText(q)}`);
  if(q.why)L.push(`The study tool’s explanation: ${q.why}${q.src?' (source: '+q.src+')':''}`);
  L.push(`My answer: ${you||'(none — I didn’t know)'}`);
  if(q.imgs&&q.imgs.length)L.push(withFig?'The question’s figure is pasted with this message. Read it before answering — the question is about it.':'This question has a diagram I can’t paste. Don’t guess what it shows; work from the text.');
  for(const r of q.refs||[]){
    if(r.t)L.push(`${r.k==='patton'?'The textbook says':r.k==='course'?'A file posted in my course (not by my lecturer) says':'My lecturer’s notes say'} (verbatim): “${r.t}” — ${r.src}`);
    else if(r.k==='slide')L.push(withFig?`My lecturer’s slide on this is pasted with this message — ${r.src}. Her wording on it is what earns the marks.`:`My lecturer’s slide on this: ${r.src} (an image, I can’t paste it).`);
  }
  if(hasHer(q)){const h=DATA.helpline[q.hl];L.push('','Her own worked answer for this topic, verbatim (her CAPITALS are the mark-earning words):',h.parts.map(p=>p.h+'\n'+p.t).join('\n'));}
  L.push('',aiSteps(you?'In one line, say what misconception my answer suggests.':'',`in the shape she uses (${AI_SHAPE[q.type]||'multiple choice'})`,'Stay inside this question and her notes. Don’t teach past them.'));
  return L.join('\n');
}
/* topic-first: the focus row's own `done` / `ask` / `cap` become the AI's brief,
   plus her worked helpline answer where she posted one */
function aiTopicPrompt(f){
  const L=[AI_CTX+` Topic: ${f.t} (${SYS[f.sys]||f.sys}).`,'','My lecturer set the level. Here is exactly what I have to be able to DO, in her words:',`“${f.done}”`,`How she asks it in tests: “${f.ask}”`];
  if(f.cap)L.push(`Where it ends — do NOT go past this: “${f.cap}”`);
  const h=(DATA.helpline||{})[f.id];
  if(h){let t=h.parts.map(p=>p.h+'\n'+p.t).join('\n');if(t.length>3000)t=t.slice(0,3000)+' …(trimmed)';
    L.push('','Her own worked answer for this topic, verbatim (her CAPITALS are the mark-earning words):',t);}
  L.push('',aiSteps('','in the shapes she uses (see “how she asks it” above)','Stay inside her level. Don’t teach past the “where it ends” line.'));
  return L.join('\n');
}
/* the question's own figures — or, when it has none, her slide (the build guarantees a
   question never carries both) — drawn onto ONE white png, each with its label, so a single
   paste lands every picture the AI needs. Same-origin images, so the canvas stays clean. */
function aiFigures(q){
  const f=[];
  for(const n of q.imgs||[])f.push({src:'img/'+n,label:q.imgs.length>1?'Question figure '+(f.length+1):'Question figure'});
  for(const r of q.refs||[])if(r.k==='slide'&&r.slide)f.push({src:'img/slides/'+r.slide,label:'My lecturer’s slide — '+r.src});
  return f;
}
function aiFigureBlob(q){
  const srcs=aiFigures(q); if(!srcs.length)return Promise.resolve(null);
  return Promise.all(srcs.map(s=>new Promise(res=>{const im=new Image();im.onload=()=>res({im,label:s.label});im.onerror=()=>res(null);im.src=s.src}))).then(all=>{
    const ok=all.filter(Boolean); if(!ok.length)return null;
    const PAD=16,LH=30,W=Math.min(1200,Math.max(...ok.map(x=>x.im.naturalWidth||900)));
    const rows=ok.map(x=>{const w=x.im.naturalWidth||900,h=x.im.naturalHeight||Math.round(w*0.7),s=Math.min(1,W/w);return {im:x.im,label:x.label,w:Math.round(w*s),h:Math.round(h*s)}});
    const c=document.createElement('canvas');c.width=W+PAD*2;c.height=rows.reduce((a,r)=>a+LH+r.h+PAD,PAD);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
    let y=PAD;for(const r of rows){g.fillStyle='#222';g.font='bold 17px system-ui,Segoe UI,sans-serif';g.fillText(r.label,PAD,y+20);y+=LH;g.drawImage(r.im,PAD+Math.round((W-r.w)/2),y,r.w,r.h);y+=r.h+PAD}
    return new Promise(res=>c.toBlob(res,'image/png'));
  });
}
/* copy: text + png in ONE clipboard item where the browser allows it (Chrome, Edge, Safari,
   Android Chrome), built inside the tap so Safari's gesture rule holds — the png is a promise
   because the figures are still being drawn. Anything else falls back to text only, and the
   text then says the picture could not come along. After a combined copy two small buttons
   let you re-copy just the text or just the figure, for an AI that keeps only one of them. */
function copyPrompt(btn,textFor,figP){
  const text=typeof textFor==='function'?textFor:()=>textFor;
  const done=(ok,fig)=>{btn.textContent=ok?(fig?'Copied ✓ prompt + figure — paste into Gemini (or any AI)':'Copied ✓ now paste it into Gemini (or any AI)'):'Copy blocked — select the text below and copy it';
    const nx=btn.nextElementSibling;
    if(!ok&&!(nx&&nx.classList.contains('aitext'))){const ta=document.createElement('textarea');ta.className='aitext';ta.readOnly=true;ta.value=text(false);btn.after(ta);ta.focus();ta.select()}
    if(fig&&!(nx&&nx.classList.contains('aisplit'))){const d=document.createElement('div');d.className='aisplit refsrc';d._btn=btn;
      d.innerHTML='Only one of them landed? <button class="btn ghost askai" data-aitext="1">📋 text only</button> <button class="btn ghost askai" data-aifig="1">🖼 figure only</button>';btn.after(d)}
    setTimeout(()=>btn.textContent=AI_LBL,4000)};
  const textOnly=()=>(navigator.clipboard?navigator.clipboard.writeText(text(false)):Promise.reject())
    .then(()=>done(true,false))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=text(false);ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}
      ta.remove();done(ok,false)});
  if(figP&&navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
    let item=null;
    try{item=new ClipboardItem({'text/plain':new Blob([text(true)],{type:'text/plain'}),'image/png':figP.then(b=>{if(!b)throw new Error('no figure');return b})})}catch(_){}
    if(item){navigator.clipboard.write([item]).then(()=>{btn._aiFig=figP;btn._aiText=text(true);done(true,true)}).catch(textOnly);return}
  }
  textOnly();
}
function aiSplitCopy(s){
  const b=s.closest('.aisplit')._btn, was=s.textContent, flash=t=>{s.textContent=t;setTimeout(()=>s.textContent=was,2500)};
  const p=s.dataset.aitext?navigator.clipboard.writeText(b._aiText):navigator.clipboard.write([new ClipboardItem({'image/png':b._aiFig})]);
  p.then(()=>flash('Copied ✓')).catch(()=>flash('Copy blocked'));
}
/* ── chrome ────────────────────────────────────────────────────────── */
document.title = META.title; $('#h1').textContent = META.h1;
if(META.playlist){ const p=$('#plBtn'); p.href=META.playlist; p.hidden=false; }
{ /* one colour per group, from META.hue: bright on the dark theme, deep on the light one */
  const st=document.createElement('style');
  st.textContent=Object.entries(META.hue||{}).map(([k,h])=>`.tag.${k}{color:hsl(${h} 85% 68%)}:root[data-theme=light] .tag.${k}{color:hsl(${h} 70% 36%)}`).join('');
  document.head.appendChild(st); }
paintCountdown();
$('#themeBtn').onclick=()=>{const r=document.documentElement;
  const to=r.dataset.theme==='light'?'':'light';
  to?r.dataset.theme='light':delete r.dataset.theme;SV('theme',to)};
if(LS('theme')==='light')document.documentElement.dataset.theme='light';
$('#helpBtn').onclick=()=>{const H=META.help||{}, nAuth=DATA.questions.filter(q=>q.authored).length, nNm=CLOSED.length-MOCKABLE.length;
  $('#help').innerHTML=`
  <h2 style="margin-top:0">What is this?</h2>
  <p>${H.what||''}</p>
  <h3>Where the questions come from</h3>
  <p>${DATA.stats.n-nAuth?`${DATA.stats.n-nAuth} questions captured from ${DATA.quizzes.filter(z=>!z.authored).length} Canvas quizzes, answer keys
  extracted from the graded pages — stems, options and keys exactly as set, nothing invented.`:(H.noBank||'This paper has no Canvas quizzes, so nothing here was captured.')}
  ${ESSAYS.some(q=>!q.authored)?`Written questions from Canvas have <b>model answers written by this tool</b> (Canvas publishes none), one mark per step, each naming its source. `:''}
  ${nAuth?(H.authored||`<b>${nAuth} written questions were written by this tool</b> from the lecture decks, because the real paper has a written section and the quizzes have none; each is labelled as the tool’s and names its deck. `):''}
  ${DATA.chains.length?'Warm-up chains are scaffolds built from the decks, not the lecturer’s material. ':''}
  ${nNm?`${nNm} questions are about being a student on this course rather than the subject (attendance, extensions, online-exam rules); they stay under Pick my rep but are never dealt into a mock paper. `:''}</p>
  ${H.groups?`<p>${H.groups}</p>`:''}
  <h3>Learn mode</h3>
  <p><b>Learn as you go</b> (and the <b>Learn</b> button beside each quiz) marks every question the moment you
  press Check and shows the answer${HAS.ref?', the slide or notes that state it':''}${HAS.vid?' and the matched video':''} right there${HAS.ref||HAS.vid?' — you can open any of them before answering':''}. Check with nothing picked just shows you. Nothing from Learn mode
  goes on the score chart; a wrong or skipped question still joins your misses pile${HAS.ref||HAS.vid?', and a right answer after a peek does not clear it':''}. <b>Sit</b> is the test version: the same questions, nothing shown until the end.</p>
  <p><b>How many at a time</b> (12 · 25 · 50 · 100 · All) sets the size of every dealt Learn set and of the
  per-group sets; All hands you the whole pool, least-seen first, misses first. Under <b>Pick my rep</b>
  tick any quizzes — or a whole group with the chips — and the bar at the bottom
  runs them as one deck, Learn or Sit, every question of every ticked quiz. A Learn run saves itself after every
  Check; stop partway (or lose the tab) and the home page offers to pick it up where you were.</p>
  ${H.explain?`<h3>Where the explanations come from</h3><p>${H.explain}</p>`:''}
  <h3>Ask an AI — the 🤖 buttons</h3>
  <p>Under every marked question${DATA.focus.length?', and inside every row of the focus list,':''} <b>${AI_LBL}</b> copies a
  ready-made prompt to paste into Gemini (or any AI chat). It asks for one everyday analogy mapped back to the
  real terms, in the lecturer’s words, then a five-question blind quiz with instant feedback — and it carries the
  key${HAS.ref?', the notes':''}${DATA.focus.length?' and the “where it ends” line':''}, so the AI teaches to this paper and stops where it stops.
  If the question has a figure, the copy carries that too, as one picture. This page sends nothing anywhere; you
  paste it yourself. An AI’s quiz checks that the analogy landed. Only the real questions here check that it would
  earn marks — come back and sit them.</p>
  <h3>What’s held out</h3>
  <p>${DATA.held.length?`${DATA.held.length} questions are excluded (image or format did not survive capture) — listed in the repo.`:'Nothing: every captured question shipped.'} ${H.held||''}</p>
  <h3>Your data</h3>
  <p>Scores and misses live in this browser only. Nothing is sent anywhere. Clearing site data wipes them.</p>
  <h3>For whoever maintains this</h3>
  <p>Built by <code>build.mjs</code> from ${DATA.stats.n-nAuth?'<code>bank/questions.json</code> (parsed Canvas captures), ':''}<code>content/</code> and <code>sim.config.mjs</code>.
  Rebuild: <code>node build.mjs</code>. Bank built ${DATA.built}. Multi-answer questions mark all-or-nothing;
  matching and dropdowns mark per part.</p>
  <button class="btn primary wide" onclick="this.closest('dialog').close()">Close</button>`;
  $('#help').showModal()};
document.addEventListener('click',e=>{
  const vf=e.target.closest('.vfull'); if(vf){const c=vf.closest('.vclip');loadVid(c,+c.dataset.at,null);return}
  const fr=e.target.closest('.vframe'); if(fr&&!fr.querySelector('iframe')){const c=fr.closest('.vclip');loadVid(c,+c.dataset.at,+c.dataset.end);return}
  const qa=e.target.closest('.qa'); if(qa){const row=qa.closest('.qr,.lres'),pane=row.querySelector('.qr-pane'),act=qa.dataset.act,open=pane.dataset.act===act&&!pane.hidden;row.querySelectorAll('.qa').forEach(b=>b.classList.toggle('on',b===qa&&!open));if(open){pane.hidden=true;pane.dataset.act='';return}
    const q=SIT.deck.find(x=>x.id===row.dataset.qid);

  const ask=e.target.closest('[data-ask],[data-askf]');
  if(ask){
    if(ask.dataset.ask){const q=SIT.deck.find(x=>x.id===ask.dataset.ask);copyPrompt(ask,w=>aiQuestionPrompt(q,w),aiFigures(q).length?aiFigureBlob(q):null)}
    else copyPrompt(ask,aiTopicPrompt(DATA.focus.find(f=>f.id===ask.dataset.askf)),null);
    return}
  const sp=e.target.closest('[data-aitext],[data-aifig]'); if(sp){aiSplitCopy(sp);return}
  if(e.target.id==='shareBtn'){
  const l=S.scores[S.scores.length-1];

  e.target.textContent='Copied ✓';setTimeout(()=>e.target.textContent='Copy score line',1500)}});
