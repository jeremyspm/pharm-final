<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- shared with a study group by link; the lecturers' quiz questions stay out of search engines -->
<meta name="robots" content="noindex, nofollow">
<title>Paper Sim</title>
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}   /* .btn sets display, which would otherwise beat the attribute */
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
/* phone: title over countdown on the left, buttons full height on the right (was one flex row: the title got squeezed to a word per line) */
@media(max-width:560px){
  header{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;gap:0 8px;padding:8px 12px}
  header h1{grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .d{grid-area:2/1;white-space:normal;font-size:.76rem;line-height:1.3}
  header .btn{grid-row:1/span 2;padding:8px 10px;min-width:40px}
}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
/* a quiz row: tag + name, then count + Learn + Sit as one group that drops to a
   second line at phone width instead of squeezing the name into four lines */
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1 1 150px;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.qrow .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
/* quiz selection: tick any rows (or a whole system) and the bottom bar runs them as one */
.qrow{cursor:pointer}
.qrow.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.qrow>input.pk{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:var(--primary);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;font-size:.8rem;color:var(--muted-fg)}
.chip{border:1px solid var(--border);border-radius:99px;padding:4px 11px;background:transparent;color:var(--fg);
  cursor:pointer;font:inherit;font-size:.8rem;font-weight:600;line-height:1.3}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.footbar .btn.x{flex:0 0 auto}
/* ── focus checklist ─────────────────────────────────────────────────── */
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:2px 0 8px}
.fbar{height:6px;border-radius:99px;background:var(--accent);overflow:hidden;flex:1 1 140px;min-width:120px}
.fbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.ftier{font-weight:700;font-size:.82rem;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.ftier b{font-weight:700}
.ftier .fnum{font-weight:400;color:var(--muted-fg)}
.frow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);
  border-left:3px solid var(--tc,var(--border))}
.frow.on{opacity:.62}
.frow.on .ft{text-decoration:line-through}
.frow>input.fchk{flex:0 0 auto;width:18px;height:18px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.fbody{flex:1 1 auto;min-width:0}
.fbody>summary{cursor:pointer;list-style:none;display:block}
.fbody>summary::-webkit-details-marker{display:none}
.ft{font-weight:650;font-size:.92rem;display:block}
.fmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fchip{font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--muted-fg);white-space:nowrap}
.fchip.her{background:hsl(38 92% 55% / .18);color:var(--warn)}
.fchip.tape{background:hsl(0 84% 60% / .16);color:var(--danger)}
.fchip.saq{background:hsl(218 91% 64% / .16);color:var(--primary)}
.fchip.sys{background:transparent;border:1px solid var(--border)}
.fchip.hl{background:hsl(158 64% 42% / .2);color:var(--ok);font-weight:650}
.fchip.rev{background:hsl(158 64% 42% / .12);color:var(--ok)}
.fchip.kh{background:hsl(280 60% 60% / .16);color:hsl(280 70% 72%)}
.hlans{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.hlans>summary{cursor:pointer;padding:7px 10px;font-weight:650;font-size:.84rem;color:var(--ok);list-style:none}
.hlans>summary::-webkit-details-marker{display:none}
.hlans .hlbody{padding:0 10px 10px;font-size:.83rem;line-height:1.55;white-space:pre-wrap}
.hlans .hlh{font-weight:700;margin:8px 0 4px;font-size:.8rem;letter-spacing:.02em}
.fdet{font-size:.85rem;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.fdet p{margin:0 0 7px}
.fdet .fcap{color:var(--muted-fg)}
.fwhy{font-size:.8rem;line-height:1.5;color:var(--muted-fg);margin:0 0 4px}
@media(max-width:400px){ .ft{font-size:.88rem} .fdet{font-size:.82rem} }
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.mixed,.tag.authored{color:var(--muted-fg)}
/* one colour per group: written at load from META.hue (see "chrome") */
/* sitting */
.qhead{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.lres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.lres .hint{font-size:.76rem;color:var(--muted-fg)}
.lres .qr-pane{flex-basis:100%;padding:6px 0 0}
.mk .verdict{font-weight:700;margin:0 0 4px}
.mk.right .verdict{color:var(--ok)} .mk.wrong .verdict{color:var(--danger)} .mk.saq{border-color:var(--primary)}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.qrow .btn{padding:6px 10px;font-size:.8rem}
.qrow .btn.learn{border-color:var(--primary);color:var(--primary)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.refq.patton{border-left:3px solid var(--primary)}
.refq i{color:var(--fg)}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.kref{font-size:.84rem;color:var(--muted-fg);margin:4px 0 6px 14px;padding:6px 10px;background:var(--muted);border-radius:8px;line-height:1.45}
.kref i{color:var(--fg)}
.kref .refsrc{display:inline}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.aiwrap{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:8px 0 4px}
.aitext{flex-basis:100%;width:100%;min-height:150px;font-size:.78rem;margin-top:6px}
.aisplit{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px}
.aisplit .askai{margin-top:0}
.vclip{margin:.5rem 0}
.vframe{position:relative;aspect-ratio:16/9;width:100%;max-width:460px;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.vframe img,.vframe iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(20,20,28,.72);color:#fff;border:2px solid #fff;font-size:1.3rem;cursor:pointer;line-height:1}
.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;padding:2px 6px;border-radius:4px;pointer-events:none}
.vmeta{font-size:.82rem;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.vch{font-weight:600}
.vfull{padding:2px 8px;font-size:.74rem}
.rev-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:.85rem}
.rev-ctl .wo{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.systally{display:flex;flex-wrap:wrap}
.systally .tag{display:inline-block;background:var(--muted);padding:2px 9px;border-radius:11px;margin:2px 5px 2px 0;font-size:.74rem}
.systally .tag.ok{color:var(--ok)}
.qr{border:1px solid var(--muted);border-left-width:4px;border-radius:9px;margin:6px 0;background:var(--card)}
.qr.right{border-left-color:var(--ok)} .qr.partial{border-left-color:var(--warn)} .qr.wrong{border-left-color:var(--danger)} .qr.saq{border-left-color:var(--primary)}
.qr-head{display:flex;gap:10px;align-items:flex-start;padding:9px 11px 7px}
.qr-mk{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 8px;border-radius:6px;font-size:.82rem;background:var(--muted)}
.qr.right .qr-mk{background:var(--ok);color:var(--onprimary)} .qr.partial .qr-mk{background:var(--warn);color:var(--onprimary)} .qr.wrong .qr-mk{background:var(--danger);color:#fff}
.qr-stem{font-size:.9rem;line-height:1.35;flex:1}
.qr-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 11px 9px}
.qa{padding:3px 11px;font-size:.77rem;border:1px solid var(--muted);border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.qa:hover{border-color:var(--primary)} .qa.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.qr-pane{padding:2px 11px 11px}
.qr .src{font-size:.72rem;color:var(--primary);margin-right:auto;opacity:.85}
.qr .you{font-size:.8rem;padding:2px 11px 4px;opacity:.85}
.qr .steps{padding:2px 11px 6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
/* ── home: one screen of row cards, each opening its own screen (was one 5-6 screen scroll) ── */
.hero{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--primary) 14%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);
  border-radius:12px;padding:12px 14px;margin:2px 0 4px}
.hero small{display:block;font-size:.76rem;color:var(--primary);font-weight:650}
.hero b{display:block;font-size:1rem;line-height:1.35;margin-top:2px}
.hero .go{flex:0 0 auto;margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--onprimary);
  display:flex;align-items:center;justify-content:center;font-size:1rem}
.lsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:12px 4px 5px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:0 0 7px;
  transition:border-color var(--dur) var(--ease)}
.lrow:hover{border-color:color-mix(in srgb,var(--primary) 55%,var(--border))}
.lic{flex:0 0 40px;height:40px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.ltx{flex:1 1 auto;min-width:0}
.ltx b{display:block;font-size:.97rem;font-weight:650}
.ltx small{display:block;font-size:.8rem;color:var(--muted-fg);line-height:1.35;margin-top:1px}
.lch{flex:0 0 auto;color:var(--muted-fg);font-size:1.3rem;line-height:1}
/* the paper's banner on home: its bold first sentence always shows, the rest is one tap away */
.bnote{margin:0 0 10px}
.bnote>summary{cursor:pointer;list-style:none}
.bnote>summary::-webkit-details-marker{display:none}
.bnote>summary::after{content:' · more';color:var(--primary);font-size:.8rem;font-weight:650}
.bnote[open]>summary::after{content:''}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead h2{margin:0;font-size:1.1rem;flex:1}
.shead .btn{padding:6px 12px;flex:0 0 auto}
.card .lead{margin:0 0 4px;color:var(--muted-fg);font-size:.9rem;line-height:1.5}
/* each screen's full explanation, folded under its one-line lead (self-explaining, but out of the way) */
.how{margin:0 0 6px}
.how>summary{cursor:pointer;font-size:.82rem;font-weight:650;color:var(--primary);list-style:none;display:inline-block;padding:2px 0}
.how>summary::-webkit-details-marker{display:none}
.how>summary::before{content:'ⓘ '}
.how[open]{border-left:2px solid var(--border);padding-left:10px;margin:4px 0 10px}
.how p,.how .note{font-size:.86rem;color:var(--muted-fg);margin:.4rem 0}
/* ── written answers, learned from a short version (ported from hs2-final, itself hs2-test3's SAQ Trainer) ── */
.sdoor{border-left:4px solid var(--danger)}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 10px;background:var(--muted);cursor:pointer}
.srow b{flex:1 1 160px;font-size:.86rem;font-weight:600}
.srow .m{color:var(--muted-fg);font-size:.74rem;white-space:nowrap}
.sbadge{font-size:.7rem;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg);white-space:nowrap}
.sbadge.lock{background:hsl(158 64% 42% / .2);color:var(--ok);font-weight:650}
.sbadge.go{background:hsl(38 92% 55% / .18);color:var(--warn)}
#sqBack,.qhead .tag{white-space:nowrap;flex:0 0 auto}
.sstages{display:flex;gap:4px;margin:0 0 12px}
.sstage{flex:1;font:inherit;font-size:.74rem;font-weight:600;padding:5px 2px;border-radius:6px;background:var(--muted);
  color:var(--muted-fg);border:1px solid var(--border);cursor:pointer}
.sstage.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.sask{font-weight:650;margin:0 0 10px;line-height:1.45}
.shook{border:1px dashed var(--primary);border-radius:8px;padding:8px 10px;font-size:.88rem;margin:10px 0;line-height:1.45}
.ssteps{margin:0 0 6px;padding-left:1.5em}
.ssteps li{margin:7px 0;line-height:1.5}
.ssteps b,.scheck b{color:var(--warn);font-weight:700}

 any retail outlet."},{"id":"qc3bc0439ef","quiz":"concepts2","sys":"found","pts":1,"q":"Which oral formulation is absorbed FASTEST?","qh":"<p>Which oral formulation is absorbed FASTEST?</p>","qt":"Which oral formulation is absorbed FASTEST?","imgs":[],"type":"mcq","authored":1,"opts":["Enteric-coated tablets","Capsules","Elixirs and syrups","Powders"],"key":["Elixirs and syrups"],"src":"Pharmacology Concepts (2) 2026 slide 61 · Pharmacokinetics (1) 2026 slide 24","why":"The deck's rate-of-absorption table runs elixirs and syrups (fastest) → suspensions → powders → capsules → tablets → coated tablets (slowest). Liquids do not need to disintegrate first."},{"id":"q7c6c243ca0","quiz":"concepts2","sys":"found","pts":1,"q":"GTN spray for angina is given under the tongue so it enters the bloodstream directly and acts very quickly. This route is:","qh":"<p>GTN spray for angina is given under the tongue so it enters the bloodstream directly and acts very quickly. This route is:</p>","qt":"GTN spray for angina is given under the tongue so it enters the bloodstream directly and acts very quickly. This route is:","imgs":[],"type":"mcq","authored":1,"opts":["Buccal","Sublingual","Enteral","Intradermal"],"key":["Sublingual"],"src":"Pharmacology Concepts (2) 2026 slide 31","why":"Sublingual = under the tongue (GTN spray is the deck's own example). Buccal is through the mucosal lining of the cheek — the deck's example there is nicotine gum."},{"id":"qc95164bf4f","quiz":"concepts2","sys":"found","pts":1,"q":"A tuberculosis vaccination or an allergy antigen test is injected just under the epidermis. This route is:","qh":"<p>A tuberculosis vaccination or an allergy antigen test is injected just under the epidermis. This route is:</p>","qt":"A tuberculosis vaccination or an allergy antigen test is injected just under the epidermis. This route is:","imgs":[],"type":"mcq","authored":1,"opts":["Subcutaneous","Intramuscular","Intradermal","Intrathecal"],"key":["Intradermal"],"src":"Pharmacology Concepts (2) 2026 slide 42","why":"Intradermal is injected into the dermis, just under the epidermis; the deck names antigen (allergy) testing and TB vaccination as the examples."},{"id":"q77bcb1a59d","quiz":"concepts2","sys":"found","pts":1,"q":"Which parenteral route bypasses the blood–brain barrier by injecting directly into the spinal subarachnoid space?","qh":"<p>Which parenteral route bypasses the blood–brain barrier by injecting directly into the spinal subarachnoid space?</p>","qt":"Which parenteral route bypasses the blood–brain barrier by injecting directly into the spinal subarachnoid space?","imgs":[],"type":"mcq","authored":1,"opts":["Epidural","Intrathecal","Intra-articular","Intraosseous"],"key":["Intrathecal"],"src":"Pharmacology Concepts (2) 2026 slide 44","why":"Intrathecal is injection directly into the spinal subarachnoid space, bypassing the blood–brain barrier, e.g. spinal anaesthesia. Epidural is into the epidural space of the spinal canal."},{"id":"q47d893521e","quiz":"concepts2","sys":"found","pts":1,"q":"\"tds\" on a medication chart means:","qh":"<p>&quot;tds&quot; on a medication chart means:</p>","qt":"\"tds\" on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Twice a day","Three times a day","Every three hours","Immediately"],"key":["Three times a day"],"src":"Must Know: Medication & Prescription Abbreviations 01.26 (PDF)","why":"From the Must Know Abbreviations table: tds = three times a day. Twice a day is bd/bid; immediately is stat."},{"id":"q02d43f26a9","quiz":"concepts2","sys":"found","pts":1,"q":"Which is NOT one of the four reasons the lecture gives for using an enteric coating?","qh":"<p>Which is NOT one of the four reasons the lecture gives for using an enteric coating?</p>","qt":"Which is NOT one of the four reasons the lecture gives for using an enteric coating?","imgs":[],"type":"mcq","authored":1,"opts":["Prevents decomposition of sensitive drugs by gastric secretions","Prevents nausea and vomiting induced by the drug in the stomach","Provides delayed action of the drug","Increases the total dose absorbed above 100%"],"key":["Increases the total dose absorbed above 100%"],"src":"Pharmacology Concepts (2) 2026 slide 66","why":"The four reasons are: prevent decomposition by gastric secretions, prevent dilution of the drug, prevent drug-induced nausea and vomiting, and provide delayed action. A coating cannot raise bioavailability above the dose given."},{"id":"q078e7111e9","quiz":"concepts2","sys":"found","pts":1,"q":"Which source does the lecture explicitly warn against because it \"uses patterns rather than science\"?","qh":"<p>Which source does the lecture explicitly warn against because it &quot;uses patterns rather than science&quot;?</p>","qt":"Which source does the lecture explicitly warn against because it \"uses patterns rather than science\"?","imgs":[],"type":"mcq","authored":1,"opts":["The New Zealand Formulary","Manufacturer information inserts","Artificial intelligence","Hospital intranet policies"],"key":["Artificial intelligence"],"src":"Pharmacology Concepts (2) 2026 slides 22–23","why":"The \"sources to use with caution\" slide names AI directly with that wording, alongside .com websites, news releases and social media. Intranet policies, pharmacy, manufacturer inserts, current textbooks and dated journal articles are listed as APPROPRIATE sources."},{"id":"qda75d83584","quiz":"calcs","sys":"calc","pts":1,"q":"You are prescribed 1 g of paracetamol and have 500 mg capsules. Before using the formula you must:","qh":"<p>You are prescribed 1 g of paracetamol and have 500 mg capsules. Before using the formula you must:</p>","qt":"You are prescribed 1 g of paracetamol and have 500 mg capsules. Before using the formula you must:","imgs":[],"type":"mcq","authored":1,"opts":["Round the prescribed dose down","Convert 1 g to 1000 mg so the units match","Divide the volume by 1","Use the total bottle volume"],"key":["Convert 1 g to 1000 mg so the units match"],"src":"Medication Calculations 2026 slides 25–26 (worked example 3)","why":"The unit of medication must be the same on the top and bottom of the formula. 1 g × 1000 = 1000 mg; then 1000 ÷ 500 × 1 capsule = 2 capsules."},{"id":"q7d077fb91a","quiz":"calcs","sys":"calc","pts":1,"q":"The drop factor of a giving set is:","qh":"<p>The drop factor of a giving set is:</p>","qt":"The drop factor of a giving set is:","imgs":[],"type":"mcq","authored":1,"opts":["How fast the drops fall, calculated by the nurse","How big the drops are, fixed by the manufacturer","The total volume to be infused","The time the infusion will take"],"key":["How big the drops are, fixed by the manufacturer"],"src":"Medication Calculations 2026 slide 68","why":"Drop factor = drops/mL — the SIZE of the drops, a fixed number set by the type of giving set. The nurse never calculates it. The drip rate (drops/min) is the speed, and that IS calculated."},{"id":"q6b5b579b64","quiz":"calcs","sys":"calc","pts":1,"q":"An IV drip rate calculates to 27.77 drops/min. What rate do you set?","qh":"<p>An IV drip rate calculates to 27.77 drops/min. What rate do you set?</p>","qt":"An IV drip rate calculates to 27.77 drops/min. What rate do you set?","imgs":[],"type":"mcq","authored":1,"opts":["27 drops/min","28 drops/min","27.8 drops/min","30 drops/min"],"key":["28 drops/min"],"src":"Medication Calculations 2026 slides 69 & 72","why":"IV drip rates are rounded: .5 or higher rounds UP, so 27.77 → 28 drops/min. This is the deck's worked example 15 (Kohatu, Dextrose 5% 500 mL over 6 hours, drop factor 20)."},{"id":"q96367477e9","quiz":"calcs","sys":"calc","pts":1,"q":"Adrenaline for injection 1:1000 means:","qh":"<p>Adrenaline for injection 1:1000 means:</p>","qt":"Adrenaline for injection 1:1000 means:","imgs":[],"type":"mcq","authored":1,"opts":["1 g in 1 mL","1 mg in 1 mL","1 mcg in 1 mL","1 mg in 1000 mL"],"key":["1 mg in 1 mL"],"src":"Medication Calculations 2026 slides 57 & 63","why":"1:1000 literally means 1 g in 1000 mL; converting gives 1000 mg:1000 mL, which simplifies to 1 mg in 1 mL. The deck calls this \"the most important thing about ratios at this level\"."},{"id":"qc729528e10","quiz":"calcs","sys":"calc","pts":1,"q":"Which of these should you NOT round?","qh":"<p>Which of these should you NOT round?</p>","qt":"Which of these should you NOT round?","imgs":[],"type":"mcq","authored":1,"opts":["An IV drip rate of 83.33 drops/min","An IV drip rate of 66.66 drops/min","A calculated volume of 6.25 mL","An IV drip rate of 55.55 drops/min"],"key":["A calculated volume of 6.25 mL"],"src":"Medication Calculations 2026 slides 69 & 102","why":"Do not round medication volumes or tablet numbers — 6.25 mL is given as 6.25 mL. Drip rates ARE rounded, because you cannot count a fraction of a drop."},{"id":"qe1951f7996","quiz":"calcs","sys":"calc","pts":1,"q":"You dilute a 1 mL ampoule of morphine 5 mg/mL with 9 mL of sterile water. The concentration in the syringe is now:","qh":"<p>You dilute a 1 mL ampoule of morphine 5 mg/mL with 9 mL of sterile water. The concentration in the syringe is now:</p>","qt":"You dilute a 1 mL ampoule of morphine 5 mg/mL with 9 mL of sterile water. The concentration in the syringe is now:","imgs":[],"type":"mcq","authored":1,"opts":["5 mg/mL","5 mg/10 mL","1 mg/10 mL","50 mg/10 mL"],"key":["5 mg/10 mL"],"src":"Medication Calculations 2026 slides 95–96 (worked example 23)","why":"The amount of drug is unchanged — 5 mg went in. The volume is 1 mL + 9 mL = 10 mL. So the syringe holds 5 mg in 10 mL."},{"id":"q9c4fd1dd39","quiz":"calcs","sys":"calc","pts":1,"q":"How many resits are available for the Medication Calculations Test in Semester 2, and what score is required?","qh":"<p>How many resits are available for the Medication Calculations Test in Semester 2, and what score is required?</p>","qt":"How many resits are available for the Medication Calculations Test in Semester 2, and what score is required?","imgs":[],"type":"mcq","authored":1,"opts":["1 resit, 80% required","2 resits, 90% required","3 resits, 100% required","Unlimited resits, 100% required"],"key":["3 resits, 100% required"],"src":"Student Guide Medication Calculation Process 2026 (pp. 1 & 3)","why":"The Student Guide: Semester 2 allows up to 3 resits, and 100% competency is required. Fail after the third attempt and you fail the course."},{"id":"q07e56e7549","quiz":"calcs","sys":"calc","pts":1,"q":"Mele is prescribed pethidine 75 mg IM. Ampoules contain 100 mg in 2 mL. What volume do you draw up?","qh":"<p>Mele is prescribed pethidine 75 mg IM. Ampoules contain 100 mg in 2 mL. What volume do you draw up?</p>","qt":"Mele is prescribed pethidine 75 mg IM. Ampoules contain 100 mg in 2 mL. What volume do you draw up?","imgs":[],"type":"mcq","authored":1,"opts":["0.75 mL","1.5 mL","2.7 mL","3 mL"],"key":["1.5 mL"],"src":"Medication Calculations 2026 slide 33 (worked example 6)","why":"75 mg ÷ 100 mg × 2 mL = 1.5 mL. This is the deck's worked example 6."},{"id":"qe541d6f991","quiz":"pk1","sys":"pkpd","pts":1,"q":"Which route of administration does NOT require absorption?","qh":"<p>Which route of administration does NOT require absorption?</p>","qt":"Which route of administration does NOT require absorption?","imgs":[],"type":"mcq","authored":1,"opts":["Sublingual","Intramuscular","Intravenous","Rectal"],"key":["Intravenous"],"src":"Pharmacokinetics (1) 2026 slide 13","why":"IV medications enter the bloodstream directly and do not need to be absorbed from the site they are given. Every other route requires absorption."},{"id":"qf173f6479e","quiz":"pk1","sys":"pkpd","pts":1,"q":"A 100 mg oral tablet: 20 mg is not absorbed, 80 mg reaches the liver, and the liver breaks down 60 mg on the first pass. The bioavailability is:","qh":"<p>A 100 mg oral tablet: 20 mg is not absorbed, 80 mg reaches the liver, and the liver breaks down 60 mg on the first pass. The bioavailability is:</p>","qt":"A 100 mg oral tablet: 20 mg is not absorbed, 80 mg reaches the liver, and the liver breaks down 60 mg on the first pass. The bioavailability is:","imgs":[],"type":"mcq","authored":1,"opts":["80%","60%","20%","100%"],"key":["20%"],"src":"Pharmacokinetics (1) 2026 slide 36","why":"Only 20 mg gets into the bloodstream to have effect, out of the 100 mg dose — a bioavailability of 20%. This is the deck's own worked example."},{"id":"qe3a79920e5","quiz":"pk1","sys":"pkpd","pts":1,"q":"Only which fraction of a drug can leave the bloodstream and produce an effect?","qh":"<p>Only which fraction of a drug can leave the bloodstream and produce an effect?</p>","qt":"Only which fraction of a drug can leave the bloodstream and produce an effect?","imgs":[],"type":"mcq","authored":1,"opts":["The protein-bound fraction","The free (unbound) fraction","The metabolised fraction","The excreted fraction"],"key":["The free (unbound) fraction"],"src":"Pharmacokinetics (1) 2026 slide 37","why":"Only free (unbound) drug can move from the bloodstream into tissues to produce a pharmacological effect. Warfarin is about 99% protein-bound, so very little free drug is available."},{"id":"q6025b69709","quiz":"pk1","sys":"pkpd","pts":1,"q":"The placental barrier is best described as:","qh":"<p>The placental barrier is best described as:</p>","qt":"The placental barrier is best described as:","imgs":[],"type":"mcq","authored":1,"opts":["Highly selective — very few drugs cross","Non-selective — many drugs cross, and lipid-soluble drugs cross easily","Impermeable to all medications","Permeable only to water-soluble drugs"],"key":["Non-selective — many drugs cross, and lipid-soluble drugs cross easily"],"src":"Pharmacokinetics (1) 2026 slide 42","why":"The lecture describes the placenta as a non-selective barrier that allows many different drugs to cross, with lipid-soluble drugs crossing easily. The blood–brain barrier is the selective one."},{"id":"q85c6fbb0f7","quiz":"pk1","sys":"pkpd","pts":1,"q":"Where does most absorption of an oral medication occur?","qh":"<p>Where does most absorption of an oral medication occur?</p>","qt":"Where does most absorption of an oral medication occur?","imgs":[],"type":"mcq","authored":1,"opts":["The stomach","The small intestine","The oesophagus","The large intestine"],"key":["The small intestine"],"src":"Pharmacokinetics (1) 2026 slide 18","why":"The small intestine is the main site of absorption — it has a very large surface area and abundant blood vessels. Absorption in the stomach is low (thick mucus, tight junctions, small surface area)."},{"id":"qed79428293","quiz":"pk1","sys":"pkpd","pts":1,"q":"Movement of a drug across a membrane against its concentration gradient, using ATP, is:","qh":"<p>Movement of a drug across a membrane against its concentration gradient, using ATP, is:</p>","qt":"Movement of a drug across a membrane against its concentration gradient, using ATP, is:","imgs":[],"type":"mcq","authored":1,"opts":["Passive transport","Active transport","Dissolution","Filtration"],"key":["Active transport"],"src":"Pharmacokinetics (1) 2026 slide 15","why":"Active transport is movement against the concentration gradient using energy (ATP). Passive transport is movement along the gradient without energy."},{"id":"qf2d8681fbb","quiz":"pk1","sys":"pkpd","pts":1,"q":"Which tissue does the lecture pair with tetracycline, as a site where the drug becomes concentrated?","qh":"<p>Which tissue does the lecture pair with tetracycline, as a site where the drug becomes concentrated?</p>","qt":"Which tissue does the lecture pair with tetracycline, as a site where the drug becomes concentrated?","imgs":[],"type":"mcq","authored":1,"opts":["Adipose tissue","Thyroid gland","Bone tissue","Brain tissue"],"key":["Bone tissue"],"src":"Pharmacokinetics (1) 2026 slide 43","why":"Bone tissue — the deck notes tetracycline can discolour children's teeth. Adipose is paired with lipid-soluble drugs like diazepam, and the thyroid with iodine-containing medications."},{"id":"qde41d7fdd1","quiz":"pk2","sys":"pkpd","pts":1,"q":"Elimination is best defined as:","qh":"<p>Elimination is best defined as:</p>","qt":"Elimination is best defined as:","imgs":[],"type":"mcq","authored":1,"opts":["Excretion only","Metabolism only","Metabolism + excretion","Clearance × half-life"],"key":["Metabolism + excretion"],"src":"Pharmacokinetics (2) 2026 slide 29","why":"The deck states elimination = metabolism + excretion. A drug is eliminated when it is metabolised into an inactive metabolite, even before it is physically excreted in the urine."},{"id":"qb6049cc3f6","quiz":"pk2","sys":"pkpd","pts":1,"q":"A patient starts a medication that is a potent enzyme INDUCER alongside their regular drug. The likely consequence for the regular drug is:","qh":"<p>A patient starts a medication that is a potent enzyme INDUCER alongside their regular drug. The likely consequence for the regular drug is:</p>","qt":"A patient starts a medication that is a potent enzyme INDUCER alongside their regular drug. The likely consequence for the regular drug is:","imgs":[],"type":"mcq","authored":1,"opts":["Increased plasma levels and toxicity","Decreased plasma levels, possibly requiring a higher dose","No change","Increased protein binding"],"key":["Decreased plasma levels, possibly requiring a higher dose"],"src":"Pharmacokinetics (2) 2026 slide 15","why":"Enzyme inducers activate liver enzymes → accelerate metabolism → decrease the amount of drug reaching the bloodstream, so a higher dose may be needed. Inhibitors do the opposite and may increase toxicity."},{"id":"q626af3f896","quiz":"pk2","sys":"pkpd","pts":1,"q":"Roughly how many half-lives does it take for most drugs at a constant dosing interval to reach steady state?","qh":"<p>Roughly how many half-lives does it take for most drugs at a constant dosing interval to reach steady state?</p>","qt":"Roughly how many half-lives does it take for most drugs at a constant dosing interval to reach steady state?","imgs":[],"type":"mcq","authored":1,"opts":["1–2","3–5","8–10","More than 20"],"key":["3–5"],"src":"Pharmacokinetics (2) 2026 slide 38","why":"The deck: \"For most medications given at a constant dosing interval, it takes about 3-5 half-lives to reach steady state.\""},{"id":"q2af2fe7363","quiz":"pk2","sys":"pkpd","pts":1,"q":"Which of these routes does NOT avoid hepatic first-pass metabolism?","qh":"<p>Which of these routes does NOT avoid hepatic first-pass metabolism?</p>","qt":"Which of these routes does NOT avoid hepatic first-pass metabolism?","imgs":[],"type":"mcq","authored":1,"opts":["Sublingual","Transdermal","Oral","Rectal"],"key":["Oral"],"src":"Pharmacokinetics (2) 2026 slide 18","why":"The oral route is precisely the one that takes the first pass through the liver, because absorbed drug travels via the portal vein. Sublingual/buccal, IV, IM, SC, inhalation, intranasal, transdermal and rectal all avoid it."},{"id":"qa6ed2e3e9e","quiz":"pk2","sys":"pkpd","pts":1,"q":"Half-life is defined as the time taken for:","qh":"<p>Half-life is defined as the time taken for:</p>","qt":"Half-life is defined as the time taken for:","imgs":[],"type":"mcq","authored":1,"opts":["The whole drug to leave the body","The plasma drug concentration to fall by one-half","Steady state to be reached","Half the dose to be absorbed"],"key":["The plasma drug concentration to fall by one-half"],"src":"Pharmacokinetics (2) 2026 slide 32","why":"Half-life is the time for the plasma drug concentration to decrease by one-half. The Code of Conduct deck note makes the same point: it is not how long the whole drug stays in your system."},{"id":"qb1e78582af","quiz":"pk2","sys":"pkpd","pts":1,"q":"Which kind of drug is POORLY excreted by the kidneys because it is reabsorbed?","qh":"<p>Which kind of drug is POORLY excreted by the kidneys because it is reabsorbed?</p>","qt":"Which kind of drug is POORLY excreted by the kidneys because it is reabsorbed?","imgs":[],"type":"mcq","authored":1,"opts":["Water-soluble drugs","Lipid-soluble drugs","Drugs given intravenously","Drugs with a short half-life"],"key":["Lipid-soluble drugs"],"src":"Pharmacokinetics (2) 2026 slide 24","why":"Lipid-soluble drugs are poorly excreted because they are reabsorbed. The kidneys are the main organ for eliminating water-soluble substances. Protein-bound drugs are not excreted while bound and circulate longer."},{"id":"q69c0d4f3bf","quiz":"pk2","sys":"pkpd","pts":1,"q":"A higher-than-maintenance first dose, used to reach therapeutic plasma concentrations quickly, is a:","qh":"<p>A higher-than-maintenance first dose, used to reach therapeutic plasma concentrations quickly, is a:</p>","qt":"A higher-than-maintenance first dose, used to reach therapeutic plasma concentrations quickly, is a:","imgs":[],"type":"mcq","authored":1,"opts":["Loading dose","Trough dose","Stat dose","Divided dose"],"key":["Loading dose"],"src":"Pharmacodynamics 2026 slide 40","why":"A loading dose is particularly important for drugs with a long half-life, where regular dosing alone would take a prolonged period to reach an effective range."},{"id":"qa4a1894062","quiz":"pk2","sys":"pkpd","pts":1,"q":"Paracetamol's elimination half-life is given in the Medsafe data sheet as:","qh":"<p>Paracetamol's elimination half-life is given in the Medsafe data sheet as:</p>","qt":"Paracetamol's elimination half-life is given in the Medsafe data sheet as:","imgs":[],"type":"mcq","authored":1,"opts":["Under 30 minutes","1–3 hours","8–12 hours","24 hours"],"key":["1–3 hours"],"src":"Pharmacokinetics (2) 2026 slide 45","why":"The deck quotes the Medsafe Pacimol data sheet: the elimination half-life varies from 1–3 hours, and most of each dose is excreted in the urine within 24 hours."},{"id":"qd5a2c199bf","quiz":"pd","sys":"pkpd","pts":1,"q":"Selectivity refers to the number of ___ ; specificity refers to the number of ___ .","qh":"<p>Selectivity refers to the number of ___ ; specificity refers to the number of ___ .</p>","qt":"Selectivity refers to the number of ___ ; specificity refers to the number of ___ .","imgs":[],"type":"mcq","authored":1,"opts":["effects; targets","targets; effects","doses; responses","receptors; enzymes"],"key":["targets; effects"],"src":"Pharmacodynamics 2026 slide 13","why":"The deck has a slide dedicated to this pair: \"Specificity = number of effects. Selectivity = number of targets.\""},{"id":"q8f1563e9fb","quiz":"pd","sys":"pkpd","pts":1,"q":"A drug that has affinity for a receptor BUT NO efficacy is:","qh":"<p>A drug that has affinity for a receptor BUT NO efficacy is:</p>","qt":"A drug that has affinity for a receptor BUT NO efficacy is:","imgs":[],"type":"mcq","authored":1,"opts":["An agonist","An antagonist","A transporter","A non-specific drug"],"key":["An antagonist"],"src":"Pharmacodynamics 2026 slide 24","why":"The key fits the lock, but the door will not open. An agonist has affinity AND efficacy; an antagonist blocks access of the endogenous substance without eliciting a response."},{"id":"q16cf87145e","quiz":"pd","sys":"pkpd","pts":1,"q":"Amlodipine relaxes blood vessels by blocking the movement of calcium into muscle cells. Its drug target is:","qh":"<p>Amlodipine relaxes blood vessels by blocking the movement of calcium into muscle cells. Its drug target is:</p>","qt":"Amlodipine relaxes blood vessels by blocking the movement of calcium into muscle cells. Its drug target is:","imgs":[],"type":"mcq","authored":1,"opts":["A transporter","An ion channel","An enzyme","A receptor"],"key":["An ion channel"],"src":"Pharmacodynamics 2026 slide 20","why":"Ion channels are membrane pores that let ions move across an electrochemical gradient; amlodipine is the deck's own ion-channel example."},{"id":"q514429245e","quiz":"pd","sys":"pkpd","pts":1,"q":"Ibuprofen inhibits COX to block the pathway causing pain, fever and inflammation. Its drug target is:","qh":"<p>Ibuprofen inhibits COX to block the pathway causing pain, fever and inflammation. Its drug target is:</p>","qt":"Ibuprofen inhibits COX to block the pathway causing pain, fever and inflammation. Its drug target is:","imgs":[],"type":"mcq","authored":1,"opts":["A receptor","An ion channel","An enzyme","A transporter"],"key":["An enzyme"],"src":"Pharmacodynamics 2026 slide 21","why":"Enzymes are biological catalysts; most drugs acting on enzymes inhibit them, and ibuprofen inhibiting COX is the deck's enzyme example."},{"id":"q72757d0052","quiz":"pd","sys":"pkpd","pts":1,"q":"Rebound hypertension after suddenly stopping a long-term beta-blocker is explained by:","qh":"<p>Rebound hypertension after suddenly stopping a long-term beta-blocker is explained by:</p>","qt":"Rebound hypertension after suddenly stopping a long-term beta-blocker is explained by:","imgs":[],"type":"mcq","authored":1,"opts":["Receptor downregulation","Receptor upregulation","Enzyme induction","Reduced protein binding"],"key":["Receptor upregulation"],"src":"Pharmacodynamics 2026 slide 25","why":"Repeatedly blocking receptors causes upregulation — more receptors, greater sensitivity. Stopping the drug suddenly leaves the body over-responsive to endogenous signals."},{"id":"qe69d33b767","quiz":"pd","sys":"pkpd","pts":1,"q":"Chronic opioid use leads to needing more drug for the same effect. This tolerance is caused by:","qh":"<p>Chronic opioid use leads to needing more drug for the same effect. This tolerance is caused by:</p>","qt":"Chronic opioid use leads to needing more drug for the same effect. This tolerance is caused by:","imgs":[],"type":"mcq","authored":1,"opts":["Upregulation","Downregulation and desensitisation","Increased potency","Increased affinity"],"key":["Downregulation and desensitisation"],"src":"Pharmacodynamics 2026 slide 25","why":"Repeated stimulation of receptors causes downregulation — fewer receptors, less responsive — so patients respond less to the same dose over time."},{"id":"q9113ee5d0d","quiz":"pd","sys":"pkpd","pts":1,"q":"A drug that achieves the same effect at a LOWER dose than another is said to have higher:","qh":"<p>A drug that achieves the same effect at a LOWER dose than another is said to have higher:</p>","qt":"A drug that achieves the same effect at a LOWER dose than another is said to have higher:","imgs":[],"type":"mcq","authored":1,"opts":["Efficacy","Affinity","Potency","Selectivity"],"key":["Potency"],"src":"Pharmacodynamics 2026 slide 16","why":"Potency is the amount of drug required to produce a given effect. Efficacy is the size of the maximal response, which is a different question."},{"id":"q4e929ba677","quiz":"pd","sys":"pkpd","pts":1,"q":"A patient is given the wrong dose because of a transcription error and is injured. This is best described as:","qh":"<p>A patient is given the wrong dose because of a transcription error and is injured. This is best described as:</p>","qt":"A patient is given the wrong dose because of a transcription error and is injured. This is best described as:","imgs":[],"type":"mcq","authored":1,"opts":["An adverse effect","An adverse drug event","A contraindication","A drug interaction"],"key":["An adverse drug event"],"src":"Pharmacodynamics 2026 slide 44","why":"An adverse drug event is an injury related to the drug but not always due to the drug — including errors in prescribing, dispensing or administration. An adverse effect is caused by the medicine itself."},{"id":"q211c440886","quiz":"pd","sys":"pkpd","pts":1,"q":"Which pair of drugs does the lecture use to illustrate an ADDITIVE pharmacodynamic interaction?","qh":"<p>Which pair of drugs does the lecture use to illustrate an ADDITIVE pharmacodynamic interaction?</p>","qt":"Which pair of drugs does the lecture use to illustrate an ADDITIVE pharmacodynamic interaction?","imgs":[],"type":"mcq","authored":1,"opts":["Metoprolol and salbutamol","Warfarin and aspirin","Fluoxetine and amlodipine","Ibuprofen and paracetamol"],"key":["Warfarin and aspirin"],"src":"Pharmacodynamics 2026 slide 45","why":"Warfarin and aspirin → increased bleeding risk, as both inhibit clotting in different ways (additive). Metoprolol and salbutamol is the OPPOSING example — agonist versus antagonist at beta receptors."},{"id":"q13ac73b850","quiz":"admin","sys":"admin","pts":1,"q":"How many Rights plus checks of safe medication administration does this course teach?","qh":"<p>How many Rights plus checks of safe medication administration does this course teach?</p>","qt":"How many Rights plus checks of safe medication administration does this course teach?","imgs":[],"type":"mcq","authored":1,"opts":["5 rights","6 rights + 1 check","8 rights + 2 checks","10 rights"],"key":["8 rights + 2 checks"],"src":"Med Admin (1) 2026 slides 22–23 · Assignments.pdf (Canvas)","why":"The deck teaches 8 Rights (patient, medication, dose, time, route, right to refuse, indication, documentation) plus 2 Checks (expiry, allergies), and explicitly notes the textbooks' five \"do not cover all Rights you need to practice safely\". The essay brief uses the same wording."},{"id":"q241f9737f3","quiz":"admin","sys":"admin","pts":1,"q":"A regular medication is scheduled for 0800. Within what window should it be given?","qh":"<p>A regular medication is scheduled for 0800. Within what window should it be given?</p>","qt":"A regular medication is scheduled for 0800. Within what window should it be given?","imgs":[],"type":"mcq","authored":1,"opts":["Within 10 minutes","Within 30 minutes","Within 1 hour","Within 2 hours"],"key":["Within 30 minutes"],"src":"Med Admin (1) 2026 slide 32","why":"\"Regular medications should be given within 30 mins of scheduled time.\" prn medications instead require clinical judgement, e.g. a pain assessment."},{"id":"qc3e22403ab","quiz":"admin","sys":"admin","pts":1,"q":"A prescription states the medication, dose and frequency, but no route. The nurse should:","qh":"<p>A prescription states the medication, dose and frequency, but no route. The nurse should:</p>","qt":"A prescription states the medication, dose and frequency, but no route. The nurse should:","imgs":[],"type":"mcq","authored":1,"opts":["Give it by the most usual route for that drug","Ask another nurse which route to use","Withhold the medication and contact the prescriber","Give it orally and document the change"],"key":["Withhold the medication and contact the prescriber"],"src":"Med Admin (1) 2026 slides 13 & 36","why":"If no route is documented the nurse must withhold the medication and contact the prescriber for clarification. A nurse cannot modify a prescription."},{"id":"qb2d4a33079","quiz":"admin","sys":"admin","pts":1,"q":"A medication is repackaged by a pharmacist and shows only a dispensing date. It should be kept no longer than:","qh":"<p>A medication is repackaged by a pharmacist and shows only a dispensing date. It should be kept no longer than:</p>","qt":"A medication is repackaged by a pharmacist and shows only a dispensing date. It should be kept no longer than:","imgs":[],"type":"mcq","authored":1,"opts":["1 month","6 months","12 months","Until the manufacturer's original expiry"],"key":["12 months"],"src":"Med Admin (1) 2026 slide 42","why":"Repackaged medications may only carry a dispensing date, not an expiry date; the deck states these should be kept no longer than 12 months after the dispensing date."},{"id":"qb39f918b32","quiz":"admin","sys":"admin","pts":1,"q":"A patient competently refuses a prescribed medication. Which action is NOT correct?","qh":"<p>A patient competently refuses a prescribed medication. Which action is NOT correct?</p>","qt":"A patient competently refuses a prescribed medication. Which action is NOT correct?","imgs":[],"type":"mcq","authored":1,"opts":["Explain the consequences of not taking it","Document the reason for refusal","Return the medication to the container for later use","Inform the next shift RN and the prescriber"],"key":["Return the medication to the container for later use"],"src":"Med Admin (1) 2026 slide 39","why":"Refused medications must be DISCARDED, not stored. The other three actions are all required."},{"id":"qac3b65acb9","quiz":"admin","sys":"admin","pts":1,"q":"When must a medication be documented as given?","qh":"<p>When must a medication be documented as given?</p>","qt":"When must a medication be documented as given?","imgs":[],"type":"mcq","authored":1,"opts":["Before administering, so it is not forgotten","Immediately after administration","At the end of the medication round","At the end of the shift"],"key":["Immediately after administration"],"src":"Med Admin (1) 2026 slide 41","why":"Record immediately after administration — date, time, dose, who administered. \"Never document before you have actually administered it to the person.\""},{"id":"qe7bd1598f7","quiz":"admin","sys":"admin","pts":1,"q":"Which professional group can prescribe ONLY with an additional qualification, and otherwise operates under standing orders?","qh":"<p>Which professional group can prescribe ONLY with an additional qualification, and otherwise operates under standing orders?</p>","qt":"Which professional group can prescribe ONLY with an additional qualification, and otherwise operates under standing orders?","imgs":[],"type":"mcq","authored":1,"opts":["Registered midwives","Optometrists","Pharmacists","Dentists"],"key":["Pharmacists"],"src":"Med Admin (1) 2026 slides 4 & 12","why":"Pharmacists cannot prescribe unless they hold the extra qualification as a Pharmacist Prescriber; they otherwise operate under standing orders. Midwives, optometrists and dentists are all authorised prescribers."},{"id":"q571103cd7b","quiz":"admin","sys":"admin","pts":1,"q":"A tablet may be cut in half:","qh":"<p>A tablet may be cut in half:</p>","qt":"A tablet may be cut in half:","imgs":[],"type":"mcq","authored":1,"opts":["Any time a half dose is prescribed","Only with a tablet cutter, and only if it has a score mark","Only by a pharmacist","Never"],"key":["Only with a tablet cutter, and only if it has a score mark"],"src":"Med Admin (1) 2026 slide 30","why":"The deck: \"Cut tablets in half with a tablet cutter (only if has a score mark).\" Separately, check with a pharmacist before crushing any tablet."},{"id":"q7ab3727ab5","quiz":"admin","sys":"admin","pts":1,"q":"\"NKDA\" documented in the medication chart means:","qh":"<p>&quot;NKDA&quot; documented in the medication chart means:</p>","qt":"\"NKDA\" documented in the medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["No known drug allergies","No known dose adjustment","Not known, do not administer","Nurse-checked, doctor advised"],"key":["No known drug allergies"],"src":"Med Admin (1) 2026 slide 43 · Must Know Abbreviations 01.26","why":"NKDA = no known drug allergies; NKA = no known allergies. Both are from the Must Know Abbreviations table, and both must still be confirmed by asking the patient."},{"id":"q014c56db18","quiz":"educ","sys":"admin","pts":1,"q":"A medication error is best defined as:","qh":"<p>A medication error is best defined as:</p>","qt":"A medication error is best defined as:","imgs":[],"type":"mcq","authored":1,"opts":["Any harmful effect caused by a medicine","Any preventable event that may cause or lead to inappropriate medication use or patient harm","Any unexpected drug interaction","Any dose given outside the therapeutic range"],"key":["Any preventable event that may cause or lead to inappropriate medication use or patient harm"],"src":"Med Admin (2) 2026 slide 4","why":"This is the NCC MERP definition the deck quotes. An adverse effect is harm caused by the medicine itself; a medication error is a preventable event, often from human action."},{"id":"qbd15808fb0","quiz":"educ","sys":"admin","pts":1,"q":"What is the FIRST step after realising you have made a medication error?","qh":"<p>What is the FIRST step after realising you have made a medication error?</p>","qt":"What is the FIRST step after realising you have made a medication error?","imgs":[],"type":"mcq","authored":1,"opts":["Complete an incident report","Acknowledge the error immediately","Document it in the patient notes","Tell the patient's family"],"key":["Acknowledge the error immediately"],"src":"Med Admin (2) 2026 slide 7","why":"The sequence is: acknowledge immediately → report promptly to the appropriate person → document accurately and objectively → implement measures to minimise harm → complete an incident report."},{"id":"q41d47fbec8","quiz":"educ","sys":"admin","pts":1,"q":"Which question best fits Step 3 (Check) of the health literacy model?","qh":"<p>Which question best fits Step 3 (Check) of the health literacy model?</p>","qt":"Which question best fits Step 3 (Check) of the health literacy model?","imgs":[],"type":"mcq","authored":1,"opts":["\"Do you understand?\"","\"Any questions?\"","\"Can you tell me what you have to do, so I can check I explained it properly?\"","\"You'll be fine with this, won't you?\""],"key":["\"Can you tell me what you have to do, so I can check I explained it properly?\""],"src":"Med Admin (2) 2026 slides 25–28","why":"That is teach-back, and it is phrased so responsibility sits with the nurse. The deck explicitly says to avoid closed questions like \"Do you understand?\" and not to rely on nodding."},{"id":"qe6edc5f380","quiz":"educ","sys":"admin","pts":1,"q":"Which set of Te Tiriti principles does the Nursing Council use, per this course?","qh":"<p>Which set of Te Tiriti principles does the Nursing Council use, per this course?</p>","qt":"Which set of Te Tiriti principles does the Nursing Council use, per this course?","imgs":[],"type":"mcq","authored":1,"opts":["Partnership, Participation, Protection","Tino Rangatiratanga, Mana Taurite, Whakamarumarutia, Kōwhiringa, Pātuitanga","Autonomy, Beneficence, Non-maleficence, Justice","Ask, Build, Check"],"key":["Tino Rangatiratanga, Mana Taurite, Whakamarumarutia, Kōwhiringa, Pātuitanga"],"src":"Med Admin (2) 2026 slide 33","why":"The deck lists the five NCNZ (2025) principles and notes in its own speaker notes that the \"three Ps\" of 1986 are OUTDATED."},{"id":"qbe77524877","quiz":"educ","sys":"admin","pts":1,"q":"Mana Taurite is best described as:","qh":"<p>Mana Taurite is best described as:</p>","qt":"Mana Taurite is best described as:","imgs":[],"type":"mcq","authored":1,"opts":["Self-determination","Equity","Active protection","Partnership"],"key":["Equity"],"src":"Med Admin (2) 2026 slides 33 & 36","why":"Mana Taurite = Equity — removing barriers and adapting communication so understanding is equitable. Equity is unequal distribution for equal outcome."},{"id":"qdeba33a960","quiz":"educ","sys":"admin","pts":1,"q":"Which is NOT advice the deck gives about giving medicines to children?","qh":"<p>Which is NOT advice the deck gives about giving medicines to children?</p>","qt":"Which is NOT advice the deck gives about giving medicines to children?","imgs":[],"type":"mcq","authored":1,"opts":["Store medicines out of reach and out of sight","Use a proper measuring cup, spoon or syringe","Tell the child the medicine is lollies so they take it","Check with your pharmacist before crushing or cutting tablets"],"key":["Tell the child the medicine is lollies so they take it"],"src":"Med Admin (2) 2026 slides 42 & 44","why":"Never tell a child their medicine is lollies — the deck flags it as an overdose risk, and Case Study 1 turns on exactly this point."},{"id":"q5e156c0b24","quiz":"educ","sys":"admin","pts":1,"q":"A patient taking the combined oral contraceptive pill reports also taking St John's Wort. The documented risk is:","qh":"<p>A patient taking the combined oral contraceptive pill reports also taking St John's Wort. The documented risk is:</p>","qt":"A patient taking the combined oral contraceptive pill reports also taking St John's Wort. The documented risk is:","imgs":[],"type":"mcq","authored":1,"opts":["Increased clotting risk","Breakthrough bleeding and contraception failure","Reduced absorption of iron","Serotonin syndrome only"],"key":["Breakthrough bleeding and contraception failure"],"src":"Med Admin (2) 2026 slide 49 (speaker notes)","why":"The deck's Case Study 2 speaker note, citing the NZ Formulary interactions checker: \"Risks include breakthrough bleeding and contraception failure\" — St John's Wort is an enzyme inducer."},{"id":"q00ed362165","quiz":"elderly","sys":"life","pts":1,"q":"People over 65 are about 12% of the NZ population. What share of prescribed medications do they consume?","qh":"<p>People over 65 are about 12% of the NZ population. What share of prescribed medications do they consume?</p>","qt":"People over 65 are about 12% of the NZ population. What share of prescribed medications do they consume?","imgs":[],"type":"mcq","authored":1,"opts":["12%","20%","31%","50%"],"key":["31%"],"src":"Elderly & Polypharmacy 2026 slide 8","why":"The deck: people over 65 constitute about 12% of the population but consume 31% of prescribed medications."},{"id":"qc3041951c8","quiz":"elderly","sys":"life","pts":1,"q":"In an older adult, reduced total body water means a water-soluble drug will have a:","qh":"<p>In an older adult, reduced total body water means a water-soluble drug will have a:</p>","qt":"In an older adult, reduced total body water means a water-soluble drug will have a:","imgs":[],"type":"mcq","authored":1,"opts":["Longer, weaker effect","Shorter, stronger effect","Longer, stronger effect","Unchanged effect"],"key":["Shorter, stronger effect"],"src":"Elderly & Polypharmacy 2026 slide 14","why":"Less body water means the same dose sits at a higher concentration — \"like a stronger cordial\" in the deck's own note — giving a shorter, stronger effect. Increased body FAT is what gives fat-soluble drugs a longer effect."},{"id":"q248e4857a3","quiz":"elderly","sys":"life","pts":1,"q":"Which age-related pharmacokinetic change is described in the lecture as \"often not clinically significant\"?","qh":"<p>Which age-related pharmacokinetic change is described in the lecture as &quot;often not clinically significant&quot;?</p>","qt":"Which age-related pharmacokinetic change is described in the lecture as \"often not clinically significant\"?","imgs":[],"type":"mcq","authored":1,"opts":["Reduced renal excretion","Slowed absorption","Reduced protein binding","Slowed hepatic metabolism"],"key":["Slowed absorption"],"src":"Elderly & Polypharmacy 2026 slide 13","why":"Slowed gastric emptying, reduced motility and decreased intestinal surface area delay absorption, \"but often not clinically significant\". Reduced excretion and metabolism are what actually drive accumulation and toxicity."},{"id":"qdcaed355cc","quiz":"elderly","sys":"life","pts":1,"q":"Polypharmacy is usually defined as the concurrent use of:","qh":"<p>Polypharmacy is usually defined as the concurrent use of:</p>","qt":"Polypharmacy is usually defined as the concurrent use of:","imgs":[],"type":"mcq","authored":1,"opts":["2 or more medications","3 or more medications","5 or more medications","10 or more medications"],"key":["5 or more medications"],"src":"Elderly & Polypharmacy 2026 slides 34 & 38","why":"Polypharmacy is the concurrent use of multiple medications, usually 5 or more. Ten or more is hyperpolypharmacy."},{"id":"q66e99732e5","quiz":"elderly","sys":"life","pts":1,"q":"Under the Beers Criteria, chronic use of NSAIDs such as ibuprofen in older adults should be:","qh":"<p>Under the Beers Criteria, chronic use of NSAIDs such as ibuprofen in older adults should be:</p>","qt":"Under the Beers Criteria, chronic use of NSAIDs such as ibuprofen in older adults should be:","imgs":[],"type":"mcq","authored":1,"opts":["Encouraged as first-line analgesia","Avoided","Doubled in dose","Given only intravenously"],"key":["Avoided"],"src":"Elderly & Polypharmacy 2026 slide 18","why":"The Beers table in the deck: NSAIDs — \"avoid chronic use\", because of gastritis, gastrointestinal bleeding and ulceration."},{"id":"q81f0c1c56a","quiz":"elderly","sys":"life","pts":1,"q":"Which is an error of OMISSION rather than commission?","qh":"<p>Which is an error of OMISSION rather than commission?</p>","qt":"Which is an error of OMISSION rather than commission?","imgs":[],"type":"mcq","authored":1,"opts":["Taking the wrong dose","Storing medication incorrectly","Forgetting to take medication","Taking expired medication"],"key":["Forgetting to take medication"],"src":"Elderly & Polypharmacy 2026 slide 29","why":"Errors of omission are errors of not doing — forgetting to take medication, taking too low a dose, forgetting instructions, or taking a dose at the wrong time. The other three are errors of commission."},{"id":"qf0750ad3a0","quiz":"elderly","sys":"life","pts":1,"q":"A medication may be crushed:","qh":"<p>A medication may be crushed:</p>","qt":"A medication may be crushed:","imgs":[],"type":"mcq","authored":1,"opts":["Whenever the patient has difficulty swallowing","Only if a pharmacist advises it does not compromise the medication AND it is in the patient's best interest","Only if it is enteric coated","Only by the prescriber"],"key":["Only if a pharmacist advises it does not compromise the medication AND it is in the patient's best interest"],"src":"Elderly & Polypharmacy 2026 slide 22","why":"Both conditions must hold. Crushing can make a medication less effective, ineffective or dangerous — an enteric-coated tablet that is crushed becomes rapidly absorbed."},{"id":"qb89a816b3c","quiz":"elderly","sys":"life","pts":1,"q":"The term that has replaced \"compliance\" in describing whether a patient takes their medication as intended is:","qh":"<p>The term that has replaced &quot;compliance&quot; in describing whether a patient takes their medication as intended is:</p>","qt":"The term that has replaced \"compliance\" in describing whether a patient takes their medication as intended is:","imgs":[],"type":"mcq","authored":1,"opts":["Concordance","Adherence","Conformity","Persistence"],"key":["Adherence"],"src":"Elderly & Polypharmacy 2026 slide 26","why":"The deck notes directly that adherence has replaced the older term \"compliance\"."},{"id":"q5aff000b0b","quiz":"lifespan","sys":"life","pts":1,"q":"The highest-risk period for teratogenic effects is:","qh":"<p>The highest-risk period for teratogenic effects is:</p>","qt":"The highest-risk period for teratogenic effects is:","imgs":[],"type":"mcq","authored":1,"opts":["The first trimester (weeks 0–12)","The second trimester","The third trimester","Labour and delivery"],"key":["The first trimester (weeks 0–12)"],"src":"Lifespan 2026 slides 8 & 10","why":"The deck: \"Highest risk is during first trimester (week 0 – 12).\" Cocaine is the one example in the table whose critical period is the 2nd–3rd trimester."},{"id":"qa872705a35","quiz":"lifespan","sys":"life","pts":1,"q":"Which is a Pregnancy Category A medication in the lecture's example?","qh":"<p>Which is a Pregnancy Category A medication in the lecture's example?</p>","qt":"Which is a Pregnancy Category A medication in the lecture's example?","imgs":[],"type":"mcq","authored":1,"opts":["Isotretinoin","Paracetamol","Tetracycline","Cocaine"],"key":["Paracetamol"],"src":"Lifespan 2026 slide 15","why":"Category A drugs have been taken by a large number of pregnant people without any proven increase in malformations or other harmful effects — paracetamol is the deck's example. Category X is the contraindicated end of the scale."},{"id":"q530e2ceb5a","quiz":"lifespan","sys":"life","pts":1,"q":"Renal excretion in pregnancy:","qh":"<p>Renal excretion in pregnancy:</p>","qt":"Renal excretion in pregnancy:","imgs":[],"type":"mcq","authored":1,"opts":["Decreases, so lower doses are needed","Increases, so higher or more frequent doses may be required","Is unchanged","Stops entirely for renally cleared drugs"],"key":["Increases, so higher or more frequent doses may be required"],"src":"Lifespan 2026 slide 14","why":"Increased renal blood flow increases elimination of renally cleared drugs, which may require higher or more frequent doses."},{"id":"q84c78a1654","quiz":"lifespan","sys":"life","pts":1,"q":"A neonate has an immature blood–brain barrier. The main consequence is:","qh":"<p>A neonate has an immature blood–brain barrier. The main consequence is:</p>","qt":"A neonate has an immature blood–brain barrier. The main consequence is:","imgs":[],"type":"mcq","authored":1,"opts":["Reduced drug absorption","Higher CNS toxicity risk","Faster renal clearance","Lower body water"],"key":["Higher CNS toxicity risk"],"src":"Lifespan 2026 slide 27","why":"The deck lists immature BBB → higher CNS toxicity risk, alongside immature enzymes (reduced metabolism) and immature kidneys (slower clearance, prolonged half-life)."},{"id":"qd2618aed4e","quiz":"lifespan","sys":"life","pts":1,"q":"Hepatic metabolism in children is:","qh":"<p>Hepatic metabolism in children is:</p>","qt":"Hepatic metabolism in children is:","imgs":[],"type":"mcq","authored":1,"opts":["Slower than adults until about 10 years","Faster than adults until about 10 years, so higher mg/kg doses may be needed","The same as adults from birth","Absent until 12 months"],"key":["Faster than adults until about 10 years, so higher mg/kg doses may be needed"],"src":"Lifespan 2026 slide 28","why":"Hepatic metabolism is faster until about 10 years, which may require higher mg/kg doses. It is the NEONATE whose enzymes are immature and metabolism reduced."},{"id":"q1f2617c7fb","quiz":"lifespan","sys":"life","pts":1,"q":"Which drugs concentrate most in breastmilk?","qh":"<p>Which drugs concentrate most in breastmilk?</p>","qt":"Which drugs concentrate most in breastmilk?","imgs":[],"type":"mcq","authored":1,"opts":["Water-soluble drugs that do not affect the nervous system","Lipid-soluble drugs that affect the nervous system, e.g. morphine or codeine","Drugs that are highly protein bound","Drugs given intravenously"],"key":["Lipid-soluble drugs that affect the nervous system, e.g. morphine or codeine"],"src":"Lifespan 2026 slide 19","why":"The deck: drugs that affect the nervous system and are lipid-soluble concentrate more in breastmilk, and can cause infant sedation and a reduced suckling reflex with poor feeding."},{"id":"qdefccb245f","quiz":"lifespan","sys":"life","pts":1,"q":"Tetracycline antibiotics taken after 20 weeks of pregnancy are associated with:","qh":"<p>Tetracycline antibiotics taken after 20 weeks of pregnancy are associated with:</p>","qt":"Tetracycline antibiotics taken after 20 weeks of pregnancy are associated with:","imgs":[],"type":"mcq","authored":1,"opts":["Hydrocephalus and CNS abnormalities","Premature labour and intracranial bleeding","Stained teeth and bone growth defects","Fetal alcohol syndrome"],"key":["Stained teeth and bone growth defects"],"src":"Lifespan 2026 slide 10","why":"From the teratogen table: tetracycline antibiotics, >20 weeks, stained teeth and bone growth defects. Hydrocephalus/CNS is isotretinoin; premature labour/intracranial bleeding is cocaine."},{"id":"q053478253c","quiz":"lifespan","sys":"life","pts":1,"q":"A neonate is defined as:","qh":"<p>A neonate is defined as:</p>","qt":"A neonate is defined as:","imgs":[],"type":"mcq","authored":1,"opts":["Less than 4 weeks old","5 weeks to 1 year","Born before 36 weeks gestation","1 to 12 years"],"key":["Less than 4 weeks old"],"src":"Lifespan 2026 slide 26","why":"Neonate/newborn = less than 4 weeks old. 5 weeks to 1 year is an infant; before 36 weeks gestation is preterm; 1–12 years is a child."},{"id":"qe18eb44dc8","quiz":"legal","sys":"law","pts":1,"q":"Morphine is which class of controlled drug under the Misuse of Drugs Act 1975?","qh":"<p>Morphine is which class of controlled drug under the Misuse of Drugs Act 1975?</p>","qt":"Morphine is which class of controlled drug under the Misuse of Drugs Act 1975?","imgs":[],"type":"mcq","authored":1,"opts":["Class A","Class B","Class C","Uncontrolled"],"key":["Class B"],"src":"Legal & Ethical 2026 slide 14","why":"Class B includes drugs of dependence, carries a high risk of harm, has restrictions on prescribing and dispensing, and must be kept in a double-locked safe — morphine and methylphenidate are the deck's examples."},{"id":"q68eb215418","quiz":"legal","sys":"law","pts":1,"q":"Which Act requires Registered Nurses to hold an Annual Practising Certificate?","qh":"<p>Which Act requires Registered Nurses to hold an Annual Practising Certificate?</p>","qt":"Which Act requires Registered Nurses to hold an Annual Practising Certificate?","imgs":[],"type":"mcq","authored":1,"opts":["The Medicines Act 1981","The Misuse of Drugs Act 1975","The Health Practitioners Competence Assurance Act 2003","The Medicines Regulations 1984"],"key":["The Health Practitioners Competence Assurance Act 2003"],"src":"Legal & Ethical 2026 slides 30–31","why":"The HPCAA 2003 requires a scope of practice set by the Nursing Council, annual practising certificates, clinical and cultural competence, and provides legal accountability."},{"id":"q14475c5b07","quiz":"legal","sys":"law","pts":1,"q":"Cultural safety is determined by:","qh":"<p>Cultural safety is determined by:</p>","qt":"Cultural safety is determined by:","imgs":[],"type":"mcq","authored":1,"opts":["The nurse providing the care","The person or family receiving the care","The Nursing Council","The employing organisation"],"key":["The person or family receiving the care"],"src":"Legal & Ethical 2026 slide 41","why":"The NCNZ definition: \"the effective nursing practice of a person or family from another culture, and is determined by that person or family.\""},{"id":"qebd9348370","quiz":"legal","sys":"law","pts":1,"q":"Which is NOT one of the six pou of the NCNZ Standards of Competence?","qh":"<p>Which is NOT one of the six pou of the NCNZ Standards of Competence?</p>","qt":"Which is NOT one of the six pou of the NCNZ Standards of Competence?","imgs":[],"type":"mcq","authored":1,"opts":["Māori Health","Cultural Safety","Kaitiakitanga and Sustainability","Rangatiratanga and Leadership"],"key":["Kaitiakitanga and Sustainability"],"src":"Legal & Ethical 2026 slides 38 & 64","why":"The six pou are Māori Health; Cultural Safety; Whanaungatanga and Communication; Pūkengatanga and Evidence-Informed Nursing Practice; Manaakitanga and People-Centred Care; Rangatiratanga and Leadership. Kaitiakitanga is an NZNO Code of Ethics value, not a pou."},{"id":"qfc66e5f633","quiz":"legal","sys":"law","pts":1,"q":"A nurse withholds a patient's prognosis because the patient has explicitly asked not to be told. This is an exception to:","qh":"<p>A nurse withholds a patient's prognosis because the patient has explicitly asked not to be told. This is an exception to:</p>","qt":"A nurse withholds a patient's prognosis because the patient has explicitly asked not to be told. This is an exception to:","imgs":[],"type":"mcq","authored":1,"opts":["Confidentiality","Veracity","Beneficence","Fidelity"],"key":["Veracity"],"src":"Legal & Ethical 2026 slide 78","why":"Veracity is the duty to tell the truth; the three exceptions are therapeutic privilege, patient preference, and emergencies."},{"id":"qe867f102e0","quiz":"legal","sys":"law","pts":1,"q":"\"Treating people fairly and equitably (not equally)\" is the definition of which Western value?","qh":"<p>&quot;Treating people fairly and equitably (not equally)&quot; is the definition of which Western value?</p>","qt":"\"Treating people fairly and equitably (not equally)\" is the definition of which Western value?","imgs":[],"type":"mcq","authored":1,"opts":["Autonomy","Beneficence","Justice","Fidelity"],"key":["Justice"],"src":"Legal & Ethical 2026 slide 76","why":"Justice — be fair; treat people fairly and equitably, ensure fair access to care and unbiased decision-making. The deck explicitly contrasts equitably with equally."},{"id":"qc52addb39f","quiz":"legal","sys":"law","pts":1,"q":"Which document is a GUIDELINE rather than an enforceable standard?","qh":"<p>Which document is a GUIDELINE rather than an enforceable standard?</p>","qt":"Which document is a GUIDELINE rather than an enforceable standard?","imgs":[],"type":"mcq","authored":1,"opts":["The HPCAA 2003","NCNZ Standards of Competence","NCNZ Code of Conduct","NZNO Code of Ethics"],"key":["NZNO Code of Ethics"],"src":"Legal & Ethical 2026 slide 90","why":"From the summary table: the NZNO Code of Ethics \"is a guideline, but expected to be used by all RNs\". The other three are enforceable — by law, by APC requirement, and by NCNZ discipline respectively."},{"id":"q68665e5c64","quiz":"legal","sys":"law","pts":1,"q":"Checking whether gelatin capsules conflict with a patient's beliefs is an example of which Code of Conduct principle?","qh":"<p>Checking whether gelatin capsules conflict with a patient's beliefs is an example of which Code of Conduct principle?</p>","qt":"Checking whether gelatin capsules conflict with a patient's beliefs is an example of which Code of Conduct principle?","imgs":[],"type":"mcq","authored":1,"opts":["Principle 1 — dignity and individuality","Principle 2 — cultural needs and values","Principle 5 — privacy and confidentiality","Principle 8 — public trust"],"key":["Principle 2 — cultural needs and values"],"src":"Legal & Ethical 2026 slide 56","why":"Principle 2 is to respect the cultural needs and values of health consumers, and gelatin capsules are the deck's own example."},{"id":"qa223e395c6","quiz":"legal","sys":"law","pts":1,"q":"In the 2013 case, what did the Nursing Council identify in addition to giving the wrong medication?","qh":"<p>In the 2013 case, what did the Nursing Council identify in addition to giving the wrong medication?</p>","qt":"In the 2013 case, what did the Nursing Council identify in addition to giving the wrong medication?","imgs":[],"type":"mcq","authored":1,"opts":["She was not wearing an ID badge","She took two days to report the error","She was working a double shift","She had no APC"],"key":["She took two days to report the error"],"src":"Legal & Ethical 2026 slides 26–27","why":"Nurse D did not check the medication was appropriate nor check pulse or blood pressure, realised 20 minutes later, and took two days to report the error. She was found guilty of professional misconduct, suspended and fined $12,000."},{"id":"q26d9ef4b49","quiz":"devmkt","sys":"law","pts":1,"q":"Roughly how many of 5000 compounds progress to human testing?","qh":"<p>Roughly how many of 5000 compounds progress to human testing?</p>","qt":"Roughly how many of 5000 compounds progress to human testing?","imgs":[],"type":"mcq","authored":1,"opts":["500","50","5","1500"],"key":["5"],"src":"Drug Development & Marketing slide 4","why":"\"According to USA statistics only 5 in 5000 compounds progress to human testing.\" Development also costs millions and takes 10–20 years."},{"id":"q810a3d9653","quiz":"devmkt","sys":"law","pts":1,"q":"Which clinical trial phase focuses on SAFETY AND DOSAGE with 20–100 participants?","qh":"<p>Which clinical trial phase focuses on SAFETY AND DOSAGE with 20–100 participants?</p>","qt":"Which clinical trial phase focuses on SAFETY AND DOSAGE with 20–100 participants?","imgs":[],"type":"mcq","authored":1,"opts":["Phase 1","Phase 2","Phase 3","Phase 4"],"key":["Phase 1"],"src":"Drug Development & Marketing slide 10","why":"Phase 1: safety and dosage, 20–100 participants (healthy or with the condition), several months, ~70% progress. Phase 2 is efficacy and side effects in several hundred participants."},{"id":"q569ac82450","quiz":"devmkt","sys":"law","pts":1,"q":"Which body assesses the science, safety and appropriateness of a proposed trial DESIGN in NZ?","qh":"<p>Which body assesses the science, safety and appropriateness of a proposed trial DESIGN in NZ?</p>","qt":"Which body assesses the science, safety and appropriateness of a proposed trial DESIGN in NZ?","imgs":[],"type":"mcq","authored":1,"opts":["Medsafe","SCOTT","HDEC","PHARMAC"],"key":["SCOTT"],"src":"Drug Development & Marketing slide 9","why":"SCOTT — the Standing Committee on Therapeutic Trials. Medsafe reviews preclinical studies, PK/PD, chemical stability and quality; HDE
