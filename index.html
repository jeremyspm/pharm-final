":"found","pts":1,"q":"The term “OD” on a medication chart means:","qh":"<p>The term “OD” on a medication chart means:</p>","qt":"The term “OD” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Twice a day","Every 4 hours","Once a day","Three times a day"],"key":["Once a day"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin omni die, “every day”. It is on the course list, so you must be able to read it — but many charting standards now say write “daily” instead.","nm":1},{"id":"q4d0e9f8c01","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “BD” on a medication chart means:","qh":"<p>The term “BD” on a medication chart means:</p>","qt":"The term “BD” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Twice a day","Three times a day","Once a day","Four times a day"],"key":["Twice a day"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin bis die / bis in die. The NZ chart’s recommended times: 0800 and 2000. Not quite the same as q12h, which runs strictly by the clock.","nm":1},{"id":"q8c483b581a","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “QID” on a medication chart means:","qh":"<p>The term “QID” on a medication chart means:</p>","qt":"The term “QID” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Every 4 hours","Three times a day","Every 6 hours","Four times a day"],"key":["Four times a day"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin quater in die. The NZ chart’s recommended times: 0600, 1200, 1800 and 2200 — nearly 6-hourly, but it ends at 2200 so the night is left alone. q6h runs by the clock: 0600, 1200, 1800 and 2400.","nm":1},{"id":"q1cfb5f6d9e","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “q4h” on a medication chart means:","qh":"<p>The term “q4h” on a medication chart means:</p>","qt":"The term “q4h” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Four times a day","Every 4 hours","Every 6 hours","Every 2 hours"],"key":["Every 4 hours"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"q is Latin quaque, “every”; qqh is quaque quarta hora, “every fourth hour” — both on the course list. Around the clock, so up to 6 doses in 24 hours: on a PRN order, check the 24-hour maximum before every dose.","nm":1},{"id":"q058d4e1e05","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “q6h” on a medication chart means:","qh":"<p>The term “q6h” on a medication chart means:</p>","qt":"The term “q6h” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Four times a day","Every 6 hours","Every 4 hours","Every 8 hours"],"key":["Every 6 hours"],"src":"Joan’s 20 Oct revision session [1:19:01] (“QID, TDS, Q6H, BD”)","why":"By the clock, day and night — the NZ chart recommends 0600, 1200, 1800 and 2400 for 6-hourly antibiotics. QID is also four doses, but ends at 2200.","nm":1},{"id":"qa1fe85628a","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “PRN” on a medication chart means:","qh":"<p>The term “PRN” on a medication chart means:</p>","qt":"The term “PRN” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Immediately","Once a day","Twice a day","When required"],"key":["When required"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin pro re nata, “as the occasion arises” (the course list: “if necessary”). A PRN order must say what it is for and the most you may give in 24 hours. You assess before you give it and evaluate after — and Joan called PRN an ethical problem, because “as necessary” rests on the nurse’s judgement.","nm":1},{"id":"qb09595b159","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “stat” on a medication chart means:","qh":"<p>The term “stat” on a medication chart means:</p>","qt":"The term “stat” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Immediately","When required","Once a day","Twice a day"],"key":["Immediately"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin statim, “at once” (the course list: “immediately”). A one-off dose, written in the once-only section of the chart and given straight away.","nm":1},{"id":"q0c1ba4ecc6","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “mane” on a medication chart means:","qh":"<p>The term “mane” on a medication chart means:</p>","qt":"The term “mane” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["At night","At midday","In the morning","Before meals"],"key":["In the morning"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin for “in the morning”. The NZ chart’s recommended time: 0800.","nm":1},{"id":"qce4d45fe17","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “nocte” on a medication chart means:","qh":"<p>The term “nocte” on a medication chart means:</p>","qt":"The term “nocte” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["In the morning","At midday","After meals","At night"],"key":["At night"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin for “at night”. The NZ chart recommends 1800 or 2000; your ward sets which.","nm":1},{"id":"q637f7a0d09","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “ac” on a medication chart means:","qh":"<p>The term “ac” on a medication chart means:</p>","qt":"The term “ac” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["After meals","In the morning","Before meals","At night"],"key":["Before meals"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin ante cibum, “before food” — often 30–60 minutes before eating, for medicines that absorb better on an empty stomach, or that have to be in place before food arrives (e.g. mealtime insulin, which is time-critical).","nm":1},{"id":"q7cb858086f","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “pc” on a medication chart means:","qh":"<p>The term “pc” on a medication chart means:</p>","qt":"The term “pc” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["After meals","Before meals","At night","In the morning"],"key":["After meals"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin post cibum, “after food” — for medicines that upset an empty stomach or absorb better with food.","nm":1},{"id":"q53ea138dde","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “PO” on a medication chart means:","qh":"<p>The term “PO” on a medication chart means:</p>","qt":"The term “PO” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Into the rectum","By mouth (swallowed)","Under the tongue (sublingual)","Between the cheek and gum (buccal)"],"key":["By mouth (swallowed)"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin per os. Enteral — absorbed from the gut, and it passes through the liver before reaching the body (the first-pass effect), which is why oral doses are often bigger than IV ones.","nm":1},{"id":"q0395df04f5","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “SL” on a medication chart means:","qh":"<p>The term “SL” on a medication chart means:</p>","qt":"The term “SL” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Under the tongue (sublingual)","Between the cheek and gum (buccal)","Under the skin (subcutaneous)","By mouth (swallowed)"],"key":["Under the tongue (sublingual)"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Dissolves under the tongue and goes straight into the blood, skipping the liver — fast. The deck’s example: GTN spray for angina.","nm":1},{"id":"qedcf36839c","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “SC” on a medication chart means:","qh":"<p>The term “SC” on a medication chart means:</p>","qt":"The term “SC” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Under the tongue (sublingual)","Under the skin (subcutaneous)","Into a muscle (intramuscular)","Into the skin itself (intradermal)"],"key":["Under the skin (subcutaneous)"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Into the fatty tissue just under the dermis — e.g. insulin and enoxaparin. Slower and less reliable than IM, small volumes only.","nm":1},{"id":"q97fe96a88f","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “IM” on a medication chart means:","qh":"<p>The term “IM” on a medication chart means:</p>","qt":"The term “IM” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Into a vein (intravenous)","Under the skin (subcutaneous)","Into the skin itself (intradermal)","Into a muscle (intramuscular)"],"key":["Into a muscle (intramuscular)"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Absorbed from the blood vessels running through the muscle. The deck’s examples: a Depo-Provera injection, and an adrenaline auto-injector into the thigh.","nm":1},{"id":"q5ec55d0ea0","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “IV” on a medication chart means:","qh":"<p>The term “IV” on a medication chart means:</p>","qt":"The term “IV” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Into a muscle (intramuscular)","Into the bone marrow (intraosseous)","Into a vein (intravenous)","Under the skin (subcutaneous)"],"key":["Into a vein (intravenous)"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Straight into the bloodstream: no absorption needed, 100% bioavailable, onset immediate — and very hard to take back once it is in.","nm":1},{"id":"q4270ed796b","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “PR” on a medication chart means:","qh":"<p>The term “PR” on a medication chart means:</p>","qt":"The term “PR” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Into the vagina","Into the rectum","By mouth (swallowed)","Under the tongue (sublingual)"],"key":["Into the rectum"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Latin per rectum — suppositories and enemas.","nm":1},{"id":"q5d7c832da0","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “NKA” on a medication chart means:","qh":"<p>The term “NKA” on a medication chart means:</p>","qt":"The term “NKA” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["No known allergies (of any kind)","No known drug allergies","Allergy status not yet known","National Health Index number"],"key":["No known allergies (of any kind)"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Still confirm it with the patient before you give anything.","nm":1},{"id":"q24ca21d17c","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “NKDA” on a medication chart means:","qh":"<p>The term “NKDA” on a medication chart means:</p>","qt":"The term “NKDA” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["No known allergies (of any kind)","Allergy status not yet known","No known drug allergies","National Health Index number"],"key":["No known drug allergies"],"src":"The course’s Must Know: Medication & Prescription Abbreviations list (01.26) and Pharmacology Concepts (2) slides 77–80 · Joan’s 20 Oct revision session [1:18:40]","why":"Drug allergies only — the patient may still be allergic to food, latex or plasters. Confirm it by asking.","nm":1},{"id":"qd81cd1d43a","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “EC” on a medication chart means:","qh":"<p>The term “EC” on a medication chart means:</p>","qt":"The term “EC” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Slow (sustained) release","Immediate release","Modified release","Enteric coated"],"key":["Enteric coated"],"src":"Joan’s 20 Oct revision session [1:33:06–1:33:25] (“EC, SR, CR”) · Pharmacology Concepts (2) 2026, slide 66","why":"The coating protects the drug from stomach acid, protects the stomach from the drug, or delays the action.","nm":1},{"id":"qefc462e86b","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “SR” on a medication chart means:","qh":"<p>The term “SR” on a medication chart means:</p>","qt":"The term “SR” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Immediate release","Enteric coated","Under the tongue (sublingual)","Slow (sustained) release"],"key":["Slow (sustained) release"],"src":"Joan’s 20 Oct revision session [1:33:06–1:33:25] (“SR is slow release”)","why":"Releases the dose over many hours, so it can be given less often.","nm":1},{"id":"q7082a67ee6","quiz":"joan-abbr","sys":"found","pts":1,"q":"The term “CR” on a medication chart means:","qh":"<p>The term “CR” on a medication chart means:</p>","qt":"The term “CR” on a medication chart means:","imgs":[],"type":"mcq","authored":1,"opts":["Controlled release","Immediate release","Enteric coated","Crush before giving"],"key":["Controlled release"],"src":"Joan’s 20 Oct revision session [1:33:06–1:33:25] (“CR is controlled release”)","why":"Releases the drug at a controlled rate over time, so it can be given less often. Like SR, MR and EC, it is never crushed. Joan, 20 Oct: “You’ve all learned CR, haven’t you, for the CLS assessment? CR is controlled release.”","nm":1},{"id":"qa17a375794","quiz":"joan-drugs","sys":"found","pts":1,"q":"GTN spray for angina is given under the tongue. This route is:","qh":"<p>GTN spray for angina is given under the tongue. This route is:</p>","qt":"GTN spray for angina is given under the tongue. This route is:","imgs":[],"type":"mcq","authored":1,"opts":["Buccal","Sublingual","Enteral","Intradermal"],"key":["Sublingual"],"src":"Pharmacology Concepts (2) 2026 slide 31 · Joan’s 20 Oct revision session [0:19:23–0:25:39]","why":"Sublingual is under the tongue: GTN enters the bloodstream directly and acts very quickly. Buccal is through the lining of the cheek."},{"id":"q75c192a1ff","quiz":"joan-drugs","sys":"found","pts":1,"q":"A patient on warfarin starts taking aspirin. The main risk is:","qh":"<p>A patient on warfarin starts taking aspirin. The main risk is:</p>","qt":"A patient on warfarin starts taking aspirin. The main risk is:","imgs":[],"type":"mcq","authored":1,"opts":["Bleeding","Blood clots","An asthma attack","Liver damage"],"key":["Bleeding"],"src":"Pharmacodynamics 2026 slide 45 · Joan’s 20 Oct revision session [0:19:23–0:25:39]","why":"Warfarin and aspirin both inhibit clotting, in different ways, so together their effects add up (an additive interaction): the risk of bleeding rises."},{"id":"q2d1225c307","quiz":"joan-drugs","sys":"found","pts":1,"q":"A patient who uses a salbutamol inhaler for asthma is started on metoprolol (a beta blocker). What may happen?","qh":"<p>A patient who uses a salbutamol inhaler for asthma is started on metoprolol (a beta blocker). What may happen?</p>","qt":"A patient who uses a salbutamol inhaler for asthma is started on metoprolol (a beta blocker). What may happen?","imgs":[],"type":"mcq","authored":1,"opts":["The salbutamol works less well","The salbutamol works better","The risk of bleeding rises","Nothing — they do not interact"],"key":["The salbutamol works less well"],"src":"Pharmacodynamics 2026 slide 45 · Joan’s 20 Oct revision session [0:19:23–0:25:39]","why":"Salbutamol is a beta agonist that opens the airways; metoprolol is a beta antagonist that blocks the same receptors, so the reliever works less well in the lungs."},{"id":"q94b310eb65","quiz":"joan-drugs","sys":"found","pts":1,"q":"Morphine is which class of controlled drug?","qh":"<p>Morphine is which class of controlled drug?</p>","qt":"Morphine is which class of controlled drug?","imgs":[],"type":"mcq","authored":1,"opts":["Class A","Class B","Class C","Not a controlled drug"],"key":["Class B"],"src":"Legal & Ethical 2026 slide 14 · Joan’s 20 Oct revision session [0:19:23–0:25:39]","why":"Class B: drugs of dependence with a high risk of harm, restricted prescribing and dispensing, kept in a double-locked safe — e.g. morphine. Class A drugs (heroin, cocaine) are not prescribed for medical use."},{"id":"q70f2083560","quiz":"joan-drugs","sys":"found","pts":1,"q":"The suffix “-cillin”, as in amoxicillin, tells you the drug is:","qh":"<p>The suffix “-cillin”, as in amoxicillin, tells you the drug is:</p>","qt":"The suffix “-cillin”, as in amoxicillin, tells you the drug is:","imgs":[],"type":"mcq","authored":1,"opts":["A beta blocker","A penicillin antibiotic","A statin","A proton pump inhibitor"],"key":["A penicillin antibiotic"],"src":"Pharmacology Concepts (1) 2026 slide 42 · Joan’s 20 Oct revision session [0:19:23–0:25:39]","why":"-cillin is the penicillin family (amoxicillin); -olol is a beta blocker (metoprolol); -statin lowers cholesterol (atorvastatin)."},{"id":"qc28bef5d1a","quiz":"joan-drugs","sys":"found","pts":1,"q":"Which medicine is in Pregnancy Category A?","qh":"<p>Which medicine is in Pregnancy Category A?</p>","qt":"Which medicine is in Pregnancy Category A?","imgs":[],"type":"mcq","authored":1,"opts":["Isotretinoin","Paracetamol","Tetracycline","Cocaine"],"key":["Paracetamol"],"src":"Lifespan 2026 slide 15 · Joan’s 20 Oct revision session [0:19:23–0:25:39]","why":"Category A: taken by a large number of pregnant people without any proven increase in malformations or other harm. Paracetamol is the deck’s example; Category X is the contraindicated end."},{"id":"q5547a4260a","quiz":"joan-calc","sys":"calc","pts":1,"q":"A child is prescribed paracetamol 250 mg. The suspension is 200 mg/5 mL. How many mL should be given? (You do not need to show your working)","qh":"<p>A child is prescribed paracetamol 250 mg. The suspension is 200 mg/5 mL. How many mL should be given? (You do not need to show your working)</p>","qt":"A child is prescribed paracetamol 250 mg. The suspension is 200 mg/5 mL. How many mL should be given? (You do not need to show your working)","imgs":[],"type":"mcq","authored":1,"opts":["5 mL","6.25 mL","4 mL","62.5 mL"],"key":["6.25 mL"],"src":"Medication Calculations 2026 slides 27–29 (worked example 4)","why":"Want ÷ got × volume: 250 mg ÷ 200 mg × 5 mL = 6.25 mL. The units already match, so nothing to convert."},{"id":"q72b494ae72","quiz":"joan-calc","sys":"calc","pts":1,"q":"Morphine 4 mg is prescribed. You dilute a 1 mL ampoule of 5 mg/mL with 9 mL of sterile water. How many mL should be given? (You do not need to show your working)","qh":"<p>Morphine 4 mg is prescribed. You dilute a 1 mL ampoule of 5 mg/mL with 9 mL of sterile water. How many mL should be given? (You do not need to show your working)</p>","qt":"Morphine 4 mg is prescribed. You dilute a 1 mL ampoule of 5 mg/mL with 9 mL of sterile water. How many mL should be given? (You do not need to show your working)","imgs":[],"type":"mcq","authored":1,"opts":["0.8 mL","4 mL","8 mL","10 mL"],"key":["8 mL"],"src":"Medication Calculations 2026 slides 99–100 (worked example 24)","why":"Add first: 1 mL + 9 mL = 10 mL, still holding 5 mg. Then 4 mg ÷ 5 mg × 10 mL = 8 mL."},{"id":"qd8cb8b9ce8","quiz":"joan-imm","sys":"imm","pts":1,"q":"Which of these is a live (attenuated) vaccine?","qh":"<p>Which of these is a live (attenuated) vaccine?</p>","qt":"Which of these is a live (attenuated) vaccine?","imgs":[],"type":"mcq","authored":1,"opts":["Inactivated polio","COVID-19 mRNA","MMR","A subunit vaccine"],"key":["MMR"],"src":"the Vaccinations & Recognising Allergy deck (Module 8), slide 5","why":"Live vaccines are weakened pathogens that replicate without causing disease: MMR, varicella, rotavirus, BCG. Inactivated, subunit and mRNA vaccines are non-live."},{"id":"q3a6e4e7897","quiz":"joan-imm","sys":"imm","pts":1,"q":"Which vaccine on the NZ immunisation schedule is given by mouth?","qh":"<p>Which vaccine on the NZ immunisation schedule is given by mouth?</p>","qt":"Which vaccine on the NZ immunisation schedule is given by mouth?","imgs":[],"type":"mcq","authored":1,"opts":["Rotavirus","MMR","Pneumococcal","HPV"],"key":["Rotavirus"],"src":"the Vaccinations & Recognising Allergy deck (Module 8), slide 7 (the Immunisation Schedule card, Aug 2025)","why":"The rotavirus vaccine (Rotarix) is oral, at 6 weeks and 3 months; the first dose must be given before 15 weeks and the second before 25 weeks."},{"id":"q880c239a62","quiz":"joan-imm","sys":"imm","pts":1,"q":"Contact dermatitis is which type of hypersensitivity reaction?","qh":"<p>Contact dermatitis is which type of hypersensitivity reaction?</p>","qt":"Contact dermatitis is which type of hypersensitivity reaction?","imgs":[],"type":"mcq","authored":1,"opts":["Type I — immediate","Type II — cytotoxic","Type III — immune complex","Type IV — delayed"],"key":["Type IV — delayed"],"src":"the Allergic Reactions deck (Module 8), slide 4","why":"Type I: hay fever, asthma, anaphylaxis. Type II: haemolytic anaemia, transfusion reactions. Type III: serum sickness, the Arthus reaction. Type IV: contact dermatitis, the tuberculin reaction."},{"id":"q687f2d0a8f","quiz":"joan-imm","sys":"imm","pts":1,"q":"Which is a sign of anaphylaxis, not a mild allergic reaction?","qh":"<p>Which is a sign of anaphylaxis, not a mild allergic reaction?</p>","qt":"Which is a sign of anaphylaxis, not a mild allergic reaction?","imgs":[],"type":"mcq","authored":1,"opts":["Hives","Swollen lips","Swelling of the tongue","A tingling mouth"],"key":["Swelling of the tongue"],"src":"the Vaccinations & Recognising Allergy deck (Module 8), slides 12–13 (the ASCIA Action Plan)","why":"On the ASCIA plan, hives, swelling of the lips, face or eyes and a tingling mouth are mild-to-moderate. Swelling of the tongue is one of the anaphylaxis signs — any one of them means anaphylaxis."},{"id":"qfe1b72bc50","quiz":"tox","sys":"tox","pts":1,"q":"A patient on regular morphine says the same dose no longer controls their pain. This is most likely:","qh":"<p>A patient on regular morphine says the same dose no longer controls their pain. This is most likely:</p>","qt":"A patient on regular morphine says the same dose no longer controls their pain. This is most likely:","imgs":[],"type":"mcq","authored":1,"opts":["Addiction","Tolerance","Drug abuse","An allergy"],"key":["Tolerance"],"src":"deck Licit and Illicit Drugs (Module 9), slide 13","why":"Tolerance: repeated doses cause decreasing effects, or the dose must rise to keep the same effect. Morphine users develop tolerance rapidly; marijuana causes little."},{"id":"qa86d83e51f","quiz":"tox","sys":"tox","pts":1,"q":"Which describes acute poisoning?","qh":"<p>Which describes acute poisoning?</p>","qt":"Which describes acute poisoning?","imgs":[],"type":"mcq","authored":1,"opts":["A poison building up over years","A poison entering the body in a short time","Needing more drug for the same effect","A bee sting"],"key":["A poison entering the body in a short time"],"src":"deck Licit and Illicit Drugs (Module 9), slide 37","why":"Acute: the poison enters the body in a short time. Chronic: it accumulates gradually."},{"id":"qb65f86b014","quiz":"tox","sys":"tox","pts":1,"q":"Naloxone (Narcan) reverses an opioid overdose because it is:","qh":"<p>Naloxone (Narcan) reverses an opioid overdose because it is:</p>","qt":"Naloxone (Narcan) reverses an opioid overdose because it is:","imgs":[],"type":"mcq","authored":1,"opts":["An opioid agonist","An opioid antagonist","A gut binder","An enzyme"],"key":["An opioid antagonist"],"src":"deck Licit and Illicit Drugs (Module 9), slide 40","why":"Naloxone blocks the opioid receptors — an antagonist (receptor blocking is one of the ways antidotes work)."},{"id":"q7b3a5e5679","quiz":"tox","sys":"tox","pts":1,"q":"N-acetylcysteine (NAC) is the antidote to an overdose of:","qh":"<p>N-acetylcysteine (NAC) is the antidote to an overdose of:</p>","qt":"N-acetylcysteine (NAC) is the antidote to an overdose of:","imgs":[],"type":"mcq","authored":1,"opts":["Morphine","Paracetamol","Alcohol","Benzodiazepines"],"key":["Paracetamol"],"src":"deck Licit and Illicit Drugs (Module 9), slide 40","why":"NAC reduces the production of the toxic metabolites made from paracetamol."},{"id":"qaed3f64a10","quiz":"joan-drugs","sys":"found","pts":2,"q":"Why should paracetamol not be given to a baby under 3 months (or under 5 kg) without medical advice?","qh":"<p>Why should paracetamol not be given to a baby under 3 months (or under 5 kg) without medical advice?</p>","qt":"Why should paracetamol not be given to a baby under 3 months (or under 5 kg) without medical advice?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The baby’s liver enzymes are not yet developed, so paracetamol is metabolised more slowly.","Toxic metabolites build up in the blood, so the risk of overdose and liver injury is higher."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 29 (BPAC NZ, 2018) · Joan’s 20 Oct revision session [0:19:23–0:25:39]"}},{"id":"qc553ad0325","quiz":"joan-found","sys":"found","pts":2,"q":"What is the meaning of “contraindication”? Give an example.","qh":"<p>What is the meaning of “contraindication”? Give an example.</p>","qt":"What is the meaning of “contraindication”? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a situation in which a medication should NOT be used, because it may be harmful to the person.","Example: a known severe allergy to that medicine — it must not be given; or a medicine known to harm the foetus in a woman who is pregnant."],"src":"Question and model answer are the tool’s · from Joan’s own example of a short answer, Legal & Ethical lecture 16 Sep 2026 [1:05:06]; definition from deck 01 Pharmacology Concepts (1), slide 31"}},{"id":"q4aa9ab8e04","quiz":"joan-found","sys":"found","pts":2,"q":"Define a medication interaction and give an example.","qh":"<p>Define a medication interaction and give an example.</p>","qt":"Define a medication interaction and give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a reaction in which the effect or activity of a medication is altered by another substance or condition — another medication, a food, a complementary or alternative medicine, or a medical condition.","Example: a herbal remedy or a food that changes how much of a prescribed medicine is absorbed or broken down, making it stronger or weaker — which is why a nurse asks about everything the person takes."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (1), slide 32"}},{"id":"qc2a33fa1bc","quiz":"joan-found","sys":"found","pts":2,"q":"Distinguish a local effect from a systemic effect of a medication, and give an example of each.","qh":"<p>Distinguish a local effect from a systemic effect of a medication, and give an example of each.</p>","qt":"Distinguish a local effect from a systemic effect of a medication, and give an example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Local effect: the effect occurs at the immediate site of administration — e.g. a cream applied to a skin rash, or eye drops.","Systemic effect: the medication must be absorbed into the circulation and distributed to the place where it acts — e.g. a tablet swallowed for a headache."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (2), slides 26–27"}},{"id":"q2540c548d3","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define bioavailability and give an example comparing two routes.","qh":"<p>Define bioavailability and give an example comparing two routes.</p>","qt":"Define bioavailability and give an example comparing two routes.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: how much of the dose actually reaches the bloodstream.","Example: intravenous = 100%; the same medicine by mouth is lower, because some is not absorbed from the gut and some is broken down by the liver before it reaches the circulation."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slide 34"}},{"id":"q00b0ae36d3","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"What is plasma protein binding, and why does it matter? Give an example.","qh":"<p>What is plasma protein binding, and why does it matter? Give an example.</p>","qt":"What is plasma protein binding, and why does it matter? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: many drugs bind reversibly to plasma proteins, mainly albumin; only the FREE (unbound) drug can leave the blood and have an effect.","Example: two highly protein-bound medicines compete for the same binding site, or a malnourished older adult has low albumin — more free drug circulates, so the effect and the risk of toxicity increase."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slides 37–38"}},{"id":"qa471ade3d3","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define half-life and give an example of how it is used.","qh":"<p>Define half-life and give an example of how it is used.</p>","qt":"Define half-life and give an example of how it is used.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the time taken for the plasma concentration of a drug to fall by one half — not how long the whole drug stays in the body.","Example: a medicine with a 6-hour half-life is almost completely cleared after about 5 half-lives (30 hours), and takes about 3–5 half-lives of regular dosing to reach steady state — which is what sets the dosing interval."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 32 and 38; speaker notes to deck 09 slide 20"}},{"id":"q001d7cf710","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define the therapeutic range and give an example of when it is monitored.","qh":"<p>Define the therapeutic range and give an example of when it is monitored.</p>","qt":"Define the therapeutic range and give an example of when it is monitored.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the range of plasma concentration within which a drug produces its desired effect without causing toxicity — above the minimum effective concentration and below the toxic one.","Example: therapeutic drug monitoring for a medicine with a NARROW therapeutic range (such as some anticoagulants) — blood levels are taken at peak and trough to keep the dose safe and effective."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 36–37"}},{"id":"q7fdc63c15b","quiz":"joan-admin","sys":"admin","pts":2,"q":"Define a medication error and give an example. How does it differ from an adverse effect?","qh":"<p>Define a medication error and give an example. How does it differ from an adverse effect?</p>","qt":"Define a medication error and give an example. How does it differ from an adverse effect?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: any preventable event that may cause or lead to inappropriate medication use or patient harm while the medication is in the control of the health professional, patient or consumer. Example: a dose given twice because the first was not documented, or a medicine given to a patient with a known allergy to it.","Difference: an adverse effect is harm caused by the medicine itself, even when used correctly; a medication error is harm arising from human action — most trace back to a lapse in the rights and checks."],"src":"Question and model answer are the tool’s · from deck 05 Medication Administration & Patient Education (2), slides 4–5"}},{"id":"q8dc9e9266c","quiz":"joan-admin","sys":"admin","pts":2,"q":"What is CARM, and who can report to it? Give an example of something that should be reported.","qh":"<p>What is CARM, and who can report to it? Give an example of something that should be reported.</p>","qt":"What is CARM, and who can report to it? Give an example of something that should be reported.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the Centre for Adverse Reactions Monitoring — New Zealand’s database of suspected adverse reactions to medicines and vaccines; health professionals, patients and whānau can all report.","Example: a patient develops a widespread rash and facial swelling after starting a new medicine — it is documented, an alert is placed on their record, and it is reported to CARM."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacodynamics, slide 48; deck 09 Legal & Ethical Aspects, slide 10"}},{"id":"qbe831fca79","quiz":"joan-life","sys":"life","pts":2,"q":"Define polypharmacy and give an example of a risk it raises.","qh":"<p>Define polypharmacy and give an example of a risk it raises.</p>","qt":"Define polypharmacy and give an example of a risk it raises.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the concurrent use of multiple medications, usually five or more — with the connotation that too many, or unnecessary, medicines are being taken.","Example (any one): an older adult on many medicines has a higher risk of drug–drug interactions and adverse effects, of falls, of not taking them as prescribed, and of death."],"src":"Question and model answer are the tool’s · from deck 06a Medication in the Elderly & Polypharmacy, slides 34–36"}},{"id":"qa170e24e78","quiz":"joan-life","sys":"life","pts":2,"q":"On what does the transfer of a medicine into breast milk depend, and what is the guiding principle for a breastfeeding parent who needs medication?","qh":"<p>On what does the transfer of a medicine into breast milk depend, and what is the guiding principle for a breastfeeding parent who needs medication?</p>","qt":"On what does the transfer of a medicine into breast milk depend, and what is the guiding principle for a breastfeeding parent who needs medication?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Most medicines can enter breast milk. How much reaches the infant depends on the parent’s plasma concentration of the drug, the amount of milk the infant consumes, and the drug’s lipid solubility.","Principle, with example: maintaining the parent’s health is essential, so a needed medicine should not automatically be stopped — the prescriber weighs the risk to the infant against the risk of not treating the parent."],"src":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slide 18"}},{"id":"qe03adddc9f","quiz":"joan-life","sys":"life","pts":2,"q":"“Children are just small adults.” Explain why this is false for medicines, and give an example.","qh":"<p>“Children are just small adults.” Explain why this is false for medicines, and give an example.</p>","qt":"“Children are just small adults.” Explain why this is false for medicines, and give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Children are physiologically different from adults and constantly developing: different body composition (about 75% water, less fat), immature protective barriers, and poorer temperature and homeostatic control — so they handle medicines differently.","Example: a child’s dose is calculated from body weight (mg per kg), never by simply scaling down an adult dose."],"src":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slides 24–25"}},{"id":"qd71245f58b","quiz":"joan-law","sys":"law","pts":2,"q":"What is a controlled drug? Give an example of how controlled drugs are handled differently on a ward.","qh":"<p>What is a controlled drug? Give an example of how controlled drugs are handled differently on a ward.</p>","qt":"What is a controlled drug? Give an example of how controlled drugs are handled differently on a ward.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a medicine placed under special legal restriction by the Misuse of Drugs Act 1975 because of its potential for abuse, dependence and harm. All controlled drugs are prescribed, but not all prescribed drugs are controlled.","Example: opioids such as morphine (Class B) are kept in a double-locked safe inside a locked medication room with restricted key-holders, and there are penalties for unlawful prescribing, supply or administration."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [00:00–02:39]; deck 09 Legal & Ethical Aspects, slides 12–14"}},{"id":"q3d3fe77921","quiz":"joan-law","sys":"law","pts":2,"q":"Define “scope of practice” and give an example of something outside a registered nurse’s scope.","qh":"<p>Define “scope of practice” and give an example of something outside a registered nurse’s scope.</p>","qt":"Define “scope of practice” and give an example of something outside a registered nurse’s scope.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the area of practice a practitioner is educated, competent and authorised to work in, set by the regulatory authority (the Nursing Council) under the HPCAA — about demonstrated competence, not a list of tasks.","Example (any one): prescribing a medicine (unless a designated RN prescriber) · dispensing — moving stock from bulk into a labelled patient pack is the pharmacist’s role · practising in a specialty the nurse has no training or experience in."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [09:10] and [26:29]; deck 09 Legal & Ethical Aspects, slides 7, 20 and 30–31"}},{"id":"qe0b90dee19","quiz":"joan-ethics","sys":"law","pts":2,"q":"Explain the nurse’s duty of privacy and confidentiality, and give an example involving a telephone enquiry.","qh":"<p>Explain the nurse’s duty of privacy and confidentiality, and give an example involving a telephone enquiry.</p>","qt":"Explain the nurse’s duty of privacy and confidentiality, and give an example involving a telephone enquiry.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Duty (Code of Conduct Principle 5): protect personal health information and use or share it only for appropriate professional purposes — it is the patient’s information, and notes are accessed only by those caring for that patient.","Example: a caller says she is a patient’s wife and asks how he is. The answer is “sorry, we can’t give patient information over the phone” — you cannot verify who is calling; offer to ring back or have the patient ring them."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [43:04–45:07]; deck 09 Legal & Ethical Aspects, slide 59"}},{"id":"qfb56a27bba","quiz":"joan-ethics","sys":"law","pts":2,"q":"Define autonomy and give an example relating to medicines.","qh":"<p>Define autonomy and give an example relating to medicines.</p>","qt":"Define autonomy and give an example relating to medicines.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the right of choice — informed, voluntary consent without coercion, with appropriate disclosure and checking of understanding, including the right to refuse and to withdraw at any time.","Example: a competent patient declines a prescribed medicine. The nurse checks they understand the consequences, respects the refusal, documents it and informs the prescriber — they do not pressure or hide it in food."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [56:25]; deck 09 Legal & Ethical Aspects, slide 73"}},{"id":"qba72713fbf","quiz":"joan-ethics","sys":"law","pts":2,"q":"Why is concealing a medication error treated more seriously than the error itself? Give an example.","qh":"<p>Why is concealing a medication error treated more seriously than the error itself? Give an example.</p>","qt":"Why is concealing a medication error treated more seriously than the error itself? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Reason: an error is usually accidental and is managed in-house — report it, reflect, be supervised for a time. Concealment is deliberate: it denies the patient monitoring and treatment, and it breaches integrity (Code of Conduct Principle 7), so it becomes professional misconduct.","Example: “Nurse D” gave the wrong medicine, realised 20 minutes later, did nothing and took two days to report; the patient died. She was found guilty of professional misconduct, suspended, fined and supervised."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [15:52–21:02] and [24:42]; deck 09 Legal & Ethical Aspects, slides 26–27"}},{"id":"q0dc4be8381","quiz":"joan-devmkt","sys":"law","pts":2,"q":"Define bioequivalence and explain why it matters, with an example.","qh":"<p>Define bioequivalence and explain why it matters, with an example.</p>","qt":"Define bioequivalence and explain why it matters, with an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: two formulations are bioequivalent when the same active ingredient reaches the bloodstream at the same rate and to the same extent.","Why and example: a generic may only be substituted for a brand if it is bioequivalent, so the patient gets the same therapeutic effect — e.g. a pharmacy dispensing the funded generic instead of the original brand of the same medicine."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 6 (“Remember bioequivalence!”); defined in deck 01 Pharmacology Concepts (1), slides 49–50"}},{"id":"qeb2b33db6b","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What is Phase 4 of clinical research, and why does it exist? Give an example.","qh":"<p>What is Phase 4 of clinical research, and why does it exist? Give an example.</p>","qt":"What is Phase 4 of clinical research, and why does it exist? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: post-market monitoring of long-term safety and effectiveness in several thousand patients over years, after Medsafe approval.","Why and example: rare or delayed adverse effects only show up at population scale — e.g. a medicine withdrawn after post-market reports revealed a serious risk the trials were too small to see."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 11–12"}},{"id":"q156716d6b7","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What is direct-to-consumer advertising of medicines, and why is Aotearoa New Zealand unusual?","qh":"<p>What is direct-to-consumer advertising of medicines, and why is Aotearoa New Zealand unusual?</p>","qt":"What is direct-to-consumer advertising of medicines, and why is Aotearoa New Zealand unusual?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: advertising that promotes a specific branded prescription medicine to the public — its benefits, uses and risks.","New Zealand is one of only two developed countries that permit it; most restrict prescription-medicine advertising to health professionals, because consumer advertising can drive demand for medicines that may not be appropriate."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 22 and 24"}},{"id":"q9b611d5393","quiz":"joan-imm","sys":"imm","pts":2,"q":"How does a nurse prevent a patient being given a substance they are allergic to? Give an example.","qh":"<p>How does a nurse prevent a patient being given a substance they are allergic to? Give an example.</p>","qt":"How does a nurse prevent a patient being given a substance they are allergic to? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Avoidance: identify the allergen and avoid it — check for allergies at every healthcare encounter, record them, and the patient wears an allergy bracelet; take special care with highly suspect substances such as contrast dyes, iodine and antimicrobials.","Example: before giving an antibiotic, ask the patient about allergies and check their bracelet and the allergy section of the chart; a new reaction is documented and the prescriber told."],"src":"Question and model answer are the tool’s · from the Allergic Reactions deck (Module 8), slide 6"}},{"id":"q76e9831e9b","quiz":"joan-imm","sys":"imm","pts":2,"q":"Define active immunity and give an example of natural and of artificial active immunity.","qh":"<p>Define active immunity and give an example of natural and of artificial active immunity.</p>","qt":"Define active immunity and give an example of natural and of artificial active immunity.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: immunity made and directed by the person’s own immune system, which stores memory B cells.","Natural: recovering from an infection, e.g. after having chickenpox. Artificial: a vaccination, which stimulates the response without the damage of infection, e.g. the MMR vaccine at 12 months."],"src":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slides 23–24; the schedule from the Vaccinations & Recognising Allergy deck (Module 8), slide 7"}},{"id":"q281ececc27","quiz":"joan-imm","sys":"imm","pts":2,"q":"Define passive immunity and give an example of natural and of artificial passive immunity.","qh":"<p>Define passive immunity and give an example of natural and of artificial passive immunity.</p>","qt":"Define passive immunity and give an example of natural and of artificial passive immunity.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: antibodies introduced from a different source rather than made by the person’s own immune system — protection that is immediate but temporary.","Natural: a mother’s antibodies crossing the placenta or in breastmilk. Artificial: lab-made monoclonal antibodies, e.g. pre-exposure prophylaxis for someone immunocompromised at high risk of COVID-19."],"src":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slides 25, 27–28"}},{"id":"q0c83fbbca5","quiz":"joan-imm","sys":"imm","pts":2,"q":"Define herd immunity and give an example of who it protects.","qh":"<p>Define herd immunity and give an example of who it protects.</p>","qt":"Define herd immunity and give an example of who it protects.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: when most people in a community are vaccinated, pathogens cannot spread easily, so the whole community is protected — some diseases can even be reduced or eliminated, e.g. polio.","Who it protects: people who cannot be vaccinated or do not respond — e.g. the very young, the elderly, the immunocompromised and “non-responders”."],"src":"Question and model answer are the tool’s · from the Vaccinations & Recognising Allergy deck (Module 8), slide 4"}},{"id":"q93ca7c843d","quiz":"joan-imm","sys":"imm","pts":3,"q":"Distinguish a live (attenuated) vaccine from a non-live vaccine, with an example of each and a group a live vaccine is not safe for.","qh":"<p>Distinguish a live (attenuated) vaccine from a non-live vaccine, with an example of each and a group a live vaccine is not safe for.</p>","qt":"Distinguish a live (attenuated) vaccine from a non-live vaccine, with an example of each and a group a live vaccine is not safe for.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Live (attenuated): weakened pathogens that replicate without causing disease — e.g. MMR, varicella, rotavirus, BCG.","Non-live: cannot replicate — inactivated (the germ is killed, e.g. polio), subunit (only microbial fragments) or mRNA (genetic instructions to make a viral protein, e.g. COVID-19).","Not safe: live vaccines are not safe in pregnancy or immunosuppression — e.g. MMR is not given to a pregnant woman."],"src":"Question and model answer are the tool’s · from the Vaccinations & Recognising Allergy deck (Module 8), slide 5"}},{"id":"q19c3118d47","quiz":"joan-imm","sys":"imm","pts":2,"q":"Why is a fever a reason not to give a vaccination that day? Give an example.","qh":"<p>Why is a fever a reason not to give a vaccination that day? Give an example.</p>","qt":"Why is a fever a reason not to give a vaccination that day? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Reason: the immune system can only do one task at a time — if it is already busy responding to something else, it may not respond to the vaccine’s antigen and learn to recognise that disease.","Example: a child who arrives for their 3-month vaccinations with a fever — the vaccination is put off and rebooked once they are well."],"src":"Question and model answer are the tool’s · from Immunology for Nurses (Emma Lambert, Module 8), slide 31 (“Fever as a contraindication”)"}},{"id":"q071ce622d2","quiz":"joan-tox","sys":"tox","pts":2,"q":"Define a licit drug and an illicit drug, with an example of each.","qh":"<p>Define a licit drug and an illicit drug, with an example of each.</p>","qt":"Define a licit drug and an illicit drug, with an example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Licit: a medication or drug that is lawful and permitted — prescription, restricted, pharmacy-only and general sale medicines, and some controlled drugs (some Class B and C). Example: alcohol, or an opioid analgesic taken as prescribed.","Illicit: a drug that is unlawful or otherwise not permitted — every Class A controlled drug, some Class B and a few Class C. Example: methamphetamine (Class A)."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slides 7 and 19"}},{"id":"q49ce46eb6e","quiz":"joan-tox","sys":"tox","pts":2,"q":"Define drug tolerance and give an example.","qh":"<p>Define drug tolerance and give an example.</p>","qt":"Define drug tolerance and give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a physical state in which repeated doses of a drug cause decreasing effects, or the dose must be increased to maintain the same effect (receptor downregulation, from pharmacodynamics).","Example: a person on regular morphine needs higher doses for the same pain relief — morphine users develop tolerance rapidly, whereas marijuana causes little tolerance. Not every drug causes it."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 13"}},{"id":"q7f23095410","quiz":"joan-tox","sys":"tox","pts":2,"q":"What is withdrawal? Give an example of its symptoms and what affects how severe it is.","qh":"<p>What is withdrawal? Give an example of its symptoms and what affects how severe it is.</p>","qt":"What is withdrawal? Give an example of its symptoms and what affects how severe it is.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the symptoms when a person who is physically dependent stops or cuts down a substance. It ranges from mild to severe and lasts days or weeks, depending on the substance, how long it was used, age, other conditions and psychological state, and whether it was weaned or stopped “cold turkey”.","Example: general symptoms such as insomnia, fatigue, irritability and cravings; severe withdrawal can bring paranoia, confusion, tremors and disorientation."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 11 (a Pusheen slide: the concept, not the full symptom list)"}},{"id":"q98b5759e41","quiz":"joan-tox","sys":"tox","pts":2,"q":"What is harm reduction? Give an example from Aotearoa New Zealand.","qh":"<p>What is harm reduction? Give an example from Aotearoa New Zealand.</p>","qt":"What is harm reduction? Give an example from Aotearoa New Zealand.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: reducing the harm of drug use for people who are going to use anyway, rather than only telling them not to — for example education about which combinations are dangerous.","Example: free, legal drug checking at festivals and clinics (Know Your Stuff NZ, legal since the Misuse of Drugs Act was changed), or making naloxone available to people at risk of an opioid overdose."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slide 27 · For-interest articles on drug checking (NZ Herald, 2023; Stuff, 2022) and overdose deaths (NZ Herald, 2024)"}},{"id":"qae9599d784","quiz":"joan-tox","sys":"tox","pts":2,"q":"Define an antidote and give an example.","qh":"<p>Define an antidote and give an example.</p>","qt":"Define an antidote and give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a substance that counteracts a poison — by binding it to reduce the free toxin, by slowing or speeding an enzyme, or by blocking its receptors (an antagonist).","Example: naloxone (Narcan) is an opioid antagonist that reverses an opioid overdose; N-acetylcysteine (NAC) reduces the toxic metabolites made from paracetamol in a paracetamol overdose."],"src":"Question and model answer are the tool’s · from deck Licit and Illicit Drugs (Module 9), slides 39–40"}},{"id":"q629d061d0b","quiz":"joan-cam","sys":"cam","pts":2,"q":"Define rongoā Māori and give an example of each of its three parts.","qh":"<p>Define rongoā Māori and give an example of each of its three parts.</p>","qt":"Define rongoā Māori and give an example of each of its three parts.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: traditional Māori healing, with a strong spiritual element in how remedies are prepared — a Māori model of health rather than only a set of remedies.","Its three parts: mirimiri (massage / body work), karakia (prayer) and rongoā rākau (native plant-based remedies, e.g. a leaf prepared as a balm, oil or tonic)."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slides 9 and 12 (quoting the NZNO Guidelines for Nurses on the Administration of Medicines 2024, s 7.7)"}},{"id":"q312cfb3cd1","quiz":"joan-cam","sys":"cam","pts":2,"q":"Who is responsible for a traditional Māori medicine, and what should a nurse do when whānau ask for advice about using one?","qh":"<p>Who is responsible for a traditional Māori medicine, and what should a nurse do when whānau ask for advice about using one?</p>","qt":"Who is responsible for a traditional Māori medicine, and what should a nurse do when whānau ask for advice about using one?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Responsibility rests with the tohunga or rongoā practitioner — karakia and kawa differ between tribal areas, and the nurse does not prescribe or prepare it.","The nurse arranges a discussion with everyone involved, including the tohunga or practitioner, so the client can make an informed decision — e.g. bringing the practitioner, the whānau and the prescriber together before a remedy is started in hospital."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slide 9 (NZNO Guidelines 2024, s 7.7)"}},{"id":"q8250fd38ac","quiz":"form1","sys":"found","pts":1,"q":"The term “TDS” on a medication chart means that the patient requires their medication how frequently?","qh":"<p>The term “TDS” on a medication chart means that the patient requires their medication how frequently?</p>","qt":"The term “TDS” on a medication chart means that the patient requires their medication how frequently?","imgs":[],"type":"mcq","her":1,"opts":["Three hourly","Two times a day","Through dermal stab","Three times a day"],"key":["Three times a day"],"src":"Joan’s Formative mini-exam 1, answers document, Q1 · Joan’s feedback in class, Tue 20 Oct 2026 [1:18:28]","why":"TDS is three times a day. She: you must know every abbreviation — QID, TDS, Q6H, BD — to read a prescription; this exact one probably won't be on the paper, another will."},{"id":"qe28e7cbdc5","quiz":"form1","sys":"pkpd","pts":1,"q":"Maximal drug efficacy is defined as","qh":"<p>Maximal drug efficacy is defined as</p>","qt":"Maximal drug efficacy is defined as","imgs":[],"type":"mcq","her":1,"opts":["Maximum response a drug can produce","The potency of a drug","The drug’s relationship to agonists","The half-life of a drug"],"key":["Maximum response a drug can produce"],"src":"Joan’s Formative mini-exam 1, answers document, Q2 · Joan’s feedback in class, Tue 20 Oct 2026 [1:19:11]","why":"Efficacy is the maximum response a drug can produce, from the pharmacodynamics lecture beside specificity, selectivity and potency. Her example: paracetamol is for mild to moderate pain; once it reaches its maximal efficacy you move to another class."},{"id":"q68ef66a26b","quiz":"form1","sys":"imm","pts":1,"q":"Luisa, a 35-year-old woman, is prescribed an antibiotic for a post-operative wound infection. Luisa mentions she is “a little bit allergic to penicillin.” A medication (drug) allergy occurs when:","qh":"<p>Luisa, a 35-year-old woman, is prescribed an antibiotic for a post-operative wound infection. Luisa mentions she is “a little bit allergic to penicillin.” A medication (drug) allergy occurs when:</p>","qt":"Luisa, a 35-year-old woman, is prescribed an antibiotic for a post-operative wound infection. Luisa mentions she is “a little bit allergic to penicillin.” A medication (drug) allergy occurs when:","imgs":[],"type":"mcq","her":1,"opts":["When ‘cellular memory’ takes place in the body","When the body sees the medication (drug) as an antigen and an immune response is mounted against the drug","When the body has an unwanted but predictable response to a medication (drug)","When too much of a medication (drug) has accumulated in the body over time"],"key":["When the body sees the medication (drug) as an antigen and an immune response is mounted against the drug"],"src":"Joan’s Formative mini-exam 1, answers document, Q3 · Joan’s feedback in class, Tue 20 Oct 2026 [1:20:23]","why":"An allergy is the immune system treating the drug as an antigen — an 'enemy' — and mounting a response. She stressed knowing the signs of drug allergy, and the word antigen as the basis of immunisation."},{"id":"qa200256036","quiz":"form1","sys":"tox","pts":1,"q":"Sione is reluctant to take his prescribed analgesic medicine because he fears becoming dependent on it. He asks what 'dependence' means. Which description is accurate for dependence?","qh":"<p>Sione is reluctant to take his prescribed analgesic medicine because he fears becoming dependent on it. He asks what 'dependence' means. Which description is accurate for dependence?</p>","qt":"Sione is reluctant to take his prescribed analgesic medicine because he fears becoming dependent on it. He asks what 'dependence' means. Which description is accurate for dependence?","imgs":[],"type":"mcq","her":1,"opts":["Any repeated use of a medicine for pain relief that extends beyond six months","Experiencing withdrawal symptoms if a prescribed drug is stopped abruptly","A pattern of compulsive use with craving, loss of control, and continued use despite harm","The onset of antisocial behaviour such as aggression, playing loud music, or refusing family activities"],"key":["Experiencing withdrawal symptoms if a prescribed drug is stopped abruptly"],"src":"Joan’s Formative mini-exam 1, answers document, Q4 · Joan’s feedback in class, Tue 20 Oct 2026 [1:21:49] and the correction [1:48:07–1:50:15]","why":"Her document marks C, but she corrected it in class: C (compulsive use, craving, loss of control, use despite harm) describes ADDICTION. Dependence is B — withdrawal symptoms if a prescribed drug is stopped abruptly. Using an inhaler every day is medical dependence, not addiction. This tool keys B."},{"id":"q5791b52577","quiz":"form1","sys":"pkpd","pts":1,"q":"A drug that binds to a cell receptor and effects a response is called","qh":"<p>A drug that binds to a cell receptor and effects a response is called</p>","qt":"A drug that binds to a cell receptor and effects a response is called","imgs":[],"type":"mcq","her":1,"opts":["An agonist","A receptor blocker","A channel blocker","An antagonist"],"key":["An agonist"],"src":"Joan’s Formative mini-exam 1, answers document, Q5 · Joan’s feedback in class, Tue 20 Oct 2026 [1:22:42]","why":"An agonist binds a receptor and causes a response (an antagonist binds and does not) — pharmacodynamics."},{"id":"q27e3ff59ba","quiz":"form1","sys":"pkpd","pts":1,"q":"What does the acronym ADR stand for?","qh":"<p>What does the acronym ADR stand for?</p>","qt":"What does the acronym ADR stand for?","imgs":[],"type":"mcq","her":1,"opts":["A drug response","A dangerous reaction","Avoidable drug response","Adverse drug reaction"],"key":["Adverse drug reaction"],"src":"Joan’s Formative mini-exam 1, answers document, Q6 · Joan’s feedback in class, Tue 20 Oct 2026 [1:23:16]","why":"ADR = adverse drug reaction. The term has largely taken over from 'side effect'; adverse always means bad, and an allergic reaction is one kind of ADR."},{"id":"qc25da16463","quiz":"form1","sys":"pkpd","pts":1,"q":"For medications that may be affected by very high first pass metabolism, which route of administration would NOT be prescribed?","qh":"<p>For medications that may be affected by very high first pass metabolism, which route of administration would NOT be prescribed?</p>","qt":"For medications that may be affected by very high first pass metabolism, which route of administration would NOT be prescribed?","imgs":[],"type":"mcq","her":1,"opts":["Intravenous","Intramuscular","Sublingual","Oral"],"key":["Oral"],"src":"Joan’s Formative mini-exam 1, answers document, Q7 · Joan’s feedback in class, Tue 20 Oct 2026 [1:24:55]","why":"A negative question — read it carefully. A drug with very high first-pass metabolism is broken down by the liver straight after absorption from the gut, so it is not given orally; an IV dose reaches the whole body before it ever gets to the liver."},{"id":"q9c85b492bf","quiz":"form1","sys":"cam","pts":1,"q":"When therapies are used instead of conventional medicine in an effort to achieve the same therapeutic effect in the body, they are often referred to as:","qh":"<p>When therapies are used instead of conventional medicine in an effort to achieve the same therapeutic effect in the body, they are often referred to as:</p>","qt":"When therapies are used instead of conventional medicine in an effort to achieve the same therapeutic effect in the body, they are often referred to as:","imgs":[],"type":"mcq","her":1,"opts":["Traditional therapies","Complementary therapies","Energy therapies","Alternative therapies"],"key":["Alternative therapies"],"src":"Joan’s Formative mini-exam 1, answers document, Q8 · Joan’s feedback in class, Tue 20 Oct 2026 [1:30:29]","why":"'Instead of' is the key: alternative replaces conventional (Western) medicine; complementary — with an E — is used alongside it. Her memory hook: carrot juice instead of chemo is alternative; carrot juice with chemo is complementary."},{"id":"qc1c764560d","quiz":"form1","sys":"admin","pts":1,"q":"Which approach best supports health literacy when educating a patient about a new medication?","qh":"<p>Which approach best supports health literacy when educating a patient about a new medication?</p>","qt":"Which approach best supports health literacy when educating a patient about a new medication?","imgs":[],"type":"mcq","her":1,"opts":["Use plain language and confirm understanding with teach-back","Use medical terminology to ensure accuracy","Provide written instructions only","Give minimal explanation to avoid confusion"],"key":["Use plain language and confirm understanding with teach-back"],"src":"Joan’s Formative mini-exam 1, answers document, Q9 · Joan’s feedback in class, Tue 20 Oct 2026 [1:32:35]","why":"Teach-back — Ask, Build, Check, as in the CLS."},{"id":"qd9fcb093f2","quiz":"form1","sys":"found","pts":1,"q":"The benefit of an enteric-coated tablet is that it","qh":"<p>The benefit of an enteric-coated tablet is that it</p>","qt":"The benefit of an enteric-coated tablet is that it","imgs":[],"type":"mcq","her":1,"opts":["Offers resistance to the digestive action of the stomach","Cab be administered whole or crushed","Can pass through the stomach without harming it","Can be absorbed in the stomach"],"key":["Offers resistance to the digestive action of the stomach"],"src":"Joan’s Formative mini-exam 1, answers document, Q10 · Joan’s feedback in class, Tue 20 Oct 2026 [1:32:58]","why":"EC = enteric-coated: the coating resists the stomach and dissolves in the small intestine, because the drug irritates or ulcerates the stomach. C is close, but A is the best answer — watch for bold or underlined words."},{"id":"q55eb0fc6f2","quiz":"form1","sys":"law","pts":1,"q":"A person can legally refuse to take their medication.","qh":"<p>A person can legally refuse to take their medication.</p>","qt":"A person can legally refuse to take their medication.","imgs":[],"type":"mcq","her":1,"opts":["True. This should be documented","False. This is an example of non-adherence","True. The family members need to be notified","False. Only patients who are in the community can do this"],"key":["True. This should be documented"],"src":"Joan’s Formative mini-exam 1, answers document, Q11 · Joan’s feedback in class, Tue 20 Oct 2026 [1:34:32]","why":"Anyone can legally refuse, so the two 'False' answers go. Family need not be told (her: you don't notify my husband). Document it and report it to the prescriber. The exception — the Mental Health (Compulsory Assessment and Treatment) Act — is not in this question."},{"id":"qaff55f32bf","quiz":"form1","sys":"calc","pts":1,"q":"Pati, 3months old, weighs 11kg and is prescribed penicillin 20mg/kg every 8 hours. How many mg should be given in a single dose? (You do not need to show your working)","qh":"<p>Pati, 3months old, weighs 11kg and is prescribed penicillin 20mg/kg every 8 hours. How many mg should be given in a single dose? (You do not need to show your working)</p>","qt":"Pati, 3months old, weighs 11kg and is prescribed penicillin 20mg/kg every 8 hours. How many mg should be given in a single dose? (You do not need to show your working)","imgs":[],"type":"mcq","her":1,"opts":["100mg","50mg","220mg","300mg"],"key":["220mg"],"src":
