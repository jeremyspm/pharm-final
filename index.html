*laws made by parliament**","of":[0]},{"t":"**Regulation**: under an Act: **how the Acts are enforced**","of":[1]},{"t":"**Amendment**: **changes** to an Act or Regulation","of":[2]},{"t":"**Policy**: **enforceable rules** within an organisation","of":[3]},{"t":"**Guideline**: **best practice advice**","of":[4]}]}]},"q94a244bbf2":{"id":"legal:name the three key acts governing medications","title":"Three key Acts for medicines","hook":"Medicines 1981, Misuse of Drugs 1975, HPCAA 2003.","groups":[{"q":"The Acts, and their regulations","facts":[{"t":"**Medicines Act 1981** + **Medicines Regulations 1984**","of":[0]},{"t":"**Misuse of Drugs Act 1975** + **Regulations 1977**","of":[1]},{"t":"**Health Practitioners Competence Assurance Act 2003**","of":[2]}]}]},"q81982c1004":{"id":"legal:what does the medicines act 1981 cover","title":"What the Medicines Act 1981 does","hook":"Covers, classifies, sets the rules, names the prescribers.","groups":[{"q":"Five points","facts":[{"t":"Covers **all medicines**","of":[0]},{"t":"Includes **cosmetics** and **supplements** with **therapeutic claims**","of":[1]},{"t":"**Classifies medicines**: prescription to general sale","of":[2]},{"t":"Rules for **clinical trials**, **manufacturing**, **advertising** and **sale**","of":[3]},{"t":"**Defines who can prescribe**","of":[4]}]}]},"q70e651e312":{"id":"legal:what does the misuse of drugs act","title":"What the Misuse of Drugs Act 1975 does","hook":"Classes, prescribing, penalties, precursors; locked and double-locked.","groups":[{"q":"Four points","facts":[{"t":"**Defines drug classes**: **controlled** vs uncontrolled","of":[0]},{"t":"**Regulates prescribing** of controlled drugs","of":[1]},{"t":"**Penalties** and **police enforcement powers**","of":[2]},{"t":"**Controls precursor substances**","of":[3]}]},{"q":"The two storage rules","facts":[{"t":"Medication rooms **locked when not in use**","of":[4]},{"t":"Controlled drugs **double-locked**","of":[5]}]}]},"q0a20414b21":{"id":"legal:describe the three classes of controlled drug","title":"Classes A, B and C","hook":"A = never prescribed; B = double-locked; C = prescribed normally.","groups":[{"q":"Class A","facts":[{"t":"**High potential for abuse**; **very high risk of harm**","of":[0]},{"t":"**Not prescribed** for medical use: **heroin**, **cocaine**, **methamphetamine**","of":[0]}]},{"q":"Class B","facts":[{"t":"**Drugs of dependence**; **high risk of harm**; a **double-locked safe**","of":[1]},{"t":"e.g. **morphine**, **methylphenidate** (**Ritalin**)","of":[1]}]},{"q":"Class C","facts":[{"t":"**Lower potential for abuse**; **moderate risk of harm**","of":[2]},{"t":"**Prescribed “normally”**: **codeine**, **diazepam**","of":[2]}]}]},"q0efe2d5f66":{"id":"legal:define possession and supply under the misuse","title":"Possession and supply","hook":"Having it vs handing it on.","groups":[{"q":"The rule","facts":[{"t":"Unlawful to **use, possess or supply** without **legal authority**","of":[0]}]},{"q":"The two terms","facts":[{"t":"**Possession**: having it **in your control**: pocket, bag, car","of":[1]},{"t":"Only some may lawfully possess: **health professionals**, **emergency services**","of":[1]},{"t":"**Supply**: **making a drug available** to someone: **giving or selling**","of":[2]}]}]},"qaeedcf842d":{"id":"legal:name the four regulators of nz medications","title":"Four regulators of NZ medicines","hook":"Medsafe safety, PHARMAC funding, HRC trials, CARM reactions.","groups":[{"q":"Each, and its job","facts":[{"t":"**Medsafe**: **safety and quality**","of":[0]},{"t":"**PHARMAC**: **funding and subsidy** decisions","of":[1]},{"t":"**Health Research Council**: **clinical trial approval**","of":[2]},{"t":"**CARM**: monitors **adverse reactions**","of":[3]}]}]},"qdc08710318":{"id":"legal:what is the purpose of the hpcaa","title":"The HPCAA: purpose, four requirements","hook":"Scope, APC, competence, accountability.","groups":[{"q":"Purpose","facts":[{"t":"**Protects public safety**: **ongoing competence** and **fitness to practise**","of":[0]},{"t":"Limits **restricted activities** to registered practitioners","of":[0]}]},{"q":"Four requirements","facts":[{"t":"A **scope of practice**, set by the **Nursing Council**","of":[1]},{"t":"An **Annual Practising Certificate** (**APC**)","of":[2]},{"t":"**Clinical and cultural competence** (portfolios)","of":[3]},{"t":"**Legal accountability** through **disciplinary pathways**","of":[4]}]}]},"qcb69c7b021":{"id":"legal:name the six pou of the ncnz","title":"The six pou of competence","hook":"Māori health, cultural safety, relationships, knowledge, care, leadership.","groups":[{"q":"The six pou","facts":[{"t":"**Māori Health**","of":[0]},{"t":"**Cultural Safety**","of":[1]},{"t":"**Whanaungatanga and Communication**","of":[2]},{"t":"**Pūkengatanga and Evidence-Informed Nursing Practice**","of":[3]},{"t":"**Manaakitanga and People-Centred Care**","of":[4]},{"t":"**Rangatiratanga and Leadership**","of":[5]}]}]},"qb5ec936270":{"id":"legal:define cultural safety as the nursing council","title":"Cultural safety (Nursing Council)","hook":"Decided by THAT person or family, not the nurse.","groups":[{"q":"Definition","facts":[{"t":"Effective practice with a person or family from **another culture**","of":[0]},{"t":"**Determined by that person or family**","of":[0]}]},{"q":"Culture includes","facts":[{"t":"**Age**, **gender**, **sexual orientation**, **occupation**, **socioeconomic status**","of":[1]},{"t":"**Ethnic origin**, **migrant experience**, **religious** belief, **disability**","of":[2]}]},{"q":"The nurse","facts":[{"t":"Has done **reflection on their own cultural identity**","of":[3]}]}]},"q651557ac0f":{"id":"legal:how does the rn scope of practice","title":"RN scope and medicines: six points","hook":"Law, judgement, talk, Te Tiriti, delegate, own it.","groups":[{"q":"Six points","facts":[{"t":"**Follow laws and policies** to administer safely","of":[0]},{"t":"**Clinical judgement** on needs and responses","of":[1]},{"t":"**Communicate** with **prescribers**, **pharmacists**, patients","of":[2]},{"t":"Uphold **Te Tiriti** and **cultural safety**","of":[3]},{"t":"**Delegate** medication tasks **appropriately**","of":[4]},{"t":"**Professionally accountable** for **every medication**","of":[5]}]}]},"q51868529c3":{"id":"legal:list the eight principles of the ncnz","title":"The Code of Conduct: eight principles","hook":"Dignity, culture, partnership, safe care, privacy, colleagues, integrity, public trust.","groups":[{"q":"The eight principles","facts":[{"t":"1 Respect **dignity and individuality**","of":[0]},{"t":"2 Respect **cultural needs and values**","of":[1]},{"t":"3 **Work in partnership**","of":[2]},{"t":"4 **Safe and competent care**","of":[3]},{"t":"5 **Privacy and confidentiality**","of":[4]},{"t":"6 **Work respectfully with colleagues**","of":[5]},{"t":"7 **Act with integrity**","of":[6]},{"t":"8 Maintain **public trust**","of":[7]}]}]},"q1dc658140d":{"id":"legal:give a pharmacology example for code of","title":"Code of Conduct principles 2, 4 and 7","hook":"Check the ingredients, double-check, report honestly.","groups":[{"q":"One example each","facts":[{"t":"**Principle 2**: check ingredients like **gelatin capsules**","of":[0]},{"t":"**Principle 4**: **double-checking with another nurse** first","of":[1]},{"t":"**Principle 7**: **report medication errors honestly** and **immediately**","of":[2]}]}]},"q655d26f464":{"id":"legal:name the seven m ori values in","title":"NZNO ethics: seven Māori values","hook":"Rangatiratanga, Manaakitanga, Tika, Whanaungatanga, Wairuatanga, Kotahitanga, Kaitiakitanga.","groups":[{"q":"The seven values","facts":[{"t":"**Rangatiratanga**: **self-determination**","of":[0]},{"t":"**Manaakitanga**: **mana is upheld** through **kindness, respect and care**","of":[1]},{"t":"**Tika**: **what is right and proper**","of":[2]},{"t":"**Whanaungatanga**: **relationships**, **whānau connections**","of":[3]},{"t":"**Wairuatanga**: **spiritual existence** is essential","of":[4]},{"t":"**Kotahitanga**: **unity** and **collective action**","of":[5]},{"t":"**Kaitiakitanga**: **guardianship**: **protect** land and resources","of":[6]}]}]},"q3c83a36951":{"id":"legal:name the nine western values in the","title":"NZNO ethics: nine Western values","hook":"Autonomy, do good, do no harm, justice, privacy, truth, faithfulness, environment, professionalism.","groups":[{"q":"The nine values","facts":[{"t":"**Autonomy**: **informed choices**","of":[0]},{"t":"**Beneficence**: **doing good**","of":[1]},{"t":"**Non-maleficence**: **causing no harm**","of":[2]},{"t":"**Justice**: treating people **fairly and equitably**","of":[3]},{"t":"**Confidentiality**: **protecting the privacy** of information","of":[4]},{"t":"**Veracity**: **truthful and honest**","of":[5]},{"t":"**Fidelity**: **keep promises**, **maintain trust**","of":[6]},{"t":"**Guardianship of environment and resources**","of":[7]},{"t":"**Being professional**: **accountability**, **integrity**, **competence**","of":[8]}]}]},"q1e89957e40":{"id":"legal:state the three exceptions to veracity and","title":"Exceptions to veracity and confidentiality","hook":"Truth can wait for harm, choice or emergency; secrets give way to risk.","groups":[{"q":"Veracity exceptions","facts":[{"t":"**Therapeutic privilege**: withholding to **prevent serious harm**","of":[0]},{"t":"**Patient preference**: they ask **not to know**","of":[1]},{"t":"**Emergencies**: e.g. **unconscious**, needing life-saving treatment","of":[2]}]},{"q":"Confidentiality may be broken for","facts":[{"t":"**Risk of harm to self** (self-inflicted)","of":[3]},{"t":"Risk of harm to self **by another**","of":[4]},{"t":"**Risk of harm to another person**","of":[5]}]}]},"qcc48373dfb":{"id":"legal:summarise the four key documents by type","title":"Four key documents compared","hook":"HPCAA is law; the Council’s standards and code are enforced; NZNO’s ethics guide.","groups":[{"q":"The four","facts":[{"t":"**HPCAA 2003**: **legislation**; **Parliament**; **enforceable**","of":[0]},{"t":"**Standards of Competence**: what nurses must **be able to do**; needed for an **APC**","of":[1]},{"t":"**Code of Conduct**: how nurses **must behave**; NCNZ can **discipline**","of":[2]},{"t":"**NZNO Code of Ethics**: how to **act ethically**; a **guideline**","of":[3]}]}]},"qf16c2594de":{"id":"legal:summarise the three legal cases against nurses","title":"Three cases against nurses","hook":"Stole it, stole it, hid it: all three lost their practice.","groups":[{"q":"Nurse P (2005)","facts":[{"t":"Took **morphine** capsules for **his own use**; replaced them with **sucrose**","of":[0]},{"t":"**Convicted of theft**; **de-registered**","of":[0]}]},{"q":"Nurse H (2006)","facts":[{"t":"**Stole** vials of **morphine, pethidine and fentanyl**","of":[1]},{"t":"**Registration cancelled**","of":[2]}]},{"q":"Nurse D (2013)","facts":[{"t":"The **wrong medication**; **took two days to report**; the **patient died**","of":[3]},{"t":"**Guilty of professional misconduct**: **suspended**, **fined**","of":[4]}]}]},"q2cd1212eef":{"id":"legal:what does medication legislation mean for the","title":"What medicine law means for an RN","hook":"No prescribing, valid scripts only, know the rules, no misuse, own your mistakes.","groups":[{"q":"Five points","facts":[{"t":"Nurses **cannot prescribe**","of":[0]},{"t":"Prescription medicines only with a **valid prescription**","of":[1]},{"t":"Know the **legislation** and your **organisation’s policies**","of":[2]},{"t":"**Misuse of that access** is **unsafe and illegal**","of":[3]},{"t":"**Always admit mistakes**; **ask for help**","of":[4]}]}]},"qd51b5e77e3":{"id":"devmkt:give the cost timescale and attrition figures","title":"Drug development: cost, time, attrition","hook":"Millions of dollars, 10–20 years, 5 in 5000.","groups":[{"q":"The figures","facts":[{"t":"**Millions of dollars**","of":[0]},{"t":"**10–20 years**","of":[1]},{"t":"Only **5 in 5000** compounds reach **human testing**","of":[2]}]}]},"q689f1952c6":{"id":"devmkt:name the five key phases of the","title":"The drug development pathway","hook":"Discover → Preclinical → Clinical trials → Medsafe review → Post-market.","groups":[{"q":"The five phases","facts":[{"t":"**Discovery & Development**: **promising compounds**","of":[0]},{"t":"**Preclinical research**: **safety testing** before humans","of":[1]},{"t":"**Clinical Trials**: studies **involving people**","of":[2]},{"t":"**Medsafe Review**: **approve or reject**","of":[3]},{"t":"**Post-Market Monitoring**: **safety surveillance** after release","of":[4]}]}]},"q4e574e4f80":{"id":"devmkt:which three bodies must a developer apply","title":"Three bodies before a trial starts","hook":"Medsafe, SCOTT, HDEC.","groups":[{"q":"Each, and what it assesses","facts":[{"t":"**Medsafe**: **preclinical studies**, **pharmacokinetics and pharmacodynamics**, **quality**","of":[0]},{"t":"**SCOTT**: the **science**, **safety** and **trial design**","of":[1]},{"t":"**HDEC**: **ethical compliance**","of":[2]}]},{"q":"What developers submit","facts":[{"t":"**Animal study data**, **prior human research**, **study plans**","of":[3]}]}]},"q75a516a445":{"id":"devmkt:describe the four phases of clinical research","title":"The four phases of clinical research","hook":"A funnel: 70%, 33%, then 25–30% get through.","groups":[{"q":"The four phases","facts":[{"t":"**Phase 1**: **safety and dosage**; **20–100** people; ~**70%** progress","of":[0]},{"t":"**Phase 2**: **efficacy and side effects**; **several hundred**; ~**33%**","of":[1]},{"t":"**Phase 3**: **confirming safety**; **300–3000**; **25–30%**","of":[2]},{"t":"**Phase 4**: **long-term safety**; **several thousand**; years","of":[3]},{"t":"The phases act like a **funnel**","of":[4]}]}]},"q5623fc4ea7":{"id":"devmkt:what five things do developers determine when","title":"Designing a clinical trial: five decisions","hook":"Who, how many, how long, how fair, what dose, what data.","groups":[{"q":"The five","facts":[{"t":"**Who qualifies**: **inclusion and exclusion criteria**","of":[0]},{"t":"**Sample size** and **study duration**","of":[1]},{"t":"Ways to **reduce bias**: **control groups**","of":[2]},{"t":"**Dosage and administration**","of":[3]},{"t":"**Data collection and analysis**","of":[4]}]}]},"qeae2073b54":{"id":"devmkt:name the four key ethical issues in","title":"Ethics in clinical trials","hook":"Today’s patient vs tomorrow’s: consent, placebo, randomising, the vulnerable.","groups":[{"q":"The central tension","facts":[{"t":"**Care for current patients** vs **advance science** for **future patients**","of":[0]}]},{"q":"The four issues","facts":[{"t":"**Informed consent**","of":[1]},{"t":"**Use of placebos**","of":[2]},{"t":"**Use of randomisation**","of":[3]},{"t":"**Protection of vulnerable patients**","of":[4]},{"t":"Human research has a history of **serious abuses**","of":[5]}]}]},"qfd44ddb31d":{"id":"devmkt:what must informed consent for a clinical","title":"Informed consent in a trial","hook":"Voluntary, competent, informed; you can always leave.","groups":[{"q":"What consent must be","facts":[{"t":"**Voluntary, competent, and adequately informed**","of":[0]},{"t":"It can be **withdrawn at any time**","of":[5]}]},{"q":"What they must understand","facts":[{"t":"The **risks and potential benefits**","of":[1]},{"t":"**All study procedures**","of":[2]},{"t":"Participation is **voluntary**","of":[3]},{"t":"Research is **not** the same as **personalised treatment**","of":[4]}]}]},"q9c91d2b532":{"id":"devmkt:when is placebo use ethically acceptable and","title":"When a placebo is acceptable","hook":"Only when nobody loses a proven treatment.","groups":[{"q":"What a placebo is for","facts":[{"t":"Given to **control** participants to show the **effect of a new drug**","of":[0]}]},{"q":"Problematic","facts":[{"t":"If recipients **risk harm** or **worsening**","of":[1]}]},{"q":"Acceptable","facts":[{"t":"When **no proven treatment exists**","of":[2]},{"t":"Or **necessary for methodology**, without **serious harm**","of":[3]}]}]},"qe7b0d0c65d":{"id":"devmkt:what ethical issues does randomisation raise","title":"The ethics of randomisation","hook":"Fair only while nobody knows which is better.","groups":[{"q":"Why it is used","facts":[{"t":"Randomising to treatment or placebo increases **validity**","of":[0]}]},{"q":"The ethical issues","facts":[{"t":"It may **deny** the **currently best-known treatment**","of":[1]},{"t":"Needs **genuine professional justification** that neither is **known to be better**","of":[2]}]}]},"q6b531f86ec":{"id":"devmkt:what issues arise in protecting vulnerable patients","title":"Protecting vulnerable trial participants","hook":"Too strict pushes trials offshore; too protective removes the choice.","groups":[{"q":"The issues","facts":[{"t":"Strict rules push trials to **low-protection countries**","of":[0]},{"t":"**Over-protection** can **conflict with autonomy**","of":[1]},{"t":"Trials may **reimburse participants**","of":[2]},{"t":"Higher concern in **cancer treatment trials**","of":[3]}]}]},"q26967aa365":{"id":"devmkt:name the five types of medication advertising","title":"Five types of medicine advertising","hook":"Direct-to-consumer, disease awareness, reminder, professional, digital.","groups":[{"q":"The five","facts":[{"t":"**Direct-to-consumer**: **branded prescription medicines** to the **public**","of":[0]},{"t":"**Health-seeking** (**disease awareness**): about a **condition**","of":[1]},{"t":"**Reminder** ads: the **drug name only**","of":[2]},{"t":"**Professional/journal ads**: for **healthcare professionals**","of":[3]},{"t":"**Digital & social media**: **influencers**; stresses **benefits** over risks","of":[4]}]}]},"qde22877495":{"id":"devmkt:what is unusual about medication advertising in","title":"What is unusual about NZ","hook":"Only NZ and the USA allow it.","groups":[{"q":"The answer","facts":[{"t":"One of **only two developed countries** that allow ads **direct to the consumer**","of":[0]},{"t":"The other is the **USA**","of":[1]}]}]},"qfce25f85fc":{"id":"devmkt:what does the therapeutic and health advertising","title":"The advertising code: its rules","hook":"True, proven, balanced, safe, genuine, approved.","groups":[{"q":"The requirements","facts":[{"t":"**Responsible, truthful**, **not misleading**","of":[0]},{"t":"Claims **substantiated** with **credible evidence**","of":[1]},{"t":"Must not **exaggerate the benefits**","of":[2]},{"t":"**Key safety information** included","of":[3]},{"t":"**Testimonials** must be **genuine**","of":[4]},{"t":"**Endorsements** can’t imply **guaranteed outcomes**","of":[5]},{"t":"**Unapproved medicines** can’t be advertised, **even to health professionals**","of":[6]}]}]},"q18b2eafdf4":{"id":"devmkt:how can a health professional accidentally breach","title":"Accidental advertising, and the exemption","hook":"Praise a brand out loud = advertising; generic advice = exempt.","groups":[{"q":"How","facts":[{"t":"Advertising includes **verbal advertising**","of":[0]},{"t":"**Recommending or praising** one **brand** over another","of":[0]},{"t":"Brand information must be **factual** and **balanced**","of":[1]}]},{"q":"What is exempt","facts":[{"t":"**Individualised advice**, using **generic names**","of":[2]}]}]},"qec5018c848":{"id":"allergy:list the six steps of the ascia","title":"The ASCIA anaphylaxis plan, six steps","hook":"Flat, adrenaline, 111, family, more at 5 minutes, hospital for 4 hours.","groups":[{"q":"In order","facts":[{"t":"1 **Lay the person flat**: **do not** let them **stand or walk**","of":[0]},{"t":"2 **Give the adrenaline device**","of":[1]},{"t":"3 **Phone ambulance**: **111**","of":[2]},{"t":"4 **Phone family** or an emergency contact","of":[3]},{"t":"5 **Further adrenaline** if **no response after 5 minutes**","of":[4]},{"t":"6 To **hospital** for **at least 4 hours** of observation","of":[5]}]}]},"q21efdbdc32":{"id":"allergy:what are the positioning rules in step","title":"Anaphylaxis positioning, and exceptions","hook":"Flat, unless unconscious, pregnant, struggling to breathe, or a small child.","groups":[{"q":"The rule","facts":[{"t":"Lay them **flat**: **do not** allow them to **stand or walk**","of":[0]}]},{"q":"The three exceptions","facts":[{"t":"**Unconscious or pregnant**: the **recovery position** (pregnant: **left side**)","of":[1]},{"t":"If **breathing is difficult**: **sit with legs outstretched**","of":[2]},{"t":"**Hold young children flat**, not upright","of":[3]}]}]},"qbf83ad336c":{"id":"allergy:name the seven signs of anaphylaxis on","title":"Seven signs of anaphylaxis","hook":"Breathing, throat, voice, wheeze, collapse, a floppy child, the tongue.","groups":[{"q":"The seven signs","facts":[{"t":"**Difficult or noisy breathing**","of":[0]},{"t":"**Swelling or tightness in the throat**","of":[1]},{"t":"**Difficulty talking** or a **hoarse voice**","of":[2]},{"t":"**Wheeze** or **persistent cough**","of":[3]},{"t":"**Persistent dizziness** or **collapse**","of":[4]},{"t":"**Pale and floppy** (young children)","of":[5]},{"t":"**Swelling of the tongue**","of":[6]}]}]},"q0a34242858":{"id":"allergy:name the signs and the actions for","title":"A mild to moderate allergic reaction","hook":"Stay, find the adrenaline, antihistamine, call the family.","groups":[{"q":"Signs","facts":[{"t":"**Swelling of lips, face and eyes**; **hives or welts**; **tingling mouth**","of":[0]},{"t":"**Abdominal pain and vomiting**: **anaphylaxis** signs for **insect allergy**","of":[1]}]},{"q":"Actions","facts":[{"t":"**Stay with the person**; **call for help**","of":[2]},{"t":"**Locate the adrenaline** device","of":[3]},{"t":"Give an **antihistamine**; phone the **family**","of":[4]},{"t":"Insect: **flick out the sting**; tick: **freeze the tick**","of":[5]}]}]},"qee7c849284":{"id":"allergy:a person with known asthma and food","title":"Asthma + allergy: adrenaline first","hook":"If in doubt, give the adrenaline.","groups":[{"q":"What is given first","facts":[{"t":"The **adrenaline device first**, then the **asthma reliever**","of":[0]},{"t":"Known asthma + allergy, exposed, **sudden breathing difficulty**","of":[1]}]},{"q":"Why it matters","facts":[{"t":"Anaphylaxis can occur **without skin symptoms**","of":[2]},{"t":"**If in doubt, give the adrenaline device**","of":[3]}]}]},"qeb176440f6":{"id":"allergy:when should cpr be commenced and what","title":"CPR, and an accidental injection","hook":"Unresponsive = CPR. A wasted device = use another.","groups":[{"q":"CPR","facts":[{"t":"**Commence CPR** if **unresponsive** or **not breathing normally**","of":[0]}]},{"q":"A device accidentally activated","facts":[{"t":"**Use another adrenaline device** if available","of":[1]},{"t":"Accidentally injected: contact the **poisons information centre**","of":[2]}]}]}};

  if(q.prefs){

    q.prefs = q.prefs.map(p=>({...p, i:at(p.i-1)+1})).filter(p=>{ const k=p.i+'|'+p.t; return p.i>0 && !seen.has(k) && seen.add(k); });

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };

const CLOSED = DATA.questions.filter(q=>!q.saq);
/* a question flagged nm stays in the bank (Learn, Pick my rep) but is never dealt into a
   MOCK paper — course-admin questions that are not exam material (sim.config.mjs NO_MOCK) */
const MOCKABLE = CLOSED.filter(q=>!q.nm);
const ESSAYS = DATA.questions.filter(q=>q.saq);
const MOCK_ESSAYS = ESSAYS.filter(q=>!q.nm);   // written questions a mock may deal (authored noMock stays out)
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n, pool=MOCKABLE){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of pool) share[q.sys]=(share[q.sys]||0)+1/pool.length;
  for(const sys of Object.keys(share)){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(pool.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(pool, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
/* How many a Learn deal hands out is HIS call (the chips on the Learn door), saved in this
   browser. 'all' is the whole pool, least-seen first — so a run that stops halfway and is
   dealt again leads with the questions it never reached. A mock test keeps its own size. */
const NOPTS = [12,25,50,100,'all'];
const CAP = () => S.n==='all' ? Infinity : S.n;
const howMany = pool => Math.min(CAP(), pool);
function dealMini(n=META.shape.mini||12, pool=MOCKABLE){ return dealStratified(n, pool) }
function dealSys(s,n){ return shuffle(pickN(CLOSED.filter(q=>q.sys===s), n, new Set())) }
/* the full mock is the REAL paper's shape (META.shape): that many closed questions, then
   the written section — one case-study question per case pack, rotating with each full
   sitting, and the rest from the written questions, least-seen first. A bank with fewer
   written questions than the paper has deals what it has; the home screen says so. */
function dealFull(){
  const closed = dealStratified(META.shape.closed);
  const nth = S.scores.filter(s=>s.mode==='full').length;
  if(META.shape.saqMarks){
    /* the paper publishes marks, not a count: deal least-seen written questions, spread
       across the groups, until their marks reach the total (never past it by a whole question) */
    const out=[]; let m=0; const used=new Set();
    const ranked=pickN(MOCK_ESSAYS, MOCK_ESSAYS.length, new Set());
    for(let pass=0; pass<2 && m<META.shape.saqMarks; pass++) for(const q of ranked){
      if(used.has(q.id)||m+q.pts>META.shape.saqMarks) continue;
      if(!pass && out.some(x=>x.quiz===q.quiz)) continue;      // first pass: one per topic
      out.push(q); used.add(q.id); m+=q.pts; if(m>=META.shape.saqMarks) break; }
    return closed.concat(shuffle(out));
  }
  const saqs = (DATA.cases||[]).slice(0, META.shape.saq).map(c=>mkCaseQ(c, c.questions[nth % c.questions.length]));
  const rest = Math.max(0, META.shape.saq - saqs.length);
  return closed.concat(saqs, shuffle(pickN(MOCK_ESSAYS, rest, new Set())));
}
function mkCaseQ(c, cq){
  return { id:'case-'+c.id+'-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case:'+c.id, sys:c.sys, type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:c.name+' — model answer is the tool’s'},
    scenario: c.scenario };
}
const FULL_SAQ = () => Math.min(META.shape.saq||0, (DATA.cases||[]).length + MOCK_ESSAYS.length);
/* the misses pile, worst first: once four or more have been missed twice, only those */
function missPool(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  return CLOSED.filter(q=>ids.includes(q.id));
}
function dealMisses(n=12){ return shuffle(missPool()).slice(0,n) }
/* the ticked quizzes, whole (written questions included), in the order the list shows
   them — one run, no cap: you chose the quizzes, you get their questions */
function dealPick(){

  return DATA.quizzes.filter(z=>on.has(z.id)).flatMap(z=>DATA.questions.filter(q=>q.quiz===z.id));
}

function saveRun(){

function resumeLearn(){
  const r=LS('resume');

  const deck=r&&Array.isArray(r.ids)?r.ids.map(id=>byId.get(id)).filter(Boolean):[];
  if(!deck.length){SV('resume',null);home();return}
  enterSit('learn');

function start(mode,learn=false){

  if(learn){const r=LS('resume');
    if(r&&r.ids&&r.ids.length&&!confirm(`You have a Learn run waiting (Q${Math.min((r.i|0)+1,r.ids.length)} of ${r.ids.length} · ${r.label}). Drop it and start this one?`))return}

    if(learn){deck=dealMini(howMany(CLOSED.length),CLOSED);label=deck.length===CLOSED.length?'the whole bank':`${deck.length} from the bank`}
    else{deck=dealMini();label='mini mock'}}

  else if(mode==='miss'){deck=dealMisses(learn?CAP():12);label=learn?'my misses':'redo misses'}

    label=k===1?(DATA.quizzes.find(z=>z.id===S.pick[0])||{}).name||'1 quiz':`${k} quizzes · ${deck.length} Q`}
  else if(mode.startsWith('quiz:')){const z=DATA.quizzes.find(x=>x.id===mode.slice(5));
    deck=DATA.questions.filter(q=>q.quiz===z.id);label=z.name}
  else if(mode.startsWith('sys:')){const s=mode.slice(4), pool=CLOSED.filter(q=>q.sys===s).length;
    deck=dealSys(s,howMany(pool));label=`${deck.length===pool?'all ':''}${deck.length} ${sysTag(s)}`}

  enterSit(learn?'learn':'mock');

  if(mode==='mini'&&DATA.chains.length){warmup();return}
  renderQ();
}

function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){

  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}

  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── learn mode ────────────────────────────────────────────────────────
   The same deck and the same marking, but per question: Check marks it in place and
   the answer, her slide and the matched video sit right under it — the results
   accordion brought forward to the moment you still care. Slide and video can be
   opened BEFORE answering; that counts as a peek, and a right answer after a peek
   does not clear a miss. Check with nothing picked = "show me" = a miss. Learn
   sittings feed the misses pile and the least-seen dealer, never the score chart. */
function learnChipsHTML(q){
  const chips=[];
  if(q.vid)chips.push(`<button class="qa" data-act="vid">▶ Video · from ${mmss(Number.isInteger(q.vid.at)?q.vid.at:0)}</button>`);
  for(const r of q.refs)chips.push(`<button class="qa" data-act="${r.k}">${REF[r.k].ic} ${REF[r.k].lbl}${r.k==='patton'?' p. '+r.pp:''}</button>`);
  if(hasHer(q))chips.push('<button class="qa" data-act="hl">✅ Her worked answer</button>');
  const hint=chips.length?(SIT.chk[q.id]?'':'<span class="hint">open before or after you answer</span>')
    :`<span class="hint">${NOREF_HINT}</span>`;
  return `<div class="lres" data-qid="${q.id}">${chips.join('')}${hint}<div class="qr-pane" hidden></div></div>`;

/* resources open by themselves for: written questions, skipped ones, anything not fully right */
const learnOpen=(q,chk)=>!chk.r||!SIT.ans[q.id]||chk.r.got<chk.r.tot;
function learnCheck(){

  if(r){ if(!a||r.got<r.tot)S.miss[q.id]=(S.miss[q.id]||0)+1; else if(!peeked&&S.miss[q.id])delete S.miss[q.id]; }
  SV('miss',S.miss);SV('seen',S.seen);

function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
/* dropdown: only her marked option is right. Typed: every accepted spelling is. */
function blankOK(q,b,v){
  /* phones type curly quotes; a trailing full stop is not a wrong answer */
  const nrm=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  const x=nrm(v);if(!x)return false;
  const also=(b.also||[]).some(o=>nrm(o)===x);
  return q.bk==='dd' ? (x===nrm(b.correct)||also) : (b.options.some(o=>nrm(o)===x)||also);
}
function blankLabel(b,i){return b.ctx?`${b.ctx} ___`:(b.label&&!/^Answer \d+:?$/.test(b.label)?b.label.replace(/:$/,''):`Blank ${i+1}`)}

function partRefHTML(q,i){

const AI_LBL='🤖 Explain like I’m stupid + quiz me';
const AI_SHAPE={mcq:'multiple choice',tf:'true or false',multi:'tick every answer that applies',match:'matching',cloze:'fill the blanks / dropdowns',essay:'a written answer marked one mark per step'};
const aiSteps=(extra,shape,stop)=>`Do this, in order:\n1. Explain it like I’m stupid: one everyday analogy, then map every part of the analogy back to the real term.\n2. Use my lecturer’s exact terms from above. Those words earn the marks; the analogy is scaffolding.\n${extra?'3. '+extra+'\n':''}${extra?4:3}. Then give me a 5-question blind quiz on it, ONE question at a time, with instant feedback after each answer, ${shape}.\n${stop}`;
function aiQuestionPrompt(q,withFig){
  const a=SIT.ans[q.id];
  const you=a?(a.text||((a.sel||[]).map(i=>optLabel(q,q.opts[i])).join(', ')||Object.values(a.pick||{}).join(', '))):'';
  const L=[AI_CTX+(q.authored?' This is a practice question a study tool wrote from my lecturer’s slides.':' This is one of my lecturer’s own practice questions.')+' I want to understand it, not memorise the answer.','',`Question: ${flatStem(q)}`];
  if(q.opts&&q.opts.length)L.push(`Options: ${q.opts.map(o=>optLabel(q,o)).join(' | ')}`);
  if(q.saq)L.push('The model answer, one mark per step: '+(q.saq.full||q.saq.steps).map((s,i)=>`(${i+1}) ${s}`).join(' '));
  else L.push(`Correct answer: ${keyText(q)}`);
  if(q.why)L.push(`The study tool’s explanation: ${q.why}${q.src?' (source: '+q.src+')':''}`);
  L.push(`My answer: ${you||'(none — I didn’t know)'}`);
  if(q.imgs&&q.imgs.length)L.push(withFig?'The question’s figure is pasted with this message. Read it before answering — the question is about it.':'This question has a diagram I can’t paste. Don’t guess what it shows; work from the text.');
  for(const r of q.refs||[]){
    if(r.t)L.push(`${r.k==='patton'?'The textbook says':r.k==='course'?'A file posted in my course (not by my lecturer) says':'My lecturer’s notes say'} (verbatim): “${r.t}” — ${r.src}`);
    else if(r.k==='slide')L.push(withFig?`My lecturer’s slide on this is pasted with this message — ${r.src}. Her wording on it is what earns the marks.`:`My lecturer’s slide on this: ${r.src} (an image, I can’t paste it).`);
  }
  if(hasHer(q)){const h=DATA.helpline[q.hl];L.push('','Her own worked answer for this topic, verbatim (her CAPITALS are the mark-earning words):',h.parts.map(p=>p.h+'\n'+p.t).join('\n'));}
  L.push('',aiSteps(you?'In one line, say what misconception my answer suggests.':'',`in the shape she uses (${AI_SHAPE[q.type]||'multiple choice'})`,'Stay inside this question and her notes. Don’t teach past them.'));
  return L.join('\n');
}
/* topic-first: the focus row's own `done` / `ask` / `cap` become the AI's brief,
   plus her worked helpline answer where she posted one */
function aiTopicPrompt(f){
  const L=[AI_CTX+` Topic: ${f.t} (${SYS[f.sys]||f.sys}).`,'','A study tool read my lecturers’ slides and their practice questions and wrote down the level. Here is what I have to be able to DO:',`“${f.done}”`,`How it gets asked: “${f.ask}”`];
  if(f.cap)L.push(`Where it ends — do NOT go past this: “${f.cap}”`);
  const h=(DATA.helpline||{})[f.id];
  if(h){let t=h.parts.map(p=>p.h+'\n'+p.t).join('\n');if(t.length>3000)t=t.slice(0,3000)+' …(trimmed)';
    L.push('','My lecturer’s own worked answer for this topic, verbatim (the CAPITALS are the mark-earning words):',t);}
  L.push('',aiSteps('','in the shapes described under “how it gets asked” above','Stay inside that level. Don’t teach past the “where it ends” line.'));
  return L.join('\n');
}
/* the question's own figures — or, when it has none, her slide (the build guarantees a
   question never carries both) — drawn onto ONE white png, each with its label, so a single
   paste lands every picture the AI needs. Same-origin images, so the canvas stays clean. */
function aiFigures(q){
  const f=[];
  for(const n of q.imgs||[])f.push({src:'img/'+n,label:q.imgs.length>1?'Question figure '+(f.length+1):'Question figure'});
  for(const r of q.refs||[])if(r.k==='slide'&&r.slide)f.push({src:'img/slides/'+r.slide,label:'My lecturer’s slide — '+r.src});
  return f;
}
function aiFigureBlob(q){
  const srcs=aiFigures(q); if(!srcs.length)return Promise.resolve(null);
  return Promise.all(srcs.map(s=>new Promise(res=>{const im=new Image();im.onload=()=>res({im,label:s.label});im.onerror=()=>res(null);im.src=s.src}))).then(all=>{
    const ok=all.filter(Boolean); if(!ok.length)return null;
    const PAD=16,LH=30,W=Math.min(1200,Math.max(...ok.map(x=>x.im.naturalWidth||900)));
    const rows=ok.map(x=>{const w=x.im.naturalWidth||900,h=x.im.naturalHeight||Math.round(w*0.7),s=Math.min(1,W/w);return {im:x.im,label:x.label,w:Math.round(w*s),h:Math.round(h*s)}});
    const c=document.createElement('canvas');c.width=W+PAD*2;c.height=rows.reduce((a,r)=>a+LH+r.h+PAD,PAD);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
    let y=PAD;for(const r of rows){g.fillStyle='#222';g.font='bold 17px system-ui,Segoe UI,sans-serif';g.fillText(r.label,PAD,y+20);y+=LH;g.drawImage(r.im,PAD+Math.round((W-r.w)/2),y,r.w,r.h);y+=r.h+PAD}
    return new Promise(res=>c.toBlob(res,'image/png'));
  });
}
/* copy: text + png in ONE clipboard item where the browser allows it (Chrome, Edge, Safari,
   Android Chrome), built inside the tap so Safari's gesture rule holds — the png is a promise
   because the figures are still being drawn. Anything else falls back to text only, and the
   text then says the picture could not come along. After a combined copy two small buttons
   let you re-copy just the text or just the figure, for an AI that keeps only one of them. */
function copyPrompt(btn,textFor,figP){
  const text=typeof textFor==='function'?textFor:()=>textFor;
  const done=(ok,fig)=>{btn.textContent=ok?(fig?'Copied ✓ prompt + figure — paste into Gemini (or any AI)':'Copied ✓ now paste it into Gemini (or any AI)'):'Copy blocked — select the text below and copy it';
    const nx=btn.nextElementSibling;
    if(!ok&&!(nx&&nx.classList.contains('aitext'))){const ta=document.createElement('textarea');ta.className='aitext';ta.readOnly=true;ta.value=text(false);btn.after(ta);ta.focus();ta.select()}
    if(fig&&!(nx&&nx.classList.contains('aisplit'))){const d=document.createElement('div');d.className='aisplit refsrc';d._btn=btn;
      d.innerHTML='Only one of them landed? <button class="btn ghost askai" data-aitext="1">📋 text only</button> <button class="btn ghost askai" data-aifig="1">🖼 figure only</button>';btn.after(d)}
    setTimeout(()=>btn.textContent=AI_LBL,4000)};
  const textOnly=()=>(navigator.clipboard?navigator.clipboard.writeText(text(false)):Promise.reject())
    .then(()=>done(true,false))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=text(false);ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}
      ta.remove();done(ok,false)});
  if(figP&&navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
    let item=null;
    try{item=new ClipboardItem({'text/plain':new Blob([text(true)],{type:'text/plain'}),'image/png':figP.then(b=>{if(!b)throw new Error('no figure');return b})})}catch(_){}
    if(item){navigator.clipboard.write([item]).then(()=>{btn._aiFig=figP;btn._aiText=text(true);done(true,true)}).catch(textOnly);return}
  }
  textOnly();
}
function aiSplitCopy(s){
  const b=s.closest('.aisplit')._btn, was=s.textContent, flash=t=>{s.textContent=t;setTimeout(()=>s.textContent=was,2500)};
  const p=s.dataset.aitext?navigator.clipboard.writeText(b._aiText):navigator.clipboard.write([new ClipboardItem({'image/png':b._aiFig})]);
  p.then(()=>flash('Copied ✓')).catch(()=>flash('Copy blocked'));
}

$('#helpBtn').onclick=()=>{const H=META.help||{}, nAuth=DATA.questions.filter(q=>q.authored).length, nNm=CLOSED.length-MOCKABLE.length, nNmW=ESSAYS.length-MOCK_ESSAYS.length;
  $('#help').innerHTML=`
  <h2 style="margin-top:0">What is this?</h2>
  <p>${H.what||''}</p>
  <h3>The home page</h3>
  <p>One row per part of the tool; each opens its own screen, and <b>‹ Home</b> or your phone's back button brings you back.
  Every screen leads with one line and keeps the full explanation under <b>ⓘ How this works</b>. The blue <b>Next up</b> card at
  the top is the tool picking for you: a Learn run you stopped partway comes first; otherwise a Learn set from the whole bank,
  your misses first and then the questions you have seen least, each marked the moment you check it. Leaving a mock test with

  <h3>Where the questions come from</h3>
  <p>${DATA.stats.n-nAuth?`${DATA.stats.n-nAuth} questions captured from ${DATA.quizzes.filter(z=>!z.authored).length} Canvas quizzes, answer keys
  extracted from the graded pages — stems, options and keys exactly as set, nothing invented.`:(H.noBank||'This paper has no Canvas quizzes, so nothing here was captured.')}
  ${ESSAYS.some(q=>!q.authored)?`Written questions from Canvas have <b>model answers written by this tool</b> (Canvas publishes none), one mark per step, each naming its source. `:''}
  ${nAuth?(H.authored||`<b>${nAuth} written questions were written by this tool</b> from the lecture decks, because the real paper has a written section and the quizzes have none; each is labelled as the tool’s and names its deck. `):''}
  ${DATA.chains.length?'Warm-up chains are scaffolds built from the decks, not the lecturer’s material. ':''}
  ${nNm?`${nNm} questions are about being a student on this course rather than the subject (attendance, extensions, online-exam rules); they stay under Pick my rep but are never dealt into a mock paper. `:''}
  ${nNmW?(H.noMockWritten||`${nNmW} written questions stay under Pick my rep but are never dealt into a mock paper. `):''}</p>
  ${H.groups?`<p>${H.groups}</p>`:''}
  <h3>Learn mode</h3>
  <p><b>Learn as you go</b> (and the <b>Learn</b> button beside each quiz) marks every question the moment you
  press Check and shows the answer${HAS.ref?', the slide or notes that state it':''}${HAS.vid?' and the matched video':''} right there${HAS.ref||HAS.vid?' — you can open any of them before answering':''}. Check with nothing picked just shows you. Nothing from Learn mode
  goes on the score chart; a wrong or skipped question still joins your misses pile${HAS.ref||HAS.vid?', and a right answer after a peek does not clear it':''}. <b>Sit</b> is the test version: the same questions, nothing shown until the end.</p>
  <p><b>How many at a time</b> (12 · 25 · 50 · 100 · All) sets the size of every dealt Learn set and of the
  per-group sets; All hands you the whole pool, least-seen first, misses first. Under <b>Pick my rep</b>
  tick any quizzes — or a whole group with the chips — and the bar at the bottom
  runs them as one deck, Learn or Sit, every question of every ticked quiz. A Learn run saves itself after every
  Check; stop partway (or lose the tab) and the home page offers to pick it up where you were.</p>
  ${SAQD.length?`<h3>Written answers — the ✍️ row</h3>
  <p>A full model answer is hard to remember, so every written question here also has a <b>short version</b>: the same
  answer, one fact a line, a few words each, grouped under the question's own parts, with a memory hook. The
  <b style="color:var(--warn)">bold</b> words are the ones that earn the marks. <b>Written answers</b> teaches them one question
  at a time: <b>1 Read</b> the short version, <b>2 Fill the gaps</b> (the lines disappear a round at a time until you can say the
  whole answer), <b>3 Write it</b> from memory — the page finds the bold words in what you wrote, you confirm, and 80% locks it.
  The same short lines are what you tick for a written question in Learn mode and in a mock test; the full answer folds
  underneath. Every short line is cut from its full answer, and the build checks each bold word against the step it came
  from. The last-look sheet prints every short answer on one page.</p>`:''}
  ${H.explain?`<h3>Where the explanations come from</h3><p>${H.explain}</p>`:''}
  <h3>Ask an AI — the 🤖 buttons</h3>
  <p>Under every marked question${DATA.focus.length?', and inside every row of the focus list,':''} <b>${AI_LBL}</b> copies a
  ready-made prompt to paste into Gemini (or any AI chat). It asks for one everyday analogy mapped back to the
  real terms, in the lecturer’s words, then a five-question blind quiz with instant feedback — and it carries the
  key${HAS.ref?', the notes':''}${DATA.focus.length?' and the “where it ends” line':''}, so the AI teaches to this paper and stops where it stops.
  If the question has a figure, the copy carries that too, as one picture. This page sends nothing anywhere; you
  paste it yourself. An AI’s quiz checks that the analogy landed. Only the real questions here check that it would
  earn marks — come back and sit them.</p>
  <h3>What’s held out</h3>
  <p>${DATA.held.length?`${DATA.held.length} questions are excluded (image or format did not survive capture) — listed in the repo.`:'Nothing: every captured question shipped.'} ${H.held||''}</p>
  <h3>Your data</h3>
  <p>Scores and misses live in this browser only. Nothing is sent anywhere. Clearing site data wipes them.</p>
  <h3>For whoever maintains this</h3>
  <p>Built by <code>build.mjs</code> from ${DATA.stats.n-nAuth?'<code>bank/questions.json</code> (parsed Canvas captures), ':''}<code>content/</code> and <code>sim.config.mjs</code>.
  Rebuild: <code>node build.mjs</code>. Bank built ${DATA.built}. Multi-answer questions mark all-or-nothing;
  matching and dropdowns mark per part.</p>
  <button class="btn primary wide" onclick="this.closest('dialog').close()">Close</button>`;
  $('#help').showModal()};
document.addEventListener('click',e=>{
  const vf=e.target.closest('.vfull'); if(vf){const c=vf.closest('.vclip');loadVid(c,+c.dataset.at,null);return}
  const fr=e.target.closest('.vframe'); if(fr&&!fr.querySelector('iframe')){const c=fr.closest('.vclip');loadVid(c,+c.dataset.at,+c.dataset.end);return}
  const qa=e.target.closest('.qa'); if(qa){const row=qa.closest('.qr,.lres'),pane=row.querySelector('.qr-pane'),act=qa.dataset.act,open=pane.dataset.act===act&&!pane.hidden;row.querySelectorAll('.qa').forEach(b=>b.classList.toggle('on',b===qa&&!open));if(open){pane.hidden=true;pane.dataset.act='';return}
    const q=SIT.deck.find(x=>x.id===row.dataset.qid);
    /* opening a resource on an unchecked learn-mode question is a peek */
    if(row.classList.contains('lres')&&!SIT.chk[q.id]){SIT.peek[q.id]=true;saveRun()}
    pane.innerHTML=paneHTML(q,act);pane.hidden=false;pane.dataset.act=act;return}
  const ask=e.target.closest('[data-ask],[data-askf]');
  if(ask){
    if(ask.dataset.ask){const q=SIT.deck.find(x=>x.id===ask.dataset.ask);copyPrompt(ask,w=>aiQuestionPrompt(q,w),aiFigures(q).length?aiFigureBlob(q):null)}
    else copyPrompt(ask,aiTopicPrompt(DATA.focus.find(f=>f.id===ask.dataset.askf)),null);
    return}
  const sp=e.target.closest('[data-aitext],[data-aifig]'); if(sp){aiSplitCopy(sp);return}
  if(e.target.id==='shareBtn'){
  const l=S.scores[S.scores.length-1];
  const line=`${META.short} — ${l.got}/${l.tot} (${Math.round(100*l.got/l.tot)}%) · ${l.label} · ${daysLeft()}d to my sitting`;
  navigator.clipboard&&navigator.clipboard.writeText(line);
  e.target.textContent='Copied ✓';setTimeout(()=>e.target.textContent='Copy score line',1500)}});
