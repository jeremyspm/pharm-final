me the five authorised prescribers and the designated prescribers in Aotearoa NZ.</p>","qt":"Name the five authorised prescribers and the designated prescribers in Aotearoa NZ.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["AUTHORISED prescribers: doctors, nurse practitioners, dentists, optometrists, registered midwives.","DESIGNATED prescribers: pharmacist prescribers.","Registered nurse prescribers in community health.","Registered nurse prescribers in diabetes health.","Registered nurse prescribers in primary health and speciality teams.","Designated prescribers complete additional post-graduate training to prescribe."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 4 · Legal & Ethical 2026 slide 7"}},{"id":"q22c3086c1b","quiz":"admin","sys":"admin","pts":4,"q":"What can and cannot a Registered Nurse do in relation to medications?","qh":"<p>What can and cannot a Registered Nurse do in relation to medications?</p>","qt":"What can and cannot a Registered Nurse do in relation to medications?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Key role: administer and monitor medications, assess patients, maintain documentation, ensure safe medication practices, and educate patients, caregivers and whānau.","CANNOT prescribe, unless holding the extra qualification as a designated nurse prescriber.","CANNOT modify prescriptions.","CAN administer under standing orders.","MAY administer drugs with a prescriber's verbal order, e.g. an order over the phone or given in an emergency.","Nurses are personally responsible — legally, morally and ethically — for every medication they administer, no matter who prescribed it."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slides 13–14"}},{"id":"qc961ce266f","quiz":"admin","sys":"admin","pts":5,"q":"List the 8 Rights and the 2 Checks of safe medication administration as taught in this course.","qh":"<p>List the 8 Rights and the 2 Checks of safe medication administration as taught in this course.</p>","qt":"List the 8 Rights and the 2 Checks of safe medication administration as taught in this course.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["1. Right patient.  2. Right medication.  3. Right dose.  4. Right time.  5. Right route.","6. Right to refuse.","7. Right indication.","8. Right documentation.","+ Check expiry.","+ Check allergies."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 23"}},{"id":"q05723a7684","quiz":"admin","sys":"admin","pts":3,"q":"How is patient identity checked before giving a medication, in hospital and in aged care?","qh":"<p>How is patient identity checked before giving a medication, in hospital and in aged care?</p>","qt":"How is patient identity checked before giving a medication, in hospital and in aged care?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Nurses must check the patient's identity before giving medication, using three identifiers.","The NHI is part of the identification process in Aotearoa.","Inpatient setting: check the patient identification band, and ask the patient to state full name and date of birth.","Aged care / residential setting: residents may not wear ID bands, so use reliable alternatives, e.g. photographic verification."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 27"}},{"id":"qe11a4ea2b0","quiz":"admin","sys":"admin","pts":3,"q":"When are the three medication checks performed, and what is the rule about who administers?","qh":"<p>When are the three medication checks performed, and what is the rule about who administers?</p>","qt":"When are the three medication checks performed, and what is the rule about who administers?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Check the label of the medication against the medication chart or prescription.","Check 1 — before preparing.","Check 2 — after preparing.","Check 3 — before replacing the container.","Only administer medications that YOU prepare.","The Medicines Care Guides version: check the unit dose pack or label when getting it from storage; check the contents against the resident's medicine order; re-check the order and medicine prior to administering."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slides 28–29"}},{"id":"qa6fe8a1c17","quiz":"admin","sys":"admin","pts":4,"q":"What must a nurse do about the right dose? Give five points including the rules on cutting and crushing.","qh":"<p>What must a nurse do about the right dose? Give five points including the rules on cutting and crushing.</p>","qt":"What must a nurse do about the right dose? Give five points including the rules on cutting and crushing.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Know the usual dose range for medications being administered; if unsure, check, e.g. the NZ Formulary.","Use medication calculations.","Prepare medications accurately, e.g. syringes, graduated cups.","Cut tablets in half with a tablet cutter — and only if the tablet has a score mark.","Check with a pharmacist before crushing tablets.","Discuss with the prescriber if a more appropriate formulation, e.g. a liquid, is needed."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 30"}},{"id":"q06c334d139","quiz":"admin","sys":"admin","pts":3,"q":"Explain the \"right time\", including the tolerance for regular medications and what governs prn timing.","qh":"<p>Explain the &quot;right time&quot;, including the tolerance for regular medications and what governs prn timing.</p>","qt":"Explain the \"right time\", including the tolerance for regular medications and what governs prn timing.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Medication must be given at the prescribed time AND frequency.","Timing may depend on whether it should be taken with food or on an empty stomach, on therapeutic drug monitoring, and on when the last dose was given.","Some medications are time-critical, e.g. insulin before meals.","Regular medications should be given within 30 minutes of the scheduled time.","prn medications require clinical judgement, e.g. a pain assessment before analgesia.","Always use 24-hour time."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 32"}},{"id":"qa2612673f7","quiz":"admin","sys":"admin","pts":2,"q":"What must the nurse do if no route is documented on the prescription?","qh":"<p>What must the nurse do if no route is documented on the prescription?</p>","qt":"What must the nurse do if no route is documented on the prescription?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The prescriber's order must include a route, and the route must be appropriate for the medication, the patient and the intended therapeutic action.","If no route is documented the nurse must WITHHOLD the medication.","And contact the prescriber for clarification.","If the patient is unable to take the drug by the prescribed route, discuss with the prescriber."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 36"}},{"id":"qa93e8eed60","quiz":"admin","sys":"admin","pts":4,"q":"Describe the nurse's actions when a patient exercises the right to refuse.","qh":"<p>Describe the nurse's actions when a patient exercises the right to refuse.</p>","qt":"Describe the nurse's actions when a patient exercises the right to refuse.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Patients have the right to refuse a medication unless they are being treated under the Mental Health Act.","Explain the consequences to the patient, e.g. an increase in symptoms, or an infection not being treated.","Document the patient's reason for refusal.","Inform those necessary, e.g. the next shift RN, the prescriber and maybe whānau.","Discard refused medications — do not store them."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 39"}},{"id":"qc5348e92ac","quiz":"admin","sys":"admin","pts":2,"q":"What does \"right indication\" require of the administering nurse?","qh":"<p>What does &quot;right indication&quot; require of the administering nurse?</p>","qt":"What does \"right indication\" require of the administering nurse?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The nurse administering is accountable and requires knowledge about the indication for the medication.","Is it being given for the right reason?","This is especially important for prn medications, which require nurse-led assessment and clinical decision making."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 40"}},{"id":"qdfd433ae73","quiz":"admin","sys":"admin","pts":4,"q":"State the rules for right documentation, including prn and errors.","qh":"<p>State the rules for right documentation, including prn and errors.</p>","qt":"State the rules for right documentation, including prn and errors.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Record medication immediately after administration: date, time, dose, who administered.","NEVER document before you have actually administered it to the person.","When a dose is not given — e.g. refused, or the patient is unavailable because they are in a procedure — document this and the reason why.","Documentation for prn medications must include the nursing assessment before administering, and the nursing evaluation after.","Discuss and document any errors."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 41"}},{"id":"q24cab9538a","quiz":"admin","sys":"admin","pts":4,"q":"Explain the expiry date check, including the two situations where an expiry date cannot be relied on.","qh":"<p>Explain the expiry date check, including the two situations where an expiry date cannot be relied on.</p>","qt":"Explain the expiry date check, including the two situations where an expiry date cannot be relied on.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["An expiry date is a marker of the length of time that a medication is effective and safe.","It may be labelled expiry / expiry date / expires / exp, or use by / use before.","If only a month is supplied, e.g. July 2030, the expiry date is the end of that month.","You cannot rely on an expiry date if the medication has been REPACKAGED.","Or if it has NOT been stored as recommended by the manufacturer, e.g. kept dry, or kept in the fridge.","Medications repackaged by a pharmacist may only have a dispensing date — these should be kept no longer than 12 months after that date."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 42"}},{"id":"qeb977f317a","quiz":"admin","sys":"admin","pts":3,"q":"Describe the allergy check, including the two acronyms.","qh":"<p>Describe the allergy check, including the two acronyms.</p>","qt":"Describe the allergy check, including the two acronyms.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Allergies are also called hypersensitivities.","Allergies — or confirmation of no allergies — should be documented in the medication chart.","AND the administering nurse should ask the patient about allergies.","NKA = no known allergies. NKDA = no known drug allergies.","An allergy to any medication would be a contraindication for its use."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slide 43"}},{"id":"qfd1221083d","quiz":"admin","sys":"admin","pts":5,"q":"Where does medication administration fit into the Nursing Process? Give the assessment and evaluation points.","qh":"<p>Where does medication administration fit into the Nursing Process? Give the assessment and evaluation points.</p>","qt":"Where does medication administration fit into the Nursing Process? Give the assessment and evaluation points.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["ASSESSMENT — take a health history: history relevant to pharmacokinetics (e.g. pregnancy, liver disease); what medications or substances they are taking; any allergies.","Also: any challenges with their medications, e.g. memory, or opening containers; cultural needs and preferences; are the indications for the medication there?","DIAGNOSIS — make decisions about the importance of the information gathered, and the implications for the patient.","PLANNING & IMPLEMENTING — use the 8 Rights when preparing and administering; use prn and standing order medications appropriately; advocate (e.g. for a medication review or an easier formulation to swallow); educate about medications.","EVALUATION — assess and document the therapeutic response; any non-therapeutic responses or adverse effects; the patient's knowledge of the medication; and their ability to self-manage it."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slides 18–20"}},{"id":"q730cb79618","quiz":"admin","sys":"admin","pts":5,"q":"What must the National Medication Chart contain under patient identification and prescriber requirements?","qh":"<p>What must the National Medication Chart contain under patient identification and prescriber requirements?</p>","qt":"What must the National Medication Chart contain under patient identification and prescriber requirements?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["PATIENT IDENTIFICATION: full name; NHI number; date of birth; allergies and adverse reactions.","When relevant: body measurements (weight, height, body surface area) and gestational age at birth, e.g. for neonates.","PRESCRIBER REQUIREMENTS: date the order was written; medication name; dose and units.","Route of administration; frequency and/or specific administration times.","The prescriber's signature, linked to the sample signatures."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slides 51 & 53"}},{"id":"q8835b46e2b","quiz":"admin","sys":"admin","pts":4,"q":"Name the five special sections of the National Medication Chart, and the RN's own charting requirements.","qh":"<p>Name the five special sections of the National Medication Chart, and the RN's own charting requirements.</p>","qt":"Name the five special sections of the National Medication Chart, and the RN's own charting requirements.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Once-only medicines.","Verbal orders.","PRN medicines.","Fluid and infusion orders.","Oxygen and medical gases orders.","RN requirements: a signature/initials for each dose given, and non-administration codes when a dose is withheld or not given.","Student nurses also need the \"check\" initial."],"src":"Question and model answer are the tool’s · from Med Admin (1) 2026 slides 54–55"}},{"id":"q82fc977e06","quiz":"educ","sys":"admin","pts":4,"q":"Define a medication error and explain how it differs from an adverse effect. Give four examples.","qh":"<p>Define a medication error and explain how it differs from an adverse effect. Give four examples.</p>","qt":"Define a medication error and explain how it differs from an adverse effect. Give four examples.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A medication error is \"any preventable event that may cause or lead to inappropriate medication use or patient harm while the medication is in control of the healthcare professional, patient or consumer\".","Different from an adverse effect of a drug — a medication error is often harm arising from human action.","Examples: a drug given to a patient with a known allergy; a wrong dosage dispensed from pharmacy.","Errors in the medication calculation; incorrectly deciphering handwriting.","Documentation errors leading to a dose being duplicated.","Most medication errors can be linked to an inconsistency in adhering to the 8 Rights + 2 Checks."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slides 4–5"}},{"id":"q274429240e","quiz":"educ","sys":"admin","pts":5,"q":"Name six ways to prevent medication errors, with the reason for each.","qh":"<p>Name six ways to prevent medication errors, with the reason for each.</p>","qt":"Name six ways to prevent medication errors, with the reason for each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Check labels carefully — medications may have similar names or containers, or similar colours and shapes.","Think: does the dose sound right? Most appropriate doses are one or two tablets, or one single-dose vial.","Check the decimal point — is it 0.1, 1.0 or 10?","Question sudden changes in dose — most dosages are increased gradually so the prescriber can monitor effects.","Learn about new medications before you administer them — unfamiliarity carries a higher risk of error; check the NZ Formulary.","Do not try to decipher illegible writing — when in doubt, ask the prescriber to clarify what they wrote."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 6"}},{"id":"q69e69f0cf6","quiz":"educ","sys":"admin","pts":4,"q":"Describe the five steps for managing and reporting a medication error.","qh":"<p>Describe the five steps for managing and reporting a medication error.</p>","qt":"Describe the five steps for managing and reporting a medication error.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Acknowledge the error immediately.","Report promptly to the appropriate person, e.g. the charge nurse.","Document the error accurately and objectively in the patient notes.","Implement measures to counteract or minimise harm if required, e.g. monitoring.","Complete an incident report."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 7"}},{"id":"qebe3709906","quiz":"educ","sys":"admin","pts":2,"q":"What are the consequences of intentional concealment of a medication error?","qh":"<p>What are the consequences of intentional concealment of a medication error?</p>","qt":"What are the consequences of intentional concealment of a medication error?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Intentional concealment]] is not telling someone when you know you made an error.","The patient may be more at risk of injury, illness or death.","You will face disciplinary action."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 8"}},{"id":"q9fb884d931","quiz":"educ","sys":"admin","pts":3,"q":"Explain nursing liability for medication errors.","qh":"<p>Explain nursing liability for medication errors.</p>","qt":"Explain nursing liability for medication errors.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Prescribers, pharmacists and nurses can all be held responsible when they make an error with medication — wrong dose prescribed, dispensed, or administered.","Nurses are liable for their actions AND omissions.","Nurses are liable for the duties they delegate to others.","Nurses are personally responsible — legally, morally and ethically — for every medication they administer, no matter who prescribed or dispensed it."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 9"}},{"id":"qa0f47b8e6a","quiz":"educ","sys":"admin","pts":4,"q":"Name the three steps to meeting health literacy needs, and state what Step 1 involves and why.","qh":"<p>Name the three steps to meeting health literacy needs, and state what Step 1 involves and why.</p>","qt":"Name the three steps to meeting health literacy needs, and state what Step 1 involves and why.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The ABCs: [[Ask]], [[Build]], [[Check]].","Step 1 — Ask questions to find out what people know.","Why: people bring prior knowledge, beliefs and feelings about medications; we connect new information to what they already know, to help them learn, understand and retain.","Why: we want to avoid repeating information people already know, which makes them disengage.","Think about WHO we ask — health information and skills may be held by an individual, or collectively by whānau and support people.","How: use a conversational friendly tone; ask open-ended questions (\"What have you heard about this medicine?\", \"Please tell me…\"); ask for demonstration; use pictorial resources."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slides 16–19"}},{"id":"q224456a061","quiz":"educ","sys":"admin","pts":4,"q":"What does Step 2, Build, involve?","qh":"<p>What does Step 2, Build, involve?</p>","qt":"What does Step 2, Build, involve?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Connect new information to what people already know, feel and understand.","Use the words and phrases the person used in Step 1.","Pause after giving new information to let people think.","Explain the next steps: expected effects, possible adverse effects, and the follow-up plan.","Explain and repeat essential health terms — people need terms like \"hypertension\" and the generic medication name to talk about their condition.","Avoid medical jargon where possible (say \"sore tummy\" rather than \"gastrointestinal problem\"); if you must use a medical term, explain it in plain language.","Use visual resources: simple step-by-step diagrams with colour; with written resources, explain how the information is organised and highlight, underline or circle key ideas."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slides 21–23"}},{"id":"qbbebb4fed6","quiz":"educ","sys":"admin","pts":4,"q":"What does Step 3, Check, involve — and whose responsibility is clarity?","qh":"<p>What does Step 3, Check, involve — and whose responsibility is clarity?</p>","qt":"What does Step 3, Check, involve — and whose responsibility is clarity?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Check how clear YOUR communication was.","Do not rely on minimal cues like nodding \"yes\"; avoid closed questions like \"Do you understand?\".","Use [[Teach back]] — ask people to explain in their own words what they need to do.","Use prompts if a small piece of information is missing; take responsibility if you were unclear and offer to re-explain.","This is NOT a test of the patient's cognition or intelligence — the responsibility for clear communication lies with you.","If the person does not recall the new information, consider how you delivered it (language, too much information, are they stressed or unwell?) and go back to Step 2 to explain it a different way."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slides 25–29"}},{"id":"q781db8aeca","quiz":"educ","sys":"admin","pts":5,"q":"Name the five principles of Te Tiriti o Waitangi as taught in this course, with their English meanings.","qh":"<p>Name the five principles of Te Tiriti o Waitangi as taught in this course, with their English meanings.</p>","qt":"Name the five principles of Te Tiriti o Waitangi as taught in this course, with their English meanings.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Tino Rangatiratanga]] — Self-determination.","[[Mana Taurite]] — Equity.","[[Whakamarumarutia]] — Active protection.","[[Kōwhiringa]] — Options.","[[Pātuitanga]] — Partnership.","Note: the \"three Ps\" (partnership, participation, protection) were developed in 1986 and are OUTDATED."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 33 (Nursing Council of NZ, 2025)"}},{"id":"qd5ddcfa50d","quiz":"educ","sys":"admin","pts":5,"q":"Give one practical medication-education example for each of the five Te Tiriti principles.","qh":"<p>Give one practical medication-education example for each of the five Te Tiriti principles.</p>","qt":"Give one practical medication-education example for each of the five Te Tiriti principles.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Tino Rangatiratanga — ask \"How do you feel about starting this medication?\"; invite patient and whānau to share preferences before giving instructions; offer time to decide rather than rushing consent.","Mana Taurite — allow more time for education for health consumers who need it; adjust teaching to lived context (cost, transport, literacy, access to pharmacy); engage in advocacy. Equity is unequal distribution for equal outcome.","Whakamarumarutia — acknowledge and respect rongoā Māori or other cultural practices alongside prescribed medication, and advocate for the wider health team to do the same; be aware of body language, tone and power dynamics.","Kōwhiringa — offer alternatives where possible (timing, formulation, lifestyle); explain benefits and risks clearly; include whānau if the patient wishes; provide options for follow-up.","Pātuitanga — ask \"Who would you like to be involved in this conversation?\"; co-create a management plan aligning doses with daily routines; position the patient as a partner, not a passive recipient."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slides 35–39"}},{"id":"q2e5746d4e8","quiz":"educ","sys":"admin","pts":4,"q":"What should a nurse teach a parent or caregiver about giving medicines to children?","qh":"<p>What should a nurse teach a parent or caregiver about giving medicines to children?</p>","qt":"What should a nurse teach a parent or caregiver about giving medicines to children?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Always store medicines out of reach and out of sight.","Always use a proper measuring cup, spoon or syringe.","Check with your pharmacist before crushing or cutting tablets.","Do not force a child to take medication — it can cause vomiting, choking or injury.","Instead try using an ice block to numb the taste buds first, or giving praise and a reward such as a sticker."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 42"}},{"id":"q1fd728f456","quiz":"educ","sys":"admin","pts":4,"q":"How should medication education be adapted for toddlers and children?","qh":"<p>How should medication education be adapted for toddlers and children?</p>","qt":"How should medication education be adapted for toddlers and children?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Use age-appropriate language like \"sore tummy\".","Tell them the medicine will help them feel better.","Use similes or stories, e.g. for an antibiotic: \"this medicine is like soldiers that are going to fight off the germs\".","Do not lie — e.g. an immunisation is going to feel sore; focus on something nice to look forward to afterwards.","NEVER tell them that their medicine is lollies — risk of overdose.","Give simple choices, especially for younger children."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 44"}},{"id":"q540a41f950","quiz":"educ","sys":"admin","pts":4,"q":"How should medication education be adapted for teenagers?","qh":"<p>How should medication education be adapted for teenagers?</p>","qt":"How should medication education be adapted for teenagers?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Explain the mechanism of action in simple terms — why is this medication relevant to the young person (killing germs, replacing missing chemicals, stopping pain signals, slowing inflammation)?","Medicines have benefits and risks, so correct use (route and dose) is essential — e.g. taking extra paracetamol will not make a headache go away faster.","Teach them how to look out for adverse effects, and what to do.","Talk about whether alcohol or drugs affect their medications.","Emphasise that medicines should never be shared with others.","Encourage them to ask questions — they are developing independence."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 45"}},{"id":"qf29c5cd374","quiz":"educ","sys":"admin","pts":4,"q":"How should medication education be adapted for older adults?","qh":"<p>How should medication education be adapted for older adults?</p>","qt":"How should medication education be adapted for older adults?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Educate for self-management and adherence — explain purpose, dose, timing, route, expected benefits and common adverse effects.","Consider sensory needs and cognitive changes: allow extra time, minimise background noise, speak clearly and slowly, check hearing aids and glasses, use familiar names, provide large-print resources.","Plan around fatigue and energy levels.","Involve family/whānau and formal and informal carers — as long as the older adult gives consent.","Uphold dignity and autonomy."],"src":"Question and model answer are the tool’s · from Med Admin (2) 2026 slide 46"}},{"id":"qd2c6acfd76","quiz":"elderly","sys":"life","pts":3,"q":"How is an older person defined in Aotearoa NZ, and what are the sub-categories?","qh":"<p>How is an older person defined in Aotearoa NZ, and what are the sub-categories?</p>","qt":"How is an older person defined in Aotearoa NZ, and what are the sub-categories?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["An older person in Aotearoa NZ is defined as those aged 65 years and over.","\"Young-old\": 65–79 years.","\"Old-old\": 80+ years.","Frail elderly: a person 65 years or older with at least one debilitating condition.","There are wide variations in the rate of ageing between persons and within individuals — and age-related changes are not to be confused with disease-related changes."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 4"}},{"id":"qe8692462c3","quiz":"elderly","sys":"life","pts":4,"q":"Give the figures for medication use in older adults, and the three reasons it is disproportionately high.","qh":"<p>Give the figures for medication use in older adults, and the three reasons it is disproportionately high.</p>","qt":"Give the figures for medication use in older adults, and the three reasons it is disproportionately high.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["People over 65 years constitute about 12% of the population.","But consume 31% of prescribed medications.","Reason 1: increased severity of chronic illness.","Reason 2: presence of multiple pathologies (illnesses).","Reason 3: excessive prescribing.","Older adults take on average 4–5 prescribed medications, PLUS 2 over-the-counter medications."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 8"}},{"id":"qdb8aa70061","quiz":"elderly","sys":"life","pts":3,"q":"Describe the age-related changes to drug ABSORPTION, and state their clinical significance.","qh":"<p>Describe the age-related changes to drug ABSORPTION, and state their clinical significance.</p>","qt":"Describe the age-related changes to drug ABSORPTION, and state their clinical significance.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Slowed gastric emptying → delayed movement of medicines into the intestines.","Reduced GI motility and slower transit time → slower absorption.","Decreased intestinal surface area → reduced absorption efficiency.","These changes can delay overall drug absorption, but are often NOT clinically significant."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 13"}},{"id":"q724187292b","quiz":"elderly","sys":"life","pts":4,"q":"Describe the three age-related changes to drug DISTRIBUTION and the effect of each.","qh":"<p>Describe the three age-related changes to drug DISTRIBUTION and the effect of each.</p>","qt":"Describe the three age-related changes to drug DISTRIBUTION and the effect of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Increased body fat → fat-soluble medications have a LONGER effect (stored in fat and released slowly).","Reduced total body water → water-soluble medications reach a HIGHER concentration, so have a SHORTER and STRONGER effect.","Lower protein binding → more free (active) drug circulating in the body, producing more effect.","Together these alter how drugs are distributed, affecting duration of action and potential toxicity."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 14"}},{"id":"qc255f177d6","quiz":"elderly","sys":"life","pts":3,"q":"Describe the age-related changes to drug METABOLISM.","qh":"<p>Describe the age-related changes to drug METABOLISM.</p>","qt":"Describe the age-related changes to drug METABOLISM.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Slowed liver metabolism and reduced blood flow → affects how drugs are processed, e.g. reduced clearance of drugs with a high extraction ratio via the liver.","Some enzyme reactions are slowed (e.g. oxidation) while some are unaffected (e.g. conjugation).","Common age-related conditions like congestive heart failure further impair liver function, increasing the risk of drug accumulation and toxicity."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 15"}},{"id":"q3768b8c58b","quiz":"elderly","sys":"life","pts":4,"q":"Describe the age-related changes to renal EXCRETION and their consequence.","qh":"<p>Describe the age-related changes to renal EXCRETION and their consequence.</p>","qt":"Describe the age-related changes to renal EXCRETION and their consequence.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Reduced kidney function — nephron loss, reduced blood flow, lower glomerular filtration rate → slower elimination of renally cleared drugs.","Slower renal clearance raises plasma drug levels and extends the half-lives of drugs and active metabolites → increased risk of toxicity.","Heart failure may further reduce renal perfusion, increasing the risk of drug accumulation.","If renal impairment is suspected, prescribers should request renal function tests and use therapeutic drug monitoring to adjust doses safely."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 16"}},{"id":"qed4dd6ee66","quiz":"elderly","sys":"life","pts":3,"q":"Explain the pharmacodynamic changes of ageing.","qh":"<p>Explain the pharmacodynamic changes of ageing.</p>","qt":"Explain the pharmacodynamic changes of ageing.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Ageing can cause either INCREASED or DECREASED drug effects, depending on the drug and receptor involved.","Changes occur because of fewer receptors at the target site,","and/or altered receptor responsiveness — increased or decreased — due to changes in second-messenger signalling.","Down-regulation of receptors may also occur due to prolonged exposure to drugs."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 17"}},{"id":"qa610e2ccae","quiz":"elderly","sys":"life","pts":3,"q":"Name the six most common adverse effects of medications in older adults.","qh":"<p>Name the six most common adverse effects of medications in older adults.</p>","qt":"Name the six most common adverse effects of medications in older adults.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Falls.","[[Orthostatic hypotension]].","Delirium.","Renal failure.","Gastrointestinal bleeding.","Intracranial bleeding."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 20"}},{"id":"qf641adea5d","quiz":"elderly","sys":"life","pts":4,"q":"Give the four reasons adverse drug reactions increase in frequency in older adults.","qh":"<p>Give the four reasons adverse drug reactions increase in frequency in older adults.</p>","qt":"Give the four reasons adverse drug reactions increase in frequency in older adults.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Age-related pharmacokinetic changes — altered distribution of drugs and reduced clearance from the bloodstream.","Age-related pharmacodynamic changes — increased receptor sensitivity to some drugs, especially CNS and cardiovascular medications.","Higher burden of illness and polypharmacy — a greater number of illnesses means more medications and more interactions.","Inappropriate prescribing and poor monitoring — e.g. use of drugs with a narrow therapeutic index."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 21"}},{"id":"q9f5d566a65","quiz":"elderly","sys":"life","pts":3,"q":"What is the Beers Criteria, and give the two examples from the lecture with their adverse effects.","qh":"<p>What is the Beers Criteria, and give the two examples from the lecture with their adverse effects.</p>","qt":"What is the Beers Criteria, and give the two examples from the lecture with their adverse effects.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Beers Criteria]] is a tool widely used to guide prescribers on the drugs that should be avoided or used with caution in older adults.","NSAIDs (e.g. ibuprofen) — avoid chronic use. Adverse effects: gastritis, gastrointestinal bleeding, ulceration.","Digoxin — avoid as first-line therapy for atrial fibrillation. Adverse effects: nausea, vomiting, cardiac dysrhythmias, visual disorders, mental status changes, hallucinations."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 18"}},{"id":"q6dadc5f4c5","quiz":"elderly","sys":"life","pts":3,"q":"Under what two conditions may a medication be crushed, and what three outcomes can crushing cause?","qh":"<p>Under what two conditions may a medication be crushed, and what three outcomes can crushing cause?</p>","qt":"Under what two conditions may a medication be crushed, and what three outcomes can crushing cause?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Crushing may make the medication less effective, ineffective, or dangerous — e.g. if enteric-coated but then rapidly absorbed, it may cause harm.","Medications should only be crushed if a pharmacist advises that this does not compromise the medication,","AND this is in the best interest of the patient."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 22"}},{"id":"q2bec957fbd","quiz":"elderly","sys":"life","pts":3,"q":"Define polypharmacy and list the five risks it raises.","qh":"<p>Define polypharmacy and list the five risks it raises.</p>","qt":"Define polypharmacy and list the five risks it raises.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Polypharmacy]] is the concurrent use of multiple medications, usually 5 or more.","The word has the connotation that too many, or unnecessary, drugs have been prescribed or are being taken.","Increased risk of adverse effects.","Increased risk of drug–drug interactions.","Medication non-adherence.","Falls.","Mortality."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slides 34–36"}},{"id":"q70a1fb55b1","quiz":"elderly","sys":"life","pts":2,"q":"Give the Auckland retirement-village prevalence figures for polypharmacy.","qh":"<p>Give the Auckland retirement-village prevalence figures for polypharmacy.</p>","qt":"Give the Auckland retirement-village prevalence figures for polypharmacy.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A study of 578 retirement village residents from 33 different retirement villages in Auckland, median age 81.6 years.","51.8% met criteria for polypharmacy (≥5 medicines).","5.7% met criteria for [[Hyperpolypharmacy]] (≥10 medicines).","Residents took a mean of 4.8 regular medicines plus 0.7 as-required medicines."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 38 (Hikaka et al., 2024)"}},{"id":"q79e38f3096","quiz":"elderly","sys":"life","pts":4,"q":"Give six reasons polypharmacy occurs.","qh":"<p>Give six reasons polypharmacy occurs.</p>","qt":"Give six reasons polypharmacy occurs.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["More co-morbidities in older adults.","Multiple prescribers — e.g. a GP and an outpatient clinic.","Medications can be advertised in Aotearoa NZ.","Medications are easier to access than lifestyle changes such as exercise.","Medications not being reviewed regularly by a prescriber — can anything be de-prescribed? GP consults are 15 minutes.","Use of duplicate medications (brand names).","Concurrent use of traditional therapies.","The [[Prescribing cascade]]."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 40"}},{"id":"q86016bbd6e","quiz":"elderly","sys":"life","pts":3,"q":"Name five strategies to manage polypharmacy.","qh":"<p>Name five strategies to manage polypharmacy.</p>","qt":"Name five strategies to manage polypharmacy.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Systematic medication review.","Use of validated prescribing tools, e.g. [[Beers Criteria]].","[[Deprescribing]].","Patient-centred decision-making.","Good quality documentation.","Nurses may be involved as part of the multi-disciplinary team and/or as an advocate for polypharmacy review."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 43"}},{"id":"q11e9ab2b9b","quiz":"elderly","sys":"life","pts":3,"q":"Besides older adults, which groups are at risk of polypharmacy?","qh":"<p>Besides older adults, which groups are at risk of polypharmacy?</p>","qt":"Besides older adults, which groups are at risk of polypharmacy?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Elderly adults are the highest-risk group, but polypharmacy is not only an older person's health issue.","Infants and children with complex conditions.","People with disabilities.","People with cognitive impairment.","People with chronic mental health conditions.","Individuals in institutional settings, e.g. prison or a residential facility.","People with language or communication barriers, who are more susceptible to prescribing errors and miscommunication."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 42"}},{"id":"q0a411600b0","quiz":"elderly","sys":"life","pts":3,"q":"Give four pieces of key legislation and guidance covering medication use in aged care.","qh":"<p>Give four pieces of key legislation and guidance covering medication use in aged care.</p>","qt":"Give four pieces of key legislation and guidance covering medication use in aged care.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Old People's Home Regulations (1987).","Health Practitioners Competence Assurance Act (2003).","Code of Health and Disability Services Consumers' Rights.","Medicines Care Guides for Residential Aged Care (2011).","NCNZ Standards of Practice (2025) and Code of Conduct (2012)."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 30"}},{"id":"q8518041e94","quiz":"elderly","sys":"life","pts":3,"q":"Distinguish errors of commission from errors of omission in older people, with two examples of each.","qh":"<p>Distinguish errors of commission from errors of omission in older people, with two examples of each.</p>","qt":"Distinguish errors of commission from errors of omission in older people, with two examples of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Error of commission]] is an error of DOING: taking the wrong dose; taking the wrong medication due to look-alike packaging.","Also: taking medicine incorrectly with food, beverages or other substances; taking medication from someone else or a pet; taking expired medication; storing medication incorrectly.","[[Error of omission]] is an error of NOT DOING: forgetting to take medication; taking too low a dose (sub-therapeutic).","Also: forgetting instructions from the doctor or pharmacist; taking a dose at the wrong time."],"src":"Question and model answer are the tool’s · from Elderly & Polypharmacy 2026 slide 29 (Mira, 2019)"}},{"id":"q5c94d78494","quiz":"lifespan","sys":"life","pts":2,"q":"Why does this session focus on pharmacokinetics rather than pharmacodynamics?","qh":"<p>Why does this session focus on pharmacokinetics rather than pharmacodynamics?</p>","qt":"Why does this session focus on pharmacokinetics rather than pharmacodynamics?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["There are both PK and PD changes in pregnancy, breastfeeding, neonates, infants and children.","Pharmacokinetic changes (what the body does to the drug) in these groups are easier to predict.","Pharmacodynamic changes (what the drug does to the body) in pregnancy and children are much more complex, highly variable, and are poorly defined in textbooks."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 3"}},{"id":"q71c2cdf8b8","quiz":"lifespan","sys":"life","pts":3,"q":"How do medications reach and affect the foetus, and when is the most vulnerable time?","qh":"<p>How do medications reach and affect the foetus, and when is the most vulnerable time?</p>","qt":"How do medications reach and affect the foetus, and when is the most vulnerable time?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Any substance the pregnant person's body absorbs can reach the foetus via maternal circulation.","Medication use should be limited; prescribers consider whether the benefit to the pregnant person outweighs any risk to the foetus.","Even when trying to get pregnant, persons with a uterus should talk to a health professional before taking any medications — including complementary/alternative medicines and chemicals — because effects may occur before pregnancy is recognised.","The most vulnerable time is the first few weeks of development."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 5"}},{"id":"q6d2e6408d2","quiz":"lifespan","sys":"life","pts":5,"q":"Describe the pharmacokinetic changes of pregnancy under all four ADME headings.","qh":"<p>Describe the pharmacokinetic changes of pregnancy under all four ADME headings.</p>","qt":"Describe the pharmacokinetic changes of pregnancy under all four ADME headings.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["ABSORPTION: delayed gastric emptying and reduced gut motility (may increase OR decrease absorption); vomiting can prevent full absorption.","DISTRIBUTION: increased maternal plasma volume dilutes drug concentration; increased body fat stores lipophilic drugs, lowering plasma levels; drugs can diffuse across the placenta to the foetus.","METABOLISM (maternal): hepatic enzyme activity can change — caffeine metabolism is slower, paracetamol metabolism is faster.","METABOLISM (foetal): the foetus has immature enzymes, so slow metabolism and longer drug effects; metabolites may accumulate in amniotic fluid, extending exposure.","EXCRETION: increased renal blood flow increases elimination of renally cleared drugs, which may require higher or more frequent doses."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slides 11–14"}},{"id":"q3367692e8e","quiz":"lifespan","sys":"life","pts":4,"q":"Define a teratogen, state the highest-risk period, and name four sources.","qh":"<p>Define a teratogen, state the highest-risk period, and name four sources.</p>","qt":"Define a teratogen, state the highest-risk period, and name four sources.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["A [[Teratogen]] is any substance or factor that can cause developmental abnormalities in a foetus during pregnancy.","Highest risk is during the first trimester (weeks 0–12).","Caused by prescription drugs, OTC medicines, herbal products, aromatherapy oils, alcohol, nicotine, and drugs of misuse/abuse.","Teratogens can cause physical birth defects, developmental delay, intellectual disability and other health problems."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 8"}},{"id":"q2a6071a61f","quiz":"lifespan","sys":"life","pts":4,"q":"Give the four teratogen examples from the lecture table, with critical period and potential defect.","qh":"<p>Give the four teratogen examples from the lecture table, with critical period and potential defect.</p>","qt":"Give the four teratogen examples from the lecture table, with critical period and potential defect.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Alcohol — <12 weeks: fetal alcohol syndrome, heart defects, CNS abnormalities. >24 weeks: low birthweight, delay in development.","Cocaine — 2nd–3rd trimester: premature labour and delivery, intracranial bleeding.","Isotretinoin (an oral acne medication) — >15 days: hydrocephalus, CNS abnormalities, foetal death.","Tetracycline antibiotics — >20 weeks: stained teeth, bone growth defects."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 10"}},{"id":"q4045717e09","quiz":"lifespan","sys":"life","pts":5,"q":"Describe the effects of alcohol, nicotine, cannabis, caffeine and opioid dependence on the foetus.","qh":"<p>Describe the effects of alcohol, nicotine, cannabis, caffeine and opioid dependence on the foetus.</p>","qt":"Describe the effects of alcohol, nicotine, cannabis, caffeine and opioid dependence on the foetus.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Most drugs of dependence are lipid-soluble, so they cross the placenta and affect foetal development.","Alcohol: depression of the foetal nervous system and developmental abnormalities — risk of Foetal Alcohol Spectrum Disorder.","Nicotine (smoking/vaping): risk of pregnancy loss, preterm birth, low birthweight and jaundice.","Cannabis: does not appear to alter gene expression, but long-term risks are not yet known.","Caffeine: safe in small amounts — note reduced clearance in pregnancy.","Opioid dependence (e.g. heroin, methadone): newborns may experience withdrawal — irritability, tremors and seizures — and need treatment with opioids at birth to manage withdrawal symptoms."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 7"}},{"id":"q54314e0a56","quiz":"lifespan","sys":"life","pts":3,"q":"What is the medication pregnancy category system, and what do A and X mean?","qh":"<p>What is the medication pregnancy category system, and what do A and X mean?</p>","qt":"What is the medication pregnancy category system, and what do A and X mean?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The scale ranges from A (no harm) → B1, B2, B3 → C → D → X (high risk, contraindicated).","[[Pregnancy category A]]: drugs taken by a large number of pregnant or potentially pregnant people without any proven increase in the frequency of malformations or other harmful effects on the foetus — e.g. paracetamol.","[[Pregnancy category X]]: the most dangerous; should not be used if there is any possible or confirmed pregnancy."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 15"}},{"id":"q0dbe98dab0","quiz":"lifespan","sys":"life","pts":3,"q":"On what three factors does medication transfer to a breastfed infant depend, and what is the guiding principle?","qh":"<p>On what three factors does medication transfer to a breastfed infant depend, and what is the guiding principle?</p>","qt":"On what three factors does medication transfer to a breastfed infant depend, and what is the guiding principle?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Most medicines can enter breast milk and may affect the infant.","Maternal drug plasma concentration.","Amount of milk consumed.","Lipid solubility of the drug.","Guiding principle: maintaining maternal health is essential, so necessary medications should NOT automatically be stopped."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 18"}},{"id":"qe5fe8d88c2","quiz":"lifespan","sys":"life","pts":4,"q":"Which drugs concentrate most in breastmilk, what effects can they have on the infant, and what advice applies to alcohol, caffeine, nicotine and methamphetamine?","qh":"<p>Which drugs concentrate most in breastmilk, what effects can they have on the infant, and what advice applies to alcohol, caffeine, nicotine and methamphetamine?</p>","qt":"Which drugs concentrate most in breastmilk, what effects can they have on the infant, and what advice applies to alcohol, caffeine, nicotine and methamphetamine?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Drugs that affect the nervous system and are lipid-soluble (e.g. morphine or codeine) concentrate more in breastmilk.","Effects on the infant may include sedation, and a reduced suckling reflex with poor feeding.","Alcohol: plan feeds to minimise exposure.","Caffeine: safe in moderate amounts.","Nicotine: can increase the risk of [[SUDI]]; nicotine-replacement therapy and working towards smoking cessation are encouraged.","If using some illicit drugs, e.g. methamphetamine, breastfeeding is not recommended."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 19"}},{"id":"q6f48a2fefc","quiz":"lifespan","sys":"life","pts":3,"q":"What three risks does a prescriber balance when a breastfeeding parent needs medication?","qh":"<p>What three risks does a prescriber balance when a breastfeeding parent needs medication?</p>","qt":"What three risks does a prescriber balance when a breastfeeding parent needs medication?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Benefits of continued breastfeeding for the breastfeeding parent and the infant.","Risks of infant medication exposure.","Risks to the breastfeeding parent if essential medications are stopped.","Most medications can be used with caution, but evaluate individually — and seek advice from the prescriber and/or pharmacist."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 21"}},{"id":"q96b09d50bd","quiz":"lifespan","sys":"life","pts":3,"q":"\"Children are just miniature adults.\" True or false — and give four reasons.","qh":"<p>&quot;Children are just miniature adults.&quot; True or false — and give four reasons.</p>","qt":"\"Children are just miniature adults.\" True or false — and give four reasons.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["FALSE. Children are physiologically different to adults and are changing/developing constantly.","Lack of protective mechanisms and barriers.","Poor temperature regulation.","Poor homeostatic mechanisms.","Different body composition — e.g. higher body water (75%), lower fat, lower bone mass."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slides 24–25"}},{"id":"q7b3a7f54fd","quiz":"lifespan","sys":"life","pts":3,"q":"Give the age definitions for preterm, full term, neonate, infant, child and adolescent.","qh":"<p>Give the age definitions for preterm, full term, neonate, infant, child and adolescent.</p>","qt":"Give the age definitions for preterm, full term, neonate, infant, child and adolescent.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Preterm]]: birth at less than 36 weeks gestation.","[[Full term]]: birth at 36 to 40+ weeks gestation.","[[Neonate]]/newborn: less than 4 weeks old.","[[Infant]]: 5 weeks to 1 year.","[[Child]]: 1 to 12 years.","[[Adolescent]]: 12 to 16 years."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 26"}},{"id":"q8a02368012","quiz":"lifespan","sys":"life","pts":4,"q":"Describe the pharmacokinetics of the neonate.","qh":"<p>Describe the pharmacokinetics of the neonate.</p>","qt":"Describe the pharmacokinetics of the neonate.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Physiological immaturity — e.g. thin skin and low stomach acid — can INCREASE drug absorption.","Poor thermoregulation and a higher risk of dehydration.","Immature drug-metabolising enzymes, e.g. reduced metabolism of paracetamol.","Immature kidneys → slower drug clearance → prolonged half-life.","Immature blood–brain barrier → higher CNS toxicity risk."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 27"}},{"id":"q1a882b675d","quiz":"lifespan","sys":"life","pts":4,"q":"Describe the pharmacokinetics of infants and children, including how it changes with age.","qh":"<p>Describe the pharmacokinetics of infants and children, including how it changes with age.</p>","qt":"Describe the pharmacokinetics of infants and children, including how it changes with age.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Before age 12 months, renal excretion is slower, giving a longer half-life of drugs.","By 1 year, absorption, distribution and excretion are similar to adults.","Hepatic metabolism is FASTER until about 10 years, so higher mg/kg doses may be required.","Infants have a higher percentage of body water → increased distribution and lower concentration of water-soluble drugs → may need higher doses.","Paediatric doses are usually weight-based (mg/kg).","Formulation challenges: taste masking, and inability to swallow tablets."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 28"}},{"id":"q5f6b022982","quiz":"lifespan","sys":"life","pts":3,"q":"Why should paracetamol elixir not be given under 3 months or 5 kg without medical advice?","qh":"<p>Why should paracetamol elixir not be given under 3 months or 5 kg without medical advice?</p>","qt":"Why should paracetamol elixir not be given under 3 months or 5 kg without medical advice?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Narrow therapeutic range → higher risk of overdose.","Delayed development of drug-metabolising hepatic enzymes → decreased rate of metabolism.","Which increases blood levels of toxic metabolites → risk of liver injury.","From age 3 months, paracetamol may be given using an mg/kg dose."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 29 (BPAC NZ, 2018)"}},{"id":"q138021219d","quiz":"lifespan","sys":"life","pts":3,"q":"Tama is 3 years old and weighs 17.7 kg. Using a single dose of 15 mg/kg, what is his paracetamol dose in mg — and why is an adult dose unsafe?","qh":"<p>Tama is 3 years old and weighs 17.7 kg. Using a single dose of 15 mg/kg, what is his paracetamol dose in mg — and why is an adult dose unsafe?</p>","qt":"Tama is 3 years old and weighs 17.7 kg. Using a single dose of 15 mg/kg, what is his paracetamol dose in mg — and why is an adult dose unsafe?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Single dose = 15 mg/kg.","15 × 17.7 = 265.5 mg.","From Paracetamol 250 mg/5 mL that is 5.3 mL (the Healthify calculator answer).","A normal adult dose is 1 g / 1000 mg — nearly four times Tama's dose, and not safe for him."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slides 30–31"}},{"id":"qef2b760391","quiz":"lifespan","sys":"life","pts":4,"q":"List seven considerations when administering medications to children.","qh":"<p>List seven considerations when administering medications to children.</p>","qt":"List seven considerations when administering medications to children.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Appropriate dose prescribed.","Developmentally appropriate formulation and route, e.g. an oral elixir.","Informed consent from the legal guardian — plus assent from the child.","Communication and appropriate terminology.","Tools: simple choices, distraction and play.","Honesty.","Secure assistance when needed, e.g. a parent."],"src":"Question and model answer are the tool’s · from Lifespan 2026 slide 32"}},{"id":"qb63f92c76e","quiz":"legal","sys":"law","pts":4,"q":"Define Act, Regulation, Amendment, Policy and Guideline.","qh":"<p>Define Act, Regulation, Amendment, Policy and Guideline.</p>","qt":"Define Act, Regulation, Amendment, Policy and Guideline.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Act (statute)]]: laws made by parliament (government).","[[Regulation]]: made underneath Acts, providing instructions about how the Acts are enforced.","[[Amendment]]: changes (updates) made to an Act or Regulation.","Policies & procedures: enforceable rules or instructions within an organisation, e.g. a Medications Policy.","[[Guideline]]: best practice advice on how to do things."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 3"}},{"id":"q94a244bbf2","quiz":"legal","sys":"law","pts":3,"q":"Name the three key Acts governing medications in Aotearoa NZ, with their accompanying regulations.","qh":"<p>Name the three key Acts governing medications in Aotearoa NZ, with their accompanying regulations.</p>","qt":"Name the three key Acts governing medications in Aotearoa NZ, with their accompanying regulations.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The Medicines Act 1981, and the Medicines Regulations 1984.","The Misuse of Drugs Act 1975, and the Misuse of Drugs Regulations 1977.","The Health Practitioners Competence Assurance Act 2003."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 4"}},{"id":"q81982c1004","quiz":"legal","sys":"law","pts":4,"q":"What does the Medicines Act 1981 cover and do? Give five points.","qh":"<p>What does the Medicines Act 1981 cover and do? Give five points.</p>","qt":"What does the Medicines Act 1981 cover and do? Give five points.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Covers all \"medicines\".","\"Medicines\" includes all products used for therapeutic purposes, including cosmetics and dietary supplements with therapeutic claims.","Classifies medicines — prescription, restricted, pharmacy-only, general sale.","Sets rules for clinical trials, manufacturing, advertising and sale.","Defines who can prescribe."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 6"}},{"id":"q70e651e312","quiz":"legal","sys":"law","pts":4,"q":"What does the Misuse of Drugs Act 1975 do? Give four points, plus the two storage rules.","qh":"<p>What does the Misuse of Drugs Act 1975 do? Give four points, plus the two storage rules.</p>","qt":"What does the Misuse of Drugs Act 1975 do? Give four points, plus the two storage rules.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Defines drug classes — controlled versus uncontrolled.","Regulates prescribing of controlled drugs.","Defines penalties and gives police enforcement powers.","Controls precursor substances.","Medication rooms must be locked when not in use.","Controlled drugs must be kept double-locked."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slides 12–13"}},{"id":"q0a20414b21","quiz":"legal","sys":"law","pts":5,"q":"Describe the three classes of controlled drug with examples.","qh":"<p>Describe the three classes of controlled drug with examples.</p>","qt":"Describe the three classes of controlled drug with examples.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Class A controlled drug]]: high potential for abuse; very high risk of harm; not prescribed for medical use. E.g. heroin, LSD, cocaine, methamphetamine.","[[Class B controlled drug]]: includes drugs of dependence; high risk of harm; restrictions on prescribing and dispensing; must be kept in a double-locked safe. E.g. morphine, methylphenidate (Ritalin).","[[Class C controlled drug]]: lower potential for abuse but may lead to dependence; moderate risk of harm; can be prescribed \"normally\". E.g. codeine, diazepam."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 14"}},{"id":"q0efe2d5f66","quiz":"legal","sys":"law","pts":2,"q":"Define possession and supply under the Misuse of Drugs Act.","qh":"<p>Define possession and supply under the Misuse of Drugs Act.</p>","qt":"Define possession and supply under the Misuse of Drugs Act.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Illegal drugs are unlawful to use, possess or supply unless you have legal authority.","[[Possession]]: having a drug in your control, e.g. in your pocket, bag, car or bedroom. Only certain people may lawfully possess controlled drugs, e.g. health professionals and emergency services.","[[Supply]]: making a drug available to someone else, including giving or selling."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 15"}},{"id":"qaeedcf842d","quiz":"legal","sys":"law","pts":4,"q":"Name the four regulators of NZ medications and their functions.","qh":"<p>Name the four regulators of NZ medications and their functions.</p>","qt":"Name the four regulators of NZ medications and their functions.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Medsafe — regulates medicines and devices for safety and quality.","PHARMAC — funding and subsidy decisions.","Health Research Council (HRC) — clinical trial approval and oversight.","Centre for Adverse Reactions Monitoring (CARM) — monitoring and investigation of adverse reactions."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 10"}},{"id":"qdc08710318","quiz":"legal","sys":"law","pts":4,"q":"What is the purpose of the HPCAA 2003, and what four things does it require of Registered Nurses?","qh":"<p>What is the purpose of the HPCAA 2003, and what four things does it require of Registered Nurses?</p>","qt":"What is the purpose of the HPCAA 2003, and what four things does it require of Registered Nurses?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Purpose: protects public safety, by ensuring practitioners maintain ongoing competence and fitness to practise and work within defined scopes of practice, and by limiting restricted activities to qualified, registered practitioners.","Requires a scope of practice, defined by the regulatory authority (the Nursing Council of New Zealand).","Requires [[Annual Practising Certificate (APC)]]s, renewed annually to legally practise, and searchable on the public register.","Requires clinical and cultural competence, demonstrated through Nursing Council processes (portfolios), with Te Tiriti o Waitangi obligations.","Provides legal accountability through disciplinary pathways — preventing practice outside of scope, preventing unqualified people claiming to be an RN, and allowing RNs to be reviewed, restricted or suspended."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slides 29–32"}},{"id":"qcb69c7b021","quiz":"legal","sys":"law","pts":3,"q":"Name the six pou of the NCNZ Standards of Competence for Registered Nurses.","qh":"<p>Name the six pou of the NCNZ Standards of Competence for Registered Nurses.</p>","qt":"Name the six pou of the NCNZ Standards of Competence for Registered Nurses.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Māori Health.","Cultural Safety.","Whanaungatanga and Communication.","Pūkengatanga and Evidence-Informed Nursing Practice.","Manaakitanga and People-Centred Care.","Rangatiratanga and Leadership."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 38"}},{"id":"qb5ec936270","quiz":"legal","sys":"law","pts":3,"q":"Define cultural safety as the Nursing Council does, and state what \"culture\" includes.","qh":"<p>Define cultural safety as the Nursing Council does, and state what &quot;culture&quot; includes.</p>","qt":"Define cultural safety as the Nursing Council does, and state what \"culture\" includes.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Cultural safety]] is \"the effective nursing practice of a person or family from another culture, and is determined BY THAT PERSON OR FAMILY\".","Culture includes, but is not restricted to: age or generation; gender; sexual orientation; occupation and socioeconomic status.","Ethnic origin or migrant experience; religious or spiritual belief; and disability.","The nurse will have undertaken a process of reflection on their own cultural identity, and will recognise the impact their personal culture has on their professional practice."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 41 (NCNZ, 2011)"}},{"id":"q651557ac0f","quiz":"legal","sys":"law","pts":4,"q":"How does the RN scope of practice relate to medication? Give six points.","qh":"<p>How does the RN scope of practice relate to medication? Give six points.</p>","qt":"How does the RN scope of practice relate to medication? Give six points.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["RNs follow laws and policies to safely administer medications.","Use clinical judgement to assess medication needs and responses.","Communicate effectively with prescribers, pharmacists, patients and whānau.","Uphold Te Tiriti and cultural safety in medication-related activities.","Delegate medication tasks appropriately.","Remain professionally accountable for every medication they give or supervise."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 37"}},{"id":"q51868529c3","quiz":"legal","sys":"law","pts":4,"q":"List the eight principles of the NCNZ Code of Conduct.","qh":"<p>List the eight principles of the NCNZ Code of Conduct.</p>","qt":"List the eight principles of the NCNZ Code of Conduct.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["1. Respect the dignity and individuality of health consumers.","2. Respect the cultural needs and values of health consumers.","3. Work in partnership with health consumers to promote and protect their well-being.","4. Maintain health consumer trust by providing safe and competent care.","5. Respect health consumers' privacy and confidentiality.","6. Work respectfully with colleagues to best meet health consumers' needs.","7. Act with integrity to justify health consumers' trust.","8. Maintain public trust and confidence in the nursing profession."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 54"}},{"id":"q1dc658140d","quiz":"legal","sys":"law","pts":3,"q":"Give a pharmacology example for Code of Conduct principles 2, 4 and 7.","qh":"<p>Give a pharmacology example for Code of Conduct principles 2, 4 and 7.</p>","qt":"Give a pharmacology example for Code of Conduct principles 2, 4 and 7.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Principle 2 (cultural needs and values): checking whether medication ingredients conflict with cultural beliefs, e.g. gelatin capsules.","Principle 4 (safe and competent care): double-checking with another nurse before administering a vaccination you have not given before.","Principle 7 (integrity): report medication errors honestly and immediately."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slides 56, 58 & 61"}},{"id":"q655d26f464","quiz":"legal","sys":"law","pts":5,"q":"Name the seven Māori values in the NZNO Code of Ethics 2019 and summarise each.","qh":"<p>Name the seven Māori values in the NZNO Code of Ethics 2019 and summarise each.</p>","qt":"Name the seven Māori values in the NZNO Code of Ethics 2019 and summarise each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Rangatiratanga (NZNO)]] — Māori have the right to self-determination.","[[Manaakitanga (NZNO)]] — the way we make people feel welcome and ensure their mana is upheld through kindness, respect and care.","[[Tika]] — what is right and proper: truth, correctness, justice, fairness and human rights.","[[Whanaungatanga (NZNO)]] — establishing relationships and recognising whānau connections.","[[Wairuatanga]] — acknowledging that spiritual existence is essential and must be nourished.","[[Kotahitanga]] — unity, togetherness and collective action that encourages all people to contribute.","[[Kaitiakitanga]] — guardianship and stewardship, recognising responsibility to protect land, resources and future generations."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slides 64 & 82"}},{"id":"q3c83a36951","quiz":"legal","sys":"law","pts":5,"q":"Name the nine Western values in the NZNO Code of Ethics 2019 and summarise each.","qh":"<p>Name the nine Western values in the NZNO Code of Ethics 2019 and summarise each.</p>","qt":"Name the nine Western values in the NZNO Code of Ethics 2019 and summarise each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["[[Autonomy]] — the right of individuals or groups to self-determination and informed choices.","[[Beneficence]] — \"doing good\": taking actions that lead to outcomes regarded as worthwhile.","[[Non-maleficence]] — \"causing no harm\": the obligation to avoid, prevent and minimise harm.","[[Justice]] — the responsibility to treat people fairly and equitably.","[[Confidentiality]] — protecting the privacy of written, spoken or observed information.","[[Veracity]] — requires actions and communication to be truthful and honest.","[[Fidelity]] — the obligation to remain faithful to commitments, keep promises and maintain trust.","Guardianship of environment and resources — society's responsibility to respect, protect and sustain the environment and its resources.","Being professional — acting with accountability, integrity and competence."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slides 64 & 83"}},{"id":"q1e89957e40","quiz":"legal","sys":"law","pts":3,"q":"State the three exceptions to veracity, and the three grounds for breaking confidentiality.","qh":"<p>State the three exceptions to veracity, and the three grounds for breaking confidentiality.</p>","qt":"State the three exceptions to veracity, and the three grounds for breaking confidentiality.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["VERACITY exceptions: therapeutic privilege — withholding information to prevent serious harm.","Patient preference — the patient asks not to know their prognosis.","Emergencies — the patient may be unconscious but need life-saving treatment.","CONFIDENTIALITY may be broken where there is risk of harm to self (self-inflicted).","Risk of harm to self (by another).","Risk of harm to another person."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slides 77–78"}},{"id":"qcc48373dfb","quiz":"legal","sys":"law","pts":5,"q":"Summarise the four key documents by type, purpose, authority and enforceability.","qh":"<p>Summarise the four key documents by type, purpose, authority and enforceability.</p>","qt":"Summarise the four key documents by type, purpose, authority and enforceability.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["HPCAA 2003 — legislation regulating health practitioners; provides the legal framework nurses must practise under; authority: New Zealand Parliament; ENFORCEABLE — law for all regulated health professionals.","NCNZ Standards of Competence — regulatory competency standards; define what nurses must be able to do (skills, knowledge, behaviours); authority: Nursing Council of New Zealand; ENFORCEABLE — required to keep an APC.","NCNZ Code of Conduct — regulatory behaviour standards; defines how nurses must behave professionally; authority: Nursing Council of New Zealand; ENFORCEABLE — NCNZ can discipline for breaches.","NZNO Code of Ethics — professional ethical practice guideline; defines how nurses should think and act ethically; authority: New Zealand Nurses Organisation; a GUIDELINE, but expected to be used by all RNs."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 90 (summary table)"}},{"id":"qf16c2594de","quiz":"legal","sys":"law","pts":5,"q":"Summarise the three legal cases against nurses in the lecture, with the issue and the outcome.","qh":"<p>Summarise the three legal cases against nurses in the lecture, with the issue and the outcome.</p>","qt":"Summarise the three legal cases against nurses in the lecture, with the issue and the outcome.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Nurse P (2005): removed two capsules of morphine sulphate (a Class B controlled drug) from a rest home cabinet for his own use, replacing the contents with powdered sucrose. Issues: theft, unlawful possession of a controlled drug. Outcome: convicted of theft, and de-registered.","Nurse H (2006): stole vials of morphine, pethidine and fentanyl from a locked drug safe, removed some contents for his own use and returned the vials to maintain inventory integrity; also took metronidazole and flucloxacillin.","Nurse H outcome: charges of theft of controlled drugs, procuring or possessing other opioids, and possession of prescription medicine without reasonable excuse. Registration cancelled.","Nurse D (2013): gave a patient the wrong medication, did not check it was appropriate nor check pulse or blood pressure, realised 20 minutes later, and took two days to report. The patient died two hours later; the medication \"accelerated the patient's already expected demise\".","Nurse D outcome: guilty of professional misconduct, suspended and fined $12,000; required to complete additional courses in medication administration, pharmacology and professional ethics, six months' supervision when administering medications, and no duty-coordinator or leadership role for six months. She left nursing voluntarily."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slides 22–27"}},{"id":"q2cd1212eef","quiz":"legal","sys":"law","pts":4,"q":"What does medication legislation mean for the Registered Nurse? Give five points.","qh":"<p>What does medication legislation mean for the Registered Nurse? Give five points.</p>","qt":"What does medication legislation mean for the Registered Nurse? Give five points.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Nurses cannot prescribe.","Nurses may administer prescription or restricted medications only with a valid prescription.","Know the relevant legislation and your organisation's policies for storing, handling and administering medications.","Nurses have access to controlled and uncontrolled medicines — misuse of that access is unsafe and illegal.","Always admit mistakes and ask for help if unsure."],"src":"Question and model answer are the tool’s · from Legal & Ethical 2026 slide 20"}},{"id":"qd51b5e77e3","quiz":"devmkt","sys":"law","pts":3,"q":"Give the cost, timescale and attrition figures for drug development.","qh":"<p>Give the cost, timescale and attrition figures for drug development.</p>","qt":"Give the cost, timescale and attrition figures for drug development.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The cost of developing a drug from active compound to marketable drug costs millions of dollars.","The development of a new drug can take 10–20 years.","According to USA statistics, only 5 in 5000 compounds progress to human testing."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 4"}},{"id":"q689f1952c6","quiz":"devmkt","sys":"law","pts":3,"q":"Name the five key phases of the drug development pathway.","qh":"<p>Name the five key phases of the drug development pathway.</p>","qt":"Name the five key phases of the drug development pathway.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Discovery & Development — early laboratory research to identify promising compounds.","[[Preclinical research]] — safety testing in laboratory models (sometimes animals) before human participation.","Clinical Trials — multi-phase studies involving people, to evaluate safety and effectiveness.","Medsafe Review — detailed review of data to approve or reject the drug.","Post-Market Monitoring — Medsafe continues safety surveillance after public release."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 7"}},{"id":"q4e574e4f80","quiz":"devmkt","sys":"law","pts":3,"q":"Which three bodies must a developer apply to before a clinical trial can begin in NZ, and what does each assess?","qh":"<p>Which three bodies must a developer apply to before a clinical trial can begin in NZ, and what does each assess?</p>","qt":"Which three bodies must a developer apply to before a clinical trial can begin in NZ, and what does each assess?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Medsafe — review of preclinical studies, pharmacokinetics and pharmacodynamics, chemical stability and quality.","[[SCOTT]] (Standing Committee on Therapeutic Trials) — assesses the science, safety and appropriateness of the trial design.","[[HDEC]] (Health and
