lopment pathway.</p>","qt":"Name the five key phases of the drug development pathway.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Discovery & Development — early laboratory research to identify promising compounds.","[[Preclinical research]] — safety testing in laboratory models (sometimes animals) before human participation.","Clinical Trials — multi-phase studies involving people, to evaluate safety and effectiveness.","Medsafe Review — detailed review of data to approve or reject the drug.","Post-Market Monitoring — Medsafe continues safety surveillance after public release."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 7"}},{"id":"q4e574e4f80","quiz":"devmkt","sys":"law","pts":3,"q":"Which three bodies must a developer apply to before a clinical trial can begin in NZ, and what does each assess?","qh":"<p>Which three bodies must a developer apply to before a clinical trial can begin in NZ, and what does each assess?</p>","qt":"Which three bodies must a developer apply to before a clinical trial can begin in NZ, and what does each assess?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Medsafe — review of preclinical studies, pharmacokinetics and pharmacodynamics, chemical stability and quality.","[[SCOTT]] (Standing Committee on Therapeutic Trials) — assesses the science, safety and appropriateness of the trial design.","[[HDEC]] (Health and Disability Ethics Committees) — checks for ethical compliance.","Developers must include: animal study data including adverse effects, data from any prior human research, and study plans."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 9"}},{"id":"q75a516a445","quiz":"devmkt","sys":"law","pts":5,"q":"Describe the four phases of clinical research, with participant numbers, duration and progression rate.","qh":"<p>Describe the four phases of clinical research, with participant numbers, duration and progression rate.</p>","qt":"Describe the four phases of clinical research, with participant numbers, duration and progression rate.","imgs":[],"type":"essay","authored":1,"nm":1,"saq":{"steps":["[[Phase 1 trial]] — safety and dosage. 20–100 participants (healthy or with the condition). Several months. ~70% progress.","[[Phase 2 trial]] — efficacy and side effects. Several hundred participants with the condition. Months to 2 years. ~33% progress.","[[Phase 3 trial]] — confirming safety in large patient populations. 300–3000 participants with the condition. 1–4 years. 25–30% progress.","[[Phase 4 trial]] — long-term safety and effectiveness. Several thousand participants with the condition. Years.","The phases act like a funnel process."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slides 10–11"}},{"id":"q5623fc4ea7","quiz":"devmkt","sys":"law","pts":3,"q":"What five things do developers determine when designing a clinical trial?","qh":"<p>What five things do developers determine when designing a clinical trial?</p>","qt":"What five things do developers determine when designing a clinical trial?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Who qualifies — inclusion and exclusion criteria.","Sample size and study duration.","Methods to reduce bias, e.g. control groups.","Dosage and administration methods.","Data collection and analysis plans."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 8"}},{"id":"qeae2073b54","quiz":"devmkt","sys":"law","pts":3,"q":"Name the four key ethical issues in clinical trials, and the central ethical tension.","qh":"<p>Name the four key ethical issues in clinical trials, and the central ethical tension.</p>","qt":"Name the four key ethical issues in clinical trials, and the central ethical tension.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["The key tension: the duty to care for current patients versus the duty to advance science for future patients.","Informed consent.","Use of placebos.","Use of randomisation.","Protection of vulnerable patients.","The history of human research includes serious abuses, e.g. unethical experiments on vulnerable groups."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slides 14–15"}},{"id":"qfd44ddb31d","quiz":"devmkt","sys":"law","pts":4,"q":"What must informed consent for a clinical trial be, and what four things must participants understand?","qh":"<p>What must informed consent for a clinical trial be, and what four things must participants understand?</p>","qt":"What must informed consent for a clinical trial be, and what four things must participants understand?","imgs":[],"type":"essay","authored":1,"nm":1,"saq":{"steps":["Consent must be voluntary, competent, and adequately informed.","Participants must understand the risks and potential benefits.","All study procedures.","That participation is voluntary.","That research is NOT the same as personalised treatment.","Consent can be withdrawn at ANY time."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 16"}},{"id":"q9c91d2b532","quiz":"devmkt","sys":"law","pts":2,"q":"When is placebo use ethically acceptable, and when is it problematic?","qh":"<p>When is placebo use ethically acceptable, and when is it problematic?</p>","qt":"When is placebo use ethically acceptable, and when is it problematic?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Placebos are used with \"control\" participants to demonstrate the effect of a new drug.","Problematic if placebo recipients risk harm or worsening of their condition.","Acceptable when no proven treatment exists.","Or where necessary for methodology, without causing serious harm."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 17"}},{"id":"qe7b0d0c65d","quiz":"devmkt","sys":"law","pts":2,"q":"What ethical issues does randomisation raise?","qh":"<p>What ethical issues does randomisation raise?</p>","qt":"What ethical issues does randomisation raise?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["In randomised controlled trials, participants may be randomised to receive treatment or placebo, to increase the validity of the research.","Randomisation may deny participants the currently best-known treatment.","There needs to be genuine professional justification that one treatment is not known to be better than another."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 18"}},{"id":"q6b531f86ec","quiz":"devmkt","sys":"law","pts":3,"q":"What issues arise in protecting vulnerable patients in trials?","qh":"<p>What issues arise in protecting vulnerable patients in trials?</p>","qt":"What issues arise in protecting vulnerable patients in trials?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Strict regulations in some countries can push trials to low-protection countries.","Over-protection can conflict with autonomy — a patient may want to choose higher personal risk.","Clinical trials may offer to reimburse participants.","Higher concern e.g. in cancer treatment trials, due to patients being in life-threatening situations."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 19"}},{"id":"q26967aa365","quiz":"devmkt","sys":"law","pts":5,"q":"Name the five types of medication advertising seen in NZ, and describe each.","qh":"<p>Name the five types of medication advertising seen in NZ, and describe each.</p>","qt":"Name the five types of medication advertising seen in NZ, and describe each.","imgs":[],"type":"essay","authored":1,"nm":1,"saq":{"steps":["[[Direct-to-consumer advertising]] — promotes specific branded prescription medicines directly to the public, highlighting benefits, uses and risks.","[[Health-seeking advertising]] (disease awareness) — educates audiences about a health condition; may directly or indirectly encourage interest in a related brand.","[[Reminder ad]]s — mention the drug name only, without stating what it treats.","Professional/journal ads — aimed at healthcare professionals, focusing on clinical evidence, trial data and prescribing information.","Digital & social media marketing — uses online channels including influencers, targeted ads and social media content, often emphasising benefits more strongly than risks."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slides 23–28"}},{"id":"qde22877495","quiz":"devmkt","sys":"law","pts":1,"q":"What is unusual about medication advertising in Aotearoa NZ?","qh":"<p>What is unusual about medication advertising in Aotearoa NZ?</p>","qt":"What is unusual about medication advertising in Aotearoa NZ?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Aotearoa NZ is one of only two developed countries in the world that permits medication companies to advertise direct to the consumer.","(The deck's speaker note gives the other country as the USA.)"],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 22"}},{"id":"qfce25f85fc","quiz":"devmkt","sys":"law","pts":4,"q":"What does the Therapeutic and Health Advertising Code require of medicine advertisements? Give six points.","qh":"<p>What does the Therapeutic and Health Advertising Code require of medicine advertisements? Give six points.</p>","qt":"What does the Therapeutic and Health Advertising Code require of medicine advertisements? Give six points.","imgs":[],"type":"essay","authored":1,"nm":1,"saq":{"steps":["Ads must be responsible, truthful, and not misleading.","Claims must be substantiated — have credible evidence.","Ads must not mislead or exaggerate the benefits.","Ads must include key safety information.","Any testimonials must reflect genuine experiences.","Endorsements from celebrities or health professionals cannot imply guaranteed outcomes.","Advertising unapproved medicines (not signed off by Medsafe) is prohibited, even to health professionals."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slides 30–31"}},{"id":"q18b2eafdf4","quiz":"devmkt","sys":"law","pts":3,"q":"How can a health professional accidentally breach advertising law, and what is exempt?","qh":"<p>How can a health professional accidentally breach advertising law, and what is exempt?</p>","qt":"How can a health professional accidentally breach advertising law, and what is exempt?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Advertising is defined broadly — it includes VERBAL advertising — so health professionals need to be careful about recommending or praising a product (brand) over another.","When giving information about a medication brand, health professionals must give information that is factual (evidence-based) and balanced, following the advertising rules.","EXEMPT: giving patients individualised advice about medications, using generic names, for their health condition."],"src":"Question and model answer are the tool’s · from Drug Development & Marketing slide 32"}},{"id":"qec5018c848","quiz":"allergy","sys":"imm","pts":5,"q":"List the six steps of the ASCIA anaphylaxis action plan, in order.","qh":"<p>List the six steps of the ASCIA anaphylaxis action plan, in order.</p>","qt":"List the six steps of the ASCIA anaphylaxis action plan, in order.","imgs":[],"type":"essay","authored":1,"nm":1,"saq":{"steps":["1. Lay the person FLAT — do NOT allow them to stand or walk.","2. Give the adrenaline device.","3. Phone ambulance — 111 (NZ).","4. Phone family/emergency contact.","5. Further adrenaline may be given if no response after 5 minutes.","6. Transfer the person to hospital for at least 4 hours of observation."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"q21efdbdc32","quiz":"allergy","sys":"imm","pts":4,"q":"What are the positioning rules in step 1, including the three exceptions?","qh":"<p>What are the positioning rules in step 1, including the three exceptions?</p>","qt":"What are the positioning rules in step 1, including the three exceptions?","imgs":[],"type":"essay","authored":1,"nm":1,"saq":{"steps":["Lay the person flat — do NOT allow them to stand or walk.","If unconscious or pregnant, place in the recovery position — on the left side if pregnant.","If breathing is difficult, allow them to sit with legs outstretched.","Hold young children flat, not upright."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"qbf83ad336c","quiz":"allergy","sys":"imm","pts":4,"q":"Name the seven signs of anaphylaxis on the ASCIA plan.","qh":"<p>Name the seven signs of anaphylaxis on the ASCIA plan.</p>","qt":"Name the seven signs of anaphylaxis on the ASCIA plan.","imgs":[],"type":"essay","authored":1,"nm":1,"saq":{"steps":["Difficult or noisy breathing.","Swelling or tightness in the throat.","Difficulty talking or hoarse voice.","Wheeze or persistent cough.","Persistent dizziness or collapse.","Pale and floppy (young children).","Swelling of the tongue."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"q0a34242858","quiz":"allergy","sys":"imm","pts":4,"q":"Name the signs and the actions for a mild to moderate allergic reaction.","qh":"<p>Name the signs and the actions for a mild to moderate allergic reaction.</p>","qt":"Name the signs and the actions for a mild to moderate allergic reaction.","imgs":[],"type":"essay","authored":1,"nm":1,"saq":{"steps":["SIGNS: swelling of lips, face and eyes; hives or welts; tingling mouth.","Abdominal pain and vomiting — but these are signs of ANAPHYLAXIS for insect allergy.","ACTIONS: stay with the person, call for help.","Locate the adrenaline (epinephrine) device.","Give an antihistamine; phone family/emergency contact.","Insect allergy — flick out the sting if visible. Tick allergy — seek medical help, or freeze the tick and let it drop off."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"qee7c849284","quiz":"allergy","sys":"imm","pts":3,"q":"A person with known asthma and food allergy has sudden breathing difficulty. What is given first, and why does this matter?","qh":"<p>A person with known asthma and food allergy has sudden breathing difficulty. What is given first, and why does this matter?</p>","qt":"A person with known asthma and food allergy has sudden breathing difficulty. What is given first, and why does this matter?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["ALWAYS give the adrenaline device FIRST, then the asthma reliever puffer.","This applies to someone with known asthma and allergy to food, insects or medication who may have been exposed to the allergen, and has sudden breathing difficulty — including wheeze, persistent cough or hoarse voice.","It matters because anaphylaxis can occur WITHOUT skin symptoms, and mild to moderate reactions may not always occur before anaphylaxis.","The plan's overriding rule: IF IN DOUBT, GIVE THE ADRENALINE DEVICE."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"qeb176440f6","quiz":"allergy","sys":"imm","pts":2,"q":"When should CPR be commenced, and what should be done if a device is accidentally activated?","qh":"<p>When should CPR be commenced, and what should be done if a device is accidentally activated?</p>","qt":"When should CPR be commenced, and what should be done if a device is accidentally activated?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Commence CPR at any time if the person is unresponsive or not breathing normally.","If the device is accidentally injected or activated, use another adrenaline device if available.","If adrenaline is accidentally injected, contact the local poisons information centre."],"src":"Question and model answer are the tool’s · from ASCIA Action Plan for Anaphylaxis (2026), p.1"}},{"id":"qc553ad0325","quiz":"joan-found","sys":"found","pts":2,"q":"What is the meaning of “contraindication”? Give an example.","qh":"<p>What is the meaning of “contraindication”? Give an example.</p>","qt":"What is the meaning of “contraindication”? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a situation in which a medication should NOT be used, because it may be harmful to the person.","Example: a known severe allergy to that medicine — it must not be given; or a medicine known to harm the foetus in a woman who is pregnant."],"src":"Question and model answer are the tool’s · from Joan’s own example of a short answer, Legal & Ethical lecture 16 Sep 2026 [1:05:06]; definition from deck 01 Pharmacology Concepts (1), slide 31"}},{"id":"q46e1fa36b3","quiz":"joan-found","sys":"found","pts":2,"q":"What is a “precaution” in relation to a medication, and how does it differ from a contraindication? Give an example.","qh":"<p>What is a “precaution” in relation to a medication, and how does it differ from a contraindication? Give an example.</p>","qt":"What is a “precaution” in relation to a medication, and how does it differ from a contraindication? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a warning that the medication should be used with special care because of a heightened risk of adverse effects — unlike a contraindication, it MAY still be used, with careful monitoring or a dose adjustment.","Example: reduced kidney function in an older adult — the medicine is still given, but at a lower dose and with monitoring."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (1), slide 31"}},{"id":"q4aa9ab8e04","quiz":"joan-found","sys":"found","pts":2,"q":"Define a medication interaction and give an example.","qh":"<p>Define a medication interaction and give an example.</p>","qt":"Define a medication interaction and give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a reaction in which the effect or activity of a medication is altered by another substance or condition — another medication, a food, a complementary or alternative medicine, or a medical condition.","Example: a herbal remedy or a food that changes how much of a prescribed medicine is absorbed or broken down, making it stronger or weaker — which is why a nurse asks about everything the person takes."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (1), slide 32"}},{"id":"qabbf6d4776","quiz":"joan-found","sys":"found","pts":2,"q":"Distinguish a medicine’s generic name from its brand (proprietary) name, and give an example of why the difference matters.","qh":"<p>Distinguish a medicine’s generic name from its brand (proprietary) name, and give an example of why the difference matters.</p>","qt":"Distinguish a medicine’s generic name from its brand (proprietary) name, and give an example of why the difference matters.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Generic name: the official name of the active ingredient, approved by the regulator — one per medicine. Brand name: chosen and owned by the company that markets it — one medicine may have several.","Why it matters: a patient who knows only brand names may not realise two products are the same medicine and take both; prescribing and teaching by generic name reduces error (and lets the pharmacist dispense the funded brand)."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (1), slides 39–48"}},{"id":"q1670a56e76","quiz":"joan-found","sys":"found","pts":2,"q":"Distinguish the roles of Medsafe and PHARMAC, with an example of a decision each would make.","qh":"<p>Distinguish the roles of Medsafe and PHARMAC, with an example of a decision each would make.</p>","qt":"Distinguish the roles of Medsafe and PHARMAC, with an example of a decision each would make.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Medsafe is the medicines and medical devices safety authority: it REGULATES — e.g. deciding whether a new medicine is safe and of good enough quality to be approved for use in New Zealand.","PHARMAC decides which medicines are FUNDED (subsidised) within a fixed budget — e.g. which brand of a medicine is subsidised."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (1), slides 36–37"}},{"id":"qc2a33fa1bc","quiz":"joan-found","sys":"found","pts":2,"q":"Distinguish a local effect from a systemic effect of a medication, and give an example of each.","qh":"<p>Distinguish a local effect from a systemic effect of a medication, and give an example of each.</p>","qt":"Distinguish a local effect from a systemic effect of a medication, and give an example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Local effect: the effect occurs at the immediate site of administration — e.g. a cream applied to a skin rash, or eye drops.","Systemic effect: the medication must be absorbed into the circulation and distributed to the place where it acts — e.g. a tablet swallowed for a headache."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (2), slides 26–27"}},{"id":"q684eebab1a","quiz":"joan-found","sys":"found","pts":2,"q":"What is an excipient? Give an example and one reason a nurse needs to know about them.","qh":"<p>What is an excipient? Give an example and one reason a nurse needs to know about them.</p>","qt":"What is an excipient? Give an example and one reason a nurse needs to know about them.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: an inert (inactive) ingredient in a formulation — fillers, binders, colours, flavours, stabilisers; the active medicine may be only a small fraction of the tablet.","Example and reason: the gelatine in a capsule shell — it matters to patients who are vegetarian, vegan or avoid it for religious reasons, so the nurse checks (Code of Conduct Principle 2)."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (2), slides 62–63; Joan’s Legal & Ethical lecture 16 Sep 2026 [41:57]"}},{"id":"q59be19d899","quiz":"joan-found","sys":"found","pts":2,"q":"What is an enteric coating, and what is it for? Give an example of what goes wrong if it is ignored.","qh":"<p>What is an enteric coating, and what is it for? Give an example of what goes wrong if it is ignored.</p>","qt":"What is an enteric coating, and what is it for? Give an example of what goes wrong if it is ignored.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a coating that stops a tablet dissolving in the stomach; it dissolves in the intestine, where the medicine is then absorbed — protecting the medicine from stomach acid, protecting the stomach from the medicine, or delaying its action.","Example: crushing an enteric-coated tablet for a patient who cannot swallow destroys the coating, so it is absorbed too fast or irritates the stomach — check with a pharmacist first."],"src":"Question and model answer are the tool’s · from deck 01 Pharmacology Concepts (2), slide 66; deck 06a Elderly & Polypharmacy, slide 22"}},{"id":"q8c5ce44365","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define pharmacokinetics and give an example of one of its four processes.","qh":"<p>Define pharmacokinetics and give an example of one of its four processes.</p>","qt":"Define pharmacokinetics and give an example of one of its four processes.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: “what the body does to the drug” — the passage of a drug through the body by absorption, distribution, metabolism and excretion (ADME).","Example (any one): absorption — a swallowed tablet dissolving and entering the bloodstream from the gut; metabolism — the liver modifying the drug; excretion — the kidneys removing it in urine."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slides 5–7"}},{"id":"q4292f75e63","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define absorption, and give an example of a route that does not require it.","qh":"<p>Define absorption, and give an example of a route that does not require it.</p>","qt":"Define absorption, and give an example of a route that does not require it.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the process by which unchanged drug reaches the bloodstream (systemic circulation) after it has been given and has dissolved.","Example: the intravenous route — the medicine is put directly into the bloodstream, so nothing has to be absorbed and the effect is rapid."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slide 13"}},{"id":"q2540c548d3","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define bioavailability and give an example comparing two routes.","qh":"<p>Define bioavailability and give an example comparing two routes.</p>","qt":"Define bioavailability and give an example comparing two routes.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: how much of the dose actually reaches the bloodstream.","Example: intravenous = 100%; the same medicine by mouth is lower, because some is not absorbed from the gut and some is broken down by the liver before it reaches the circulation."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slide 34"}},{"id":"q7b3f6c44ee","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Explain the hepatic first-pass effect and give an example of its consequence.","qh":"<p>Explain the hepatic first-pass effect and give an example of its consequence.</p>","qt":"Explain the hepatic first-pass effect and give an example of its consequence.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a medicine taken by mouth is absorbed from the gut and passes through the liver before reaching the rest of the body; the liver breaks down part of it, so only a portion of the dose arrives unchanged.","Example: of a 100 mg tablet, 80 mg is absorbed and the liver removes 60 mg — 20 mg reaches the circulation (bioavailability 20%). So oral doses are often larger than IV doses, and sublingual, transdermal or IV routes avoid it."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slides 35–36"}},{"id":"q00b0ae36d3","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"What is plasma protein binding, and why does it matter? Give an example.","qh":"<p>What is plasma protein binding, and why does it matter? Give an example.</p>","qt":"What is plasma protein binding, and why does it matter? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: many drugs bind reversibly to plasma proteins, mainly albumin; only the FREE (unbound) drug can leave the blood and have an effect.","Example: two highly protein-bound medicines compete for the same binding site, or a malnourished older adult has low albumin — more free drug circulates, so the effect and the risk of toxicity increase."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (1), slides 37–38"}},{"id":"q0d1648ccc6","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define drug metabolism and give an example of something that changes it.","qh":"<p>Define drug metabolism and give an example of something that changes it.</p>","qt":"Define drug metabolism and give an example of something that changes it.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the biological transformation of a drug, almost always by enzymes and mainly in the liver, usually into a less active, more water-soluble compound that can be excreted.","Example: an enzyme inhibitor slows metabolism, so drug levels rise and toxicity may follow; an enzyme inducer speeds it up, so a higher dose may be needed — diet, other medicines, alcohol and smoking can all do this. Liver disease also slows metabolism."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 11–12 and 15"}},{"id":"qa471ade3d3","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define half-life and give an example of how it is used.","qh":"<p>Define half-life and give an example of how it is used.</p>","qt":"Define half-life and give an example of how it is used.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the time taken for the plasma concentration of a drug to fall by one half — not how long the whole drug stays in the body.","Example: a medicine with a 6-hour half-life is almost completely cleared after about 5 half-lives (30 hours), and takes about 3–5 half-lives of regular dosing to reach steady state — which is what sets the dosing interval."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 32 and 38; speaker notes to deck 09 slide 20"}},{"id":"q001d7cf710","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define the therapeutic range and give an example of when it is monitored.","qh":"<p>Define the therapeutic range and give an example of when it is monitored.</p>","qt":"Define the therapeutic range and give an example of when it is monitored.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the range of plasma concentration within which a drug produces its desired effect without causing toxicity — above the minimum effective concentration and below the toxic one.","Example: therapeutic drug monitoring for a medicine with a NARROW therapeutic range (such as some anticoagulants) — blood levels are taken at peak and trough to keep the dose safe and effective."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacokinetics (2), slides 36–37"}},{"id":"q3c572899d8","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define pharmacodynamics and give an example.","qh":"<p>Define pharmacodynamics and give an example.</p>","qt":"Define pharmacodynamics and give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: “what the drug does to the body” — the study of drug–target interactions, mechanisms of action and the resulting biological effects.","Example: a medicine binding to a receptor on airway muscle and making it relax, so breathing becomes easier — where it acts, how, and what change in function follows."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacodynamics, slides 4–5"}},{"id":"q80512273ab","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Distinguish an agonist from an antagonist and give an example of each.","qh":"<p>Distinguish an agonist from an antagonist and give an example of each.</p>","qt":"Distinguish an agonist from an antagonist and give an example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Agonist: binds to AND activates a receptor, producing the same effect as the body’s own chemical — the key fits the lock and opens the door. Example: a reliever inhaler that activates beta receptors to open the airways.","Antagonist: binds to the receptor and blocks it without producing a response — the key fits but the door will not open. Example: a beta blocker, which stops the body’s own adrenaline from binding."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacodynamics, slides 23–24"}},{"id":"qce244f5697","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Distinguish potency from efficacy, with an example.","qh":"<p>Distinguish potency from efficacy, with an example.</p>","qt":"Distinguish potency from efficacy, with an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Potency: the amount of drug needed to produce a given effect — a more potent drug gives the same effect at a lower dose. Efficacy: the ability of the drug to produce a response; maximal efficacy is the greatest response possible however much the dose is raised.","Example: two pain relievers may both relieve mild pain (one at 5 mg, one at 500 mg — different potency), but only one may be able to relieve severe pain at any dose (greater efficacy)."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacodynamics, slides 14–16"}},{"id":"q10219ec6ee","quiz":"joan-pkpd","sys":"pkpd","pts":2,"q":"Define an adverse effect and give an example. How does it differ from an adverse drug event?","qh":"<p>Define an adverse effect and give an example. How does it differ from an adverse drug event?</p>","qt":"Define an adverse effect and give an example. How does it differ from an adverse drug event?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a harmful effect suspected to be caused by a medicine or vaccine (the preferred term for “side effect” or adverse drug reaction). Example: nausea (mild) or liver injury or a severe allergy (serious).","An adverse drug EVENT is an injury related to the drug but not always due to the drug itself — e.g. harm from an error in prescribing, dispensing or administration."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacodynamics, slides 43–44"}},{"id":"q7fdc63c15b","quiz":"joan-admin","sys":"admin","pts":2,"q":"Define a medication error and give an example. How does it differ from an adverse effect?","qh":"<p>Define a medication error and give an example. How does it differ from an adverse effect?</p>","qt":"Define a medication error and give an example. How does it differ from an adverse effect?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: any preventable event that may cause or lead to inappropriate medication use or patient harm while the medication is in the control of the health professional, patient or consumer. Example: a dose given twice because the first was not documented, or a medicine given to a patient with a known allergy to it.","Difference: an adverse effect is harm caused by the medicine itself, even when used correctly; a medication error is harm arising from human action — most trace back to a lapse in the rights and checks."],"src":"Question and model answer are the tool’s · from deck 05 Medication Administration & Patient Education (2), slides 4–5"}},{"id":"q4506ebe345","quiz":"joan-admin","sys":"admin","pts":2,"q":"What is the “right to refuse” in medication administration? Give an example of what the nurse does when a patient refuses.","qh":"<p>What is the “right to refuse” in medication administration? Give an example of what the nurse does when a patient refuses.</p>","qt":"What is the “right to refuse” in medication administration? Give an example of what the nurse does when a patient refuses.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a patient has the right to refuse a medication (unless being treated under the Mental Health Act) — an expression of informed consent and autonomy.","Example: the nurse explains the consequences of not taking it, documents the refusal and the reason, informs the prescriber and the next shift, and discards the refused dose rather than storing it — no pressure, no hiding it in food."],"src":"Question and model answer are the tool’s · from deck 05 Medication Administration & Patient Education (1), slide 39"}},{"id":"q0e5047d731","quiz":"joan-admin","sys":"admin","pts":2,"q":"What does the “right indication” require of the nurse giving a medication? Give an example.","qh":"<p>What does the “right indication” require of the nurse giving a medication? Give an example.</p>","qt":"What does the “right indication” require of the nurse giving a medication? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Meaning: the administering nurse is accountable for knowing WHY the medicine is being given — is it being given for the right reason for this patient?","Example: a PRN (as-needed) medicine — the nurse must assess the patient and decide that the reason it was charted for is actually present before giving it."],"src":"Question and model answer are the tool’s · from deck 05 Medication Administration & Patient Education (1), slide 40"}},{"id":"q8dc9e9266c","quiz":"joan-admin","sys":"admin","pts":2,"q":"What is CARM, and who can report to it? Give an example of something that should be reported.","qh":"<p>What is CARM, and who can report to it? Give an example of something that should be reported.</p>","qt":"What is CARM, and who can report to it? Give an example of something that should be reported.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the Centre for Adverse Reactions Monitoring — New Zealand’s database of suspected adverse reactions to medicines and vaccines; health professionals, patients and whānau can all report.","Example: a patient develops a widespread rash and facial swelling after starting a new medicine — it is documented, an alert is placed on their record, and it is reported to CARM."],"src":"Question and model answer are the tool’s · from deck 04 Pharmacodynamics, slide 48; deck 09 Legal & Ethical Aspects, slide 10"}},{"id":"qbe831fca79","quiz":"joan-life","sys":"life","pts":2,"q":"Define polypharmacy and give an example of a risk it raises.","qh":"<p>Define polypharmacy and give an example of a risk it raises.</p>","qt":"Define polypharmacy and give an example of a risk it raises.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the concurrent use of multiple medications, usually five or more — with the connotation that too many, or unnecessary, medicines are being taken.","Example (any one): an older adult on many medicines has a higher risk of drug–drug interactions and adverse effects, of falls, of not taking them as prescribed, and of death."],"src":"Question and model answer are the tool’s · from deck 06a Medication in the Elderly & Polypharmacy, slides 34–36"}},{"id":"q1491b07030","quiz":"joan-life","sys":"life","pts":2,"q":"How is an “older person” defined in Aotearoa New Zealand? Give an example of why age matters when giving medicines.","qh":"<p>How is an “older person” defined in Aotearoa New Zealand? Give an example of why age matters when giving medicines.</p>","qt":"How is an “older person” defined in Aotearoa New Zealand? Give an example of why age matters when giving medicines.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: aged 65 years and over — “young-old” 65–79, “old-old” 80+; frail elderly means 65+ with at least one debilitating condition. People age at very different rates.","Example: kidney function declines with age, so a medicine cleared by the kidneys stays in the body longer and can build up to toxic levels — doses are often lower and adverse effects more common."],"src":"Question and model answer are the tool’s · from deck 06a Medication in the Elderly & Polypharmacy, slides 4 and 16"}},{"id":"q4778ea06cf","quiz":"joan-life","sys":"life","pts":2,"q":"When may a tablet be crushed for a patient who cannot swallow it? Give an example of the harm crushing can cause.","qh":"<p>When may a tablet be crushed for a patient who cannot swallow it? Give an example of the harm crushing can cause.</p>","qt":"When may a tablet be crushed for a patient who cannot swallow it? Give an example of the harm crushing can cause.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Only when a pharmacist has advised that crushing does not compromise the medicine AND it is in the patient’s best interest.","Example: crushing an enteric-coated or modified-release tablet releases the whole dose at once — it may be absorbed too rapidly and cause harm, or become less effective or ineffective."],"src":"Question and model answer are the tool’s · from deck 06a Medication in the Elderly & Polypharmacy, slide 22"}},{"id":"q8a95e80d6e","quiz":"joan-life","sys":"life","pts":2,"q":"Define a teratogen and give an example. When is the risk highest?","qh":"<p>Define a teratogen and give an example. When is the risk highest?</p>","qt":"Define a teratogen and give an example. When is the risk highest?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: any substance or factor that can cause developmental abnormalities in a foetus during pregnancy — physical birth defects, developmental delay, intellectual disability.","Example: some prescription medicines, and also over-the-counter and herbal products, alcohol, nicotine and drugs of misuse. The risk is highest in the first trimester (weeks 0–12), when the organs are forming."],"src":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slide 8"}},{"id":"qa170e24e78","quiz":"joan-life","sys":"life","pts":2,"q":"On what does the transfer of a medicine into breast milk depend, and what is the guiding principle for a breastfeeding parent who needs medication?","qh":"<p>On what does the transfer of a medicine into breast milk depend, and what is the guiding principle for a breastfeeding parent who needs medication?</p>","qt":"On what does the transfer of a medicine into breast milk depend, and what is the guiding principle for a breastfeeding parent who needs medication?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Most medicines can enter breast milk. How much reaches the infant depends on the parent’s plasma concentration of the drug, the amount of milk the infant consumes, and the drug’s lipid solubility.","Principle, with example: maintaining the parent’s health is essential, so a needed medicine should not automatically be stopped — the prescriber weighs the risk to the infant against the risk of not treating the parent."],"src":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slide 18"}},{"id":"qe03adddc9f","quiz":"joan-life","sys":"life","pts":2,"q":"“Children are just small adults.” Explain why this is false for medicines, and give an example.","qh":"<p>“Children are just small adults.” Explain why this is false for medicines, and give an example.</p>","qt":"“Children are just small adults.” Explain why this is false for medicines, and give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Children are physiologically different from adults and constantly developing: different body composition (about 75% water, less fat), immature protective barriers, and poorer temperature and homeostatic control — so they handle medicines differently.","Example: a child’s dose is calculated from body weight (mg per kg), never by simply scaling down an adult dose."],"src":"Question and model answer are the tool’s · from deck 07 Medications in Pregnancy, Lactation and Children, slides 24–25"}},{"id":"qd71245f58b","quiz":"joan-law","sys":"law","pts":2,"q":"What is a controlled drug? Give an example of how controlled drugs are handled differently on a ward.","qh":"<p>What is a controlled drug? Give an example of how controlled drugs are handled differently on a ward.</p>","qt":"What is a controlled drug? Give an example of how controlled drugs are handled differently on a ward.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: a medicine placed under special legal restriction by the Misuse of Drugs Act 1975 because of its potential for abuse, dependence and harm. All controlled drugs are prescribed, but not all prescribed drugs are controlled.","Example: opioids such as morphine (Class B) are kept in a double-locked safe inside a locked medication room with restricted key-holders, and there are penalties for unlawful prescribing, supply or administration."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [00:00–02:39]; deck 09 Legal & Ethical Aspects, slides 12–14"}},{"id":"q836f77608e","quiz":"joan-law","sys":"law","pts":3,"q":"Describe the three classes of controlled drug under the Misuse of Drugs Act 1975, with an example of each.","qh":"<p>Describe the three classes of controlled drug under the Misuse of Drugs Act 1975, with an example of each.</p>","qt":"Describe the three classes of controlled drug under the Misuse of Drugs Act 1975, with an example of each.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Class A — high potential for abuse, very high risk of harm, never prescribed for medical use (e.g. heroin, methamphetamine).","Class B — drugs of dependence with a high risk of harm; prescribing and dispensing are restricted and they must be kept in a double-locked safe (e.g. morphine and the other opioids).","Class C — lower potential for abuse but may lead to dependence, moderate risk of harm; prescribed “normally” but still locked away (e.g. codeine, diazepam)."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [00:00–04:46]; deck 09 Legal & Ethical Aspects, slide 14"}},{"id":"q47b76abc2e","quiz":"joan-law","sys":"law","pts":3,"q":"Name the four legal classifications of medicines under the Medicines Act 1981 and give an example of one of them.","qh":"<p>Name the four legal classifications of medicines under the Medicines Act 1981 and give an example of one of them.</p>","qt":"Name the four legal classifications of medicines under the Medicines Act 1981 and give an example of one of them.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Prescription medicine — supplied or administered only on a prescription from an authorised or designated prescriber, or by standing order. Restricted (pharmacist-only) medicine — sold only by a pharmacist, who must explain it to the patient.","Pharmacy-only medicine — sold in a pharmacy or hospital. General sale medicine — anything not classified above, sold from any retail outlet.","Example (any one): an antibiotic such as amoxicillin is prescription-only; a simple pain reliever such as paracetamol is general sale and can be bought in a supermarket."],"src":"Question and model answer are the tool’s · from Joan’s Escape Room answer sheet (file 08), Lock 1 Task 1; deck 09 Legal & Ethical Aspects, slides 6 and 8"}},{"id":"qccff980d75","quiz":"joan-law","sys":"law","pts":3,"q":"Distinguish an Act, a regulation and a policy, and give an example of each that governs medicines.","qh":"<p>Distinguish an Act, a regulation and a policy, and give an example of each that governs medicines.</p>","qt":"Distinguish an Act, a regulation and a policy, and give an example of each that governs medicines.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["An Act (statute) is a law made by Parliament — e.g. the Medicines Act 1981 or the Misuse of Drugs Act 1975.","Regulations are made underneath an Act and give the instructions for how it is enforced — e.g. the Medicines Regulations 1984.","A policy or procedure is an enforceable rule within one organisation — e.g. a hospital’s medication policy; organisations differ, so a nurse must know their own. (A guideline is best-practice advice.)"],"src":"Question and model answer are the tool’s · from deck 09 Legal & Ethical Aspects, slides 3–6; Joan’s Legal & Ethical lecture, 16 Sep 2026, [09:10–10:14]"}},{"id":"q667426a57f","quiz":"joan-law","sys":"law","pts":2,"q":"Explain why a nurse may not give a prescription medicine on their own judgement, and give an example.","qh":"<p>Explain why a nurse may not give a prescription medicine on their own judgement, and give an example.</p>","qt":"Explain why a nurse may not give a prescription medicine on their own judgement, and give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Principle: prescription medicines may only be administered according to the direction of an authorised prescriber or a standing order — the dose, frequency and route. Nurses do not prescribe, and must also understand the therapeutic purpose of what they give.","Example: a patient’s blood glucose is 18 mmol/L — the nurse cannot decide to give insulin; without a prescription or standing order they must contact the prescriber. (Even telling a colleague to “take a couple of paracetamol” is prescribing.)"],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [04:46] and [09:10]; deck 09 Legal & Ethical Aspects, slides 16 and 20"}},{"id":"q041dd129cb","quiz":"joan-law","sys":"law","pts":2,"q":"What does it mean to “insist on proper prescribing”? Give an example.","qh":"<p>What does it mean to “insist on proper prescribing”? Give an example.</p>","qt":"What does it mean to “insist on proper prescribing”? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Meaning: the nurse has a legal duty to question an incomplete or unclear prescription and to ask the prescriber clarifying questions before administering — not to guess, and not to withhold.","Example: the route is missing, the allergies have not been checked, or the handwriting cannot be read — go back to the prescriber. In Joan’s story a nurse who “didn’t want to bother the doctor” left a patient in severe pain for a whole shift."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [04:46–08:03]; deck 09 Legal & Ethical Aspects, slide 16"}},{"id":"q1161ffe197","quiz":"joan-law","sys":"law","pts":2,"q":"What is the purpose of the Health Practitioners Competence Assurance Act 2003? Give one thing it requires of a registered nurse.","qh":"<p>What is the purpose of the Health Practitioners Competence Assurance Act 2003? Give one thing it requires of a registered nurse.</p>","qt":"What is the purpose of the Health Practitioners Competence Assurance Act 2003? Give one thing it requires of a registered nurse.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Purpose: to protect public safety, by ensuring regulated health practitioners are competent and fit to practise and work within a defined scope of practice.","Requirement (any one): work within the scope set by the Nursing Council · renew an annual practising certificate (APC) · show continuing clinical and cultural competence · be accountable through disciplinary pathways. (Healthcare assistants are not regulated under it.)"],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [21:02–22:08]; deck 09 Legal & Ethical Aspects, slides 29–31"}},{"id":"q3d3fe77921","quiz":"joan-law","sys":"law","pts":2,"q":"Define “scope of practice” and give an example of something outside a registered nurse’s scope.","qh":"<p>Define “scope of practice” and give an example of something outside a registered nurse’s scope.</p>","qt":"Define “scope of practice” and give an example of something outside a registered nurse’s scope.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the area of practice a practitioner is educated, competent and authorised to work in, set by the regulatory authority (the Nursing Council) under the HPCAA — about demonstrated competence, not a list of tasks.","Example (any one): prescribing a medicine (unless a designated RN prescriber) · dispensing — moving stock from bulk into a labelled patient pack is the pharmacist’s role · practising in a specialty the nurse has no training or experience in."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [09:10] and [26:29]; deck 09 Legal & Ethical Aspects, slides 7, 20 and 30–31"}},{"id":"q0fefdfbe7f","quiz":"joan-law","sys":"law","pts":2,"q":"What does “fitness to practise” mean? Give an example of something that could put it in doubt.","qh":"<p>What does “fitness to practise” mean? Give an example of something that could put it in doubt.</p>","qt":"What does “fitness to practise” mean? Give an example of something that could put it in doubt.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Meaning: the nurse has the necessary qualifications and training, is healthy enough that no untreated physical or mental condition impedes their work, and is of good conduct and standing — it is not physical fitness.","Example (any one): an arrest for possessing an illegal drug · sustained dishonesty or cheating as a student (the head of school signs a fitness-to-practise declaration before registration) · an open conduct investigation."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [13:06] and [26:29–28:19]"}},{"id":"q0361a8d2b6","quiz":"joan-law","sys":"law","pts":3,"q":"Distinguish the Nursing Council of New Zealand from the New Zealand Nurses Organisation, and name the document each publishes about how nurses should act.","qh":"<p>Distinguish the Nursing Council of New Zealand from the New Zealand Nurses Organisation, and name the document each publishes about how nurses should act.</p>","qt":"Distinguish the Nursing Council of New Zealand from the New Zealand Nurses Organisation, and name the document each publishes about how nurses should act.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["NCNZ is the regulatory authority set up under the HPCAA: it registers, audits, disciplines and can de-register nurses. Its document is the Code of Conduct (behaviour) — enforceable, a breach can cost your registration.","NZNO is a union with voluntary membership that represents and supports nurses. Its document is the Code of Ethics (2019) — a guideline, but expected of all RNs.","Example of the difference: a nurse who hides a medication error can be disciplined by NCNZ; NZNO is who that nurse might turn to for advice and representation."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [47:13–50:52]; deck 09 Legal & Ethical Aspects, slide 90"}},{"id":"q6963f90283","quiz":"joan-ethics","sys":"law","pts":3,"q":"What does “pou” mean in the Nursing Council’s Standards of Competence? Name the six pou and give an example of one being compromised.","qh":"<p>What does “pou” mean in the Nursing Council’s Standards of Competence? Name the six pou and give an example of one being compromised.</p>","qt":"What does “pou” mean in the Nursing Council’s Standards of Competence? Name the six pou and give an example of one being compromised.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Meaning: a pou is a pillar or post — the six pou hold up competent practice the way posts hold up a building.","The six: Māori Health · Cultural Safety · Whanaungatanga & Communication · Pūkengatanga & Evidence-Informed Practice · Manaakitanga & People-Centred Care · Rangatiratanga & Leadership.","Example: a nurse who knows a patient has taken his own opioid but does not tell the prescriber, document it or hand it over has compromised Whanaungatanga & Communication (and, by not escalating, Rangatiratanga & Leadership)."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [35:25–36:59]; deck 09 Legal & Ethical Aspects, slide 38; Joan’s Escape Room answer sheet (file 08), Lock 2"}},{"id":"q90fbbba655","quiz":"joan-ethics","sys":"law","pts":2,"q":"State one principle of the Nursing Council Code of Conduct and give an example of how it applies to medicines.","qh":"<p>State one principle of the Nursing Council Code of Conduct and give an example of how it applies to medicines.</p>","qt":"State one principle of the Nursing Council Code of Conduct and give an example of how it applies to medicines.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Any one of the eight, e.g. Principle 7 — act with integrity to justify health consumers’ trust; Principle 4 — maintain trust by providing safe and competent care; Principle 2 — respect cultural needs and values.","Matching example: P7 — report a medication error honestly and immediately, including someone else’s. P4 — double-check with another nurse before giving a medicine you have not given before. P2 — check the excipients, e.g. a gelatine capsule for a vegetarian or for religious reasons."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [36:59–47:13]; deck 09 Legal & Ethical Aspects, slides 55–62"}},{"id":"qe0b90dee19","quiz":"joan-ethics","sys":"law","pts":2,"q":"Explain the nurse’s duty of privacy and confidentiality, and give an example involving a telephone enquiry.","qh":"<p>Explain the nurse’s duty of privacy and confidentiality, and give an example involving a telephone enquiry.</p>","qt":"Explain the nurse’s duty of privacy and confidentiality, and give an example involving a telephone enquiry.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Duty (Code of Conduct Principle 5): protect personal health information and use or share it only for appropriate professional purposes — it is the patient’s information, and notes are accessed only by those caring for that patient.","Example: a caller says she is a patient’s wife and asks how he is. The answer is “sorry, we can’t give patient information over the phone” — you cannot verify who is calling; offer to ring back or have the patient ring them."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [43:04–45:07]; deck 09 Legal & Ethical Aspects, slide 59"}},{"id":"qdeca78b3a6","quiz":"joan-ethics","sys":"law","pts":2,"q":"Define veracity and give an example of it in medication practice.","qh":"<p>Define veracity and give an example of it in medication practice.</p>","qt":"Define veracity and give an example of it in medication practice.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: truthfulness — being honest and giving accurate, clear and transparent information in all professional interactions (a Western value in the NZNO Code of Ethics).","Example: telling a patient honestly what a medicine is for and what its common side effects are; or owning up to a medication error straight away. (Exceptions: therapeutic privilege, a patient who asks not to know, an emergency.)"],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [50:52]; deck 09 Legal & Ethical Aspects, slide 78"}},{"id":"qfb56a27bba","quiz":"joan-ethics","sys":"law","pts":2,"q":"Define autonomy and give an example relating to medicines.","qh":"<p>Define autonomy and give an example relating to medicines.</p>","qt":"Define autonomy and give an example relating to medicines.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: the right of choice — informed, voluntary consent without coercion, with appropriate disclosure and checking of understanding, including the right to refuse and to withdraw at any time.","Example: a competent patient declines a prescribed medicine. The nurse checks they understand the consequences, respects the refusal, documents it and informs the prescriber — they do not pressure or hide it in food."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [56:25]; deck 09 Legal & Ethical Aspects, slide 73"}},{"id":"q49d8eba9ee","quiz":"joan-ethics","sys":"law","pts":2,"q":"Define rangatiratanga as a value in the NZNO Code of Ethics and give a bedside example.","qh":"<p>Define rangatiratanga as a value in the NZNO Code of Ethics and give a bedside example.</p>","qt":"Define rangatiratanga as a value in the NZNO Code of Ethics and give a bedside example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: self-determination — people’s right to make decisions about their own bodies and health, including refusing care entirely. Māori want self-determination over their own health, and so does every other patient.","Example: supporting a patient and whānau to decide for themselves whether to start a treatment — giving the information, then respecting the choice even when the nurse would have chosen differently."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [52:46]; deck 09 Legal & Ethical Aspects, slide 64"}},{"id":"q2d4e4ca430","quiz":"joan-ethics","sys":"law","pts":3,"q":"Define beneficence and non-maleficence, and give an example where beneficence conflicts with another value.","qh":"<p>Define beneficence and non-maleficence, and give an example where beneficence conflicts with another value.</p>","qt":"Define beneficence and non-maleficence, and give an example where beneficence conflicts with another value.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Beneficence: do good — acting in ways that promote the person’s wellbeing and improve outcomes.","Non-maleficence: do no harm — avoiding physical, emotional or cultural harm and minimising risk.","Conflict example: a medicine would do the patient good (beneficence) but the patient refuses it (autonomy) — the nurse may not override a competent refusal."],"src":"Question and model answer are the tool’s · from deck 09 Legal & Ethical Aspects, slides 74–75"}},{"id":"q1fb5136966","quiz":"joan-ethics","sys":"law","pts":2,"q":"What does PRN mean, and why did Joan call it an ethical problem? Give an example.","qh":"<p>What does PRN mean, and why did Joan call it an ethical problem? Give an example.</p>","qt":"What does PRN mean, and why did Joan call it an ethical problem? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Meaning: pro re nata — “as necessary”. It is an ethical problem because it is subjective: as necessary to whom, and who decides? The nurse’s judgement and beliefs shape whether the patient receives the medicine.","Example: pain relief charted PRN — whether the patient gets it can depend on whether the nurse believes their pain, because unlike a fever there is no machine that measures it; fear of causing addiction also makes some nurses give less."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [1:01:28–1:03:38]; deck 09 Legal & Ethical Aspects, slide 89"}},{"id":"qba72713fbf","quiz":"joan-ethics","sys":"law","pts":2,"q":"Why is concealing a medication error treated more seriously than the error itself? Give an example.","qh":"<p>Why is concealing a medication error treated more seriously than the error itself? Give an example.</p>","qt":"Why is concealing a medication error treated more seriously than the error itself? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Reason: an error is usually accidental and is managed in-house — report it, reflect, be supervised for a time. Concealment is deliberate: it denies the patient monitoring and treatment, and it breaches integrity (Code of Conduct Principle 7), so it becomes professional misconduct.","Example: “Nurse D” gave the wrong medicine, realised 20 minutes later, did nothing and took two days to report; the patient died. She was found guilty of professional misconduct, suspended, fined and supervised."],"src":"Question and model answer are the tool’s · from Joan’s Legal & Ethical lecture, 16 Sep 2026, [15:52–21:02] and [24:42]; deck 09 Legal & Ethical Aspects, slides 26–27"}},{"id":"qa6e200b7c0","quiz":"joan-ethics","sys":"law","pts":2,"q":"Explain why patients should be taught the generic name of their medicines, and give an example of the harm when they are not.","qh":"<p>Explain why patients should be taught the generic name of their medicines, and give an example of the harm when they are not.</p>","qt":"Explain why patients should be taught the generic name of their medicines, and give an example of the harm when they are not.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Reason: one medicine may be sold under several brand names; a patient who knows only the brand cannot tell staff what they already take, so the same medicine can be given twice. Medication education is a nursing responsibility.","Example: in Joan’s escape-room scenario a man who knew his opioid only by its brand name said he had never had morphine, and was given a second dose from the hospital chart — he became drowsy, confused and nauseated."],"src":"Question and model answer are the tool’s · from Joan’s Escape Room answer sheet (file 08), Lock 1, Task 3"}},{"id":"q0dc4be8381","quiz":"joan-devmkt","sys":"law","pts":2,"q":"Define bioequivalence and explain why it matters, with an example.","qh":"<p>Define bioequivalence and explain why it matters, with an example.</p>","qt":"Define bioequivalence and explain why it matters, with an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: two formulations are bioequivalent when the same active ingredient reaches the bloodstream at the same rate and to the same extent.","Why and example: a generic may only be substituted for a brand if it is bioequivalent, so the patient gets the same therapeutic effect — e.g. a pharmacy dispensing the funded generic instead of the original brand of the same medicine."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 6 (“Remember bioequivalence!”); defined in deck 01 Pharmacology Concepts (1), slides 49–50"}},{"id":"q575dd313ed","quiz":"joan-devmkt","sys":"law","pts":2,"q":"Why is bringing a new medicine to market so slow and expensive? Give an example of an event that made regulators this cautious.","qh":"<p>Why is bringing a new medicine to market so slow and expensive? Give an example of an event that made regulators this cautious.</p>","qt":"Why is bringing a new medicine to market so slow and expensive? Give an example of an event that made regulators this cautious.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Reason: before marketing, developers must prove the medicine works, that its side effects are known and that it is safe in humans — it takes about 10–20 years and millions of dollars, and only about 5 in 5,000 compounds ever reach human testing.","Example: thalidomide — marketed to pregnant women in the 1950s, it caused birth defects and years of litigation. “We don’t want another thalidomide tragedy.”"],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 4 and 6; Joan’s Legal & Ethical lecture, 16 Sep 2026, [1:00:26]"}},{"id":"q36a333accd","quiz":"joan-devmkt","sys":"law","pts":3,"q":"Name the five key phases of the drug development pathway in order.","qh":"<p>Name the five key phases of the drug development pathway in order.</p>","qt":"Name the five key phases of the drug development pathway in order.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Discovery and development (laboratory research to find promising compounds) → preclinical research (safety testing in laboratory models, sometimes animals, before any human).","Clinical trials (multi-phase studies in people, for safety and effectiveness) → Medsafe review (the data are reviewed and the medicine approved or rejected).","Post-market monitoring — surveillance continues after release; e.g. adverse reactions reported to CARM."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 7"}},{"id":"qc19da002cf","quiz":"joan-devmkt","sys":"law","pts":2,"q":"Describe the purpose of Phase 1 of a clinical trial and give an example of what is measured.","qh":"<p>Describe the purpose of Phase 1 of a clinical trial and give an example of what is measured.</p>","qt":"Describe the purpose of Phase 1 of a clinical trial and give an example of what is measured.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Purpose: safety and dosage — tested in a small group of 20–100 people, who may be healthy volunteers, over several months.","Example: recording adverse effects at gradually increasing doses to find the dose range that is tolerated."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 10"}},{"id":"q60950bdc90","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What is the difference between Phase 2 and Phase 3 of a clinical trial?","qh":"<p>What is the difference between Phase 2 and Phase 3 of a clinical trial?</p>","qt":"What is the difference between Phase 2 and Phase 3 of a clinical trial?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Phase 2 tests efficacy and side effects in several hundred people who have the condition, over months to two years (about a third progress).","Phase 3 confirms safety and effectiveness in a large population — 300 to 3,000 people with the condition over one to four years — before the company applies for approval."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 10–11"}},{"id":"qeb2b33db6b","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What is Phase 4 of clinical research, and why does it exist? Give an example.","qh":"<p>What is Phase 4 of clinical research, and why does it exist? Give an example.</p>","qt":"What is Phase 4 of clinical research, and why does it exist? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: post-market monitoring of long-term safety and effectiveness in several thousand patients over years, after Medsafe approval.","Why and example: rare or delayed adverse effects only show up at population scale — e.g. a medicine withdrawn after post-market reports revealed a serious risk the trials were too small to see."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 11–12"}},{"id":"q95bf11d309","quiz":"joan-devmkt","sys":"law","pts":3,"q":"Name the three bodies that must approve a clinical trial before it can begin in New Zealand and state what each checks.","qh":"<p>Name the three bodies that must approve a clinical trial before it can begin in New Zealand and state what each checks.</p>","qt":"Name the three bodies that must approve a clinical trial before it can begin in New Zealand and state what each checks.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Medsafe — the preclinical studies, pharmacokinetics and pharmacodynamics, chemical stability and quality.","SCOTT (Standing Committee on Therapeutic Trials) — the science: the safety and appropriateness of the trial design.","HDEC (Health and Disability Ethics Committees) — ethical compliance."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 9"}},{"id":"qc8f6f7287f","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What is Medsafe’s role after a medicine has been approved? Give an example.","qh":"<p>What is Medsafe’s role after a medicine has been approved? Give an example.</p>","qt":"What is Medsafe’s role after a medicine has been approved? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Role: ongoing post-market surveillance — tracking adverse events and updating the medicine’s risk and benefit information; the company must also keep monitoring.","Example: adverse reactions reported by nurses, doctors or patients to the Centre for Adverse Reactions Monitoring (CARM) feed this surveillance."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 12; deck 09 Legal & Ethical Aspects, slide 10"}},{"id":"q0fceb4726d","quiz":"joan-devmkt","sys":"law","pts":2,"q":"Define informed consent in a clinical trial and give one thing a participant must understand.","qh":"<p>Define informed consent in a clinical trial and give one thing a participant must understand.</p>","qt":"Define informed consent in a clinical trial and give one thing a participant must understand.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: consent that is voluntary, competent and adequately informed — and that can be withdrawn at any time.","Must understand (any one): the risks and potential benefits · every procedure involved · that taking part is voluntary · that research is not the same as personalised treatment — the trial answers a question, it does not treat them individually."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 16"}},{"id":"q3a7e86a4de","quiz":"joan-devmkt","sys":"law","pts":2,"q":"When is the use of a placebo ethically acceptable in a clinical trial? Give an example.","qh":"<p>When is the use of a placebo ethically acceptable in a clinical trial? Give an example.</p>","qt":"When is the use of a placebo ethically acceptable in a clinical trial? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Acceptable when no proven treatment exists for the condition, or when it is methodologically necessary and does not cause serious harm; problematic if those receiving placebo risk harm or a worsening condition.","Example: a placebo arm in a trial for a condition that has no effective therapy yet — nobody is denied a treatment that works."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 17"}},{"id":"q0adf3ed798","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What ethical problem does randomisation raise in a clinical trial?","qh":"<p>What ethical problem does randomisation raise in a clinical trial?</p>","qt":"What ethical problem does randomisation raise in a clinical trial?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Randomising participants to a placebo or comparator increases validity, but it may deny a participant the best currently known treatment.","It is only justified where there is genuine professional uncertainty that one treatment is better than the other — e.g. a new medicine compared with standard care when nobody yet knows which is better."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 18"}},{"id":"q8a08f04f0e","quiz":"joan-devmkt","sys":"law","pts":2,"q":"Give one reason vulnerable patients need special protection in clinical trials, and one way protection can go too far.","qh":"<p>Give one reason vulnerable patients need special protection in clinical trials, and one way protection can go too far.</p>","qt":"Give one reason vulnerable patients need special protection in clinical trials, and one way protection can go too far.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Reason: the history of human research includes serious abuses, and strict rules in some countries push trials into countries with weaker protections.","Too far: over-protection can conflict with autonomy — e.g. a patient with a life-threatening cancer may reasonably want to accept a higher-risk trial and be denied the choice."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 14 and 19"}},{"id":"q156716d6b7","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What is direct-to-consumer advertising of medicines, and why is Aotearoa New Zealand unusual?","qh":"<p>What is direct-to-consumer advertising of medicines, and why is Aotearoa New Zealand unusual?</p>","qt":"What is direct-to-consumer advertising of medicines, and why is Aotearoa New Zealand unusual?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: advertising that promotes a specific branded prescription medicine to the public — its benefits, uses and risks.","New Zealand is one of only two developed countries that permit it; most restrict prescription-medicine advertising to health professionals, because consumer advertising can drive demand for medicines that may not be appropriate."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 22 and 24"}},{"id":"q9b63c4c950","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What is a “reminder” advertisement for a medicine? Give an example.","qh":"<p>What is a “reminder” advertisement for a medicine? Give an example.</p>","qt":"What is a “reminder” advertisement for a medicine? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: an advertisement that mentions the medicine’s name only, without saying what it treats — it keeps the brand familiar rather than informing.","Example: a billboard or pen showing only a branded product name and logo."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 26"}},{"id":"q2b47c7b7c4","quiz":"joan-devmkt","sys":"law","pts":2,"q":"What is health-seeking (disease awareness) advertising, and why can it be a concern?","qh":"<p>What is health-seeking (disease awareness) advertising, and why can it be a concern?</p>","qt":"What is health-seeking (disease awareness) advertising, and why can it be a concern?","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: advertising that educates the public about a health condition rather than a product — e.g. “talk to your doctor about…” campaigns.","Concern: it may directly or indirectly steer people towards a related brand, driving demand for a medicine while looking like neutral health education."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 25"}},{"id":"q9340c50a63","quiz":"joan-devmkt","sys":"law","pts":2,"q":"Name two requirements of the Therapeutic and Health Advertising Code, and say who administers it.","qh":"<p>Name two requirements of the Therapeutic and Health Advertising Code, and say who administers it.</p>","qt":"Name two requirements of the Therapeutic and Health Advertising Code, and say who administers it.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Administered by the Advertising Standards Authority; anyone can complain and complaints are investigated.","Requirements (any two): claims substantiated with credible evidence · truthful, not misleading, no exaggerated benefits · key safety information included · testimonials genuine · endorsements must not imply guaranteed outcomes · unapproved medicines may not be advertised, even to health professionals."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slides 29–31"}},{"id":"qa9ba8498ff","quiz":"joan-devmkt","sys":"law","pts":2,"q":"How can a nurse accidentally advertise a medicine, and how is it avoided? Give an example.","qh":"<p>How can a nurse accidentally advertise a medicine, and how is it avoided? Give an example.</p>","qt":"How can a nurse accidentally advertise a medicine, and how is it avoided? Give an example.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["How: advertising is defined broadly and includes what is said aloud — recommending or praising one BRAND over another to a patient can count as advertising.","Avoid it by talking in generic names and giving factual, balanced, evidence-based information; individualised advice using generic names is exempt. Example: naming the generic pain reliever rather than saying a particular brand “is the best”."],"src":"Question and model answer are the tool’s · from deck 13 Drug Development & Marketing, slide 32"}},{"id":"q629d061d0b","quiz":"joan-cam","sys":"cam","pts":2,"q":"Define rongoā Māori and give an example of each of its three parts.","qh":"<p>Define rongoā Māori and give an example of each of its three parts.</p>","qt":"Define rongoā Māori and give an example of each of its three parts.","imgs":[],"type":"essay","authored":1,"saq":{"steps":["Definition: traditional Māori healing, with a strong spiritual element in how remedies are prepared — a Māori model of health rather than only a set of remedies.","Its three parts: mirimiri (massage / body work), karakia (prayer) and rongoā rākau (native plant-based remedies, e.g. a leaf prepared as a balm, oil or tonic)."],"src":"Question and model answer are the tool’s · from the Rongoā 2026 deck, slides 9 and 12 (quoting the NZNO Guidelines for Nurses on the Administration of Medicines 2024, s 7.7)"}},{"id":"q312cfb3cd1","quiz":"joan-cam","sys":"cam","pts":2,"q":"Who is responsible for a traditional Māori medicine, and what should a nurse do when whānau ask for advice about using one?","qh":"<p>Who is responsible for a traditional Māori medicine, and what should a nurse do when whānau ask for advic
